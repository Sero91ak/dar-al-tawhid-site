# DĀR AL TAWḤĪD KIDS — eigener Worker, getrennt von Dar Test
name = "dar-al-tawhid-kids"
main = "cloudflare/test-app-worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "."

[ai]
binding = "AI"

# Spezifischer als /test/*: Kids kann von normalen Test-Deploys nicht mehr überschrieben werden.
[[routes]]
pattern = "dar-al-tawhid.de/test/kids"
zone_name = "dar-al-tawhid.de"

[[routes]]
pattern = "dar-al-tawhid.de/test/kids/*"
zone_name = "dar-al-tawhid.de"
