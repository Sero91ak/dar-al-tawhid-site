<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DAR AL TAWḤĪD App</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050914">
  <style>
    :root{color-scheme:dark;--bg:#050914;--ink:#f6edda;--muted:#b9ad98;--gold:#d1ad61;--line:rgba(209,173,97,.28)}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,rgba(209,173,97,.12),transparent 22rem),linear-gradient(145deg,#050914,#071b18);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.box{width:min(100% - 32px,520px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;text-align:center}.brand{font-weight:850;letter-spacing:.055em;font-size:26px}.muted{color:var(--muted);margin:12px 0 22px}.button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:999px;border:1px solid var(--line);color:var(--gold);text-decoration:none;background:rgba(209,173,97,.07)}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">DAR AL TAWḤĪD</div>
    <p class="muted">Web-App wird geöffnet …</p>
    <a class="button" href="/test/?env=app&source=web-app#home">App jetzt öffnen</a>
  </main>
  <script>
    // Vorläufige sichere App-Route: App-Oberfläche bleibt getrennt von der klassischen Webseite.
    // Die produktive App-Hülle soll später vollständig nach /app migriert werden.
    window.location.replace('/test/?env=app&source=web-app#home');
  </script>
</body>
</html>
