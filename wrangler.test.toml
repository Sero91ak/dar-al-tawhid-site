# Cloudflare Worker — Dar Test App (isoliert von Besucher-App)
# workers.dev: https://dar-al-tawhid-test.sero91ak.workers.dev/test/
# Keine Custom-Domain auf dar-al-tawhid.de. Öffentliches /kids läuft über dar-al-tawhid-site.
# Worker dar-al-tawhid-kids darf keine Route auf /kids oder /kids/* haben.

name = "dar-al-tawhid-test"
main = "cloudflare/test-app-worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Keine Custom-Domain-Routen (leere Liste, nicht unter [assets]).
routes = []

# Workers Builds nur bei Test-/Kids-Dateien, nicht bei jedem Repo-Commit.
[build]
# Test worker is published only by its explicit GitHub workflow.
watch_paths = [".cloudflare-test-manual-only/**"]

[assets]
directory = "."
binding = "ASSETS"

# Workers AI: Qurʾān-Wortprüfung im Kids-Lernmodus.
[ai]
binding = "AI"

# Majlis al-ʿIlm Gemini test pilot. Edge-local limit, not a global spending cap.
# The Gemini bridge fails closed if either binding is missing.
[[ratelimits]]
name = "ILM_GEMINI_GLOBAL_LIMIT"
namespace_id = "921301"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "ILM_GEMINI_USER_LIMIT"
namespace_id = "921302"
[ratelimits.simple]
limit = 3
period = 60

# Groq Free-Tier source-only composition. The API key and Free-Plan
# confirmation MUST be stored as Cloudflare secrets. Both guards fail closed.
# Neither a secret alone nor these minute limits can guarantee an account
# remains free if it is later manually upgraded to a paid subscription.
[[ratelimits]]
name = "ILM_GROQ_GLOBAL_LIMIT"
namespace_id = "921305"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "ILM_GROQ_USER_LIMIT"
namespace_id = "921306"
[ratelimits.simple]
limit = 2
period = 60

[vars]
PREVIEW_GATE_USER = "Dawud"
PREVIEW_GATE_PASS = "Malik20"

