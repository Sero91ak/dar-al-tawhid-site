# Cloudflare Worker — Dar Test App (isoliert von Besucher-App)
# workers.dev: https://dar-al-tawhid-test.sero91ak.workers.dev/test/
# Öffentlich:  https://dar-al-tawhid.de/test/  (Route hat Vorrang vor Live-Custom-Domain)

name = "dar-al-tawhid-test"
main = "cloudflare/test-app-worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Workers Builds nur bei Test-/Kids-Dateien, nicht bei jedem Repo-Commit.
[build]
watch_paths = [
  "test/**",
  "wrangler.test.toml",
  "cloudflare/test-app-worker.js"
]

[assets]
directory = "."
binding = "ASSETS"

# Öffentliche Test-/Kids-URL: Route vor der Besucher-Custom-Domain.
# Kein run_worker_first — sonst 1101-Schleife mit Assets/_redirects.
[[routes]]
pattern = "dar-al-tawhid.de/test"
zone_name = "dar-al-tawhid.de"

[[routes]]
pattern = "dar-al-tawhid.de/test/*"
zone_name = "dar-al-tawhid.de"
