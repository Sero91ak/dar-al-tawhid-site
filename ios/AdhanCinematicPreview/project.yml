name: DarAdhanCinematicPreview
options:
  bundleIdPrefix: de.daraltawhid
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    SUPPORTS_MACCATALYST: NO
targets:
  DarAdhanCinematicPreview:
    type: application
    platform: iOS
    sources:
      - path: PreviewApp.swift
      - path: ../DarAlTawhid/DarAlTawhid/DarAdhanCinematicDemo.swift
      - path: ../DarAlTawhid/Shared/CinematicMedia
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.daraltawhid.cinematicpreview
        INFOPLIST_KEY_CFBundleDisplayName: "DĀR Adhān Cinematic"
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
