<!doctype html><html lang="de"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><meta name="referrer" content="same-origin"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8faf9"><title>DĀR AL TAWḤĪD · Mehr · Vorschau B</title><style>
:root{color-scheme:light;--bg:#f8faf9;--ink:#171b1b;--muted:#606a68;--gold:#b6a16d;--line:#eae6dc;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(155deg,#f9fcfa,#f7f8f6 60%,#fcfaf6);min-height:100dvh}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ac9455;outline-offset:2px}
.wrap{max-width:710px;min-height:100dvh;margin:0 auto;padding:calc(15px + env(safe-area-inset-top,0px)) 16px calc(92px + var(--safe))}
.titleTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.kicker{font:700 11px Georgia,serif;letter-spacing:.25em;color:#746a50}.previewBadge{font-size:9px;color:#a08a53;text-align:right;letter-spacing:.04em;font-weight:700}
h1{font:400 38px/1.06 Georgia,serif;margin:6px 0}.intro{font-size:12px;line-height:1.5;color:#596662;margin:2px 0 12px}.hair{height:1px;background:#e3ddcf;margin:10px 0 13px}
.panelButton{border:1px solid #e1d8c2;border-radius:17px;background:linear-gradient(120deg,#fff,#f9f8f3);width:100%;display:flex;align-items:center;min-height:56px;padding:9px 13px;gap:11px;text-align:left;box-shadow:0 4px 16px #1730250c}
.panelIcon{font-size:22px;color:#615a4e;flex:none}.panelText{flex:1;min-width:0}.panelText b{display:block;font-size:14px}.panelText small{display:block;font-size:10px;font-weight:750;color:#8a754b;margin-top:3px}.chevron{color:#998c73;font-size:19px}
.accountBody{border:1px solid #e9dec2;border-top:0;border-radius:0 0 17px 17px;background:#fff;padding:13px;margin:-5px 0 10px;box-shadow:0 4px 18px #15271f0b}.accountBody p{font-size:12px;line-height:1.5;margin:5px 0 10px}.accountBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.accountBtns button{border:1px solid #ede5d5;border-radius:22px;padding:9px;background:#fafaf8;color:#282a26;font-weight:750;font-size:13px}
.searchArea{display:flex;align-items:center;gap:9px;margin:12px 0 11px;min-height:46px;border-radius:16px;padding:0 14px;border:1px solid #eae5d8;background:#fff;box-shadow:0 6px 20px #143c2d0a}.searchArea span{font-size:18px;color:#8a7a58}.searchArea input{background:transparent;min-width:0;width:100%;border:0;outline:0;color:#1b2b25;font-size:14px}.searchArea input::placeholder{color:#8c938f}
.catbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 15px}.catbar button{border:1px solid #e7e7dd;border-radius:14px;background:#fff;min-height:62px;padding:5px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;box-shadow:0 3px 12px #1a302408}.catbar button.active{border-color:#c6b47e;background:#f8f3e8;box-shadow:inset 0 0 0 1px #e8dab7}.catbar img{width:31px;height:31px;object-fit:contain}.catbar span{font-size:clamp(8px,2.4vw,11px);font-weight:760;white-space:nowrap;letter-spacing:-.02em}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 11px}.sechead h2{font-size:19px;letter-spacing:-.03em;margin:0;line-height:1.15}.sechead span{font-size:11px;color:#8a816d;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.entry{border:1px solid #ece9e1;background:#fff;border-radius:17px;box-shadow:0 6px 18px #1f302310;text-align:left;color:var(--ink);display:flex;align-items:center;padding:10px 11px;gap:9px;min-width:0;min-height:77px}.entry img{width:41px;height:41px;object-fit:contain;flex:none}.entry strong{font-size:12px;line-height:1.16;display:block;overflow-wrap:anywhere}.entry .description{color:#5a6661;font-size:11px;line-height:1.25;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.entry .badge{font-size:9px;color:#ae924c;border:1px solid #e9ddbf;background:#fbf8ef;border-radius:20px;padding:1px 5px;margin-left:4px;display:inline-block;font-weight:700}
body.mode-a .entry{min-height:92px;align-items:flex-start;display:block}.mode-a .entry img{float:left;margin-right:8px;width:38px;height:38px}.mode-a .entry .description{clear:both;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mode-b .tiles{grid-template-columns:1fr;gap:10px}.mode-b .entry{min-height:91px;padding:12px 14px}.mode-b .entry strong{font-size:16px}.mode-b .entry .description{font-size:12px;margin-top:6px}.mode-b .entry img{width:48px;height:48px}.mode-b .entry .badge{font-size:10px}.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px auto 0}.pagination button{border:1px solid #e4dbc6;border-radius:12px;background:#fff;width:46px;height:39px;font-size:23px;color:#6c5c36}.pagination button:disabled{opacity:.3}.pagination span{font-size:12px;color:#675f4e;font-weight:650}.footnote{font-size:11px;color:#77807d;text-align:center;margin:12px 0;line-height:1.5}
.social{margin:14px 0 0;text-align:center;background:#fff;border:1px solid #eae6dd;border-radius:17px;padding:16px 10px}.social .brand{font:18px Georgia,serif;letter-spacing:.12em}.social p{margin:6px 0 13px;font-size:12px}.socialLinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.socialLinks button{border:1px solid #d7d6c9;border-radius:11px;background:#fff;padding:9px 3px;font-size:11px;font-weight:700;color:#20342e}.signature{font:italic 17px Georgia,serif;color:#b99c5d;margin-top:12px}
.tabbar{position:fixed;bottom:calc(6px + var(--safe));left:50%;transform:translateX(-50%);width:min(calc(100% - 22px),690px);height:73px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px;border:1px solid #e8dfc9;border-radius:34px;background:#f9f7f1ef;box-shadow:0 6px 28px #2633261c;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:30}.tabbar button{border:0;border-radius:30px;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:780;gap:0;color:#13202a}.tabbar button.active{background:#f2eadd}.tabbar img{width:34px;height:34px;object-fit:contain}
.backdrop{position:fixed;inset:0;background:#0e201c88;display:none;align-items:flex-end;justify-content:center;z-index:60}.backdrop.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;width:min(100%,590px);padding:18px 20px calc(22px + var(--safe));box-shadow:0 -10px 50px #06241a33}.grip{height:4px;width:43px;border-radius:15px;background:#d6d6cd;margin:0 auto 16px}.sheethead{display:flex;align-items:center;gap:12px}.sheethead img{width:58px;height:58px;object-fit:contain}.sheethead h3{margin:0;font-size:21px;line-height:1.2}.sheet p{font-size:15px;line-height:1.5;color:#44534b;margin:15px 0 18px}.sheet .close{width:100%;background:#1c322b;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700}
.empty{font-size:14px;border-radius:16px;background:white;border:1px dashed #d8d2c4;padding:25px;text-align:center;color:#63736b}
@media(max-width:360px){.mode-a .entry{min-height:90px;padding:9px 7px}.catbar span{font-size:8px}.wrap{padding-left:11px;padding-right:11px}}
</style></head><body class="mode-b">
<main class="wrap">
  <div style="margin-bottom:12px;font-size:12px"><a href="./" style="color:#806e47;text-decoration:none">‹ Zur Variantenübersicht</a></div><header><div class="titleTop"><div class="kicker">MEHR</div><div id="previewName" class="previewBadge"></div></div><h1>Mehr</h1><p class="intro">Funktionen geordnet nach Lernen, Alltag, Werkzeugen und Einstellungen</p></header>
  <div class="hair"></div>
  <button class="panelButton" type="button" id="accountToggle" aria-expanded="false"><span class="panelIcon">♙</span><span class="panelText"><b>Konto & Synchronisierung</b><small>NICHT ANGEMELDET</small></span><span class="chevron">⌄</span></button>
  <div class="accountBody" id="accountContent" hidden><p>Die App bleibt auch ohne Konto nutzbar.</p><p>Daten auf allen Geräten sichern.</p><div class="accountBtns"><button data-account="Anmelden">Anmelden</button><button data-account="Registrieren">Registrieren</button></div></div>
  <label class="searchArea"><span>⌕</span><input id="search" type="search" placeholder="Funktion suchen…" aria-label="Funktion suchen"></label>
  <nav id="groups" class="catbar" aria-label="Bereiche auswählen"></nav>

</main>
<nav class="tabbar" aria-label="App-Navigation"><button data-bottom="Start"><img src="/assets/dar-3d-icons/home.png" alt="">Start</button><button data-bottom="Quiz"><img src="/assets/dar-3d-icons/quiz.png" alt="">Quiz</button><button data-bottom="Beiträge"><img src="/assets/dar-3d-icons/quran.png" alt="">Beiträge</button><button data-bottom="Qurʾān"><img src="/assets/dar-3d-icons/quran.png" alt="">Qurʾān</button><button class="active" data-bottom="Mehr"><img src="/assets/dar-3d-icons/more.png" alt="">Mehr</button></nav>
<div class="backdrop" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Funktionsdetails"><div class="grip"></div><div id="modalBody"></div><button type="button" class="close" id="closeModal">Schließen</button></div></div>
<script>
const ITEMS=[["wissen","Die Propheten","الأنبياء · Qurʾān · Sunnah · authentische Überlieferungen","prophets","Wissen"],["wissen","Frauen im Islam","Fiqh, Ṣaḥābiyyāt, Tābiʿiyyāt, Ehe, Familie und Wissen.","frauen",""],["wissen","Feed","Neue Bildbeiträge und ruhige Empfehlungen.","quran","Aktuell"],["wissen","Din-Quiz","Strukturierte Wissensprüfung nach Themen und Stufen.","quiz","Lernen"],["wissen","Beiträge","472 Aussagen mit Quellen.","posts",""],["wissen","Qurʾān","114 Suren mit Arabisch und Lautschrift.","quran","Empfohlen"],["wissen","DĀR AL TAWḤĪD Bibliothek","PDFs, Bücher und Themenhefte von DĀR AL TAWḤĪD.","library","Neu"],["wissen","Qurʾān Player","Hören, mitlesen, Āyah für Āyah.","quran",""],["wissen","Duʿāʾ","114 bekannte Duʿāʾ nach Themen.","dua",""],["wissen","Gelehrte","120 Namen und Zuordnungen.","scholars",""],["wissen","Quellenbibliothek","95 geprüfte Werke und zitierte Gelehrte.","library","Geprüft"],["wissen","Hadith-Bibliothek","Hadith-Werke mit Büchern, Kapiteln und Filterung.","hadith","Hadith"],["alltag","Gebetszeiten","Zeiten, Standort, Qibla und Erinnerungen.","prayer","Praktisch"],["alltag","Benachrichtigungen","Gebete, Duʿāʾ und Empfehlungen einzeln einstellen.","bell",""],["alltag","Jumuʿah","Freitagsgebet und Erinnerung.","jummah",""],["alltag","Qibla","Live-Richtung zur Kaʿbah.","compass",""],["alltag","Islamischer Kalender","Hijrī-Termine und wichtige Tage.","calendar",""],["werkzeuge","Zakāt-Rechner","Berechnung, Niṣāb und Bericht.","zakat","Praktisch"],["werkzeuge","Testament","Private islamische Waṣiyyah-Erklärung mit Pflichtprüfung und PDF-Ausgabe.","wasiyyah","Wasiyyah"],["persoenlich","Favoriten","0 gespeichert.","saved",""],["app","Neu im Fokus","0 Meldungen und Hinweise.","news","Neu"],["app","Einstellungen","Theme, Schriftgröße und App-Verhalten.","settings",""],["app","Über die App","Maßstab, Quellenordnung und Aufbau.","scale",""]];
const CATS=[{"id":"wissen","label":"Wissen","full":"Lernen & Wissen","icon":"prophets"},{"id":"alltag","label":"Alltag","full":"Alltag & Gebet","icon":"prayer"},{"id":"werkzeuge","label":"Werkzeuge","full":"Werkzeuge & Assistenten","icon":"zakat"},{"id":"persoenlich","label":"Persönlich","full":"Persönlich","icon":"saved"},{"id":"app","label":"App","full":"App","icon":"settings"}];
const MODE="b";
const BASE="/assets/dar-3d-icons/";
const ICONS={home:"home",quiz:"quiz",feed:"quran",quran:"quran",more:"more"};
let active="wissen",search="",page=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const im=(name)=>'<img src="'+BASE+esc(name)+'.png" alt="" loading="lazy" onerror="this.style.opacity=0.2">';
function show(title,description,icon){
  $("modalBody").innerHTML='<div class="sheethead">'+im(icon||"library")+'<h3>'+esc(title)+'</h3></div><p>'+esc(description)+'</p>';
  $("modal").classList.add("show");document.body.style.overflow="hidden";
}
function hide(){ $("modal").classList.remove("show");document.body.style.overflow=""; }
function render(){
 let groups=CATS.map(c=>'<button type="button" class="'+(active===c.id?"active":"")+'" data-cat="'+c.id+'">'+im(c.icon)+'<span>'+esc(c.label)+'</span></button>').join("");
 let filtered=ITEMS.map((it,n)=>({it,n})).filter(o=>search.trim()?([o.it[1],o.it[2],o.it[4],CATS.find(c=>c.id===o.it[0])?.full||""].join(" ").toLowerCase().includes(search.toLowerCase())):o.it[0]===active);
 let title=search.trim()?"Suchergebnisse":CATS.find(c=>c.id===active).full;
 let pageSize=MODE==="b"?(active==="alltag"?5:4):1000;
 let pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));
 let visible=filtered.slice(page*pageSize,(page+1)*pageSize);
 const rows=visible.map(({it,n})=>'<button type="button" class="entry" data-item="'+n+'">'+im(it[3])+'<span class="entryText"><strong>'+esc(it[1])+(it[4]?' <span class="badge">'+esc(it[4])+'</span>':'')+'</strong><span class="description">'+esc(it[2])+'</span></span></button>').join("");
 $("groups").innerHTML=groups;
 $("list").innerHTML='<div class="sechead"><h2>'+esc(title)+'</h2><span>'+filtered.length+' Funktionen</span></div>'+(rows?'<div class="tiles">'+rows+'</div>':'<div class="empty">Keine Funktion gefunden.</div>')+(pages>1?'<div class="pagination"><button type="button" data-page="-1" '+(page===0?'disabled':'')+' aria-label="Vorherige Seite">‹</button><span>Seite '+(page+1)+' von '+pages+'</span><button type="button" data-page="1" '+(page===pages-1?'disabled':'')+' aria-label="Nächste Seite">›</button></div>':'')+(active==="app"&&!search?'<div class="social"><div class="brand">DĀR AL TAWḤĪD</div><p>Folgt für mehr Wissen aus Qurʾān & Sunnah</p><div class="socialLinks"><button data-social="Telegram">Telegram</button><button data-social="WhatsApp">WhatsApp</button><button data-social="Instagram">Instagram</button></div><div class="signature">by Serhat Abu Malik</div></div>':'')+'<div class="footnote">Designvorschau · Alle 23 Menüpunkte aus deiner iOS-App sind erhalten.</div>';
 document.querySelectorAll("[data-cat]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.cat===active)));
}
function init(){
 $("previewName").textContent=MODE==="a"?"A · Kompakte Kacheln":"B · Fokus-Seiten";
 $("groups").addEventListener("click",ev=>{let b=ev.target.closest("[data-cat]");if(!b)return;active=b.dataset.cat;page=0;search="";$("search").value="";render();window.scrollTo(0,0);});
 $("search").addEventListener("input",ev=>{search=ev.target.value;page=0;render();});
 $("list").addEventListener("click",ev=>{
  let e=ev.target.closest("[data-item]");if(e){let it=ITEMS[Number(e.dataset.item)];show(it[1],it[2],it[3]);return;}
  let p=ev.target.closest("[data-page]");if(p){page+=Number(p.dataset.page);render();window.scrollTo(0,0);return;}
  let s=ev.target.closest("[data-social]");if(s){show(s.dataset.social,"Der bestehende Social-Media-Zugang bleibt in der App unverändert erhalten.","posts");}
 });
 $("accountToggle").addEventListener("click",()=>{let box=$("accountContent"),expanded=$("accountToggle").getAttribute("aria-expanded")==="true";box.hidden=expanded;$("accountToggle").setAttribute("aria-expanded",String(!expanded));});
 document.querySelectorAll("[data-account]").forEach(e=>e.onclick=()=>show(e.dataset.account,"Die App bleibt auch ohne Konto nutzbar. Daten auf allen Geräten sichern.","saved"));
 document.querySelectorAll("[data-bottom]").forEach(e=>e.onclick=()=>{if(e.dataset.bottom!=="Mehr")show(e.dataset.bottom,"Die untere Navigation wird unverändert aus deiner iOS-App übernommen. Diese Vorschau zeigt nur den Umbau des Bereichs Mehr.","home");});
 $("closeModal").onclick=hide;$("modal").onclick=ev=>{if(ev.target===$("modal"))hide();};document.addEventListener("keydown",ev=>{if(ev.key==="Escape")hide();});
 if(MODE==="b"){let sx=0,sy=0; $("list").addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$("list").addEventListener("touchend",e=>{if(search)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.6){let max=active==="alltag"?5:4;let pages=Math.ceil(ITEMS.filter(i=>i[0]===active).length/max);page=Math.max(0,Math.min(pages-1,page+(dx<0?1:-1)));render();}},{passive:true});}
 render();
}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
