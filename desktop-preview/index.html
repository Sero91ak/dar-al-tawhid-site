<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07121d">
<title>DĀR AL TAWḤĪD · Desktop-Vorschau</title>
<style>
:root{
  --bg:#07121d;
  --bg2:#0a1723;
  --panel:#0c1b28;
  --panel2:#0e2232;
  --ink:#f3eee2;
  --muted:#a9a69f;
  --gold:#c8a85b;
  --gold2:#e1c987;
  --line:rgba(225,201,135,.22);
  --line-soft:rgba(255,255,255,.08);
  --cream:#eee6d4;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
  --max:1480px;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:
  radial-gradient(1050px 520px at 12% -10%,rgba(53,91,111,.25),transparent 64%),
  radial-gradient(900px 580px at 90% 0%,rgba(200,168,91,.08),transparent 58%),
  linear-gradient(180deg,#081521 0%,#07121d 56%,#061019 100%);
  color:var(--ink);font-family:var(--sans);min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.site-header{position:sticky;top:0;z-index:50;background:rgba(7,18,29,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line-soft)}
.header-inner{width:min(var(--max),calc(100% - 46px));margin:auto;min-height:82px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:34px}
.brand{display:flex;align-items:center;gap:14px;min-width:260px}
.brand-mark{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--gold2);box-shadow:inset 0 0 0 5px rgba(200,168,91,.025)}
.brand-copy strong{display:block;font-family:var(--serif);font-size:20px;letter-spacing:.11em;font-weight:600;white-space:nowrap}
.brand-copy span{display:block;margin-top:3px;color:var(--gold);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.main-nav{display:flex;justify-content:center;align-items:center;gap:4px;white-space:nowrap}
.main-nav a{position:relative;padding:30px 10px 25px;color:#c8c6c0;font-size:12px;font-weight:650;letter-spacing:.035em}
.main-nav a:after{content:"";position:absolute;left:13px;right:13px;bottom:17px;height:1px;background:transparent}
.main-nav a:hover,.main-nav a.active{color:#fff}
.main-nav a.active:after{background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.header-actions{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.header-action{border:1px solid var(--line-soft);background:transparent;color:#e8e4dc;height:36px;padding:0 12px;font-size:11px;letter-spacing:.04em;cursor:pointer}
.header-action:hover{border-color:var(--line)}
.page{width:min(var(--max),calc(100% - 46px));margin:0 auto;padding:38px 0 72px}
.page-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.42fr);gap:48px;align-items:end;padding:24px 0 26px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1,h2,h3,h4,p{margin-top:0}
.page-intro h1{margin:8px 0 9px;font:500 clamp(34px,4vw,62px)/.98 var(--serif);letter-spacing:-.025em}
.page-intro p{margin:0;color:#b9b7b0;max-width:760px;font-size:14px;line-height:1.7}
.intro-aside{text-align:right;color:#94938f;font-size:11px;line-height:1.55}
.section{padding:28px 0;border-bottom:1px solid var(--line-soft)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:17px}
.section-head h2{margin:0;font:500 24px/1.15 var(--serif);letter-spacing:-.01em}
.section-head p{margin:0;color:var(--muted);font-size:11px}
.text-link{font-size:10px;color:var(--gold2);letter-spacing:.07em;text-transform:uppercase}
.grid-12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.rule-card{position:relative;padding:18px 0;border-top:1px solid var(--line-soft)}
.rule-card:first-child{border-top-color:var(--line)}
.rule-card .kicker{font-size:9px;color:var(--gold);letter-spacing:.13em;text-transform:uppercase}
.rule-card h3{margin:7px 0 7px;font:500 21px/1.17 var(--serif)}
.rule-card p{margin:0;color:#aaa8a2;font-size:12px;line-height:1.6}
.feature{grid-column:span 7;padding-right:26px;border-right:1px solid var(--line-soft)}
.side-stack{grid-column:span 5}
.hero-quote{padding:36px 0 24px;min-height:245px;display:flex;flex-direction:column;justify-content:flex-end;background:
 linear-gradient(90deg,rgba(200,168,91,.055),transparent 42%);border-top:1px solid var(--line)}
.hero-quote .arabic{font-family:"Geeza Pro","Noto Naskh Arabic",serif;font-size:34px;line-height:1.85;text-align:right;color:#fbf7ee}
.hero-quote .translation{max-width:760px;font:500 24px/1.45 var(--serif);color:#e8e2d4}
.hero-quote small{color:var(--gold);font-size:10px;letter-spacing:.08em}
.info-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info-item{padding:17px 20px;border-right:1px solid var(--line-soft)}
.info-item:last-child{border-right:0}
.info-item span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.info-item b{display:block;margin-top:6px;font:500 20px/1 var(--serif)}
.list-lines{border-top:1px solid var(--line)}
.list-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:18px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line-soft)}
.list-row .meta{font-size:9px;color:var(--gold);letter-spacing:.09em;text-transform:uppercase}
.list-row strong{font-family:var(--serif);font-size:16px;font-weight:500}
.list-row small{color:#8f8e8a;font-size:10px}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:34px}
.sidebar{border-right:1px solid var(--line-soft);padding-right:24px}
.sidebar .side-title{font-size:9px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
.side-nav{display:grid}
.side-nav a{padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12px;color:#b9b8b3}
.side-nav a.active{color:#fff;font-weight:700}
.book-shell{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);min-height:590px;background:#e9e0cb;color:#1d1a15;box-shadow:0 28px 70px rgba(0,0,0,.28)}
.book-page{position:relative;padding:38px 42px;background:
 linear-gradient(90deg,rgba(60,42,20,.035),transparent 16%),
 linear-gradient(180deg,#efe7d5,#e8deca)}
.book-page:first-child{border-right:1px solid rgba(67,51,28,.18)}
.book-page .page-no{position:absolute;bottom:16px;left:0;right:0;text-align:center;font:500 10px var(--serif);opacity:.58}
.book-surah{font:600 23px/1.2 var(--serif);text-align:center;letter-spacing:.04em;padding-bottom:15px;border-bottom:1px solid rgba(67,51,28,.22)}
.book-ar{font-family:"Geeza Pro","Noto Naskh Arabic",serif;font-size:30px;line-height:2.12;text-align:right;margin:24px 0 20px}
.book-de{font:500 15px/1.72 var(--serif);color:#3f382e}
.book-de p{margin:0 0 12px}
.book-meta{margin-top:22px;padding-top:13px;border-top:1px solid rgba(67,51,28,.14);font-size:10px;color:#736a5e}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tool{height:34px;padding:0 12px;border:1px solid var(--line-soft);background:transparent;color:#cbc9c3;font-size:10px;cursor:pointer}
.tool.active{border-color:var(--line);color:#fff}
.article-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:28px}
.article-lead{padding-right:28px;border-right:1px solid var(--line-soft)}
.article-lead .image-sim{height:290px;background:
 radial-gradient(circle at 78% 14%,rgba(225,201,135,.12),transparent 30%),
 linear-gradient(135deg,#0f2635,#08141f 58%,#07121d);
 border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.article-lead h2{font:500 34px/1.1 var(--serif);margin:0 0 10px}
.article-lead p{color:#aaa8a2;font-size:13px;line-height:1.68}
.article-stack .rule-card h3{font-size:18px}
.dua-reader{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px}
.dua-main{max-width:900px}
.dua-block{padding:24px 0;border-bottom:1px solid var(--line-soft)}
.dua-block:first-child{border-top:1px solid var(--line)}
.dua-block h3{font:500 23px/1.2 var(--serif)}
.dua-ar{font-family:"Geeza Pro","Noto Naskh Arabic",serif;font-size:31px;line-height:1.95;text-align:right;color:#faf6ed}
.dua-tr{font:500 14px/1.7 var(--serif);color:#d8d0bf;padding-top:12px;border-top:1px solid rgba(225,201,135,.11)}
.dua-de{font-size:13px;line-height:1.75;color:#bbb8b0}
.source{font-size:10px;color:#8f8c84;margin-top:12px}
.knowledge-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.knowledge-item{padding:23px 20px 24px 0;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.knowledge-item:nth-child(3n){border-right:0;padding-left:20px}
.knowledge-item:nth-child(3n+2){padding-left:20px}
.knowledge-item span{font-size:9px;color:var(--gold);letter-spacing:.13em;text-transform:uppercase}
.knowledge-item h3{font:500 21px/1.15 var(--serif);margin:8px 0 7px}
.knowledge-item p{font-size:11px;line-height:1.6;color:#a5a39d;margin:0}
.library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.book-card{min-width:0}
.cover{aspect-ratio:.69;background:
 linear-gradient(135deg,rgba(225,201,135,.13),transparent 38%),
 linear-gradient(160deg,#102c3b,#081520 70%);
 border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;box-shadow:0 18px 38px rgba(0,0,0,.2)}
.cover span{font:500 18px/1.25 var(--serif);letter-spacing:.04em}
.book-card h3{font:500 16px/1.3 var(--serif);margin:12px 0 3px}
.book-card small{font-size:10px;color:var(--muted)}
.prayer-top{display:grid;grid-template-columns:1fr 340px;gap:32px}
.prayer-date{padding-right:30px;border-right:1px solid var(--line-soft)}
.prayer-date h2{font:500 38px/1 var(--serif);margin-bottom:8px}
.prayer-date p{color:var(--muted);font-size:12px}
.next-prayer{text-align:right}
.next-prayer b{display:block;font:500 34px/1 var(--serif);color:var(--gold2)}
.next-prayer span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.prayer-grid{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prayer{padding:24px 18px;border-right:1px solid var(--line-soft)}
.prayer:last-child{border-right:0}
.prayer span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em}
.prayer b{display:block;margin-top:7px;font:500 25px/1 var(--serif)}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line)}
.more-row{display:grid;grid-template-columns:1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--line-soft)}
.more-row:nth-child(odd){padding-right:28px;border-right:1px solid var(--line-soft)}
.more-row:nth-child(even){padding-left:28px}
.more-row h3{margin:0 0 5px;font:500 20px/1.15 var(--serif)}
.more-row p{margin:0;color:#9d9b95;font-size:11px;line-height:1.5}
.more-row b{color:var(--gold2);font-weight:500}
.preview-note{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#7f7e7a;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.mobile-nav{display:none}
@media(max-width:1100px){
  .header-inner{width:min(var(--max),calc(100% - 28px));grid-template-columns:1fr auto;gap:18px}
  .main-nav{grid-column:1/-1;justify-content:flex-start;overflow-x:auto;border-top:1px solid var(--line-soft);scrollbar-width:none}
  .main-nav::-webkit-scrollbar{display:none}
  .main-nav a{padding:13px 11px 14px}
  .main-nav a:after{bottom:7px}
  .page{width:min(var(--max),calc(100% - 28px));padding-top:25px}
  .page-intro{grid-template-columns:1fr;gap:10px}
  .intro-aside{text-align:left}
  .book-shell{min-height:520px}
  .book-page{padding:30px 26px}
  .library-grid{grid-template-columns:repeat(3,1fr)}
  .prayer-grid{grid-template-columns:repeat(3,1fr)}
  .prayer:nth-child(3){border-right:0}.prayer:nth-child(-n+3){border-bottom:1px solid var(--line-soft)}
}
@media(max-width:820px){
  .brand{min-width:0}
  .brand-copy strong{font-size:17px}
  .header-action.hide-tablet{display:none}
  .page-intro h1{font-size:40px}
  .feature,.side-stack{grid-column:1/-1;border-right:0;padding-right:0}
  .split,.dua-reader{grid-template-columns:1fr}
  .sidebar{border-right:0;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:14px}
  .side-nav{grid-template-columns:repeat(3,1fr);column-gap:16px}
  .book-shell{grid-template-columns:1fr}
  .book-page:first-child{border-right:0;border-bottom:1px solid rgba(67,51,28,.18)}
  .article-grid{grid-template-columns:1fr}
  .article-lead{padding-right:0;border-right:0}
  .knowledge-grid{grid-template-columns:repeat(2,1fr)}
  .knowledge-item,.knowledge-item:nth-child(3n),.knowledge-item:nth-child(3n+2){padding:19px 16px 20px 0;border-right:1px solid var(--line-soft)}
  .knowledge-item:nth-child(2n){border-right:0;padding-left:16px}
  .library-grid{grid-template-columns:repeat(2,1fr)}
  .prayer-top{grid-template-columns:1fr}
  .prayer-date{border-right:0;padding-right:0}
  .next-prayer{text-align:left}
  .more-grid{grid-template-columns:1fr}
  .more-row:nth-child(odd),.more-row:nth-child(even){padding:18px 0;border-right:0}
}
@media(max-width:560px){
  .header-inner{min-height:70px}
  .brand-mark{display:none}
  .header-actions{gap:4px}
  .header-action{padding:0 8px}
  .page{width:calc(100% - 22px)}
  .page-intro{padding-top:8px}
  .page-intro h1{font-size:34px}
  .info-strip{grid-template-columns:repeat(2,1fr)}
  .info-item:nth-child(2){border-right:0}
  .info-item:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}
  .list-row{grid-template-columns:70px 1fr}
  .list-row small{display:none}
  .side-nav{grid-template-columns:repeat(2,1fr)}
  .knowledge-grid{grid-template-columns:1fr}
  .knowledge-item,.knowledge-item:nth-child(2n),.knowledge-item:nth-child(3n),.knowledge-item:nth-child(3n+2){border-right:0;padding:17px 0}
  .library-grid{grid-template-columns:1fr 1fr;gap:14px}
  .prayer-grid{grid-template-columns:repeat(2,1fr)}
  .prayer:nth-child(odd){border-right:1px solid var(--line-soft)}
  .prayer:nth-child(even){border-right:0}
  .prayer:nth-child(-n+4){border-bottom:1px solid var(--line-soft)}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="?page=start" aria-label="Startseite">
      <div class="brand-mark">۞</div>
      <div class="brand-copy"><strong>DĀR AL TAWḤĪD</strong><span>Qurʾān · Sunnah · Āṯār</span></div>
    </a>
    <nav class="main-nav" id="mainNav" aria-label="Hauptnavigation">
      <a data-page="start" href="?page=start">Startseite</a>
      <a data-page="quran" href="?page=quran">Qurʾān</a>
      <a data-page="beitraege" href="?page=beitraege">Beiträge</a>
      <a data-page="dua" href="?page=dua">Duʿāʾ</a>
      <a data-page="wissen" href="?page=wissen">Wissen</a>
      <a data-page="bibliothek" href="?page=bibliothek">Bibliothek</a>
      <a data-page="gebetszeiten" href="?page=gebetszeiten">Gebetszeiten</a>
      <a data-page="mehr" href="?page=mehr">Mehr</a>
    </nav>
    <div class="header-actions">
      <button class="header-action hide-tablet" type="button">Suche</button>
      <button class="header-action" type="button">Theme</button>
    </div>
  </div>
</header>

<main class="page" id="pageRoot"></main>

<script>
(function(){
  const root=document.getElementById("pageRoot");
  const nav=[...document.querySelectorAll("[data-page]")];
  const params=new URLSearchParams(location.search);
  const page=(params.get("page")||"start").toLowerCase();

  const intros={
    start:["WEBSITE · DESKTOP","Wissen übersichtlich. Ruhig. Direkt.","Eine eigenständige Desktop-Webseite für DĀR AL TAWḤĪD – nicht als vergrößerte App, sondern als redaktionelle Wissensplattform mit klarer Navigation, feinen Linien und großzügigem Inhaltsraster."],
    quran:["QURʾĀN","Lesen, suchen und vertiefen.","Desktop-Leser mit Sūrah-Navigation, Buchansicht, deutscher Übersetzung, Lautschrift, Tafsīr und direktem Zugriff auf jede Āyah."],
    beitraege:["BEITRÄGE","Aktuelle Inhalte und Quellen.","Beiträge werden wie eine hochwertige Wissensseite präsentiert: Hauptthemen, neue Inhalte, Serien und Quellen klar voneinander getrennt."],
    dua:["DUʿĀʾ","Bittgebete klar gegliedert.","Kategorien links, Inhalt rechts. Arabisch, Lautschrift, Übersetzung und Quelle werden typografisch sauber voneinander getrennt."],
    wissen:["WISSEN","Themen systematisch erschließen.","Aqīdah, Fiqh, Sunnah, Āṯār, Gelehrte und Grundlagen in einer lexikonartigen Desktop-Struktur."],
    bibliothek:["BIBLIOTHEK","Werke, PDFs und Sammlungen.","Eine echte digitale Bibliotheksansicht mit Filtern, Buchansicht und klarer Detaildarstellung."],
    gebetszeiten:["GEBETSZEITEN","Der Tag auf einen Blick.","Gebetszeiten, nächstes Gebet und Tagesinformationen in einer ruhigen, horizontalen Desktop-Darstellung."],
    mehr:["MEHR","Weitere Werkzeuge und Bereiche.","Alle zusätzlichen Bereiche der Plattform in einer klaren Webseitenstruktur – ohne App-Kacheln und ohne untere Tab-Leiste."]
  };

  function intro(key){
    const d=intros[key]||intros.start;
    return `<section class="page-intro">
      <div><div class="eyebrow">${d[0]}</div><h1>${d[1]}</h1><p>${d[2]}</p></div>
      <div class="intro-aside">DESKTOP-VORSCHAU<br>Browser · Laptop · PC · Tablet-Browser</div>
    </section>`;
  }
  function foot(){return `<div class="preview-note"><span>DĀR AL TAWḤĪD · Desktop Website Preview</span><span>Nur Vorschau · Apps bleiben separat</span></div>`}

  function start(){
    return intro("start")+`
      <section class="hero-quote">
        <div class="arabic" dir="rtl">ٱهْدِنَا ٱلصِّرَاطَ ٱلْمُسْتَقِيمَ</div>
        <div class="translation">„Leite uns den geraden Weg.“</div>
        <small>Qurʾān · al-Fātiḥah 1:6</small>
      </section>
      <div class="info-strip">
        <div class="info-item"><span>Weiterlesen</span><b>al-Baqarah 2:17</b></div>
        <div class="info-item"><span>Nächstes Gebet</span><b>Ẓuhr · 13:24</b></div>
        <div class="info-item"><span>Neu</span><b>6 Beiträge</b></div>
        <div class="info-item"><span>Bibliothek</span><b>40 Werke</b></div>
      </div>
      <section class="section">
        <div class="section-head"><h2>Im Fokus</h2><a class="text-link" href="?page=beitraege">Alle Beiträge</a></div>
        <div class="grid-12">
          <div class="feature">
            <article class="rule-card"><div class="kicker">AQĪDAH · NEU</div><h3>Was der Qurʾān über Tawḥīd und Aufrichtigkeit lehrt</h3><p>Redaktionelle Hauptfläche mit größerer Überschrift, kurzer Einordnung und direktem Quellenbezug – ohne App-Karte.</p></article>
            <article class="rule-card"><div class="kicker">QURʾĀN</div><h3>Direkt weiterlesen</h3><p>Der letzte Lesestand erscheint als ruhige Zeile mit Sūrah, Āyah und Fortschritt.</p></article>
          </div>
          <div class="side-stack">
            <article class="rule-card"><div class="kicker">DUʿĀʾ DES TAGES</div><h3>Bitte um Rechtleitung und Standhaftigkeit</h3><p>Arabisch, Lautschrift, Deutsch und Quelle im Duʿāʾ-Bereich.</p></article>
            <article class="rule-card"><div class="kicker">WISSEN</div><h3>Neu geordnet: Grundlagen, Fiqh und Āṯār</h3><p>Desktop-Navigation führt direkt in die Themenstruktur.</p></article>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="section-head"><h2>Neueste Inhalte</h2><span class="section-head p">Kompakt statt Kacheln</span></div>
        <div class="list-lines">
