 $("list").innerHTML='<div class="sechead"><h2>'+esc(title)+'</h2><span>'+filtered.length+' Funktionen</span></div>'+(rows?'<div class="tiles">'+rows+'</div>':'<div class="empty">Keine Funktion gefunden.</div>')+(pages>1?'<div class="pagination"><button type="button" data-page="-1" '+(page===0?'disabled':'')+' aria-label="Vorherige Seite">‹</button><span>Seite '+(page+1)+' von '+pages+'</span><button type="button" data-page="1" '+(page===pages-1?'disabled':'')+' aria-label="Nächste Seite">›</button></div>':'')+(active==="app"&&!search?'<div class="social"><div class="brand">DĀR AL TAWḤĪD</div><p>Folgt für mehr Wissen aus Qurʾān & Sunnah</p><div class="socialLinks"><button data-social="Telegram">Telegram</button><button data-social="WhatsApp">WhatsApp</button><button data-social="Instagram">Instagram</button></div><div class="signature">by Serhat Abu Malik</div></div>':'')+'<div class="footnote">Designvorschau · Alle 23 Menüpunkte aus deiner iOS-App sind erhalten.</div>';
 document.querySelectorAll("[data-cat]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.cat===active)));
}
function init(){
 $("previewName").textContent="V1.1 · Kompakt";
 $("searchToggle").addEventListener("click",function(){
   var box=$("searchArea"),opening=box.hidden;
   box.hidden=!opening;
   $("searchToggle").setAttribute("aria-expanded",String(opening));
   if(opening){$("accountContent").hidden=true;$("accountToggle").setAttribute("aria-expanded","false");$("search").focus();}
   else{search="";$("search").value="";page=0;render();}
 });
 $("closeSearch").addEventListener("click",function(){
   $("searchArea").hidden=true;$("searchToggle").setAttribute("aria-expanded","false");
   search="";$("search").value="";page=0;render();
 });
 $("groups").addEventListener("click",ev=>{let b=ev.target.closest("[data-cat]");if(!b)return;active=b.dataset.cat;page=0;search="";$("search").value="";render();window.scrollTo({top:0,behavior:'instant'});});
 $("search").addEventListener("input",ev=>{search=ev.target.value;page=0;render();});
 $("list").addEventListener("click",ev=>{
  let e=ev.target.closest("[data-item]");if(e){let it=ITEMS[Number(e.dataset.item)];show(it[1],it[2],it[3]);return;}
  let p=ev.target.closest("[data-page]");if(p){page+=Number(p.dataset.page);render();window.scrollTo({top:0,behavior:'instant'});return;}
  let s=ev.target.closest("[data-social]");if(s){show(s.dataset.social,"Der bestehende Social-Media-Zugang bleibt in der App unverändert erhalten.","posts");}
 });
 $("accountToggle").addEventListener("click",()=>{let box=$("accountContent"),expanded=$("accountToggle").getAttribute("aria-expanded")==="true";box.hidden=expanded;$("accountToggle").setAttribute("aria-expanded",String(!expanded));});
 document.querySelectorAll("[data-account]").forEach(e=>e.onclick=()=>show(e.dataset.account,"Die App bleibt auch ohne Konto nutzbar. Daten auf allen Geräten sichern.","saved"));
 document.querySelectorAll("[data-bottom]").forEach(e=>e.onclick=()=>{if(e.dataset.bottom!=="Mehr")show(e.dataset.bottom,"Die untere Navigation wird unverändert aus deiner iOS-App übernommen. Diese Vorschau zeigt nur den Umbau des Bereichs Mehr.","home");});
 $("closeModal").onclick=hide;$("modal").onclick=ev=>{if(ev.target===$("modal"))hide();};document.addEventListener("keydown",ev=>{if(ev.key==="Escape")hide();});
 if(MODE==="b"){let sx=0,sy=0; $("list").addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$("list").addEventListener("touchend",e=>{if(search)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.6){let max=active==="alltag"?5:4;let pages=Math.ceil(ITEMS.filter(i=>i[0]===active).length/max);page=Math.max(0,Math.min(pages-1,page+(dx<0?1:-1)));render();}},{passive:true});}
 render();
}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
