name: Umrah Premium - standalone quality gate
on:
  pull_request:
    paths:
      - "umrah/**"
      - ".github/workflows/umrah-premium-qa.yml"
  push:
    branches: [main]
    paths:
      - "umrah/**"
      - ".github/workflows/umrah-premium-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check umrah/enhancements.js
          node --check umrah/sw.js
          node --check umrah/tools/verify-premium.cjs
      - name: Integration and source links
        run: node umrah/tools/verify-premium.cjs
