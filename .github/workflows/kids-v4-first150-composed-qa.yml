name: KIDS V4 First150 Composed MP3 Technical QA (zero credits)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/tools/qa_quiz_v4_first150_composed.py'
      - '.github/workflows/kids-v4-first150-composed-qa.yml'

permissions:
  contents: write

concurrency:
  group: kids-v4-first150-composed-technical-qa
  cancel-in-progress: false

jobs:
  verify-authentic-audio-previews:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Install/read ffmpeg and ffprobe, no TTS
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get -o Acquire::Retries=0 -o DPkg::Lock::Timeout=15 install -y ffmpeg
          fi
      - name: Verify all composed preview MP3 files and first150 question coverage
        run: |
          python3 -m py_compile kids/tools/qa_quiz_v4_first150_composed.py
          python3 kids/tools/qa_quiz_v4_first150_composed.py
      - name: Persist actual MP3 QA results in review, no live changes
        run: |
          set -euo pipefail
          git config user.name dar-kids-review-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch=review/kids-quiz-v4-batch-001-020-20261014
          for try in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard FETCH_HEAD
            python3 kids/tools/qa_quiz_v4_first150_composed.py
            git add kids/data/quiz-v4-first150-composed-technical-qa.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'qa(kids): verify original composed MP3 previews and true first150 V4 coverage'
            if git push origin HEAD:"$branch"; then exit 0; fi
          done
          exit 1
