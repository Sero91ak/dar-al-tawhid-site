name: Deploy Quellen-Seiten

on:
  push:
    branches:
      - main
    paths:
      - 'quelle/**'

permissions:
  contents: read

jobs:
  deploy-quellen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Geänderte Quellenseiten bestimmen
        id: pages
        shell: bash
        run: |
          BASE='${{ github.event.before }}'
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ]; then
            FILES="$(find quelle -mindepth 2 -maxdepth 2 -name index.html -type f | sort)"
          else
            FILES="$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep '^quelle/.*/index\.html$' || true)"
          fi
          printf '%s\n' "$FILES"
          {
            echo 'files<<EOF'
            printf '%s\n' "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Quellenseiten validieren
        if: steps.pages.outputs.files != ''
        shell: bash
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            test -s "$file"
            grep -q 'DAR AL TAWḤĪD' "$file"
            grep -q 'Geprüfter Direktnachweis' "$file"
            grep -q 'Originalnachweis' "$file"
            if grep -Eq 'http-equiv="refresh"|location\.replace\(' "$file"; then
              echo "Automatische externe Weiterleitung ist auf Quellenseiten nicht erlaubt: $file"
              exit 1
            fi
          done <<< '${{ steps.pages.outputs.files }}'

      - name: Production publish ownership
        run: |
          echo "Quellenseiten validated. Production publishing belongs exclusively to Deploy Besucher-App (Cloudflare Workers)."
