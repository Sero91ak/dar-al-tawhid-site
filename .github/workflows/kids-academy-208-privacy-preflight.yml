name: KIDS Academy 208 Privacy and Pre-Audio Audit
on:
  pull_request:
    paths:
      - 'kids/akademie/**'
      - 'kids/tools/academy-208-privacy-audio-preflight.cjs'
      - 'kids/data/academy-voice-policy-v10.json'
      - '.github/workflows/kids-academy-208-privacy-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-credit-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 208 lessons, 624 ages, 1664 questions, no paid audio
        run: |
          node kids/tools/test-academy-v31-142-editorial.cjs
          node kids/tools/academy-208-privacy-audio-preflight.cjs
          node kids/tools/test-academy-v31-choice-only-review.cjs
          node kids/tools/audit-academy-v31-source-and-buttons.cjs artifacts/academy-142-source-review.json
          node kids/tools/export-academy-208-button-candidates.cjs artifacts/academy-208-button-review.json
      - name: Attach proposed answer choices for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: academy-621-button-editorial-review
          path: artifacts/academy-208-button-review.json
      - name: Attach 142-lesson source and compact-answer audit
        uses: actions/upload-artifact@v4
        with:
          name: academy-142-source-and-ux-review
          path: artifacts/academy-142-source-review.json
          retention-days: 14
          retention-days: 14
