name: KIDS V4 Three Native Arabic Pronunciation Auditory Pilots
on:
  push:
    branches: [review/kids-quiz-v4-batch-001-020-20261014]
    paths:
      - kids/review-only/quiz-v4-native-arabic-owner-three-trigger.json
permissions:
  contents: write
concurrency:
  group: kids-v4-native-arabic-three-pilots-once-20261021
  cancel-in-progress: false
jobs:
  record-three-owner-pronunciation-tests:
    if: >-
      github.repository == 'Sero91ak/dar-al-tawhid-site' &&
      github.ref_name == 'review/kids-quiz-v4-batch-001-020-20261014' &&
      github.event.head_commit.message == 'audio(kids V4): start exact three native Fusha pronunciation owner pilots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIDS_V4_OWNER_450_BULK_EXPLICIT: 'YES'
      KIDS_V4_EXPLICIT_SPEND_APPROVAL: 'YES'
    steps:
      - name: Checkout genuine canonical V4 review with paid checkpoint history
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
          fetch-depth: 0
      - name: Verify exact owner scope, terms, voices, credits and no release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('kids/review-only/quiz-v4-native-arabic-owner-three-trigger.json').read_text(encoding='utf-8'))
          assert x=={
            'scope':'KIDS_V4_450_OWNER_NATIVE_FUSHA_PRONUNCIATION_REVIEW',
            'threeNativeArabicOnly':['عِبَادَة','حَلَال','حَرَام'],
            'userHeldWords':['ʿIbādah','Ḥalāl','Ḥarām'],
            'modelId':'eleven_v4',
            'voiceId':'DkU7j9uO4ZEtLD2iRZSH',
            'maxNewOriginals':3,
            'maxForecastCredits':125,
            'ownerGermanPLS':'Q8w3SxtoVo8NSjsnlJEd/wSzgkGpAwEDiTak8DApc',
            'replaceExistingPaidSpeechWithoutHumanHearing':False,
            'retryUncertainPaidSynthesis':False,
            'humanListeningApproved':False,
            'publicReleaseAllowed':False
          }, 'Exact once-only user native AR review gate mismatched'
          assert json.loads(Path('kids/data/quiz-curation-release.json').read_text())['enabled'] is False
          PY
          python3 -m py_compile kids/tools/produce_quiz_v4_native_arabic_three_auditory_pilots.py
          python3 kids/tools/test_quiz_v4_canonical_dictionary_payload.py
          python3 kids/tools/test_quiz_v4_no_double_charge_guard.py
          python3 kids/tools/produce_quiz_v4_native_arabic_three_auditory_pilots.py --audit
      - name: Verify MP3 codec tools before paid requests
        run: |
          if ! command -v ffprobe >/dev/null; then sudo apt-get -qq update && sudo apt-get install -y -qq ffmpeg; fi
          command -v ffprobe
      - name: Generate at most three source SHA-bound individual original auditions
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          python3 kids/tools/produce_quiz_v4_native_arabic_three_auditory_pilots.py --produce
      - name: Back up only actual V4 originals and sanitized payment-state ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-owner-three-native-fusha-audition-originals-no-repurchase
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/data/quiz-v4-native-arabic-owner-three-auditory-pilot-ledger.json
            kids/assets/kids-quiz-audio/v4-native-fusha-pronunciation-pilots-review/
