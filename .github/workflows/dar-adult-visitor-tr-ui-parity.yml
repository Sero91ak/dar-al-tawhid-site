name: DAR Adult Visitor Locale Release Gate

on:
  pull_request:
    paths:
      - 'assets/i18n/adult-ui-de-tr.json'
      - 'assets/i18n/adult-ui-translate.js'
      - 'assets/i18n/visitor-tr-ui-smoke.py'
      - 'assets/dar-more-v15.js'
      - '.github/workflows/dar-adult-visitor-tr-ui-parity.yml'

permissions:
  contents: read

jobs:
  adult-locale-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared catalog, JavaScript and source isolation
        run: |
          node --check assets/i18n/adult-ui-translate.js
          node --check assets/dar-more-v15.js
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('assets/i18n/adult-ui-de-tr.json','utf8'));
          const keys=Object.keys(p.entries||{});
          if(p.schemaVersion!==1||p.scope!=='adult-interface-only'||
             p.locale!=='tr'||p.sourceLocale!=='de'||keys.length<350)
             throw Error('Incomplete shared Turkish interface-only catalog');
          const runtime=fs.readFileSync('assets/i18n/adult-ui-translate.js','utf8');
          if(runtime.includes('DAR_I18N_AI_API_KEY')||runtime.includes('api.openai.com')||
             !runtime.includes('data-canonical-content')||!runtime.includes('post-body'))
             throw Error('Unsafe or paid browser runtime');
          console.log('PASS canonical Turkish UI catalog',keys.length,'keys; German/Arabic manuscripts unchanged');
          NODE
      - name: Serve visitor and test layouts locally
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dar-visitor-ui.log 2>&1 &
          sleep 3
      - name: Test visitor German-only and staged Turkish selection in Chrome
        run: python3 assets/i18n/visitor-tr-ui-smoke.py
