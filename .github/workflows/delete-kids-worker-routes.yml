name: Kids-Worker Live-Routen löschen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-kids-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: dar-al-tawhid-kids Routen auf /test/kids löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/delete-kids-worker-routes.js

      - name: Cloudflare-Cache nur für /test/kids leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
        run: node scripts/purge-test-kids-cache.js

      - name: Öffentliche Kids-URL prüfen
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            CODE="$(curl -sS -o /tmp/kids-alive.txt -w '%{http_code}' 'https://dar-al-tawhid.de/test/kids/v12-alive.txt')"
            HTML="$(curl -sS 'https://dar-al-tawhid.de/test/kids/')"
            ICON="$(curl -sS -o /dev/null -w '%{http_code}' 'https://dar-al-tawhid.de/test/kids/assets/kids-icons/moon-real-v12.png')"
            echo "attempt $i alive=$CODE icon=$ICON"
            if [ "$CODE" = "200" ] && echo "$HTML" | grep -q 'KIDS · V0.12r' && echo "$HTML" | grep -q 'kids-shell-v12-start1' && [ "$ICON" = "200" ]; then
              echo "Kids public OK"
              exit 0
            fi
            sleep 8
          done
          echo "Kids public noch nicht v12"
          exit 1
