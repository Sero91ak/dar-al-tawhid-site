name: Adult Editorial Motion Preview
on:
  pull_request:
    paths:
      - 'assets/dar-adult-editorial-system-v1.css'
      - 'assets/dar-adult-editorial-system-v1.js'
      - 'scripts/check-adult-editorial-motion-v1.cjs'
      - 'scripts/check-adult-editorial-motion-browser.py'
      - 'cloudflare/site-router.js'
      - '.github/workflows/adult-editorial-motion-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design/motion ownership and behavior
        run: node scripts/check-adult-editorial-motion-v1.cjs
  editorial-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test driver
        run: python3 -m pip install --quiet selenium
      - name: Chromium responsive UI smoke (21 combinations + reduced motion)
        run: python3 scripts/check-adult-editorial-motion-browser.py
