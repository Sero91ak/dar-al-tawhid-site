name: Quran V8 Visual Screenshots Review
on:
  workflow_dispatch:
  push:
    branches: [preview/quran-player-browser-links-20261010]
    paths: [.github/workflows/qa-quran-v8-render.yml]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Render actual smartphone design previews
        run: node scripts/qa-quran-v8-render.cjs
