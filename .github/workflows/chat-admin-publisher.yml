name: Chat → DAR Admin Publisher

# Published posts still go through the pre-existing DAR Admin Publisher.
# Adding/changing workflows alone NEVER publishes visitor content.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/chat-admin-publish.js'
      - '.github/workflows/chat-admin-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'content/admin/chat-publish-requests/*.json'

permissions:
  contents: read

concurrency:
  group: dar-chat-approved-post-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline validation (no publishing and no credentials)
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/chat-admin-publish.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { stripPublicExtras } = require('./scripts/chat-admin-publish.js');
          const draft = [
            '---', 'id: "post-123"', 'title: "📖 Titel"', 'category: "Aqidah"',
            'tags:', '  - "#DarAlTawhid"', '  - "#Niyyah"',
            'source: "📝 Beleg"', 'links:', '  - label: "Quelle"',
            '    url: "/q/12"',
            '---',
            '🖋️ Sprecher sagte:', '„Die Absicht wird geprüft.“',
            '#DarAlTawhid #Niyyah',
            '📝 Quelle: /q/12', '🌙 Fazit: Die Niyyah zählt.',
            '📥 Telegram: @dar_al_tauhid',
            '🌐 Website: dar-al-tawhid.de',
            '📸 Instagram: @dar_at_tawhid'
          ].join('\n');
          const cleaned = stripPublicExtras(draft);
          assert.doesNotMatch(cleaned, /^tags:/m);
          assert.doesNotMatch(cleaned, /#DarAlTawhid|#Niyyah/);
          assert.doesNotMatch(cleaned, /📥 Telegram|🌐 Website|📸 Instagram/);
          assert.match(cleaned, /title: "📖 Titel"/);
          assert.match(cleaned, /„Die Absicht wird geprüft.“/);
          assert.match(cleaned, /📝 Quelle: \/q\/12/);
          assert.match(cleaned, /🌙 Fazit: Die Niyyah zählt/);
          assert.match(cleaned, /url: "\/q\/12"/);
          assert.match(stripPublicExtras('---\ntitle: "T"\n---\n# Überschrift\nhttps://www.islamweb.net/#:~:text=foo'), /#:~:text=foo/);
          console.log('Visitor hashtag filter: passed; quote, source, Fazit preserved.');
          NODE
          mkdir -p content/admin/chat-publish-requests
          node - <<'NODE'
          const fs = require('node:fs');
          const reg = JSON.parse(fs.readFileSync('q/_registry/shortlinks.json', 'utf8'));
          const active = reg.links.find(x => x.status === 'active' && fs.existsSync('q/' + x.number + '/index.html'));
          if (!active) throw Error('No active source in registry');
          const base = (mode) => [
            '---', 'id: "chat-smoke-test-post"', 'title: "Smoke Test"',
            'category: "Test"', 'source: "Verified Source"',
            'links:', '  - label: "Quelle"', '    url: "/q/' + active.number + '"',
            ...(mode === 'slide' ? ['layout: "slides"', 'slides:', '  - title: "Teil A"', '    text: "Aussage A"', '  - title: "Teil B"', '    text: "Aussage B"'] : []),
            '---', 'This is an offline validator-only test. No visitors receive it.'
          ].join('\n');
          const make = (mode, approved) => ({
            version: 1, audience: 'adult-visitors', approved,
            command: 'global live pushen', mode, push: false, markdown: base(mode)
          });
          const folder = 'content/admin/chat-publish-requests/';
          fs.writeFileSync(folder + 'smoke-single-01.json', JSON.stringify(make('single', true)));
          fs.writeFileSync(folder + 'smoke-slides-01.json', JSON.stringify(make('slide', true)));
          fs.writeFileSync(folder + 'smoke-denied-01.json', JSON.stringify(make('single', false)));
          NODE
          node scripts/chat-admin-publish.js --check content/admin/chat-publish-requests/smoke-single-01.json
          node scripts/chat-admin-publish.js --check content/admin/chat-publish-requests/smoke-slides-01.json
          if node scripts/chat-admin-publish.js --check content/admin/chat-publish-requests/smoke-denied-01.json; then
            echo "::error::Unapproved request was accepted"
            exit 1
          fi
          echo "Safe offline checks succeeded."

  publish:
    if: github.event_name == 'push'
    name: Validate and publish expressly approved adult-visitor posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select newly added approved requests only
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > chat-publish-requests.txt
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Unknown parent commit: refusing to replay previous requests"
            exit 1
          fi
          git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" -- 'content/admin/chat-publish-requests/*.json' > chat-publish-requests.txt
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            node scripts/chat-admin-publish.js --check "$request"
          done < chat-publish-requests.txt

      - name: Publish through existing DAR Admin service
        shell: bash
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          if [ ! -s chat-publish-requests.txt ]; then
            echo "No newly approved requests. Nothing to publish."
            exit 0
          fi
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::error::ADMIN_PUBLISH_SECRET is not configured as a GitHub Actions secret"
            exit 1
          fi
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            node scripts/chat-admin-publish.js --publish "$request"
          done < chat-publish-requests.txt
