name: Diagnose Kids Live-Deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kids-live-audit.yml
      - kids/manifest.webmanifest
      - kids/version.json
      - cloudflare/site-router.js
      - cloudflare/test-app-worker.js
      - _headers
  workflow_run:
    workflows:
      - Deploy Besucher-App (Cloudflare Workers)
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: dar-kids-live-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure production and latest Cloudflare deploy outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          FINISHED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FINISHED_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kids-audit
          curl --location --silent --show-error --fail --retry 2 --max-time 20 -A "DarAlTawhidKids-iOS"             -H "Cache-Control: no-cache"             "https://dar-al-tawhid.de/kids/version.json?audit=$(date +%s)"             -o /tmp/kids-audit/live-version.json || true
          curl --location --silent --show-error --fail --retry 2 --max-time 20 -A "DarAlTawhidKids-iOS" --location --max-redirs 4             -H "Cache-Control: no-cache"             "https://dar-al-tawhid.de/kids/start?audit=$(date +%s)"             -o /tmp/kids-audit/live-home.html || true
          curl --location --silent --show-error --fail --retry 2 --max-time 20 -A "DarAlTawhidKids-iOS"             "https://dar-al-tawhid.de/kids/prayer-stage-v1261.css?v=1275&audit=$(date +%s)"             -o /tmp/kids-audit/live-salah.css || true
          curl --location --silent --show-error --fail --retry 2 --max-time 20             "https://dar-al-tawhid.de/kids/assets/kids-salah-v1272/hero-home.png?v=1274"             -o /tmp/kids-audit/live-art.png || true
          for name in hero-day fajr dhuhr asr maghrib isha; do
            curl --silent --show-error --fail --retry 2 --max-time 20 \
              "https://dar-al-tawhid.de/kids/assets/kids-salah-v1272/$name.png?v=1275" \
              -o "/tmp/kids-audit/$name.png" || true
          done
          gh api "repos/$REPO/actions/workflows/cloudflare-pages-deploy.yml/runs?per_page=6"             --jq '[.workflow_runs[]|{id,head_sha,status,conclusion,created_at,updated_at,html_url}]'             > /tmp/kids-audit/runs.json || echo '[]' > /tmp/kids-audit/runs.json
          export AUDIT_TIME="$(date -u +%FT%TZ)"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/kids-audit')
          def read(name):
            f=p/name
            return f.read_text(errors='replace') if f.exists() else ''
          version=read('live-version.json')
          try: obj=json.loads(version)
          except Exception: obj={}
          home=read('live-home.html')
          css=read('live-salah.css')
          # Read the exact JS/CSS mappings referenced by the live Kids HTML.
          import re, urllib.request
          def live_asset(filename):
            match=re.search(r'/kids/'+re.escape(filename)+r'\?v=[a-zA-Z0-9_-]+',home)
            if not match:return {'ref':None,'text':'','bytes':0}
            ref=match.group(0)
            req=urllib.request.Request('https://dar-al-tawhid.de'+ref,
              headers={'User-Agent':'DarAlTawhidKids-iOS/LiveAudit','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=25) as response: raw=response.read()
              return {'ref':ref,'text':raw.decode('utf-8','replace'),'bytes':len(raw)}
            except Exception as error:
              print('Kids live asset fetch failed:',ref,type(error).__name__,str(error)[:160])
              return {'ref':ref,'text':'','bytes':0}
          learning=live_asset('dua-smart-learn.js')
          trilingual=live_asset('dua-learn-trilingual-v1282.css')
          german=live_asset('dua-word-meanings-v1.js')
          phonetic=live_asset('dua-phonetic-alignment-v1.js')
          wordLearningReady=bool(obj.get('buildId') and obj['buildId'] in home)
          wordLearningReady=wordLearningReady and all(x['bytes']>1000 for x in [learning,trilingual,german,phonetic])
          wordLearningReady=wordLearningReady and (
            'KIDS_DUA_TRILINGUAL_FOCUS_LANES_V1284' in trilingual['text']
            and 'dsl-long-content' in learning['text']
            and 'DARKidsDuaWordMeanings' in german['text']
            and 'DARKidsDuaPhoneticAlignment' in phonetic['text'])
          img=(p/'live-art.png')
          runs=json.loads(read('runs.json') or '[]')
          art={name:((p/(name+'.png')).stat().st_size if (p/(name+'.png')).exists() else 0) for name in ['hero-day','fajr','dhuhr','asr','maghrib','isha']}
          doc=dict(timestamp=os.getenv('AUDIT_TIME'),trigger=os.getenv('TRIGGER'),
             finishedDeployConclusion=os.getenv('FINISHED_CONCLUSION') or None,
             finishedDeployRun=os.getenv('FINISHED_RUN') or None,
             live=dict(buildId=obj.get('buildId'),label=obj.get('label'),
               homeBytes=len(home.encode()),
               homeContainsPrayerAssets1275='prayer-stage-v1261.css?v=1275' in home,
               homeContainsBuild1275='kids-shell-v171-salah-reference-viewport1275' in home,
               cssBytes=len(css),cssContainsViewportFit='KIDS_SALAH_REFERENCE_FIT_V1275' in css,
               photoBytes=img.stat().st_size if img.exists() else 0,
               prayerArtworkBytes=art,
               allSevenArtworkFilesReachable=(img.exists() and img.stat().st_size>30000 and all(n>30000 for n in art.values())),
               versionJsonReadable=bool(obj),
               trilingualWordLearningReady=wordLearningReady,
               trilingualAssets={name:{'ref':value['ref'],'bytes':value['bytes']} for name,value in [('learning',learning),('trilingualCss',trilingual),('germanMeanings',german),('phonetic',phonetic)]}),
             lastDeployRuns=runs)
          (p/'report.json').write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(doc,indent=2,ensure_ascii=False))
          PY
      - name: Save diagnostic report outside production-deploy paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="ci-status/kids-live-audit.json"
          CONTENT="$(base64 -w0 /tmp/kids-audit/report.json)"
          SHA="$(gh api "repos/$REPO/contents/$FILE" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/$FILE" -f message="ci(kids): record independent live/deploy audit" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$FILE" -f message="ci(kids): record independent live/deploy audit" -f content="$CONTENT" >/dev/null
          fi
