name: KIDS Salaf Visual Rules

on:
  pull_request:
    paths:
      - 'kids/salaf-library-v1.js'
      - 'kids/salaf-open-world-v1353.css'
      - 'kids/salaf-art-contract-v1380.json'
      - 'kids/assets/salaf/topics-v1380/**'
      - 'kids/index.html'
      - 'kids/start.html'
      - 'kids/shell.html'
      - 'kids/sw.js'
      - 'scripts/check-kids-salaf-visual-contract-v1380.cjs'
      - '.github/workflows/kids-salaf-visual-rules.yml'
  push:
    branches: [ main ]
    paths:
      - 'kids/salaf-library-v1.js'
      - 'kids/salaf-open-world-v1353.css'
      - 'kids/salaf-art-contract-v1380.json'
      - 'kids/assets/salaf/topics-v1380/**'
      - 'scripts/check-kids-salaf-visual-contract-v1380.cjs'
permissions:
  contents: read
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-kids-salaf-visual-contract-v1380.cjs
