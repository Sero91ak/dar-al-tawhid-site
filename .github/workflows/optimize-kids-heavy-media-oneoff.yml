name: Optimize Kids Heavy Media One-Off

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/optimize-kids-heavy-media-oneoff.yml'

permissions:
  contents: write

concurrency:
  group: kids-heavy-media-oneoff
  cancel-in-progress: true

jobs:
  optimize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Optimize remaining heavy Kids media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          videos = [
              Path("kids/assets/kids-cinema/intro-final.mp4"),
              Path("kids/assets/kids-cinema/intro-ios.mp4"),
              Path("kids/assets/kids-cinema/intro-v74.mp4"),
          ]
          audios = [
              Path("kids/assets/prophet-story-audio/adam/story.mp3"),
              Path("kids/assets/prophet-story-audio/muhammad/story.mp3"),
              Path("kids/assets/prophet-story-audio/idris/story.mp3"),
          ]

          def bitrate(path):
              try:
                  v=subprocess.check_output([
                      "ffprobe","-v","error","-select_streams","a:0",
                      "-show_entries","stream=bit_rate","-of","default=nw=1:nk=1",str(path)
                  ],text=True).strip()
                  return int(v or 0)
              except Exception:
                  return 0

          def duration(path):
              try:
                  return float(subprocess.check_output([
                      "ffprobe","-v","error","-show_entries","format=duration",
                      "-of","default=nw=1:nk=1",str(path)
                  ],text=True).strip())
              except Exception:
                  return 0.0

          def replace_if_smaller(src,tmp,min_ratio=0.97):
              old=src.stat().st_size
              new=tmp.stat().st_size if tmp.exists() else old
              if tmp.exists() and new < old*min_ratio:
                  tmp.replace(src)
                  print(f"TARGET_OPTIMIZED {src} {old} -> {new} saved={old-new}")
                  return True
              if tmp.exists(): tmp.unlink()
              print(f"TARGET_KEEP {src} {old} candidate={new}")
              return False

          changed=0
          for p in videos:
              if not p.exists(): continue
              tmp=p.with_suffix(".target.mp4")
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(p),
                  "-map","0:v:0","-map","0:a?",
                  "-vf","scale='min(1600,iw)':'min(1600,ih)':force_original_aspect_ratio=decrease",
                  "-c:v","libx264","-preset","medium","-crf","29","-pix_fmt","yuv420p",
                  "-c:a","aac","-b:a","64k","-movflags","+faststart",str(tmp)
              ],check=True)
              changed += int(replace_if_smaller(p,tmp))

          for p in audios:
              if not p.exists(): continue
              br=bitrate(p)
              print(f"AUDIO_PROBE {p} bitrate={br} duration={duration(p):.3f} bytes={p.stat().st_size}")
              if br and br <= 80000:
                  continue
              tmp=p.with_suffix(".target.mp3")
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(p),
                  "-vn","-ac","1","-ar","48000","-c:a","libmp3lame","-b:a","64k",str(tmp)
              ],check=True)
              changed += int(replace_if_smaller(p,tmp))

          # The runtime pin must always match the actual current Muhammad audio bytes.
          version=Path("kids/version.json")
          if version.exists():
              data=json.loads(version.read_text(encoding="utf-8"))
              story=Path("kids/assets/prophet-story-audio/muhammad/story.mp3")
              if story.exists():
                  sha=hashlib.sha256(story.read_bytes()).hexdigest()
                  visual=data.setdefault("visualSystem",{})
                  old=visual.get("storyAudioPinnedSha256")
                  if old != sha:
                      visual["storyAudioPinnedSha256"]=sha
                      visual["storyAudioPinnedCommit"]="media-optimized-runtime"
                      version.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                      print(f"PIN_UPDATED {old} -> {sha}")
                      changed += 1

          print(f"TARGET_MEDIA_CHANGED={changed}")
          PY

      - name: Verify target files
        shell: bash
        run: |
          set -euo pipefail
          for f in             kids/assets/kids-cinema/intro-final.mp4             kids/assets/kids-cinema/intro-ios.mp4             kids/assets/kids-cinema/intro-v74.mp4             kids/assets/prophet-story-audio/adam/story.mp3             kids/assets/prophet-story-audio/muhammad/story.mp3             kids/assets/prophet-story-audio/idris/story.mp3; do
            test -s "$f"
            echo "$(stat -c%s "$f") $f"
          done

      - name: Commit targeted optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kids/assets/kids-cinema/intro-final.mp4             kids/assets/kids-cinema/intro-ios.mp4             kids/assets/kids-cinema/intro-v74.mp4             kids/assets/prophet-story-audio/adam/story.mp3             kids/assets/prophet-story-audio/muhammad/story.mp3             kids/assets/prophet-story-audio/idris/story.mp3             kids/version.json
          if git diff --cached --quiet; then
            echo "Target media already optimal."
            exit 0
          fi
          git commit -m "[media-optimized] Reduce remaining heavy Kids runtime media"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
