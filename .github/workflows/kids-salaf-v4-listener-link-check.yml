name: Kids audio QA library - validate and maintain all future source manifests

on:
  pull_request:
    paths:
      - "salaf-v4-33-hoeren-20261028.html"
      - "kids/data/audio-review-sources-v1.json"
      - "scripts/build-kids-audio-review-library.cjs"
      - "kids/data/quiz-v4-full-rebuild-public.json"
      - "kids/data/quiz-audio.json"
      - "kids/data/dua-audio.json"
      - "kids/data/dua-arabic-audio.json"
      - "kids/data/dua-arabic-slow-audio.json"
      - "kids/data/dua-word-audio.json"
      - "kids/data/prophet-stories.json"
      - "kids/data/sahabiyyat-stories.json"
      - "kids/data/mubashshirun-stories.json"
      - "kids/data/alphabet-audio.json"
      - "kids/data/term-learning-audio.json"
      - "kids/data/academy-audio.json"
      - "kids/data/owner-voice-audio.json"
      - "kids/data/audio-review-sources-v1.json"
      - "scripts/build-kids-audio-review-library.cjs"
      - ".github/workflows/cloudflare-pages-deploy.yml"
      - ".github/workflows/kids-salaf-v4-listener-link-check.yml"
      - "kids/tools/test-salaf-v4-33-remote-audio.py"
      - "kids/data/salaf-library-v1.json"
      - "kids/salaf-library-v1.js"
      - "kids/tools/test-salaf-v4-owner-preview-live.cjs"
  push:
    branches: [main]
    paths:
      - "salaf-v4-33-hoeren-20261028.html"
      - ".github/workflows/kids-salaf-v4-listener-link-check.yml"
      - "kids/tools/test-salaf-v4-33-remote-audio.py"
      - "kids/data/salaf-library-v1.json"
      - "kids/salaf-library-v1.js"
      - "kids/tools/test-salaf-v4-owner-preview-live.cjs"

permissions:
  contents: write
  pull-requests: write

jobs:
  independent-33-listener-syntax-data-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify self-contained listening list, unmodified source and exact 33 cues
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const html=fs.readFileSync('salaf-v4-33-hoeren-20261028.html','utf8');
          assert.match(html,/<meta name="robots" content="noindex,nofollow,noarchive">/);
          assert.match(html,/id="right"/);
          assert.match(html,/id="wrong"/);
          assert.match(html,/kids-audio-review-library-v1\.json/);
          assert.doesNotMatch(html,/id="checklist"/);
          assert.match(html,/localStorage/);
          assert.match(html,/id="audio" controls/);
          assert.match(html,/id="audio-direct"/);
          assert.doesNotMatch(html,/fetch\("\/kids\/data\/salaf-library-v1\.json/);
          assert.doesNotMatch(html,/await Promise\.all\(tasks/);
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          assert.equal(scripts.length,1);
          fs.writeFileSync('/tmp/kids-salaf-33-listener.js',scripts[0][1]);
          const pre='const SNAPSHOT=',post=';\nconst BATCHES=';
          const begin=scripts[0][1].indexOf(pre);
          const end=scripts[0][1].indexOf(post,begin);
          assert(begin>0&&end>begin);
          const snapshot=JSON.parse(scripts[0][1].slice(begin+pre.length,end));
          assert.equal(snapshot.items.length,33);
          assert.equal(Object.keys(snapshot.entries).length,33);
          const ids=new Set();
          for(const story of snapshot.items){
            assert(!ids.has(story.id),'No duplicate story');
            ids.add(story.id);
            const row=snapshot.entries[story.id];
            assert(row,'Missing exact source audio');
            assert.equal(row.modelId,'eleven_v4');
            assert.equal(row.languageCode,'de');
            assert.equal(row.humanListeningApproved,false,'No fake human approval');
            assert.equal(row.releaseEnabled,false,'No unreviewed live release');
            assert.equal(row.audioSha256.length,64);
            const actual=crypto.createHash('sha256').update(story.masterStoryText).digest('hex');
            assert.equal(actual,row.textSha256,story.id+': exact master-text SHA changed');
            assert.equal(row.timingStatus,'character-alignment-exact');
            assert.equal(row.timings.length,story.masterStoryText.split(/\n{2,}/).length);
            assert.match(row.audioFile,/^kids\/review-only\/salaf-v4-(?:20261027|complete-20261028\/salaf-v4-pending-0[1-8])\/[a-z0-9-]+\.m4a$/);
            assert.match(row._root,/^https:\/\/raw\.githubusercontent\.com\/Sero91ak\/dar-al-tawhid-site\/[a-f0-9]{40}\/$/);
          }
          console.log('PASS: 33 immutable master-audio URLs, 33 original texts and SHA, all paragraph cues, no false release');
          NODE
          node --check /tmp/kids-salaf-33-listener.js
      - name: Verify owner-authorized 33 story previews remain SHA-bound and not human-approved
        shell: bash
        run: |
          set -euo pipefail
          node --check kids/salaf-library-v1.js
          node --check kids/tools/test-salaf-v4-owner-preview-live.cjs
          node kids/tools/test-salaf-v4-owner-preview-live.cjs
          node scripts/kids-master-text-standard-v2-check.js
      - name: Confirm un-gated audio-preview path really triggers canonical Cloudflare publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '      - salaf-v4-33-hoeren-20261028.html' .github/workflows/cloudflare-pages-deploy.yml
          test -s cloudflare/site-router.js
          echo "Root /salaf-v4-33-hoeren-20261028.html is outside /kids/* auth gate; production worker path configured."
      - name: Verify two actual immutable original m4a sources are reachable to users
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('salaf-v4-33-hoeren-20261028.html').read_text()
          text=html.split('const SNAPSHOT=',1)[1].split(';\nconst BATCHES=',1)[0]
          data=json.loads(text)['entries']
          old=next(e for e in data.values() if 'complete-' not in e['audioFile'])
          new=next(e for e in data.values() if 'complete-' in e['audioFile'])
          for n,e in enumerate((old,new)):
              Path(f'/tmp/salaf-audio-url-{n}.txt').write_text(e['_root']+e['audioFile'])
          PY
          for n in 0 1; do
            url="$(cat "/tmp/salaf-audio-url-$n.txt")"
            curl -fsSL --max-time 35 --retry 2 -r 0-2047 "$url" -o "/tmp/salaf-audio-sample-$n.bin"
            test "$(wc -c < "/tmp/salaf-audio-sample-$n.bin")" -ge 2000
          done

  audit-all-33-original-m4a-http-sources:
    runs-on: ubuntu-latest
    needs: independent-33-listener-syntax-data-audit
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 33 ORIGINAL immutable M4A endpoints without ElevenLabs calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/test-salaf-v4-33-remote-audio.py
          python3 kids/tools/test-salaf-v4-33-remote-audio.py
          python3 - <<'PY'
          import json
          with open('salaf-v4-33-remote-http-report.json',encoding='utf-8') as fp: r=json.load(fp)
          assert r['originalAudioCount']==33
          assert r['publicKidsPlaybackApproved'] is False
          assert r['humanListeningCompleted'] is False
          assert r['newGenerationInvoked'] is False
          assert len({e['storyId'] for e in r['entries']})==33
          assert all(e['container']=='mp4-ftyp' and len(e['audioSha256ExpectedFromIndependentProduction'])==64 for e in r['entries'])
          print('PASS 33/33 original M4A HTTP streams available; human hearing still required.')
          PY
      - name: Persist independent nonrelease technical check for central master issue
        uses: actions/upload-artifact@v4
        with:
          name: kids-salaf-v4-33-original-remote-audio-check
          path: salaf-v4-33-remote-http-report.json
          retention-days: 60

  live-https-audition-smoke:
    # Check the ACTUAL Cloudflare production URL, not merely GitHub Pages or Git blobs.
    if: github.event_name == 'push'
    needs: independent-33-listener-syntax-data-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check no-login listening page on public Safari-compatible route
        shell: bash
        run: |
          set -euo pipefail
          url='https://dar-al-tawhid.de/salaf-v4-33-hoeren-20261028.html'
          agent='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          success=0
          for attempt in $(seq 1 12); do
            cb="$(date +%s)-${attempt}"
            code="$(curl -sS -L --max-time 28 -A "$agent" -D /tmp/salaf-headers.txt -o /tmp/salaf-page.html -w '%{http_code}' "${url}?verify=${cb}" || true)"
            if [ "$code" = "200" ] &&
               grep -Fq 'TAWḤĪD KIDS · Audiobibliothek · Hörprüfung' /tmp/salaf-page.html &&
               grep -Fq 'Alle Audios hören und freigeben' /tmp/salaf-page.html &&
               grep -Fq 'const SNAPSHOT=' /tmp/salaf-page.html &&
               ! grep -qi 'www-authenticate:' /tmp/salaf-headers.txt; then
              success=1
              break
            fi
            echo "Live listening page not confirmed yet (attempt ${attempt}: HTTP ${code})"
            sleep 8
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::The public no-login Salaf audio listener is not delivered by canonical Cloudflare Worker."
            exit 1
          fi
          echo "PASS: ${url} returns HTTP 200 with all 33 original audio players, no login challenge."
          registry='https://dar-al-tawhid.de/kids-audio-review-library-v1.json'
          pass=0
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --location --max-time 30 "$registry?check=$(date +%s)-$attempt" -o /tmp/kids-audio-review-live.json &&
               python3 - <<'PY'
          import json
          data=json.load(open('/tmp/kids-audio-review-live.json',encoding='utf-8'))
          assert data['schemaVersion']==1 and data['releaseEnabled'] is False
          assert data['automaticApproval'] is False
          assert len(data['sections'])>=14
          assert sum(s['count'] for s in data['sections'])>=5488
          assert sum(len(s['entries']) for s in data['sections'])>=5455
          print('PASS: live categorized Kids audio index',sum(s['count'] for s in data['sections']))
          PY
            then pass=1; break; fi
            echo "Public audio index pending (attempt $attempt)"
            sleep 8
          done
          test "$pass" -eq 1 || { echo "::error::Full 5488-record Kids audio index not publicly available"; exit 1; }


  validate-canonical-audio-review-library:
    runs-on: ubuntu-latest
    needs: independent-33-listener-syntax-data-audit
    steps:
      - uses: actions/checkout@v4
      - name: Generate full categorized audio manifest without synthesizing or publishing
        run: |
          set -euo pipefail
          node --check scripts/build-kids-audio-review-library.cjs
          node scripts/build-kids-audio-review-library.cjs
          node - <<'NODE'
          const fs=require("fs"),assert=require("node:assert/strict");
          const d=JSON.parse(fs.readFileSync("kids-audio-review-library-v1.json","utf8"));
          assert.equal(d.schemaVersion,1);
          assert.equal(d.automaticApproval,false);
          assert.equal(d.releaseEnabled,false);
          assert(d.sections.length>=13);
          const vals=d.sections.filter(s=>s.id!=="salaf").flatMap(s=>s.entries);
          assert(vals.length>1600,"The original quiz and Dua inventory must be present");
          const keys=new Set(vals.map(v=>v.url.split("?")[0]));
          assert.equal(keys.size,vals.length,"Identical assets cannot be reviewed twice");
          assert(vals.every(v=>v.url.startsWith("/kids/assets/")));
          assert(vals.every(v=>v.originalApproval===false||v.humanListeningApproved===true));
          console.log("PASS: categorized existing audio manifest",d.sections.length,vals.length);
          NODE
      - name: Keep one exact repeatable file as build evidence
        uses: actions/upload-artifact@v4
        with:
          name: kids-audio-review-library-v1
          path: kids-audio-review-library-v1.json
          retention-days: 30

  propose-updated-audio-registry:
    if: github.event_name == 'push'
    needs: validate-canonical-audio-review-library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Prepare snapshot of all existing and future registered Kids originals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/build-kids-audio-review-library.cjs
          if git diff --exit-code -- kids-audio-review-library-v1.json && git ls-files --error-unmatch kids-audio-review-library-v1.json >/dev/null 2>&1; then
            echo "Registry already current. No duplicate PR."
            exit 0
          fi
          branch="bot/kids-audio-review-library-$RUN_ID"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids-audio-review-library-v1.json
          git commit -m "Kids: update categorized immutable review URLs for all canonical audios"
          git push origin "HEAD:refs/heads/$branch"
          if ! gh pr create --head "$branch" --base main \
            --title "KIDS: automatisch erstellten Audio-Prüfkatalog aus allen Originalquellen synchronisieren" \
            --body "Nur JSON-Audioindex aus im Git-Repository vorhandenen Originaldatei-URLs; keine bezahlten ElevenLabs-Aufrufe, keine manuelle Hörfreigabe und keine Änderung am öffentlichen Kinder-Audio-Katalog. Neue Inhalte werden künftig per zentraler Quellenliste aufgenommen."; then
            echo "::notice::GitHub Actions PR-Erstellung ist durch Repository-Einstellungen gesperrt. Der geprüfte Katalog ist im Zweig $branch gesichert; der separate stündliche/tägliche GitHub-Katalog-Auftrag erstellt den PR über das verbundene Benutzerkonto."
          fi

  verify-live-all-categorized-audio-groups:
    if: github.event_name == 'push'
    needs: validate-canonical-audio-review-library
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the real public Cloudflare audio-review catalog loads without login
        shell: bash
        run: |
          set -euo pipefail
          url='https://dar-al-tawhid.de/kids-audio-review-library-v1.json'
          agent='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          code="$(curl -fsSL -A "$agent" --max-time 55 -H 'Cache-Control: no-cache' -o /tmp/kids-review-live.json -w '%{http_code}' "$url?verify=$(date +%s)")"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/kids-review-live.json').read_text(encoding='utf-8'))
          groups=data.get('sections',[])
          if data.get('schemaVersion')!=1 or len(groups)<14:
              raise AssertionError('Live catalog does not contain the full categorized library')
          salaf=[x for x in groups if x['id']=='salaf']
          if len(salaf)!=1 or salaf[0].get('count')!=33:
              raise AssertionError('Salaf reference category missing or changed')
          listed=[y for x in groups if x['id']!='salaf' for y in x.get('entries',[])]
          if len(listed)<5000: raise AssertionError('Full existing audio library is not published')
          if any(not x.get('url','').startswith('/kids/assets/') for x in listed):
              raise AssertionError('Unexpected untrusted audio reference')
          if data.get('releaseEnabled') is True or data.get('automaticApproval') is True:
              raise AssertionError('Technical review inventory must not auto-publish audio')
          print('LIVE PASS: public audio QA index HTTP 200,',len(groups),'separate categories,',len(listed)+33,'referenced originals. No fake approvals.')
          PY

  live-kids-salaf-33-preview:
    if: github.event_name == 'push'
    needs: independent-33-listener-syntax-data-audit
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all 33 previews actually reach the native Kids global production route
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 14); do
            suffix="$(date +%s)-${attempt}"
            manifest_code="$(curl -sSL --max-time 28 -A 'DarAlTawhidKids-iOS' -o /tmp/kids-salaf-preview-live.json -w '%{http_code}' "https://dar-al-tawhid.de/kids/data/salaf-library-v1.json?live-check=${suffix}" || true)"
            js_code="$(curl -sSL --max-time 28 -A 'DarAlTawhidKids-iOS' -o /tmp/kids-salaf-preview-live.js -w '%{http_code}' "https://dar-al-tawhid.de/kids/salaf-library-v1.js?live-check=${suffix}" || true)"
            if [ "$manifest_code" = 200 ] && [ "$js_code" = 200 ] && node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const x=JSON.parse(fs.readFileSync('/tmp/kids-salaf-preview-live.json','utf8'));
          const a=x.items.filter(s=>s.verification==='approved'&&s.editorialRelease===true);
          assert.equal(a.length,33);
          assert.equal(a.filter(s=>s.audioPreview?.ownerAuthorizedPublicPreview&&s.audioPreview?.humanListeningApproved===false&&s.audioMaster===null).length,33);
          assert(x.items.some(s=>s.verification!=='approved'&&!s.audioPreview));
          const js=fs.readFileSync('/tmp/kids-salaf-preview-live.js','utf8');
          assert(js.includes('owner-direct-preview-pending-human-qa'));
          assert(js.includes('HÖRPROBE'));
          console.log('33/33 original owner-authorized Kid previews live; manual hearing remains explicitly pending');
          NODE
            then
              ok=1; break
            fi
            echo "Native Kids 33-preview deployment not yet confirmed (attempt ${attempt}, manifest ${manifest_code}, JS ${js_code})."
            sleep 7
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::33 Kids live previews not served by canonical Cloudflare Worker."
            exit 1
          fi
