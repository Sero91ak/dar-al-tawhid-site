name: KIDS V4 Next50 Real Original MP3s – One Explicit Reviewed Batch

on:
  push:
    branches:
      - review/kids-quiz-v4-batch-001-020-20261014
    paths:
      - 'kids/review-only/quiz-v4-50er-batch04-go.json'

permissions:
  contents: write

concurrency:
  group: tawhid-kids-v4-450-shared-paid-queue
  cancel-in-progress: false

jobs:
  produce-and-import-next-50:
    if: github.repository == 'Sero91ak/dar-al-tawhid-site' && github.ref_name == 'review/kids-quiz-v4-batch-001-020-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Review-only checkout at the explicitly triggered 50er request
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014

      - name: Verify a single explicit 50-original user request, unchanged paid ledger, SHA and maximum budget
        id: campaign
        env:
          KIDS_BATCH04_GO_PATH: kids/review-only/quiz-v4-50er-batch04-go.json
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/generate_quiz_v4_450_paid_batch04.py kids/tools/quiz_v4_paid50_checkpoint.py
          python3 kids/tools/generate_quiz_v4_450_paid_batch04.py --audit
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          go=json.loads(Path(os.environ['KIDS_BATCH04_GO_PATH']).read_text(encoding='utf-8'))
          report=json.loads(Path('kids/review-only/quiz-v4-next50-originals-audit.json').read_text(encoding='utf-8'))
          def blob(path):
              return subprocess.run(['git','rev-parse','HEAD:'+path],check=True,capture_output=True,text=True).stdout.strip()
          assert go['exactBatchId']=='KIDS_V4_450_BATCH_04_50'
          assert go['userRequestedExactly50NewMP3Originals'] is True
          assert go['reviewOnly'] is True and go['liveReleaseAuthorized'] is False
          assert go['modelId']=='eleven_v4' and go['voiceId']=='DkU7j9uO4ZEtLD2iRZSH'
          assert go['maximumEstimatedCredits']==2600
          assert go['approvedRegistryBlobSHA']==blob('kids/data/quiz-v4-450-original-clip-registry.json')
          assert go['approvedPaidLedgerBlobSHA']==blob('kids/data/quiz-v4-450-paid-generation-ledger.json')
          assert report['numberOfOriginalMP3Takes']==50
          assert report['approvalFingerprintSHA256']==go['approvedNext50SHA256']
          assert len(set(report['selectedExactTextSHA256']))==50
          assert report['estimatedCreditsNotInvoice']<=go['maximumEstimatedCredits']
          assert report['newCreditsSpentByAudit']==0 and report['publicAppEnabled'] is False
          assert not Path('kids/data/quiz-v4-450-batch04-attempts.json').exists()
          assert json.loads(Path('kids/data/quiz-curation-release.json').read_text())['enabled'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write('selected_sha='+report['approvalFingerprintSHA256']+'\n')
          print('PASS: exact 50 original MP3s authorized once, with max 2600 estimated credits; no prior paid receipts duplicated')
          PY

      - name: Create up to 50 real ElevenLabs eleven_v4 originals, each backed by a pre-charge GitHub reservation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KIDS_V4_AUTHORIZE_EXACT_50_ORIGINALS: 'YES'
          KIDS_V4_APPROVED_FIFTY_TEXT_SHA256: ${{ steps.campaign.outputs.selected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 kids/tools/generate_quiz_v4_450_paid_batch04.py

      - name: Preserve paid MP3 bytes, SHA receipts and uncertain request markers BEFORE further audio tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          git config user.name tawhid-kids-v4-original-audio-custodian
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A kids/data/quiz-v4-450-original-clip-registry.json kids/data/quiz-v4-450-paid-generation-ledger.json kids/assets/kids-quiz-audio/v4-curated450-review/
          for file in kids/data/quiz-v4-450-batch04-attempts.json kids/data/quiz-v4-450-batch04-usage.json kids/review-only/quiz-v4-next50-originals-audit.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'audio(kids V4): preserve real batch04 50 MP3 originals and unretried paid request receipts'
          for n in 1 2 3 4; do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014;then exit 0;fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            git rebase FETCH_HEAD
          done
          echo '::error::Paid MP3s are in recovery artifact. Never rerun paid synthesis without reconciling.'
          exit 1

      - name: Assemble the 450 review quiz playback mappings from saved genuine V4 originals
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=0 -o DPkg::Lock::Timeout=20 install -y ffmpeg
          fi
          python3 kids/tools/qa_quiz_v4_saved_mp3.py
          python3 kids/tools/quiz_v4_first150_offline_join.py
          python3 kids/tools/quiz_v4_age7to10_offline_join.py
          python3 kids/tools/report_quiz_v4_450_progress.py
          python3 kids/tools/stage_quiz_v4_existing_mp3_import.py
          python3 kids/tools/write_quiz_v4_handover.py
          python3 kids/tools/quiz_v4_selected450_release_gate.py --ignore-flag

      - name: Push only the assembled private 450 quiz review MP3s and progress
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add kids/assets/kids-quiz-audio/v4-first150-composed-review/ kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/data/quiz-v4-first150-composed-preview.json kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/data/quiz-v4-450-production-status.json kids/data/quiz-v4-450-saved-mp3-technical-qa.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          git add kids/review-only/QUIZ-V4-UEBERGABE-AKTUELL.md kids/review-only/quiz-v4-handover-latest.json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'audio(kids V4): import genuine next50 MP3 originals directly to private quiz map, public release off'
          for n in 1 2 3 4; do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014;then exit 0;fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            git rebase FETCH_HEAD
          done
          exit 1

      - name: Preserve originals and receipts on ANY failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tawhid-kids-v4-batch04-50-real-originals-do-not-repurchase
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-curated450-review/
            kids/data/quiz-v4-450-original-clip-registry.json
            kids/data/quiz-v4-450-paid-generation-ledger.json
            kids/data/quiz-v4-450-batch04-attempts.json
            kids/data/quiz-v4-450-batch04-usage.json
            kids/review-only/quiz-v4-next50-originals-audit.json
            kids/data/quiz-v4-age7to10-composed-preview.json
            kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
