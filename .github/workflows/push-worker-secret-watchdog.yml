name: Push Worker Secret Watchdog

# Autonom: wenn dar-admin-publisher Secrets fehlen (z. B. nach Workers Builds),
# Deploy Admin Publisher erneut auslösen → Secret-Sync + Reclaim.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  push-worker-secret-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Worker-Health (OneSignal/Admin) prüfen
        id: health
        run: |
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          set -e
          echo "$HEALTH"
          OK="$(printf '%s' "$HEALTH" | node -e '
            let d="";
            process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              try{
                const j=JSON.parse(d||"{}");
                const ok=!!(j&&j.ok===true&&j.service==="dar-admin-publisher"&&j.hasOneSignalKey===true&&j.hasAdminSecret===true);
                process.stdout.write(ok?"true":"false");
              }catch(e){process.stdout.write("false")}
            });
          ')"
          echo "secrets_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "Ergebnis secrets_ok=$OK"

      - name: Secrets fehlen — Admin-Publisher-Deploy auslösen
        if: steps.health.outputs.secrets_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Push-Watchdog: Worker-Secrets unvollständig — Deploy Admin Publisher Worker wird ausgelöst"
          gh workflow run "Deploy Admin Publisher Worker" --ref main
          echo "Ausgelöst. Secret-Sync läuft im Deploy-Workflow."

      - name: Secrets OK — kein Eingriff
        if: steps.health.outputs.secrets_ok == 'true'
        run: echo "Push-Watchdog: hasOneSignalKey + hasAdminSecret OK — kein Redeploy nötig"
