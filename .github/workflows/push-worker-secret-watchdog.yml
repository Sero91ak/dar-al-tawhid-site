name: Push Worker Secret Watchdog

# Autonom: wenn dar-admin-publisher OneSignal-Secret fehlt (z.B. nach Workers Builds),
# Deploy Admin Publisher erneut ausloesen -> Secret-Sync + Reclaim.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  push-worker-secret-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check worker health for OneSignal secret
        id: health
        run: |
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          set -e
          echo "$HEALTH"
          OK="$(printf '%s' "$HEALTH" | node -e '
            let d="";
            process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              try{
                const j=JSON.parse(d||"{}");
                const ok=!!(j&&j.ok===true&&j.service==="dar-admin-publisher"&&j.hasOneSignalKey===true);
                process.stdout.write(ok?"true":"false");
              }catch(e){process.stdout.write("false")}
            });
          ')"
          echo "secrets_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "Ergebnis secrets_ok=$OK"

      - name: Redeploy admin publisher when OneSignal secret missing
        if: steps.health.outputs.secrets_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Push-Watchdog: hasOneSignalKey fehlt - Deploy Admin Publisher Worker wird ausgeloest"
          gh workflow run "Deploy Admin Publisher Worker" --ref main
          echo "Ausgeloest. Secret-Sync laeuft im Deploy-Workflow."

      - name: OneSignal secret healthy
        if: steps.health.outputs.secrets_ok == 'true'
        run: |
          echo "Push-Watchdog: hasOneSignalKey OK - kein Redeploy noetig"
