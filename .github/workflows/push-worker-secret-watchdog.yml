name: Push Worker Secret Watchdog

# Autonom: wenn dar-admin-publisher Kern-Secrets fehlen (z.B. nach Workers Builds),
# Deploy Admin Publisher erneut ausloesen -> Secret-Sync + Reclaim.
# Deckt GITHUB_TOKEN, ADMIN_PUBLISH_SECRET und OneSignal (Library Live+Push).
on:
  workflow_dispatch:
  schedule:
    # Alle 10 Min – Builds wipen Secrets oft; Sync-Workflow deckt */5 ab
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  push-worker-secret-watchdog:
    runs-on: ubuntu-latest
    steps:
      # gh workflow run braucht ein Checkout (sonst: "not a git repository")
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check worker health for core secrets
        id: health
        run: |
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          set -e
          echo "$HEALTH"
          RESULT="$(printf '%s' "$HEALTH" | node -e '
            let d="";
            process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              try{
                const j=JSON.parse(d||"{}");
                const serviceOk=!!(j&&j.ok===true&&j.service==="dar-admin-publisher");
                const github=!!(j&&j.hasGithubToken===true);
                const admin=!!(j&&j.hasAdminSecret===true);
                const onesignal=!!(j&&j.hasOneSignalKey===true);
                const ok=serviceOk&&github&&admin&&onesignal;
                const missing=[];
                if(!serviceOk) missing.push("service");
                if(!github) missing.push("hasGithubToken");
                if(!admin) missing.push("hasAdminSecret");
                if(!onesignal) missing.push("hasOneSignalKey");
                process.stdout.write(JSON.stringify({ok,missing}));
              }catch(e){process.stdout.write(JSON.stringify({ok:false,missing:["parse"]}))}
            });
          ')"
          OK="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d||"{}").ok?"true":"false")}catch(e){process.stdout.write("false")}})')"
          MISSING="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write((JSON.parse(d||"{}").missing||[]).join(","))}catch(e){process.stdout.write("unknown")}})')"
          echo "secrets_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Ergebnis secrets_ok=$OK missing=$MISSING"

      - name: Redeploy admin publisher when core secrets missing
        if: steps.health.outputs.secrets_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Push-Watchdog: fehlend [${{ steps.health.outputs.missing }}] - Deploy Admin Publisher Worker wird ausgeloest"
          gh workflow run "Deploy Admin Publisher Worker" --ref main
          echo "Ausgeloest. Secret-Sync laeuft im Deploy-Workflow."

      - name: Core secrets healthy
        if: steps.health.outputs.secrets_ok == 'true'
        run: |
          echo "Push-Watchdog: GITHUB_TOKEN + ADMIN_PUBLISH_SECRET + OneSignal OK - kein Redeploy noetig"
