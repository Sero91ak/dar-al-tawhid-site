name: KIDS Lernakademie Pedagogical Contract V1
on:
  pull_request:
    paths:
      - "kids/akademie/index.html"
      - "kids/akademie/curriculum-v*.js"
      - "kids/akademie/LEARNING_ACADEMY_PEDAGOGY_MASTER_V1.md"
      - "kids/tools/audit-academy-learning-quality-v1.cjs"
      - "kids/tools/test-academy-learning-pedagogy-v1.cjs"
      - ".github/workflows/kids-academy-pedagogy-v1.yml"
permissions:
  contents: read
jobs:
  academic-and-qa-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone academy teaching contract and runtime
        run: |
          set -euo pipefail
          node --check kids/tools/audit-academy-learning-quality-v1.cjs
          node --check kids/tools/test-academy-learning-pedagogy-v1.cjs
          node kids/tools/test-academy-learning-pedagogy-v1.cjs
          node kids/tools/audit-academy-learning-quality-v1.cjs > /tmp/kids-academy-pedagogy-audit-v1.json
          node -e 'const d=require("/tmp/kids-academy-pedagogy-audit-v1.json");console.log(JSON.stringify({counts:d.counts,warnings:d.warningCount,errors:d.errorCount}));if(d.errorCount)process.exit(1)'
      - name: Preserve human review as a separate gate
        run: |
          echo "Technical QA only. Editorial Islamic, developmental and acoustic approvals are not automatically granted."
          echo "Use node kids/tools/audit-academy-learning-quality-v1.cjs --strict-content to block until all editorial warnings are resolved."
