name: Frauen Hero Contract
on:
  pull_request:
    paths:
      - 'assets/frauen/**'
      - 'test/assets/frauen/**'
      - 'cloudflare/site-router.js'
      - 'cloudflare/test-app-worker.js'
      - 'scripts/verify-frauen-hero-contract.cjs'
      - 'scripts/check-frauen-fixed-hero-v1408-browser.py'
      - '.github/workflows/check-frauen-hero-contract.yml'
  push:
    branches: [main]
    paths:
      - 'assets/frauen/**'
      - 'test/assets/frauen/**'
      - 'cloudflare/site-router.js'
      - 'cloudflare/test-app-worker.js'
      - 'scripts/verify-frauen-hero-contract.cjs'
      - 'scripts/check-frauen-fixed-hero-v1408-browser.py'
      - '.github/workflows/check-frauen-hero-contract.yml'
jobs:
  verify-frauen-heros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-frauen-hero-contract.cjs
  check-fixed-hero-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual browser driver
        run: python3 -m pip install --quiet selenium
      - name: Check iPhone, Duo and Fold Hero/header/content geometry
        run: python3 scripts/check-frauen-fixed-hero-v1408-browser.py
