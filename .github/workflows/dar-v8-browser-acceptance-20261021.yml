name: DĀR V8 Browser Acceptance
on:
  push:
    branches:
      - review/browser-v8-preview-isolation-20261021
      - fix/v8-immersive-mobile-tablet-20261021
      - fix/browser-v8-visual-audit-1905-20261021
      - fix/v8-quran-player-modal-20261021
      - fix/v8-player-phone-selector-clip-20261021
    paths:
      - 'desktop-preview/**'
      - '.github/workflows/dar-v8-browser-acceptance-20261021.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop-preview/**'
      - '.github/workflows/dar-v8-browser-acceptance-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Every public desktop-preview PR must execute the actual browser matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static integrity and script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('desktop-preview/index.html','utf8');
          const route=fs.readFileSync('desktop-preview/assets/dar-v8-route-platform.js','utf8');
          new Function(route);
          new Function(fs.readFileSync('desktop-preview/assets/dar-v8-portal-live.js','utf8'));
          if(!html.includes('class="v8-player-label"')||!html.includes('id="qaSurah"')||!html.includes('id="qaReciter"'))throw Error('Player DOM contract');
          if(html.includes('maximum-scale=1')||html.includes('user-scalable=no'))throw Error('Website zoom must remain accessible');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(x=>!/(?:^|\s)src\s*=/.test(x[1])&&x[2].trim());
          for(const s of scripts)new Function(s[2]);
          for(const id of ['darV8Sidebar','darV8BreadLabel','darV8TopWelcome','darV8PrayerStrip','darV8MobileDock','darV8MoreSheet','qaAudio','qaReciter','pageRoot']){
            if(!html.includes('id="'+id+'"'))throw Error('Missing '+id);
          }
          if((html.match(/renders\.start=function/g)||[]).length!==1)throw Error('Duplicate homepage renderer');
          if(html.includes('<header class="site-header"'))throw Error('Legacy duplicate desktop header');
          for(const key of ['home','quran','posts','hadith','dua','ilm','library','frauen','prayer','spark','more']){
            if(!fs.existsSync('assets/dar-3d-icons/'+key+'.png'))throw Error('Missing 3D icon '+key);
          }
          console.log('OK: '+scripts.length+' browser scripts, router and all V8 DOM/icon contracts');
          NODE
      - name: Generate canonical adult post indices for browser acceptance
        run: node scripts/build-desktop-posts-index.js
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dar-v8-browser.log 2>&1 &
          sleep 2
      - name: Check desktop premium posts on phone, fold, tablet and desktop
        run: |
          python3 -m pip install --quiet selenium
          python3 scripts/check-desktop-premium-browser.py
      - name: Check actual Chrome DOM and interactions on all viewports
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import os,json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          output='/tmp/dar-v8-acceptance';os.makedirs(output,exist_ok=True)
          opt=Options()
          for flag in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars']:
              opt.add_argument(flag)
          driver=webdriver.Chrome(options=opt)
          routes=['start','quran','beitraege','hadith','wissen','suche','bibliothek','frauen','dua','gebetszeiten','mehr','quiz']
          devices=[('desktop',1440,900),('phone',393,852),('fold',840,900),('tablet-portrait',768,1024),('tablet-landscape',1024,768),('wide',1920,1080)]
          try:
            for device,width,height in devices:
              driver.set_window_size(width,height)
              for page in routes:
                driver.get('http://127.0.0.1:8765/desktop-preview/index.html?page='+page)
                WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.body.dataset.darV8Route===arguments[0] && document.querySelector("#pageRoot")?.innerHTML.length>30',page))
                state=driver.execute_script("""const one=s=>document.querySelector(s), style=s=>getComputedStyle(one(s)).display;
                  return {route:document.body.dataset.darV8Route,
                    overflow:document.documentElement.scrollWidth-innerWidth,
                    side:style('#darV8Sidebar'),dock:style('#darV8MobileDock'),
                    dockLinks:document.querySelectorAll('#darV8MobileDock a').length,
                    hero:one('#pageRoot .dar-v8-route-hero')!==null,
                    welcome:style('#darV8TopWelcome'),
                    prayer:one('#darV8PrayerOverview')!==null,
                    hadith:one('#darV8HadithResults')!==null,
                    chat:one('#darV8ChatForm')!==null};
                """)
                print(json.dumps({'device':device,**state},ensure_ascii=False),flush=True)
                if state['overflow']>4:
                  culprit=driver.execute_script("""return [...document.querySelectorAll('body *')].map(e=>{
                    const r=e.getBoundingClientRect();return {tag:e.tagName,cls:String(e.className||'').slice(0,120),id:e.id,
                    left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),sw:e.scrollWidth,
                    position:getComputedStyle(e).position};
                  }).filter(x=>x.width>0&&x.right>innerWidth+4).sort((a,b)=>b.right-a.right).slice(0,16)""")
                  raise RuntimeError('Horizontal overflow '+str(state)+' elements '+json.dumps(culprit,ensure_ascii=False))
                if state['dockLinks']!=4:raise RuntimeError('Expected four bottom links plus More: '+str(state))
                if (width>=960)!=(state['side']=='flex'):raise RuntimeError('Sidebar breakpoint: '+str(state))
                if (width<960)!=(state['dock']!='none'):raise RuntimeError('Dock breakpoint: '+str(state))
                if page!='start' and not state['hero']:raise RuntimeError('V8 route hero missing: '+page)
                if page!='start' and state['welcome']!='none':raise RuntimeError('Duplicate greeting on '+page)
                if page=='gebetszeiten' and not state['prayer']:raise RuntimeError('Prayer page still legacy')
                if page=='gebetszeiten':
                  prayer=driver.execute_script("""const p=document.getElementById('darV8PrayerOverview'),g=p.querySelector('.dar-v8-prayer-grid'),
                     n=p.querySelector('[data-v8-next-prayer]'),clock=p.querySelector('[data-v8-live-countdown]'),
                     loc=p.querySelector('[data-v8-location]'),rc=g.getBoundingClientRect();
                     return {next:!!n,countdown:!!clock,location:!!loc,columns:getComputedStyle(g).gridTemplateColumns.split(' ').length,
                       right:rc.right,innerWidth:innerWidth};""")
                  if not all(prayer[x] for x in ['next','countdown','location']):raise RuntimeError('Prayer readable widgets missing '+str(prayer))
                  if prayer['right']>prayer['innerWidth']+3:raise RuntimeError('Prayer grid overflows '+str(prayer))

                if page=='hadith' and not state['hadith']:raise RuntimeError('Hadith page missing')
                if page=='suche' and not state['chat']:raise RuntimeError('Chat page missing')
                if page=='quran':
                  launch=driver.find_elements(By.ID,'darV8QuranAudioLaunch')
                  if not launch:raise RuntimeError('Missing single Quran audio launch')
                  legacy=driver.execute_script("return getComputedStyle(document.querySelector('.v8-real-player')).display")
                  if legacy!='none':raise RuntimeError('Duplicate old Quran player visible on reading route: '+legacy)
                if page=='start':
                  WebDriverWait(driver,20).until(lambda d:bool(d.find_elements(By.CSS_SELECTOR,'#darV8Books .dar-v8-publication')))
                  pubs=driver.execute_script("return [...document.querySelectorAll('#darV8Books .dar-v8-publication')].map(a=>({links:a.querySelectorAll('a.desktop-link').length,img:!!a.querySelector('img.dar-v8-book-cover'),height:Math.round(a.getBoundingClientRect().height)}))")
                  if not pubs or not all(x['links']==1 for x in pubs):raise RuntimeError('Real PDF cover cards are not single full clickable cards '+str(pubs))
                  if any(x['height']>260 for x in pubs):raise RuntimeError('Oversize PDF cards '+str(pubs))
                  if len(pubs)>3:raise RuntimeError('Home book count grew unexpectedly '+str(pubs))

                if page=='suche' and not driver.find_elements(By.ID,'darV8Messages'):raise RuntimeError('Messenger history not mounted')
                if page=='suche':
                  geometry=driver.execute_script("""const el=document.querySelector('#pageRoot>.dar-v8-messenger'),r=el.getBoundingClientRect(),
                    search=document.getElementById('siteSearch'),bar=document.querySelector('.dar-v8-topbar'),brand=document.querySelector('.dar-v8-brand-seal');
                    return {left:r.left,right:r.right,width:r.width,inputFont:parseFloat(getComputedStyle(search).fontSize),
                      topbarVisible:getComputedStyle(bar).display!=='none',sealRight:brand?.getBoundingClientRect().right};""")
                  if geometry['inputFont']<16:raise RuntimeError('iPhone input focus zoom risk '+str(geometry))
                  if width<960 and geometry['width']<width*.83:raise RuntimeError('Mobile messenger not full-width '+str(geometry))
                  if not geometry['topbarVisible']:raise RuntimeError('V8 topbar hidden '+str(geometry))
                  if geometry['sealRight'] is None or geometry['sealRight']>width:raise RuntimeError('Brand seal clipped '+str(geometry))
                if page in ['start','suche','gebetszeiten','quran','frauen','hadith','mehr']:
                  driver.save_screenshot(output+'/'+device+'-'+page+'.png')
              driver.get('http://127.0.0.1:8765/desktop-preview/index.html?page=quran')
              WebDriverWait(driver,25).until(lambda d:bool(d.find_elements(By.ID,'darV8QuranAudioLaunch')))
              driver.find_element(By.ID,'darV8QuranAudioLaunch').click()
              WebDriverWait(driver,15).until(lambda d:d.execute_script("return document.body.classList.contains('dar-v8-player-fullscreen')"))
              driver.find_element(By.ID,'darV8PlayerFullscreen').click()
              if driver.execute_script("return document.body.classList.contains('dar-v8-player-fullscreen')"):raise RuntimeError('Quran source player cannot close')
              driver.get('http://127.0.0.1:8765/desktop-preview/index.html?page=start')
              WebDriverWait(driver,25).until(lambda d:bool(d.find_elements(By.ID,'darV8PlayerExpand')))
              driver.execute_script("arguments[0].scrollIntoView({block:'center',inline:'nearest',behavior:'instant'})",driver.find_element(By.ID,'darV8PlayerExpand'))
              driver.find_element(By.ID,'darV8PlayerExpand').click()
              expanded=driver.execute_script("return document.getElementById('darV8PlayerExpand').getAttribute('aria-expanded')")
              if expanded!='true':raise RuntimeError('Mini player expand did not respond')
              driver.execute_script("""
                window.__darPlayerClickAudit=[];
                new MutationObserver(()=>window.__darPlayerClickAudit.push(document.body.className))
                  .observe(document.body,{attributes:true,attributeFilter:['class']});
              """)
              full=driver.find_element(By.ID,'darV8PlayerFullscreen')
              driver.execute_script("""
                window.__darPlayerEventAudit=[];
                document.addEventListener('click',e=>window.__darPlayerEventAudit.push('doc-capture:'+e.target.id),true);
                document.getElementById('darV8PlayerFullscreen').addEventListener('click',
                  e=>window.__darPlayerEventAudit.push('element-target:'+e.target.id));
              """)
              driver.execute_script("document.documentElement.style.scrollBehavior='auto';arguments[0].scrollIntoView({block:'center',behavior:'instant'})",full)
              hit=driver.execute_script("""const b=arguments[0],r=b.getBoundingClientRect(),el=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {rect:{top:r.top,bottom:r.bottom,height:innerHeight},hit:el&&el.className,ok:!!(el&&(el===b||b.contains(el)))}""",full)
              if not hit['ok']:raise RuntimeError('Fullscreen control is obstructed: '+str(hit))
              full.click()
              visible=driver.execute_script("return document.body.classList.contains('dar-v8-player-fullscreen') && getComputedStyle(document.querySelector('.v8-real-player')).display!=='none'")
              if not visible:
                diag=driver.execute_script("""const p=document.querySelector('.v8-real-player'),b=document.getElementById('darV8PlayerFullscreen');
                  return {bodyClass:document.body.className,route:document.body.dataset.darV8Route,
                  playerDisplay:p?getComputedStyle(p).display:'missing',playerVisibility:p?getComputedStyle(p).visibility:'missing',
                  playerRect:p?{width:p.getBoundingClientRect().width,height:p.getBoundingClientRect().height}:null,
                  buttonExpanded:b&&b.getAttribute('aria-expanded'),buttonText:b&&b.textContent,audit:window.__darPlayerClickAudit,eventAudit:window.__darPlayerEventAudit,apiAvailable:!!window.DARV8Portal?.togglePlayer,
                  elementFromPoint:b&&document.elementFromPoint(b.getBoundingClientRect().x+5,b.getBoundingClientRect().y+5)?.className};""")
                raise RuntimeError('Full Quran player did not open: '+str(diag))
              geometry=driver.execute_script("""const p=document.querySelector('.v8-real-player'), b=document.getElementById('darV8PlayerFullscreen'),
                h=p.querySelector('.v8-player-label'), controls=p.querySelector('.qa26-controls'),
                selects=[...p.querySelectorAll('#qaSurah,#qaAyah,#qaReciter')];
                const pr=p.getBoundingClientRect(),br=b.getBoundingClientRect(),hr=h.getBoundingClientRect(),
                  sr=h.querySelector('span')?.getBoundingClientRect();
                return {pw:pr.width,ph:pr.height,pl:pr.left,pr:pr.right,pt:pr.top,pb:pr.bottom,
                  bw:br.width,br:br.right,bl:br.left,bt:br.top,bb:br.bottom,headerTop:hr.top,headerBottom:hr.bottom,
                  spanRight:sr?.right||0,spanLeft:sr?.left||0,spanWidth:sr?.width||0,
                  viewWidth:innerWidth,viewHeight:innerHeight,cols:getComputedStyle(controls).gridTemplateColumns,
                  selectors:selects.map(x=>({visible:getComputedStyle(x).visibility,display:getComputedStyle(x).display,
                    width:x.getBoundingClientRect().width,top:x.getBoundingClientRect().top,bottom:x.getBoundingClientRect().bottom}))};""")
              print(json.dumps({'device':device,'playerModal':geometry},ensure_ascii=False),flush=True)
              if geometry['pl']<-2 or geometry['pr']>geometry['viewWidth']+2 or geometry['pt']<-2 or geometry['pb']>geometry['viewHeight']+2:
                raise RuntimeError('Fullscreen player escapes viewport: '+str(geometry))
              if geometry['ph']>geometry['viewHeight']*.92 and width>=960:
                raise RuntimeError('Huge blank fullscreen panel still present: '+str(geometry))
              if geometry['bt']<geometry['headerTop']-2 or geometry['bb']>geometry['headerBottom']+3:
                raise RuntimeError('Fullscreen button not aligned to player header: '+str(geometry))
              if geometry['br']>geometry['pr']+2 or geometry['bl']<geometry['pl']-2:
                raise RuntimeError('Fullscreen button outside player: '+str(geometry))
              if geometry['spanWidth']>0 and geometry['spanLeft']<geometry['br'] and geometry['spanRight']>geometry['bl']:
                raise RuntimeError('Fullscreen button overlaps Surah subtitle: '+str(geometry))
              if len(geometry['selectors'])!=3 or any(s['width']<65 or s['display']=='none' for s in geometry['selectors']):
                raise RuntimeError('Surah/Ayah/Reciter selector not usable: '+str(geometry))
              if any(s['top']<geometry['pt']-3 or s['bottom']>geometry['pb']+5 for s in geometry['selectors']):
                raise RuntimeError('Fullscreen selector clipped outside its dialog: '+str(geometry))
              driver.save_screenshot(output+'/'+device+'-player-fullscreen.png')
              driver.find_element(By.ID,'darV8PlayerFullscreen').click()
              closed=driver.execute_script("return !document.body.classList.contains('dar-v8-player-fullscreen')")
              if not closed:raise RuntimeError('Full Quran player did not close')
              if width<960:
                driver.find_element(By.ID,'darV8MoreToggle').click()
                visible=driver.execute_script("return document.getElementById('darV8MoreSheet').hidden")
                if visible:raise RuntimeError('More sheet did not open')
                driver.find_element(By.CSS_SELECTOR,'#darV8MoreSheet [data-page="suche"]').click()
                WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.body.dataset.darV8Route==="suche"'))
              else:
                driver.find_element(By.CSS_SELECTOR,'.dar-v8-top-search').click()
                WebDriverWait(driver,25).until(lambda d:d.execute_script('return document.body.dataset.darV8Route==="suche"'))
              chip=driver.find_element(By.CSS_SELECTOR,'[data-v8-ask="Was ist Tawḥīd?"]')
              driver.execute_script("arguments[0].scrollIntoView({block:'center',inline:'nearest',behavior:'instant'})",chip)
              chip.click()
              WebDriverWait(driver,15).until(lambda d:d.execute_script("return document.querySelectorAll('#darV8Messages .dar-v8-bubble.is-user').length>0"))
              answer=driver.execute_script("return {user:document.querySelectorAll('#darV8Messages .dar-v8-bubble.is-user').length,bot:document.querySelectorAll('#darV8Messages .dar-v8-bubble.is-system').length,composer:!!document.getElementById('darV8ChatForm')}")
              if not answer['composer'] or answer['user']<1 or answer['bot']<2:raise RuntimeError('Messenger failed '+str(answer))
              driver.find_element(By.ID,'darV8LangToggle').click()
              driver.find_element(By.CSS_SELECTOR,'#darV8LangMenu [data-lang="tr"]').click()
              lang=driver.execute_script("return localStorage.getItem('darAdultPreferredLocaleV1')")
              if lang!='tr':raise RuntimeError('Seven-language locale menu did not persist')
              driver.get('http://127.0.0.1:8765/desktop-preview/index.html?page=einstellungen')
              WebDriverWait(driver,15).until(lambda d:bool(d.find_elements(By.ID,'darV8LanguageSelect')))
              selected=driver.execute_script("return document.getElementById('darV8LanguageSelect').value")
              if selected!='tr':raise RuntimeError('Language settings did not reflect preference')
              driver.execute_script("document.getElementById('darV8LanguageSelect').value='de';document.getElementById('darV8LanguageSelect').dispatchEvent(new Event('change',{bubbles:true}))")
            print('PASS: all 72 route/device configurations, navigation, More, player and source chat')
          finally:
            driver.quit()
          PY
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-v8-browser-acceptance-shots
          path: /tmp/dar-v8-acceptance/*.png
          retention-days: 7
          if-no-files-found: warn
