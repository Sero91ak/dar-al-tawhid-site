name: Kids Quiz V4 - save final 13 master candidates and assemble 450 private
on:
  push:
    branches:
      - review/kids-v4-final13-candidates-20261023
    paths:
      - kids/review-only/quiz-v4-final13-transfer-20261023.json
permissions:
  contents: write
concurrency:
  group: kids-final13-serhat-v4-private-20261023
  cancel-in-progress: false
jobs:
  import-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-v4-final13-candidates-20261023
          fetch-depth: 2
      - name: Ensure FFmpeg/FFprobe available
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Retrieve 13 already-generated paid master V4 sources, never regenerate
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/import_quiz_v4_final13_candidates_20261023.py
          python3 kids/tools/import_quiz_v4_final13_candidates_20261023.py
      - name: Complete and audit all 450 private review playback composites
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/rebuild_quiz_v4_final13_private_candidates_20261023.py
          python3 kids/tools/rebuild_quiz_v4_final13_private_candidates_20261023.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("kids/review-only/quiz-v4-final13-450-candidate-review/private-candidate-proof.json")
          j=json.loads(path.read_text())
          assert j["candidateQuestionsTechnicallyFourPartComplete"]==450
          assert j["published"] is False and j["humanListeningApproved"] is False
          assert json.loads(Path("kids/data/quiz-curation-release.json").read_text())["enabled"] is False
          print("PRIVATE_450_TECHNICAL_GATE_OK__RELEASE_IS_STILL_OFF")
          PY
      - name: Store private review files and intact newly generated MP3 files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm kids/review-only/quiz-v4-final13-transfer-20261023.json
          git restore -- kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git restore -- kids/data/quiz-v4-450-production-status.json
          git restore -- kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          git add kids/assets/kids-quiz-audio/v4-final13-review/
          git add kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/review-only/quiz-v4-final13-candidate-originals-20261023.json
          git add kids/review-only/quiz-v4-final13-450-candidate-review/
          git commit -m "audio(kids): 450 four-part V4 private candidate preview, retain pronunciation holds and release OFF"
          git push origin HEAD:review/kids-v4-final13-candidates-20261023
      - name: Backup all paid originals and private candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-final13-private-master-backup-20261023
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-final13-review/
            kids/review-only/quiz-v4-final13-candidate-originals-20261023.json
            kids/review-only/quiz-v4-final13-450-candidate-review/
