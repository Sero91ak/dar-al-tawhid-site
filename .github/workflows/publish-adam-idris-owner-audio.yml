name: Publish Adam and Idris owner audio
on:
  push:
    paths:
      - '.github/workflows/publish-adam-idris-owner-audio.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact owner-approved audio
        shell: bash
        env:
          ADAM_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/content_asset/09eXgA6j75Yhsv4zNhwS/asset_preview.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261004%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261004T153503Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
          IDRIS_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/content_asset/6rt4bedJ3m0PAL7hW3gZ/asset_preview.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261004%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261004T153503Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
        run: |
          set -euo pipefail
          mkdir -p kids/assets/prophet-story-audio/adam kids/assets/prophet-story-audio/idris
          curl -fL --retry 3 "$ADAM_URL" -o kids/assets/prophet-story-audio/adam/story.mp3
          curl -fL --retry 3 "$IDRIS_URL" -o kids/assets/prophet-story-audio/idris/story.mp3
          echo "f1e9870c8b182f1d7a564020d26ae02ba1c2750a0ec2ade27efc205499818e19  kids/assets/prophet-story-audio/adam/story.mp3" | sha256sum -c -
          echo "ffd834a2e64a98731603940ff6a0d758e0a5e1eac0f424468836c22acc4818d1  kids/assets/prophet-story-audio/idris/story.mp3" | sha256sum -c -
      - name: Commit permanent audio and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-adam-idris-owner-audio.yml
          git config user.name "DAR AL TAWHID Audio Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add kids/assets/prophet-story-audio/adam/story.mp3 kids/assets/prophet-story-audio/idris/story.mp3 .github/workflows/publish-adam-idris-owner-audio.yml
          git commit -m "kids: publish Adam and Idris owner-approved story audio"
          git push origin HEAD:main
