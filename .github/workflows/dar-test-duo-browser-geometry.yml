name: DĀR Test · Duo Browser Geometry
on:
  pull_request:
    paths:
      - 'test/tools/test-duo-browser-geometry.cjs'
      - 'test/assets/dar-duo-responsive-v1.css'
      - 'test/assets/dar-duo-responsive-v1.js'
      - '.github/workflows/dar-test-duo-browser-geometry.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/tools/test-duo-browser-geometry.cjs
