name: HOME V5 editorial and settings-only UX QA

on:
  push:
    branches:
      - feature/home-editorial-v5-20261118
    paths:
      - home-device/**
      - home-v5.css
      - .github/workflows/home-v4-editorial-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            home-device
            home-v5.css
            .github/workflows/home-v4-editorial-qa.yml
      - name: Stage V5 stylesheet for local browser preview
        run: cp home-v5.css home-device/home-v5.css
      - name: Verify source JavaScript syntax
        run: |
          node --check home-device/home-v3.js
          node --check home-device/home-v4.js
          node --check home-device/home-v6.js
          node --check home-device/home-v7.js
          node --check home-device/home-v7.js
          node - <<'NODE'
          const f=require('fs'),html=f.readFileSync('home-device/index.html','utf8');
          const js=html.split('<script>')[1]?.split('</script>')[0];
          if(!js)throw Error('No inline HOME V2 engine found');
          new Function(js);
          const required=['fajrAdhanTrack','homeAppearance','homeWallpaperMode','homeWallpaperUpload','homeConnectionStatus','home-v4.css','home-v4.js','home-v5.css','h4ShowVerse','h4ShowHadith','openTadabbur','tadabburPanel','saverMode','quranReaderPanel','quranReciterMode','readerTransliteration','openAppearance'];
          for(const key of required)if(!html.includes(key))throw Error('Missing HOME V3 feature: '+key);
          if(html.includes('<nav class="footnav"'))throw Error('Bottom tabs must not exist');
          console.log('HOME V5 source, no-bottom-tabs, settings: PASS');
          NODE
      - name: Verify existing GitHub media are publicly retrievable
        run: |
          python - <<'PY'
          import urllib.request
          base='https://dar-al-tawhid.de'
          paths=[
            '/app-logo-original.png',
            '/assets/dar-3d-icons/home.png',
            '/assets/dar-3d-icons/settings.png',
            '/assets/home-v1194/hero-wide-adobe.jpg',
            '/assets/home-v1194/hero-mobile-adobe.jpg',
            '/assets/home-v1194/study-runway.jpg',
            '/kids/assets/kids-salah-v1262/cinematic-still.jpg',
            '/test/assets/dar-3d-icons/dar-home-cinematic-hero.png',
            '/kids/assets/kids-home-v1191/hero-static-reference.jpg',
            '/test/assets/prayer-motifs/fajr.webp',
            '/test/assets/prayer-motifs/dhuhr.webp',
            '/test/assets/prayer-motifs/asr.webp',
            '/test/assets/prayer-motifs/maghrib.webp',
            '/test/assets/prayer-motifs/isha.webp',
          ]
          errors=[]
          for path in paths:
            try:
              req=urllib.request.Request(base+path,headers={'Range':'bytes=0-4095','User-Agent':'DarHomeQA/3.1'})
              with urllib.request.urlopen(req,timeout=18) as r:
                typ=r.headers.get('Content-Type','')
                sample=r.read(64)
                code=r.status
              print(path,code,typ,'bytes:',len(sample),flush=True)
              if code not in (200,206) or not typ.lower().startswith('image/'):errors.append(path+': unexpected content '+typ)
            except Exception as e:
              print('MEDIA_ERROR',path,type(e).__name__,str(e),flush=True);errors.append(path)
          if errors:raise AssertionError('Unavailable HOME visual sources: '+', '.join(errors))
          PY
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('home-device/media/apple-tv')
          catalog=json.loads((root/'catalog.json').read_text())
          assert len(catalog.get('wallpapers',[]))==10, 'Expected ten curated native backgrounds'
          assert len(catalog.get('adhanMotifs',{}))==5, 'Expected all five native prayer artworks'
          errors=[]
          for item in catalog['wallpapers']:
            for key in ('url','thumbnail'):
              p=item.get(key,'')
              if not p.startswith('/media/apple-tv/') or not (root/p.rsplit('/',1)[-1]).is_file():errors.append(p or item.get('id','missing'))
          for group in ('adhanMotifs','adhanThumbnails'):
            for p in catalog.get(group,{}).values():
              if not (root/p.rsplit('/',1)[-1]).is_file():errors.append(p)
          if errors:raise AssertionError('Catalog references missing bundled images: '+', '.join(errors))
          print('NATIVE_MEDIA_CATALOG',len(catalog['wallpapers']),'wallpapers,',len(catalog['adhanMotifs']),'Adhan masters and thumbnails: PASS')
          PY
      - name: Browser QA dependencies
        run: python -m pip install -q selenium
      - name: Run browser layout and interaction checks
        env:
          HOME_TEST_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --directory home-device >/tmp/home-v4-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          import os,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import Select
          from selenium.common.exceptions import WebDriverException
          opts=Options()
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          for flag in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--hide-scrollbars']:
            opts.add_argument(flag)
          driver=webdriver.Chrome(options=opts)
          url=os.environ['HOME_TEST_URL']
          sizes=[(390,844),(844,390),(430,932),(932,430),(768,1024),(1024,768),(1024,600),(1280,800),(1600,900),(1920,1200),(800,1280)]
          errors=[]
          try:
            for w,h in sizes:
              driver.set_window_size(w,h)
              driver.get(url+'/?qa=home-v3')
              WebDriverWait(driver,25).until(EC.presence_of_element_located((By.ID,'mainScreen')))
              time.sleep(2)
              data=driver.execute_script("""
                const o=id=>document.getElementById(id)?.getBoundingClientRect();
                const names=['mainScreen','nextName','times','dailyDe','audioName','openSettings','audioArea','dailyArea'];
                const boxes={};for(const n of names){const r=o(n);boxes[n]=r?{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}:null}
                return {w:innerWidth,h:innerHeight,scrollW:document.documentElement.scrollWidth,
                  v4:!!document.querySelector('link[href^="/home-v4.css"]'),footerTabs:!!document.querySelector('.footnav'),
                  icons:document.querySelectorAll('.settings-icons').length,theme:document.getElementById('app').dataset.homeTheme,
                  fontSizes:{dailyDe:parseFloat(getComputedStyle(document.getElementById('dailyDe')).fontSize),source:parseFloat(getComputedStyle(document.getElementById('dailySource')).fontSize),counter:parseFloat(getComputedStyle(document.querySelector('.counter')).fontSize),ptime:parseFloat(getComputedStyle(document.querySelector('.prayer-cell .ptime')).fontSize)},lineSpacing:{daily:parseFloat(getComputedStyle(document.getElementById('dailyDe')).lineHeight)/parseFloat(getComputedStyle(document.getElementById('dailyDe')).fontSize),source:parseFloat(getComputedStyle(document.getElementById('dailySource')).lineHeight)/parseFloat(getComputedStyle(document.getElementById('dailySource')).fontSize)},
                  heroRight:{display:getComputedStyle(document.querySelector('.hero-right')).display,width:document.querySelector('.hero-right').getBoundingClientRect().width},
                  prayerArtCount:document.querySelectorAll('.prayer-glyph').length,arabicHomeVisible:[...document.querySelectorAll('.hero-verse,.bismillah,#dailyArabic,.next-arabic')].filter(x=>getComputedStyle(x).display!=='none'&&x.textContent.trim()).length,
                  boxes,wallpaper:getComputedStyle(document.getElementById('app')).backgroundImage}
              """)
              print('VIEWPORT',w,h,data,flush=True)
              if not data['v4'] or data['icons']<7:errors.append(f'{w}x{h}: HOME styling or one of seven settings icons missing')
              if data['footerTabs']:errors.append(f'{w}x{h}: footer tabs must be absent')
              if data['scrollW']>w+3:errors.append(f'{w}x{h}: document horizontal overflow')
              if data['boxes']['audioName']['height']<17:errors.append(f'{w}x{h}: Quran player title clipped')
              if data['fontSizes']['dailyDe']<18:errors.append(f'{w}x{h}: German daily text below 18px')
              if data['fontSizes']['source']<12:errors.append(f'{w}x{h}: source citation below 12px')
              if data['fontSizes']['counter']<14:errors.append(f'{w}x{h}: countdown below 14px')
              if data['fontSizes']['ptime']<19:errors.append(f'{w}x{h}: prayer time below 19px')
              if data['lineSpacing']['daily']<1.3 or data['lineSpacing']['source']<1.2:errors.append(f'{w}x{h}: text line spacing is too tight')
              for n in ['times','dailyArea','audioArea']:
                if data['boxes'][n]['bottom']>h+2:errors.append(f'{w}x{h}: {n} extends beyond the viewport')
              if data['prayerArtCount']!=0:errors.append(f'{w}x{h}: Adhan-only artwork leaked into the five prayer-time cards')
              if data['arabicHomeVisible']!=0:errors.append(f'{w}x{h}: Arabic display calligraphy should be hidden on HOME')
              if h>w and data['heroRight']['display']=='none':errors.append(f'{w}x{h}: portrait hides the daily verse')
              if h>w and data['boxes']['dailyDe']['height']<=0:errors.append(f'{w}x{h}: German daily translation is hidden in portrait')
              if data['boxes']['openSettings']['width']<44:errors.append(f'{w}x{h}: settings touch target below 44px')
              for n in ['mainScreen','nextName','times','audioName','openSettings']:
                box=data['boxes'][n]
                if box is None or box['width']<=0 or box['height']<=0:errors.append(f'{w}x{h}: missing or hidden {n}')
            long_text=driver.execute_script("""
              const article=document.querySelector('.daily-story'),ar=document.getElementById('dailyArabic'),de=document.getElementById('dailyDe'),src=document.getElementById('dailySource');
              const old=[ar.textContent,de.textContent,src.textContent];
              de.textContent=('Eine gut lesbare deutsche Übersetzung mit vollständigem Sinn. ').repeat(18);src.textContent=('Qurʾān · Beispielquelle · ').repeat(12);
              const result={scrollHeight:article.scrollHeight,clientHeight:article.clientHeight,overflow:getComputedStyle(article).overflowY};
              [ar.textContent,de.textContent,src.textContent]=old;return result;
            """)
            print('LONG_DAILY_DARK',long_text,flush=True)
            if long_text['scrollHeight']<=long_text['clientHeight'] or long_text['overflow']!='auto':errors.append('Long daily content is clipped in dark mode')
            driver.set_window_size(1280,800)
            driver.get(url+'/?qa=home-v3')
            WebDriverWait(driver,25).until(EC.element_to_be_clickable((By.ID,'openSettings')))
            external=driver.find_elements(By.CSS_SELECTOR,'.home-nav a,.calendar-card[href]')
            if external:errors.append('HOME section controls must not navigate to another application')
            driver.find_element(By.ID,'openCalendarPanel').click()
            WebDriverWait(driver,8).until(lambda d:d.find_element(By.ID,'calendarPanel').get_attribute('hidden') is None)
            calendar_text=driver.find_element(By.ID,'calendarPanel').text
            if '1. Ramaḍān' not in calendar_text or 'ʿĪd al-Fiṭr' not in calendar_text or '10. Muḥarram' not in calendar_text:errors.append('The local Islamic festival calendar is incomplete')
            driver.find_element(By.CSS_SELECTOR,'#calendarPanel [data-close-home-view]').click()
            driver.find_element(By.CSS_SELECTOR,'[data-home-action="quran"]').click()
            WebDriverWait(driver,10).until(lambda d:d.find_element(By.ID,'quranReaderPanel').get_attribute('hidden') is None)
            WebDriverWait(driver,15).until(lambda d:bool(d.find_element(By.ID,'readerArabic').text.strip()) and bool(d.find_element(By.ID,'readerGerman').text.strip()))
            if not driver.find_element(By.ID,'readerSurah').get_attribute('value'):errors.append('Quran reader did not provide local Surah selection')
            if not driver.find_element(By.ID,'readerReciter').get_attribute('value'):errors.append('Quran reader did not provide reciter selection')
            driver.find_element(By.ID,'readerShowTransliteration').click()
            saved_pref=driver.execute_script("return JSON.parse(localStorage.getItem('dar-home-cinematic-v2')||'{}').readerTransliteration")
            if saved_pref!='hide':errors.append('Quran reader transliteration preference was not saved')
            driver.find_element(By.ID,'readerShowTransliteration').click()
            driver.find_element(By.ID,'closeQuranReader').click()
            print('QURAN_READER_AR_DE_TRANSLITERATION: PASS',flush=True)
            driver.find_element(By.CSS_SELECTOR,'[data-home-action="prayer"]').click()
            driver.find_element(By.CSS_SELECTOR,'[data-home-action="prayer"]').click()
            if 'home-focus' not in driver.find_element(By.ID,'times').get_attribute('class'):errors.append('Prayer navigation does not focus the HOME prayer area')
            print('LOCAL_HOME_NAV calendar/quran/hadith/prayer: PASS',flush=True)
            driver.execute_script("document.activeElement.blur();document.body.tabIndex=-1;document.body.focus();document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}))")
            remote_focus=driver.execute_script("return {id:document.activeElement.id,tag:document.activeElement.tagName,role:document.activeElement.getAttribute('role')}")
            print('TV_REMOTE_ARROW_FOCUS',remote_focus,flush=True)
            if remote_focus['tag']=='BODY':errors.append('TV remote arrow key did not focus a HOME control')
            driver.find_element(By.ID,'openSettings').click()
            settings_layout=driver.execute_script("""
              const nav=document.querySelector('.settings-tabs'),detail=document.querySelector('.tabpage.on');
              const n=nav.getBoundingClientRect(),d=detail.getBoundingClientRect();
              return {direction:getComputedStyle(nav).flexDirection,navWidth:n.width,detailWidth:d.width,navRight:n.right,detailLeft:d.left};
            """)
            print('SETTINGS_LANDSCAPE_LAYOUT',settings_layout,flush=True)
            if settings_layout['direction']!='column' or settings_layout['navWidth']<180 or settings_layout['detailWidth']<400 or settings_layout['detailLeft']<=settings_layout['navRight']:
              errors.append('Landscape settings sidebar and detail view are not separated or usable')
            driver.execute_script("""
              Object.defineProperty(navigator,'geolocation',{configurable:true,value:{getCurrentPosition:ok=>ok({coords:{latitude:52.520008,longitude:13.404954}})}});
              const m=document.getElementById('locationMode');m.value='auto';m.dispatchEvent(new Event('change',{bubbles:true}));
            """)
            WebDriverWait(driver,10).until(lambda d:'Automatisch erkannt' in d.find_element(By.ID,'locationStatus').text)
            geo=driver.execute_script("return {mode:document.getElementById('locationMode').value,city:document.getElementById('city').value,lat:document.getElementById('lat').value,lon:document.getElementById('lon').value}")
            print('LOCATION_AUTO',geo,flush=True)
            if geo['mode']!='auto' or geo['city']!='Mein Standort' or abs(float(geo['lat'])-52.520008)>.00001 or abs(float(geo['lon'])-13.404954)>.00001:errors.append('Automatic location selection did not apply device coordinates')
            driver.execute_script("const m=document.getElementById('locationMode');m.value='manual';m.dispatchEvent(new Event('change',{bubbles:true}));document.getElementById('city').value='Meckenheim';document.getElementById('lat').value='50.6256';document.getElementById('lon').value='6.9491';document.getElementById('tz').value='Europe/Berlin'")
            if driver.find_element(By.ID,'locationMode').get_attribute('value')!='manual':errors.append('Manual location mode cannot be restored')
            if not driver.find_element(By.ID,'locationStatus').text.startswith('Manuelle'):errors.append('Manual location status is unclear')
            tab=driver.find_element(By.CSS_SELECTOR,'button[data-tab="hintergrund"]')
            tab.click()
            assert driver.find_element(By.CSS_SELECTOR,'.tabpage[data-page="hintergrund"]').get_attribute('class').find('on')>=0
            gallery=driver.find_elements(By.CSS_SELECTOR,'#wallpaperOptions button[data-wallpaper]')
            print('GALLERY',len(gallery),flush=True)
            gallery_ids={x.get_attribute('data-wallpaper') for x in gallery}
            expected_wallpapers={'tv-kaaba-day','tv-kaaba-sunrise','tv-kaaba-sunset','tv-kaaba-autumn','tv-kaaba-rain','tv-kaaba-thunderstorm','tv-kaaba-background','tv-kaaba-background-ai','tv-kaaba-mekka-1','tv-kaaba-mekka-2'}
            if len(gallery)<17 or not expected_wallpapers.issubset(gallery_ids):errors.append('Full HOME background gallery is incomplete')
            thumb=driver.find_element(By.CSS_SELECTOR,'#wallpaperOptions [data-wallpaper="tv-kaaba-day"] img')
            if not thumb.get_attribute('src').endswith('tv-kaaba-day-thumb.jpg') or thumb.get_attribute('naturalWidth')!='640':errors.append('Gallery did not use the optimized 640px preview')
            Select(driver.find_element(By.ID,'homeWallpaperMode')).select_by_value('auto')
            auto_bg=driver.execute_script("return getComputedStyle(document.getElementById('app')).backgroundImage")
            print('AUTO_WALLPAPER',auto_bg,flush=True)
            if '/media/apple-tv/tv-kaaba-' not in auto_bg:errors.append('Automatic day/night wallpaper did not select a native scene')
            Select(driver.find_element(By.ID,'homeSaverBackground')).select_by_value('tv-kaaba-sunrise')
            saver_bg=driver.execute_script("return document.getElementById('saver').style.backgroundImage")
            if '/media/apple-tv/tv-kaaba-sunrise.jpg' not in saver_bg:errors.append('Separate screensaver wallpaper was not applied')
            Select(driver.find_element(By.ID,'homeWallpaperMode')).select_by_value('manual')
            if len(gallery)<4:errors.append('Wallpaper gallery did not render')
            if not any(x.get_attribute('data-wallpaper')=='tv-kaaba-day' for x in gallery):errors.append('Native Kaaba wallpaper missing from gallery')
            driver.execute_async_script("""
              const done=arguments[arguments.length-1];
              Promise.all(['/media/apple-tv/tv-kaaba-day.jpg','/media/apple-tv/adhan-fajr.jpg'].map(src=>new Promise(resolve=>{
                const i=new Image();i.onload=()=>resolve({src,ok:true,w:i.naturalWidth});i.onerror=()=>resolve({src,ok:false});i.src=src;
              }))).then(done);
            """)
            media=driver.execute_script("return window.performance.getEntriesByType('resource').filter(x=>x.name.includes('/media/apple-tv/')).map(x=>x.name)")
            print('NATIVE_MEDIA_REQUESTS',media,flush=True)
            if not any('/tv-kaaba-day.jpg' in x for x in media):errors.append('Native wallpaper asset did not load')
            if not any('/adhan-fajr.jpg' in x for x in media):errors.append('Native prayer artwork did not load')
            if not any('/tv-brand-mark.png' in x for x in media):errors.append('Native transparent brand mark did not load')
            brand=driver.find_element(By.CSS_SELECTOR,'.logo-mark img')
            if not brand.get_attribute('src').endswith('/media/apple-tv/tv-brand-mark.png'):errors.append('HOME logo is not using the native transparent mark')
            if float(driver.execute_script("return getComputedStyle(document.querySelector('.logo-mark')).borderWidth").replace('px',''))>0:errors.append('Logo tile border remains visible')
            if gallery:
              native_choice=driver.find_element(By.CSS_SELECTOR,'#wallpaperOptions button[data-wallpaper="tv-kaaba-sunrise"]')
              native_choice.click()
              chosen=native_choice.get_attribute('aria-pressed')
              if chosen!='true':errors.append('Native wallpaper selection not functional')
            Select(driver.find_element(By.ID,'homeAppearance')).select_by_value('light')
            if driver.find_element(By.ID,'app').get_attribute('data-home-theme')!='light':errors.append('Light mode not applied')
            if driver.execute_script("return getComputedStyle(document.getElementById('app')).colorScheme")!='light':errors.append('V5 light color system not applied')
            if driver.execute_script("return getComputedStyle(document.getElementById('dailyDe')).whiteSpace")=='nowrap':errors.append('Daily translation still truncated to one line')
            long_light=driver.execute_script("""
              const article=document.querySelector('.daily-story'),ar=document.getElementById('dailyArabic'),de=document.getElementById('dailyDe'),src=document.getElementById('dailySource');
              const old=[ar.textContent,de.textContent,src.textContent];
              de.textContent=('Eine gut lesbare deutsche Übersetzung mit vollständigem Sinn. ').repeat(18);src.textContent=('Qurʾān · Beispielquelle · ').repeat(12);
              const result={scrollHeight:article.scrollHeight,clientHeight:article.clientHeight,overflow:getComputedStyle(article).overflowY};
              [ar.textContent,de.textContent,src.textContent]=old;return result;
            """)
            print('LONG_DAILY_LIGHT',long_light,flush=True)
            if long_light['scrollHeight']<=long_light['clientHeight'] or long_light['overflow']!='auto':errors.append('Long daily content is clipped in light mode')
            driver.find_element(By.CSS_SELECTOR,'button[data-tab="anzeige"]').click()
            Select(driver.find_element(By.ID,'theme')).select_by_value('night')
            if driver.find_element(By.ID,'homeAppearance').get_attribute('value')!='dark':errors.append('Legacy dark appearance selector did not synchronize')
            Select(driver.find_element(By.ID,'theme')).select_by_value('ivory')
            if driver.find_element(By.ID,'homeAppearance').get_attribute('value')!='light':errors.append('Legacy light appearance selector did not synchronize')
            driver.find_element(By.CSS_SELECTOR,'button[data-tab="inhalte"]').click()
            WebDriverWait(driver,20).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'#surah option'))==114)
            if len(driver.find_elements(By.CSS_SELECTOR,'#quranPlaybackMode option'))!=2 or len(driver.find_elements(By.CSS_SELECTOR,'#quranPlaybackScope option'))!=2:errors.append('Quran manual/automatic and all/single controls missing')
            driver.find_element(By.ID,'closeSettings').click()
            driver.find_element(By.ID,'openSurahPicker').click()
            WebDriverWait(driver,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'#surahList [role=option]'))>0)
            driver.find_element(By.ID,'surahSearch').send_keys('Al-Fati')
            WebDriverWait(driver,10).until(lambda d:len(d.find_elements(By.CSS_SELECTOR,'#surahList [role=option]'))==1)
            driver.find_element(By.CSS_SELECTOR,'#surahList [role=option]').click()
            if driver.find_element(By.ID,'surah').get_attribute('value')!='1':errors.append('Surah quick picker did not update the Quran player selection')
            driver.find_element(By.ID,'openSettings').click()
            driver.find_element(By.CSS_SELECTOR,'button[data-tab="inhalte"]').click()
            Select(driver.find_element(By.ID,'quranPlaybackScope')).select_by_value('single')
            if driver.execute_script("return JSON.parse(localStorage.getItem('dar-home-cinematic-v2')||'{}').quranPlaybackScope")!='single':errors.append('Selected-Sūrah playback scope did not save')
            Select(driver.find_element(By.ID,'quranPlaybackScope')).select_by_value('all')
            driver.find_element(By.CSS_SELECTOR,'button[data-tab="hintergrund"]').click()
            driver.find_element(By.ID,'homeReduceMotion').click()
            if 'reduced-motion' not in driver.find_element(By.ID,'app').get_attribute('class'):errors.append('Reduced motion preference did not apply')
            animation=driver.execute_script("return parseFloat(getComputedStyle(document.querySelector('.saver-content')).animationDuration)")
            if animation>=.001:errors.append('Reduced motion did not disable entrance animation')
            driver.find_element(By.ID,'saveSettings').click()
            driver.refresh()
            WebDriverWait(driver,15).until(EC.presence_of_element_located((By.ID,'app')))
            time.sleep(1)
            saved=driver.execute_script("return JSON.parse(localStorage.getItem('dar-home-v3-preferences')||'{}')")
            print('PERSISTED_HOME_PREFS',saved,flush=True)
            if saved.get('theme')!='light' or saved.get('wallpaperMode')!='manual' or saved.get('wallpaper')!='tv-kaaba-sunrise' or saved.get('saverWallpaper')!='tv-kaaba-sunrise' or saved.get('reduceMotion') is not True:errors.append('Appearance and independent wallpaper selections did not persist')
            if driver.find_element(By.ID,'app').get_attribute('data-home-theme')!='light':errors.append('Saved light appearance did not restore after reload')
            if 'reduced-motion' not in driver.find_element(By.ID,'app').get_attribute('class'):errors.append('Reduced motion did not persist after reload')
            driver.find_element(By.ID,'openSettings').click()
            driver.find_element(By.CSS_SELECTOR,'button[data-tab="adhan"]').click()
            opts_f=driver.find_elements(By.CSS_SELECTOR,'#fajrAdhanTrack option')
            opts_r=driver.find_elements(By.CSS_SELECTOR,'#adhanTrack option')
            print('ADHAN_OPTIONS',len(opts_f),len(opts_r),flush=True)
            driver.find_element(By.ID,'previewAdhan').click()
            WebDriverWait(driver,10).until(lambda d:'Hörprobe' in d.find_element(By.CSS_SELECTOR,'#adhanVisual .adhan-title').text)
