name: Besucher Header – Ein-Zeilen-Vertrag
on:
  push:
    branches: [main]
    paths:
      - 'assets/dar-visitor-profile-picker-v1.css'
      - 'assets/dar-adult-brand-header-v2.js'
      - 'test/assets/dar-test-premium-header-v2.css'
      - 'test/assets/dar-test-premium-header-v2.js'
      - 'test/assets/ilm-research-chat.js'
      - 'scripts/check-fixed-header-occlusion.cjs'
      - 'scripts/check-fixed-header-occlusion-browser.py'
      - 'scripts/check-adult-hero-seam.cjs'
      - 'scripts/check-adult-hero-seam-browser.py'
      - 'scripts/check-adult-hero-route-matrix.cjs'
      - 'scripts/check-adult-hero-route-matrix-browser.py'
      - 'assets/adult-immersive-hero-v1.css'
      - 'test/assets/adult-immersive-hero-v1.css'
      - 'scripts/check-adult-duo-prayer-layout.cjs'
      - 'assets/dar-home-test-parity-visitor.js'
      - 'test/assets/dar-home-html-parity-v1.js'
      - 'cloudflare/test-app-worker.js'
      - 'assets/dar-visitor-daily-hub-v1.js'
      - 'assets/dar-visitor-onboarding-v1.js'
      - 'assets/dar-visitor-onboarding-v1.css'
      - 'assets/dar-more-final-v15.js'
      - 'assets/dar-more-v15.js'
      - 'scripts/check-visitor-more-responsive.cjs'
      - 'assets/dar-visitor-profile-picker-v1.js'
      - 'assets/dar-adult-brand-header-v2.css'
      - 'assets/dar-home-test-parity-visitor.js'
      - 'cloudflare/site-router.js'
      - 'ios/DarAlTawhid/DarAlTawhid/WebAppView.swift'
      - 'test/assets/dar-test-premium-header-v2.js'
      - 'scripts/check-visitor-header-single-row.cjs'
      - '.github/workflows/visitor-header-single-row.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/dar-visitor-profile-picker-v1.css'
      - 'assets/dar-adult-brand-header-v2.js'
      - 'test/assets/dar-test-premium-header-v2.css'
      - 'test/assets/dar-test-premium-header-v2.js'
      - 'test/assets/ilm-research-chat.js'
      - 'scripts/check-fixed-header-occlusion.cjs'
      - 'scripts/check-fixed-header-occlusion-browser.py'
      - 'scripts/check-adult-hero-seam.cjs'
      - 'scripts/check-adult-hero-seam-browser.py'
      - 'scripts/check-adult-hero-route-matrix.cjs'
      - 'scripts/check-adult-hero-route-matrix-browser.py'
      - 'assets/adult-immersive-hero-v1.css'
      - 'test/assets/adult-immersive-hero-v1.css'
      - 'scripts/check-adult-duo-prayer-layout.cjs'
      - 'assets/dar-home-test-parity-visitor.js'
      - 'test/assets/dar-home-html-parity-v1.js'
      - 'cloudflare/test-app-worker.js'
      - 'assets/dar-visitor-daily-hub-v1.js'
      - 'assets/dar-visitor-onboarding-v1.js'
      - 'assets/dar-visitor-onboarding-v1.css'
      - 'assets/dar-more-final-v15.js'
      - 'assets/dar-more-v15.js'
      - 'scripts/check-visitor-more-responsive.cjs'
      - 'assets/dar-visitor-profile-picker-v1.js'
      - 'assets/dar-adult-brand-header-v2.css'
      - 'assets/dar-home-test-parity-visitor.js'
      - 'cloudflare/site-router.js'
      - 'ios/DarAlTawhid/DarAlTawhid/WebAppView.swift'
      - 'test/assets/dar-test-premium-header-v2.js'
      - 'scripts/check-visitor-header-single-row.cjs'
      - '.github/workflows/visitor-header-single-row.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check visitor header layout, controls and cache versions
        run: |
          node scripts/check-visitor-header-single-row.cjs
          node scripts/check-visitor-more-responsive.cjs
          node scripts/check-fixed-header-occlusion.cjs
          node scripts/check-adult-hero-seam.cjs
          node scripts/check-adult-hero-route-matrix.cjs
          node scripts/check-adult-duo-prayer-layout.cjs

  browser-hit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test driver
        run: python3 -m pip install --quiet selenium
      - name: Test actual Chromium hit areas at five device viewports (Test and Visitor)
        run: |
          python3 scripts/check-fixed-header-occlusion-browser.py
          python3 scripts/check-adult-hero-seam-browser.py
          python3 scripts/check-adult-hero-route-matrix-browser.py
