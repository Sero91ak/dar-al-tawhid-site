name: Materialize Hadith CGI v1266

on:
  push:
    paths:
      - .github/workflows/materialize-hadith-cgi-v1266.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated Hadith CGI assets
        env:
          OVERVIEW_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/b6c33971-7f4e-4472-b7c8-032316f0b280/Single_standalone_wide_cinematic_historical_CGI_scene_for_an_Islamic_hadith_library_interface__set_r_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjZkYzBjZmY3ZDAzZTM4NCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMxNDU1OX0.EVtMGOwaX7h6cNVBkJHZ4qM6DwBlEPbAD4uBaOP4_MU"
          NESTED_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/245f60c5-fc9f-455b-bdc5-3084c5d74a53/Wide_cinematic_historical_CGI_scene_for_a_premium_Islamic_hadith_study_app__set_roughly_in_the_9th_1_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDI0NGRjNTM5ZjQ2ZTdiZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTI5NjA4M30.FWgNdX6JkN8r2Q7UWzUycfPSca2FKZcxQ0_lKza3xyg"
        run: |
          set -euo pipefail
          mkdir -p test/assets/ilm
          curl -fL --retry 3 --retry-delay 2 "$OVERVIEW_URL" -o test/assets/ilm/hadith-library-overview-v1266.png
          curl -fL --retry 3 --retry-delay 2 "$NESTED_URL" -o test/assets/ilm/hadith-library-study-v1266.png
          test -s test/assets/ilm/hadith-library-overview-v1266.png
          test -s test/assets/ilm/hadith-library-study-v1266.png

      - name: Replace expiring URLs with stable app assets
        env:
          OVERVIEW_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/b6c33971-7f4e-4472-b7c8-032316f0b280/Single_standalone_wide_cinematic_historical_CGI_scene_for_an_Islamic_hadith_library_interface__set_r_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjZkYzBjZmY3ZDAzZTM4NCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMxNDU1OX0.EVtMGOwaX7h6cNVBkJHZ4qM6DwBlEPbAD4uBaOP4_MU"
          NESTED_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/245f60c5-fc9f-455b-bdc5-3084c5d74a53/Wide_cinematic_historical_CGI_scene_for_a_premium_Islamic_hadith_study_app__set_roughly_in_the_9th_1_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDI0NGRjNTM5ZjQ2ZTdiZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTI5NjA4M30.FWgNdX6JkN8r2Q7UWzUycfPSca2FKZcxQ0_lKza3xyg"
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['test/index.html','test/assets/ilm-hadith-v1243.css'];
          for(const file of files){
            if(!fs.existsSync(file)) continue;
            let s=fs.readFileSync(file,'utf8');
            s=s.split(process.env.OVERVIEW_URL).join('/test/assets/ilm/hadith-library-overview-v1266.png');
            s=s.split(process.env.NESTED_URL).join('/test/assets/ilm/hadith-library-study-v1266.png');
            fs.writeFileSync(file,s);
          }
          const vf='test/version.json';
          const v=JSON.parse(fs.readFileSync(vf,'utf8'));
          v.buildId='app-shell-v1266';
          v.appBuildId='app-shell-v1266';
          v.note='v1266 · Historische Ḥadīṯ-CGI-Motive als feste App-Assets gespeichert; Übersicht sowie Werk/Kitāb/Bāb/Detail bleiben ohne ablaufende externe Bild-URLs stabil.';
          v.updatedAt=new Date().toISOString();
          fs.writeFileSync(vf,JSON.stringify(v,null,2)+'\n');
          NODE

      - name: Commit stable Hadith assets and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-hadith-cgi-v1266.yml
          git add test/index.html test/version.json test/assets/ilm-hadith-v1243.css test/assets/ilm/hadith-library-overview-v1266.png test/assets/ilm/hadith-library-study-v1266.png
          git commit -m "test: materialize stable Hadith CGI assets v1266"
          git push origin HEAD:main
