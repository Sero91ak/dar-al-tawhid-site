name: Import Kids Cinema Masters V68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kids-cinema-masters-v68.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download original cinema masters
        env:
          S1: "https://at.adobe.com/TRgQ2rWaVQ5SL9m1"
          S2: "https://at.adobe.com/q32FgGRSVi5pRYDc"
          S3: "https://at.adobe.com/dNjkatKRr0uYNvbC"
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-cinema/masters
          curl -L --fail --retry 4 --retry-delay 2 "$S1" -o kids/assets/kids-cinema/masters/scene-1.png
          curl -L --fail --retry 4 --retry-delay 2 "$S2" -o kids/assets/kids-cinema/masters/scene-2.png
          curl -L --fail --retry 4 --retry-delay 2 "$S3" -o kids/assets/kids-cinema/masters/scene-3.png
          file kids/assets/kids-cinema/masters/scene-*.png
          for f in kids/assets/kids-cinema/masters/scene-*.png; do
            test "$(wc -c < "$f")" -gt 1000000
          done
      - name: Commit masters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/kids-cinema/masters
          if git diff --cached --quiet; then
            echo "Masters already current."
            exit 0
          fi
          git commit -m "Kids V0.68: restore original high-resolution cinema masters"
          git push origin HEAD:main
