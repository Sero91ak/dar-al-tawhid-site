name: KIDS Academy full Salam public and DAR TEST HTTP smoke 20261029
on:
  pull_request:
    paths:
      - ".github/workflows/kids-academy-full-salam-http-smoke-20261029.yml"
permissions:
  contents: read
jobs:
  verify-full-salam-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Real live HTTP check for both released applications
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time
          paths=[
            ("KIDS BESUCHER","https://dar-al-tawhid.de/kids/akademie/index.html"),
            ("DAR TEST KIDS","https://dar-al-tawhid-test.sero91ak.workers.dev/kids/akademie/index.html"),
          ]
          expected=[
            "As-Salāmu ʿalaykum wa Raḥmatullāhi wa Barakātuh.",
            'id="overviewAddress"',
            'id="welcomeAddress"',
            'const spokenSalam=ACADEMY_FULL_SALAM;',
            'const greetingAddress=',
            'textContent=greetingAddress();'
          ]
          headers={"User-Agent":"DarAlTawhidKids-iOS CreatorTest","Cache-Control":"no-cache","Pragma":"no-cache"}
          for label,base in paths:
            for attempt in range(1,26):
              try:
                url=base+"?qa-full-salam="+str(int(time.time()))+"-"+str(attempt)
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=25) as res:
                  status=res.status
                  html=res.read().decode("utf-8")
                if status!=200:raise RuntimeError("HTTP "+str(status))
                missing=[x for x in expected if x not in html]
                if missing:raise RuntimeError("Old/missing full Salam markers "+repr(missing))
                if 'As-salāmu ʿalaykum, lieber Bruder.' in html:
                  raise RuntimeError("Old abbreviated profile greeting still in active Academy")
                print("PASS",label,"HTTP 200",len(html),"bytes; all",len(expected),"full-Salam markers confirmed",flush=True)
                break
              except Exception as exc:
                print(label,"check",attempt,"not yet published:",str(exc)[:180],flush=True)
                if attempt==25:raise
                time.sleep(6)
          PY