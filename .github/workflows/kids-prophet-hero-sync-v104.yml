      - name: Validate and convert for app
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          targets=["nuh","lut","ismail","ishaq","yaqub","yusuf","ayyub","shuayb","musa","harun","dhul-kifl","dawud","sulayman","ilyas","alyasa","yunus","zakariyya","yahya","isa","muhammad"]
          src=Path(".hero-sync")
          out=Path("kids/assets/prophets-v2")
          out.mkdir(parents=True,exist_ok=True)
          for slug in targets:
              p=src/f"{slug}.png"
              if not p.exists() or p.stat().st_size < 100_000:
                  raise SystemExit(f"Missing/too-small source: {p}")
              im=Image.open(p).convert("RGB")
              w,h=im.size
              ratio=w/h
              if w < 1800 or h < 700:
                  raise SystemExit(f"Resolution too low for {slug}: {w}x{h}")
              if not (2.20 <= ratio <= 2.45):
                  raise SystemExit(f"Unexpected aspect ratio for {slug}: {w}x{h} ({ratio:.3f})")
              dst=out/f"{slug}-hero.jpg"
              im.save(dst,"JPEG",quality=95,subsampling=0,optimize=True,progressive=True)
              print(f"{slug}: {w}x{h} -> {dst} ({dst.stat().st_size} bytes)")
          PY

      - name: Commit premium hero batch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/prophets-v2/*-hero.jpg
          if git diff --cached --quiet; then
            echo "Hero assets already current."
            exit 0
          fi
          git commit -m "Kids: finish premium 25-Prophet detail hero rollout"
          git pull --rebase origin main
          git push origin HEAD:main
