name: Kids Prophet Hero Sync v1.04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kids-prophet-hero-sync-v104.yml'

permissions:
  contents: write

concurrency:
  group: kids-prophet-hero-sync-v104
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download remaining premium Prophet heroes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hero-sync
          download() {
            slug="$1"
            url="$2"
            echo "Downloading $slug"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 "$url" -o ".hero-sync/$slug.png"
          }
          download 'nuh' 'https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/176fa3da-2217-4044-818e-2b07ac3d27ab/PROPHET_ID_nuh__Create_a_dedicated_premium_21_9_4K_DETAIL_HERO_from__reference_for_the_same_Prophet__0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDViYjhmYmMyNDQ2NGU2OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTA0OTUzMn0.2xbZ1gjKrmzTuHfHU--b3mB3SH0ZmLT4MYAsVAMx8Rk'
