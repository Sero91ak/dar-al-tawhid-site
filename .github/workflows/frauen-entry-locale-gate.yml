name: Frauen – Neun Sprachen, dieselbe Beitrags-ID, kein Auto-Q
on:
  pull_request:
    paths:
      - 'assets/frauen/frauen-entry-*'
      - 'data/frauen-*.json'
      - 'q/_registry/shortlinks.json'
      - 'cloudflare/site-router.js'
      - 'scripts/check-frauen-entry-locales.cjs'
      - 'scripts/check-frauen-batch16.cjs'
      - 'scripts/test-frauen-batch16-reader.cjs'
      - 'scripts/test-frauen-batch16-localization.cjs'
      - 'scripts/test-frauen-batch16-image-share.cjs'
      - 'scripts/test-frauen-batch16-learning.cjs'
      - 'scripts/test-frauen-batch16-browser.cjs'
      - 'assets/frauen/frauen-learning-v1.js'
      - 'assets/frauen/frauen-learning-v1.css'
      - 'lernen/frauen-wissen/index.html'
      - 'content/focus-feed/feed-index.json'
      - 'content/staging/focus-feed/feed-index.json'
      - 'scripts/verify-frauen-batch16-live.cjs'
      - 'assets/frauen/frauen-fiqh.js'
      - 'assets/frauen/frauen-entry-locale-v1.js'
      - 'content/admin/frauen-batch-16-2026-11-18.json'
      - 'content/admin/frauen-batch16-locales-draft-20261118.json'
      - '.github/workflows/frauen-entry-locale-gate.yml'
  push:
    branches: [main]
    paths:
      - 'assets/frauen/frauen-entry-*'
      - 'data/frauen-*.json'
      - 'q/_registry/shortlinks.json'
      - 'cloudflare/site-router.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-nine-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vollständige Sprachen und identische Quellen/Beitrags-ID prüfen
        run: node scripts/check-frauen-entry-locales.cjs
      - name: Frauen 16 · vollständige Struktur und Sprachen (nur Vorbereitung)
        run: node scripts/check-frauen-batch16.cjs prepare
      - name: Frauen 16 · echte Leserouten im Speicher simulieren, ohne Freischaltung
        run: node scripts/test-frauen-batch16-reader.cjs
      - name: Frauen 16 · alle 144 Sprachwechsel für Karte und Leser simulieren
        run: node scripts/test-frauen-batch16-localization.cjs
      - name: Frauen 16 · alle 144 Bildexporte einschließlich RTL und vollständiger Texte prüfen
        run: node scripts/test-frauen-batch16-image-share.cjs
      - name: Frauen 16 · 576 Lernfragen plus 48h-Neufokus ohne vorzeitige Freigabe prüfen
        run: node scripts/test-frauen-batch16-learning.cjs
      - name: Frauen 16 · öffentliche Live-Nachweisroutine syntaktisch prüfen (kein Deploy)
        run: node --check scripts/verify-frauen-batch16-live.cjs

  interactive-browser:
    name: Frauen 16 · echte Lerninteraktion (Chromium)
    needs: canonical-nine-languages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright Chromium installieren
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: 16 × 9 Lernseiten · vier Viewportklassen · keine Veröffentlichung
        run: node scripts/test-frauen-batch16-browser.cjs
