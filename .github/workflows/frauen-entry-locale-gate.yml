name: Frauen – Neun Sprachen, dieselbe Beitrags-ID, kein Auto-Q
on:
  pull_request:
    paths:
      - 'assets/frauen/frauen-entry-*'
      - 'data/frauen-*.json'
      - 'q/_registry/shortlinks.json'
      - 'cloudflare/site-router.js'
      - 'scripts/check-frauen-entry-locales.cjs'
      - 'assets/frauen/frauen-neufokus-v1.*'
      - 'assets/frauen/frauen-learning-v1.js'
      - 'content/admin/frauen-batch-16-2026-11-18.json'
      - 'content/focus-feed/feed-index.json'
      - 'lernen/frauen-wissen/index.html'
      - 'scripts/test-frauen-batch16-neufokus*.cjs'
      - '.github/workflows/frauen-entry-locale-gate.yml'
  push:
    branches: [main]
    paths:
      - 'assets/frauen/frauen-entry-*'
      - 'data/frauen-*.json'
      - 'q/_registry/shortlinks.json'
      - 'cloudflare/site-router.js'
      - 'assets/frauen/frauen-neufokus-v1.*'
      - 'assets/frauen/frauen-desktop-entry-v1.js'
      - 'content/focus-feed/feed-index.json'
      - 'scripts/test-frauen-batch16-neufokus*.cjs'
      - 'scripts/test-frauen-batch16-home-live-browser.cjs'
      - 'scripts/test-frauen-android-native-live-browser.cjs'
      - 'scripts/test-frauen-global-surfaces-live-browser.cjs'
      - '.github/workflows/frauen-entry-locale-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-nine-languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vollständige Sprachen und identische Quellen/Beitrags-ID prüfen
        run: node scripts/check-frauen-entry-locales.cjs

  release-home-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 16er-Fokus, globale Profile, Quellen- und Zeitfenster-Gates
        run: node scripts/test-frauen-batch16-neufokus.cjs
      - name: Chromium installieren
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Fokus-JavaScript und öffentlichen Direktleser auf Syntax prüfen
        run: |
          node --check assets/frauen/frauen-neufokus-v1.js
          node --check assets/frauen/frauen-desktop-entry-v1.js
      - name: 16er-Einzelartikellinks, neun Sprachen, vier Geräteklassen
        run: node scripts/test-frauen-batch16-neufokus-browser.cjs
      - name: Öffentliche Website in echtem Chromium überprüfen (#pageRoot)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/test-frauen-batch16-home-live-browser.cjs
      - name: Produktive Android-native Startseite und 16-Artikel-Leser testen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/test-frauen-android-native-live-browser.cjs
      - name: Globaler iOS-Native, DĀR-TEST, iPad und installierte Android-PWA – echte Live-Prüfung
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/test-frauen-global-surfaces-live-browser.cjs

  production-16-live-proof:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Echte öffentliche 16er-Beiträge, 144 Sprachfassungen und Originalreader prüfen
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const f=require('./content/focus-feed/feed-index.json'); if(!f.items.some(x=>x.id==='neufokus-frauenwissen-16-20261118'&&x.status==='live'))process.exit(1)"; then
            node scripts/verify-frauen-batch16-live.cjs --expect-focus
          else
            node scripts/verify-frauen-batch16-live.cjs
          fi
