name: Deploy Dar Test App

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - test/**
      - assets/**
      - content/posts/**
      - content/duas/**
      - content/staging/**
      - content/quran/**
      - content/updates/current.json
      - content/updates/daily.json
      - data/**
      - admin/index.html
      - admin/library-*.js
      - admin/library-admin.css
      - admin/quiz-stats-manager.js
      - service-worker.js
      - manifest*.json
      - wrangler.test.toml
      - cloudflare/test-app-worker.js
      - scripts/ilm-open-research-test.mjs
      - cloudflare/ilm-science-policy.js
      - cloudflare/ilm-gemini-bridge.js
      - cloudflare/ilm-openai-research.js
      - scripts/ilm-compose-fallback-test.mjs
      - scripts/ilm-multi-provider-test.mjs
      - cloudflare/ilm-gemini-open-research.js
      - cloudflare/preview-gate.js
      - scripts/cf-pages-build.js
      - scripts/sync-app-build-ids.js
      - scripts/overlay-test-staging-from-branch.js
      - scripts/app-stability-guard.js
      - scripts/app-stability-repair.js
      - scripts/library-deploy-guard.js
      - scripts/library-deploy-repair.js
      - scripts/test-app-health-check.js
      - scripts/verify-test-app-deploy.js
      - scripts/purge-cloudflare-cache.js
      - scripts/purge-test-kids-cache.js
      - package.json
      - _headers
      - .assetsignore
      - .github/workflows/deploy-test-app.yml

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Test-App Staging aus test-library-canonical übernehmen
        run: |
          git fetch origin test-library-canonical
          node scripts/overlay-test-staging-from-branch.js
          node scripts/app-stability-repair.js

      - name: Build + Build-IDs synchronisieren
        run: npm run build

      - name: Dar Test Health Check
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          node --check cloudflare/test-app-worker.js
          node --check cloudflare/ilm-gemini-open-research.js
          node --check cloudflare/ilm-openai-research.js
          node --check test/assets/ilm-research-chat.js
          node scripts/ilm-open-research-test.mjs
          node scripts/ilm-multi-provider-test.mjs
          node scripts/ilm-compose-fallback-test.mjs
          node scripts/test-app-health-check.js
          node scripts/library-deploy-guard.js
          node scripts/app-stability-guard.js
          node scripts/push-system-guard.js
          node scripts/push-lanes-guard.js

      - name: Deploy Dar Test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.test.toml

      - name: Live-Routen von dar-al-tawhid-kids auf /kids löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/delete-kids-worker-routes.js
        continue-on-error: true

      - name: Öffentliche /test*-Route an Dar-Test-Worker binden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          export ZONE="${CLOUDFLARE_ZONE_ID:-0e4c0fdfaca4f3fa137de3a67ac8a68b}"
          export ROUTE_PATTERN="dar-al-tawhid.de/test*"
          export ROUTE_SCRIPT="dar-al-tawhid-test"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-routes.json

          ROUTE_ID="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.id?String(route.id):"");
          ')"
          ROUTE_OWNER="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.script?String(route.script):"");
          ')"

          if [ -n "${ROUTE_ID}" ] && [ "${ROUTE_OWNER}" = "${ROUTE_SCRIPT}" ]; then
            echo "Dar-Test-Route bereits korrekt: ${ROUTE_PATTERN} → ${ROUTE_SCRIPT}"
          else
            if [ -n "${ROUTE_ID}" ]; then
              echo "Ersetze falsche Route: ${ROUTE_PATTERN} → ${ROUTE_OWNER:-ohne Script}"
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes/${ROUTE_ID}" >/dev/null
            fi

            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"pattern\":\"${ROUTE_PATTERN}\",\"script\":\"${ROUTE_SCRIPT}\"}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-route-create.json

            node -e '
              const fs=require("fs");
              const body=JSON.parse(fs.readFileSync("/tmp/dar-test-route-create.json","utf8")||"{}");
              if(body.success!==true){
                console.error("Cloudflare Route konnte nicht erstellt werden:", JSON.stringify(body.errors||body));
                process.exit(1);
              }
              console.log("Dar-Test-Route aktiv:", process.env.ROUTE_PATTERN, "→", process.env.ROUTE_SCRIPT);
            '
          fi

      - name: Cloudflare-Cache für /test/* leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
          PURGE_SCOPE: "test"
          CLOUDFLARE_DEV_MODE: "0"
        run: |
          EXPECT_BUILD_TEST="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_BUILD_TEST
          node scripts/purge-cloudflare-cache.js
        continue-on-error: true

      - name: Cloudflare-Cache nur für /kids leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
        run: node scripts/purge-test-kids-cache.js
        continue-on-error: true

      - name: Dar Test verifizieren (öffentlich + workers.dev)
        env:
          DAR_TEST_WORKERS_URL: "https://dar-al-tawhid-test.sero91ak.workers.dev/test"
          DEPLOY_VERIFY_ATTEMPTS: "12"
          DEPLOY_VERIFY_DELAY_MS: "5000"
        run: |
          EXPECT_TEST_BUILD="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_TEST_BUILD
          # Öffentliche Test-URL ist Pflicht; Secret DAR_TEST_SITE_URL darf nur überschreiben wenn gesetzt
          if [ -n "${{ secrets.DAR_TEST_SITE_URL }}" ]; then
            export SITE_URL="${{ secrets.DAR_TEST_SITE_URL }}"
          else
            export SITE_URL="https://dar-al-tawhid.de/test"
          fi
          node scripts/verify-test-app-deploy.js
