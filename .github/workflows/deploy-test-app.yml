name: Deploy Dar Test App

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Isoliertes Deployment-Ziel (KIDS nur vom Staging-Branch)"
        required: true
        type: choice
        default: dar-test
        options:
          - dar-test
          - kids-creator
  push:
    branches:
      - main
    paths:
      - index.html
      - test/**
      - assets/**
      - content/posts/**
      - content/duas/**
      - content/staging/**
      - content/quran/**
      - content/updates/current.json
      - content/updates/daily.json
      - data/**
      - admin/index.html
      - admin/library-*.js
      - admin/library-admin.css
      - admin/quiz-stats-manager.js
      - service-worker.js
      - manifest*.json
      - wrangler.test.toml
      - cloudflare/test-app-worker.js
      - cloudflare/preview-gate.js
      - scripts/cf-pages-build.js
      - scripts/sync-app-build-ids.js
      - scripts/overlay-test-staging-from-branch.js
      - scripts/app-stability-guard.js
      - scripts/app-stability-repair.js
      - scripts/library-deploy-guard.js
      - scripts/library-deploy-repair.js
      - scripts/test-app-health-check.js
      - scripts/verify-test-app-deploy.js
      - scripts/purge-cloudflare-cache.js
      - scripts/purge-test-kids-cache.js
      - package.json
      - _headers
      - .assetsignore
      - .github/workflows/deploy-test-app.yml

permissions:
  contents: read

jobs:
  deploy-test:
    # A newer main commit must not be overwritten by an older parallel test deploy.
    concurrency:
      group: dar-test-worker-release
      cancel-in-progress: true
    # Existing adult Dar Test deployment remains unchanged for every normal push.
    # Creator dispatch MUST NOT overwrite Dar Test.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dar-test')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Editor V4 – Werkzeuge und Rückgängig prüfen
        run: node scripts/check-layout-studio-v4.cjs

      - name: Test-App Staging aus test-library-canonical übernehmen
        run: |
          git fetch origin test-library-canonical
          node scripts/overlay-test-staging-from-branch.js
          node scripts/app-stability-repair.js

      - name: Aktive DĀR-TEST-Startseite und CSS-Altlasten prüfen
        run: |
          node --check test/assets/dar-home-html-parity-v1.js
          node test/tools/check-home-css-architecture.cjs
          node test/tools/check-home-direct-post-data.cjs
          node test/tools/check-smart-profile-v1.cjs

      # Keep the approved adult Test Quran Player independent of other branches.
      # This affects only /test resources, never visitor or KIDS application code.
      - name: Dar Test Adult Quran V10.8-R canonical assets
        run: |
          git fetch origin test-quran-player-v108r-canonical
          git checkout origin/test-quran-player-v108r-canonical -- test/assets/dar-quran-player.js test/assets/dar-quran-player.css
          node - <<'NODE'
          const fs=require('fs');
          const script=fs.readFileSync('test/assets/dar-quran-player.js','utf8');
          const match=script.match(/PLAYER_BUILD\s*=\s*(\d+)/);
          if(!match)throw Error('Test Quran player build missing');
          const version=match[1], file='test/index.html';
          let html=fs.readFileSync(file,'utf8');
          if(!/\/test\/assets\/dar-quran-player\.js\?v=\d+/.test(html)||!/var WANT=\d+;/.test(html))
            throw Error('Test shell missing player script or boot version');
          html=html.replace(/(\/test\/assets\/dar-quran-player\.js\?v=)\d+/g, '$1'+version)
                   .replace(/var WANT=\d+;/g, 'var WANT='+version+';');
          fs.writeFileSync(file,html);
          console.log('Dar Test Quran Player canonical version',version);
          NODE

      - name: Qibla GPS/Kompass Bridge Regression (keine externen Dienste)
        run: node scripts/test-qibla-native-bridge.cjs

      - name: Build + Build-IDs synchronisieren
        run: npm run build

      - name: Originales iOS-Dar-Test-Icon für Android-Web-App erzeugen
        shell: bash
        run: |
          set -euo pipefail
          node test/tools/build-apple-icons.cjs
          test -s test/assets/dar-test-apple-icon-192.png
          test -s test/assets/dar-test-apple-icon-512.png
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('test/manifest.json','utf8'));
          if(m.id!=='/test/?env=staging'||m.scope!=='/test/')throw Error('Test manifest scope mismatch');
          for(const icon of m.icons||[]){
            const name=icon.src.split('?')[0].replace(/^\//,'');
            const png=fs.readFileSync(name);
            const expected=Number(icon.sizes.split('x')[0]);
            if(!png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))||png.readUInt32BE(16)!==expected||png.readUInt32BE(20)!==expected)throw Error('PNG icon mismatch '+name);
          }
          NODE

      - name: Verify Android DAR TEST installation
        run: node test/tools/check-android-install.cjs

      - name: Dar Test Health Check
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          node --check cloudflare/test-app-worker.js
          node scripts/test-app-health-check.js
          node scripts/library-deploy-guard.js
          node scripts/app-stability-guard.js
          node scripts/push-system-guard.js
          node scripts/push-lanes-guard.js

      - name: Deploy Dar Test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.test.toml

      - name: Live-Routen von dar-al-tawhid-kids auf /kids löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/delete-kids-worker-routes.js
        continue-on-error: true

      - name: Öffentliche /test*-Route an Dar-Test-Worker binden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          export ZONE="${CLOUDFLARE_ZONE_ID:-0e4c0fdfaca4f3fa137de3a67ac8a68b}"
          export ROUTE_PATTERN="dar-al-tawhid.de/test*"
          export ROUTE_SCRIPT="dar-al-tawhid-test"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-routes.json

          ROUTE_ID="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.id?String(route.id):"");
          ')"
          ROUTE_OWNER="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.script?String(route.script):"");
          ')"

          if [ -n "${ROUTE_ID}" ] && [ "${ROUTE_OWNER}" = "${ROUTE_SCRIPT}" ]; then
            echo "Dar-Test-Route bereits korrekt: ${ROUTE_PATTERN} → ${ROUTE_SCRIPT}"
          else
            if [ -n "${ROUTE_ID}" ]; then
              echo "Ersetze falsche Route: ${ROUTE_PATTERN} → ${ROUTE_OWNER:-ohne Script}"
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes/${ROUTE_ID}" >/dev/null
            fi

            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"pattern\":\"${ROUTE_PATTERN}\",\"script\":\"${ROUTE_SCRIPT}\"}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-route-create.json

            node -e '
              const fs=require("fs");
              const body=JSON.parse(fs.readFileSync("/tmp/dar-test-route-create.json","utf8")||"{}");
              if(body.success!==true){
                console.error("Cloudflare Route konnte nicht erstellt werden:", JSON.stringify(body.errors||body));
                process.exit(1);
              }
              console.log("Dar-Test-Route aktiv:", process.env.ROUTE_PATTERN, "→", process.env.ROUTE_SCRIPT);
            '
          fi

      - name: Cloudflare-Cache für /test/* leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
          PURGE_SCOPE: "test"
          CLOUDFLARE_DEV_MODE: "0"
        run: |
          EXPECT_BUILD_TEST="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_BUILD_TEST
          node scripts/purge-cloudflare-cache.js
        continue-on-error: true

      - name: Cloudflare-Cache nur für /kids leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
        run: node scripts/purge-test-kids-cache.js
        continue-on-error: true

      - name: Dar Test verifizieren (öffentlich + workers.dev)
        env:
          DAR_TEST_WORKERS_URL: "https://dar-al-tawhid-test.sero91ak.workers.dev/test"
          DEPLOY_VERIFY_ATTEMPTS: "12"
          DEPLOY_VERIFY_DELAY_MS: "5000"
        run: |
          EXPECT_TEST_BUILD="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_TEST_BUILD
          # Öffentliche Test-URL ist Pflicht; Secret DAR_TEST_SITE_URL darf nur überschreiben wenn gesetzt
          if [ -n "${{ secrets.DAR_TEST_SITE_URL }}" ]; then
            export SITE_URL="${{ secrets.DAR_TEST_SITE_URL }}"
          else
            export SITE_URL="https://dar-al-tawhid.de/test"
          fi
          node scripts/verify-test-app-deploy.js

  deploy-kids-creator:
    # Explicitly selected developer staging branch. NEVER runs on main or push.
    # Uses a new workers.dev-only Worker with no production route or domain.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'kids-creator' && github.ref == 'refs/heads/kids-creator-staging' }}
    runs-on: ubuntu-latest
    concurrency:
      group: dar-kids-creator-worker-only
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout separate KIDS Creator staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: kids-creator-staging
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dependencies
        run: npm ci
      - name: Independent Kids creator preflight
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "kids-creator-staging"
          node --check kids/creator-test/worker.js
          node kids/tools/test-creator-worker-v2.cjs
          node kids/tools/test-native-creator-v2.cjs
          node scripts/test-app-health-check.js
          echo "Staging: no production route, no visitor commit, no App Store upload"
      - name: Publish KIDS Creator Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy -c kids/creator-test/wrangler.toml
      - name: Verify isolated KIDS web UI (native test user agent)
        run: |
          set -euo pipefail
          BASE="https://dar-al-tawhid-kids-creator.sero91ak.workers.dev"
          for PAGE in /kids/start.html /kids/akademie/index.html /kids/version.json; do
            URL="$BASE$PAGE"
            CODE="$(curl -sS -L -o /tmp/kids-creator-body -w '%{http_code}' \
              -A 'DarAlTawhidKids-iOS CreatorTest' -H 'Cache-Control: no-cache' "$URL")"
            if [ "$CODE" != 200 ] || [ ! -s /tmp/kids-creator-body ]; then
              echo "::error::Creator Worker verification failed for $PAGE (HTTP $CODE)"
              exit 1
            fi
            echo "Kids Creator test route OK: $PAGE"
          done
          CODE="$(curl -sS -o /tmp/kids-creator-denied -w '%{http_code}' "$BASE/test/academy/login")"
          test "$CODE" = "404" || { echo "::error::Adult/test route leaked through KIDS Worker ($CODE)"; exit 1; }
          echo "Only KIDS workers.dev routes tested; adult/test and visitor routes not changed"
