name: Deploy Dar Test App

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Isoliertes Deployment-Ziel (KIDS nur vom Staging-Branch)"
        required: true
        type: choice
        default: dar-test
        options:
          - dar-test
          - kids-creator
  push:
    branches:
      - main
      - kids-creator-staging
    paths:
      - kids/creator-test/STAGING_DEPLOY_TRIGGER.txt
      - index.html
      - test/**
      - assets/**
      - content/posts/**
      - content/duas/**
      - content/staging/**
      - content/quran/**
      - content/updates/current.json
      - content/updates/daily.json
      - data/**
      - admin/index.html
      - admin/library-*.js
      - admin/library-admin.css
      - admin/quiz-stats-manager.js
      - service-worker.js
      - manifest*.json
      - wrangler.test.toml
      - cloudflare/test-app-worker.js
      - cloudflare/preview-gate.js
      - scripts/cf-pages-build.js
      - scripts/sync-app-build-ids.js
      - scripts/overlay-test-staging-from-branch.js
      - scripts/app-stability-guard.js
      - scripts/app-stability-repair.js
      - scripts/library-deploy-guard.js
      - scripts/library-deploy-repair.js
      - scripts/test-app-health-check.js
      - scripts/verify-test-app-deploy.js
      - scripts/purge-cloudflare-cache.js
      - scripts/purge-test-kids-cache.js
      - package.json
      - _headers
      - .assetsignore
      - .github/workflows/deploy-test-app.yml

permissions:
  contents: read

jobs:
  deploy-test:
    # Existing adult Dar Test deployment remains unchanged for every normal push.
    # Creator dispatch MUST NOT overwrite Dar Test.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dar-test')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Test-App Staging aus test-library-canonical übernehmen
        run: |
          git fetch origin test-library-canonical
          node scripts/overlay-test-staging-from-branch.js
          node scripts/app-stability-repair.js

      # Always retain the approved adult Quran player when a Kids/other branch
      # deploys the shared Dar Test Worker. Only the two Test player assets and
      # their shell build reference are synchronized; no live/KIDS app files.
      - name: Dar Test Adult Quran V10.8-R canonical assets
        run: |
          git fetch origin test-quran-player-v108r-canonical
          git checkout origin/test-quran-player-v108r-canonical -- test/assets/dar-quran-player.js test/assets/dar-quran-player.css
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('test/assets/dar-quran-player.js','utf8');
          const m=js.match(/PLAYER_BUILD\s*=\s*(\d+)/);
          if(!m)throw Error('Quran player build missing');
          const ver=m[1];
          const file='test/index.html';
          let html=fs.readFileSync(file,'utf8');
          if(!/\/test\/assets\/dar-quran-player\.js\?v=\d+/.test(html) || !/var WANT=\d+;/.test(html)){
            throw Error('Test Quran player script and boot version must be present');
          }
          html=html.replace(/(\/test\/assets\/dar-quran-player\.js\?v=)\d+/g, '$1'+ver)
                   .replace(/var WANT=\d+;/g,'var WANT='+ver+';');
          fs.writeFileSync(file,html);
          console.log('Adult Test Quran player synchronized to build',ver);
          NODE

      - name: Build + Build-IDs synchronisieren
        run: npm run build

      - name: Dar Test Health Check
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          node --check cloudflare/test-app-worker.js
          node scripts/test-app-health-check.js
          node scripts/library-deploy-guard.js
          node scripts/app-stability-guard.js
          node scripts/push-system-guard.js
          node scripts/push-lanes-guard.js

      - name: Deploy Dar Test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.test.toml

      - name: Live-Routen von dar-al-tawhid-kids auf /kids löschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/delete-kids-worker-routes.js
        continue-on-error: true

      - name: Öffentliche /test*-Route an Dar-Test-Worker binden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          export ZONE="${CLOUDFLARE_ZONE_ID:-0e4c0fdfaca4f3fa137de3a67ac8a68b}"
          export ROUTE_PATTERN="dar-al-tawhid.de/test*"
          export ROUTE_SCRIPT="dar-al-tawhid-test"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-routes.json

          ROUTE_ID="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.id?String(route.id):"");
          ')"
          ROUTE_OWNER="$(node -e '
            const fs=require("fs");
            const body=JSON.parse(fs.readFileSync("/tmp/dar-test-routes.json","utf8")||"{}");
            const route=(body.result||[]).find(r=>String(r.pattern||"")===process.env.ROUTE_PATTERN);
            process.stdout.write(route&&route.script?String(route.script):"");
          ')"

          if [ -n "${ROUTE_ID}" ] && [ "${ROUTE_OWNER}" = "${ROUTE_SCRIPT}" ]; then
            echo "Dar-Test-Route bereits korrekt: ${ROUTE_PATTERN} → ${ROUTE_SCRIPT}"
          else
            if [ -n "${ROUTE_ID}" ]; then
              echo "Ersetze falsche Route: ${ROUTE_PATTERN} → ${ROUTE_OWNER:-ohne Script}"
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes/${ROUTE_ID}" >/dev/null
            fi

            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"pattern\":\"${ROUTE_PATTERN}\",\"script\":\"${ROUTE_SCRIPT}\"}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE}/workers/routes" > /tmp/dar-test-route-create.json

            node -e '
              const fs=require("fs");
              const body=JSON.parse(fs.readFileSync("/tmp/dar-test-route-create.json","utf8")||"{}");
              if(body.success!==true){
                console.error("Cloudflare Route konnte nicht erstellt werden:", JSON.stringify(body.errors||body));
                process.exit(1);
              }
              console.log("Dar-Test-Route aktiv:", process.env.ROUTE_PATTERN, "→", process.env.ROUTE_SCRIPT);
            '
          fi

      - name: Cloudflare-Cache für /test/* leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
          PURGE_SCOPE: "test"
          CLOUDFLARE_DEV_MODE: "0"
        run: |
          EXPECT_BUILD_TEST="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_BUILD_TEST
          node scripts/purge-cloudflare-cache.js
        continue-on-error: true

      - name: Cloudflare-Cache nur für /kids leeren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
        run: node scripts/purge-test-kids-cache.js
        continue-on-error: true

      - name: Dar Test verifizieren (öffentlich + workers.dev)
        env:
          DAR_TEST_WORKERS_URL: "https://dar-al-tawhid-test.sero91ak.workers.dev/test"
          DEPLOY_VERIFY_ATTEMPTS: "12"
          DEPLOY_VERIFY_DELAY_MS: "5000"
        run: |
          EXPECT_TEST_BUILD="$(node -e "console.log(JSON.parse(require('fs').readFileSync('test/version.json','utf8')).buildId)")"
          export EXPECT_TEST_BUILD
          # Öffentliche Test-URL ist Pflicht; Secret DAR_TEST_SITE_URL darf nur überschreiben wenn gesetzt
          if [ -n "${{ secrets.DAR_TEST_SITE_URL }}" ]; then
            export SITE_URL="${{ secrets.DAR_TEST_SITE_URL }}"
          else
            export SITE_URL="https://dar-al-tawhid.de/test"
          fi
          node scripts/verify-test-app-deploy.js

  deploy-kids-creator:
    # Dedicated creator staging ONLY. Automatic runs require the one staging-trigger file.
    # Uses a new workers.dev-only Worker with no production route or domain.
    if: ${{ github.ref == 'refs/heads/kids-creator-staging' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'kids-creator')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: dar-kids-creator-worker-only
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout separate KIDS Creator staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: kids-creator-staging
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dependencies
        run: npm ci
      - name: Copy original Academy images to isolated KIDS assets
        run: |
          set -euo pipefail
          mkdir -p kids/assets/academy-stage
          for image in kids-academy-hero-boys-v1.jpg kids-academy-hero-girls-v1.jpg kids-academy-hero-v1.jpg kids-academy-akhlaq-v1.jpg kids-academy-adab-v1.jpg; do
            test -s "desktop-preview/assets/$image"
            cp "desktop-preview/assets/$image" "kids/assets/academy-stage/$image"
          done
          echo "Exact original Academy images copied into KIDS TEST assets; no visitor changes."
      - name: Independent Kids creator preflight
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "kids-creator-staging"
          node --check kids/creator-test/worker.js
          node kids/tools/test-deen-lessons-regression.cjs
          node kids/tools/test-deen-curriculum-v1.cjs
          node kids/tools/verify-global-release-lock.cjs
          node --check kids/quran-lernen/app.js
          node kids/quran-lernen/test-quran-lernen.cjs
          node kids/quran-lernen/check-studio-v3.cjs
          node kids/tools/test-creator-worker-v2.cjs
          node kids/tools/test-creator-quiz-450-only.cjs
          node --check kids/parent-notifications-test-v1.js
          node kids/tools/test-parent-notifications-test-v1.cjs
          node kids/tools/test-creator-splash-v1.cjs
          node kids/tools/test-native-creator-v2.cjs
          node kids/quran-lernen/check-learning-v1.cjs
          node kids/tools/test-v2-salaf-pilot.cjs
          node kids/tools/test-v2-prophets-pilot.cjs
          node kids/tools/test-v2-profile-parity.cjs
          node kids/tools/test-v2-girls-color-audit.cjs
          node --check kids/prophet-stories.js
          node scripts/test-app-health-check.js
          echo "Staging: no production route, no visitor commit, no App Store upload"
      - name: Publish KIDS Creator Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy -c kids/creator-test/wrangler.toml
      - name: Verify isolated KIDS web UI (native test user agent)
        run: |
          set -euo pipefail
          BASE="https://dar-al-tawhid-kids-creator.sero91ak.workers.dev"
          # KIDS QUIZ 450 test surface: preserve exactly 150 per age, block
          # editorial 900 and not-human-approved ElevenLabs V4 MP3 previews.
          # Cloudflare asset manifest propagation is not atomic with the Worker
          # publish. Never fail on the first request after a successful upload.
          QUIZ_READY=0
          for ATTEMPT in $(seq 1 24); do
            CODE="$(curl -sS -L -o /tmp/kids-quiz-450.json -w '%{http_code}' \
              --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' \
              "$BASE/kids/data/quiz-kids-public-450.json?v=1460" || true)"
            if [ "$CODE" = "200" ] && cmp -s kids/data/quiz-kids-public-450.json /tmp/kids-quiz-450.json; then
              QUIZ_READY=1
              break
            fi
            echo "KIDS QUIZ 450 propagation: HTTP $CODE (attempt $ATTEMPT/24)"
            if [ "$ATTEMPT" -lt 24 ]; then sleep 5; fi
          done
          if [ "$QUIZ_READY" != "1" ]; then
            echo "::error::KIDS QUIZ 450 missing or stale on the deployed Worker after retries (HTTP $CODE)"
            exit 1
          fi
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/kids/quiz-library.js?v=1460" -o /tmp/kids-quiz-v1460.js
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/kids/quiz-test-premium-v1460.css?v=1460" -o /tmp/kids-quiz-v1460.css
          cmp -s kids/quiz-library.js /tmp/kids-quiz-v1460.js || { echo "::error::Deployed quiz controller differs from staging"; exit 1; }
          cmp -s kids/quiz-test-premium-v1460.css /tmp/kids-quiz-v1460.css || { echo "::error::Deployed quiz widescreen CSS differs from staging"; exit 1; }
          echo "KIDS QUIZ V1460 runtime/CSS exact bytes: VERIFIED"
          node - <<'KIDSQUIZ'
          const q=require('/tmp/kids-quiz-450.json');
          if(q.items.length!==450||["4-6","7-8","9-10"].some(a=>q.items.filter(x=>x.ageBand===a).length!==150))
            throw Error("KIDS staging must show 150 questions per age");
          console.log("KIDS QUIZ 450 staged: 150/150/150");
          KIDSQUIZ
          for BLOCKED in /kids/data/quiz-kids.json /kids/data/quiz-kids-expansion-reserve-450.json /kids/review-only/quiz-v4-450-actual-mp3-import.json /kids/assets/kids-quiz-audio/v4-final13-review/original.mp3; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$BLOCKED" || true)"
            if [ "$CODE" != "404" ]; then echo "::error::Protected KIDS draft/audio accessible: $BLOCKED HTTP $CODE"; exit 1; fi
          done
          echo "KIDS editorial bank and unapproved audio isolation: VERIFIED"

          # A newly created workers.dev hostname can take time to propagate.
          for PAGE in /kids/start.html /kids/akademie/index.html /kids/version.json /kids/test-console/ /kids/test-console/index.html /kids/test-console/catalogue-v1.json /kids/test-console/manifest.webmanifest /kids/test-console/studio-v1.js /kids/test-console/studio-v1.css /kids/test-console/sw.js /kids/parent-notifications-test-v1.js /kids/parent-notifications-test-v1.css /kids/test-console/return-to-studio.js /kids/quran-lernen/index.html /kids/quran-lernen/catalog.json /kids/quran-lernen/suren.json /kids/quran-lernen/app.js /kids/quran-lernen/styles.css /kids/quran-lernen/home-card.css /kids/quran-lernen/mastertext-drafts-v1.json; do
            URL="$BASE$PAGE"
            OK=0
            for ATTEMPT in $(seq 1 18); do
              CODE="$(curl -sS -L -o /tmp/kids-creator-body -w '%{http_code}' \
                --connect-timeout 8 --max-time 20 \
                -A 'DarAlTawhidKids-iOS CreatorTest' \
                -H 'Cache-Control: no-cache' "$URL" || true)"
              if [ "$CODE" = 200 ] && [ -s /tmp/kids-creator-body ]; then
                OK=1
                break
              fi
              echo "KIDS Creator $PAGE: HTTP $CODE (attempt $ATTEMPT/18)"
              if [ "$ATTEMPT" -lt 18 ]; then sleep 5; fi
            done
            if [ "$OK" != 1 ]; then
              echo "::error::Creator Worker route unavailable after retries: $PAGE (HTTP $CODE)"
              head -c 400 /tmp/kids-creator-body || true
              exit 1
            fi
            echo "KIDS Creator test route OK: $PAGE"
          done
          # Require the real full-size poster and the decorated entry, not only HTTP 200.
          curl -fsSL -A 'DarAlTawhidKids-iOS CreatorTest' "$BASE/kids/start.html" > /tmp/kids-creator-boot.html
          grep -Fq 'id="kids-test-boot"' /tmp/kids-creator-boot.html || { echo "::error::Kids boot overlay missing from deployed HTML"; exit 1; }
          grep -Fq 'kids-test-first-frame-css' /tmp/kids-creator-boot.html || { echo "::error::Early dark KIDS splash CSS missing"; exit 1; }
          grep -Fq 'apple-touch-startup-image' /tmp/kids-creator-boot.html || { echo "::error::iOS PWA startup image hint missing"; exit 1; }
          grep -Fq '/kids/assets/kids-splash-20261017-v1.jpg' /tmp/kids-creator-boot.html || { echo "::error::Approved splash image reference missing"; exit 1; }
          curl -fsSL "$BASE/kids/assets/kids-splash-20261017-v1.jpg" -o /tmp/kids-creator-splash.jpg
          test "$(wc -c < /tmp/kids-creator-splash.jpg)" -gt 100000 || { echo "::error::Kids splash JPEG missing or too small"; exit 1; }
          curl -fsSL "$BASE/kids/splash-boot-v1.js?v=20261017-9" > /tmp/kids-creator-splash.js
          grep -Fq 'maxWaitMs=9000' /tmp/kids-creator-splash.js || { echo "::error::Kids boot JS version missing"; exit 1; }
          echo "KIDS TEST approved splash assets and HTML injection: VERIFIED"
          # KIDS Academy original art is copied from desktop-preview only into this isolated build.
          for IMAGE in kids-academy-hero-boys-v1.jpg kids-academy-hero-girls-v1.jpg kids-academy-hero-v1.jpg kids-academy-akhlaq-v1.jpg kids-academy-adab-v1.jpg; do
            CODE="$(curl -fsSL -o /tmp/kids-creator-art -w '%{http_code}' "$BASE/kids/assets/academy-stage/$IMAGE" || true)"
            test "$CODE" = "200" && test "$(wc -c < /tmp/kids-creator-art)" -gt 4000 || {
              echo "::error::Kids Academy broken artwork: $IMAGE (HTTP $CODE)"
              exit 1
            }
            echo "KIDS Academy image OK: $IMAGE"
          done
          # Verify actual new owner dashboard content, not merely a 200 fallback.
          # Cloudflare canonicalizes /index.html with a redirect; follow it before inspecting the actual page.
          curl -fsSL -A 'DarAlTawhidKids-iOS CreatorTest' -H 'Cache-Control: no-cache' "$BASE/kids/test-console/index.html" > /tmp/kids-creator-console.html
          if ! grep -Fq 'KIDS TEST · Prüfzentrale' /tmp/kids-creator-console.html; then
            echo "::error::Creator console title missing in served HTML; first 500 bytes:"
            head -c 500 /tmp/kids-creator-console.html
            echo
            wc -c /tmp/kids-creator-console.html
            exit 1
          fi
          curl -fsSL -A 'DarAlTawhidKids-iOS CreatorTest' -H 'Cache-Control: no-cache' "$BASE/kids/test-console/catalogue-v1.json" > /tmp/kids-creator-catalogue.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/kids-creator-catalogue.json","utf8")); if(x.weeks!==52||x.entries.length!==208||x.entries.filter(e=>e.catalogued).length!==38){throw Error("KIDS Creator yearly catalogue invalid")}; console.log("KIDS Creator console live: 52 weeks, 38 built, 170 open")'
          curl -fsSL "$BASE/kids/test-console/manifest.webmanifest" > /tmp/kids-creator-manifest.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/kids-creator-manifest.json","utf8")); if(x.id!=="/kids/test-console/"||x.start_url!=="/kids/test-console/"||x.scope!=="/kids/"||x.display!=="standalone"){throw Error("KIDS TEST PWA manifest invalid")};console.log("KIDS TEST Web App live: installed scope only /kids/test-console/")'
          grep -q 'Push-Thread global' /tmp/kids-creator-console.html || { echo "::error::Release lock missing on Creator UI"; exit 1; }
          grep -Fq '38 Unterrichte öffnen' /tmp/kids-creator-console.html || { echo "::error::Simplified Creator entry missing"; exit 1; }
          CODE="$(curl -sS -o /tmp/kids-creator-denied -w '%{http_code}' "$BASE/test/academy/login")"
          test "$CODE" = "404" || {
            echo "::error::Adult/test route leaked through KIDS Worker ($CODE)"
            exit 1
          }
          # Follow PWA scope and verify Safari iPhone behavior separately from the native test UA.
          IOS_SAFARI_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1"
          curl -fsSL -A "$IOS_SAFARI_UA" "$BASE/kids/test-console/" > /tmp/kids-creator-safari.html
          grep -Fq "KIDS TEST · Ersteller-Web-App" /tmp/kids-creator-safari.html || { echo "::error::Safari cannot receive standalone KIDS TEST web app"; exit 1; }
          echo "KIDS TEST iPhone Safari HTML delivery verified, no visitor domain involved."
          # DĪN 6×5: verify exact published bytes, not just a generic HTTP 200.
          for RESOURCE in kids/deen-lessons.js kids/item-offline-v1.js kids/deen-curriculum-v1.css kids/data/deen-curriculum-v1.json kids/assets/deen/lesson-rububiyyah-firefly-v1.jpg kids/assets/deen/lesson-adab-firefly-v1.jpg kids/assets/deen/lesson-friendly-courtyard-runway-v1.jpg kids/assets/deen/lesson-iman-foundations-firefly-v1.jpg kids/assets/deen/lesson-iman-growth-runway-v1.jpg kids/assets/deen/lesson-asma-mercy-firefly-v1.jpg kids/assets/deen/lesson-asma-wisdom-runway-v1.jpg kids/assets/deen/lesson-adab-truth-firefly-v1.jpg kids/assets/deen/lesson-adab-family-runway-v1.jpg kids/assets/deen/lesson-akhirah-dawn-firefly-v1.jpg kids/assets/deen/lesson-akhirah-path-runway-v1.jpg; do
            ASSET_URL="$BASE/$RESOURCE"
            if [ "$RESOURCE" = "kids/data/deen-curriculum-v1.json" ]; then ASSET_URL="$ASSET_URL?v=2"; fi
            VERIFIED=0
            for ATTEMPT in $(seq 1 12); do
              if curl -fsSL -H 'Cache-Control: no-cache' "$ASSET_URL" > /tmp/kids-deen-resource &&
                 cmp -s "$RESOURCE" /tmp/kids-deen-resource; then VERIFIED=1; break; fi
              echo "KIDS Dīn asset not yet identical: $RESOURCE (attempt $ATTEMPT/12)"
              if [ "$ATTEMPT" -lt 12 ]; then sleep 2; fi
            done
            if [ "$VERIFIED" -ne 1 ]; then
              echo "::error::KIDS Dīn served bytes differ: $RESOURCE"
              sha256sum "$RESOURCE" /tmp/kids-deen-resource || true
              head -c 140 /tmp/kids-deen-resource || true
              exit 1
            fi
            echo "KIDS Dīn verified: $RESOURCE"
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$BASE/kids/start.html" > /tmp/kids-deen-start.html
          grep -Fq '/kids/deen-lessons.js?v=11' /tmp/kids-deen-start.html || { echo "::error::New Dīn runtime reference not delivered"; exit 1; }
