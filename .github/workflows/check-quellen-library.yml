name: Check Q source library

on:
  pull_request:
    branches: [main]
    paths:
      - 'quellen/**'
      - 'q/_registry/shortlinks.json'
      - 'scripts/sync-quellen-registry.cjs'
      - 'scripts/check-quellen-client.cjs'
      - 'service-worker.js'
      - 'cloudflare/site-router.js'
      - '_redirects'
      - '.github/workflows/check-quellen-library.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnostic live Q routes (read-only)
        if: always()
        shell: bash
        run: |
          set +e
          for route in / /quellen /quellen/ /quellen/index.html /quellen/shortlinks.json /q /q/ /q/37/ /q/40/; do
            out="$(mktemp)"
            headfile="$(mktemp)"
            url="https://dar-al-tawhid.de${route}?diagnostic=${GITHUB_SHA}"
            code="$(curl --max-time 18 -sS -D "$headfile" -o "$out" -w '%{http_code}' "$url")"
            echo "=== RAW $route HTTP=$code bytes=$(wc -c < "$out") ==="
            grep -iE '^(HTTP/|location:|content-type:|server:|cf-ray:|x-dar-q-route:|x-dar-surface:|www-authenticate:|cf-cache-status:)' "$headfile" || true
            head -c 140 "$out" | tr '\n' ' ' || true
            echo
            if [ "$code" != "200" ]; then
              curl -L --max-redirs 6 --max-time 20 -sS -D "$headfile" -o "$out" -w "FOLLOW $route HTTP=%{http_code} REDIRECTS=%{num_redirects} FINAL=%{url_effective}\n" "$url" || true
              grep -iE '^(HTTP/|location:|x-dar-q-route:)' "$headfile" || true
            fi
            rm -f "$headfile" "$out"
          done
      - name: Read-only production deploy history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          url=root+"/actions/workflows/cloudflare-pages-deploy.yml/runs?branch=main&per_page=12"
          request=urllib.request.Request(url,headers={
            "Accept":"application/vnd.github+json",
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "User-Agent":"dar-q-source-diagnostic"})
          try:
            data=json.load(urllib.request.urlopen(request,timeout=20))
            for x in data.get("workflow_runs",[]):
              print("DEPLOY",x.get("id"),x.get("created_at"),x.get("head_sha"),x.get("status"),x.get("conclusion"),x.get("event"))
              if x.get("conclusion") not in ("success",None):
                jobs_url=x.get("jobs_url")
                if jobs_url:
                  jobs=json.load(urllib.request.urlopen(urllib.request.Request(jobs_url,headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"dar-q-diagnostic"}),timeout=20))
                  for j in jobs.get("jobs",[]):
                    for st in j.get("steps",[]):
                      if st.get("conclusion")=="failure": print("FAILED STEP:",j.get("name"),st.get("name"))
          except Exception as exc: print("DIAGNOSTIC ERROR",type(exc).__name__,str(exc))
          PY
      - name: Verify fixed source library on production (read-only)
        if: always()
        shell: bash
        run: |
          set +e
          echo "Expect X-DAR-Q-Route: direct-static-asset-v2 and 40 numbered links."
          for n in 1 2 3 4 5 6; do
            header="$(mktemp)"; page="$(mktemp)"
            status="$(curl --max-time 20 -sS -D "$header" -o "$page" -w '%{http_code}' "https://dar-al-tawhid.de/quellen/?verify=c5f77ee5-$n")"
            route="$(grep -i '^x-dar-q-route:' "$header" | tr -d '\r' | tail -1)"
            echo "LIVE Q CHECK $n HTTP=$status route=$route size=$(wc -c < "$page")"
            if [ "$status" = "200" ] && grep -q 'qlSourceSnapshot' "$page" && echo "$route" | grep -qi 'direct-static-asset-v2'; then
              echo "LIVE_Q_LIBRARY_OK"
              for direct in /quellen/shortlinks.json /q/37/ /q/40/; do
                code="$(curl --max-time 20 -sS -o "$page" -w '%{http_code}' "https://dar-al-tawhid.de${direct}?verify=c5f77ee5-$n")"
                echo "LIVE_DIRECT $direct HTTP=$code"
                [ "$code" = "200" ] || exit 1
              done
              rm "$header" "$page"
              exit 0
            fi
            rm "$header" "$page"
            sleep 9
          done
          echo "LIVE_Q_LIBRARY_STILL_NOT_FIXED"
          exit 1
      - name: Validate Q source-library synchronization and all source pages
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/sync-quellen-registry.cjs
          node scripts/sync-quellen-registry.cjs --check
          node --check cloudflare/site-router.js
          node scripts/check-quellen-client.cjs
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('quellen/index.html','utf8');
          const publicData=JSON.parse(fs.readFileSync('quellen/shortlinks.json','utf8'));
          const embedded=html.match(/<script id="qlSourceSnapshot" type="application\/json">([\s\S]*?)<\/script>/);
          assert.ok(embedded,'Embedded Q fallback missing');
          const snapshot=JSON.parse(embedded[1]);
          assert.deepEqual(snapshot.links,publicData.links,'Embedded source list must match public JSON');
          assert.ok(snapshot.links.length>=37,'Source list unexpectedly incomplete');
          for(const item of snapshot.links){
            assert.ok(fs.existsSync('q/'+item.number+'/index.html'),'Missing Q source '+item.number);
          }
          assert.match(html,/fetchSourceRegistry\('\/quellen\/shortlinks.json'\)/);
          assert.match(html,/href="\/q\/\$\{s.q\}\//);
          console.log('Quellenbibliothek: '+snapshot.links.length+' numbered links, public+embedded copy OK');
          NODE
