name: Check Q source library

on:
  pull_request:
    branches: [main]
    paths:
      - 'quellen/**'
      - 'q/_registry/shortlinks.json'
      - 'assets/quellen-library.css'
      - 'assets/q-royal-manuscript-v42.css'
      - 'assets/q-royal-manuscript-v42.js'
      - 'scripts/sync-quellen-registry.cjs'
      - 'scripts/check-quellen-client.cjs'
      - 'service-worker.js'
      - 'cloudflare/site-router.js'
      - '_redirects'
      - '.github/workflows/check-quellen-library.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify iPhone safe-area fix is served LIVE (read-only)
        if: always()
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            echo "MOBILE HEADER LIVE ATTEMPT $attempt"
            html=$(mktemp);css=$(mktemp)
            hs=$(curl --max-time 20 -sS -o "$html" -w '%{http_code}' "https://dar-al-tawhid.de/quellen/?check=8ec2282-$attempt")
            cs=$(curl --max-time 20 -sS -o "$css" -w '%{http_code}' "https://dar-al-tawhid.de/assets/quellen-library.css?v=royal-v42-ios-safe-20261011&check=$attempt")
            echo "MOBILE_HEADER_LIVE html_http=$hs css_http=$cs html_bytes=$(wc -c < "$html") css_bytes=$(wc -c < "$css")"
            good=1
            [ "$hs" = 200 ] && [ "$cs" = 200 ] || good=0
            grep -q 'royal-v42-ios-safe-20261011' "$html" || good=0
            grep -q 'iPhone header reachability / safe-area hotfix' "$css" || good=0
            grep -q -- '--ql-safe-header-offset' "$css" || good=0
            grep -q 'position:sticky' "$css" || good=0
            if [ "$good" = 1 ]; then
              echo 'MOBILE_HEADER_LIVE_OK'
              for route in /q/1/ /q/2/ /q/40/; do
                code=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://dar-al-tawhid.de${route}?check=8ec2282")
                echo "UNCHANGED_SOURCE $route HTTP=$code"
                [ "$code" = 200 ] || exit 1
              done
              rm -f "$html" "$css"
              exit 0
            fi
            rm -f "$html" "$css"
            sleep 8
          done
          echo "MOBILE_HEADER_NOT_YET_LIVE"
          exit 1
      - name: Validate Q source-library synchronization and all source pages
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/sync-quellen-registry.cjs
          node scripts/sync-quellen-registry.cjs --check
          node --check cloudflare/site-router.js
          node --check assets/q-royal-manuscript-v42.js
          node scripts/check-quellen-client.cjs
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('quellen/index.html','utf8');
          const publicData=JSON.parse(fs.readFileSync('quellen/shortlinks.json','utf8'));
          const embedded=html.match(/<script id="qlSourceSnapshot" type="application\/json">([\s\S]*?)<\/script>/);
          assert.ok(embedded,'Embedded Q fallback missing');
          const snapshot=JSON.parse(embedded[1]);
          assert.deepEqual(snapshot.links,publicData.links,'Embedded source list must match public JSON');
          assert.ok(snapshot.links.length>=37,'Source list unexpectedly incomplete');
          for(const item of snapshot.links){
            assert.ok(fs.existsSync('q/'+item.number+'/index.html'),'Missing Q source '+item.number);
          }
          assert.match(html,/fetchSourceRegistry\('\/quellen\/shortlinks.json'\)/);
          assert.match(html,/href="\/q\/\$\{s.q\}\//);
          console.log('Quellenbibliothek: '+snapshot.links.length+' numbered links, public+embedded copy OK');
          NODE
