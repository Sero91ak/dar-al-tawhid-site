name: DAR TEST Seven Languages — Zero Paid API

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/i18n/adult-ui-locales-seven.json'
      - 'test/i18n/adult-ui-fr-es-navigation-drafts.json'
      - 'test/i18n/test-fr-es-navigation-drafts.cjs'
      - 'test/i18n/test-seven-*'
      - 'test/i18n/test-expanded-headings-seven.cjs'
      - 'test/i18n/test-canonical-visible-titles.cjs'
      - 'test/i18n/adult-visible-title-drafts-seven.json'
      - 'test/assets/dar-test-turkish-ui.js'
      - 'test/assets/dar-test-seven-languages-loader.js'
      - 'test/assets/dar-home-v3-compact.js'
      - 'test/assets/dar-more-v15.js'
      - 'test/assets/dar-setup-hub.js'
      - '.github/workflows/dar-test-seven-free-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seven-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pending French and Spanish navigation drafts
        run: node test/i18n/test-fr-es-navigation-drafts.cjs
      - name: Static multilingual UI validation (no model calls)
        run: |
          node --check test/assets/dar-test-turkish-ui.js
          node --check test/assets/dar-test-seven-languages-loader.js
          node --check test/assets/dar-home-v3-compact.js
          node --check test/assets/dar-more-v15.js
          node --check test/assets/dar-setup-hub.js
          node test/assets/dar-test-turkish-ui.test.cjs
          node test/i18n/test-seven-locales.cjs
          node test/i18n/test-expanded-headings-seven.cjs
          node test/i18n/test-canonical-visible-titles.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('test/i18n/adult-ui-locales-seven.json','utf8');
          const pack=JSON.parse(raw);
          const loader=fs.readFileSync('test/assets/dar-test-seven-languages-loader.js','utf8');
          const titleDrafts=JSON.parse(fs.readFileSync('test/i18n/adult-visible-title-drafts-seven.json','utf8'));
          if(titleDrafts.bodyTranslation!==false||titleDrafts.paidApiCalls!==0||
             titleDrafts.scope!=='adult-test-visible-titles-only'||
             Object.keys(titleDrafts.records||{}).length<13)throw Error('Unsafe title draft pack');
          if(!pack.noPaidProvider||pack.scope!=='adult-interface-only')throw Error('Not an offline static UI pack');
          if(/api\.openai\.com|DAR_I18N_AI_API_KEY|chat\/completions/i.test(raw+loader))
            throw Error('Paid model endpoint or secret must not be in UI browser runtime');
          for(const locale of ['tr','en','ar','ku','ckb','bs'])
            if(Object.keys(pack.translations[locale]||{}).length<350)throw Error('Incomplete language catalog '+locale);
          console.log('PASS 7 UI catalogs; 0 OpenAI API requests.');
          NODE
      - name: Start local adult test app
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dar-seven-ui-browser.log 2>&1 &
          sleep 3
      - name: Verify all language pickers and RTL in Chromium
        run: python3 test/i18n/test-seven-browser-smoke.py
