name: DAR TEST Nine Languages — Zero Paid API

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/i18n/adult-ui-locales-seven.json'
      - 'test/i18n/test-seven-*'
      - 'test/i18n/test-subpages-nine.cjs'
      - 'test/i18n/test-nine-accessibility-attrs.cjs'
      - 'test/i18n/test-turkish-catalog-parity.cjs'
      - 'test/i18n/test-nine-browser-subpages.py'
      - 'test/i18n/test-expanded-headings-seven.cjs'
      - 'test/i18n/test-nine-registry.cjs'
      - 'test/i18n/test-nine-dynamic-ui.cjs'
      - 'test/i18n/test-nine-native-bridge.cjs'
      - 'test/i18n/audit-visible-ui-nine.cjs'
      - 'test/i18n/ui-tr.generated.json'
      - 'test/i18n/test-canonical-visible-titles.cjs'
      - 'test/i18n/adult-visible-title-drafts-seven.json'
      - 'test/assets/dar-test-turkish-ui.js'
      - 'test/assets/dar-test-seven-languages-loader.js'
      - 'test/assets/dar-home-v3-compact.js'
      - 'assets/i18n/adult-language-picker-v1.js'
      - 'test/assets/dar-more-v15.js'
      - 'test/assets/dar-setup-hub.js'
      - '.github/workflows/dar-test-seven-free-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static multilingual UI validation (no model calls)
        run: |
          node --check test/assets/dar-test-turkish-ui.js
          node --check test/assets/dar-test-seven-languages-loader.js
          node --check test/assets/dar-home-v3-compact.js
          node --check assets/i18n/adult-language-picker-v1.js
          node --check test/assets/dar-more-v15.js
          node --check test/assets/dar-setup-hub.js
          node test/assets/dar-test-turkish-ui.test.cjs
          node test/i18n/test-seven-locales.cjs
          node test/i18n/test-nine-registry.cjs
          node test/i18n/test-nine-dynamic-ui.cjs
          node test/i18n/test-nine-native-bridge.cjs
          node test/i18n/test-subpages-nine.cjs
          node test/i18n/test-nine-accessibility-attrs.cjs
          node test/i18n/test-turkish-catalog-parity.cjs
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const more=fs.readFileSync('test/assets/dar-more-v15.js','utf8');
          const settings=fs.readFileSync('test/assets/dar-setup-hub.js','utf8');
          const shared=fs.readFileSync('assets/i18n/adult-language-picker-v1.js','utf8');
          assert(more.includes('data-dar-language-entry="quick"'),'More must use existing shared language capsule');
          assert(settings.includes('data-dar-language-entry="settings"'),'Settings must use existing shared full-page picker');
          assert(!more.includes('class="dm-locale" role="group"'),'Legacy More language tiles must not return');
          assert(!settings.includes('block.className="dsh-group dar-test-settings-locale-live"'),'Legacy Settings language tiles must not return');
          assert(shared.includes('darAdultPreferredLocaleV1'),'Shared stored language key missing');
          assert(shared.includes('dar-adult-locale-changed'),'Shared language event missing');
          console.log('PASS: no duplicate language pickers; PR #1395 selector reused');
          NODE
          node test/i18n/audit-visible-ui-nine.cjs --self-test
          node test/i18n/test-expanded-headings-seven.cjs
          node test/i18n/test-canonical-visible-titles.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('test/i18n/adult-ui-locales-seven.json','utf8');
          const pack=JSON.parse(raw);
          const loader=fs.readFileSync('test/assets/dar-test-seven-languages-loader.js','utf8');
          const titleDrafts=JSON.parse(fs.readFileSync('test/i18n/adult-visible-title-drafts-seven.json','utf8'));
          if(titleDrafts.bodyTranslation!==false||titleDrafts.paidApiCalls!==0||
             titleDrafts.scope!=='adult-test-visible-titles-only'||
             Object.keys(titleDrafts.records||{}).length<13)throw Error('Unsafe title draft pack');
          if(!pack.noPaidProvider||pack.scope!=='adult-interface-only')throw Error('Not an offline static UI pack');
          if(/api\.openai\.com|DAR_I18N_AI_API_KEY|chat\/completions/i.test(raw+loader))
            throw Error('Paid model endpoint or secret must not be in UI browser runtime');
          for(const locale of ['tr','en','ar','ku','ckb','bs','fr','es'])
            if(Object.keys(pack.translations[locale]||{}).length<804)throw Error('Incomplete language catalog '+locale);
          console.log('PASS 9 UI catalogs with 804+ interface labels each; 0 OpenAI API requests.');
          NODE
      - name: Start local adult test app
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dar-seven-ui-browser.log 2>&1 &
          sleep 3
      - name: Verify all language pickers and RTL in Chromium
        run: python3 test/i18n/test-seven-browser-smoke.py
      - name: Verify nine languages on all 15 app subpages (read-only)
        run: python3 test/i18n/test-nine-browser-subpages.py
      - name: Inventory 15 app routes and report missing interface strings (read-only)
        run: |
          python3 test/i18n/capture-visible-ui.py
          node test/i18n/audit-visible-ui-nine.cjs --write-report
