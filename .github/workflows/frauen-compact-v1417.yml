name: Frauen Compact Editorial V1417 Acceptance

on:
  pull_request:
    paths:
      - 'assets/frauen/frauen-compact-editorial-v1417.css'
      - 'cloudflare/site-router.js'
      - 'cloudflare/test-app-worker.js'
      - 'scripts/check-frauen-compact-*.cjs'
      - '.github/workflows/frauen-compact-v1417.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/frauen/frauen-compact-editorial-v1417.css'
      - 'cloudflare/site-router.js'
      - 'cloudflare/test-app-worker.js'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CSS-only component isolation and no changed source contracts
        run: |
          node --check scripts/check-frauen-compact-contract-v1417.cjs
          node --check scripts/check-frauen-compact-editorial-v1417.cjs
          node scripts/check-frauen-compact-contract-v1417.cjs

  browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real CSS cascade checks
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Preserve the original V1416 HeroDock, scroll and search
        run: node scripts/check-frauen-stage-native-v1415.cjs
      - name: Verify compact V1417 on 8 viewport types, 2 themes, hub and group
        run: node scripts/check-frauen-compact-editorial-v1417.cjs
