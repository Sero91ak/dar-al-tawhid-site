name: Upload ElevenLabs Pronunciation Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls'
      - '.github/workflows/upload-elevenlabs-pronunciation-master.yml'

permissions:
  contents: read

concurrency:
  group: elevenlabs-pronunciation-master-upload
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MASTER_FILE: data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls
      DICTIONARY_NAME: DAR AL TAWHID Arabic Master 2.9.122

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify ElevenLabs secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error::ELEVENLABS_API_KEY ist im Repository nicht konfiguriert."
            exit 1
          fi

      - name: Validate PLS master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls")
          root = ET.parse(path).getroot()
          ns = {"p": "http://www.w3.org/2005/01/pronunciation-lexicon"}
          lexemes = root.findall("p:lexeme", ns)
          graphemes = []
          alias_count = 0
          for lex in lexemes:
              g = lex.find("p:grapheme", ns)
              a = lex.find("p:alias", ns)
              if g is None or not (g.text or "").strip():
                  raise SystemExit("Lexeme ohne Graphem")
              graphemes.append((g.text or "").strip())
              if a is not None and (a.text or "").strip():
                  alias_count += 1

          if len(graphemes) != len(set(graphemes)):
              raise SystemExit("Doppelte Grapheme im PLS-Master")
          if len(lexemes) != 10111:
              raise SystemExit(f"Erwartet 10111 Lexeme, gefunden {len(lexemes)}")
          if alias_count != len(lexemes):
              raise SystemExit(f"Nicht alle Regeln sind Alias-Regeln: {alias_count}/{len(lexemes)}")

          print(f"PLS OK: {len(lexemes)} eindeutige Alias-Regeln")
          PY

      - name: Upload master to ElevenLabs
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(
            curl -sS -o /tmp/elevenlabs-pronunciation-result.json -w '%{http_code}' \
              -X POST 'https://api.elevenlabs.io/v1/pronunciation-dictionaries/add-from-file' \
              -H "xi-api-key: $ELEVENLABS_API_KEY" \
              -F "file=@$MASTER_FILE;type=application/pls+xml" \
              -F "name=$DICTIONARY_NAME" \
              -F "description=DAR AL TAWHID Arabic-heavy pronunciation master 2.9.122; 10111 unique alias rules; existing curated rules preserved."
          )"

          echo "HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            cat /tmp/elevenlabs-pronunciation-result.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path("/tmp/elevenlabs-pronunciation-result.json")
          data = json.loads(src.read_text())
          clean = {
              "id": data.get("id"),
              "name": data.get("name"),
              "version_id": data.get("version_id"),
              "version_rules_num": data.get("version_rules_num"),
              "description": data.get("description"),
          }
          Path("elevenlabs-pronunciation-upload-result.json").write_text(
              json.dumps(clean, ensure_ascii=False, indent=2) + "\n"
          )
          print("ELEVENLABS_DICTIONARY_ID=" + str(clean.get("id") or ""))
          print("ELEVENLABS_VERSION_ID=" + str(clean.get("version_id") or ""))
          print("ELEVENLABS_RULES=" + str(clean.get("version_rules_num") or ""))
          with open(Path.home() / "summary.txt", "w") as f:
              f.write(json.dumps(clean, ensure_ascii=False, indent=2))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-pronunciation-upload-result
          path: elevenlabs-pronunciation-upload-result.json
          retention-days: 30
