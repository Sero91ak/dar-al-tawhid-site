name: Upload ElevenLabs Pronunciation Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls'
      - '.github/workflows/upload-elevenlabs-pronunciation-master.yml'

permissions:
  contents: read

concurrency:
  group: elevenlabs-pronunciation-master-upload
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      MASTER_FILE: data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls
      UPLOAD_ENDPOINT: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api/pronunciation-master/upload

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify secure upload bridge secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PUBLISH_SECRET:-}" ]; then
            echo "::error::ADMIN_PUBLISH_SECRET ist im Repository nicht konfiguriert."
            exit 1
          fi

      - name: Validate PLS master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls")
          root = ET.parse(path).getroot()
          ns = {"p": "http://www.w3.org/2005/01/pronunciation-lexicon"}
          lexemes = root.findall("p:lexeme", ns)
          graphemes = []
          aliases = 0
          for lex in lexemes:
              g = lex.find("p:grapheme", ns)
              a = lex.find("p:alias", ns)
              if g is None or not (g.text or "").strip():
                  raise SystemExit("Lexeme ohne Graphem")
              graphemes.append((g.text or "").strip())
              if a is not None and (a.text or "").strip():
                  aliases += 1

          if len(lexemes) != 10099:
              raise SystemExit(f"Erwartet 10099 Lexeme, gefunden {len(lexemes)}")
          if len(graphemes) != len(set(graphemes)):
              raise SystemExit("Doppelte Grapheme im PLS-Master")
          if aliases != len(lexemes):
              raise SystemExit(f"Nicht alle Regeln sind Alias-Regeln: {aliases}/{len(lexemes)}")
          print(f"PLS OK: {len(lexemes)} eindeutige Alias-Regeln")
          PY

      - name: Upload through DĀR secure ElevenLabs bridge
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(
            curl -sS -o /tmp/elevenlabs-pronunciation-result.json -w '%{http_code}' \
              -X POST "$UPLOAD_ENDPOINT" \
              -H "X-Admin-Secret: $ADMIN_PUBLISH_SECRET" \
              -H "Accept: application/json"
          )"
          echo "HTTP $http_code"
          cat /tmp/elevenlabs-pronunciation-result.json

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/elevenlabs-pronunciation-result.json").read_text())
          if not data.get("ok"):
              raise SystemExit(data.get("error") or "Upload nicht bestätigt")
          clean = {
              "id": data.get("id"),
              "name": data.get("name"),
              "version_id": data.get("version_id"),
              "version_rules_num": data.get("version_rules_num"),
              "description": data.get("description"),
              "sourceLexemes": data.get("sourceLexemes"),
          }
          Path("elevenlabs-pronunciation-upload-result.json").write_text(
              json.dumps(clean, ensure_ascii=False, indent=2) + "\n"
          )
          print("ELEVENLABS_DICTIONARY_ID=" + str(clean.get("id") or ""))
          print("ELEVENLABS_VERSION_ID=" + str(clean.get("version_id") or ""))
          print("ELEVENLABS_RULES=" + str(clean.get("version_rules_num") or ""))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-pronunciation-upload-result
          path: elevenlabs-pronunciation-upload-result.json
          retention-days: 30
