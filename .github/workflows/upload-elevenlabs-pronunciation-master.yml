name: Upload ElevenLabs Pronunciation Master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls'
      - '.github/workflows/upload-elevenlabs-pronunciation-master.yml'

permissions:
  contents: read

concurrency:
  group: elevenlabs-pronunciation-master-upload
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MASTER_FILE: data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls
      DICTIONARY_NAME: DAR AL TAWHID Arabic Master 2.9.122

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify ElevenLabs API secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error::ELEVENLABS_API_KEY ist im Repository nicht konfiguriert."
            exit 1
          fi
          echo "ElevenLabs API secret ist vorhanden."

      - name: Validate PLS master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("data/pronunciation/DAR_AL_TAWHID_ElevenLabs_ARABIC_MASTER_29122.pls")
          root = ET.parse(path).getroot()
          ns = {"p": "http://www.w3.org/2005/01/pronunciation-lexicon"}
          lexemes = root.findall("p:lexeme", ns)
          graphemes = []
          aliases = 0
          for lex in lexemes:
              g = lex.find("p:grapheme", ns)
              a = lex.find("p:alias", ns)
              if g is None or not (g.text or "").strip():
                  raise SystemExit("Lexeme ohne Graphem")
              graphemes.append((g.text or "").strip())
              if a is not None and (a.text or "").strip():
                  aliases += 1

          if len(lexemes) != 10099:
              raise SystemExit(f"Erwartet 10099 Lexeme, gefunden {len(lexemes)}")
          if len(graphemes) != len(set(graphemes)):
              raise SystemExit("Doppelte Grapheme im PLS-Master")
          if aliases != len(lexemes):
              raise SystemExit(f"Nicht alle Regeln sind Alias-Regeln: {aliases}/{len(lexemes)}")
          print(f"PLS OK: {len(lexemes)} eindeutige Alias-Regeln")
          PY

      - name: Upload master directly to ElevenLabs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          master = Path(os.environ["MASTER_FILE"])
          api_key = os.environ["ELEVENLABS_API_KEY"].strip()
          name = os.environ["DICTIONARY_NAME"].strip()
          description = (
              "DAR AL TAWHID Arabic-heavy pronunciation master 2.9.122; "
              "10099 unique alias rules; existing curated rules preserved."
          )

          with master.open("rb") as fh:
              response = requests.post(
                  "https://api.elevenlabs.io/v1/pronunciation-dictionaries/add-from-file",
                  headers={"xi-api-key": api_key},
                  data={"name": name, "description": description},
                  files={"file": (master.name, fh, "application/pls+xml")},
                  timeout=120,
              )

          print("HTTP", response.status_code)
          print(response.text)
          response.raise_for_status()

          data = response.json()
          clean = {
              "id": data.get("id"),
              "name": data.get("name"),
              "version_id": data.get("version_id"),
              "version_rules_num": data.get("version_rules_num"),
              "description": data.get("description"),
          }
          if not clean["id"] or not clean["version_id"]:
              raise SystemExit("ElevenLabs hat keine Dictionary-/Version-ID zurückgegeben.")
          Path("elevenlabs-pronunciation-upload-result.json").write_text(
              json.dumps(clean, ensure_ascii=False, indent=2) + "\n"
          )
          print("ELEVENLABS_DICTIONARY_ID=" + str(clean["id"]))
          print("ELEVENLABS_VERSION_ID=" + str(clean["version_id"]))
          print("ELEVENLABS_RULES=" + str(clean.get("version_rules_num") or ""))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-pronunciation-upload-result
          path: elevenlabs-pronunciation-upload-result.json
          retention-days: 30
