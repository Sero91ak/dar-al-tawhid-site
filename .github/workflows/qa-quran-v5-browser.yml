name: Quran V5 Device and Interaction QA
on:
  workflow_dispatch:
  push:
    branches: [preview/quran-player-browser-links-20261010]
    paths: [.github/workflows/qa-quran-v5-browser.yml]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify both V5 Quran players across 12 screen formats
        shell: bash
        run: node scripts/qa-quran-v5-browser.cjs
      - name: Save screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-v5-device-preview-screenshots
          path: .qa-quran-shots/
          retention-days: 21
          if-no-files-found: ignore
