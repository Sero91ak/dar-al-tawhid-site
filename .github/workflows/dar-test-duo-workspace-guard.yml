name: DAR Test Fold / Tablet Workspace Guard
on:
  pull_request:
    paths:
      - 'test/assets/dar-duo-responsive-v1.js'
      - 'test/assets/dar-duo-responsive-v1.css'
      - 'test/assets/dar-fold-workspace-v2.js'
      - 'test/assets/dar-fold-workspace-v2.css'
      - 'test/tools/dar-fold-workspace-v2-guard.cjs'
      - 'test/tools/dar-duo-responsive-guard.cjs'
      - 'cloudflare/test-app-worker.js'
      - '.github/workflows/dar-test-duo-workspace-guard.yml'
  push:
    branches: [main]
    paths:
      - 'test/assets/dar-duo-responsive-v1.js'
      - 'test/assets/dar-duo-responsive-v1.css'
      - 'test/assets/dar-fold-workspace-v2.js'
      - 'test/assets/dar-fold-workspace-v2.css'
      - 'test/tools/dar-fold-workspace-v2-guard.cjs'
      - 'test/tools/dar-duo-responsive-guard.cjs'
      - 'cloudflare/test-app-worker.js'
      - '.github/workflows/dar-test-duo-workspace-guard.yml'
permissions:
  contents: read
jobs:
  test-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax / isolated fold contract
        run: |
          node --check test/assets/dar-duo-responsive-v1.js
          node --check test/tools/dar-duo-responsive-guard.cjs
          node test/tools/dar-duo-responsive-guard.cjs
          node --check test/assets/dar-fold-workspace-v2.js
          node --check test/tools/dar-fold-workspace-v2-guard.cjs
          node test/tools/dar-fold-workspace-v2-guard.cjs
