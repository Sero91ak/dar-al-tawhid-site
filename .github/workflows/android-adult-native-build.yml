name: DAR Android Adult Native Build

on:
  push:
    branches: [main]
    paths:
      - "android/app/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle/**"
      - "android/gradlew"
      - "android/gradlew.bat"
      - ".github/workflows/android-adult-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dar-android-adult-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adult-android:
    name: Erwachsenen-App · Debug + signierte APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.DAR_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.DAR_ANDROID_UPLOAD_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.DAR_ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.DAR_ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout nur Android
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Native Icons und Widgets prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '<activity-alias' android/app/src/main/AndroidManifest.xml)" -eq 18
          test "$(grep -c 'WidgetProvider' android/app/src/main/AndroidManifest.xml)" -eq 2
          test "$(find android/app/src/main/res/mipmap-anydpi-v26 -maxdepth 1 -name 'dar_launcher_*.xml' | wc -l)" -eq 18
          grep -q 'DarLauncherIcons' android/app/src/main/java/de/daraltawhid/app/MainActivity.kt
          grep -q 'requestWidget(kind: String)' android/app/src/main/java/de/daraltawhid/app/MainActivity.kt

      - name: Debug APK erstellen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Debug APK intern bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-adult-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Release-Signierung vorbereiten
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
            chmod 600 android/upload-keystore.jks
            {
              printf 'storeFile=upload-keystore.jks\n'
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/keystore.properties
            chmod 600 android/keystore.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signierter Build ausgelassen: Erwachsenen-Android-Signiersecrets fehlen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signierte APK und AAB erstellen
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Signierte APK verifizieren
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$sdk/apksigner"
          "$sdk/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apksigner.txt"
          grep -q '^Verified' "$RUNNER_TEMP/apksigner.txt"
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          echo "Android Version: 1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Signierte Pakete intern bereitstellen
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-adult-signed-aab-and-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Temporäre Signierdateien entfernen
        if: always()
        shell: bash
        run: rm -f android/keystore.properties android/upload-keystore.jks
