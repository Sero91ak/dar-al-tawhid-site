name: Import Khadijah Kids Audio

on:
  push:
    paths:
      - ".github/workflows/import-khadijah-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-khadijah-kids-audio
  cancel-in-progress: false

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download and optimize Khadijah audio
        env:
          SOURCE_URL: "https://at.adobe.com/HNH9VVqyH6KG1AzW"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids/assets/sahabiyyat-story-audio/khadijah
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 "$SOURCE_URL" -o /tmp/khadijah-source.mp3
          dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/khadijah-source.mp3)"
          python3 - "$dur" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 300 <= d <= 480:
              raise SystemExit(f"Khadijah master audio must be 5–8 minutes, got {d:.3f}s")
          PY
          ffmpeg -hide_banner -loglevel error -y             -i /tmp/khadijah-source.mp3             -map_metadata -1 -vn -ac 1 -ar 44100             -c:a aac -profile:a aac_low -b:a 64k             -movflags +faststart             kids/assets/sahabiyyat-story-audio/khadijah/master.m4a

      - name: Bind local master audio
        shell: bash
        run: |
          set -euo pipefail
          export AUDIO_PATH="kids/assets/sahabiyyat-story-audio/khadijah/master.m4a"
          export AUDIO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO_PATH")"
          export AUDIO_BYTES="$(stat -c%s "$AUDIO_PATH")"
          export AUDIO_SHA256="$(sha256sum "$AUDIO_PATH" | awk '{print $1}')"
          export PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node <<'NODE'
          const fs=require("fs");
          const manifestPath="kids/data/sahabiyyat-stories.json";
          const versionPath="kids/version.json";
          const voiceVersionPath="voice-studio/version.json";
          const manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8"));
          const version=JSON.parse(fs.readFileSync(versionPath,"utf8"));
          const voice=JSON.parse(fs.readFileSync(voiceVersionPath,"utf8"));
          const item=(manifest.items||[]).find(x=>x&&x.id==="khadijah");
          if(!item)throw new Error("Khadijah story missing");
          const nextVersion=Math.max(Number(manifest.version||0)+1,26);
          const duration=Number(process.env.AUDIO_DURATION||0);
          const bytes=Number(process.env.AUDIO_BYTES||0);
          const sha256=String(process.env.AUDIO_SHA256||"");
          const publishedAt=String(process.env.PUBLISHED_AT||new Date().toISOString());
          const url="/kids/assets/sahabiyyat-story-audio/khadijah/master.m4a?v="+nextVersion;
          const base={
            status:"ready",url,durationSec:Number(duration.toFixed(3)),bytes,sha256,
            mime:"audio/mp4",codec:"aac",bitRateKbps:64,channels:1,sampleRateHz:44100,
            voiceProfile:"kids_story",voiceProfileId:"serhat-owner-voice-2026",
            source:"DĀR Kids owner-audio local master",sourceSpeaker:"Serhat Abu Malik",
            sourceFile:"Sahabiyyah Khadīǧah bint Khuwaylid, raḍiya llāhu ʿanhā Geschichte.mp3",
            manual:true,manualUpload:true,ownerApproved:true,modes:["read","listen"],
            technicalQaPassed:true,publishedAt,masterAudio:true,masterAgeRange:"4-10"
          };
          item.audio=item.audio&&typeof item.audio==="object"?item.audio:{};
          for(const age of ["4-5","6-8","9-10"])item.audio[age]={...base,age};
          item.voiceProduction={
            ...(item.voiceProduction||{}),
            status:"audio-complete",audioRefreshRequired:false,sourceDataVersion:nextVersion,
            publishedAges:["4-5","6-8","9-10"],lastPublishedAt:publishedAt,
            singleMasterAudio:true,masterAgeRange:"4-10",masterAudioUrl:url,
            localTarget:"/kids/assets/sahabiyyat-story-audio/khadijah/master.m4a",
            directAssignment:false,optimizedMasterReady:true,
            optimizedMasterBytes:bytes,optimizedMasterSha256:sha256
          };
          manifest.version=nextVersion;
          manifest.updatedAt=publishedAt;
          version.visualSystem=version.visualSystem||{};
          version.visualSystem.sahabiyyatDataVersion=nextVersion;
          version.visualSystem.khadijahOwnerAudio=true;
          version.visualSystem.khadijahOwnerAudioDirectAssigned=false;
          version.visualSystem.khadijahOwnerAudioDurationSec=Number(duration.toFixed(3));
          version.visualSystem.khadijahOwnerAudioOptimizedCodec="aac-64k-mono";
          version.visualSystem.khadijahOwnerAudioOptimizedBytes=bytes;
          version.visualSystem.khadijahOwnerAudioTarget="/kids/assets/sahabiyyat-story-audio/khadijah/master.m4a";
          if(voice.sahabiyyatKidsIntegration&&typeof voice.sahabiyyatKidsIntegration==="object"){
            voice.sahabiyyatKidsIntegration.masterDataVersion=nextVersion;
            voice.sahabiyyatKidsIntegration.kidsDataVersion=nextVersion;
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudio=true;
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudioStatus="audio-complete";
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudioDurationSec=Number(duration.toFixed(3));
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudioMasterAgeRange="4-10";
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudioOptimizedCodec="aac-64k-mono";
            voice.sahabiyyatKidsIntegration.khadijahOwnerAudioTarget="/kids/assets/sahabiyyat-story-audio/khadijah/master.m4a";
          }
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+"\n");
          fs.writeFileSync(versionPath,JSON.stringify(version,null,2)+"\n");
          fs.writeFileSync(voiceVersionPath,JSON.stringify(voice,null,2)+"\n");
          console.log(JSON.stringify({nextVersion,url,duration,bytes,sha256},null,2));
          NODE

      - name: Validate Kids release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kids-prophet-release-guard.js

      - name: Commit Khadijah audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAR Kids Audio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             kids/assets/sahabiyyat-story-audio/khadijah/master.m4a             kids/data/sahabiyyat-stories.json             kids/version.json             voice-studio/version.json
          git diff --cached --stat
          git commit -m "Kids: publish Khadijah master audio"
          git push origin HEAD:main
