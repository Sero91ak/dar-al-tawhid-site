name: Deploy TAWḤĪD KIDS TEST (Android PWA)
# ISOLATED_KIDS_TEST_WORKER_V1 — NEVER publishes the real visitor Kids app.
on:
  push:
    branches:
      - kids-test-staging
    paths:
      - "kids/**"
      - ".github/workflows/deploy-kids-android-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kids-test-android-workers-dev
  cancel-in-progress: false

jobs:
  deploy-kids-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Kids TEST branch
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dependencies
        run: npm ci
      - name: Validate the Kids TEST PWA and route guards
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "kids-test-staging"
          node --check kids/test-android/worker.js
          node kids/test-android/test-preview.cjs
          test -s kids/index.html
          test -s kids/start.html
          test -s kids/sw.js
          echo "KIDS TEST only: visitor routes, Android APK, Play Store and app store untouched"
      - name: Publish isolated workers.dev-only KIDS TEST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy -c kids/test-android/wrangler.toml
      - name: Verify Android install and staged Kids entry
        run: |
          node <<'NODE'
          const assert=require("node:assert/strict");
          const base="https://dar-al-tawhid-kids-test.sero91ak.workers.dev";
          async function get(path){
            const res=await fetch(base+path,{headers:{"Cache-Control":"no-cache"},signal:AbortSignal.timeout(20000)});
            return {status:res.status,headers:res.headers,body:await res.text()};
          }
          const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
          (async()=>{
            let m;
            for(let i=0;i<8;i++){
              try{
                m=await get("/kids/manifest.webmanifest");
                if(m.status===200&&m.body.includes("KIDS TEST"))break;
              }catch(e){console.log("Retry manifest:",e.message)}
              await sleep(5000);
            }
            assert.equal(m?.status,200,"Kids TEST PWA manifest not reachable");
            const manifest=JSON.parse(m.body);
            assert.equal(manifest.id,"/kids/test-android-app");
            assert.equal(manifest.start_url,"/kids/start.html?env=kids-test");
            assert.equal(manifest.scope,"/kids/");
            console.log("KIDS TEST manifest verified on isolated domain");
            for(const path of ["/kids/test-install.html","/kids/start.html","/kids/icons/icon-192.png","/kids/sw.js"]){
              const resp=await get(path);
              assert.equal(resp.status,200,path+" missing");
              assert.ok(resp.body.length>0,path+" empty");
              assert.equal(resp.headers.get("X-Kids-Environment"),"test");
              console.log("Kids TEST route OK:",path);
            }
            for(const path of ["/test/","/kids/test-android/worker.js"]){
              const resp=await get(path);
              assert.equal(resp.status,404,path+" must be blocked");
            }
            console.log("PASS: isolated Android Kids Test PWA is online; visitor app unchanged");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
