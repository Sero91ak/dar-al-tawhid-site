name: Import Kids Hero Assets V1097

on:
  push:
    paths:
      - ".github/workflows/import-kids-hero-assets-v1095.yml"

permissions:
  contents: write

concurrency:
  group: kids-hero-assets-v1097
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to newest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download final realistic hero artwork
        env:
          STORY_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ffcadcd3-9f63-4cde-8190-e116f3641b2c"
          PARENTS_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:33d85e65-e83a-4155-854d-b420cf4179dc"
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-art
          curl --fail --location --retry 5 --retry-all-errors "$STORY_URL" -o kids/assets/kids-art/section-stories-v1097.png
          curl --fail --location --retry 5 --retry-all-errors "$PARENTS_URL" -o kids/assets/kids-art/section-parents-v1097.png
          test -s kids/assets/kids-art/section-stories-v1097.png
          test -s kids/assets/kids-art/section-parents-v1097.png
          file kids/assets/kids-art/section-stories-v1097.png
          file kids/assets/kids-art/section-parents-v1097.png

      - name: Wire artwork into Kids app
        run: |
          node <<'NODE'
          const fs = require("fs");
          const heroCssPath = "kids/section-heroes-v1095.css";
          let heroCss = fs.readFileSync(heroCssPath, "utf8");
          const marker = "KIDS_SECTION_HERO_REALISM_V1097";
          if (!heroCss.includes(marker)) {
            const addition = [
              "",
              "/* KIDS_SECTION_HERO_REALISM_V1097",
              "   Fotorealistische, ruhige Bereichsbilder passend zu Propheten/Ṣaḥābah. */",
              "body .app #view-stories.view > .page-head.page-head{",
              "  background-image:",
              "    linear-gradient(90deg,rgba(3,18,29,.74) 0%,rgba(3,18,29,.42) 41%,rgba(3,18,29,.10) 72%,rgba(3,18,29,.02) 100%),",
              "    linear-gradient(180deg,rgba(3,18,29,.01) 0%,rgba(3,18,29,.02) 48%,rgba(5,27,42,.20) 73%,#0c2636 100%),",
              "    url(\\\"/kids/assets/kids-art/section-stories-v1097.png?v=1097-real3\\\")!important;",
              "  background-position:center 49%!important;",
              "}",
              "body .app #view-parents.view > .page-head.page-head{",
              "  background-image:",
              "    linear-gradient(90deg,rgba(3,18,29,.76) 0%,rgba(3,18,29,.44) 42%,rgba(3,18,29,.11) 73%,rgba(3,18,29,.02) 100%),",
              "    linear-gradient(180deg,rgba(3,18,29,.01) 0%,rgba(3,18,29,.02) 49%,rgba(4,24,38,.21) 74%,#0c2636 100%),",
              "    url(\\\"/kids/assets/kids-art/section-parents-v1097.png?v=1097-real3\\\")!important;",
              "  background-position:center 48%!important;",
              "}",
              ""
            ].join("\\n");
            heroCss += addition;
          }
          fs.writeFileSync(heroCssPath, heroCss);

          const storyCssPath = "kids/stories-final-v1088.css";
          let storyCss = fs.readFileSync(storyCssPath, "utf8");
          storyCss = storyCss.replaceAll(
            'url("https://at.adobe.com/jaPS3uCKdEKCahM6")!important;',
            'url("/kids/assets/kids-art/section-stories-v1097.png?v=1097-real3")!important;'
          );
          fs.writeFileSync(storyCssPath, storyCss);

          for (const p of ["kids/index.html","kids/start.html","kids/shell.html"]) {
            let html = fs.readFileSync(p, "utf8");
            html = html
              .replaceAll("/kids/section-heroes-v1095.css?v=1096-real2", "/kids/section-heroes-v1095.css?v=1097-real3")
              .replaceAll("/kids/section-heroes-v1095.css?v=1097-real3", "/kids/section-heroes-v1095.css?v=1097-real3");
            if (!html.includes("/kids/section-heroes-v1095.css?v=1097-real3")) {
              throw new Error(p + ": section hero stylesheet not wired");
            }
            fs.writeFileSync(p, html);
          }

          const swPath = "kids/sw.js";
          let sw = fs.readFileSync(swPath, "utf8");
          sw = sw
            .replaceAll("/kids/section-heroes-v1095.css?v=1096-real2", "/kids/section-heroes-v1095.css?v=1097-real3")
            .replaceAll("/kids/assets/kids-art/section-stories-v1096.jpg?v=1096-real2", "/kids/assets/kids-art/section-stories-v1097.png?v=1097-real3")
            .replaceAll("/kids/assets/kids-art/section-parents-v1096.jpg?v=1096-real2", "/kids/assets/kids-art/section-parents-v1097.png?v=1097-real3")
            .replaceAll("/kids/assets/kids-art/section-stories-v1094.jpg?v=1094-compact1", "/kids/assets/kids-art/section-stories-v1097.png?v=1097-real3")
            .replaceAll("/kids/assets/kids-art/section-parents-v1090.jpg?v=1090", "/kids/assets/kids-art/section-parents-v1097.png?v=1097-real3");
          fs.writeFileSync(swPath, sw);

          if (!heroCss.includes("section-stories-v1097.png") || !heroCss.includes("section-parents-v1097.png")) {
            throw new Error("V1097 hero URLs missing");
          }
          NODE

      - name: Commit app change and remove one-shot importer
        run: |
          set -euo pipefail
          git config user.name "DAR AL TAWḤĪD App Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/import-kids-hero-assets-v1095.yml
          git add kids/assets/kids-art/section-stories-v1097.png
          git add kids/assets/kids-art/section-parents-v1097.png
          git add kids/section-heroes-v1095.css
          git add kids/stories-final-v1088.css
          git add kids/index.html kids/start.html kids/shell.html kids/sw.js
          git commit -m "Kids: realistische Geschichten- und Eltern-Heroes V1097"
          git pull --rebase origin main
          git push origin HEAD:main
