name: Import Kids Hero Assets V1095

on:
  push:
    paths:
      - ".github/workflows/import-kids-hero-assets-v1095.yml"

permissions:
  contents: write

concurrency:
  group: kids-hero-assets-v1095
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh to newest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download final realistic hero artwork
        env:
          STORY_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ffcadcd3-9f63-4cde-8190-e116f3641b2c"
          PARENTS_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:33d85e65-e83a-4155-854d-b420cf4179dc"
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-art
          curl --fail --location --retry 5 --retry-all-errors "$STORY_URL" -o kids/assets/kids-art/section-stories-v1095.png
          curl --fail --location --retry 5 --retry-all-errors "$PARENTS_URL" -o kids/assets/kids-art/section-parents-v1095.png
          test -s kids/assets/kids-art/section-stories-v1095.png
          test -s kids/assets/kids-art/section-parents-v1095.png
          file kids/assets/kids-art/section-stories-v1095.png
          file kids/assets/kids-art/section-parents-v1095.png

      - name: Wire artwork into Kids app
        run: |
          node <<'NODE'
          const fs = require("fs");

          const cssPath = "kids/section-heroes-v1090.css";
          let css = fs.readFileSync(cssPath, "utf8");
          css = css
            .replace(/url\("\/kids\/assets\/kids-art\/section-stories-v1094\.jpg\?v=[^"]+"\)!important;/g,
              'url("/kids/assets/kids-art/section-stories-v1095.png?v=1095-realistic1")!important;')
            .replace(/url\("\/kids\/assets\/kids-art\/section-parents-v1090\.jpg\?v=[^"]+"\)!important;/g,
              'url("/kids/assets/kids-art/section-parents-v1095.png?v=1095-realistic1")!important;')
            .replace(
              'linear-gradient(90deg,rgba(3,18,29,.88) 0%,rgba(3,18,29,.63) 39%,rgba(3,18,29,.18) 72%,rgba(3,18,29,.04) 100%),',
              'linear-gradient(90deg,rgba(3,18,29,.80) 0%,rgba(3,18,29,.52) 40%,rgba(3,18,29,.12) 73%,rgba(3,18,29,.02) 100%),'
            )
            .replace(
              'linear-gradient(90deg,rgba(3,18,29,.91) 0%,rgba(3,18,29,.62) 42%,rgba(3,18,29,.18) 72%,rgba(3,18,29,.04) 100%),',
              'linear-gradient(90deg,rgba(3,18,29,.84) 0%,rgba(3,18,29,.55) 42%,rgba(3,18,29,.13) 73%,rgba(3,18,29,.02) 100%),'
            );
          if (!css.includes("section-stories-v1095.png") || !css.includes("section-parents-v1095.png")) {
            throw new Error("Hero asset rewrite failed");
          }
          fs.writeFileSync(cssPath, css);

          for (const p of ["kids/index.html","kids/start.html","kids/shell.html"]) {
            let html = fs.readFileSync(p, "utf8");
            html = html.replaceAll(
              "/kids/section-heroes-v1090.css?v=1094-compact1",
              "/kids/section-heroes-v1090.css?v=1095-realistic1"
            );
            if (!html.includes("/kids/section-heroes-v1090.css?v=1095-realistic1")) {
              throw new Error(p + ": CSS cache-bust rewrite failed");
            }
            fs.writeFileSync(p, html);
          }

          const swPath = "kids/sw.js";
          let sw = fs.readFileSync(swPath, "utf8");
          sw = sw
            .replaceAll("/kids/section-heroes-v1090.css?v=1094-compact1", "/kids/section-heroes-v1090.css?v=1095-realistic1")
            .replaceAll("/kids/assets/kids-art/section-stories-v1094.jpg", "/kids/assets/kids-art/section-stories-v1095.png")
            .replaceAll("/kids/assets/kids-art/section-parents-v1090.jpg", "/kids/assets/kids-art/section-parents-v1095.png");
          fs.writeFileSync(swPath, sw);
          NODE

      - name: Commit app change and remove one-shot importer
        run: |
          set -euo pipefail
          git config user.name "DAR AL TAWḤĪD App Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/import-kids-hero-assets-v1095.yml
          git add kids/assets/kids-art/section-stories-v1095.png                   kids/assets/kids-art/section-parents-v1095.png                   kids/section-heroes-v1090.css                   kids/index.html kids/start.html kids/shell.html kids/sw.js
          git commit -m "Kids: realistische Geschichten- und Eltern-Heroes"
          git pull --rebase origin main
          git push origin HEAD:main
