name: Dar Test Berechtigungen V2 isolierter Release

on:
  push:
    branches:
      - release/dar-test-permissions-1180-20261015
    paths:
      - .github/workflows/dar-test-permissions-release.yml

permissions:
  contents: read

concurrency:
  group: dar-test-worker-release
  cancel-in-progress: true

jobs:
  deploy-dar-test-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Nur aktuellen main-Stand mit freigegebenem Test-UI kombinieren
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="${GITHUB_SHA}"
          git fetch --no-tags origin main
          git checkout --detach origin/main
          git checkout "$RELEASE_SHA" -- test/assets/dar-setup-hub.js test/assets/dar-setup-hub.css test/assets/notifications-refined-v1.css test/assets/dar-home-library-v1194.js test/assets/dar-today-editorial-v1.css
          node --check test/assets/dar-setup-hub.js
          node --check test/assets/dar-home-library-v1194.js
          grep -Fq 'DAR_TEST_NOTIFICATIONS_REFINED_V1' test/assets/dar-setup-hub.js
          grep -Fq 'DAR_TEST_NOTIFICATION_COMPACT_V2' test/assets/notifications-refined-v1.css
          grep -Fq 'DAR_TEST_TODAY_EDITORIAL_V1' test/assets/dar-home-library-v1194.js
          grep -Fq 'body.is-home-route #darTodayEditorialV1' test/assets/dar-today-editorial-v1.css
          git diff HEAD --name-only > /tmp/dar-test-permissions-changed.txt
          cat /tmp/dar-test-permissions-changed.txt
          if grep -Ev '^test/assets/(dar-setup-hub\.(js|css)|notifications-refined-v1\.css|dar-home-library-v1194\.js|dar-today-editorial-v1\.css)$' /tmp/dar-test-permissions-changed.txt | grep .; then
            echo "::error::Ausschließlich Test-Hub-JS/CSS dürfen geändert werden."
            exit 1
          fi
          git rev-parse origin/main > /tmp/dar-test-main-sha.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Test-App Staging aus test-library-canonical übernehmen
        run: |
          git fetch origin test-library-canonical
          node scripts/overlay-test-staging-from-branch.js
          node scripts/app-stability-repair.js

      # Keep the approved adult Test Quran Player independent of other branches.
      # This affects only /test resources, never visitor or KIDS application code.
      - name: Dar Test Adult Quran V10.8-R canonical assets
        run: |
          git fetch origin test-quran-player-v108r-canonical
          git checkout origin/test-quran-player-v108r-canonical -- test/assets/dar-quran-player.js test/assets/dar-quran-player.css
          node - <<'NODE'
          const fs=require('fs');
          const script=fs.readFileSync('test/assets/dar-quran-player.js','utf8');
          const match=script.match(/PLAYER_BUILD\s*=\s*(\d+)/);
          if(!match)throw Error('Test Quran player build missing');
          const version=match[1], file='test/index.html';
          let html=fs.readFileSync(file,'utf8');
          if(!/\/test\/assets\/dar-quran-player\.js\?v=\d+/.test(html)||!/var WANT=\d+;/.test(html))
            throw Error('Test shell missing player script or boot version');
          html=html.replace(/(\/test\/assets\/dar-quran-player\.js\?v=)\d+/g, '$1'+version)
                   .replace(/var WANT=\d+;/g, 'var WANT='+version+';');
          fs.writeFileSync(file,html);
          console.log('Dar Test Quran Player canonical version',version);
          NODE

      - name: Build + Build-IDs synchronisieren
        run: npm run build

      - name: Originales iOS-Dar-Test-Icon für Android-Web-App erzeugen
        shell: bash
        run: |
          set -euo pipefail
          node test/tools/build-apple-icons.cjs
          test -s test/assets/dar-test-apple-icon-192.png
          test -s test/assets/dar-test-apple-icon-512.png
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('test/manifest.json','utf8'));
          if(m.id!=='/test/?env=staging'||m.scope!=='/test/')throw Error('Test manifest scope mismatch');
          for(const icon of m.icons||[]){
            const name=icon.src.split('?')[0].replace(/^\//,'');
            const png=fs.readFileSync(name);
            const expected=Number(icon.sizes.split('x')[0]);
            if(!png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]))||png.readUInt32BE(16)!==expected||png.readUInt32BE(20)!==expected)throw Error('PNG icon mismatch '+name);
          }
          NODE

      - name: Verify Android DAR TEST installation
        run: node test/tools/check-android-install.cjs

      - name: Dar Test Health Check
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ""
        run: |
          node --check cloudflare/test-app-worker.js
          node scripts/test-app-health-check.js
          node scripts/library-deploy-guard.js
          node scripts/app-stability-guard.js
          node scripts/push-system-guard.js
          node scripts/push-lanes-guard.js

      - name: Nur relevante neuere Änderungen gegen veralteten Test-Build absichern
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/dar-test-main-sha.txt)"
          git fetch --no-tags origin main
          LATEST="$(git rev-parse origin/main)"
          if [ "$BASE" != "$LATEST" ]; then
            git diff --name-only "$BASE" "$LATEST" -- \
              test/ assets/ data/ index.html version.json \
              scripts/ cloudflare/  package.json package-lock.json \
              service-worker.js manifest.json wrangler.test.toml \
              .github/workflows/deploy-test-app.yml \
              > /tmp/dar-test-release-relevant-changes.txt
            if [ -s /tmp/dar-test-release-relevant-changes.txt ]; then
              cat /tmp/dar-test-release-relevant-changes.txt
              echo "::error::Relevante App-Dateien wurden während des Builds aktualisiert. Test-Release aus Sicherheitsgründen gestoppt."
              exit 1
            fi
            echo "Nur irrelevante Metadaten seit dem Build geändert – Test-Release weiterhin aktuell."
          fi

      - name: Deploy Dar Test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.test.toml


      - name: Test-Worker-Assets direkt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dar-al-tawhid-test.sero91ak.workers.dev/test/assets"
          for i in 1 2 3 4 5; do
            curl -fsSL -H "Cache-Control: no-cache" "$BASE/dar-setup-hub.js?verify=${GITHUB_RUN_ID}-$i" -o /tmp/dar-test-hub-live.js || true
            curl -fsSL -H "Cache-Control: no-cache" "$BASE/dar-home-library-v1194.js?verify=${GITHUB_RUN_ID}-$i" -o /tmp/dar-test-home-live.js || true
            curl -fsSL -H "Cache-Control: no-cache" "$BASE/notifications-refined-v1.css?verify=${GITHUB_RUN_ID}-$i" -o /tmp/dar-test-notify-live.css || true
            if grep -Fq 'DAR_TEST_NOTIFICATIONS_REFINED_V1' /tmp/dar-test-hub-live.js 2>/dev/null &&
               grep -Fq 'DAR_TEST_TODAY_EDITORIAL_V1' /tmp/dar-test-home-live.js 2>/dev/null &&
               grep -Fq 'DAR_TEST_NOTIFICATION_COMPACT_V2' /tmp/dar-test-notify-live.css 2>/dev/null; then
              node --check /tmp/dar-test-hub-live.js
              node --check /tmp/dar-test-home-live.js
              echo "Dar Test: Neue Berechtigungszentrale und Heute-Karten nachgewiesen."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Test-Deploy ist noch nicht durch die direkte Worker-Asset-URL bestätigt."
          exit 1
