name: DĀR Test · temporary 50/50 preview QA
on:
  pull_request:
    paths:
      - 'test/assets/dar-duo-responsive-v1.js'
      - 'test/assets/dar-duo-responsive-v1.css'
      - 'test/tools/duo-half-preview-qa.cjs'
      - '.github/workflows/dar-test-half-preview-temp.yml'
permissions:
  contents: read
jobs:
  real-fold-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/tools/duo-half-preview-qa.cjs
