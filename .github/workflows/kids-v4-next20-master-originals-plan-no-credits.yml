name: KIDS V4 Next 20 Safe Master Originals Plan (zero credits)
on:
  push:
    branches: [review/kids-quiz-v4-batch-001-020-20261014]
    paths:
      - kids/tools/plan_quiz_v4_450_next_canonical_paid_origins.py
      - kids/tools/test_quiz_v4_450_wave_checkpoint_dry.py
      - kids/tools/generate_quiz_v4_450_paid_batch02.py
      - .github/workflows/kids-v4-next20-master-originals-plan-no-credits.yml
permissions:
  contents: read
jobs:
  next-20-verified-canonical-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout original private 450 review
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Protect paid Flow receipts and prepare exact 20 original recording texts
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/generate_quiz_v4_450_paid_batch02.py kids/tools/plan_quiz_v4_450_next_canonical_paid_origins.py
          python3 kids/tools/test_quiz_v4_canonical_dictionary_payload.py
          python3 kids/tools/test_quiz_v4_450_wave_checkpoint_dry.py
          python3 kids/tools/plan_quiz_v4_450_next_canonical_paid_origins.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('kids/review-only/quiz-v4-450-next20-real-original-recording-plan.json').read_text(encoding='utf-8'))
          assert report['modelId']=='eleven_v4' and report['selectedQuestions']==450
          assert report['ownerMasterDictionaryRules']==10099
          assert report['nextExistingSelectionSize']==20
          assert report['actualPaidRecordingsInThisPlan']==0
          assert report['newElevenLabsCreditsSpent']==0 and report['publicReleaseAllowed'] is False
          sha=[x['originalTextSha256'] for x in report['immediatelySynthesisSafeExactNewTexts']]
          assert len(sha)==len(set(sha))
          assert json.loads(Path('kids/data/quiz-curation-release.json').read_text())['enabled'] is False
          print('PASS: distinct new source SHA only, original 10099-rule Fuṣḥā lexicon protected and ZERO paid calls')
          PY
      - name: Keep no-credit next twenty recording plan for audited production
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-450-next20-owner-master-tts-no-credit-plan
          retention-days: 30
          path: kids/review-only/quiz-v4-450-next20-real-original-recording-plan.json
