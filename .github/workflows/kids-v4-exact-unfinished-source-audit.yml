name: KIDS V4 Exact 107 Missing Source Audit - Zero Credits
on:
  push:
    branches:
      - review/kids-quiz-v4-batch-001-020-20261014
    paths:
      - kids/review-only/quiz-v4-20261021-exact-remaining-audit-trigger.json
permissions:
  contents: write
concurrency:
  group: kids-v4-current-real-missing-source-zero-credit-audit
  cancel-in-progress: false
jobs:
  audit-current-fusha-original-blockers:
    if: >-
      github.repository == 'Sero91ak/dar-al-tawhid-site' &&
      github.ref_name == 'review/kids-quiz-v4-batch-001-020-20261014' &&
      github.event.head_commit.message == 'audit(kids V4): run exact private remaining-originals reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest real original MP3 and 450 review source state
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
          fetch-depth: 0
      - name: Assert no live release and no external charge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('kids/review-only/quiz-v4-20261021-exact-remaining-audit-trigger.json').read_text())
          assert request == {
            'scope':'KIDS_V4_450_EXACT_UNFINISHED_SOURCE_RECONCILIATION',
            'onlyPreviouslySavedGenuineMP3s':True,
            'newElevenLabsCreditsAllowed':0,
            'elevenLabsProviderCallsAllowed':False,
            'previouslyPaidOriginalRepurchaseForbidden':True,
            'ownerRejectedPronunciationBlocked':True,
            'noPublicRelease':True
          }
          assert json.loads(Path('kids/data/quiz-curation-release.json').read_text())['enabled'] is False
          print('PASS KIDS source audit: no credentials, no TTS, no released MP3')
          PY
      - name: Recompute every unfinished question from real staged audio and canonical Fuṣḥā sources
        run: |
          python3 -m py_compile kids/tools/audit_quiz_v4_exact_remaining_107.py
          python3 kids/tools/audit_quiz_v4_exact_remaining_107.py
      - name: Save authoritative reconciliation to private review, never main
        run: |
          set -euo pipefail
          git config user.name kids-v4-zero-credit-audit
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/review-only/quiz-v4-current-unfinished-questions-source-audit.json
          if git diff --cached --quiet; then
            echo 'Already up to date; no new audio costs'
            exit 0
          fi
          git commit -m 'audit(kids V4): publish exact remaining source blockers without TTS [skip ci]'
          for i in 1 2 3 4; do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014; then
              echo 'Source-blocker report saved, originals and release unchanged'
              exit 0
            fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            if git rebase FETCH_HEAD; then
              python3 kids/tools/audit_quiz_v4_exact_remaining_107.py
              git add kids/review-only/quiz-v4-current-unfinished-questions-source-audit.json
              git commit --amend --no-edit || true
            else
              echo 'Remote version conflict; do not overwrite new audio'
              exit 1
            fi
          done
          exit 1
      - name: Archive exact zero-credit 450 QA for subsequent recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-current-unfinished-exact-source-report-zero-credits
          retention-days: 90
          if-no-files-found: warn
          path: kids/review-only/quiz-v4-current-unfinished-questions-source-audit.json
