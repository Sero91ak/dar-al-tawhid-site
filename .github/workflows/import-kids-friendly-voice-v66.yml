name: Import Kids Friendly Voice V66

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kids-friendly-voice-v66.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download friendly Kids greeting
        env:
          VOICE_URL_B64: ""
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-cinema
          VOICE_URL="$(printf '%s' "$VOICE_URL_B64" | base64 -d)"
          curl -L --fail --retry 4 --retry-delay 2 "$VOICE_URL"             -o kids/assets/kids-cinema/intro-voice-friendly.mp3
          test -s kids/assets/kids-cinema/intro-voice-friendly.mp3
          test "$(wc -c < kids/assets/kids-cinema/intro-voice-friendly.mp3)" -gt 10000
      - name: Commit voice
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/kids-cinema/intro-voice-friendly.mp3
          if git diff --cached --quiet; then
            echo "Friendly voice already current."
            exit 0
          fi
          git commit -m "Kids V0.66: add friendly intro voice fallback"
          git push origin HEAD:main
