name: Restore links and add App Store separately

on:
  push:
    paths:
      - '.github/workflows/restore-links-add-appstore.yml'

permissions:
  contents: write

jobs:
  patch-links:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact original links page
        run: git show 39f09310a8848bb539aaf1c6bf6265832aa9a48d:links/index.html > links/index.html

      - name: Restore supplied App Store icon
        shell: python
        run: |
          import os, json, base64, urllib.request, pathlib
          url = 'https://api.github.com/repos/Sero91ak/dar-al-tawhid-site/git/blobs/fcd232c146c69f626d1dfce025f0c8a159dd3fc7'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          raw = base64.b64decode(data['content'])
          pathlib.Path('assets').mkdir(exist_ok=True)
          pathlib.Path('assets/app-store-icon.png').write_bytes(raw)

      - name: Add App Store as separate row only
        shell: python
        run: |
          import pathlib
          p = pathlib.Path('links/index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'Telegram, Instagram, Website, WhatsApp, Bibliothek & Community und App – alle offiziellen Kanäle an einem Ort.',
              'Telegram, Instagram, Website, WhatsApp, Bibliothek & Community, Web-App und App Store – alle offiziellen Kanäle an einem Ort.'
          )

          text = text.replace(
              '.community{--accent:#7c48b8}.app{--accent:#61a846}',
              '.community{--accent:#7c48b8}.app{--accent:#61a846}.appstore{--accent:#2497e8}'
          )

          text = text.replace(
              '.app .emblem .emblem-img{width:72%;height:72%}',
              '.app .emblem .emblem-img{width:72%;height:72%}.appstore .emblem{background:transparent}.appstore .emblem .emblem-img{width:100%;height:100%;border-radius:50%;object-fit:cover}'
          )

          old = '''      <button class="row app" id="openApp" type="button"><span class="emblem" aria-hidden="true"><img class="emblem-img"'''
          idx = text.find(old)
          assert idx != -1, 'Original Web-App button not found'
          end = text.find('</button>', idx)
          assert end != -1, 'Original Web-App button end not found'
          end += len('</button>')

          appstore = '''\n      <a class="row appstore" href="https://apps.apple.com/de/app/d%C4%81r-al-taw%E1%B8%A5%C4%ABd/id6805988753" target="_blank" rel="noopener noreferrer" aria-label="DĀR AL TAWḤĪD im Apple App Store öffnen"><span class="emblem" aria-hidden="true"><img class="emblem-img" src="/assets/app-store-icon.png" alt="" /></span><span class="text"><span class="label">App Store</span><span class="value">DĀR AL TAWḤĪD App</span></span><span class="go">›</span></a>'''
          text = text[:end] + appstore + text[end:]

          assert 'id="openApp"' in text
          assert 'id="appModal"' in text
          assert 'class="row appstore"' in text
          assert '/assets/app-store-icon.png' in text
          assert text.count('apps.apple.com/de/app/') == 1
          p.write_text(text, encoding='utf-8')

      - name: Commit corrected links page
        run: |
          git config user.name "Serhat Abu Malik"
          git config user.email "73606501+Sero91ak@users.noreply.github.com"
          git add links/index.html assets/app-store-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Links: restore Web-App and add App Store separately"
          git push
