name: Validate Kids Dua Audio Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kids/dua-smart-learn.js'
      - 'kids/data/dua-arabic-audio.json'
      - 'kids/data/dua-arabic-slow-audio.json'
      - 'kids/data/dua-word-audio.json'
      - 'kids/data/dua-audio-model-policy.json'
      - 'kids/index.html'
      - 'kids/start.html'
      - 'kids/shell.html'
      - 'kids/sw.js'
      - 'scripts/kids-dua-audio-playback-guard.js'
      - 'scripts/kids-dua-audio-acoustic-audit.py'
      - '.github/workflows/build-kids-quiz-owner-voice.yml'
      - '.github/workflows/validate-kids-dua-audio.yml'
  push:
    branches: [main]
    paths:
      - 'kids/dua-smart-learn.js'
      - 'kids/owner-voice.js'
      - 'kids/dua-hub-v1219.js'
      - 'kids/index.html'
      - 'kids/sw.js'
      - 'kids/data/dua-audio.json'
      - 'kids/data/dua-arabic-audio.json'
      - 'kids/data/dua-arabic-slow-audio.json'
      - 'kids/data/dua-word-audio.json'
      - 'kids/data/dua-audio-model-policy.json'
      - '.github/workflows/validate-kids-dua-audio.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check kids/dua-smart-learn.js
          node --check kids/owner-voice.js
          node --check kids/dua-hub-v1219.js
          node --check kids/sw.js
      - name: Check voice synthesis Python source before any paid request
        run: |
          python3 - <<'PY'
          import pathlib, re, textwrap
          text=pathlib.Path(".github/workflows/build-kids-quiz-owner-voice.yml").read_text(encoding="utf-8")
          blocks=re.findall(r"(?ms)^          python3 - <<'PY'\n(.*?)^          PY\s*$",text)
          candidates=[textwrap.dedent(part) for part in blocks if "def build_pack" in part]
          assert len(candidates)==1,"Cannot uniquely extract Kids voice generator for static QA"
          compile(candidates[0],"<Kids owner-voice generator>","exec")
          print("VOICE PYTHON SYNTAX PASS (no synthesis, zero credits)")
          PY
      - name: Check targeted Du'a Fuṣḥā player regression
        run: node scripts/kids-dua-audio-playback-guard.js
      - name: Check Du'a manifests and sample assets
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          specs=[
            ("kids/data/dua-audio.json",122),
            ("kids/data/dua-arabic-audio.json",120),
            ("kids/data/dua-arabic-slow-audio.json",120),
            ("kids/data/dua-word-audio.json",696),
          ]
          for path, expected in specs:
            data=json.loads((root/path).read_text(encoding="utf-8"))
            entries=data.get("entries") or {}
            assert len(entries)==expected,(path,len(entries),expected)
            assert data.get("modelId")=="eleven_v4",(path,data.get("modelId"))
            assert data.get("voiceProfileId")=="serhat-owner-voice-2026",(path,data.get("voiceProfileId"))
            assert "Serhat Abu Malik" in str(data.get("speaker") or ""),(path,data.get("speaker"))
            if path in {
              "kids/data/dua-arabic-audio.json",
              "kids/data/dua-arabic-slow-audio.json",
              "kids/data/dua-word-audio.json"
            }:
              assert data.get("pronunciationDictionaryApplied") is False,(path,data.get("pronunciationDictionaryApplied"))
            for entry in entries.values():
              if path in {
                "kids/data/dua-arabic-audio.json",
                "kids/data/dua-arabic-slow-audio.json",
                "kids/data/dua-word-audio.json"
              }:
                assert entry.get("pronunciationDictionaryApplied") is False,(path,entry.get("pronunciationDictionaryApplied"))
              url=str(entry.get("url") or "").split("?",1)[0]
              p=root/url.lstrip("/")
              assert p.exists() and p.stat().st_size>1200,(path,url)
          # Arabic packs use exact vocalized Fuṣḥā. Full, slow and word are
          # dedicated v3 renders with Eleven v4 and Arabic-native delivery.
          expected_revisions={
            "kids/data/dua-arabic-audio.json":"dua-arabic-native-fusha-v3-20261007",
            "kids/data/dua-arabic-slow-audio.json":(
              "dua-arabic-native-fusha-slow-v3-20261007",
              "dua-arabic-native-fusha-slow-v4-natural-20261009"
            ),
            "kids/data/dua-word-audio.json":(
              "dua-arabic-native-fusha-word-v4-20261007",
              "dua-arabic-native-fusha-word-v5-natural-20261009"
            ),
          }
          for path,expected_revision in expected_revisions.items():
            data=json.loads((root/path).read_text(encoding="utf-8"))
            allowed=expected_revision if isinstance(expected_revision,tuple) else (expected_revision,)
            assert data.get("arabicSynthesisRevision") in allowed,(path,data.get("arabicSynthesisRevision"),allowed)
            active_revision=data.get("arabicSynthesisRevision")
            assert data.get("pronunciationDictionaryApplied") is False,(path,data.get("pronunciationDictionaryApplied"))
            assert data.get("pronunciationDictionaryId") is None,(path,data.get("pronunciationDictionaryId"))
            assert int(data.get("pronunciationDictionaryRuleCount") or 0)==0,(path,data.get("pronunciationDictionaryRuleCount"))
            for entry in (data.get("entries") or {}).values():
              assert entry.get("pronunciationDictionaryApplied") is False,(path,entry.get("pronunciationDictionaryApplied"))
              assert entry.get("arabicSynthesisRevision")==active_revision,(path,entry.get("arabicSynthesisRevision"),active_revision)
          print("Du'a manifests and audio assets OK")
          PY

      - name: Provide FFmpeg decoder for real M4A acoustic inspection
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Diagnose 10 existing V4 Fuṣḥā word clips (non-destructive)
        run: python3 scripts/kids-dua-audio-acoustic-audit.py
      - name: Scan all 696 V4 word clips for duration and quiet padding
        run: python3 scripts/kids-dua-audio-acoustic-audit.py --all
      - name: Check all 120 Du'a runtime key matches
        run: |
          node <<'NODE'
          const fs=require("fs");
          const dua=JSON.parse(fs.readFileSync("kids/data/dua-kids.json","utf8"));
          const de=JSON.parse(fs.readFileSync("kids/data/dua-audio.json","utf8"));
          const ar=JSON.parse(fs.readFileSync("kids/data/dua-arabic-audio.json","utf8"));
          const slow=JSON.parse(fs.readFileSync("kids/data/dua-arabic-slow-audio.json","utf8"));
          const word=JSON.parse(fs.readFileSync("kids/data/dua-word-audio.json","utf8"));
          const norm=s=>String(s||"").replace(/\s+/g," ").trim().normalize("NFD");
          const index=m=>new Map(Object.entries(m.entries||{}).map(([k,v])=>[norm(k),v]));
          const deI=index(de), arI=index(ar), slowI=index(slow), wordI=index(word);
          const failures=[];
          for(const d of dua.items||[]){
            const a=norm(d.audioArabicText||d.arabic||"");
            const g=norm(d.audioGermanText||((d.childPrompt||"")+" "+(d.meaning||"")));
            if(!arI.has(a))failures.push(d.id+": arabic");
            if(!slowI.has(a))failures.push(d.id+": slow");
            if(!deI.has(g))failures.push(d.id+": german");
            const words=String(d.audioArabicText||d.arabic||"")
              .replace(/\s+/g," ").trim().split(/\s+/)
              .map(x=>x.replace(/[\u06D6-\u06DC]/g,"").replace(/^[،؛؟,.!…«»"'()\[\]{}]+|[،؛؟,.!…«»"'()\[\]{}]+$/g,""))
              .filter(x=>Boolean(x)&&/[\u0621-\u064A\u0671]/.test(x));
            for(const w of words){
              if(!wordI.has(norm(w)))failures.push(d.id+": word "+w);
            }
          }
          if(failures.length){
            console.error(failures.slice(0,80).join("\n"));
            throw new Error("Du'a runtime key coverage failed: "+failures.length);
          }
          if((dua.items||[]).length!==120)throw new Error("Du'a count is not 120");
          console.log("DUA RUNTIME KEY COVERAGE OK · 120/120 full + slow + German + isolated words");
          NODE

      - name: Check direct per-Dua audio URLs
        run: |
          node <<'NODE'
          const fs=require("fs");
          const dua=JSON.parse(fs.readFileSync("kids/data/dua-kids.json","utf8"));
          const de=JSON.parse(fs.readFileSync("kids/data/dua-audio.json","utf8"));
          const ar=JSON.parse(fs.readFileSync("kids/data/dua-arabic-audio.json","utf8"));
          const slow=JSON.parse(fs.readFileSync("kids/data/dua-arabic-slow-audio.json","utf8"));
          const word=JSON.parse(fs.readFileSync("kids/data/dua-word-audio.json","utf8"));
          const norm=s=>String(s||"").replace(/\s+/g," ").trim().normalize("NFD");
          const idx=m=>new Map(Object.entries(m.entries||{}).map(([k,v])=>[norm(k),v]));
          const deI=idx(de), arI=idx(ar), slowI=idx(slow), wordI=idx(word);
          const failures=[];
          for(const d of dua.items||[]){
            const a=norm(d.audioArabicText||d.arabic||"");
            const g=norm(d.audioGermanText||((d.childPrompt||"")+" "+(d.meaning||"")));
            const arE=arI.get(a), slowE=slowI.get(a), deE=deI.get(g);
            if(!d.audioArabicUrl) failures.push(d.id+": audioArabicUrl");
            else if(!arE||d.audioArabicUrl!==arE.url) failures.push(d.id+": stale/mismatched audioArabicUrl");
            if(!d.audioArabicSlowUrl) failures.push(d.id+": audioArabicSlowUrl");
            else if(!slowE||d.audioArabicSlowUrl!==slowE.url) failures.push(d.id+": stale/mismatched audioArabicSlowUrl");
            if(!d.audioGermanUrl) failures.push(d.id+": audioGermanUrl");
            else if(!deE||d.audioGermanUrl!==deE.url) failures.push(d.id+": stale/mismatched audioGermanUrl");
            for(const seg of d.learningSegments||[]){
              const key=norm(seg.audioKey||seg.arabic||"");
              const w=wordI.get(key);
              if(!seg.audioUrl) failures.push(d.id+": word "+(seg.arabic||seg.audioKey||""));
              else if(!w||seg.audioUrl!==w.url) failures.push(d.id+": stale/mismatched word "+(seg.arabic||seg.audioKey||""));
            }
          }
          if((dua.items||[]).length!==120) failures.push("total != 120");
          if(Number(dua.counts?.directAudioReady)!==120) failures.push("directAudioReady != 120");
          if(Number(dua.counts?.directWordAudioReady)!==120) failures.push("directWordAudioReady != 120");
          if(failures.length) throw new Error(failures.slice(0,100).join("\n"));
          console.log("DIRECT DUA AUDIO OK · 120/120 URLs exactly match current Serhat V4 manifests");
          NODE
      - name: Verify runtime cache-bust wiring
        run: |
          node <<'NODE'
          const fs=require("fs");
          const version=JSON.parse(fs.readFileSync("kids/version.json","utf8"));
          const html=fs.readFileSync("kids/index.html","utf8");
          const start=fs.readFileSync("kids/start.html","utf8");
          const shell=fs.readFileSync("kids/shell.html","utf8");
          const sw=fs.readFileSync("kids/sw.js","utf8");
          const smart=fs.readFileSync("kids/dua-smart-learn.js","utf8");
          const dock=fs.readFileSync("kids/global-detail-dock-v1247.js","utf8");
          const swVer=String(version.visualSystem.serviceWorkerCache||"").replace(/^v/,"");
          const hubJsVer=String(version.visualSystem.duaHubJsVersion||"");
          const hubCssVer=String(version.visualSystem.duaHubCssVersion||"");
          const must=(ok,label)=>{if(!ok)throw new Error(label);};
          must(html===start&&html===shell,"Kids HTML entry shells differ");
          must(version.buildId&&swVer&&hubJsVer&&hubCssVer,"Kids release versions missing");
          for(const [name,pat] of [["owner voice",/\/kids\/owner-voice\.js\?v=\d+/],["Du'a learning",/\/kids\/dua-smart-learn\.js\?v=\d+/]]){
            must(pat.test(html),name+" script reference missing");
          }
          must(html.includes("/kids/dua-hub-v1219.js?v="+hubJsVer),"Du'a hub JS reference stale");
          must(html.includes("/kids/dua-hub-v1219.css?v="+hubCssVer),"Du'a hub CSS reference stale");
          must(html.includes("/kids/sw.js?v="+swVer),"Kids SW registration stale");
          must(sw.includes("dar-al-tawhid-kids-v"+swVer),"SW cache release mismatch");
          must(sw.includes("/kids/dua-hub-v1219.js?v="+hubJsVer),"SW Du'a hub JS cache mismatch");
          must(sw.includes("/kids/dua-hub-v1219.css?v="+hubCssVer),"SW Du'a hub CSS cache mismatch");
          must(smart.includes('GERMAN_URL="/kids/data/dua-audio.json?v=8"'),"German voice manifest changed");
          must(smart.includes("playGerman:playGerman")&&smart.includes("prepare:prepare"),"Audio hooks missing");
          if(Number(swVer)>=1251){
            must(dock.includes("KIDS_NO_EXTERNAL_SOURCE_PROOF_ACTIONS_V1251"),"Source-only policy missing");
            const dockRef=(html.match(/\/kids\/global-detail-dock-v1247\.js\?v=\d+/)||[])[0];
            must(!!dockRef,"Global source policy asset reference missing");
            must(sw.includes(dockRef),"Global source policy asset not offline cached: "+dockRef);
          }
          console.log("KIDS DUA CACHE-BUST OK",version.buildId,swVer,hubJsVer,hubCssVer);
          NODE

      - name: Live delivery smoke test
        run: |
          set -euo pipefail
          EXPECT_BUILD="$(node -p 'require("./kids/version.json").buildId')"
          EXPECT_HUB_JS="$(node -p 'String(require("./kids/version.json").visualSystem.duaHubJsVersion||"")')"
          CB="$(date +%s)"
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/version.json?cb=$CB" -o /tmp/kids-version-live.json
          node -e 'const live=require("/tmp/kids-version-live.json"),local=require("./kids/version.json");if(live.buildId!==local.buildId)throw new Error("Kids live build mismatch: "+live.buildId+" vs "+local.buildId)'
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/start?cb=$CB" -o /tmp/kids-live.html
          grep -E '/kids/owner-voice.js\?v=[0-9]+' /tmp/kids-live.html
          grep -E '/kids/dua-smart-learn.js\?v=[0-9]+' /tmp/kids-live.html
          grep -F "/kids/dua-hub-v1219.js?v=$EXPECT_HUB_JS" /tmp/kids-live.html

          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/dua-smart-learn.js?cb=$CB" -o /tmp/dua-smart.js
          grep -F 'playGerman:playGerman' /tmp/dua-smart.js
          grep -F 'ensureAudioAttached' /tmp/dua-smart.js

          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-kids.json?v=1244&cb=$CB" -o /tmp/dua-kids-live.json
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-audio.json?v=8&cb=$CB" -o /tmp/dua-de.json
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-arabic-audio.json?v=8&cb=$CB" -o /tmp/dua-ar.json
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-arabic-slow-audio.json?v=3&cb=$CB" -o /tmp/dua-slow.json
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-word-audio.json?v=3&cb=$CB" -o /tmp/dua-word.json

          node <<'NODE'
          const fs=require("fs");
          const specs=[
            ["/tmp/dua-de.json",122],
            ["/tmp/dua-ar.json",120],
            ["/tmp/dua-slow.json",120],
            ["/tmp/dua-word.json",696]
          ];
          for(const [file,count] of specs){
            const d=JSON.parse(fs.readFileSync(file,"utf8"));
            if(d.modelId!=="eleven_v4")throw new Error(file+" not V4");
            if(d.voiceProfileId!=="serhat-owner-voice-2026")throw new Error(file+" not Serhat");
            if(Object.keys(d.entries||{}).length!==count)throw new Error(file+" entry count");
          }
          const live=JSON.parse(fs.readFileSync("/tmp/dua-kids-live.json","utf8"));
          const items=live.items||[];
          if(items.length!==120)throw new Error("live dua count "+items.length);
          const missing=[];
          for(const d of items){
            if(!d.audioArabicUrl)missing.push(d.id+":arabic");
            if(!d.audioArabicSlowUrl)missing.push(d.id+":slow");
            if(!d.audioGermanUrl)missing.push(d.id+":german");
            for(const s of d.learningSegments||[]) if(!s.audioUrl) missing.push(d.id+":word");
          }
          if(missing.length)throw new Error("live direct audio missing: "+missing.slice(0,50).join(","));
          console.log("LIVE DIRECT DUA COVERAGE OK · 120/120");
          const ar=JSON.parse(fs.readFileSync("/tmp/dua-ar.json","utf8"));
          const entry=ar.entries["رَبِّ زِدْنِي عِلْمًا"];
          if(!entry||!entry.url)throw new Error("sample Arabic entry missing");
          fs.writeFileSync("/tmp/sample-url.txt",entry.url.split("?")[0]);
          NODE

          SAMPLE="$(cat /tmp/sample-url.txt)"
          curl -fsSL --max-time 30 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de$SAMPLE?cb=$CB" -o /tmp/dua-sample.m4a
          BYTES="$(wc -c < /tmp/dua-sample.m4a)"
          test "$BYTES" -gt 1200
          python3 - <<'PY'
          p="/tmp/dua-sample.m4a"
          data=open(p,"rb").read(64)
          if b"ftyp" not in data:
              raise SystemExit("Live sample is not an MP4/M4A asset")
          print("LIVE DUA AUDIO OK", len(open(p,"rb").read()))
          PY
