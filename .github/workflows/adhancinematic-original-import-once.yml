name: ONE-TIME ORIGINAL Runway Adhan Cinematic Import
on:
  push:
    branches: [feature/ios-adhan-cinematic-simulator-20261101]
    paths: [.github/workflows/adhancinematic-original-import-once.yml]
permissions:
  contents: write
jobs:
  import-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install video probe for source authenticity verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download and verify FIVE ORIGINAL silent Runway MP4s
        env:
          RUNWAY_FAJR: "https://dnznrvs05pmza.cloudfront.net/seedance_2/cgt-20261101134317-j56x8/SINGLE_UNINTERRUPTED_10_second_photorealistic_historical_film_shot__vertical_portrait_9_16__Ancient_.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjE2NjNjMjVkOTExYTVkZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzY3MzEyNX0.o3pouEyCyjoUKY2nquqMhaHYZ6xI9vDMuu7r5BFtapw"
          RUNWAY_DHUHR: "https://dnznrvs05pmza.cloudfront.net/seedance_2/cgt-20261101134354-b6kq6/One_single_stable_continuous_vertical_9_16_cinematic_shot_of_the_SAME_restrained_8th_10th_century_ea.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzEzNTFmNTU2NThjZGUzMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzYzOTYzN30.V3Bd5fyGNS7jcsJgXr_7nIZp0Ro15_pmI8i29TzV4zE"
          RUNWAY_ASR: "https://dnznrvs05pmza.cloudfront.net/seedance_2/cgt-20261101134356-zt6pw/One_single_stable_continuous_vertical_9_16_cinematic_shot_of_the_SAME_restrained_8th_10th_century_ea.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGFhMzIzYWI1MGZmNTgwOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzY3NDI4M30.dnTagxkkiWMKrs6U7LmseVZ1FZxN_fUlIAFEFOhDPQo"
          RUNWAY_MAGHRIB: "https://dnznrvs05pmza.cloudfront.net/seedance_2/cgt-20261101134358-zs28v/One_single_stable_continuous_vertical_9_16_cinematic_shot_of_the_SAME_restrained_8th_10th_century_ea.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGJlMTY5Njc0NmE2Mjg0YyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzcxMDE4M30.47xlyVJuHSZUUQl_zM8sQx0XqZGEi4sIJ1T1Hf8X7M4"
          RUNWAY_ISHA: "https://dnznrvs05pmza.cloudfront.net/seedance_2/cgt-20261101134400-5fmzw/One_single_stable_continuous_vertical_9_16_cinematic_shot_of_the_SAME_restrained_8th_10th_century_ea.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTVhZjM1OWYwNjc4OTNmMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzY4NjY4N30.6-tTDY-0CY1AXLcRoicoth8GFjCfdQVEpVfhFqpuCQM"
        run: |
          python3 - <<'PY'
          import os,urllib.request,subprocess,struct,hashlib
          from pathlib import Path
          dest=Path('ios/DarAlTawhid/Shared/CinematicMedia'); dest.mkdir(parents=True,exist_ok=True)
          specs=[
            ("FAJR","fajr","03f541e3-e7cf-47f5-9bcc-ce7d97ff24a6",10),
            ("DHUHR","dhuhr","d182c3c9-5e13-4c7e-9675-95ca6b07ce2b",8),
            ("ASR","asr","b3a7718d-66d0-415b-a803-d481053b90a1",8),
            ("MAGHRIB","maghrib","d2dcf692-950c-4e3b-ab81-6bb6a55c5382",8),
            ("ISHA","isha","387c0c44-bd03-4014-9671-628f3fe6aa18",8),
          ]
          for envname,prayer,task,expected in specs:
            target=dest/('dar-adhan-'+prayer+'.mp4')
            if target.exists() and target.stat().st_size>100000:
              print('Already present',target)
              continue
            partial=target.with_suffix('.mp4.download')
            req=urllib.request.Request(os.environ['RUNWAY_'+envname],headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=90) as src, partial.open('wb') as dst:
              while True:
                block=src.read(1024*1024)
                if not block:break
                dst.write(block)
            if partial.stat().st_size<100000 or partial.read_bytes()[:8][4:]!=b'ftyp':
              raise RuntimeError('Runway task '+task+' did not supply an MP4')
            probe=subprocess.run(['ffprobe','-v','error','-show_entries','stream=codec_type,width,height:format=duration','-of','json',str(partial)],capture_output=True,text=True,check=True)
            import json
            metadata=json.loads(probe.stdout)
            vids=[v for v in metadata['streams'] if v['codec_type']=='video']
            audio=[v for v in metadata['streams'] if v['codec_type']=='audio']
            duration=float(metadata['format']['duration'])
            assert len(vids)==1 and not audio, (task,vids,audio)
            assert (vids[0]['width'],vids[0]['height'])==(1080,1920)
            assert abs(duration-expected)<2.0, (task,duration)
            partial.replace(target)
            print('VERIFIED',prayer,'duration',duration,'size',target.stat().st_size,'sha256',hashlib.sha256(target.read_bytes()).hexdigest())
          assert len(list(dest.glob('dar-adhan-*.mp4')))==5
          PY
      - name: Commit the five actual videos ONLY to the independent test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- ios/DarAlTawhid/Shared/CinematicMedia/dar-adhan-{fajr,dhuhr,asr,maghrib,isha}.mp4
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'assets(ios): add verified original five Runway Adhan Cinematic MP4s (9:16, silent)'
            git push origin HEAD:feature/ios-adhan-cinematic-simulator-20261101
          fi
