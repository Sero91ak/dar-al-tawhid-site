name: Kids Academy V9 Curriculum Guard

on:
  pull_request:
    paths:
      - 'kids/akademie/**'
      - 'test/kids/akademie/**'
      - 'scripts/test-kids-academy-creator-v17.js'
      - 'desktop-preview/kids-akademie-unterricht.html'
      - 'kids/data/academy-voice-plan-v9.json'
      - 'kids/data/academy-sidq-voice-plan-v18.json'
      - 'kids/data/academy-audio.json'
      - 'kids/data/academy-audio-staging-v9*.json'
      - 'kids/tools/audit-academy-voice-coverage-v18.js'
      - 'scripts/test-kids-academy-audio-queue-v18.js'
      - 'scripts/test-kids-academy-v9.js'
      - 'scripts/test-kids-academy-school-v11.js'
      - 'scripts/test-kids-academy-direct-voice-v13.js'
      - '.github/workflows/check-kids-academy-v9.yml'
  push:
    branches: [main]
    paths:
      - 'kids/akademie/**'
      - 'test/kids/akademie/**'
      - 'scripts/test-kids-academy-creator-v17.js'
      - 'desktop-preview/kids-akademie-unterricht.html'
      - 'kids/data/academy-voice-plan-v9.json'
      - 'kids/data/academy-sidq-voice-plan-v18.json'
      - 'kids/data/academy-audio.json'
      - 'kids/data/academy-audio-staging-v9*.json'
      - 'kids/tools/audit-academy-voice-coverage-v18.js'
      - 'scripts/test-kids-academy-audio-queue-v18.js'
      - 'scripts/test-kids-academy-v9.js'
      - 'scripts/test-kids-academy-school-v11.js'
      - 'scripts/test-kids-academy-direct-voice-v13.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify curriculum, devices, per-child daily planner and master audio inventory
        run: node scripts/test-kids-academy-v9.js
      - name: School unlock / account-local progress regression
        run: node scripts/test-kids-academy-school-v11.js
      - name: Verify iOS direct Serhat greeting, QA buttons and V4 source clips
        run: node scripts/test-kids-academy-direct-voice-v13.js
      - name: "Verify protected creator preview: full 34 topics and no real child state"
        run: node scripts/test-kids-academy-creator-v17.js
      - name: Verify exact Serhat V4 Academy audio needs without credits
        run: |
          node scripts/test-kids-academy-audio-queue-v18.js
          node kids/tools/audit-academy-voice-coverage-v18.js
      - name: Verify creator-only comprehensive voice audit (no credits)
        run: node test/kids/akademie/test-voice-audit-v20.cjs
      - name: Verify safe V21 four-clip manual audio request (zero credits)
        run: node kids/tools/test-academy-v21-manual-queue.cjs
      - name: JavaScript syntax guard
        run: |
          node --check kids/akademie/curriculum-v1.js
          node --check kids/akademie/curriculum-v2.js
          node --check kids/akademie/school-progress-v11.js
          node --check kids/akademie/pilot-audio-v13.js
          node --check kids/tools/export-academy-voice-plan.js
      - name: Verify story voice staging without credits
        run: |
          python3 -m py_compile kids/tools/build-academy-v9-staging.py kids/tools/build-academy-audio.py
          python3 kids/tools/build-academy-v9-staging.py --dry-run
      - name: Confirm reproducible voice plan remains unchanged
        run: |
          node kids/tools/export-academy-voice-plan.js
          git diff --exit-code -- kids/data/academy-voice-plan-v9.json
