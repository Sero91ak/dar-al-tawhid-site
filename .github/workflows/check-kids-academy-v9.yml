name: Kids Academy V9 Curriculum Guard

on:
  pull_request:
    paths:
      - 'kids/akademie/**'
      - 'test/kids/akademie/**'
      - 'scripts/test-kids-academy-creator-v17.js'
      - 'desktop-preview/kids-akademie-unterricht.html'
      - 'kids/data/academy-voice-plan-v27.json'
      - 'kids/tools/test-academy-v27-authentic.cjs'
      - 'kids/data/academy-voice-plan-v26.json'
      - 'kids/tools/test-academy-v26-authentic.cjs'
      - 'kids/tools/export-academy-voice-plan-v26.cjs'
      - 'kids/data/academy-voice-plan-v25.json'
      - 'kids/tools/test-academy-v25-authentic.cjs'
      - 'kids/tools/export-academy-voice-plan-v25.cjs'
      - 'kids/data/academy-expansion-roadmap-v23.json'
      - 'kids/tools/test-academy-v23-roadmap.cjs'
      - 'kids/data/academy-voice-plan-v9.json'
      - 'kids/data/academy-sidq-voice-plan-v18.json'
      - 'kids/data/academy-audio.json'
      - 'kids/data/academy-audio-staging-v9*.json'
      - 'kids/tools/audit-academy-voice-coverage-v18.js'
      - 'scripts/test-kids-academy-audio-queue-v18.js'
      - 'scripts/test-kids-academy-v9.js'
      - 'scripts/test-kids-academy-school-v11.js'
      - 'scripts/test-kids-academy-direct-voice-v13.js'
      - '.github/workflows/check-kids-academy-v9.yml'
  push:
    branches: [main]
    paths:
      - 'kids/akademie/**'
      - 'test/kids/akademie/**'
      - 'scripts/test-kids-academy-creator-v17.js'
      - 'desktop-preview/kids-akademie-unterricht.html'
      - 'kids/data/academy-voice-plan-v27.json'
      - 'kids/tools/test-academy-v27-authentic.cjs'
      - 'kids/data/academy-voice-plan-v26.json'
      - 'kids/tools/test-academy-v26-authentic.cjs'
      - 'kids/tools/export-academy-voice-plan-v26.cjs'
      - 'kids/data/academy-voice-plan-v25.json'
      - 'kids/tools/test-academy-v25-authentic.cjs'
      - 'kids/tools/export-academy-voice-plan-v25.cjs'
      - 'kids/data/academy-expansion-roadmap-v23.json'
      - 'kids/tools/test-academy-v23-roadmap.cjs'
      - 'kids/data/academy-voice-plan-v9.json'
      - 'kids/data/academy-sidq-voice-plan-v18.json'
      - 'kids/data/academy-audio.json'
      - 'kids/data/academy-audio-staging-v9*.json'
      - 'kids/tools/audit-academy-voice-coverage-v18.js'
      - 'scripts/test-kids-academy-audio-queue-v18.js'
      - 'scripts/test-kids-academy-v9.js'
      - 'scripts/test-kids-academy-school-v11.js'
      - 'scripts/test-kids-academy-direct-voice-v13.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify curriculum, devices, per-child daily planner and master audio inventory
        run: node scripts/test-kids-academy-v9.js
      - name: School unlock / account-local progress regression
        run: node scripts/test-kids-academy-school-v11.js
      - name: Verify iOS direct Serhat greeting, QA buttons and V4 source clips
        run: node scripts/test-kids-academy-direct-voice-v13.js
      - name: "Verify protected creator preview: full 34 topics and no real child state"
        run: node scripts/test-kids-academy-creator-v17.js
      - name: Verify exact Serhat V4 Academy audio needs without credits
        run: |
          node scripts/test-kids-academy-audio-queue-v18.js
          node kids/tools/audit-academy-voice-coverage-v18.js
      - name: Verify creator-only comprehensive voice audit (no credits)
        run: node test/kids/akademie/test-voice-audit-v20.cjs
      - name: Verify safe V21 four-clip manual audio request (zero credits)
        run: node kids/tools/test-academy-v21-manual-queue.cjs
      - name: Verify 4 exact-source V22 lessons and all 3 age groups (zero credits)
        run: node kids/tools/test-academy-v22-authentic.cjs
      - name: Verify deterministic V22 voice plan (zero credits)
        run: |
          node kids/tools/export-academy-voice-plan-v22.cjs
          git diff --exit-code -- kids/data/academy-voice-plan-v22.json
      - name: Verify all 38 creator-preview lessons and three authentic age levels
        run: node test/kids/akademie/test-v22-age-preview.cjs
      - name: Validate 208-slot curriculum, 12 pillars, 3 age profiles and hard source gates (zero credits)
        run: node kids/tools/test-academy-v23-roadmap.cjs
      - name: Verify signed-session 208-slot editor and 12 age-tiered Islamic strands (zero credits)
        run: node test/kids/akademie/test-v23-roadmap-preview.cjs
      - name: Verify 33 Islamic terms and 99 exact age-specific Master voice phrases (zero credits)
        run: |
          node kids/tools/test-academy-term-coach-v24.cjs
          node kids/tools/export-academy-vocabulary-plan-v24.cjs
          git diff --exit-code -- kids/data/academy-vocabulary-voice-plan-v24.json
      - name: Verify seven authentic V25 lessons, three ages; 158 V26-following slots remain locked
        run: |
          node kids/tools/test-academy-v25-authentic.cjs
          node kids/tools/export-academy-voice-plan-v25.cjs
          git diff --exit-code -- kids/data/academy-voice-plan-v25.json
      - name: Verify five exact Qurʾān and authentic Sunnah lessons in all ages, still behind source gates
        run: node kids/tools/test-academy-v26-authentic.cjs
      - name: Rebuild 149 V26 age-specific Serhat V4 requests with zero credits
        run: |
          node kids/tools/export-academy-voice-plan-v26.cjs
          git diff --exit-code -- kids/data/academy-voice-plan-v26.json
      - name: Verify new V27 lessons 51–58, all three age texts and zero-credit Serhat audio plan
        run: node kids/tools/test-academy-v27-authentic.cjs
      - name: Verify sequential unlock and independent 58/150 reading archive
        run: node kids/tools/test-academy-sequential-lock-v27.cjs
      - name: Verify dedicated signed-owner lesson archive and current 58/150 truth (zero credits)
        run: node test/kids/akademie/test-archive-v27.cjs
      - name: JavaScript syntax guard
        run: |
          node --check kids/akademie/curriculum-v1.js
          node --check kids/akademie/curriculum-v2.js
          node --check kids/akademie/curriculum-v22.js
          node --check kids/akademie/curriculum-v25.js
          node --check kids/akademie/curriculum-v26.js
          node --check kids/akademie/curriculum-v27.js
          node --check kids/akademie/term-coach-v24.js
          node --check kids/akademie/school-progress-v11.js
          node --check kids/akademie/pilot-audio-v13.js
          node --check kids/tools/export-academy-voice-plan.js
      - name: Verify story voice staging without credits
        run: |
          python3 -m py_compile kids/tools/build-academy-v9-staging.py kids/tools/build-academy-audio.py
          python3 kids/tools/build-academy-v9-staging.py --dry-run
      - name: Verify frozen V9 archive against exactly the owner-authorized full Salam replacements
        run: |
          cp kids/data/academy-voice-plan-v9.json /tmp/kids-academy-v9-original.json
          node kids/tools/export-academy-voice-plan.js
          node kids/tools/test-academy-v9-full-salam-drift.cjs /tmp/kids-academy-v9-original.json
