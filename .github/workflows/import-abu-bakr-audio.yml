name: Import Abu Bakr Kids Audio

on:
  push:
    paths:
      - ".github/workflows/import-abu-bakr-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-abu-bakr-kids-audio
  cancel-in-progress: false

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Download and optimize owner audio
        env:
          SOURCE_URL: "https://at.adobe.com/RUVL2tMXchhYEHKZ"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids/assets/mubashshirun-story-audio/abu-bakr
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 "$SOURCE_URL" -o /tmp/abu-bakr-source.mp3
          src_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/abu-bakr-source.mp3)"
          python3 - "$src_duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 300 <= d <= 480:
              raise SystemExit(f"Abu Bakr master audio must be 5–8 minutes, got {d:.3f}s")
          PY
          ffmpeg -hide_banner -loglevel error -y             -i /tmp/abu-bakr-source.mp3             -map_metadata -1 -vn -ac 1 -ar 44100             -c:a aac -profile:a aac_low -b:a 64k             -movflags +faststart             kids/assets/mubashshirun-story-audio/abu-bakr/master.m4a
          ffprobe -v error             -show_entries stream=codec_name,sample_rate,channels,bit_rate             -show_entries format=duration,size,bit_rate             -of json kids/assets/mubashshirun-story-audio/abu-bakr/master.m4a

      - name: Bind master audio to Abu Bakr story
        shell: bash
        run: |
          set -euo pipefail
          export AUDIO_PATH="kids/assets/mubashshirun-story-audio/abu-bakr/master.m4a"
          export AUDIO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO_PATH")"
          export AUDIO_BYTES="$(stat -c%s "$AUDIO_PATH")"
          export AUDIO_SHA256="$(sha256sum "$AUDIO_PATH" | awk '{print $1}')"
          export PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node <<'NODE'
          const fs=require("fs");
          const manifestPath="kids/data/mubashshirun-stories.json";
          const versionPath="kids/version.json";
          const manifest=JSON.parse(fs.readFileSync(manifestPath,"utf8"));
          const version=JSON.parse(fs.readFileSync(versionPath,"utf8"));
          const item=(manifest.items||[]).find(x=>x&&x.id==="abu-bakr");
          if(!item)throw new Error("Abu Bakr story missing");
          const nextVersion=Math.max(Number(manifest.version||0)+1,8);
          const duration=Number(process.env.AUDIO_DURATION||0);
          const bytes=Number(process.env.AUDIO_BYTES||0);
          const sha256=String(process.env.AUDIO_SHA256||"");
          const publishedAt=String(process.env.PUBLISHED_AT||new Date().toISOString());
          if(!(duration>=300&&duration<=480))throw new Error("Audio duration outside 5–8 minute master policy");
          if(!bytes||sha256.length!==64)throw new Error("Audio metadata invalid");
          const url="/kids/assets/mubashshirun-story-audio/abu-bakr/master.m4a?v="+nextVersion;
          item.audio=item.audio&&typeof item.audio==="object"?item.audio:{};
          const base={
            status:"ready",
            url,
            durationSec:Number(duration.toFixed(3)),
            bytes,
            sha256,
            mime:"audio/mp4",
            voiceProfile:"kids_story",
            voiceProfileId:"serhat-owner-voice-2026",
            source:"DĀR Kids owner-audio upload",
            sourceSpeaker:"Serhat Abu Malik",
            sourceFile:"Sahaba Abu Bakr as-Siddiq Audio.mp3",
            manual:true,
            manualUpload:true,
            ownerApproved:true,
            modes:["read","listen"],
            technicalQaPassed:true,
            publishedAt,
            masterAudio:true,
            masterAgeRange:"4-10"
          };
          for(const age of ["4-5","6-8","9-10"]){
            item.audio[age]={...base,age};
          }
          item.voiceProduction={
            ...(item.voiceProduction&&typeof item.voiceProduction==="object"?item.voiceProduction:{}),
            status:"audio-complete",
            audioRefreshRequired:false,
            publishedAges:["4-5","6-8","9-10"],
            lastPublishedAt:publishedAt,
            singleMasterAudio:true,
            masterAudioUrl:url,
            masterAgeRange:"4-10"
          };
          manifest.version=nextVersion;
          manifest.updatedAt=publishedAt;
          version.visualSystem=version.visualSystem||{};
          version.visualSystem.mubashshirunDataVersion=nextVersion;
          version.visualSystem.abuBakrOwnerAudio=true;
          version.visualSystem.abuBakrOwnerAudioDurationSec=Number(duration.toFixed(3));
          version.visualSystem.abuBakrOwnerAudioCodec="aac-64k-mono";
          version.updatedAt=publishedAt.slice(0,10);
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,2)+"\n");
          fs.writeFileSync(versionPath,JSON.stringify(version,null,2)+"\n");
          console.log(JSON.stringify({nextVersion,url,duration,bytes,sha256},null,2));
          NODE

      - name: Validate Kids release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kids-prophet-release-guard.js

      - name: Commit Abu Bakr audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAR Kids Audio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add             kids/assets/mubashshirun-story-audio/abu-bakr/master.m4a             kids/data/mubashshirun-stories.json             kids/version.json
          git diff --cached --stat
          git commit -m "Kids: publish Abu Bakr master audio"
          git push origin HEAD:main
