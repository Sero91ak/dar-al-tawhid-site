name: KIDS V4 Stage1 REAL Paid MP3 and Receipt Audit (zero credits)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/tools/audit_quiz_v4_stage1_paid_audio_integrity.py'
      - 'kids/data/quiz-v4-older-stage1-request-journal.json'
      - 'kids/data/quiz-v4-older-stage1-usage.json'
      - 'kids/data/quiz-v4-450-paid-generation-ledger.json'
      - 'kids/data/quiz-v4-450-original-clip-registry.json'
      - 'kids/assets/kids-quiz-audio/v4-curated450-review/**'
      - '.github/workflows/kids-v4-stage1-paid-original-integrity.yml'

permissions:
  contents: read

concurrency:
  group: kids-v4-stage1-paid-original-integrity-zero-credits
  cancel-in-progress: false

jobs:
  verify-real-saved-original-bytes:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private V4 review branch, not production
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Verify all saved originals, approved V4 source SHA, real MP3 bytes and exact original request IDs
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/audit_quiz_v4_stage1_paid_audio_integrity.py
          python3 kids/tools/audit_quiz_v4_stage1_paid_audio_integrity.py --report
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('kids/review-only/quiz-v4-older-stage1-paid-mp3-receipt-audit.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['modelId']=='eleven_v4'
          assert data['voiceId']=='DkU7j9uO4ZEtLD2iRZSH'
          assert data['totalNewOriginals']==data['realMP3BytesChecked']
          assert data['totalNewOriginals']+data['sourceRemaining']==65
          assert data['requestJournalReconciled'] is True
          assert data['newCreditsSpentByThisAudit']==0
          assert data['publicReleaseAllowed'] is False
          assert data['humanListeningApprovalGranted'] is False
          print('PASS: Paid original files and both journal copies reconcile, no synthesis.')
          PY
      - name: Preserve no-secrets MP3 hash audit for private review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-stage1-real-saved-audio-and-provider-receipt-integrity
          retention-days: 90
          if-no-files-found: warn
          path: kids/review-only/quiz-v4-older-stage1-paid-mp3-receipt-audit.json
