name: KIDS Quiz V4 Voice Contract
on:
  pull_request:
    paths:
      - 'kids/quiz-v4-bridge.js'
      - 'kids/tools/quiz_joy_v4_script.py'
      - 'kids/tools/quiz_v4_contract_guard.py'
      - 'kids/tools/import_quiz_v4_pilot_002.py'
      - 'kids/tools/test_import_quiz_v4_pilot_002.py'
      - 'kids/data/quiz-v4-pilot-002.json'
      - 'kids/tools/quiz_speech_guard.py'
      - 'kids/data/quiz-kids.json'
      - '.github/workflows/build-kids-quiz-owner-voice.yml'
      - '.github/workflows/validate-kids-quiz-v4.yml'
  push:
    branches: [main]
    paths:
      - 'kids/quiz-v4-bridge.js'
      - 'kids/tools/quiz_joy_v4_script.py'
      - 'kids/tools/quiz_v4_contract_guard.py'
      - 'kids/tools/import_quiz_v4_pilot_002.py'
      - 'kids/tools/test_import_quiz_v4_pilot_002.py'
      - 'kids/data/quiz-v4-pilot-002.json'
      - 'kids/tools/quiz_speech_guard.py'
      - '.github/workflows/build-kids-quiz-owner-voice.yml'
permissions:
  contents: read
jobs:
  voice-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 900 texts match frontend and V4 generator
        run: |
          python3 kids/tools/quiz_v4_contract_guard.py
          python3 kids/tools/quiz_speech_guard.py --self-test
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"kids/tools")
          from quiz_joy_v4_script import prepare
          from quiz_speech_guard import audit
          qs=json.loads(Path("kids/data/quiz-kids.json").read_text(encoding="utf-8"))["items"]
          entries={}
          for q in qs[:2]:
              row=prepare(q)
              for k in ("questionAudioText","correctAudioText","retryAudioText","explanationAudioText"):
                  entries[row[k]]={
                      "url":"/kids/assets/kids-quiz-audio/fake-v4.m4a",
                      "voiceProfileId":"serhat-owner-voice-2026",
                      "modelId":"eleven_v4"
                  }
          entries["altbekannter Flash Text"]={"url":"/old.m4a","modelId":"eleven_flash_v2_5"}
          p=Path("/tmp/quiz-v4-two-question-audit-fixture.json")
          p.write_text(json.dumps({"entries":entries,"counts":{"readyQuestionPrompts":2,"remainingQuestionsWithMissingAudio":898}},ensure_ascii=False))
          audit(p)
          print("PASS: manifest audit counts exactly 2 V4 questions; ignores legacy Flash")
          PY
          python3 kids/tools/quiz_joy_v4_script.py --pilot --output /tmp/kids-quiz-v4-pilot.json
          node --check kids/quiz-v4-bridge.js
      - name: Verify paid V4 pilot MP3 import without ElevenLabs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python3 -m pip install -q --disable-pip-version-check imageio-ffmpeg==0.6.0
            mkdir -p "$HOME/.local/bin"
            python3 - <<'PY'
          import imageio_ffmpeg
          from pathlib import Path
          target=Path.home()/".local/bin/ffmpeg"
          target.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          PY
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          python3 kids/tools/test_import_quiz_v4_pilot_002.py
      - name: Require credit-safe V4 policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("kids/data/quiz-voice-batch.json").read_text())
          w=Path(".github/workflows/build-kids-quiz-owner-voice.yml").read_text()
          assert c["germanModelId"]==c["arabicModelId"]=="eleven_v4"
          assert c["maxBatchQuestions"]==2
          assert "ELEVEN_QUIZ_DE_MODEL=\"eleven_v4\"" in w
          assert "cron: '17 * * * *'" not in w
          assert "if: false # prohibit automatic V4" in w
          print("PASS: no auto credit drain and no Flash v2.5 on new quiz renders")
          PY
