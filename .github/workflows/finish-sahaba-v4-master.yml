"},{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/GigWslCeKvDDyjKsnYMk/7ck0L9moUevwyYEPwogD/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261006%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261006T211605Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-","durationSec":168.08,"generationId":"7ck0L9moUevwyYEPwogD"}]}
JSON
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          manifest=json.loads(Path("/tmp/sahaba-v4-parts.json").read_text())
          data=json.loads(Path("kids/data/mubashshirun-stories.json").read_text(encoding="utf-8"))
          by_id={x.get("id"):x for x in data.get("items",[])}

          for sid,parts in manifest.items():
              item=by_id.get(sid)
              if not item:
                  raise SystemExit(f"Missing story item: {sid}")
              scripts=item.get("scripts") or {}
              text=str(scripts.get("9-10") or scripts.get("6-8") or scripts.get("4-5") or "").strip()
              if not text:
                  raise SystemExit(f"Missing master text: {sid}")
              Path(f"/tmp/{sid}-story.txt").write_text(text,encoding="utf-8")
              files=[]
              for idx,part in enumerate(parts,1):
                  out=Path(f"/tmp/{sid}-p{idx}.mp3")
                  subprocess.run([
                      "curl","-L","--fail","--retry","4","--retry-all-errors",
                      "--connect-timeout","20","--max-time","360",part["url"],"-o",str(out)
                  ],check=True)
                  if out.stat().st_size<100000:
                      raise SystemExit(f"Downloaded part too small: {sid} part {idx}")
                  files.append(out)

              concat=Path(f"/tmp/{sid}-concat.txt")
              concat.write_text("".join(f"file '{p}'\n" for p in files),encoding="utf-8")
              target=Path(f"kids/assets/mubashshirun-story-audio/{sid}/master.mp3")
              target.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y",
                  "-f","concat","-safe","0","-i",str(concat),"-c","copy",str(target)
              ],check=True)
              dur=float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",str(target)
              ],text=True).strip())
              if dur<180:
                  raise SystemExit(f"Master duration unexpectedly short: {sid} {dur}")
              print(sid,"master seconds",round(dur,3),"bytes",target.stat().st_size)
          PY

      - name: Forced-align every Sahaba master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("/tmp/sahaba-v4-parts.json").read_text())
          Path("/tmp/sahaba-ids.txt").write_text("\n".join(m.keys())+"\n")
          PY

          while IFS= read -r sid; do
            [ -n "$sid" ] || continue
            audio="kids/assets/mubashshirun-story-audio/$sid/master.mp3"
            story="/tmp/$sid-story.txt"
            result="/tmp/$sid-alignment.json"
            ok=0

            if [ -n "${ADMIN_PUBLISH_SECRET:-}" ]; then
              for attempt in 1 2 3; do
                code="$(curl -sS -o "$result" -w '%{http_code}' \
                  -X POST "$VOICE_API/align-story" \
                  -H "Origin: https://dar-al-tawhid.de" \
                  -H "Referer: https://dar-al-tawhid.de/voice-studio/" \
                  -H "X-Admin-Secret: $ADMIN_PUBLISH_SECRET" \
                  -H "Accept: application/json" \
                  -F "file=@$audio;type=audio/mpeg" \
                  --form-string "text=$(cat "$story")" || true)"
                if [ "$code" = "200" ] && python3 - "$result" <<'PY2'
          import json,sys
          d=json.load(open(sys.argv[1]))
          sys.exit(0 if d.get("ok") and d.get("timings") and str(d.get("syncMode","")).startswith("elevenlabs-forced-alignment") else 1)
          PY2
                then
                  ok=1
                  break
                fi
                sleep 3
              done
            fi

            if [ "$ok" != "1" ] && [ -n "${ELEVENLABS_API_KEY:-}" ]; then
              raw="/tmp/$sid-eleven-alignment-raw.json"
              code="$(curl -sS -o "$raw" -w '%{http_code}' \
                -X POST "https://api.elevenlabs.io/v1/forced-alignment" \
                -H "xi-api-key: $ELEVENLABS_API_KEY" \
                -F "file=@$audio;type=audio/mpeg" \
                --form-string "text=$(cat "$story")" || true)"
              if [ "$code" = "200" ]; then
                python3 - "$story" "$raw" "$result" <<'PY2'
          import json,re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          raw=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          chars=raw.get("characters") or []
          paragraphs=[x.strip() for x in re.split(r"\n\s*\n",text) if x.strip()]
          if not chars or not paragraphs:
              raise SystemExit("Forced alignment returned no usable data")
          joined="".join(str(x.get("text","")) for x in chars)
          starts=[]
          cursor=0
          for p in paragraphs:
              probe=p[:min(80,len(p))]
              hit=joined.find(probe,cursor)
              if hit<0:
                  ratio=max(0,text.find(p))/max(1,len(text))
                  hit=max(0,min(len(chars)-1,round(ratio*(len(chars)-1))))
              while hit<len(chars)-1 and not str(chars[hit].get("text","")).strip():
                  hit+=1
              cursor=max(cursor,hit)
              starts.append(max(0.0,float(chars[hit].get("start") or 0)))
          duration=float((chars[-1] or {}).get("end") or 0)
          timings=[]
          for i,st in enumerate(starts):
              en=starts[i+1] if i+1<len(starts) else duration
              timings.append({"paragraphIndex":i,"start":round(st,3),"end":round(max(st,en),3)})
          if len(timings)!=len(paragraphs):
              raise SystemExit("Timing/paragraph mismatch")
          Path(sys.argv[3]).write_text(json.dumps({
              "ok":True,
              "timings":timings,
              "alignmentLoss":raw.get("loss"),
              "alignedWords":len(raw.get("words") or []),
              "alignedCharacters":len(chars),
              "syncMode":"elevenlabs-forced-alignment-v1"
          },ensure_ascii=False),encoding="utf-8")
          PY2
                ok=1
              fi
            fi

            if [ "$ok" != "1" ]; then
              echo "::error::Exact ElevenLabs forced alignment failed for $sid"
              exit 1
            fi
            echo "$sid forced alignment complete"
          done < /tmp/sahaba-ids.txt

      - name: Install master audio metadata and exact reader timings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,subprocess,time
          from pathlib import Path

          p=Path("kids/data/mubashshirun-stories.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          ids=json.loads(Path("/tmp/sahaba-v4-parts.json").read_text()).keys()
          by_id={x.get("id"):x for x in d.get("items",[])}
          stamp=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())

          for sid in ids:
              item=by_id[sid]
              text=str((item.get("scripts") or {}).get("9-10") or (item.get("scripts") or {}).get("6-8") or (item.get("scripts") or {}).get("4-5") or "").strip()
              paragraphs=[x.strip() for x in re.split(r"\n\s*\n",text) if x.strip()]
              align=json.loads(Path(f"/tmp/{sid}-alignment.json").read_text(encoding="utf-8"))
              timings=align.get("timings") or []
              mode=str(align.get("syncMode") or "")
              if not mode.startswith("elevenlabs-forced-alignment"):
                  raise SystemExit(f"Non-exact alignment rejected: {sid} {mode}")
              if len(timings)!=len(paragraphs):
                  raise SystemExit(f"Timing count mismatch {sid}: {len(timings)} != {len(paragraphs)}")

              previous=-1.0
              for i,row in enumerate(timings):
                  if int(row.get("paragraphIndex",-1))!=i:
                      raise SystemExit(f"Bad paragraphIndex {sid} at {i}")
                  st=float(row.get("start",-1))
                  en=float(row.get("end",-1))
                  if st<previous or en<st:
                      raise SystemExit(f"Non-monotonic timing {sid} at {i}")
                  previous=st

              audio_path=Path(f"kids/assets/mubashshirun-story-audio/{sid}/master.mp3")
              duration=float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",str(audio_path)
              ],text=True).strip())
              sha=hashlib.sha256(audio_path.read_bytes()).hexdigest()
              url=f"/kids/assets/mubashshirun-story-audio/{sid}/master.mp3?v=10-v4"
              base={
                  "status":"ready",
                  "url":url,
                  "durationSec":round(duration,3),
                  "bytes":audio_path.stat().st_size,
                  "sha256":sha,
                  "mime":"audio/mpeg",
                  "codec":"mp3",
                  "voiceProfile":"kids_story",
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "voiceName":"Serhat Abu Malik – Master",
                  "model":"eleven_v4",
                  "source":"ElevenLabs v4 · Serhat Abu Malik – Master · long-form stitched",
                  "sourceSpeaker":"Serhat Abu Malik",
                  "masterAudio":True,
                  "masterAgeRange":"4-10",
                  "allAges":True,
                  "modes":["read","listen"],
                  "timings":timings,
                  "syncMode":mode,
                  "alignmentLoss":align.get("alignmentLoss"),
                  "alignmentGeneratedAt":stamp,
                  "publishedAt":stamp,
                  "technicalQaPassed":True,
                  "longFormParts":2,
                  "transcoded":False,
                  "deliveryProfile":"lossless-mp3-concat"
              }
              item.setdefault("audio",{})
              for age in ("4-5","6-8","9-10"):
                  item["audio"][age]={**base,"age":age}
              vp=item.setdefault("voiceProduction",{})
              vp.update({
                  "masterVoice":"Serhat Abu Malik – Master",
                  "model":"eleven_v4",
                  "singleMasterAudio":True,
                  "followReaderSync":"exact-forced-alignment",
                  "followReaderSyncMode":mode,
                  "followReaderParagraphs":len(timings),
                  "followReaderSyncedAt":stamp
              })

          d["version"]=max(int(d.get("version") or 0)+1,10)
          d["updatedAt"]=stamp
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Installed exact v4 masters for",len(list(ids)),"Sahaba")
          PY

      - name: Validate all ten Sahaba
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path("kids/data/mubashshirun-stories.json").read_text(encoding="utf-8"))
          items=d.get("items") or []
          if len(items)!=10:
              raise SystemExit(f"Expected 10 Sahaba, got {len(items)}")
          for item in items:
              sid=item.get("id")
              audio=item.get("audio") or {}
              for age in ("4-5","6-8","9-10"):
                  meta=audio.get(age) or {}
                  if meta.get("status")!="ready" or not meta.get("url"):
                      raise SystemExit(f"{sid} {age} audio not ready")
                  if sid!="abu-bakr" and not str(meta.get("syncMode","")).startswith("elevenlabs-forced-alignment"):
                      raise SystemExit(f"{sid} {age} is not exact forced alignment")
              if sid!="abu-bakr":
                  p=Path(f"kids/assets/mubashshirun-story-audio/{sid}/master.mp3")
                  if not p.exists() or p.stat().st_size<100000:
                      raise SystemExit(f"Missing master asset for {sid}")
          print("All 10 Sahaba validated.")
          PY

      - name: Commit Sahaba v4 masters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/data/mubashshirun-stories.json kids/assets/mubashshirun-story-audio/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Kids: finish Sahaba v4 master audios and exact reader sync"
          git push origin HEAD:main
