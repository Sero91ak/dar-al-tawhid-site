name: Finish Sahaba V4 Masters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-sahaba-v4-master.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-sahaba-v4-masters
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOICE_API: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure audio tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg >/dev/null
          }

      - name: Download and join existing Eleven v4 parts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sahaba-v4-parts.json <<'JSON'
{"umar":[{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/6NyCmn1NKs1vguSwHbSQ/H7iezGqItmms8YRdNIHw/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261006%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261006T211538Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-","durationSec":188.48,"generationId":"H7iezGqItmms8YRdNIHw"},{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/wUFQPol7vj4HEwXzGCgw/Dj5X5i1Mu4M2wKBmhhte/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261006%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261006T211523Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-","durationSec":127.44,"generationId":"Dj5X5i1Mu4M2wKBmhhte"}],"uthman":[{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/wBknLxHliCSobeCiz9rE/XNmrOQIhpSqEyTVUFRKA/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261006%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261006T211535Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-","durationSec":167.84,"generationId":"XNmrOQIhpSqEyTVUFRKA"},{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_generation/80iuYFy7IiDSOE38A7s6/CIF7V7jhLf7f529bUd7W/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261006%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261006T211533Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-","durationSec":145.04,"generationId":"CIF7V7jhLf7f529bUd7W"}],"ali":[{"url":"https://storage.googleapis.com/xi-backend/database/workspace/9e52ab872d7b4775b36e50d2e07d17be/content_ge