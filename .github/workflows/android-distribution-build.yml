name: Android Distribution · Staging Build

on:
  push:
    branches:
      - feature/android-distribution-2026-10-08
      - feature/android-kids-2026-10-08
      - feature/android-tv-2026-10-08
      - feature/android-release-automation-2026-10-08
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-distribution-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-distribution-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adult-android:
    name: Erwachsenen-App · APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.DAR_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.DAR_ANDROID_UPLOAD_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.DAR_ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.DAR_ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout nur Android
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            download
            links
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Website release registry and Kids privacy guard
        run: node download/validate-release.cjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / API 36 installieren
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDK_MANAGER" ]]; then
            SDK_MANAGER="$(find "$SDK_ROOT/tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "::error::Kein Android sdkmanager im installierten SDK gefunden."
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK erstellen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Kids Android Debug APK erstellen
        if: github.ref_name == 'feature/android-kids-2026-10-08' || github.ref_name == 'feature/android-tv-2026-10-08' || github.ref_name == 'feature/android-release-automation-2026-10-08' || github.ref_name == 'main'
        working-directory: android
        run: ./gradlew --no-daemon :kids:assembleDebug

      - name: Kids APK als internes Test-Artefakt
        if: github.ref_name == 'feature/android-kids-2026-10-08' || github.ref_name == 'feature/android-tv-2026-10-08' || github.ref_name == 'feature/android-release-automation-2026-10-08' || github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-kids-android-debug
          path: android/kids/build/outputs/apk/debug/kids-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android TV Debug APK erstellen
        if: github.ref_name == 'feature/android-tv-2026-10-08' || github.ref_name == 'feature/android-release-automation-2026-10-08' || github.ref_name == 'main'
        working-directory: android
        run: ./gradlew --no-daemon :tv:assembleDebug

      - name: Android TV APK als internes Test-Artefakt
        if: github.ref_name == 'feature/android-tv-2026-10-08' || github.ref_name == 'feature/android-release-automation-2026-10-08' || github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-tv-android-debug
          path: android/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Debug APK als internes Test-Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-adult-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release-Signierung nur mit vollständigen Secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
            chmod 600 android/upload-keystore.jks
            {
              printf 'storeFile=upload-keystore.jks\n'
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/keystore.properties
            chmod 600 android/keystore.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Kein signierter Release-Build: Android Upload-Key-Secrets noch nicht komplett hinterlegt."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signiertes AAB + APK erstellen
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Signierte Pakete nur intern bereitstellen
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-adult-signed-aab-and-apk
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Kids Release-Signierung nur mit vorhandenen Secrets
        id: signing_kids
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DAR_ANDROID_KIDS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAR_ANDROID_KIDS_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.DAR_ANDROID_KIDS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAR_ANDROID_KIDS_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEYSTORE_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/kids-upload-keystore.jks
            chmod 600 android/kids-upload-keystore.jks
            {
              printf 'storeFile=kids-upload-keystore.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEYSTORE_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/kids-keystore.properties
            chmod 600 android/kids-keystore.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Kids-Release ausgelassen: Signier-Secrets fehlen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Kids AAB + APK signiert erstellen
        if: steps.signing_kids.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew --no-daemon :kids:bundleRelease :kids:assembleRelease

      - name: Kids signierte Pakete intern bereitstellen
        if: steps.signing_kids.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-kids-signed-aab-and-apk
          path: |
            android/kids/build/outputs/bundle/release/kids-release.aab
            android/kids/build/outputs/apk/release/kids-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Android TV Release-Signierung nur mit vorhandenen Secrets
        id: signing_tv
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DAR_ANDROID_TV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAR_ANDROID_TV_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.DAR_ANDROID_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAR_ANDROID_TV_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEYSTORE_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/tv-upload-keystore.jks
            chmod 600 android/tv-upload-keystore.jks
            {
              printf 'storeFile=tv-upload-keystore.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEYSTORE_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/tv-keystore.properties
            chmod 600 android/tv-keystore.properties
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TV-Release ausgelassen: Signier-Secrets fehlen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android TV AAB + APK signiert erstellen
        if: steps.signing_tv.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew --no-daemon :tv:bundleRelease :tv:assembleRelease

      - name: Android TV signierte Pakete intern bereitstellen
        if: steps.signing_tv.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-tawhid-tv-signed-aab-and-apk
          path: |
            android/tv/build/outputs/bundle/release/tv-release.aab
            android/tv/build/outputs/apk/release/tv-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Temporäre Signierdateien entfernen
        if: always()
        run: rm -f android/keystore.properties android/upload-keystore.jks android/kids-keystore.properties android/kids-upload-keystore.jks android/tv-keystore.properties android/tv-upload-keystore.jks
