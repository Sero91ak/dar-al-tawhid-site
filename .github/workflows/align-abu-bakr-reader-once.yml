name: Align Abu Bakr Reader Once

on:
  push:
    branches: [main]
    paths:
      - '.github/align-abu-bakr-reader-once.trigger'

permissions:
  contents: write

concurrency:
  group: align-abu-bakr-reader-once
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure ffmpeg
        shell: bash
        run: |
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg >/dev/null
          }

      - name: Build audio-derived paragraph timing map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re, subprocess, time
          from pathlib import Path

          data_path=Path("kids/data/mubashshirun-stories.json")
          data=json.loads(data_path.read_text(encoding="utf-8"))
          item=next((x for x in data.get("items",[]) if x.get("id")=="abu-bakr"),None)
          if not item:
              raise SystemExit("Abu Bakr entry missing")

          scripts=item.get("scripts") or {}
          story=str(scripts.get("9-10") or scripts.get("6-8") or scripts.get("4-5") or "").strip()
          paragraphs=[x.strip() for x in re.split(r"\n\s*\n",story) if x.strip()]
          if len(paragraphs)<2:
              raise SystemExit("Not enough story paragraphs")

          meta=(item.get("audio") or {}).get("6-8") or (item.get("audio") or {}).get("4-5") or {}
          rel=str(meta.get("url") or "").split("?",1)[0].lstrip("/")
          audio=Path(rel)
          if not audio.exists() or audio.stat().st_size < 100000:
              raise SystemExit(f"Master audio missing: {audio}")

          duration=float(subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=noprint_wrappers=1:nokey=1",str(audio)
          ],text=True).strip())
          if duration < 300:
              raise SystemExit(f"Unexpectedly short Abu Bakr master: {duration}")

          word_rx=re.compile(r"[A-Za-zÀ-žĀ-žʿʾḤḥṢṣḌḍṬṭẒẓḎḏṮṯŠšǦǧĠġḪḫ0-9]+")
          weights=[]
          for p in paragraphs:
              words=len(word_rx.findall(p))
              weights.append(max(1.0, words + .08*len(p)))
          total=sum(weights)

          expected=[]
          acc=0.0
          for w in weights[:-1]:
              acc+=w
              expected.append(duration*(acc/total))

          def detect(noise_db):
              proc=subprocess.run([
                  "ffmpeg","-hide_banner","-nostats","-i",str(audio),
                  "-af",f"silencedetect=noise={noise_db}dB:d=0.14",
                  "-f","null","-"
              ],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,check=False)
              starts=[]
              out=[]
              for line in proc.stderr.splitlines():
                  m=re.search(r"silence_start:\s*([0-9.]+)",line)
                  if m:
                      starts.append(float(m.group(1)))
                      continue
                  m=re.search(r"silence_end:\s*([0-9.]+)\s*\|\s*silence_duration:\s*([0-9.]+)",line)
                  if m:
                      end=float(m.group(1)); dur=float(m.group(2))
                      if end>.45 and end<duration-.45 and dur>=.14:
                          out.append({"t":end,"sil":dur,"real":True})
              return out

          silences=[]
          chosen=None
          for threshold in (-45,-42,-40,-38,-35,-32):
              cand=detect(threshold)
              if len(cand)>len(silences):
                  silences=cand; chosen=threshold
              if len(cand)>=len(expected)*2:
                  silences=cand; chosen=threshold
                  break

          candidates=list(silences)
          for t in expected:
              if not any(abs(x["t"]-t)<.28 for x in candidates):
                  candidates.append({"t":t,"sil":0.0,"real":False})
          candidates.sort(key=lambda x:x["t"])

          B=len(expected); N=len(candidates); INF=1e18; min_gap=.35
          back=[[-1]*N for _ in range(B)]

          def cost(b,j):
              t=candidates[j]["t"]; exp=expected[b]
              left=expected[b-1] if b else 0.0
              right=duration if b==B-1 else expected[b+1]
              scale=max(1.6,.45*min(exp-left,right-exp))
              drift=((t-exp)/scale)**2
              bonus=min(1.8,candidates[j]["sil"])*.72
              return drift+(0.0 if candidates[j]["real"] else 1.55)-bonus

          prev=[INF]*N
          for j in range(N):
              if candidates[j]["t"]>.4:
                  prev[j]=cost(0,j)

          for b in range(1,B):
              cur=[INF]*N
              for j in range(N):
                  limit=candidates[j]["t"]-min_gap
                  best=INF; best_j=-1
                  for k in range(j):
                      if candidates[k]["t"]<=limit and prev[k]<best:
                          best=prev[k]; best_j=k
                  if best_j>=0:
                      cur[j]=best+cost(b,j); back[b][j]=best_j
              prev=cur

          end_j=min(range(N),key=lambda j:prev[j]) if N else -1
          if end_j<0 or not math.isfinite(prev[end_j]):
              boundaries=expected
              selected_real=0
          else:
              ids=[end_j]
              valid=True
              for b in range(B-1,0,-1):
                  p=back[b][ids[-1]]
                  if p<0:
                      valid=False; break
                  ids.append(p)
              if valid:
                  ids.reverse()
                  boundaries=[candidates[j]["t"] for j in ids]
                  selected_real=sum(1 for j in ids if candidates[j]["real"])
              else:
                  boundaries=expected
                  selected_real=0

          points=[0.0,*boundaries,duration]
          timings=[
              {"paragraphIndex":i,"start":round(points[i],3),"end":round(points[i+1],3)}
              for i in range(len(paragraphs))
          ]

          # QA: complete coverage, monotonic, plausible paragraph speech rate.
          if len(timings)!=len(paragraphs):
              raise SystemExit("Timing count mismatch")
          prev_start=-1.0
          outliers=[]
          for i,(p,row) in enumerate(zip(paragraphs,timings)):
              st=float(row["start"]); en=float(row["end"])
              if row["paragraphIndex"]!=i or st<prev_start or en<st:
                  raise SystemExit(f"Non-monotonic timing at paragraph {i}")
              prev_start=st
              words=len(re.findall(r"\S+",p))
              seg=max(.001,en-st)
              wpm=words/seg*60
              if words>=8 and (wpm<75 or wpm>240):
                  outliers.append((i,round(wpm,1),words,round(seg,3)))
          if abs(timings[-1]["end"]-duration)>.01:
              raise SystemExit("Timing does not end at audio duration")
          if outliers:
              raise SystemExit(f"Implausible paragraph timing: {outliers}")

          stamp=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          for age in ("4-5","6-8","9-10"):
              age_meta=(item.setdefault("audio",{})).setdefault(age,{})
              # Preserve all original audio/source metadata and bytes; timing metadata only.
              age_meta["timings"]=timings
              age_meta["syncMode"]="silence-aware-dynamic-paragraph-v1"
              age_meta["alignmentLoss"]=None
              age_meta["alignmentGeneratedAt"]=stamp
              age_meta["timingSource"]="owner-original-audio-silence-analysis"
              age_meta["timingQaPassed"]=True
              age_meta["masterAudio"]=True
              age_meta["allAges"]=True

          vp=item.setdefault("voiceProduction",{})
          vp["followReaderSync"]="audio-silence-aware-paragraph"
          vp["followReaderSyncMode"]="silence-aware-dynamic-paragraph-v1"
          vp["followReaderParagraphs"]=len(timings)
          vp["followReaderSyncedAt"]=stamp
          vp["followReaderQaPassed"]=True
          vp["audioBytesPreservedForTimingUpdate"]=True

          data["version"]=max(int(data.get("version") or 0)+1,11)
          data["updatedAt"]=stamp
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          print(json.dumps({
              "id":"abu-bakr",
              "durationSec":round(duration,3),
              "paragraphs":len(paragraphs),
              "detectedSilences":len(silences),
              "selectedRealBoundaries":selected_real,
              "thresholdDb":chosen,
              "syncMode":"silence-aware-dynamic-paragraph-v1",
              "audioChanged":False
          },ensure_ascii=False))
          PY

      - name: Update shared version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path("kids/data/mubashshirun-stories.json").read_text(encoding="utf-8"))
          version=int(data["version"])

          kp=Path("kids/version.json")
          k=json.loads(kp.read_text(encoding="utf-8"))
          v=k.setdefault("visualSystem",{})
          v["mubashshirunDataVersion"]=version
          v["mubashshirunAudioMastersReady"]=10
          v["mubashshirunReadAlongTiming"]="silence-aware-dynamic-paragraph-v1"
          v["mubashshirunReadAlongMastersReady"]=10
          v["mubashshirunReadAlongTimingValidated"]=True
          kp.write_text(json.dumps(k,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          vp=Path("voice-studio/version.json")
          voice=json.loads(vp.read_text(encoding="utf-8"))
          m=voice.setdefault("mubashshirunStories",{})
          m["version"]=version
          m["sourceDataVersion"]=version
          m["audioRefreshRequired"]=False
          m["audioStatus"]="10-master-audios-ready"
          m["readAlongEnabled"]=True
          m["readAlongTimingMode"]="silence-aware-dynamic-paragraph-v1"
          m["readAlongTimingValidated"]=True
          m["readAlongMastersReady"]=10
          if isinstance(voice.get("mubashshirun"),dict):
              voice["mubashshirun"]["dataVersion"]=version
              voice["mubashshirun"]["audioStatus"]="complete"
              voice["mubashshirun"]["readAlongMastersReady"]=10
          vp.write_text(json.dumps(voice,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Validate 10 of 10 masters and timing maps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path("kids/data/mubashshirun-stories.json").read_text(encoding="utf-8"))
          items=d.get("items") or []
          if len(items)!=10:
              raise SystemExit(f"Expected 10 Sahaba, got {len(items)}")
          for item in items:
              sid=item.get("id")
              text=str((item.get("scripts") or {}).get("9-10") or (item.get("scripts") or {}).get("6-8") or (item.get("scripts") or {}).get("4-5") or "").strip()
              paras=[x.strip() for x in re.split(r"\n\s*\n",text) if x.strip()]
              urls=set()
              for age in ("4-5","6-8","9-10"):
                  meta=(item.get("audio") or {}).get(age) or {}
                  if meta.get("status")!="ready" or not meta.get("url"):
                      raise SystemExit(f"{sid} {age}: audio not ready")
                  if meta.get("syncMode")!="silence-aware-dynamic-paragraph-v1":
                      raise SystemExit(f"{sid} {age}: timing mode missing")
                  if len(meta.get("timings") or [])!=len(paras):
                      raise SystemExit(f"{sid} {age}: timing count mismatch")
                  urls.add(meta["url"])
              if len(urls)!=1:
                  raise SystemExit(f"{sid}: age slots do not share one master")
          print("10/10 Sahaba master audios + read-along timing maps validated.")
          PY

      - name: Commit Abu Bakr timing completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/data/mubashshirun-stories.json kids/version.json voice-studio/version.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Kids: complete Sahaba read-along timing maps"
          git pull --rebase origin main
          git push origin HEAD:main
