name: Qur'an Tadabbur Dedupe Repair

on:
  push:
    paths:
      - '.github/workflows/quran-tadabbur-dedupe-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: apple-tv-hadith-staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run lossless duplicate repair
        working-directory: apple-tv/quran/tadabbur
        run: node tools/dedupe-registered-entries.mjs

      - name: Verify repaired dataset
        working-directory: apple-tv/quran/tadabbur
        run: node tools/find-missing-references.mjs

      - name: Commit repaired Tadabbur dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-tv/quran/tadabbur
          if git diff --cached --quiet; then
            echo "No Tadabbur repair changes to commit."
            exit 0
          fi
          git commit -m "Repair Qur'an Tadabbur duplicate references"
          git push origin HEAD:apple-tv-hadith-staging
