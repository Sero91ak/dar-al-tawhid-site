name: Check Q-Source Standard

on:
  push:
    branches:
      - main
    paths:
      - 'q/**'
      - 'lernen/**'
      - 'assets/q-source-dar-al-layl.css'
      - 'assets/theme-salbei-elfenbein.css'
      - 'assets/learning-heritage.css'
      - 'assets/dar-app-chrome.js'
      - '.github/workflows/check-qsource-standard.yml'
  pull_request:
    paths:
      - 'q/**'
      - 'lernen/**'
      - 'assets/q-source-dar-al-layl.css'
      - 'assets/theme-salbei-elfenbein.css'
      - 'assets/learning-heritage.css'
      - 'assets/dar-app-chrome.js'
      - '.github/workflows/check-qsource-standard.yml'
  workflow_dispatch:

jobs:
  qsource-standard:
    name: Q-Source Standard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check numbered qsource pages
        run: node q/_registry/check-qsource-standard.mjs

      - name: In-app source navigation regression
        run: node q/_registry/check-source-navigation.mjs

      - name: Q46 single-screen learning and appearance regression
        run: node q/_registry/check-learning-quiz.cjs

      - name: Check legacy iOS/PWA source and learning overlay on four Chromium viewports
        run: |
          python3 -m pip install --quiet selenium
          python3 q/_registry/check-reader-overlay-browser.py
