name: Dar Test Android APK · Internal install package
on:
  push:
    branches: [main]
    paths:
      - "android-test/**"
      - ".github/workflows/android-test-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-test/**"
      - ".github/workflows/android-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dar-test-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build installable Dar Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve original iOS Dar Test launcher icon
        shell: bash
        run: |
          set -euo pipefail
          # The iOS home-screen icon is NOT the 512px web manifest icon.
          # Preserve the exact original iOS 180px PNG bytes in Android.
          test -s test-apple-touch-icon.png
          mkdir -p android-test/app/src/main/res/drawable-nodpi
          cp test-apple-touch-icon.png android-test/app/src/main/res/drawable-nodpi/dar_test_brand_icon.png
          python3 - <<'PY'
          import hashlib,struct
          from pathlib import Path
          original=Path("test-apple-touch-icon.png").read_bytes()
          installed=Path("android-test/app/src/main/res/drawable-nodpi/dar_test_brand_icon.png").read_bytes()
          assert original==installed, "Launcher icon differs from iOS test icon"
          assert original.startswith(b"\x89PNG\r\n\x1a\n")
          assert struct.unpack(">II",original[16:24])==(180,180)
          print("Original iOS Dar Test Apple touch icon:",hashlib.sha256(original).hexdigest())
          PY

      - name: Build isolated TEST APK
        shell: bash
        working-directory: android-test
        run: |
          set -euo pipefail
          chmod +x ../android/gradlew
          ../android/gradlew --no-daemon -p . :app:assembleDebug --stacktrace
      - name: Verify package ID, signature and test URL
        shell: bash
        run: |
          set -euo pipefail
          apk="android-test/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cmp -s test-apple-touch-icon.png android-test/app/src/main/res/drawable-nodpi/dar_test_brand_icon.png
          grep -q 'dar_test_brand_icon' android-test/app/src/main/AndroidManifest.xml
          grep -q 'de.daraltawhid.testapp' android-test/app/build.gradle.kts
          grep -q 'https://dar-al-tawhid.de/test/' android-test/app/src/main/java/de/daraltawhid/testapp/TestActivity.java
          ! grep -q 'DarPush.bootstrap' android-test/app/src/main/java/de/daraltawhid/testapp/TestActivity.java
          sdk="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$sdk/aapt" && test -x "$sdk/apksigner"
          "$sdk/apksigner" verify --verbose "$apk" | grep -q '^Verified'
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/dar-test-badging.txt"
          grep -q "package: name='de.daraltawhid.testapp'" "$RUNNER_TEMP/dar-test-badging.txt"
          mkdir -p dist
          cp "$apk" dist/dar-test-android.apk
          (cd dist && sha256sum dar-test-android.apk > SHA256SUMS.txt)
          echo "Dar Test APK (distinct app ID): de.daraltawhid.testapp" >> "$GITHUB_STEP_SUMMARY"
          echo "Not the official visitor APK, not Kids, no native push." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android installation file (internal test only)
        uses: actions/upload-artifact@v4
        with:
          name: dar-test-android-apk
          path: |
            dist/dar-test-android.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Android Emulator · render + tap + rotate
    needs: apk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: dar-test-android-apk
          path: android-test-ci
      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install, open and exercise test navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 750
          script: |
            set -euo pipefail
            mkdir -p android-test-ci/emulator-evidence
            test -s android-test-ci/dar-test-android.apk
            adb install -r android-test-ci/dar-test-android.apk
            adb logcat -c
            adb shell am start -W -n de.daraltawhid.testapp/.TestActivity --ez dar_test_smoke true
            sleep 27
            adb logcat -d -v time -s DarTestSmoke:V AndroidRuntime:E chromium:E > android-test-ci/emulator-evidence/logcat.txt
            adb exec-out screencap -p > android-test-ci/emulator-evidence/portrait.png
            cat android-test-ci/emulator-evidence/logcat.txt | tail -60
            adb shell pidof de.daraltawhid.testapp
            grep -Eq 'WEB_READY=true|FINAL_WEB_READY=true' android-test-ci/emulator-evidence/logcat.txt
            grep -q 'TAP_TARGET_CLEAR=true' android-test-ci/emulator-evidence/logcat.txt
            ! grep -q 'FATAL EXCEPTION' android-test-ci/emulator-evidence/logcat.txt
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb exec-out screencap -p > android-test-ci/emulator-evidence/landscape.png
            adb shell settings put system user_rotation 0
            sleep 5
            adb exec-out screencap -p > android-test-ci/emulator-evidence/back-portrait.png
            adb shell pidof de.daraltawhid.testapp
            echo "Verified real Android startup, clickable nav target and rotation."
      - name: Preserve evidence even on emulator failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-test-android-emulator-evidence
          path: android-test-ci/emulator-evidence/
          if-no-files-found: warn
          retention-days: 7
