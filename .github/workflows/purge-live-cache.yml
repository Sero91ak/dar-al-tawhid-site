name: Purge live site cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - test/index.html
      - index.html
      - admin/**
      - version.json
      - service-worker.js
      - _headers
      - content/**
      - assets/**
      - scripts/purge-cloudflare-cache.js
      - .github/workflows/purge-live-cache.yml
  workflow_run:
    workflows:
      - pages build and deployment
      - Deploy Besucher-App (Cloudflare Pages)
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  purge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Skip high-frequency status-only pushes
        id: gate
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE" "$AFTER" || true)
          echo "Changed files:"
          printf '%s\n' "${CHANGED[@]}"
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS_ONLY=1
          for f in "${CHANGED[@]}"; do
            case "$f" in
              content/admin/prayer-push-status.json|\
              content/admin/prayer-push-scheduler-lock.json|\
              content/admin/daily-push-status.json|\
              content/admin/daily-push-live-repair-trigger.json|\
              content/admin/jummah-push-status.json|\
              content/admin/pending-pushes.json|\
              content/admin/post-push-log.json|\
              content/admin/push-autonomous-heal-lock.json|\
              content/admin/push-triggers/*)
                ;;
              *)
                STATUS_ONLY=0
                break
                ;;
            esac
          done
          if [ "$STATUS_ONLY" -eq 1 ]; then
            echo "Status-only push — CDN HTML-Verify übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ github.event_name != 'push' || steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Purge Cloudflare cache for dar-al-tawhid.de
        if: ${{ github.event_name != 'push' || steps.gate.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          SITE_URL: "https://dar-al-tawhid.de"
          CLOUDFLARE_DEV_MODE: "1"
          PURGE_VERIFY_ATTEMPTS: "5"
          PURGE_VERIFY_DELAY_MS: "3000"
        run: node scripts/purge-cloudflare-cache.js
