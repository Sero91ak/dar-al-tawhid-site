name: Inspect slide reader layout (diagnostic)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/slide-layout-inspect.cjs'
      - '.github/workflows/inspect-slide-reader-layout.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect effective slide selectors and layout
        run: node scripts/slide-layout-inspect.cjs
