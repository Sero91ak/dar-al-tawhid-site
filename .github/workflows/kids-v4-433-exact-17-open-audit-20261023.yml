name: KIDS V4 True 433 - Exact 17 Still Open (Zero-Credit QA)
on:
  push:
    branches: [review/kids-v4-nine-prepaid-artifact-replay-20261022]
    paths: ['.github/workflows/kids-v4-433-exact-17-open-audit-20261023.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kids-v4-450-last17-exact-qa
  cancel-in-progress: false
jobs:
  audit-remaining-17:
    if: github.repository == 'Sero91ak/dar-al-tawhid-site' && github.ref_name == 'review/kids-v4-nine-prepaid-artifact-replay-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELEVENLABS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Enumerate every unpaid and quarantined source used by remaining 17
        run: |
          set -euo pipefail
          git fetch origin review/kids-v4-nine-prepaid-artifact-replay-20261022
          git merge --ff-only FETCH_HEAD
          python3 -m py_compile kids/tools/audit_quiz_v4_exact_remaining17_20261023.py
          python3 kids/tools/audit_quiz_v4_exact_remaining17_20261023.py
      - name: Persist exact blocker ledger without audio releases or paid actions
        run: |
          set -euo pipefail
          git config user.name kids-v4-exact-last17-checkpoint
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/review-only/quiz-v4-450-remaining17-exact-source-blockers-20261023.json
          git add kids/review-only/KIDS-V4-450-NOCH-17-20261023.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'review(kids): exact 17 remaining and 23 distinct source blocker manifest, no spending [skip ci]'
          for trial in 1 2 3; do
            if git push origin HEAD:review/kids-v4-nine-prepaid-artifact-replay-20261022; then exit 0; fi
            git fetch origin review/kids-v4-nine-prepaid-artifact-replay-20261022
            git rebase FETCH_HEAD || exit 1
          done
          exit 1
      - name: Archive exact failure-safe last-17 source queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-450-exact-17-missing-source-inventory
          retention-days: 30
          if-no-files-found: warn
          path: |
            kids/review-only/quiz-v4-450-remaining17-exact-source-blockers-20261023.json
            kids/review-only/KIDS-V4-450-NOCH-17-20261023.md
