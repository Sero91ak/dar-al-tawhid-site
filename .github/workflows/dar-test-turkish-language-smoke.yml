name: DAR TEST Turkish Language UI Smoke
on:
  push:
    branches:
      - feature/tr-dar-test-language-20261021
      - 'codex/nine-language-selector-*'
    paths:
      - 'test/assets/dar-more-v15.js'
      - 'assets/i18n/adult-language-picker-v1.js'
      - 'test/assets/dar-setup-hub.js'
      - 'test/assets/dar-home-v3-compact.js'
      - '.github/workflows/dar-test-turkish-language-smoke.yml'
  pull_request:
    paths:
      - 'test/assets/dar-more-v15.js'
      - 'test/assets/dar-setup-hub.js'
      - 'assets/i18n/adult-language-picker-v1.js'
      - '.github/workflows/dar-test-turkish-language-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify TEST-only language functionality and JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const paths=['test/assets/dar-more-v15.js','test/assets/dar-setup-hub.js','test/assets/dar-home-v3-compact.js','assets/i18n/adult-language-picker-v1.js'];
          for(const path of paths){const code=fs.readFileSync(path,'utf8');new Function(code); if(!code.includes('darAdultPreferredLocaleV1'))throw Error('Missing shared locale key in '+path);}
          const more=fs.readFileSync(paths[0],'utf8');
          if(!more.includes('localeChoices()+')||!more.includes('data-dar-language-entry'))throw Error('More language picker mount missing');
          const setup=fs.readFileSync(paths[1],'utf8');
          if(!setup.includes('data-dar-language-entry'))throw Error('Settings language picker mount missing');
          if(!setup.includes('mountLocaleInActiveSettings'))throw Error('Settings overview mount missing');
          const home=fs.readFileSync(paths[2],'utf8');
          if(!home.includes('data-dv3-locale'))throw Error('Home quick selector missing');
          console.log('PASS: all three app locale control sources compile and store the same preference.');
          NODE
      - name: Boot local adult app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dar-test-tr.log 2>&1 &
          sleep 3
      - name: Verify rendered adult Test app routes
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          opt=Options()
          for f in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu']:opt.add_argument(f)
          driver=webdriver.Chrome(options=opt)
          try:
            driver.set_window_size(393,852)
            driver.get('http://127.0.0.1:8765/test/')
            driver.execute_script("localStorage.setItem('darAdultPreferredLocaleV1','de')")
            driver.refresh()
            WebDriverWait(driver,35).until(lambda d: d.execute_script("return !!document.querySelector('#dv3Home [data-dv3-locale=tr]')"))
            WebDriverWait(driver,35).until(lambda d: d.execute_script("return window.__DarTestNineLocalesReady===true"))
            home=driver.execute_script("return [...document.querySelectorAll('#dv3Home [data-dv3-locale]')].map(x=>x.textContent)")
            print('Home control:',home,flush=True)
            assert home==['Deutsch','Türkçe','English','العربية','Kurmancî','سۆرانی','Bosanski','Français','Español']
            driver.execute_script("document.querySelector('#dv3Home [data-dv3-locale=tr]').click()")
            assert driver.execute_script("return localStorage.getItem('darAdultPreferredLocaleV1')")=='tr'
            driver.execute_script("if(typeof navigate==='function')navigate('more');else location.hash='#more'")
            WebDriverWait(driver,25).until(lambda d:d.execute_script("return !!document.querySelector('.dar-more-v15 [data-dal-open=quick]')"))
            driver.execute_script("document.querySelector('.dar-more-v15 [data-dal-open=quick]').click()")
            WebDriverWait(driver,25).until(lambda d:d.execute_script("return document.querySelectorAll('#darAdultLanguagePicker [data-dal-locale]').length===9"))
            assert driver.execute_script("return document.querySelector('#darAdultLanguagePicker [data-dal-locale=tr]').getAttribute('aria-pressed')")=='true'
            assert driver.execute_script("return !document.querySelector('#darAdultLanguagePicker [data-dal-locale=es]').disabled")
            driver.execute_script("document.querySelector('#darAdultLanguagePicker [data-dal-locale=de]').click()")
            assert driver.execute_script("return localStorage.getItem('darAdultPreferredLocaleV1')")=='de'
            driver.execute_script("if(typeof navigate==='function')navigate('settings');else location.hash='#settings'")
            WebDriverWait(driver,25).until(lambda d:d.execute_script("return !!document.querySelector('#darSettingsLocaleChoice [data-dal-open=settings]')"))
            driver.execute_script("document.querySelector('#darSettingsLocaleChoice [data-dal-open=settings]').click()")
            WebDriverWait(driver,25).until(lambda d:d.execute_script("return document.querySelectorAll('#darAdultLanguagePicker [data-dal-locale]').length===9"))
            driver.execute_script("document.querySelector('#darAdultLanguagePicker [data-dal-locale=tr]').click()")
            assert driver.execute_script("return localStorage.getItem('darAdultPreferredLocaleV1')")=='tr'
            print('PASS: adult TEST home, More and Settings share the Turkish choice.')
          finally:
            driver.quit()
          PY
