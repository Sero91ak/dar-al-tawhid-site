name: DAR TEST Turkish Language UI Smoke
on:
  pull_request:
    paths:
      - 'test/assets/dar-more-v15.js'
      - 'test/assets/dar-setup-hub.js'
      - 'test/assets/dar-home-v3-compact.js'
      - 'test/assets/dar-test-turkish-browser-smoke.py'
      - 'assets/i18n/adult-language-picker-v1.js'
      - '.github/workflows/dar-test-turkish-language-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shared capsule without legacy language tiles
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          for(const file of ['test/assets/dar-more-v15.js','test/assets/dar-setup-hub.js',
                             'test/assets/dar-home-v3-compact.js','assets/i18n/adult-language-picker-v1.js'])
            new Function(fs.readFileSync(file,'utf8'));
          const more=fs.readFileSync('test/assets/dar-more-v15.js','utf8');
          const settings=fs.readFileSync('test/assets/dar-setup-hub.js','utf8');
          const home=fs.readFileSync('test/assets/dar-home-v3-compact.js','utf8');
          const picker=fs.readFileSync('assets/i18n/adult-language-picker-v1.js','utf8');
          assert(more.includes('data-dar-language-entry="quick"'));
          assert(settings.includes('data-dar-language-entry="settings"'));
          assert(home.includes('data-dv3-open-language')&&!home.includes('data-dv3-locale'));
          assert(picker.includes('darAdultPreferredLocaleV1'));
          assert(home.includes('DARAdultLanguagePickerV1.open'));
          console.log('PASS single shared language picker, Home quick capsule and persistent locale');
          NODE
      - name: Run Turkish and German browser smoke
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dar-test-tr.log 2>&1 &
          sleep 3
          python3 test/assets/dar-test-turkish-browser-smoke.py
