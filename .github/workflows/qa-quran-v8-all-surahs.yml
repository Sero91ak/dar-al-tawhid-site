name: Quran V8 Full 114 Surah Browser QA
on:
  workflow_dispatch:
  push:
    branches: [preview/quran-player-browser-links-20261010]
    paths: [.github/workflows/qa-quran-v8-all-surahs.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test full-Surah Quran data, selection, search and persistence on six devices
        run: node scripts/qa-quran-v8-all-surahs.cjs
