name: KIDS V4 Restore Nine Previously Paid Flow Originals (no TTS)
on:
  push:
    branches:
      - review/kids-v4-audio-safe-import-20261022
    paths:
      - kids/review-only/quiz-v4-nine-prepaid-scribe-source-20261022.json
permissions:
  contents: write
concurrency:
  group: kids-v4-previously-paid-nine-restore-20261022
  cancel-in-progress: false
jobs:
  restore-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-v4-audio-safe-import-20261022
          fetch-depth: 1
      - name: Prepare MP3 decoding
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o DPkg::Lock::Timeout=20 install -y ffmpeg
          fi
      - name: Import nine authentic previously paid generation MP3s by exact original ID
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/restore_existing_v4_flow_sources_20261022.py
          python3 kids/tools/restore_existing_v4_flow_sources_20261022.py
      - name: Recompute 4-6 age band from original paid audio, never publish
        run: |
          set -euo pipefail
          python3 kids/tools/quiz_v4_first150_offline_join.py
          python3 kids/tools/quiz_v4_age7to10_offline_join.py
          python3 kids/tools/report_quiz_v4_450_progress.py
          python3 kids/tools/stage_quiz_v4_existing_mp3_import.py
          python3 kids/tools/quiz_v4_selected450_release_gate.py --ignore-flag
      - name: Push originals and verified assignments to isolated private-review-only branch
        run: |
          set -euo pipefail
          git config user.name dar-kids-prepaid-v4-recovery
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm kids/review-only/quiz-v4-nine-prepaid-scribe-source-20261022.json
          git add kids/assets/kids-quiz-audio/v4-paid-flow-original-review/
          git add kids/data/quiz-v4-450-original-clip-registry.json
          git add kids/data/quiz-v4-paid-flow-import-status.json
          git add kids/assets/kids-quiz-audio/v4-first150-composed-review/
          git add kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/data/quiz-v4-first150-composed-preview.json kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/data/quiz-v4-450-production-status.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          git commit -m "audio(kids review): preserve nine originally-paid V4 MP3s and stage real question audio"
          git push origin HEAD:review/kids-v4-audio-safe-import-20261022
      - name: Save backup of genuine paid originals regardless of Git push outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-nine-previously-paid-original-mp3s
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-paid-flow-original-review/
            kids/data/quiz-v4-paid-flow-import-status.json
            kids/data/quiz-v4-first150-audio-status.json
