name: Links App Store Original Logo

on:
  push:
    branches:
      - main
    paths:
      - content/admin/push-triggers/links-appstore-original-logo-*.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use exact uploaded App Store logo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pagePath = 'links/index.html';
          let html = fs.readFileSync(pagePath, 'utf8');
          const fixed = 'src="/assets/app-store-icon-fixed.svg?v=appstore-round-20260913-1820" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:contain;background:#fff;padding:0;display:block"';
          const exact = 'src="/assets/app-store-icon.png?v=appstore-exact-20260913-1830" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:contain;padding:0;display:block"';
          if (!html.includes(fixed) && !html.includes('/assets/app-store-icon.png')) {
            throw new Error('App Store icon source not found; aborting without touching other icons');
          }
          if (html.includes(fixed)) {
            html = html.replace(fixed, exact);
          } else {
            html = html.replace(/src="\/assets\/app-store-icon\.png(?:\?[^\"]*)?" alt="" style="[^"]*"/, exact);
          }
          fs.writeFileSync(pagePath, html);

          const redirectsPath = '_redirects';
          if (fs.existsSync(redirectsPath)) {
            let redirects = fs.readFileSync(redirectsPath, 'utf8');
            redirects = redirects
              .replace(/\n?# App Store Icon\n\/assets\/app-store-icon\.png \/assets\/app-store-icon-fixed\.svg 302\n?/g, '\n')
              .replace(/\n?# App Store Icon live refresh 2026-09-13\n?/g, '\n');
            redirects = redirects.replace(/\n{3,}/g, '\n\n');
            if (!redirects.endsWith('\n')) redirects += '\n';
            fs.writeFileSync(redirectsPath, redirects);
          }

          const lockPath = 'content/admin/change-scope-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.unlockedScopes = Array.isArray(lock.unlockedScopes) ? lock.unlockedScopes : [];
          const scope = {
            id: 'links-appstore-exact-logo-2026-09-13',
            approvedBy: 'user-explicit-links-appstore-exact-logo',
            reason: 'Nutzer: Beim separaten App-Store-Link exakt das hochgeladene App-Store-Logo verwenden; alte Icons, Links, Layout und Text unverändert lassen.',
            paths: [
              'content/admin/change-scope-lock.json',
              'links/index.html',
              '_redirects',
              'assets/app-store-icon.png'
            ],
            expiresAt: '2026-09-14T23:59:00.000Z'
          };
          const index = lock.unlockedScopes.findIndex((entry) => entry && entry.id === scope.id);
          if (index >= 0) lock.unlockedScopes[index] = scope;
          else lock.unlockedScopes.unshift(scope);
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit exact App Store logo fix
        shell: bash
        run: |
          git config user.name "Serhat Abu Malik"
          git config user.email "73606501+Sero91ak@users.noreply.github.com"
          git add links/index.html _redirects content/admin/change-scope-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(links): use exact App Store logo"
          git push
