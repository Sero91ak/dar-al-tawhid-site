name: Kids Academy Audio Inventory (zero credits)
on:
  pull_request:
    paths:
      - 'kids/tools/audit-academy-audio-inventory-v1.cjs'
      - 'kids/akademie/**'
      - 'kids/data/academy-audio.json'
      - 'kids/data/academy-voice-plan-v9.json'
      - '.github/workflows/kids-academy-audio-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact curriculum and projected choice-only questions
        run: node kids/tools/audit-academy-audio-inventory-v1.cjs --summary > "$RUNNER_TEMP/academy-audio-summary.json"
      - name: Export editorial review queue and phrase inventory
        run: |
          node kids/tools/audit-academy-audio-inventory-v1.cjs > "$RUNNER_TEMP/academy-audio-inventory.json"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));fs.writeFileSync(process.argv[2],JSON.stringify({schemaVersion:1,generatedFrom:"academy-audio-inventory-v1",requiresHumanApproval:true,items:x.issues,totals:{lessons:x.lessonCount,ageVersions:x.ageVersions,questions:x.questionCount,uniquePhrases:x.uniqueCandidatePhrases}},null,2));' "$RUNNER_TEMP/academy-audio-inventory.json" "$RUNNER_TEMP/academy-editorial-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kids-academy-audio-review
          path: |
            ${{ runner.temp }}/academy-audio-inventory.json
            ${{ runner.temp }}/academy-editorial-review.json
          retention-days: 14
      - name: Publish no-credit inventory summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/academy-audio-summary.json" ]; then
            node -e 'const s=require(process.argv[1]); console.log(JSON.stringify({lessons:s.lessonCount,ageVersions:s.ageVersions,questions:s.questionCount,uniquePhrases:s.uniqueCandidatePhrases,audioCoverage:s.audioCoverage,archiveMatches:s.archivedExactPhraseMatches,newOrChanged:s.newOrChangedVsArchive,issues:s.issues.length,issuesByCode:s.issues.reduce((a,x)=>(a[x.code]=(a[x.code]||0)+1,a),{}),invalidChoices:s.invalidChoices},null,2))' "$RUNNER_TEMP/academy-audio-summary.json"
          fi
