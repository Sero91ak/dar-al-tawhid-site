name: Import approved Sahabiyyat assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-approved-sahabiyyat-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download approved compact WebP artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids/assets/sahabiyyat
          curl -fL --retry 3 "https://at.adobe.com/oJDvg0AFrCSiUbDi" -o kids/assets/sahabiyyat/khadijah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/rTQibcFbvXK2ein6" -o kids/assets/sahabiyyat/aishah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/lI9u3v28iEOgsgtz" -o kids/assets/sahabiyyat/fatimah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/QrjOUN1LbdOSHPYm" -o kids/assets/sahabiyyat/hafsah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/SFoyArpPJQOStVsU" -o kids/assets/sahabiyyat/zaynab-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/dFc7zIT0Vw0mdL8Q" -o kids/assets/sahabiyyat/asma-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/qUi1e7WxWMKpFSph" -o kids/assets/sahabiyyat/umm-sulaym-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/0RCRSleYgJvzVdzs" -o kids/assets/sahabiyyat/umm-atiyyah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/mRrPc3Hrk8NF5W4A" -o kids/assets/sahabiyyat/umm-habibah-v1124.webp
          curl -fL --retry 3 "https://at.adobe.com/3TwhVzAnN5mjqhOx" -o kids/assets/sahabiyyat/umm-salamah-v1124.webp
          for f in kids/assets/sahabiyyat/*-v1124.webp; do
            test -s "$f"
            bytes=$(wc -c < "$f")
            test "$bytes" -gt 10000
            test "$bytes" -lt 150000
            file "$f" | grep -qi "webp"
          done

      - name: Commit approved artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dar-al-tawhid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kids/assets/sahabiyyat/*-v1124.webp
          if git diff --cached --quiet; then
            echo "Assets already imported"
            exit 0
          fi
          git commit -m "Import approved compact Sahabiyyat artwork"
          git push origin HEAD:main
