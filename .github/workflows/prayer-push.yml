name: Prayer Push Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  verify-prayer-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check current prayer scheduler status
        id: status
        run: |
          STATUS="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/api/prayer/status" || true)"
          echo "$STATUS"
          STATUS_JSON="$STATUS" node <<'NODE'
          const raw = process.env.STATUS_JSON || "";
          let response = {};
          try { response = JSON.parse(raw); } catch (_) {}
          const updatedAt = Date.parse(response?.status?.updatedAt || "");
          const ageMinutes = Number.isFinite(updatedAt) ? (Date.now() - updatedAt) / 60000 : Infinity;
          const source = String(response?.source || "");
          const schedulerStatus = String(response?.status?.schedulerStatus || "");
          const fresh = response?.ok === true && ageMinutes <= 12 && schedulerStatus !== "error";
          console.log(JSON.stringify({ fresh, ageMinutes, source, schedulerStatus }));
          require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `fresh=${fresh ? "true" : "false"}\n`);
          NODE

      - name: Recover stale scheduler through the single Cloudflare path
        if: steps.status.outputs.fresh != 'true'
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::error::ADMIN_PUBLISH_SECRET fehlt – Watchdog kann den Scheduler nicht wiederherstellen"
            exit 1
          fi

          RESULT="$(curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/prayer/run" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$RESULT"

          RESULT_JSON="$RESULT" node <<'NODE'
          const result = JSON.parse(process.env.RESULT_JSON || "{}");
          if (!result?.status?.updatedAt) {
            throw new Error(result?.reason || result?.error || "Scheduler ohne aktuellen Status beendet");
          }
          if (result?.statusWrite?.saved !== true) {
            throw new Error(`Status nicht dauerhaft gespeichert: ${JSON.stringify(result?.statusWrite || null)}`);
          }
          console.log(`Scheduler wiederhergestellt: ${result.status.updatedAt}`);
          NODE

      - name: Verify fresh status after watchdog
        if: steps.status.outputs.fresh != 'true'
        run: |
          ATTEMPT=1
          MAX_ATTEMPTS=6
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/api/prayer/status" || true)"
            echo "$STATUS"
            STATUS_JSON="$STATUS" node <<'NODE'
            const response = JSON.parse(process.env.STATUS_JSON || "{}");
            const updatedAt = Date.parse(response?.status?.updatedAt || "");
            const ageMinutes = Number.isFinite(updatedAt) ? (Date.now() - updatedAt) / 60000 : Infinity;
            const healthy = response?.ok === true && ageMinutes <= 12 && String(response?.status?.schedulerStatus || "") !== "error";
            if (!healthy) {
              process.exit(1);
            }
            console.log(`Gebets-Push-Status aktuell: ${response.status.updatedAt} (${response.source || "unbekannte Quelle"})`);
            NODE
            if [ $? -eq 0 ]; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              sleep 30
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "::error::Gebets-Push-Status blieb nach autonomer Reparatur veraltet"
          exit 1

      - name: Refresh Jumuʿah scheduler status (dry-run write)
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::warning::ADMIN_PUBLISH_SECRET fehlt – Jumuʿah-Refresh übersprungen"
            exit 0
          fi
          RESULT="$(curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/jummah/run" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$RESULT"
          RESULT_JSON="$RESULT" node <<'NODE'
          const result = JSON.parse(process.env.RESULT_JSON || "{}");
          const status = result?.status || {};
          if (!status.updatedAt) {
            throw new Error(result?.reason || result?.error || "Jumuʿah ohne Status");
          }
          console.log(JSON.stringify({
            updatedAt: status.updatedAt,
            usersWithJummah: status.usersWithJummah,
            jummahTagFallback: status.jummahTagFallback,
            schedulerEngine: status.schedulerEngine
          }));
          NODE

      - name: Send admin/test alarm push on failure
        if: failure()
        env:
          ONESIGNAL_APP_ID: "786d7cd6-0455-4434-ab14-0c10a7bc6b1e"
          ONESIGNAL_API_KEY_NEW: ${{ secrets.ONESIGNAL_API_KEY_NEW }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ALARM_PUSH_SUBSCRIPTION_IDS: ${{ secrets.ALARM_PUSH_SUBSCRIPTION_IDS }}
        run: |
          if [ -z "${ALARM_PUSH_SUBSCRIPTION_IDS:-}" ]; then
            echo "::warning::Kein ALARM_PUSH_SUBSCRIPTION_IDS gesetzt – kein Admin/Test-Alarm-Push gesendet"
            exit 0
          fi

          API_KEY="${ONESIGNAL_API_KEY_NEW:-${ONESIGNAL_API_KEY:-}}"
          API_KEY="$(printf "%s" "$API_KEY" | tr -d '[:space:]' | sed -E 's/^(Key|Basic)//I')"
          if [ -z "$API_KEY" ]; then
            echo "::warning::Kein OneSignal API Key vorhanden – kein Admin/Test-Alarm-Push gesendet"
            exit 0
          fi

          IDS_JSON="$(node -e 'const raw=process.env.ALARM_PUSH_SUBSCRIPTION_IDS||""; const ids=raw.split(",").map(s=>s.trim()).filter(Boolean); process.stdout.write(JSON.stringify(ids));')"
          IDS_COUNT="$(node -e 'const ids=JSON.parse(process.env.IDS_JSON||"[]"); process.stdout.write(String(ids.length));' )"
          if [ "$IDS_COUNT" -eq 0 ]; then
            echo "::warning::ALARM_PUSH_SUBSCRIPTION_IDS ist leer nach Parsing – kein Push gesendet"
            exit 0
          fi

          BODY="$(node -e '
            const ids = JSON.parse(process.env.IDS_JSON || "[]");
            const payload = {
              app_id: process.env.ONESIGNAL_APP_ID,
              target_channel: "push",
              include_subscription_ids: ids,
              headings: { de: "🚨 Prayer-Push Alarm", en: "🚨 Prayer Push Alarm" },
              contents: {
                de: "Autoreparatur war nicht erfolgreich. Bitte Admin-Status prüfen: /api/prayer/status",
                en: "Auto-repair failed. Please check admin status: /api/prayer/status"
              },
              url: "https://dar-al-tawhid.de/admin/",
              data: { type: "prayer-watchdog-alarm", severity: "critical" },
              name: `prayer-watchdog-alarm-${Date.now()}`
            };
            process.stdout.write(JSON.stringify(payload));
          ')"

          curl -fsS -X POST "https://api.onesignal.com/notifications" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Key ${API_KEY}" \
            -d "$BODY"
          echo "Admin/Test-Alarm-Push gesendet an ${IDS_COUNT} Subscription(s)."
