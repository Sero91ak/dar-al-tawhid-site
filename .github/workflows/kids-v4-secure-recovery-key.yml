name: KIDS V4 Secure No-Credit Original MP3 Recovery Key
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kids-v4-secure-recovery-key.yml'
permissions:
  contents: write
concurrency:
  group: kids-v4-secure-recovery-key-once
  cancel-in-progress: false
jobs:
  initialize-secure-original-transfer:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Generate 3072-bit public encryption key and protect private key with existing GitHub secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$ELEVENLABS_API_KEY" ] || { echo "::error::Missing required private encryption secret"; exit 1; }
          mkdir -p kids/data/v4-prepaid-secure-bridge
          if [ -f kids/data/v4-prepaid-secure-bridge/public-key.pem ] && [ -f kids/data/v4-prepaid-secure-bridge/encrypted-private-key.pem ]; then
            echo "Existing public key and encrypted private key retained; NO key rotation."
            exit 0
          fi
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/originals-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/originals-private.pem" -pubout -out kids/data/v4-prepaid-secure-bridge/public-key.pem
          openssl pkcs8 -topk8 -in "$RUNNER_TEMP/originals-private.pem" -out kids/data/v4-prepaid-secure-bridge/encrypted-private-key.pem -v2 aes-256-cbc -iter 180000 -passout env:ELEVENLABS_API_KEY
          rm -f "$RUNNER_TEMP/originals-private.pem"
          echo "KIDS RSA 3072 encryption public key generated; private key encrypted using existing Actions secret."
      - name: Save only public key and password-protected private key
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-security-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/data/v4-prepaid-secure-bridge/public-key.pem kids/data/v4-prepaid-secure-bridge/encrypted-private-key.pem
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security(kids): create RSA recovery key encrypted by existing private ElevenLabs secret'
          branch=review/kids-quiz-v4-batch-001-020-20261014
          for n in 1 2 3; do
            if git push origin HEAD:"$branch"; then exit 0; fi
            git fetch origin "$branch"
            if ! git rebase FETCH_HEAD; then exit 1; fi
          done
          exit 1
