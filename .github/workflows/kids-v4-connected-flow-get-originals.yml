name: KIDS V4 Import Already-Paid Connected ElevenLabs Originals (GET only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/review-only/quiz-v4-connected-flow-recover-trigger.json'
      - '.github/workflows/kids-v4-connected-flow-get-originals.yml'

permissions:
  contents: write

concurrency:
  group: kids-connected-v4-originals-import-20261017
  cancel-in-progress: false

jobs:
  import-originals-into-quiz-review:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site' && github.event.pull_request.head.ref == 'review/kids-quiz-v4-batch-001-020-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Only read existing paid original audio via ElevenLabs history GET
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/recover_quiz_v4_connected_originals_get_only.py
          python3 kids/tools/recover_quiz_v4_connected_originals_get_only.py
      - name: Integrate actual saved V4 originals into quiz review MP3 manifests
        shell: bash
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("kids/review-only/quiz-v4-connected-flow-get-import-report.json").read_text())
          raise SystemExit(0 if p["originalsImported"]>0 else 1)
          PY
          then
            python3 kids/tools/qa_quiz_v4_saved_mp3.py
            python3 kids/tools/quiz_v4_first150_offline_join.py
            python3 kids/tools/quiz_v4_age7to10_offline_join.py
            python3 kids/tools/report_quiz_v4_450_progress.py
            python3 kids/tools/stage_quiz_v4_existing_mp3_import.py
            python3 kids/tools/quiz_v4_selected450_release_gate.py --ignore-flag
            echo 'V4 originals physically imported and assigned to quiz question IDs (not public).'
          else
            echo 'No ElevenLabs history MP3 bytes accessible; no fake MP3s, no new charges.'
          fi
      - name: Save only verified original MP3s, text ledger and question assignments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-audio-import
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/data/quiz-v4-connected-flow-originals-ledger.json
          git add kids/data/quiz-v4-450-original-clip-registry.json
          git add kids/data/quiz-v4-450-paid-generation-ledger.json
          git add kids/review-only/quiz-v4-connected-flow-get-import-report.json
          git add kids/assets/kids-quiz-audio/v4-curated450-review/
          git add kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/assets/kids-quiz-audio/v4-first150-composed-review/
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/data/quiz-v4-first150-composed-preview.json kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-450-production-status.json kids/data/quiz-v4-450-saved-mp3-technical-qa.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit; no audio source falsely marked ready.'
            exit 0
          fi
          git commit -m 'audio(kids): import recovered already-paid V4 originals and regenerate quiz assignments'
          git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014
      - name: Preserve read-only recovery evidence and any downloaded MP3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-connected-originals-read-only-get-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            kids/review-only/quiz-v4-connected-flow-get-import-report.json
            kids/assets/kids-quiz-audio/v4-curated450-review/
            kids/data/quiz-v4-connected-flow-originals-ledger.json
            kids/data/quiz-v4-450-original-clip-registry.json
            kids/data/quiz-v4-450-paid-generation-ledger.json
