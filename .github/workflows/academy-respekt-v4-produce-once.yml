name: KIDS Academy Respekt und Fürsorge - guarded V4 production
on:
  push:
    branches: [academy/adab-respekt-v4-20261125]
    paths:
      - '.github/workflows/academy-respekt-v4-produce-once.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kids-academy-respekt-v4-20261125
  cancel-in-progress: false
jobs:
  produce-and-verify:
    if: github.ref == 'refs/heads/academy/adab-respekt-v4-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academy/adab-respekt-v4-20261125
          fetch-depth: 2
          persist-credentials: true
      - name: Install reproducible FFmpeg+FFprobe without changing any app or visitor components
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "System media tools ready"
          else
            python3 -m venv /tmp/dar-respekt-ffmpeg
            /tmp/dar-respekt-ffmpeg/bin/pip --disable-pip-version-check install static-ffmpeg==3.0
            /tmp/dar-respekt-ffmpeg/bin/python - <<'PY'
          import os
          from static_ffmpeg import run
          ffmpeg,ffprobe=run.get_or_fetch_platform_executables_else_raise()
          os.makedirs("/tmp/dar-respekt-bin",exist_ok=True)
          for src,name in ((ffmpeg,"ffmpeg"),(ffprobe,"ffprobe")):
              os.symlink(src,"/tmp/dar-respekt-bin/"+name)
          PY
            echo "/tmp/dar-respekt-bin" >> "${GITHUB_PATH}"
          fi
      - name: Verify media tools and immutable paid branch
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git branch --show-current)" = "academy/adab-respekt-v4-20261125"
      - name: Zero-credit source, exact child phrases and original audio SHA audit
        run: |
          set -euo pipefail
          node kids/tools/audit-academy-respekt-v4-v1.cjs
          node kids/tools/audit-academy-worte-v4-v1.cjs --require-complete
          python3 -m py_compile kids/tools/produce-academy-respekt-v4-v1.py
          python3 kids/tools/produce-academy-respekt-v4-v1.py --audit
          node kids/tools/test-academy-salam-choice-v1.cjs
          node kids/tools/test-academy-sabr-choice-v1.cjs
          node scripts/test-kids-academy-v9.js
      - name: Require complete public predecessor before new paid requests
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 kids/tools/verify-live-academy-worte-v4-v1.py; then exit 0; fi
            echo "Predecessor live proof not yet complete: attempt $attempt"
            sleep 30
          done
          exit 1
      - name: Generate only missing owner V4 originals with durable no-retry ledger
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          python3 kids/tools/produce-academy-respekt-v4-v1.py --produce
      - name: Verify all 46 real M4A topic phrases and preserve prior releases
        run: |
          set -euo pipefail
          node kids/tools/audit-academy-respekt-v4-v1.cjs --require-complete
          node kids/tools/test-academy-salam-choice-v1.cjs
          node kids/tools/test-academy-sabr-choice-v1.cjs
          node scripts/test-kids-academy-v9.js
          git diff --check
          echo "Production branch only; main and public Cloudflare must be separately verified."
