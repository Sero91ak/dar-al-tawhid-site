name: Q Source Backfill Audit (Staging Only)
on:
  push:
    branches:
      - feature/q-source-backfill-20261013
    paths:
      - "q/_registry/backfill-post-sources.mjs"
      - "q/_registry/backfill-approved.mjs"
      - "q/_registry/BACKFILL.md"
      - "q/_registry/backfill-drafts/**"
      - ".github/workflows/q-source-backfill-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "q/_registry/backfill-post-sources.mjs"
      - "q/_registry/backfill-approved.mjs"
      - "q/_registry/BACKFILL.md"
      - "q/_registry/backfill-drafts/**"
      - ".github/workflows/q-source-backfill-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: Audit all canonical adult posts (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate migration scripts
        run: |
          node --check q/_registry/backfill-post-sources.mjs
          node --check q/_registry/backfill-approved.mjs
      - name: Build inventory and editorial review drafts
        run: node q/_registry/backfill-post-sources.mjs --prepare
      - name: Validate inventory report
        run: |
          node -e 'const f=require("./q/_registry/backfill-audit.json");if(f.scanned!==f.indexedCount||!f.scanned)process.exit(1);console.log(f.summary);'
          node q/_registry/backfill-approved.mjs --check-reviewed
      - name: Preview ONLY reviewed cards in temporary checkout (never deploy)
        run: |
          node q/_registry/backfill-approved.mjs --apply-reviewed
          node q/_registry/check-qsource-standard.mjs
          node scripts/sync-quellen-registry.cjs --check
          node -e 'const fs=require("fs");const r=require("./q/_registry/shortlinks.json");for(const q of r.links)if(!fs.existsSync("q/"+q.number+"/index.html"))process.exit(1);console.log("All staged Q sources exist: "+r.links.length);'
      # This independent baseline check currently asserts a separate stale CSS cache marker
      # on existing /quellen/. Track failure but do not conflate it with staged source migration.
      - name: Existing client baseline regression (informational until upstream fixed)
        continue-on-error: true
        run: node scripts/check-quellen-client.cjs
      - name: Archive generated Q preview for review
        uses: actions/upload-artifact@v4
        with:
          name: dar-q-source-reviewed-staging-preview
          path: |
            q/*/index.html
            q/_registry/shortlinks.json
            quellen/shortlinks.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive inventory and source review drafts
        uses: actions/upload-artifact@v4
        with:
          name: dar-adult-q-source-backfill-audit
          path: |
            q/_registry/backfill-audit.json
            q/_registry/backfill-drafts/*.json
          if-no-files-found: error
          retention-days: 14
