name: Localize Test Frauen Images v1292

on:
  push:
    paths:
      - ".github/workflows/localize-test-frauen-v1292.yml"

permissions:
  contents: write

concurrency:
  group: localize-test-frauen-v1292
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test-frauen-local-v1292
          fetch-depth: 0

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Localize Frauen historical images
        shell: python
        run: |
          import hashlib, io, re, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          js_path=Path("test/assets/frauen/frauen-fiqh.js")
          text=js_path.read_text()
          pattern=re.compile(r'https://dnznrvs05pmza\.cloudfront\.net/[^"\'\s)]+')
          urls=pattern.findall(text)
          if len(urls) != 10:
              raise SystemExit(f"Expected 10 Frauen remote images, found {len(urls)}")

          out=Path("test/assets/frauen/share-v1292")
          out.mkdir(parents=True, exist_ok=True)
          sums=[]
          updated=text
          for i,url in enumerate(urls,1):
              req=urllib.request.Request(url,headers={"User-Agent":"DAR-Test-Frauen-Localizer/1.0"})
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read()
              if len(data)<1000:
                  raise SystemExit(f"Image {i} too small: {len(data)} bytes")
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert("RGB")
              if im.width>1600:
                  h=round(im.height*(1600/im.width))
                  im=im.resize((1600,h),Image.Resampling.LANCZOS)
              target=out/f"{i:02d}.webp"
              im.save(target,"WEBP",quality=84,method=6)
              digest=hashlib.sha256(target.read_bytes()).hexdigest()
              sums.append(f"{digest}  {target.as_posix()}")
              updated=updated.replace(url,f"/test/assets/frauen/share-v1292/{i:02d}.webp")
              print(f"{i:02d}: {len(data)} -> {target.stat().st_size} bytes")

          if "cloudfront.net" in updated or "_jwt=" in updated:
              raise SystemExit("Remote signed Frauen image reference remains")
          js_path.write_text(updated)
          (out/"SHA256SUMS.txt").write_text("\n".join(sums)+"\n")

      - name: Commit localized Frauen images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAR Test Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/assets/frauen/frauen-fiqh.js test/assets/frauen/share-v1292
          git commit -m "test: localize Frauen historical image pool v1292"
          git push origin HEAD:test-frauen-local-v1292
