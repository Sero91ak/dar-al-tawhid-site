name: Import Kids Story Art v1133

on:
  push:
    paths:
      - ".github/workflows/import-kids-story-art-v1133.yml"

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated story artwork
        shell: bash
        env:
          PROPHETS_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/6d29b0ac-cac6-4a28-879a-ece459ebac38.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmYzZTkzYzIyNjcwZTE2MyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMyNzgxMH0.sTAeZJczWbp3jOg9XF4wfuln8_kbyGOnih1T93Ooky8'
          SAHABA_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1c89aa44-5fbd-4156-8d3b-0d51c896f331.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmNjMWRlM2E1ZjMzNGMyYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTI5NDI2Nn0.7aJ7YOO_DJTVXfvSRKx0xKU1yC-fyK9xauaUV5noDog'
          SAHABIYYAT_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e9747702-42e6-41b6-a6d7-9506c6ea157b.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWQyOGY4ZWUxNTFkMDZiMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMyMzc1OH0.GvqOCOQbBNm8y8D4tAQE8Lyi5A1LhHI6dNv0_fR9-wI'
          COIN_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3252a444-5d35-4b8b-bbb3-ee9f3c3bb419.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmNmNDRmN2UzYmYwZjY3YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMxNjg2Mn0.qHtBU1fIK6Ub5Z1YGj4zBc3_z5l0QAUqMFuCNLQ9Ht0'
        run: |
          set -euo pipefail
          mkdir -p kids/assets/stories-home
          curl -L --fail --retry 3 "$PROPHETS_URL" -o kids/assets/stories-home/prophets-v1133.webp
          curl -L --fail --retry 3 "$SAHABA_URL" -o kids/assets/stories-home/sahaba-v1133.webp
          curl -L --fail --retry 3 "$SAHABIYYAT_URL" -o kids/assets/stories-home/sahabiyyat-v1133.webp
          curl -L --fail --retry 3 "$COIN_URL" -o kids/assets/stories-home/coin-v1133.webp
          test -s kids/assets/stories-home/prophets-v1133.webp
          test -s kids/assets/stories-home/sahaba-v1133.webp
          test -s kids/assets/stories-home/sahabiyyat-v1133.webp
          test -s kids/assets/stories-home/coin-v1133.webp

      - name: Commit generated artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/stories-home/*.webp
          if git diff --cached --quiet; then
            echo "No artwork changes."
            exit 0
          fi
          git commit -m "Kids v1133: import generated story artwork"
          git pull --rebase origin main
          git push origin HEAD:main
