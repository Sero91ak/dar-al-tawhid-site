name: Sync Admin Publisher Secrets

# Leichtgewicht: Secret-Sync + Reclaim gegen Workers Builds Wipes.
# Sicherheitssperre: content/admin/worker-secrets-safety-lock.json — Secrets/Builds nicht ohne Nutzer-Auftrag ändern.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check worker health
        id: health
        run: |
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          set -e
          echo "$HEALTH"
          RESULT="$(printf '%s' "$HEALTH" | node -e '
            let d="";
            process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              try{
                const j=JSON.parse(d||"{}");
                const serviceOk=!!(j&&j.ok===true&&j.service==="dar-admin-publisher");
                const github=!!(j&&j.hasGithubToken===true);
                const admin=!!(j&&j.hasAdminSecret===true);
                const onesignal=!!(j&&j.hasOneSignalKey===true);
                const marker=String(j&&j.deployMarker||"");
                // Marker aus dem aktuellen Checkout: nach Deploy muss dieser Prefix live sein.
                // Fehlt er (Workers Builds Wipe auf Altcode), Reclaim erzwingen.
                const expectedPrefix=process.env.EXPECTED_DEPLOY_MARKER_PREFIX||"prayer-timing-jummah-daily-fix-v9";
                const markerOk=!expectedPrefix||marker.startsWith(expectedPrefix)||marker==="";
                const secretsOk=serviceOk&&github&&admin&&onesignal;
                const ok=secretsOk&&(markerOk||!expectedPrefix);
                process.stdout.write(JSON.stringify({ok,secretsOk,serviceOk,github,admin,onesignal,marker,markerOk}));
              }catch(e){process.stdout.write(JSON.stringify({ok:false,secretsOk:false,serviceOk:false,markerOk:false}))}
            });
          ')"
          OK="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).ok?"true":"false")}catch(e){process.stdout.write("false")}})')"
          SECRETS_OK="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).secretsOk?"true":"false")}catch(e){process.stdout.write("false")}})')"
          SERVICE_OK="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).serviceOk?"true":"false")}catch(e){process.stdout.write("false")}})')"
          MARKER_OK="$(printf '%s' "$RESULT" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).markerOk?"true":"false")}catch(e){process.stdout.write("false")}})')"
          echo "secrets_ok=$SECRETS_OK" >> "$GITHUB_OUTPUT"
          echo "service_ok=$SERVICE_OK" >> "$GITHUB_OUTPUT"
          echo "marker_ok=$MARKER_OK" >> "$GITHUB_OUTPUT"
          echo "needs_reclaim=$([[ "$OK" == "true" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "ok=$OK secrets_ok=$SECRETS_OK service_ok=$SERVICE_OK marker_ok=$MARKER_OK"
        env:
          EXPECTED_DEPLOY_MARKER_PREFIX: prayer-timing-jummah-daily-fix-v9

      - name: Checkout
        if: steps.health.outputs.needs_reclaim == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.health.outputs.needs_reclaim == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        if: steps.health.outputs.needs_reclaim == 'true'
        working-directory: cloudflare
        run: npm install --no-save wrangler@4

      - name: Reclaim admin worker if Builds overwrote it
        if: steps.health.outputs.needs_reclaim == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          MARKER="$(printf '%s' "$HEALTH" | sed -n 's/.*"deployMarker":"\([^"]*\)".*/\1/p' | head -n 1)"
          NEED_CODE=0
          if ! printf '%s' "$HEALTH" | grep -q '"service":"dar-admin-publisher"'; then
            NEED_CODE=1
            echo "Service weg/überschrieben – Reclaim deploy"
          elif ! printf '%s' "$MARKER" | grep -q '^prayer-timing-jummah-daily-fix-v9'; then
            NEED_CODE=1
            echo "Falscher deployMarker ($MARKER) – Timing-Fix erneut deployen"
          else
            echo "Code-Marker OK ($MARKER)"
          fi
          if [ "$NEED_CODE" = "1" ]; then
            npx wrangler deploy --name dar-admin-publisher
            sleep 8
          fi

      - name: Sync core worker secrets
        if: steps.health.outputs.needs_reclaim == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          DAR_GITHUB_TOKEN: ${{ secrets.DAR_GITHUB_TOKEN }}
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
          ONESIGNAL_API_KEY_NEW: ${{ secrets.ONESIGNAL_API_KEY_NEW }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_TOPICS_CHAT_ID: ${{ secrets.TELEGRAM_TOPICS_CHAT_ID }}
          TELEGRAM_FORUM_CHAT_ID: ${{ secrets.TELEGRAM_FORUM_CHAT_ID }}
        run: |
          SECRETS_JSON="$RUNNER_TEMP/core-secrets.json"
          node -e '
            const fs = require("fs");
            const pick = (...vals) => {
              for (const v of vals) {
                const s = String(v || "").trim();
                if (s) return s;
              }
              return "";
            };
            const wanted = {
              GITHUB_TOKEN: pick(process.env.WORKER_GITHUB_TOKEN, process.env.DAR_GITHUB_TOKEN, process.env.REPO_GITHUB_TOKEN),
              ADMIN_PUBLISH_SECRET: pick(process.env.ADMIN_PUBLISH_SECRET),
              ONESIGNAL_API_KEY_NEW: pick(process.env.ONESIGNAL_API_KEY_NEW, process.env.ONESIGNAL_API_KEY),
              TELEGRAM_BOT_TOKEN: pick(process.env.TELEGRAM_BOT_TOKEN),
              TELEGRAM_CHANNEL_ID: pick(process.env.TELEGRAM_CHANNEL_ID),
              TELEGRAM_CHANNEL_USERNAME: pick(process.env.TELEGRAM_CHANNEL_USERNAME),
              TELEGRAM_TOPICS_CHAT_ID: pick(process.env.TELEGRAM_TOPICS_CHAT_ID, process.env.TELEGRAM_FORUM_CHAT_ID)
            };
            const payload = {};
            for (const [k, v] of Object.entries(wanted)) if (v) payload[k] = v;
            fs.writeFileSync(process.env.RUNNER_TEMP + "/core-secrets.json", JSON.stringify(payload));
            console.log("Secrets bereit:", Object.keys(payload).join(", ") || "(keine)");
            if (!payload.GITHUB_TOKEN || !payload.ADMIN_PUBLISH_SECRET) process.exit(1);
          '
          BULK_LOG="$RUNNER_TEMP/secret-bulk.log"
          set +e
          npx wrangler versions secret bulk "$SECRETS_JSON" --name dar-admin-publisher --message "watchdog-core-secrets-sync" 2>&1 | tee "$BULK_LOG"
          BULK_RC=${PIPESTATUS[0]}
          set -e
          test "$BULK_RC" = "0"
          VERSION_ID="$(sed -n "s/.*Created version \([0-9a-f-]\{36\}\).*/\1/p" "$BULK_LOG" | tail -n 1)"
          test -n "$VERSION_ID"
          echo "Aktiviere Secret-Version: $VERSION_ID"
          npx wrangler versions deploy "${VERSION_ID}@100" --name dar-admin-publisher --yes --message "activate-watchdog-core-secrets"
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 5
            HEALTH="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
            echo "Verify $i: $HEALTH"
            if printf "%s" "$HEALTH" | grep -q '"service":"dar-admin-publisher"' \
              && printf "%s" "$HEALTH" | grep -q '"hasGithubToken":true' \
              && printf "%s" "$HEALTH" | grep -q '"hasAdminSecret":true' \
              && printf "%s" "$HEALTH" | grep -q 'prayer-timing-jummah-daily-fix-v9'; then
              ok=1
              break
            fi
            # Builds kann unmittelbar wieder ueberschreiben – erneut deploy+bulk
            npx wrangler deploy --name dar-admin-publisher || true
            sleep 5
            npx wrangler versions secret bulk "$SECRETS_JSON" --name dar-admin-publisher --message "watchdog-retry-secrets" 2>&1 | tee "$BULK_LOG"
            VERSION_ID="$(sed -n "s/.*Created version \([0-9a-f-]\{36\}\).*/\1/p" "$BULK_LOG" | tail -n 1)"
            [ -n "$VERSION_ID" ] && npx wrangler versions deploy "${VERSION_ID}@100" --name dar-admin-publisher --yes --message "activate-watchdog-retry"
          done
          rm -f "$SECRETS_JSON"
          test "$ok" = "1"

      - name: Worker already healthy
        if: steps.health.outputs.needs_reclaim != 'true'
        run: echo "Kern-Secrets + Timing-Marker OK – kein Sync noetig"
