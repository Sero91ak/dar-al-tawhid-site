name: Sync Admin Publisher Secrets

# Leichtgewicht: nur Secret-Sync (kein Full-Deploy), alle 5 Minuten wenn Wipe erkannt.
# Gegen Cloudflare Workers Builds, die dar-admin-publisher alle paar Minuten überschreiben.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether core secrets are missing
        id: health
        run: |
          set +e
          HEALTH="$(curl -fsS --max-time 20 "https://dar-admin-publisher.sero91ak.workers.dev/health" 2>/dev/null || echo "{}")"
          set -e
          echo "$HEALTH"
          OK="$(printf '%s' "$HEALTH" | node -e '
            let d="";
            process.stdin.on("data",c=>d+=c);
            process.stdin.on("end",()=>{
              try{
                const j=JSON.parse(d||"{}");
                const ok=!!(j&&j.ok===true&&j.service==="dar-admin-publisher"
                  &&j.hasGithubToken===true&&j.hasAdminSecret===true&&j.hasOneSignalKey===true);
                process.stdout.write(ok?"true":"false");
              }catch(e){process.stdout.write("false")}
            });
          ')"
          echo "secrets_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "secrets_ok=$OK"

      - name: Checkout
        if: steps.health.outputs.secrets_ok != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.health.outputs.secrets_ok != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        if: steps.health.outputs.secrets_ok != 'true'
        working-directory: cloudflare
        run: npm install --no-save wrangler@4

      - name: Sync core worker secrets
        if: steps.health.outputs.secrets_ok != 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          DAR_GITHUB_TOKEN: ${{ secrets.DAR_GITHUB_TOKEN }}
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
          ONESIGNAL_API_KEY_NEW: ${{ secrets.ONESIGNAL_API_KEY_NEW }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_TOPICS_CHAT_ID: ${{ secrets.TELEGRAM_TOPICS_CHAT_ID }}
          TELEGRAM_FORUM_CHAT_ID: ${{ secrets.TELEGRAM_FORUM_CHAT_ID }}
        run: |
          SECRETS_JSON="$RUNNER_TEMP/core-secrets.json"
          node <<'NODE'
          const fs = require("fs");
          const out = process.env.RUNNER_TEMP + "/core-secrets.json";
          const pick = (...vals) => {
            for (const v of vals) {
              const s = String(v || "").trim();
              if (s) return s;
            }
            return "";
          };
          const wanted = {
            GITHUB_TOKEN: pick(process.env.WORKER_GITHUB_TOKEN, process.env.DAR_GITHUB_TOKEN, process.env.REPO_GITHUB_TOKEN),
            ADMIN_PUBLISH_SECRET: pick(process.env.ADMIN_PUBLISH_SECRET),
            ONESIGNAL_API_KEY_NEW: pick(process.env.ONESIGNAL_API_KEY_NEW, process.env.ONESIGNAL_API_KEY),
            TELEGRAM_BOT_TOKEN: pick(process.env.TELEGRAM_BOT_TOKEN),
            TELEGRAM_CHANNEL_ID: pick(process.env.TELEGRAM_CHANNEL_ID),
            TELEGRAM_CHANNEL_USERNAME: pick(process.env.TELEGRAM_CHANNEL_USERNAME),
            TELEGRAM_TOPICS_CHAT_ID: pick(process.env.TELEGRAM_TOPICS_CHAT_ID, process.env.TELEGRAM_FORUM_CHAT_ID)
          };
          const payload = {};
          for (const [k, v] of Object.entries(wanted)) {
            if (v) payload[k] = v;
          }
          fs.writeFileSync(out, JSON.stringify(payload));
          console.log("Secrets bereit:", Object.keys(payload).join(", ") || "(keine)");
          if (!payload.GITHUB_TOKEN || !payload.ADMIN_PUBLISH_SECRET) {
            console.error("GITHUB_TOKEN oder ADMIN_PUBLISH_SECRET fehlen in GitHub Actions Secrets");
            process.exit(1);
          }
          NODE
          BULK_LOG="$RUNNER_TEMP/secret-bulk.log"
          set +e
          npx wrangler versions secret bulk "$SECRETS_JSON" --name dar-admin-publisher --message "watchdog-core-secrets-sync" 2>&1 | tee "$BULK_LOG"
          BULK_RC=${PIPESTATUS[0]}
          set -e
          if [ "$BULK_RC" != "0" ]; then
            echo "::error::versions secret bulk fehlgeschlagen"
            exit "$BULK_RC"
          fi
          VERSION_ID="$(sed -n 's/.*Created version \([0-9a-f-]\{36\}\).*/\1/p' "$BULK_LOG" | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Konnte Version-ID aus secret bulk Output nicht lesen"
            exit 1
          fi
          echo "Aktiviere Secret-Version: $VERSION_ID"
          npx wrangler versions deploy "${VERSION_ID}@100" --name dar-admin-publisher --yes --message "activate-watchdog-core-secrets"
          sleep 5
          HEALTH="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/health" || true)"
          echo "Nach Sync: $HEALTH"
          printf '%s' "$HEALTH" | grep -q '"hasGithubToken":true'
          printf '%s' "$HEALTH" | grep -q '"hasAdminSecret":true'
          rm -f "$SECRETS_JSON"

      - name: Secrets already healthy
        if: steps.health.outputs.secrets_ok == 'true'
        run: echo "Kern-Secrets OK – kein Sync noetig"
