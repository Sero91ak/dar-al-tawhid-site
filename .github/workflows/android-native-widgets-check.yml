name: DAR Android Native Widgets Check
# current-main native icon/widget verification: 2026-10-09-v3
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-native-widgets-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify native icon and widget declarations
        shell: bash
        run: |
          set -euo pipefail
          alias_count="$(grep -c '<activity-alias' android/app/src/main/AndroidManifest.xml)"
          widget_count="$(grep -c 'WidgetProvider' android/app/src/main/AndroidManifest.xml)"
          test "$alias_count" -eq 18
          test "$widget_count" -eq 2

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android widget/icon test APK
        uses: actions/upload-artifact@v4
        with:
          name: dar-android-native-widgets-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
