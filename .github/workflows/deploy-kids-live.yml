name: Deploy Kids App Live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kids/**"
      - "_headers"
      - "cloudflare/site-router.js"
      - "cloudflare/test-app-worker.js"
      - "scripts/kids-prophet-release-guard.js"
      - ".github/workflows/deploy-kids-live.yml"

permissions:
  contents: read

concurrency:
  group: dar-al-tawhid-kids-live
  cancel-in-progress: true

jobs:
  deploy-kids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Kids release
        run: |
          node scripts/kids-prophet-release-guard.js
          node --check cloudflare/site-router.js
          node --check kids/story-hub.js
          node --check kids/story-follow-reader.js
          node <<'NODE'
          const fs=require("fs");
          const quiz=JSON.parse(fs.readFileSync("kids/data/quiz-kids.json","utf8"));
          const sy=JSON.parse(fs.readFileSync("kids/data/sahabiyyat-stories.json","utf8"));
          const version=JSON.parse(fs.readFileSync("kids/version.json","utf8"));
          const index=fs.readFileSync("kids/index.html","utf8");
          const start=fs.readFileSync("kids/start.html","utf8");
          const shell=fs.readFileSync("kids/shell.html","utf8");
          const sw=fs.readFileSync("kids/sw.js","utf8");
          const prophetJs=fs.readFileSync("kids/prophet-stories.js","utf8");
          const sahabaJs=fs.readFileSync("kids/mubashshirun-stories.js","utf8");
          const sahabiyyatJs=fs.readFileSync("kids/sahabiyyat-stories.js","utf8");
          const storyHubJs=fs.readFileSync("kids/story-hub.js","utf8");
          const storyFollowReaderJs=fs.readFileSync("kids/story-follow-reader.js","utf8");
          const storyFollowReaderCss=fs.readFileSync("kids/story-follow-reader.css","utf8");
          const expected=String(version.buildId||"").trim();
          const swVersion=String(version.visualSystem?.serviceWorkerCache||"").replace(/^v/,"");
          const syCss=String(version.visualSystem?.sahabiyyatCssVersion||"").trim();
          const syJs=String(version.visualSystem?.sahabiyyatJsVersion||"").trim();
          const hubCss=String(version.visualSystem?.storyHubCssVersion||"").trim();
          const hubJs=String(version.visualSystem?.storyHubJsVersion||"").trim();
          const followJs=String(version.visualSystem?.storyFollowReader||"").replace(/^v/,"").trim();
          if(!expected)throw new Error("Kids buildId missing");
          if(!swVersion)throw new Error("Kids serviceWorkerCache missing");
          if(index!==start||index!==shell)throw new Error("Kids entry shells are not identical");
          if(!Array.isArray(quiz.items)||quiz.items.length<650)throw new Error("Kids quiz count below 650");
          if(quiz.namespace!=="dar-kids-quiz"||quiz.adultQuizDependency!==false)throw new Error("Kids quiz namespace/dependency invalid");
          if(!index.includes('4–6 Jahre · hören & tippen'))throw new Error("New Kids quiz age label missing");
          if(index.includes("Keine geprüfte Wiederholung ist gerade fällig"))throw new Error("Legacy empty-quiz state returned");
          if(!index.includes("var due=pool.filter")||!index.includes("selected.push(q)"))throw new Error("Never-empty quiz fallback missing");
          if(!index.includes("/kids/sw.js?v="+swVersion))throw new Error("Current Kids SW registration missing");
          if(!index.includes("kids.pwa.controller.reload."))throw new Error("Kids stale-shell self-heal missing");
          if(!hubJs||!index.includes("/kids/story-hub.js?v="+hubJs))throw new Error("Universal story hub JS missing");
          if(!hubCss||!index.includes("/kids/story-hub.css?v="+hubCss))throw new Error("Universal story hub CSS missing");
          if(!followJs||!index.includes("/kids/story-follow-reader.js?v="+followJs))throw new Error("Current story follow-reader JS missing");
          if(!index.includes("/kids/story-follow-reader.css?v=5"))throw new Error("Current story follow-reader CSS missing");
          if(!fs.existsSync("kids/story-hub.js")||!fs.existsSync("kids/story-hub.css"))throw new Error("Universal story hub files missing");
          if((storyHubJs.match(/new Audio\(/g)||[]).length!==1)throw new Error("Universal StoryPlayer must own exactly one Audio engine");
          if([prophetJs,sahabaJs,sahabiyyatJs].some(js=>js.includes("new Audio(")))throw new Error("Legacy story audio engine returned");
          if(!prophetJs.includes('hub.openStory("prophets",id)'))throw new Error("Prophet Hören is not delegated to Universal StoryPlayer");
          if(!sahabaJs.includes('hub.openStory("sahaba",id)'))throw new Error("Ṣaḥābah Hören is not delegated to Universal StoryPlayer");
          if(!sahabiyyatJs.includes('hub.openStory("sahabiyyat",id)'))throw new Error("Ṣaḥābiyyāt Hören is not delegated to Universal StoryPlayer");
          if(!sahabiyyatJs.includes("sy-image-name"))throw new Error("Ṣaḥābiyyāt card image-name overlay missing");
          if(sahabiyyatJs.includes("syHeroName"))throw new Error("Ṣaḥābiyyāt detail name duplicated in hero");
          if(!storyHubJs.includes("gh-story-art-name"))throw new Error("Universal Ṣaḥābiyyāt card image-name overlay missing");
          if(storyHubJs.includes("ghPlayerImageName"))throw new Error("Universal player story name duplicated in hero");
          if(!storyHubJs.includes('img=s.image||artFor(first,s.id,false)'))throw new Error("Story category artwork must prefer manifest image");
          if(storyHubJs.includes('addEventListener("click",toggleRead)'))throw new Error("Story text toggle must not receive the click event as syncMode");
          if(!storyHubJs.includes("reader.openReading")||!storyHubJs.includes("reader.openReadAlong"))throw new Error("Story focus reader modes missing");
          if(!storyHubJs.includes("scrollReadParagraphIntoView"))throw new Error("Story read-along must scroll inside the text pane");
          if(!storyHubJs.includes("reader.openReadAlong?.()")||!storyHubJs.includes("reader.openReading"))throw new Error("Story read/follow buttons must open the dedicated focus reader");
          if(!storyFollowReaderJs.includes('readerView="follow"')||!storyFollowReaderJs.includes("applyReaderView"))throw new Error("Dedicated reader mode state missing");
          if(!storyFollowReaderJs.includes("readEl.scrollTop+(nr.top-rr.top)"))throw new Error("Follow-reader must scroll relative to its own pane");
          if(!storyFollowReaderJs.includes('el.setAttribute("inert","")'))throw new Error("Follow-reader background inert lock missing");
          if(!storyFollowReaderCss.includes("z-index:30050")||!storyFollowReaderCss.includes('[data-reader-view="read"]'))throw new Error("Follow-reader focus/read CSS missing");
          if(!storyHubJs.includes("playerAtTop"))throw new Error("Story swipe-down guard missing");
          if(!sw.includes("dar-al-tawhid-kids-v"+swVersion)||!sw.includes("client.navigate"))throw new Error("Kids SW activation recovery missing");
          if(!index.includes('id="syEntry"'))throw new Error("Ṣaḥābiyyāt static hub card missing");
          if(!index.includes('class="stories-area-jump"')||!index.includes('data-story-area="sahabiyyat"'))throw new Error("Ṣaḥābiyyāt hub shortcut missing");
          if(syCss&&!index.includes("/kids/sahabiyyat-stories.css?v="+syCss))throw new Error("Ṣaḥābiyyāt CSS ref missing");
          if(syJs&&!index.includes("/kids/sahabiyyat-stories.js?v="+syJs))throw new Error("Ṣaḥābiyyāt JS ref missing");
          if(!Array.isArray(sy.items)||sy.items.length!==14)throw new Error("Ṣaḥābiyyāt story count must be 14");
          console.log("KIDS LIVE GUARD OK",quiz.items.length,sy.items.length,expected,swVersion);
          NODE

      - name: Deploy Kids visitor assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Kids live
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="$(node -p 'require("./kids/version.json").buildId')"
          SW_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.serviceWorkerCache||"").replace(/^v/,"")')"
          HUB_JS_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.storyHubJsVersion||"")')"
          SY_JS_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.sahabiyyatJsVersion||"")')"
          ok=0
          for attempt in $(seq 1 12); do
            cb="$(date +%s)-$attempt"
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/version.json?cb=$cb" -o /tmp/kids-version.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/quiz-kids.json?cb=$cb" -o /tmp/kids-quiz.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/sahabiyyat-stories.json?cb=$cb" -o /tmp/kids-sahabiyyat.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/start?kv=$EXPECT&cb=$cb" -o /tmp/kids-start.html || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/sw.js?cb=$cb" -o /tmp/kids-sw.js || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/story-hub.js?v=$HUB_JS_EXPECT&cb=$cb" -o /tmp/kids-story-hub.js || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/sahabiyyat-stories.js?v=$SY_JS_EXPECT&cb=$cb" -o /tmp/kids-sahabiyyat-js.js || true
            if grep -F -q "$EXPECT" /tmp/kids-version.json 2>/dev/null &&
               grep -F -q 'id="syEntry"' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q 'class="stories-area-jump"' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q 'data-story-area="sahabiyyat"' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q "dar-al-tawhid-kids-v$SW_EXPECT" /tmp/kids-sw.js 2>/dev/null &&
               grep -F -q "gh-story-art-name" /tmp/kids-story-hub.js 2>/dev/null &&
               ! grep -F -q "ghPlayerImageName" /tmp/kids-story-hub.js 2>/dev/null &&
               grep -F -q "sy-image-name" /tmp/kids-sahabiyyat-js.js 2>/dev/null &&
               ! grep -F -q "syHeroName" /tmp/kids-sahabiyyat-js.js 2>/dev/null &&
               node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("/tmp/kids-quiz.json","utf8"));if(!Array.isArray(q.items)||q.items.length<650)process.exit(1);' &&
               node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("/tmp/kids-sahabiyyat.json","utf8"));if(!Array.isArray(s.items)||s.items.length!==14)process.exit(1);'; then
              ok=1
              echo "Kids live OK on attempt $attempt · $EXPECT"
              break
            fi
            sleep 8
          done
          test "$ok" = "1" || { echo "::error::Kids live verification failed for $EXPECT"; exit 1; }
