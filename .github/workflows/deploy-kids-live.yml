name: Deploy Kids App Live
# Dua audio asset deploy marker: 2026-10-07-fusha-v3-final

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kids/**"
      - "_headers"
      - "cloudflare/site-router.js"
      - "cloudflare/test-app-worker.js"
      - "scripts/kids-prophet-release-guard.js"
      - ".github/workflows/deploy-kids-live.yml"

permissions:
  contents: read

concurrency:
  # Same production lock as the visitor deploy: both publish dar-al-tawhid-site.
  # This prevents an older run from rolling back newer Kids/Duʿāʾ static assets.
  group: dar-al-tawhid-production-worker-deploy
  cancel-in-progress: true

jobs:
  deploy-kids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Kids release
        run: |
          node scripts/kids-prophet-release-guard.js
          node --check cloudflare/site-router.js
          node --check kids/story-hub.js
          node --check kids/story-follow-reader.js
          node <<'NODE'
          const fs=require("fs");
          const quiz=JSON.parse(fs.readFileSync("kids/data/quiz-kids.json","utf8"));
          const sy=JSON.parse(fs.readFileSync("kids/data/sahabiyyat-stories.json","utf8"));
          const version=JSON.parse(fs.readFileSync("kids/version.json","utf8"));
          const index=fs.readFileSync("kids/index.html","utf8");
          const start=fs.readFileSync("kids/start.html","utf8");
          const shell=fs.readFileSync("kids/shell.html","utf8");
          const sw=fs.readFileSync("kids/sw.js","utf8");
          const prophetJs=fs.readFileSync("kids/prophet-stories.js","utf8");
          const sahabaJs=fs.readFileSync("kids/mubashshirun-stories.js","utf8");
          const sahabiyyatJs=fs.readFileSync("kids/sahabiyyat-stories.js","utf8");
          const storyHubJs=fs.readFileSync("kids/story-hub.js","utf8");
          const storyHubCss=fs.readFileSync("kids/story-hub.css","utf8");
          const storyFollowReaderJs=fs.readFileSync("kids/story-follow-reader.js","utf8");
          const storyFollowReaderCss=fs.readFileSync("kids/story-follow-reader.css","utf8");
          const storiesHomeCss=fs.readFileSync("kids/stories-home-v1138.css","utf8");
          const expected=String(version.buildId||"").trim();
          const swVersion=String(version.visualSystem?.serviceWorkerCache||"").replace(/^v/,"");
          const syCss=String(version.visualSystem?.sahabiyyatCssVersion||"").trim();
          const syJs=String(version.visualSystem?.sahabiyyatJsVersion||"").trim();
          const hubCss=String(version.visualSystem?.storyHubCssVersion||"").trim();
          const hubJs=String(version.visualSystem?.storyHubJsVersion||"").trim();
          const followJs=String(version.visualSystem?.storyFollowReader||"").replace(/^v/,"").trim();
          const followCss=String(version.visualSystem?.storyFollowReaderCssVersion||"").replace(/^v/,"").trim();
          if(!expected)throw new Error("Kids buildId missing");
          if(!swVersion)throw new Error("Kids serviceWorkerCache missing");
          if(index!==start||index!==shell)throw new Error("Kids entry shells are not identical");
          if(!Array.isArray(quiz.items)||quiz.items.length<650)throw new Error("Kids quiz count below 650");
          if(quiz.namespace!=="dar-kids-quiz"||quiz.adultQuizDependency!==false)throw new Error("Kids quiz namespace/dependency invalid");
          if(!index.includes('4–6 Jahre · hören & tippen'))throw new Error("New Kids quiz age label missing");
          if(index.includes("Keine geprüfte Wiederholung ist gerade fällig"))throw new Error("Legacy empty-quiz state returned");
          if(!index.includes("var due=pool.filter")||!index.includes("selected.push(q)"))throw new Error("Never-empty quiz fallback missing");
          if(!index.includes("/kids/sw.js?v="+swVersion))throw new Error("Current Kids SW registration missing");
          if(!index.includes("kids.pwa.controller.reload."))throw new Error("Kids stale-shell self-heal missing");
          if(!hubJs||!index.includes("/kids/story-hub.js?v="+hubJs))throw new Error("Universal story hub JS missing");
          if(!hubCss||!index.includes("/kids/story-hub.css?v="+hubCss))throw new Error("Universal story hub CSS missing");
          if(!followJs||!index.includes("/kids/story-follow-reader.js?v="+followJs))throw new Error("Current story follow-reader JS missing");
          if(!followCss||!index.includes("/kids/story-follow-reader.css?v="+followCss))throw new Error("Current story follow-reader CSS missing");
          if(!fs.existsSync("kids/story-hub.js")||!fs.existsSync("kids/story-hub.css"))throw new Error("Universal story hub files missing");
          if([prophetJs,sahabaJs,sahabiyyatJs].some(js=>(js.match(/new Audio\(/g)||[]).length!==1))throw new Error("Each story library must own exactly one local Audio engine");
          if([prophetJs,sahabaJs,sahabiyyatJs].some(js=>js.includes("openUniversalAudio")))throw new Error("Central story-player delegation returned");
          if([prophetJs,sahabaJs,sahabiyyatJs].some(js=>js.includes("story-local-controls")||js.includes('id="psPlayer"')||js.includes('id="msPlayer"')||js.includes('id="syPlayer"')))throw new Error("Inline story player must stay removed");
          if([prophetJs,sahabaJs,sahabiyyatJs].some(js=>!js.includes("openReadAlong")||!js.includes("openListening")||!js.includes("openReading")))throw new Error("Story mode buttons must route to popup reader modes");
          if(!storyHubJs.includes('document.getElementById("ghEntry")?.remove()'))throw new Error("Central Hörwelten entry must stay removed");
          if(sahabiyyatJs.includes("sy-image-name"))throw new Error("Ṣaḥābiyyāt card image-name overlay must stay removed");
          if(sahabiyyatJs.includes("syHeroName"))throw new Error("Ṣaḥābiyyāt detail name duplicated in hero");
          if(storyHubJs.includes("gh-story-art-name"))throw new Error("Universal Ṣaḥābiyyāt card image-name overlay must stay removed");
          if(storyHubJs.includes("ghPlayerImageName"))throw new Error("Universal player story name duplicated in hero");
          if(!storyHubJs.includes('img=s.image||artFor(first,s.id,false)'))throw new Error("Story category artwork must prefer manifest image");
          if(storyHubJs.includes('addEventListener("click",toggleRead)'))throw new Error("Story text toggle must not receive the click event as syncMode");
          if(!storyHubJs.includes("reader.openReadAlong?.()")||!storyHubJs.includes('typeof reader.openReading==="function"'))throw new Error("Bottom-sheet read/follow routing missing");
          if(!storyHubJs.includes('aria-haspopup="dialog"')||!storyHubJs.includes('$("#ghFollow").textContent="Hören & mitlesen"'))throw new Error("Focus-reader controls missing");
          if(!storyFollowReaderJs.includes("function openWithContent")||!storyFollowReaderJs.includes("function openReadAlong")||!storyFollowReaderJs.includes("function openListening")||!storyFollowReaderJs.includes("function openReading"))throw new Error("Shared popup reader modes missing");
          if(!storyFollowReaderJs.includes('data-kfr-seek="-15"')||!storyFollowReaderJs.includes('data-kfr-seek="15"'))throw new Error("Popup reader 15-second seek controls missing");
          if(!storyFollowReaderJs.includes("paragraphIndexFromTimings")||!storyFollowReaderJs.includes("scrollReaderNode"))throw new Error("Timestamp-aware intelligent popup follow-reader missing");
          if(!storyFollowReaderJs.includes('setReadingWake(!root.classList.contains("audio-only"))')||!storyFollowReaderJs.includes("setReadingWake(false)"))throw new Error("Reading-only screen-awake hook missing in popup reader");
          if(!storyFollowReaderCss.includes(".kids-follow-reader.open{display:flex}")||!storyFollowReaderCss.includes("align-items:flex-end")||!storyFollowReaderCss.includes(".kfr-sheet"))throw new Error("Bottom-sheet popup reader styling missing");
          if(!storyFollowReaderCss.includes("max-height:92dvh")||!storyFollowReaderCss.includes("overflow:auto"))throw new Error("Popup reader internal scroll/readability missing");
          if(storyHubJs.includes("scrollPlayerElementIntoView")||storyHubJs.includes("gh-podcast-meta"))throw new Error("Later inline podcast/page-flow reader regression returned");
          if(storyHubCss.includes("position:sticky!important")||storyHubCss.includes(".gh-podcast-meta")||storyHubCss.includes(".gh-readonly"))throw new Error("Later sticky podcast StoryPlayer styling returned");
          if(!storyHubJs.includes("playerAtTop"))throw new Error("Story swipe-down guard missing");
          if(!sw.includes("dar-al-tawhid-kids-v"+swVersion)||!sw.includes("client.navigate"))throw new Error("Kids SW activation recovery missing");
          if(!index.includes('id="syEntry"'))throw new Error("Ṣaḥābiyyāt static hub card missing");
          if(index.includes('class="stories-area-jump"')||index.includes('data-story-area='))throw new Error("Redundant Geschichten capsule navigation returned");
          if(!index.includes('class="stories-world-head stories-hero"')||!index.includes('id="storiesHeroTitle"'))throw new Error("Responsive Geschichten hero missing");
          if(!storiesHomeCss.includes("STORIES_HOME_STRICT_V1152")||!storiesHomeCss.includes("--story-bottom-clearance:18px")||!storiesHomeCss.includes("STORIES_HOME_WIDE_GRID_V1152"))throw new Error("Strict Geschichten responsive layout guard missing");
          if(syCss&&!index.includes("/kids/sahabiyyat-stories.css?v="+syCss))throw new Error("Ṣaḥābiyyāt CSS ref missing");
          if(syJs&&!index.includes("/kids/sahabiyyat-stories.js?v="+syJs))throw new Error("Ṣaḥābiyyāt JS ref missing");
          if(!Array.isArray(sy.items)||sy.items.length!==14)throw new Error("Ṣaḥābiyyāt story count must be 14");
          console.log("KIDS LIVE GUARD OK",quiz.items.length,sy.items.length,expected,swVersion);
          NODE

      - name: Deploy Kids visitor assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify Kids live
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="$(node -p 'require("./kids/version.json").buildId')"
          SW_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.serviceWorkerCache||"").replace(/^v/,"")')"
          HUB_JS_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.storyHubJsVersion||"")')"
          SY_JS_EXPECT="$(node -p 'String(require("./kids/version.json").visualSystem.sahabiyyatJsVersion||"")')"
          DUA_DE_EXPECT="$(node -p 'require("./kids/data/dua-audio.json").buildId')"
          DUA_AR_EXPECT="$(node -p 'require("./kids/data/dua-arabic-audio.json").buildId')"
          DUA_SLOW_EXPECT="$(node -p 'require("./kids/data/dua-arabic-slow-audio.json").buildId')"
          DUA_WORD_EXPECT="$(node -p 'require("./kids/data/dua-word-audio.json").buildId')"
          ok=0
          for attempt in $(seq 1 12); do
            cb="$(date +%s)-$attempt"
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/version.json?cb=$cb" -o /tmp/kids-version.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/quiz-kids.json?cb=$cb" -o /tmp/kids-quiz.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/sahabiyyat-stories.json?cb=$cb" -o /tmp/kids-sahabiyyat.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/start?kv=$EXPECT&cb=$cb" -o /tmp/kids-start.html || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/sw.js?cb=$cb" -o /tmp/kids-sw.js || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/story-hub.js?v=$HUB_JS_EXPECT&cb=$cb" -o /tmp/kids-story-hub.js || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/sahabiyyat-stories.js?v=$SY_JS_EXPECT&cb=$cb" -o /tmp/kids-sahabiyyat-js.js || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-audio.json?cb=$cb" -o /tmp/kids-dua-de.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-arabic-audio.json?cb=$cb" -o /tmp/kids-dua-ar.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-arabic-slow-audio.json?cb=$cb" -o /tmp/kids-dua-slow.json || true
            curl -fsS --max-time 25 -A "DarAlTawhidKids-iOS" "https://dar-al-tawhid.de/kids/data/dua-word-audio.json?cb=$cb" -o /tmp/kids-dua-word.json || true
            if grep -F -q "$EXPECT" /tmp/kids-version.json 2>/dev/null &&
               grep -F -q 'id="syEntry"' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q 'class="stories-world-head stories-hero"' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q 'id="storiesHeroTitle"' /tmp/kids-start.html 2>/dev/null &&
               ! grep -F -q 'class="stories-area-jump"' /tmp/kids-start.html 2>/dev/null &&
               ! grep -F -q 'data-story-area=' /tmp/kids-start.html 2>/dev/null &&
               grep -F -q "dar-al-tawhid-kids-v$SW_EXPECT" /tmp/kids-sw.js 2>/dev/null &&
               ! grep -F -q "gh-story-art-name" /tmp/kids-story-hub.js 2>/dev/null &&
               ! grep -F -q "ghPlayerImageName" /tmp/kids-story-hub.js 2>/dev/null &&
               ! grep -F -q "sy-image-name" /tmp/kids-sahabiyyat-js.js 2>/dev/null &&
               ! grep -F -q "syHeroName" /tmp/kids-sahabiyyat-js.js 2>/dev/null &&
               node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("/tmp/kids-quiz.json","utf8"));if(!Array.isArray(q.items)||q.items.length<650)process.exit(1);' &&
               node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("/tmp/kids-sahabiyyat.json","utf8"));if(!Array.isArray(s.items)||s.items.length!==14)process.exit(1);' &&
               DUA_DE_EXPECT="$DUA_DE_EXPECT" DUA_AR_EXPECT="$DUA_AR_EXPECT" DUA_SLOW_EXPECT="$DUA_SLOW_EXPECT" DUA_WORD_EXPECT="$DUA_WORD_EXPECT" node - <<'NODE'
          const fs=require("fs");
          const checks=[
            ["/tmp/kids-dua-de.json",process.env.DUA_DE_EXPECT,122],
            ["/tmp/kids-dua-ar.json",process.env.DUA_AR_EXPECT,120],
            ["/tmp/kids-dua-slow.json",process.env.DUA_SLOW_EXPECT,120],
            ["/tmp/kids-dua-word.json",process.env.DUA_WORD_EXPECT,696],
          ];
          for(const [file,build,count] of checks){
            const d=JSON.parse(fs.readFileSync(file,"utf8"));
            if(d.buildId!==build)process.exit(1);
            if(Object.keys(d.entries||{}).length!==count)process.exit(1);
            if(d.modelId!=="eleven_v4"||d.voiceProfileId!=="serhat-owner-voice-2026")process.exit(1);
          }
          const word=JSON.parse(fs.readFileSync("/tmp/kids-dua-word.json","utf8"));
          if(word.synthesisRevision!=="dua-arabic-native-fusha-word-v4-20261007")process.exit(1);
          NODE
            then
              ok=1
              echo "Kids live OK on attempt $attempt · $EXPECT"
              break
            fi
            sleep 8
          done
          test "$ok" = "1" || { echo "::error::Kids live verification failed for $EXPECT"; exit 1; }
