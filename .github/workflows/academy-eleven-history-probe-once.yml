name: KIDS Academy Direct Flow Original Recovery Probe (GET-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-eleven-history-probe-once.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kids-academy-eleven-originals-history-probe
  cancel-in-progress: false
jobs:
  history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Checkout source plans
        uses: actions/checkout@v4
      - name: Check existing V4 recordings with read-only ElevenLabs history GET (zero credits)
        run: python3 kids/tools/probe-academy-elevenlabs-history-v1.py --direct
