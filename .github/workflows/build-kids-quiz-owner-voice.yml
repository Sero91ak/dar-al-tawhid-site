name: Build Kids Quiz + Dua Owner Voice
# Dua-only rerun marker: native Fusha pronunciation QA + word-only shadda fix 2026-10-07

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Audioumfang: quiz / dua / full / pause"
        required: true
        type: choice
        options: [quiz, dua, full, pause]
        default: quiz
      quiz_start:
        description: "Erste Quiznummer (1–900, nur fuer Quiz)"
        required: true
        type: number
        default: 1
      quiz_count:
        description: "Quizfragen je Durchlauf (maximal 12)"
        required: true
        type: number
        default: 12
      auto_queue:
        description: "Fehlende Quiz-Audios automatisch fortlaufend in Paketen erzeugen"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'kids/data/dua-kids.json'
      - 'kids/tools/voice_text.py'
      - 'kids/data/quiz-voice-batch.json'
      - 'kids/data/quiz-kids.json'
      - '.github/workflows/build-kids-quiz-owner-voice.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kids-quiz-dua-owner-voice
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VOICE_API: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      VOICE_BUILD_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || (github.event_name == 'schedule' || contains(github.event.head_commit.message, '[quiz-auto]') || contains(github.event.head_commit.message, '[quiz-batch]')) && 'quiz' || contains(github.event.head_commit.message, '[voice-pause]') && 'pause' || contains(github.event.head_commit.message, '[dua-only]') && 'dua' || contains(github.event.head_commit.message, '[quiz-only]') && 'quiz' || 'full' }}
      QUIZ_BATCH_START: ${{ github.event_name == 'workflow_dispatch' && inputs.quiz_start || '' }}
      QUIZ_BATCH_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.quiz_count || '' }}
      VOICE_AUTO_QUEUE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.auto_queue) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[quiz-auto]')) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Auto-scope pure Dua data pushes
        if: github.event_name == 'push' && env.VOICE_BUILD_SCOPE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | sed '/^$/d')
          if printf '%s\n' "${changed[@]}" | grep -Fxq 'kids/data/quiz-kids.json'; then
            echo "VOICE_BUILD_SCOPE=quiz" >> "$GITHUB_ENV"
            echo "VOICE_AUTO_QUEUE=true" >> "$GITHUB_ENV"
            echo "Quiz source changed: generate only missing and corrected question audio."
          elif [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" = "kids/data/dua-kids.json" ]; then
            echo "VOICE_BUILD_SCOPE=dua" >> "$GITHUB_ENV"
            echo "Pure kids/data/dua-kids.json push detected -> VOICE_BUILD_SCOPE=dua"
          fi

      - name: Resolve available DĀR owner voice path
        run: |
          set -euo pipefail
          if [ -n "${ELEVENLABS_API_KEY:-}" ]; then
            echo "DAR_VOICE_PROVIDER_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "DAR_VOICE_PROVIDER=elevenlabs-direct" >> "$GITHUB_ENV"
            echo "Direkter Serhat-Owner-Voice-Weg ist verfügbar."
            exit 0
          fi
          if [ -n "${ADMIN_PUBLISH_SECRET:-}" ]; then
            for i in $(seq 1 3); do
              code="$(curl -L -sS -o /tmp/voice-health.json -w '%{http_code}' "$VOICE_API/health" || true)"
              cat /tmp/voice-health.json || true
              if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/voice-health.json; then
                echo "DAR_VOICE_PROVIDER_AVAILABLE=1" >> "$GITHUB_ENV"
                echo "DAR_VOICE_PROVIDER=dar-cloud" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 3
            done
          fi
          echo "DAR_VOICE_PROVIDER_AVAILABLE=0" >> "$GITHUB_ENV"
          echo "DAR_VOICE_PROVIDER=unavailable" >> "$GITHUB_ENV"
          echo "::warning::Kein CI-Voice-Provider konfiguriert. Sprach-Normalisierung wird geprüft; Audio-Neurendering wird übersprungen."

      - name: Install audio tools (resilient; no apt-update network block)
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        timeout-minutes: 7
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already available."
            ffmpeg -version 2>/dev/null | sed -n '1p'
            exit 0
          fi
          # Ubuntu package indexes may be cached. Do NOT make a stalled
          # apt-get update a blocker for the 900-question voice queue.
          export DEBIAN_FRONTEND=noninteractive
          if timeout 45s sudo apt-get -o Acquire::Retries=1 -o DPkg::Lock::Timeout=15 install -y ffmpeg >/dev/null 2>&1; then
            ffmpeg -version 2>/dev/null | sed -n '1p'
            exit 0
          fi
          echo "::warning::apt unavailable; using pinned prebuilt FFmpeg via Python wheel."
          python3 -m pip install -q --disable-pip-version-check --target "$RUNNER_TEMP/dar-audio-python" imageio-ffmpeg==0.6.0
          mkdir -p "$HOME/.local/bin"
          PYTHONPATH="$RUNNER_TEMP/dar-audio-python" python3 - <<'PY'
          import imageio_ffmpeg, pathlib, os
          target=pathlib.Path.home()/".local/bin/ffmpeg"
          if target.exists() or target.is_symlink():
              target.unlink()
          target.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          os.chmod(imageio_ffmpeg.get_ffmpeg_exe(),0o755)
          print("Pinned FFmpeg:",target.resolve())
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ffmpeg" -version 2>/dev/null | sed -n '1p'

      - name: Validate Kids speech normalization
        run: |
          python3 kids/tools/voice_text.py --self-test
          python3 kids/tools/quiz_speech_guard.py --self-test

      - name: Validate all 900 German Kids quiz sentences before ElevenLabs
        run: python3 kids/tools/quiz_german_qa.py

      - name: Generate complete Quiz + Dua Serhat voice packs
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import threading
          import time
          import urllib.request
          import urllib.error
          import unicodedata

          ROOT=pathlib.Path(".")
          sys.path.insert(0,str(ROOT/"kids/tools"))
          from voice_text import SYNTHESIS_REVISION, prepare_kids_voice_text

          QUIZ=ROOT/"kids/data/quiz-kids.json"
          DUA=ROOT/"kids/data/dua-kids.json"
          QUIZ_MANIFEST=ROOT/"kids/data/quiz-audio.json"
          DUA_MANIFEST=ROOT/"kids/data/dua-audio.json"
          DUA_AR_MANIFEST=ROOT/"kids/data/dua-arabic-audio.json"
          DUA_AR_SLOW_MANIFEST=ROOT/"kids/data/dua-arabic-slow-audio.json"
          DUA_WORD_MANIFEST=ROOT/"kids/data/dua-word-audio.json"
          QUIZ_ASSETS=ROOT/"kids/assets/kids-quiz-audio"
          DUA_ASSETS=ROOT/"kids/assets/kids-dua-audio"
          DUA_AR_ASSETS=ROOT/"kids/assets/kids-dua-arabic-audio"
          DUA_AR_SLOW_ASSETS=ROOT/"kids/assets/kids-dua-arabic-slow-audio"
          DUA_WORD_ASSETS=ROOT/"kids/assets/kids-dua-word-audio"
          API=os.environ["VOICE_API"].rstrip("/")
          SECRET=os.environ.get("ADMIN_PUBLISH_SECRET","").strip()
          ELEVEN_KEY=os.environ.get("ELEVENLABS_API_KEY","").strip()
          PROD_CFG=json.loads((ROOT/"data/pronunciation/elevenlabs-production.json").read_text(encoding="utf-8"))
          ELEVEN_VOICE=(os.environ.get("ELEVENLABS_VOICE_ID","").strip() or str((PROD_CFG.get("masterVoice") or {}).get("voiceId") or "").strip())
          ELEVEN_MODEL=str(PROD_CFG.get("modelId") or "").strip()
          # Speech models are selected by LANGUAGE, not by the reusable master voice.
          # Keep V4 for genuine Arabic/Fusha; Flash for NEW German quiz renders.
          ELEVEN_QUIZ_DE_MODEL="eleven_flash_v2_5"
          ELEVEN_QUIZ_AR_MODEL=ELEVEN_MODEL
          ELEVEN_QUIZ_HYBRID_MODEL=ELEVEN_QUIZ_DE_MODEL+"+"+ELEVEN_QUIZ_AR_MODEL
          ARABIC_SCRIPT_RE=re.compile(r"[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+(?:\s+[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+)*")
          ELEVEN_DUA_MODEL=ELEVEN_MODEL
          ARABIC_PROFILES={"dua_arabic","dua_arabic_slow","dua_word","quiz_fusha"}
          ARABIC_SYNTHESIS_REVISIONS={
              "dua_arabic":"dua-arabic-native-fusha-v3-20261007",
              "dua_arabic_slow":"dua-arabic-native-fusha-slow-v4-natural-20261009",
              "dua_word":"dua-arabic-native-fusha-word-v5-natural-20261009"
          }
          DICT_CFG=PROD_CFG.get("pronunciationDictionary") or {}
          DICT_ID=str(DICT_CFG.get("id") or "").strip()
          DICT_VERSION=str(DICT_CFG.get("versionId") or "").strip()
          DICT_RULES=int(DICT_CFG.get("ruleCount") or 0)
          if ELEVEN_MODEL!="eleven_v4":
              raise SystemExit(f"Produktionsmodell muss eleven_v4 sein, gefunden: {ELEVEN_MODEL!r}")
          if not ELEVEN_VOICE:
              raise SystemExit("Master Voice-ID fehlt in data/pronunciation/elevenlabs-production.json")
          if not DICT_ID or not DICT_VERSION or DICT_RULES<1:
              raise SystemExit("Kanonisches ElevenLabs-Aussprachewörterbuch ist unvollständig konfiguriert.")
          ORIGIN="https://dar-al-tawhid.de"
          REFERER="https://dar-al-tawhid.de/voice-studio/"
          QUIZ_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_AR_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_AR_SLOW_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_WORD_ASSETS.mkdir(parents=True,exist_ok=True)

          def norm(v):
              return " ".join(str(v or "").split()).strip()

          def strip_initial_context_shadda(value):
              """Remove only a shadda attached to the first Arabic base letter of a clip.
              Qurʾānic connected-script exports can carry idghām/gemination from omitted
              previous context. That is wrong at the start of a standalone clip/word."""
              nfd=list(unicodedata.normalize("NFD",str(value or "")))
              base=None
              for idx,ch in enumerate(nfd):
                  if ("\u0621" <= ch <= "\u064A") or ch=="\u0671":
                      base=idx
                      break
              if base is None:
                  return unicodedata.normalize("NFC","".join(nfd))
              idx=base+1
              while idx<len(nfd) and unicodedata.combining(nfd[idx]):
                  if nfd[idx]=="\u0651":
                      del nfd[idx]
                      continue
                  idx+=1
              return unicodedata.normalize("NFC","".join(nfd))

          def prepare_profile_text(text,profile):
              value=norm(text)
              if profile in ARABIC_PROFILES:
                  value=unicodedata.normalize("NFC",value)
                  # Qurʾānic pause signs are visual recitation annotations, not spoken tokens.
                  value=re.sub(r"[\u06D6-\u06DC]","",value)
                  value=re.sub(r"\s+"," ",value).strip()
                  # Only isolated learning words lose a contextual initial shadda.
                  # Full Duʿāʾ phrases keep every authored diacritic intact.
                  if profile=="quiz_fusha":
                      value=value.replace("ﷺ","صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ").replace("عليه السلام","عَلَيْهِ السَّلَامُ").replace("رضي الله عنها","رَضِيَ اللَّهُ عَنْهَا")
                  if profile=="dua_word":
                      value=strip_initial_context_shadda(value)
                  # Keep the visible/key text untouched; this is hidden synthesis text only.
                  # Eleven v4 can voice stage directions and sentence-final
                  # breaths. Pace with synthesis speed, not [slowly] / appended ".".
                  # Keep the exact standalone Arabic word, preserving its phonemes.
                  return value
              return prepare_kids_voice_text(value,apply_pronunciation=not bool(ARABIC_SCRIPT_RE.search(value)))

          def profile_revision(profile):
              return ARABIC_SYNTHESIS_REVISIONS.get(profile,"quiz-fusha-v4-native-20261008" if profile=="quiz_fusha" else SYNTHESIS_REVISION)

          def speech_choice(label):
              label=norm(label)
              return label if not label or label.endswith((".", "!", "?", "؟")) else label+"."

          def quiz_prompt(q):
              question=norm(q.get("question"))
              labels=[norm((a or {}).get("label")) for a in (q.get("answers") or [])]
              labels=[x for x in labels if x]
              low=[x.casefold() for x in labels]
              if str(q.get("ageBand") or "")=="4-6" and len(low)==2 and "ja" in low and "nein" in low:
                  return norm(question+" Ja oder Nein?")
              choices=" ".join(f"Antwort {i+1}: {speech_choice(label)}" for i,label in enumerate(labels))
              return norm(question+" "+choices)

          def duration(path):
              import shutil
              if shutil.which("ffprobe"):
                  out=subprocess.check_output([
                      "ffprobe","-v","error","-show_entries","format=duration",
                      "-of","default=nw=1:nk=1",str(path)
                  ],text=True).strip()
                  return float(out)
              # Static FFmpeg wheels do not bundle ffprobe. Its duration
              # metadata is available in the ffmpeg input header.
              probe=subprocess.run(["ffmpeg","-hide_banner","-i",str(path)],
                                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              match=re.search(r"Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)",probe.stderr)
              if not match:
                  raise RuntimeError("Cannot read real media duration: "+str(path))
              hours,minutes,seconds=match.groups()
              return int(hours)*3600+int(minutes)*60+float(seconds)

          def load_manifest(path):
              if not path.exists():
                  return {"entries":{}}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {"entries":{}}

          def local_from_entry(entry,asset_dir,expected_model=None,expected_profile=None,expected_revision=None):
              if expected_revision and str((entry or {}).get("synthesisRevision") or "")!=str(expected_revision):
                  return None
              if expected_model and str((entry or {}).get("modelId") or "")!=str(expected_model):
                  return None
              if expected_profile and str((entry or {}).get("speechProfile") or "")!=str(expected_profile):
                  return None
              url=str((entry or {}).get("url") or "").split("?",1)[0]
              expected="/"+str(asset_dir).replace(os.sep,"/")+"/"
              if not url.startswith(expected):
                  return None
              p=ROOT/url.lstrip("/")
              return p if p.exists() and p.stat().st_size>1200 else None

          lock=threading.Lock()
          speech_synth_lock=threading.RLock()

          def speech_parts(value):
              parts=[]
              pos=0
              for match in ARABIC_SCRIPT_RE.finditer(value):
                  before=value[pos:match.start()].strip()
                  if before:
                      parts.append(("de",before))
                  native=match.group().strip()
                  if native:
                      parts.append(("ar",native))
                  pos=match.end()
              trailing=value[pos:].strip()
              if trailing:
                  parts.append(("de",trailing))
              return parts

          def quiz_model_for_text(value):
              if not ARABIC_SCRIPT_RE.search(value):
                  return ELEVEN_QUIZ_DE_MODEL
              segments=speech_parts(value)
              return ELEVEN_QUIZ_HYBRID_MODEL if len(segments)>1 else ELEVEN_QUIZ_AR_MODEL

          def quiz_required_texts(q):
              parts=[quiz_prompt(q),norm(q.get("success")),norm(q.get("retry")),norm(q.get("explanation"))]
              return [p for p in parts if p]

          def synth(text,profile,asset_dir,serial,model_id):
              prepared=prepare_profile_text(text,profile)
              if model_id==ELEVEN_QUIZ_HYBRID_MODEL:
                  segments=speech_parts(text)
                  if len(segments)<2 or not any(lang=="ar" for lang,_ in segments):
                      raise RuntimeError("Bilingual clip needs German/Arabic fragments")
                  digest=hashlib.sha1(("hybrid-v1|"+ELEVEN_VOICE+"|"+str(profile)+"|"+prepared).encode("utf-8")).hexdigest()[:16]
                  target=asset_dir/(digest+".m4a")
                  if target.exists() and target.stat().st_size>1200:
                      return text,target,duration(target),prepared
                  fragments=[]
                  for lang,segment in segments:
                      native=(lang=="ar")
                      segment_profile="quiz_fusha" if native else profile
                      segment_model=ELEVEN_QUIZ_AR_MODEL if native else ELEVEN_QUIZ_DE_MODEL
                      segment_progress={"done":0,"total":1}
                      with speech_synth_lock:
                          _,fragment,_,_=synth(segment,segment_profile,asset_dir,segment_progress,segment_model)
                      fragments.append(fragment)
                  concat_list=pathlib.Path("/tmp")/(digest+"-concat.txt")
                  concat_list.write_text("".join("file '"+str(p.resolve())+"'\n" for p in fragments),encoding="utf-8")
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                      "-f","concat","-safe","0","-i",str(concat_list),
                      "-ac","1","-ar","48000","-c:a","aac","-b:a","48k",
                      "-movflags","+faststart",str(target)],check=True)
                  if target.stat().st_size<1200:
                      raise RuntimeError("Bilingual audio incomplete")
                  d=duration(target)
                  if not 0.25<=d<=180:
                      raise RuntimeError("Bilingual duration implausible")
                  return text,target,d,prepared
              revision=profile_revision(profile)
              dictionary_fingerprint=(
                  "native-ar-no-dict" if profile in ARABIC_PROFILES else
                  "flash-inline-master-rules-kids-v1" if model_id==ELEVEN_QUIZ_DE_MODEL else
                  (DICT_ID+"|"+DICT_VERSION)
              )
              digest=hashlib.sha1(
                  (revision+"|"+str(model_id)+"|"+profile+"|"+dictionary_fingerprint+"|"+prepared).encode("utf-8")
              ).hexdigest()[:16]
              target=asset_dir/(digest+".m4a")
              if target.exists() and target.stat().st_size>1200:
                  return text,target,duration(target),prepared
              last=None
              # DĀR Worker currently has a V4 default. Never pretend its output
              # was cost-saving Flash if the direct ElevenLabs API is unavailable.
              if (model_id==ELEVEN_QUIZ_DE_MODEL or profile=="quiz_fusha") and not ELEVEN_KEY:
                  raise RuntimeError("Exact Flash/Fusha model requires direct ElevenLabs credentials; refuse unknown Worker model")
              for attempt in range(1,4):
                  if ELEVEN_KEY:
                      if profile=="quiz_4_6":
                          voice_settings={
                              "stability":0.62,
                              "similarity_boost":0.90,
                              "style":0.12,
                              "speed":0.90,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_7_8":
                          voice_settings={
                              "stability":0.60,
                              "similarity_boost":0.89,
                              "style":0.14,
                              "speed":0.94,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_9_10":
                          voice_settings={
                              "stability":0.58,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.97,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_feedback":
                          voice_settings={
                              "stability":0.60,
                              "similarity_boost":0.89,
                              "style":0.14,
                              "speed":0.95,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz":
                          voice_settings={
                              "stability":0.58,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.97,
                              "use_speaker_boost":True
                          }
                      elif profile=="kids_story":
                          voice_settings={
                              "stability":0.62,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.91,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_fusha":
                          voice_settings={
                              "stability":0.74,
                              "similarity_boost":0.92,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_arabic":
                          voice_settings={
                              "stability":0.72,
                              "similarity_boost":0.92,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_arabic_slow":
                          voice_settings={
                              "stability":0.76,
                              "similarity_boost":0.92,
                              "speed":0.88,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_word":
                          voice_settings={
                              "stability":0.80,
                              "similarity_boost":0.93,
                              "speed":0.92,
                              "use_speaker_boost":True
                          }
                      else:
                          voice_settings={
                              "stability":0.68,
                              "similarity_boost":0.88,
                              "style":0.10,
                              "speed":0.93,
                              "use_speaker_boost":True
                          }
                      is_arabic_profile=profile in ARABIC_PROFILES
                      is_flash=model_id==ELEVEN_QUIZ_DE_MODEL
                      if is_flash:
                          voice_settings.pop("style",None)
                      payload={
                          "text":prepared,
                          "model_id":model_id,
                          "voice_settings":voice_settings,
                          "apply_text_normalization":("off" if is_arabic_profile or is_flash else "on")
                      }
                      if is_arabic_profile:
                          payload["language_code"]="ar"
                      # Flash v2.5 does not honour phoneme dictionary tags.
                      # For German Flash the curated inline master substitutions
                      # from prepare_kids_voice_text are used instead.
                      if DICT_ID and DICT_VERSION and not is_arabic_profile and not is_flash:
                          payload["pronunciation_dictionary_locators"]=[{
                              "pronunciation_dictionary_id":DICT_ID,
                              "version_id":DICT_VERSION
                          }]
                      body=json.dumps(payload,ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          "https://api.elevenlabs.io/v1/text-to-speech/"+ELEVEN_VOICE,
                          data=body,
                          method="POST",
                          headers={
                              "xi-api-key":ELEVEN_KEY,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  else:
                      body=json.dumps({
                          "text":text,
                          "prepared":prepared,
                          "profile":profile
                      },ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          API+"/generate",
                          data=body,
                          method="POST",
                          headers={
                              "Origin":ORIGIN,
                              "Referer":REFERER,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "X-Admin-Secret":SECRET,
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  mp3=pathlib.Path("/tmp")/(digest+f"-{attempt}.mp3")
                  try:
                      try:
                          with urllib.request.urlopen(req,timeout=180) as response:
                              data=response.read()
                      except urllib.error.HTTPError as direct_error:
                          if model_id==ELEVEN_QUIZ_DE_MODEL or profile=="quiz_fusha":
                              raise RuntimeError("Language-specific API failed; refuse unknown Worker fallback") from direct_error
                          if ELEVEN_KEY and SECRET and int(getattr(direct_error,"code",0) or 0) in (401,403):
                              print(f"Direct ElevenLabs auth rejected ({direct_error.code}); falling back to DĀR Voice Worker.",flush=True)
                              fallback_body=json.dumps({
                                  "text":text,
                                  "prepared":prepared,
                                  "profile":profile
                              },ensure_ascii=False).encode("utf-8")
                              fallback_req=urllib.request.Request(
                                  API+"/generate",
                                  data=fallback_body,
                                  method="POST",
                                  headers={
                                      "Origin":ORIGIN,
                                      "Referer":REFERER,
                                      "Content-Type":"application/json",
                                      "Accept":"audio/mpeg",
                                      "X-Admin-Secret":SECRET,
                                      "User-Agent":"DAR-Kids-Owner-Voice/5"
                                  }
                              )
                              with urllib.request.urlopen(fallback_req,timeout=180) as response:
                                  data=response.read()
                          else:
                              raise
                      if len(data)<900:
                          raise RuntimeError(f"Voice response too small: {len(data)}")
                      mp3.write_bytes(data)
                      subprocess.run([
                          "ffmpeg","-hide_banner","-loglevel","error","-y",
                          "-i",str(mp3),"-ac","1","-ar","48000",
                          "-c:a","aac","-b:a","48k","-movflags","+faststart",
                          str(target)
                      ],check=True)
                      if target.stat().st_size<1200:
                          raise RuntimeError("Encoded clip too small")
                      d=duration(target)
                      min_duration=0.12 if profile=="dua_word" else 0.25
                      if not (min_duration<=d<=120):
                          raise RuntimeError(f"Implausible duration: {d:.3f}s")
                      with lock:
                          serial["done"]+=1
                          print(
                              f"[{serial['done']}/{serial['total']}] {text[:72]} · {d:.2f}s",
                              flush=True
                          )
                      return text,target,d,prepared
                  except Exception as exc:
                      last=exc
                      target.unlink(missing_ok=True)
                      if attempt<3:
                          time.sleep(2*attempt)
              raise RuntimeError(f"Generation failed for {text[:80]!r}: {last}")

          def build_pack(*,texts,manifest_path,asset_dir,profile,pack_id,counts,model_id=None,require_model_match=False,profiles_by_text=None,models_by_text=None,preserve_existing=False):
              model_id=model_id or ELEVEN_MODEL
              unique=[]
              seen=set()
              for raw in texts:
                  text=norm(raw)
                  if text and text not in seen:
                      seen.add(text)
                      unique.append(text)

              old=load_manifest(manifest_path)
              old_entries=dict(old.get("entries") or {})
              results={}
              prepared_hashes={}

              for text in unique:
                  entry=old_entries.get(text) or {}
                  text_profile=(profiles_by_text or {}).get(text,profile)
                  text_model=(models_by_text or {}).get(text,model_id)
                  prepared=prepare_profile_text(text,text_profile)
                  prepared_hash=hashlib.sha256(prepared.encode("utf-8")).hexdigest()
                  expected_revision=profile_revision(text_profile)
                  expected_cache_model=text_model if require_model_match else None
                  # Reuse a verified old V4 German clip if it exactly matches the
                  # current text/profile/preparation. Never burn credits converting
                  # already-finished V4 takes into cheaper-model files.
                  if preserve_existing and text_model==ELEVEN_QUIZ_DE_MODEL and \
                          str(entry.get("modelId") or "")==ELEVEN_QUIZ_AR_MODEL and \
                          str(entry.get("voiceProfileId") or "")=="serhat-owner-voice-2026" and \
                          str(entry.get("preparedTextSha256") or "")==prepared_hash:
                      expected_cache_model=None
                  p=local_from_entry(
                      entry,
                      asset_dir,
                      expected_cache_model,
                      text_profile,
                      expected_revision
                  )
                  if text_profile in ARABIC_PROFILES:
                      if str(entry.get("preparedTextSha256") or "")!=prepared_hash:
                          p=None
                      if entry.get("pronunciationDictionaryApplied") is not False:
                          p=None
                  if p is None:
                      continue
                  results[text]=(p,float(entry.get("durationSeconds") or duration(p)))
                  prepared_hashes[text]=prepared_hash

              missing=[text for text in unique if text not in results]
              print(f"{pack_id}: {len(unique)} Texte · {len(results)} aktuell · {len(missing)} neu")
              serial={"done":0,"total":len(missing)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
                  futures={
                      ex.submit(
                          synth,
                          text,
                          (profiles_by_text or {}).get(text,profile),
                          asset_dir,
                          serial,
                          (models_by_text or {}).get(text,model_id)
                      ):text
                      for text in missing
                  }
                  for fut in concurrent.futures.as_completed(futures):
                      text,p,d,prepared=fut.result()
                      results[text]=(p,d)
                      prepared_hashes[text]=hashlib.sha256(prepared.encode("utf-8")).hexdigest()

              build_id=pack_id.lower().replace("_","-")+"-"+time.strftime("%Y%m%d-%H%M%S",time.gmtime())
              now=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
              entries={}
              referenced=set()
              for text in unique:
                  p,d=results[text]
                  referenced.add(p.name)
                  rel="/"+str(p).replace(os.sep,"/")
                  text_profile=(profiles_by_text or {}).get(text,profile)
                  is_arabic=text_profile in ARABIC_PROFILES
                  text_model=(models_by_text or {}).get(text,model_id)
                  if preserve_existing and text in old_entries and text not in missing:
                      # Preserve the real original model metadata and exact URL.
                      entries[text]=dict(old_entries[text])
                      continue
                  uses_dictionary=(not is_arabic and text_model not in (ELEVEN_QUIZ_DE_MODEL,ELEVEN_QUIZ_HYBRID_MODEL))
                  entries[text]={
                      "url":rel+"?v="+build_id,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                      "durationSeconds":round(float(d),3),
                      "preparedTextSha256":prepared_hashes[text],
                      "synthesisRevision":profile_revision(text_profile),
                      "arabicSynthesisRevision":(profile_revision(text_profile) if is_arabic else None),
                      "arabicTextNormalization":("NFC" if is_arabic else None),
                      "initialContextShaddaStripped":(True if is_arabic else None),
                      "modelId":text_model,
                      "speechProfile":text_profile,
                      "languageComposition":("de+ar" if text_model==ELEVEN_QUIZ_HYBRID_MODEL else "ar" if text_model==ELEVEN_QUIZ_AR_MODEL else "de"),
                      "pronunciationQaStatus":("needs-native-fusha-listening-review" if text_model in (ELEVEN_QUIZ_HYBRID_MODEL,ELEVEN_QUIZ_AR_MODEL) else "technical-qa-complete"),
                      "voiceProfileId":"serhat-owner-voice-2026",
                      "sourceVoice":"authorized-owner-voice",
                      "sourceType":"owner-voice-generated",
                      "sourceProvider":"DĀR Voice Studio",
                      "sourceSpeaker":"Serhat Abu Malik",
                      "pronunciationDictionaryApplied":uses_dictionary,
                      "pronunciationDictionaryId":(DICT_ID if uses_dictionary else None),
                      "pronunciationDictionaryVersionId":(DICT_VERSION if uses_dictionary else None),
                      "pronunciationDictionaryRuleCount":(DICT_RULES if uses_dictionary else 0),
                      "qaBy":"automatic-owner-voice-batch-qa",
                      "qaAt":now
                  }

              if preserve_existing:
                  # Stufenweise Quiz-Audios duerfen vorhandene Altaufnahmen niemals loeschen.
                  for old_text,old_entry in old_entries.items():
                      if old_text not in entries and local_from_entry(old_entry,asset_dir):
                          entries[old_text]=old_entry
              else:
                  for stale in asset_dir.glob("*.m4a"):
                      if stale.name not in referenced:
                          stale.unlink(missing_ok=True)

              manifest_is_arabic=profile in ARABIC_PROFILES
              manifest_revision=profile_revision(profile)
              manifest={
                  "schemaVersion":2,
                  "id":pack_id,
                  "buildId":build_id,
                  "updatedAt":now,
                  "synthesisRevision":(manifest_revision if manifest_is_arabic else SYNTHESIS_REVISION),
                  "arabicSynthesisRevision":(manifest_revision if manifest_is_arabic else None),
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "speaker":"Serhat Abu Malik",
                  "speechPreparation":("native-vocalized-arabic-nfc-no-dictionary-initial-shadda-safe-v5" if manifest_is_arabic else "explicit-german-numbers-and-quran-references"),
                  "initialContextShaddaStripped":(True if manifest_is_arabic else None),
                  "manualPerClipApprovalRequired":False,
                  "technicalQaRequired":True,
                  "systemTtsFallbackAllowed":False,
                  "modelId":model_id,
                  "pronunciationDictionaryApplied":(not manifest_is_arabic),
                  "pronunciationDictionaryId":(None if manifest_is_arabic else DICT_ID),
                  "pronunciationDictionaryVersionId":(None if manifest_is_arabic else DICT_VERSION),
                  "pronunciationDictionaryRuleCount":(0 if manifest_is_arabic else DICT_RULES),
                  "entries":entries,
                  "counts":{**counts,"uniqueSpokenTexts":len(entries)}
              }
              manifest_path.write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8"
              )
              for text,entry in entries.items():
                  p=ROOT/str(entry["url"]).split("?",1)[0].lstrip("/")
                  if not p.exists() or p.stat().st_size<1200:
                      raise SystemExit("Audio fehlt: "+str(p))
              return manifest

          build_scope=os.environ.get("VOICE_BUILD_SCOPE","full").strip().lower()
          if build_scope not in ("full","quiz","dua","pause"):
              raise SystemExit("Ungültiger VOICE_BUILD_SCOPE: "+build_scope)
          print("VOICE_BUILD_SCOPE="+build_scope)
          if build_scope=="pause":
              print("VOICE_BUILD_SCOPE=pause · Audioerzeugung absichtlich gestoppt; Runtime bleibt bereit.")
              raise SystemExit(0)

          if build_scope!="dua":
              quiz=json.loads(QUIZ.read_text(encoding="utf-8"))
              quiz_items=[
                  q for q in (quiz.get("items") or [])
                  if isinstance(q,dict)
                  and q.get("status")=="published"
                  and q.get("reviewStatus")=="approved"
                  and q.get("verification")=="approved"
              ]
              if len(quiz_items)!=900:
                  raise SystemExit(f"Erwartet 900 freigegebene Kids-Fragen, gefunden: {len(quiz_items)}")
              prompts=[quiz_prompt(q) for q in quiz_items]
              if len(set(prompts))!=900:
                  raise SystemExit("Quiz-Sprachprompts sind nicht eindeutig.")
              batch_config=load_manifest(ROOT/"kids/data/quiz-voice-batch.json")
              if str(batch_config.get("voiceProfileId") or "")!="serhat-owner-voice-2026":
                  raise SystemExit("Die Quiz-Batch-Datei hat keine autorisierte Serhat-Masterstimme.")
              if str(batch_config.get("germanModelId") or "")!=ELEVEN_QUIZ_DE_MODEL:
                  raise SystemExit("Quiz: German voice policy must use cost-saving Flash v2.5.")
              if str(batch_config.get("arabicModelId") or "")!=ELEVEN_QUIZ_AR_MODEL:
                  raise SystemExit("Quiz: native Arabic/Fuṣḥā must use ElevenLabs V4.")
              quiz_start=int(os.environ.get("QUIZ_BATCH_START") or batch_config.get("batchStart") or 1)
              quiz_count=int(os.environ.get("QUIZ_BATCH_COUNT") or batch_config.get("batchCount") or 7)
              if not (1<=quiz_start<=900 and 1<=quiz_count<=12):
                  raise SystemExit("Quiz-Batch muss mit 1–900 beginnen und 1–12 Fragen enthalten.")
              end_num=min(900,quiz_start+quiz_count-1)
              auto_queue=os.environ.get("VOICE_AUTO_QUEUE","").strip().lower()=="true"
              previous_entries=(load_manifest(QUIZ_MANIFEST).get("entries") or {})
              def missing_any_voice(q):
                  for speech in quiz_required_texts(q):
                      entry=previous_entries.get(speech)
                      if not entry or not local_from_entry(entry,QUIZ_ASSETS):
                          return True
                  return False
              if auto_queue:
                  selected_quiz_items=[q for q in quiz_items if missing_any_voice(q)][:quiz_count]
                  if not selected_quiz_items:
                      print("Alle 900 Fragen mit Frage, Feedback und Erklärung vollständig vertont.",flush=True)
                      raise SystemExit(0)
                  quiz_start=min(int(q.get("number") or 0) for q in selected_quiz_items)
                  end_num=max(int(q.get("number") or 0) for q in selected_quiz_items)
              else:
                  selected_quiz_items=[q for q in quiz_items if quiz_start<=int(q.get("number") or 0)<=end_num]
              deferred_arabic=[]
              batch_prompts=[quiz_prompt(q) for q in selected_quiz_items]
              print(f"Kids Quiz Master-Batch: {quiz_start}–{end_num}; freigegeben: {len(selected_quiz_items)}; Arabisch zur QA vorgemerkt: {deferred_arabic}",flush=True)
              quiz_texts=[]
              quiz_profiles={}
              quiz_models={}
              age_profile={
                  "4-6":"quiz_4_6",
                  "7-8":"quiz_7_8",
                  "9-10":"quiz_9_10"
              }
              for q in selected_quiz_items:
                  prompt=quiz_prompt(q)
                  quiz_texts.append(prompt)
                  quiz_models[prompt]=quiz_model_for_text(prompt)
                  quiz_profiles[prompt]="quiz_fusha" if quiz_models[prompt]==ELEVEN_QUIZ_AR_MODEL else age_profile.get(str(q.get("ageBand") or ""),"quiz_9_10")
                  for feedback in (norm(q.get("success")),norm(q.get("retry"))):
                      if feedback:
                          quiz_texts.append(feedback)
                          quiz_models[feedback]=quiz_model_for_text(feedback)
                          quiz_profiles[feedback]="quiz_fusha" if quiz_models[feedback]==ELEVEN_QUIZ_AR_MODEL else "quiz_feedback"
                  explanation=norm(q.get("explanation"))
                  if explanation:
                      quiz_texts.append(explanation)
                      quiz_models[explanation]=quiz_model_for_text(explanation)
                      quiz_profiles[explanation]="quiz_fusha" if quiz_models[explanation]==ELEVEN_QUIZ_AR_MODEL else "quiz_feedback"
              final_feedback="Sehr gut. Du hast das Quiz geschafft."
              quiz_texts.append(final_feedback)
              quiz_profiles[final_feedback]="quiz_feedback"
              quiz_models[final_feedback]=ELEVEN_QUIZ_DE_MODEL

              quiz_manifest=build_pack(
                  texts=quiz_texts,
                  manifest_path=QUIZ_MANIFEST,
                  asset_dir=QUIZ_ASSETS,
                  profile="quiz_feedback",
                  pack_id="KIDS_QUIZ_OWNER_VOICE_HYBRID_V1",
                  counts={
                      "quizQuestions":len(quiz_items),
                      "questionPrompts":len(set(prompts)),
                      "batchQuestions":len(selected_quiz_items),
                      "batchStart":quiz_start,
                      "batchEnd":end_num,
                      "batchDeferredArabic":deferred_arabic,
                      "age4to6":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="4-6"),
                      "age7to8":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="7-8"),
                      "age9to10":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="9-10")
                  },
                  model_id=ELEVEN_QUIZ_DE_MODEL,
                  require_model_match=True,
                  profiles_by_text=quiz_profiles,
                  models_by_text=quiz_models,
                  preserve_existing=True
              )
              if any(p not in quiz_manifest["entries"] for p in batch_prompts):
                  raise SystemExit("Quiz-Batch unvollständig: mindestens ein freigegebener Frageclip fehlt.")
              quiz_manifest["languageModelPolicy"]={
                  "de":"eleven_flash_v2_5",
                  "ar":"eleven_v4",
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "preserveExistingV4":True,
                  "germanPhonemeDictionaryCompatible":False,
                  "germanInlinePronunciationMaster":True,
                  "arabicSegmentQaRequired":True
              }
              quiz_manifest["counts"]["readyQuestionPrompts"]=sum(p in quiz_manifest["entries"] for p in prompts)
              quiz_manifest["counts"]["remainingQuestionPrompts"]=900-quiz_manifest["counts"]["readyQuestionPrompts"]
              quiz_manifest["counts"]["remainingQuestionsWithMissingAudio"]=sum(
                  1 for q in quiz_items if any(
                      speech not in quiz_manifest["entries"] for speech in quiz_required_texts(q)
                  )
              )
              quiz_manifest["counts"]["nativeArabicQuestions"]=sum(
                  1 for q in quiz_items if any(ARABIC_SCRIPT_RE.search(t) for t in quiz_required_texts(q))
              )
              quiz_manifest["counts"]["bilingualClips"]=sum(
                  1 for entry in quiz_manifest["entries"].values()
                  if entry.get("languageComposition")=="de+ar"
              )
              QUIZ_MANIFEST.write_text(json.dumps(quiz_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print("Quiz-Fragen mit Master-Audio:",quiz_manifest["counts"]["readyQuestionPrompts"],"/900",flush=True)
          else:
              quiz_manifest=load_manifest(QUIZ_MANIFEST)
              print("VOICE_BUILD_SCOPE=dua · Quiz-Pack bleibt unverändert.")

          if build_scope=="quiz":
              print("VOICE_BUILD_SCOPE=quiz · Duʿāʾ-Packs bleiben unverändert.")
              raise SystemExit(0)

          dua=json.loads(DUA.read_text(encoding="utf-8"))
          dua_items=[
              d for d in (dua.get("items") or [])
              if isinstance(d,dict) and d.get("verification")=="verified"
          ]
          if not dua_items:
              raise SystemExit("Keine freigegebenen Kids-Duʿāʾ gefunden.")
          dua_texts=[norm(d.get("audioGermanText") or (str(d.get("childPrompt") or "")+" "+str(d.get("meaning") or ""))) for d in dua_items]
          dua_texts.extend([
              "Richtig. Sehr gut.",
              "Noch nicht. Hör die Erklärung noch einmal."
          ])
          dua_manifest=build_pack(
              texts=dua_texts,
              manifest_path=DUA_MANIFEST,
              asset_dir=DUA_ASSETS,
              profile="kids_story",
              pack_id="KIDS_DUA_OWNER_VOICE_V2",
              counts={"duaItems":len(dua_items),"explanationPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          if dua_manifest["counts"]["explanationPrompts"]!=len(dua_items):
              raise SystemExit("Duʿāʾ-Voice-Pack unvollständig.")

          # Entire Duʿāʾ Arabic layer: Serhat Abu Malik – Master, ElevenLabs V4,
          # explicit Fuṣḥā language hint. This includes Qurʾānic Duʿāʾ because the
          # Kids Duʿāʾ learner deliberately teaches the exact displayed wording with
          # the same owner voice. It is educational speech, not a recitation substitute.
          def arabic_text(d):
              return norm(d.get("audioArabicText") or d.get("arabic") or "")

          dua_arabic_items=[d for d in dua_items if arabic_text(d)]
          if len(dua_arabic_items)!=len(dua_items):
              raise SystemExit("Mindestens ein freigegebenes Duʿāʾ hat keinen arabischen Mastertext.")

          arabic_phrases=[arabic_text(d) for d in dua_arabic_items]
          dua_ar_manifest=build_pack(
              texts=arabic_phrases,
              manifest_path=DUA_AR_MANIFEST,
              asset_dir=DUA_AR_ASSETS,
              profile="dua_arabic",
              pack_id="KIDS_DUA_ARABIC_SERHAT_MASTER_V4",
              counts={"duaItems":len(dua_items),"arabicPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_ar_manifest.update({
              "schemaVersion":4,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "quranArabicSyntheticAllowed":True,
              "educationMode":"owner-voice-fusha-learning",
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_AR_MANIFEST.write_text(json.dumps(dua_ar_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Dedicated slow phrase pack. Never slow a normal clip in the browser:
          # the model renders the phrase slowly and naturally at generation time.
          dua_ar_slow_manifest=build_pack(
              texts=arabic_phrases,
              manifest_path=DUA_AR_SLOW_MANIFEST,
              asset_dir=DUA_AR_SLOW_ASSETS,
              profile="dua_arabic_slow",
              pack_id="KIDS_DUA_ARABIC_SLOW_SERHAT_MASTER_V4",
              counts={"duaItems":len(dua_items),"slowArabicPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_ar_slow_manifest.update({
              "schemaVersion":1,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "playbackMode":"dedicated-natural-slow-render",
              "browserTimeStretchAllowed":False,
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_AR_SLOW_MANIFEST.write_text(json.dumps(dua_ar_slow_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          AR_PUNCT="،؛؟,.!…«»\"'()[]{}"
          def arabic_tokens(text):
              out=[]
              for raw in norm(text).split():
                  token=raw.strip(AR_PUNCT)
                  # A standalone Qurʾānic pause/ornament mark is not a spoken word.
                  if token and any("\u0621"<=ch<="\u064a" for ch in token):
                      out.append(token)
              return out

          # Standalone word renders: clicking a word never seeks into a sentence.
          # Each exact orthographic token is generated as its own Fuṣḥā utterance.
          word_texts=[]
          seen_words=set()
          for d in dua_items:
              for word in arabic_tokens(arabic_text(d)):
                  if word not in seen_words:
                      seen_words.add(word)
                      word_texts.append(word)

          dua_word_manifest=build_pack(
              texts=word_texts,
              manifest_path=DUA_WORD_MANIFEST,
              asset_dir=DUA_WORD_ASSETS,
              profile="dua_word",
              pack_id="KIDS_DUA_WORD_SERHAT_MASTER_V4",
              counts={
                  "duaItems":len(dua_items),
                  "uniqueArabicWords":len(word_texts),
                  "wordPositions":sum(len(arabic_tokens(arabic_text(d))) for d in dua_items)
              },
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_word_manifest.update({
              "schemaVersion":1,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "clipMode":"isolated-word",
              "sourceRule":"exact-displayed-arabic-token",
              "browserSentenceSlicingAllowed":False,
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_WORD_MANIFEST.write_text(json.dumps(dua_word_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Build canonical manifest indexes once. Arabic combining marks can be
          # canonically equivalent while using a different code-point order, so all
          # product URL linking uses NFD keys rather than byte-exact JSON keys.
          def canonical_key(value):
              return unicodedata.normalize("NFD",norm(value))

          def manifest_index(manifest):
              return {
                  canonical_key(key):entry
                  for key,entry in (manifest.get("entries") or {}).items()
                  if canonical_key(key)
              }

          german_index=manifest_index(dua_manifest)
          arabic_index=manifest_index(dua_ar_manifest)
          slow_index=manifest_index(dua_ar_slow_manifest)
          word_index=manifest_index(dua_word_manifest)

          # Build learning segments for every Duʿāʾ. Existing hand-reviewed segment
          # transliterations stay untouched. Every rebuilt segment is linked directly
          # to the current isolated-word clip from the just-written V4 manifest.
          direct_audio_ready=0
          direct_word_ready=0
          for d in dua_items:
              full_ar=arabic_text(d)
              full_de=norm(d.get("audioGermanText") or (str(d.get("childPrompt") or "")+" "+str(d.get("meaning") or "")))
              ar_entry=arabic_index.get(canonical_key(full_ar)) or {}
              slow_entry=slow_index.get(canonical_key(full_ar)) or {}
              de_entry=german_index.get(canonical_key(full_de)) or {}
              d["audioArabicUrl"]=str(ar_entry.get("url") or "")
              d["audioArabicSlowUrl"]=str(slow_entry.get("url") or "")
              d["audioGermanUrl"]=str(de_entry.get("url") or "")
              if d["audioArabicUrl"] and d["audioArabicSlowUrl"] and d["audioGermanUrl"]:
                  direct_audio_ready+=1

              words=arabic_tokens(full_ar)
              old_segments=d.get("learningSegments") if isinstance(d.get("learningSegments"),list) else []
              old_by_ar={}
              for seg in old_segments:
                  if isinstance(seg,dict) and norm(seg.get("arabic")):
                      old_by_ar.setdefault(canonical_key(seg.get("arabic")),[]).append(seg)
              rebuilt=[]
              used={}
              all_word_urls=True
              for idx,word in enumerate(words):
                  ckey=canonical_key(word)
                  choices=old_by_ar.get(ckey) or []
                  pos=used.get(ckey,0)
                  old_seg=choices[pos] if pos<len(choices) else {}
                  used[ckey]=pos+1
                  word_entry=word_index.get(ckey) or {}
                  word_url=str(word_entry.get("url") or "")
                  if not word_url:
                      all_word_urls=False
                  rebuilt.append({
                      "index":idx,
                      "arabic":word,
                      "transliteration":norm(old_seg.get("transliteration") or ""),
                      "audioKey":word,
                      "audioUrl":word_url
                  })
              d["learningSegments"]=rebuilt
              if all_word_urls and len(rebuilt)==len(words):
                  direct_word_ready+=1
              d["audioStatus"]="ready"
              d["smartLearningReady"]=True
              d["audioModelId"]="eleven_v4"
              d["audioVoiceProfileId"]="serhat-owner-voice-2026"
              d["arabicVoiceProfileId"]="serhat-owner-voice-2026"
              d["arabicVoiceSpeaker"]="Serhat Abu Malik – Master"
              d["arabicRegister"]="Fuṣḥā"
              d["wordAudioMode"]="isolated-owner-voice-v4"
              d["slowAudioMode"]="dedicated-owner-voice-v4"
              d["timingSlicesDeprecated"]=True

          if direct_audio_ready!=len(dua_items):
              raise SystemExit(f"Direkte Duʿāʾ-Audio-URLs unvollständig: {direct_audio_ready}/{len(dua_items)}")
          if direct_word_ready!=len(dua_items):
              raise SystemExit(f"Direkte Duʿāʾ-Wort-Audio-URLs unvollständig: {direct_word_ready}/{len(dua_items)}")

          # Persist the product rule as data, not only as generator behavior.
          # The whole Duʿāʾ area uses the owner's Master voice for Arabic/Fuṣḥā
          # learning speech and German explanations. Qurʾānic Duʿāʾ here are
          # educational pronunciation references, not a replacement for tilāwah.
          policy=dua.setdefault("policy",{})
          policy.update({
              "quranAudio":"Im Duʿāʾ-Lernbereich spricht Serhat Abu Malik – Master den exakt geprüften arabischen Wortlaut in Fuṣḥā mit ElevenLabs V4. Dies ist eine Lernreferenz und kein Ersatz für Qurʾān-Rezitation.",
              "sunnahArabicAudio":"Arabische Sunnah-Duʿāʾ verwenden Serhat Abu Malik – Master mit ElevenLabs V4 und expliziter Fuṣḥā-Ausrichtung.",
              "audioLearning":"Jedes verifizierte Duʿāʾ hat getrennte Master-Audios für Deutsch, normales Arabisch, langsames Arabisch und isolierte arabische Wörter.",
              "smartLearning":"Wort-Taps verwenden ausschließlich eigene isolierte V4-Wortclips. Satz-Zeitmarken und Audio-Slices sind für Wortwiedergabe verboten.",
              "slowPracticeRate":"dedicated-v4-slow-render",
              "arabicPronunciation":"Serhat Abu Malik – Master · ElevenLabs V4 · Fuṣḥā / hocharabische Lernreferenz · exakter geprüfter Wortlaut.",
              "audioExpansionPolicy":"Neue verifizierte Duʿāʾ werden im selben Serhat-Master-V4-Pfad für Erklärung, Volltext, Slow-Render und isolierte Wörter produziert."
          })
          counts=dua.setdefault("counts",{})
          counts["total"]=len(dua_items)
          counts["smartLearningReady"]=len(dua_items)
          counts["ownerVoiceGermanReady"]=len(dua_items)
          counts["ownerVoiceArabicReady"]=len(dua_items)
          counts["ownerVoiceArabicSlowReady"]=len(dua_items)
          counts["isolatedWordLearningReady"]=len(dua_items)
          counts["directAudioReady"]=direct_audio_ready
          counts["directWordAudioReady"]=direct_word_ready

          dua["audioPolicy"]={
              "voiceProfileId":"serhat-owner-voice-2026",
              "speaker":"Serhat Abu Malik – Master",
              "modelId":"eleven_v4",
              "arabicRegister":"Fuṣḥā",
              "germanExplanation":"owner-voice",
              "arabicFull":"owner-voice",
              "arabicSlow":"owner-voice-dedicated-slow-render",
              "arabicWord":"owner-voice-isolated-word-render",
              "browserTimeStretch":False,
              "sentenceSliceWordPlayback":False,
              "quranDuaLearningVoice":"owner-voice-fusha"
          }
          DUA.write_text(json.dumps(dua,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          print("Quiz voice pack:",quiz_manifest["counts"])
          print("Dua voice pack:",dua_manifest["counts"])
          print("Dua Arabic owner-voice pack:",dua_ar_manifest["counts"])
          print("Dua Arabic slow pack:",dua_ar_slow_manifest["counts"])
          print("Dua isolated word pack:",dua_word_manifest["counts"])
          print("Synthesis revision:",SYNTHESIS_REVISION)
          PY

      - name: Audit source sentences against generated quiz voice manifest
        if: env.VOICE_BUILD_SCOPE == 'quiz' && env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: python3 kids/tools/quiz_speech_guard.py --manifest kids/data/quiz-audio.json

      - name: Commit complete Kids owner voice packs
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kids/data/quiz-audio.json             kids/data/dua-audio.json             kids/data/dua-arabic-audio.json             kids/data/dua-arabic-slow-audio.json             kids/data/dua-word-audio.json             kids/data/dua-kids.json             kids/assets/kids-quiz-audio             kids/assets/kids-dua-audio             kids/assets/kids-dua-arabic-audio             kids/assets/kids-dua-arabic-slow-audio             kids/assets/kids-dua-word-audio
          if git diff --cached --quiet; then
            echo "Kids owner voice packs already current."
            exit 0
          fi
          if [ "${VOICE_BUILD_SCOPE:-}" = "quiz" ]; then
            git commit -m "Kids: publish bilingual Serhat German Flash / native Fusha V4 quiz audio"
          else
            git commit -m "Kids: publish Serhat V4 Dua voice packs"
          fi
          # Other app releases frequently update main during audio generation.
          # Retry non-fast-forward / ref-lock races without re-synthesizing clips.
          for attempt in $(seq 1 10); do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Kids voice pack committed successfully (attempt ${attempt})."
              break
            fi
            if [ "${attempt}" -eq 10 ]; then
              echo "::error::GitHub main changed during all 10 voice pack push attempts."
              exit 1
            fi
            echo "::warning::Concurrent main update; retrying voice pack push ${attempt}/10."
            sleep $((attempt * 2))
          done

      - name: Publish released Quiz voice audio to the live Cloudflare site
        if: env.VOICE_BUILD_SCOPE == 'quiz' && env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r ready remaining < <(python3 - <<'PY'
          import json
          d=json.load(open("kids/data/quiz-audio.json",encoding="utf-8"))
          c=d.get("counts",{})
          print(c.get("readyQuestionPrompts",0),c.get("remainingQuestionsWithMissingAudio",900))
          PY
          )
          # Publish at milestones of roughly 60 verified questions, plus final completion.
          # Manual pilot releases publish immediately.
          if [ "${VOICE_AUTO_QUEUE:-false}" = "true" ] && [ "$remaining" != "0" ] && [ $((ready % 60)) -ge 12 ]; then
            echo "Quiz voice batch saved on GitHub; next public deploy at release milestone."
            exit 0
          fi
          payload='{"ref":"main"}'
          code="$(curl --retry 2 --retry-delay 2 -sS -o /tmp/quiz-cloudflare-dispatch.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-pages-deploy.yml/dispatches" || true)"
          if [ "$code" = "204" ]; then
            echo "Cloudflare deploy queued for $ready ready quiz questions."
          else
            echo "::warning::Cloudflare release dispatch returned $code; verify deployment independently."
            cat /tmp/quiz-cloudflare-dispatch.json || true
          fi

      - name: Continue auto-queue until all 900 voice prompts are complete
        if: env.VOICE_AUTO_QUEUE == 'true' && env.VOICE_BUILD_SCOPE == 'quiz' && env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remaining="$(python3 - <<'PY'
          import json
          p=json.load(open("kids/data/quiz-audio.json",encoding="utf-8"))
          print(p.get("counts",{}).get("remainingQuestionsWithMissingAudio",900))
          PY
          )"
          if [ "$remaining" = "0" ]; then
            echo "All 900 questions have their question, feedback and explanation clips."
            exit 0
          fi
          echo "$remaining quiz questions still require audio; dispatching the next 12-question pack."
          payload='{"ref":"main","inputs":{"scope":"quiz","quiz_start":"1","quiz_count":"12","auto_queue":"true"}}'
          code="$(curl --retry 2 --retry-delay 2 -sS -o /tmp/quiz-dispatch.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/build-kids-quiz-owner-voice.yml/dispatches" || true)"
          if [ "$code" = "204" ]; then
            echo "Next batch dispatched."
          else
            echo "::warning::Automatic dispatch returned $code; hourly schedule remains as fallback."
            cat /tmp/quiz-dispatch.json || true
          fi
