name: Build Kids Quiz + Dua Owner Voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kids-quiz-owner-voice.yml'
      - 'kids/data/quiz-kids.json'
      - 'kids/data/dua-kids.json'
      - 'kids/tools/voice_text.py'

permissions:
  contents: write

concurrency:
  group: kids-quiz-dua-owner-voice
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VOICE_API: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_PRONUNCIATION_DICTIONARY_ID: ${{ secrets.ELEVENLABS_PRONUNCIATION_DICTIONARY_ID }}
      ELEVENLABS_PRONUNCIATION_DICTIONARY_VERSION_ID: ${{ secrets.ELEVENLABS_PRONUNCIATION_DICTIONARY_VERSION_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require available DĀR owner voice path
        run: |
          set -euo pipefail
          if [ -n "${ELEVENLABS_API_KEY:-}" ]; then
            echo "Direkter Serhat-Owner-Voice-Weg ist verfügbar."
            exit 0
          fi
          test -n "${ADMIN_PUBLISH_SECRET:-}" || { echo "::error::Weder ELEVENLABS_API_KEY noch ADMIN_PUBLISH_SECRET verfügbar."; exit 1; }
          for i in $(seq 1 3); do
            code="$(curl -L -sS -o /tmp/voice-health.json -w '%{http_code}' "$VOICE_API/health" || true)"
            cat /tmp/voice-health.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/voice-health.json; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Kein verfügbarer DĀR Owner-Voice-Renderweg."
          exit 1

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Validate Kids speech normalization
        run: python3 kids/tools/voice_text.py --self-test

      - name: Generate complete Quiz + Dua Serhat voice packs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import threading
          import time
          import urllib.request

          ROOT=pathlib.Path(".")
          sys.path.insert(0,str(ROOT/"kids/tools"))
          from voice_text import SYNTHESIS_REVISION, prepare_kids_voice_text

          QUIZ=ROOT/"kids/data/quiz-kids.json"
          DUA=ROOT/"kids/data/dua-kids.json"
          QUIZ_MANIFEST=ROOT/"kids/data/quiz-audio.json"
          DUA_MANIFEST=ROOT/"kids/data/dua-audio.json"
          QUIZ_ASSETS=ROOT/"kids/assets/kids-quiz-audio"
          DUA_ASSETS=ROOT/"kids/assets/kids-dua-audio"
          API=os.environ["VOICE_API"].rstrip("/")
          SECRET=os.environ.get("ADMIN_PUBLISH_SECRET","").strip()
          ELEVEN_KEY=os.environ.get("ELEVENLABS_API_KEY","").strip()
          ELEVEN_VOICE=(os.environ.get("ELEVENLABS_VOICE_ID","").strip() or "DkU7j9uO4ZEtLD2iRZSH")
          ELEVEN_MODEL="eleven_multilingual_v2"
          DICT_ID=os.environ.get("ELEVENLABS_PRONUNCIATION_DICTIONARY_ID","").strip()
          DICT_VERSION=os.environ.get("ELEVENLABS_PRONUNCIATION_DICTIONARY_VERSION_ID","").strip()
          ORIGIN="https://dar-al-tawhid.de"
          REFERER="https://dar-al-tawhid.de/voice-studio/"
          QUIZ_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_ASSETS.mkdir(parents=True,exist_ok=True)

          def norm(v):
              return " ".join(str(v or "").split()).strip()

          def quiz_prompt(q):
              question=norm(q.get("question"))
              labels=[norm((a or {}).get("label")) for a in (q.get("answers") or [])]
              labels=[x for x in labels if x]
              low=[x.casefold() for x in labels]
              if str(q.get("ageBand") or "")=="4-6" and len(low)==2 and "ja" in low and "nein" in low:
                  return norm(question+" Ja oder Nein?")
              choices=" ".join(f"Antwort {i+1}: {label}." for i,label in enumerate(labels))
              return norm(question+" "+choices)

          def duration(path):
              out=subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ],text=True).strip()
              return float(out)

          def flow_qa(path,text,total_seconds):
              """Reject audible stalls before a clip can enter the Kids app."""
              proc=subprocess.run([
                  "ffmpeg","-hide_banner","-i",str(path),
                  "-af","silencedetect=noise=-45dB:d=0.65",
                  "-f","null","-"
              ],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
              current_start=None
              max_internal=0.0
              for line in (proc.stderr or "").splitlines():
                  m=re.search(r"silence_start:\s*([0-9.]+)",line)
                  if m:
                      current_start=float(m.group(1))
                      continue
                  m=re.search(r"silence_end:\s*([0-9.]+).*silence_duration:\s*([0-9.]+)",line)
                  if not m:
                      continue
                  end=float(m.group(1))
                  dur=float(m.group(2))
                  start=current_start if current_start is not None else max(0.0,end-dur)
                  current_start=None
                  if start>0.20 and end<float(total_seconds)-0.20:
                      max_internal=max(max_internal,dur)

              words=re.findall(r"[A-Za-zÄÖÜäöüßÀ-ÿʾʿ]+",str(text or ""))
              rate=(len(words)/max(float(total_seconds),0.10)) if words else 0.0
              issues=[]
              if max_internal>1.15:
                  issues.append("long_internal_silence")
              if len(words)>=8 and rate<0.85:
                  issues.append("speech_too_slow")
              if len(words)>=8 and rate>5.50:
                  issues.append("speech_too_fast")
              return {
                  "passed":not issues,
                  "issues":issues,
                  "maxInternalSilenceMs":round(max_internal*1000.0),
                  "wordsPerSecond":round(rate,3)
              }

          def load_manifest(path):
              if not path.exists():
                  return {"entries":{}}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {"entries":{}}

          def local_from_entry(entry,asset_dir):
              if str((entry or {}).get("synthesisRevision") or "")!=SYNTHESIS_REVISION:
                  return None
              url=str((entry or {}).get("url") or "").split("?",1)[0]
              expected="/"+str(asset_dir).replace(os.sep,"/")+"/"
              if not url.startswith(expected):
                  return None
              p=ROOT/url.lstrip("/")
              return p if p.exists() and p.stat().st_size>1200 else None

          lock=threading.Lock()

          def synth(text,profile,asset_dir,serial):
              use_alias_fallback=bool(ELEVEN_KEY) and not (DICT_ID and DICT_VERSION)
              prepared=prepare_kids_voice_text(
                  text,
                  use_pronunciation_aliases=use_alias_fallback
              )
              digest=hashlib.sha1(
                  (SYNTHESIS_REVISION+"|"+profile+"|"+text).encode("utf-8")
              ).hexdigest()[:16]
              target=asset_dir/(digest+".m4a")
              last=None
              for attempt in range(1,4):
                  if ELEVEN_KEY:
                      if profile=="quiz":
                          voice_settings={
                              "stability":0.68,
                              "similarity_boost":0.89,
                              "style":0.08,
                              "speed":0.93,
                              "use_speaker_boost":True
                          }
                      elif profile=="kids_story":
                          voice_settings={
                              "stability":0.62,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.91,
                              "use_speaker_boost":True
                          }
                      else:
                          voice_settings={
                              "stability":0.68,
                              "similarity_boost":0.88,
                              "style":0.10,
                              "speed":0.93,
                              "use_speaker_boost":True
                          }
                      payload={
                          "text":prepared,
                          "model_id":ELEVEN_MODEL,
                          "voice_settings":voice_settings
                      }
                      if DICT_ID and DICT_VERSION:
                          payload["pronunciation_dictionary_locators"]=[{
                              "pronunciation_dictionary_id":DICT_ID,
                              "version_id":DICT_VERSION
                          }]
                      body=json.dumps(payload,ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          "https://api.elevenlabs.io/v1/text-to-speech/"+ELEVEN_VOICE,
                          data=body,
                          method="POST",
                          headers={
                              "xi-api-key":ELEVEN_KEY,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  else:
                      body=json.dumps({
                          "text":text,
                          "prepared":prepared,
                          "profile":("kids_lesson" if profile=="quiz" else profile)
                      },ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          API+"/generate",
                          data=body,
                          method="POST",
                          headers={
                              "Origin":ORIGIN,
                              "Referer":REFERER,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "X-Admin-Secret":SECRET,
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  mp3=pathlib.Path("/tmp")/(digest+f"-{attempt}.mp3")
                  try:
                      with urllib.request.urlopen(req,timeout=180) as response:
                          data=response.read()
                      if len(data)<900:
                          raise RuntimeError(f"Voice response too small: {len(data)}")
                      mp3.write_bytes(data)
                      subprocess.run([
                          "ffmpeg","-hide_banner","-loglevel","error","-y",
                          "-i",str(mp3),"-ac","1","-ar","48000",
                          "-c:a","aac","-b:a","48k","-movflags","+faststart",
                          str(target)
                      ],check=True)
                      if target.stat().st_size<1200:
                          raise RuntimeError("Encoded clip too small")
                      d=duration(target)
                      if not (0.25<=d<=120):
                          raise RuntimeError(f"Implausible duration: {d:.3f}s")
                      flow=flow_qa(target,text,d)
                      if not flow["passed"]:
                          raise RuntimeError("Audio flow QA: "+", ".join(flow["issues"]))
                      with lock:
                          serial["done"]+=1
                          print(
                              f"[{serial['done']}/{serial['total']}] {text[:72]} · {d:.2f}s",
                              flush=True
                          )
                      return text,target,d,prepared,flow
                  except Exception as exc:
                      last=exc
                      target.unlink(missing_ok=True)
                      if attempt<3:
                          time.sleep(2*attempt)
              raise RuntimeError(f"Generation failed for {text[:80]!r}: {last}")

          def build_pack(*,texts,manifest_path,asset_dir,profile,pack_id,counts):
              unique=[]
              seen=set()
              for raw in texts:
                  text=norm(raw)
                  if text and text not in seen:
                      seen.add(text)
                      unique.append(text)

              old=load_manifest(manifest_path)
              old_entries=dict(old.get("entries") or {})
              results={}
              prepared_hashes={}
              qa_reports={}

              for text in unique:
                  entry=old_entries.get(text) or {}
                  p=local_from_entry(entry,asset_dir)
                  if p is None:
                      continue
                  results[text]=(p,float(entry.get("durationSeconds") or duration(p)))
                  prepared=prepare_kids_voice_text(
                      text,
                      use_pronunciation_aliases=bool(ELEVEN_KEY) and not (DICT_ID and DICT_VERSION)
                  )
                  prepared_hashes[text]=hashlib.sha256(prepared.encode("utf-8")).hexdigest()
                  qa_reports[text]=entry.get("flowQa") or {"passed":True,"reused":True}

              missing=[text for text in unique if text not in results]
              print(f"{pack_id}: {len(unique)} Texte · {len(results)} aktuell · {len(missing)} neu")
              serial={"done":0,"total":len(missing)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
                  futures={ex.submit(synth,text,profile,asset_dir,serial):text for text in missing}
                  for fut in concurrent.futures.as_completed(futures):
                      text,p,d,prepared,flow=fut.result()
                      results[text]=(p,d)
                      prepared_hashes[text]=hashlib.sha256(prepared.encode("utf-8")).hexdigest()
                      qa_reports[text]=flow

              build_id=pack_id.lower().replace("_","-")+"-"+time.strftime("%Y%m%d-%H%M%S",time.gmtime())
              now=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
              entries={}
              referenced=set()
              for text in unique:
                  p,d=results[text]
                  referenced.add(p.name)
                  rel="/"+str(p).replace(os.sep,"/")
                  entries[text]={
                      "url":rel+"?v="+build_id,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                      "durationSeconds":round(float(d),3),
                      "preparedTextSha256":prepared_hashes[text],
                      "synthesisRevision":SYNTHESIS_REVISION,
                      "flowQa":qa_reports[text],
                      "voiceProfileId":"serhat-owner-voice-2026",
                      "sourceVoice":"authorized-owner-voice",
                      "sourceType":"owner-voice-generated",
                      "sourceProvider":"DĀR Voice Studio",
                      "sourceSpeaker":"Serhat Abu Malik",
                      "qaBy":"automatic-owner-voice-batch-qa",
                      "qaAt":now
                  }

              for stale in asset_dir.glob("*.m4a"):
                  if stale.name not in referenced:
                      stale.unlink(missing_ok=True)

              manifest={
                  "schemaVersion":2,
                  "id":pack_id,
                  "buildId":build_id,
                  "updatedAt":now,
                  "synthesisRevision":SYNTHESIS_REVISION,
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "speaker":"Serhat Abu Malik",
                  "speechPreparation":"explicit-german-numbers-and-quran-references",
                  "manualPerClipApprovalRequired":False,
                  "technicalQaRequired":True,
                  "systemTtsFallbackAllowed":False,
                  "entries":entries,
                  "counts":{**counts,"uniqueSpokenTexts":len(entries)}
              }
              manifest_path.write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8"
              )
              for text,entry in entries.items():
                  p=ROOT/str(entry["url"]).split("?",1)[0].lstrip("/")
                  if not p.exists() or p.stat().st_size<1200:
                      raise SystemExit("Audio fehlt: "+str(p))
              return manifest

          quiz=json.loads(QUIZ.read_text(encoding="utf-8"))
          quiz_items=[
              q for q in (quiz.get("items") or [])
              if isinstance(q,dict)
              and q.get("status")=="published"
              and q.get("reviewStatus")=="approved"
              and q.get("verification")=="approved"
          ]
          if len(quiz_items)!=650:
              raise SystemExit(f"Erwartet 650 freigegebene Kids-Fragen, gefunden: {len(quiz_items)}")
          prompts=[quiz_prompt(q) for q in quiz_items]
          if len(set(prompts))!=650:
              raise SystemExit("Quiz-Sprachprompts sind nicht eindeutig.")
          quiz_texts=[]
          for q in quiz_items:
              quiz_texts.extend((quiz_prompt(q),norm(q.get("success")),norm(q.get("retry"))))
          quiz_texts.append("Sehr gut. Du hast das Quiz geschafft.")

          quiz_manifest=build_pack(
              texts=quiz_texts,
              manifest_path=QUIZ_MANIFEST,
              asset_dir=QUIZ_ASSETS,
              profile="quiz",
              pack_id="KIDS_QUIZ_OWNER_VOICE_V2",
              counts={"quizQuestions":len(quiz_items),"questionPrompts":len(set(prompts))}
          )
          if quiz_manifest["counts"]["quizQuestions"]!=650 or quiz_manifest["counts"]["questionPrompts"]!=650:
              raise SystemExit("650er Quiz-Voice-Pack unvollständig.")

          dua=json.loads(DUA.read_text(encoding="utf-8"))
          dua_items=[
              d for d in (dua.get("items") or [])
              if isinstance(d,dict) and d.get("verification")=="verified"
          ]
          if not dua_items:
              raise SystemExit("Keine freigegebenen Kids-Duʿāʾ gefunden.")
          dua_texts=[norm(str(d.get("childPrompt") or "")+" "+str(d.get("meaning") or "")) for d in dua_items]
          dua_texts.extend([
              "Richtig. Sehr gut.",
              "Noch nicht. Hör die Erklärung noch einmal."
          ])
          dua_manifest=build_pack(
              texts=dua_texts,
              manifest_path=DUA_MANIFEST,
              asset_dir=DUA_ASSETS,
              profile="kids_story",
              pack_id="KIDS_DUA_OWNER_VOICE_V1",
              counts={"duaItems":len(dua_items),"explanationPrompts":len(dua_items)}
          )
          if dua_manifest["counts"]["explanationPrompts"]!=len(dua_items):
              raise SystemExit("Duʿāʾ-Voice-Pack unvollständig.")

          print("Quiz voice pack:",quiz_manifest["counts"])
          print("Dua voice pack:",dua_manifest["counts"])
          print("Synthesis revision:",SYNTHESIS_REVISION)
          PY

      - name: Commit complete Kids owner voice packs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/data/quiz-audio.json kids/data/dua-audio.json kids/assets/kids-quiz-audio kids/assets/kids-dua-audio
          if git diff --cached --quiet; then
            echo "Kids owner voice packs already current."
            exit 0
          fi
          git commit -m "Kids: refresh Quiz and Dua Serhat voice packs"
          git pull --rebase origin main
          git push origin HEAD:main
