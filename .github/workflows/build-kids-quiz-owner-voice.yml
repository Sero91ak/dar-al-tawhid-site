name: Build Kids Quiz Owner Voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kids-quiz-owner-voice.yml'
      - 'kids/data/quiz-kids.json'

permissions:
  contents: write

concurrency:
  group: kids-quiz-owner-voice
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VOICE_API: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require owner voice service
        run: |
          set -euo pipefail
          if [ -n "${ELEVENLABS_API_KEY:-}" ]; then
            echo "Direkter ElevenLabs-Owner-Voice-Weg ist verfügbar."
            exit 0
          fi
          test -n "${ADMIN_PUBLISH_SECRET:-}" || { echo "::error::Weder ELEVENLABS_API_KEY noch ADMIN_PUBLISH_SECRET verfügbar."; exit 1; }
          for i in $(seq 1 6); do
            code="$(curl -L -sS -o /tmp/voice-health.json -w '%{http_code}' "$VOICE_API/health" || true)"
            cat /tmp/voice-health.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/voice-health.json; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Weder direkter ElevenLabs-Zugang noch konfigurierter Owner-Voice-Service ist bereit."
          exit 1

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Generate complete 650-question Serhat quiz pack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import threading
          import time
          import urllib.request

          ROOT=pathlib.Path(".")
          QUIZ=ROOT/"kids/data/quiz-kids.json"
          MANIFEST=ROOT/"kids/data/quiz-audio.json"
          ASSETS=ROOT/"kids/assets/kids-quiz-audio"
          API=os.environ["VOICE_API"].rstrip("/")
          SECRET=os.environ.get("ADMIN_PUBLISH_SECRET","").strip()
          ELEVEN_KEY=os.environ.get("ELEVENLABS_API_KEY","").strip()
          ELEVEN_VOICE=(os.environ.get("ELEVENLABS_VOICE_ID","").strip() or "DkU7j9uO4ZEtLD2iRZSH")
          ELEVEN_MODEL="eleven_multilingual_v2"
          ORIGIN="https://dar-al-tawhid.de"
          REFERER="https://dar-al-tawhid.de/voice-studio/"
          ASSETS.mkdir(parents=True,exist_ok=True)

          quiz=json.loads(QUIZ.read_text(encoding="utf-8"))
          old=json.loads(MANIFEST.read_text(encoding="utf-8")) if MANIFEST.exists() else {"entries":{}}
          old_entries=dict(old.get("entries") or {})

          def norm(v):
              return " ".join(str(v or "").split()).strip()

          def prompt(q):
              question=norm(q.get("question"))
              labels=[norm((a or {}).get("label")) for a in (q.get("answers") or [])]
              labels=[x for x in labels if x]
              low=[x.casefold() for x in labels]
              if str(q.get("ageBand") or "")=="4-6" and len(low)==2 and "ja" in low and "nein" in low:
                  return norm(question+" Ja oder Nein?")
              choices=" ".join(f"Antwort {i+1}: {label}." for i,label in enumerate(labels))
              return norm(question+" "+choices)

          items=[
              q for q in (quiz.get("items") or [])
              if isinstance(q,dict)
              and q.get("status")=="published"
              and q.get("reviewStatus")=="approved"
              and q.get("verification")=="approved"
          ]
          if len(items)!=650:
              raise SystemExit(f"Erwartet 650 freigegebene Kids-Fragen, gefunden: {len(items)}")

          texts=[]
          seen=set()
          for q in items:
              for value in (prompt(q),norm(q.get("success")),norm(q.get("retry"))):
                  if value and value not in seen:
                      seen.add(value); texts.append(value)
          if len({prompt(q) for q in items})!=650:
              raise SystemExit("Quiz-Sprachprompts sind nicht eindeutig.")
          if len(texts)<652:
              raise SystemExit(f"Zu wenige eindeutige Quiz-Sprachtexte: {len(texts)}")

          def local_from_entry(entry):
              url=str((entry or {}).get("url") or "").split("?",1)[0]
              if not url.startswith("/kids/assets/kids-quiz-audio/"):
                  return None
              p=ROOT/url.lstrip("/")
              return p if p.exists() and p.stat().st_size>1200 else None

          reusable={}
          for text in texts:
              entry=old_entries.get(text) or {}
              p=local_from_entry(entry)
              if p is not None:
                  reusable[text]=(p,entry)

          print(f"Quizfragen: {len(items)}")
          print(f"Eindeutige Sprachtexte: {len(texts)}")
          print(f"Bereits als lokale Serhat-Audios vorhanden: {len(reusable)}")
          print(f"Neu zu erzeugen: {len(texts)-len(reusable)}")

          lock=threading.Lock()
          counter={"done":0}

          def duration(path):
              out=subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ],text=True).strip()
              return float(out)

          def synth(text):
              digest=hashlib.sha1(text.encode("utf-8")).hexdigest()[:16]
              target=ASSETS/(digest+".m4a")
              if target.exists() and target.stat().st_size>1200:
                  d=duration(target)
                  if 0.25<=d<=90:
                      return text,target,d

              last=None
              for attempt in range(1,4):
                  if ELEVEN_KEY:
                      body=json.dumps({
                          "text":text,
                          "model_id":ELEVEN_MODEL,
                          "voice_settings":{
                              "stability":0.72,
                              "similarity_boost":0.78,
                              "style":0.08,
                              "use_speaker_boost":True
                          }
                      },ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          "https://api.elevenlabs.io/v1/text-to-speech/"+ELEVEN_VOICE,
                          data=body,
                          method="POST",
                          headers={
                              "xi-api-key":ELEVEN_KEY,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "User-Agent":"DAR-Kids-Quiz-Owner-Voice/3"
                          }
                      )
                  else:
                      body=json.dumps({
                          "text":text,
                          "prepared":text,
                          "profile":"kids_lesson"
                      },ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          API+"/generate",
                          data=body,
                          method="POST",
                          headers={
                              "Origin":ORIGIN,
                              "Referer":REFERER,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "X-Admin-Secret":SECRET,
                              "User-Agent":"DAR-Kids-Quiz-Owner-Voice/3"
                          }
                      )
                  mp3=pathlib.Path("/tmp")/(digest+f"-{attempt}.mp3")
                  try:
                      with urllib.request.urlopen(req,timeout=180) as response:
                          data=response.read()
                      if len(data)<900:
                          raise RuntimeError(f"Voice response too small: {len(data)}")
                      mp3.write_bytes(data)
                      subprocess.run([
                          "ffmpeg","-hide_banner","-loglevel","error","-y",
                          "-i",str(mp3),"-ac","1","-ar","48000",
                          "-c:a","aac","-b:a","64k","-movflags","+faststart",
                          str(target)
                      ],check=True)
                      if target.stat().st_size<1200:
                          raise RuntimeError("Encoded clip too small")
                      d=duration(target)
                      if not (0.25<=d<=90):
                          raise RuntimeError(f"Implausible duration: {d:.3f}s")
                      return text,target,d
                  except Exception as exc:
                      last=exc
                      target.unlink(missing_ok=True)
                      if attempt<3:
                          time.sleep(2*attempt)
              raise RuntimeError(f"Generation failed for {text[:80]!r}: {last}")

          results={}
          for text,(p,e) in reusable.items():
              results[text]=(p,float(e.get("durationSeconds") or duration(p)))

          missing=[t for t in texts if t not in results]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              futures={ex.submit(synth,t):t for t in missing}
              for fut in concurrent.futures.as_completed(futures):
                  text,p,d=fut.result()
                  results[text]=(p,d)
                  with lock:
                      counter["done"]+=1
                      n=counter["done"]
                  print(f"[{n}/{len(missing)}] {text[:72]} · {d:.2f}s",flush=True)

          build_id="serhat-quiz-650-"+time.strftime("%Y%m%d-%H%M%S",time.gmtime())
          now=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          entries={}
          for text in texts:
              p,d=results[text]
              rel="/"+str(p).replace(os.sep,"/")
              entries[text]={
                  "url":rel+"?v="+build_id,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                  "durationSeconds":round(float(d),3),
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "sourceVoice":"authorized-owner-voice",
                  "sourceType":"owner-voice-generated",
                  "sourceProvider":"DĀR Voice Studio",
                  "sourceSpeaker":"Serhat Abu Malik",
                  "qaBy":"automatic-owner-voice-batch-qa",
                  "qaAt":now
              }

          manifest={
              "schemaVersion":1,
              "id":"KIDS_QUIZ_OWNER_VOICE_V1",
              "buildId":build_id,
              "updatedAt":now,
              "voiceProfileId":"serhat-owner-voice-2026",
              "speaker":"Serhat Abu Malik",
              "manualPerClipApprovalRequired":False,
              "technicalQaRequired":True,
              "systemTtsFallbackAllowed":False,
              "entries":entries,
              "counts":{
                  "quizQuestions":len(items),
                  "questionPrompts":len({prompt(q) for q in items}),
                  "uniqueSpokenTexts":len(entries)
              }
          }
          MANIFEST.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          if manifest["counts"]["quizQuestions"]!=650 or manifest["counts"]["questionPrompts"]!=650:
              raise SystemExit("650er Quiz-Voice-Pack unvollständig.")
          if manifest["counts"]["uniqueSpokenTexts"]<652:
              raise SystemExit("Quiz-Voice-Manifest unvollständig.")
          for text,entry in entries.items():
              p=ROOT/str(entry["url"]).split("?",1)[0].lstrip("/")
              if not p.exists() or p.stat().st_size<1200:
                  raise SystemExit("Audio fehlt: "+str(p))
          print("Vollständiger Serhat-Quiz-Pack:",manifest["counts"])
          PY

      - name: Commit complete quiz owner voice pack
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/data/quiz-audio.json kids/assets/kids-quiz-audio
          if git diff --cached --quiet; then
            echo "Quiz owner voice pack already current."
            exit 0
          fi
          git commit -m "Kids: publish complete 650-question Serhat quiz voice pack"
          git pull --rebase origin main
          git push origin HEAD:main
