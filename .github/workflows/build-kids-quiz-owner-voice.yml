name: Build Kids Quiz + Dua Owner Voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kids/data/dua-kids.json'
      - 'kids/tools/voice_text.py'
      - '.github/workflows/build-kids-quiz-owner-voice.yml'

permissions:
  contents: write

concurrency:
  group: kids-quiz-dua-owner-voice
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VOICE_API: https://dar-admin-publisher.sero91ak.workers.dev/voice-studio/api
      ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      VOICE_BUILD_SCOPE: ${{ contains(github.event.head_commit.message, '[dua-only]') && 'dua' || contains(github.event.head_commit.message, '[quiz-only]') && 'quiz' || 'full' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve available DĀR owner voice path
        run: |
          set -euo pipefail
          if [ -n "${ELEVENLABS_API_KEY:-}" ]; then
            echo "DAR_VOICE_PROVIDER_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "DAR_VOICE_PROVIDER=elevenlabs-direct" >> "$GITHUB_ENV"
            echo "Direkter Serhat-Owner-Voice-Weg ist verfügbar."
            exit 0
          fi
          if [ -n "${ADMIN_PUBLISH_SECRET:-}" ]; then
            for i in $(seq 1 3); do
              code="$(curl -L -sS -o /tmp/voice-health.json -w '%{http_code}' "$VOICE_API/health" || true)"
              cat /tmp/voice-health.json || true
              if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/voice-health.json; then
                echo "DAR_VOICE_PROVIDER_AVAILABLE=1" >> "$GITHUB_ENV"
                echo "DAR_VOICE_PROVIDER=dar-cloud" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 3
            done
          fi
          echo "DAR_VOICE_PROVIDER_AVAILABLE=0" >> "$GITHUB_ENV"
          echo "DAR_VOICE_PROVIDER=unavailable" >> "$GITHUB_ENV"
          echo "::warning::Kein CI-Voice-Provider konfiguriert. Sprach-Normalisierung wird geprüft; Audio-Neurendering wird übersprungen."

      - name: Install audio tools
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Validate Kids speech normalization
        run: python3 kids/tools/voice_text.py --self-test

      - name: Generate complete Quiz + Dua Serhat voice packs
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import threading
          import time
          import urllib.request

          ROOT=pathlib.Path(".")
          sys.path.insert(0,str(ROOT/"kids/tools"))
          from voice_text import SYNTHESIS_REVISION, prepare_kids_voice_text

          QUIZ=ROOT/"kids/data/quiz-kids.json"
          DUA=ROOT/"kids/data/dua-kids.json"
          QUIZ_MANIFEST=ROOT/"kids/data/quiz-audio.json"
          DUA_MANIFEST=ROOT/"kids/data/dua-audio.json"
          DUA_AR_MANIFEST=ROOT/"kids/data/dua-arabic-audio.json"
          DUA_AR_SLOW_MANIFEST=ROOT/"kids/data/dua-arabic-slow-audio.json"
          DUA_WORD_MANIFEST=ROOT/"kids/data/dua-word-audio.json"
          QUIZ_ASSETS=ROOT/"kids/assets/kids-quiz-audio"
          DUA_ASSETS=ROOT/"kids/assets/kids-dua-audio"
          DUA_AR_ASSETS=ROOT/"kids/assets/kids-dua-arabic-audio"
          DUA_AR_SLOW_ASSETS=ROOT/"kids/assets/kids-dua-arabic-slow-audio"
          DUA_WORD_ASSETS=ROOT/"kids/assets/kids-dua-word-audio"
          API=os.environ["VOICE_API"].rstrip("/")
          SECRET=os.environ.get("ADMIN_PUBLISH_SECRET","").strip()
          ELEVEN_KEY=os.environ.get("ELEVENLABS_API_KEY","").strip()
          PROD_CFG=json.loads((ROOT/"data/pronunciation/elevenlabs-production.json").read_text(encoding="utf-8"))
          ELEVEN_VOICE=(os.environ.get("ELEVENLABS_VOICE_ID","").strip() or str((PROD_CFG.get("masterVoice") or {}).get("voiceId") or "").strip())
          ELEVEN_MODEL=str(PROD_CFG.get("modelId") or "").strip()
          ELEVEN_DUA_MODEL=ELEVEN_MODEL
          DICT_CFG=PROD_CFG.get("pronunciationDictionary") or {}
          DICT_ID=str(DICT_CFG.get("id") or "").strip()
          DICT_VERSION=str(DICT_CFG.get("versionId") or "").strip()
          DICT_RULES=int(DICT_CFG.get("ruleCount") or 0)
          if ELEVEN_MODEL!="eleven_v4":
              raise SystemExit(f"Produktionsmodell muss eleven_v4 sein, gefunden: {ELEVEN_MODEL!r}")
          if not ELEVEN_VOICE:
              raise SystemExit("Master Voice-ID fehlt in data/pronunciation/elevenlabs-production.json")
          if not DICT_ID or not DICT_VERSION or DICT_RULES<1:
              raise SystemExit("Kanonisches ElevenLabs-Aussprachewörterbuch ist unvollständig konfiguriert.")
          ORIGIN="https://dar-al-tawhid.de"
          REFERER="https://dar-al-tawhid.de/voice-studio/"
          QUIZ_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_AR_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_AR_SLOW_ASSETS.mkdir(parents=True,exist_ok=True)
          DUA_WORD_ASSETS.mkdir(parents=True,exist_ok=True)

          def norm(v):
              return " ".join(str(v or "").split()).strip()

          def quiz_prompt(q):
              question=norm(q.get("question"))
              labels=[norm((a or {}).get("label")) for a in (q.get("answers") or [])]
              labels=[x for x in labels if x]
              low=[x.casefold() for x in labels]
              if str(q.get("ageBand") or "")=="4-6" and len(low)==2 and "ja" in low and "nein" in low:
                  return norm(question+" Ja oder Nein?")
              choices=" ".join(f"Antwort {i+1}: {label}." for i,label in enumerate(labels))
              return norm(question+" "+choices)

          def duration(path):
              out=subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ],text=True).strip()
              return float(out)

          def load_manifest(path):
              if not path.exists():
                  return {"entries":{}}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {"entries":{}}

          def local_from_entry(entry,asset_dir,expected_model=None,expected_profile=None):
              if str((entry or {}).get("synthesisRevision") or "")!=SYNTHESIS_REVISION:
                  return None
              if expected_model and str((entry or {}).get("modelId") or "")!=str(expected_model):
                  return None
              if expected_profile and str((entry or {}).get("speechProfile") or "")!=str(expected_profile):
                  return None
              url=str((entry or {}).get("url") or "").split("?",1)[0]
              expected="/"+str(asset_dir).replace(os.sep,"/")+"/"
              if not url.startswith(expected):
                  return None
              p=ROOT/url.lstrip("/")
              return p if p.exists() and p.stat().st_size>1200 else None

          lock=threading.Lock()

          def synth(text,profile,asset_dir,serial,model_id):
              prepared=norm(text) if profile in ("dua_arabic","dua_arabic_slow","dua_word") else prepare_kids_voice_text(text)
              digest=hashlib.sha1(
                  (SYNTHESIS_REVISION+"|"+str(model_id)+"|"+profile+"|"+DICT_ID+"|"+DICT_VERSION+"|"+text).encode("utf-8")
              ).hexdigest()[:16]
              target=asset_dir/(digest+".m4a")
              last=None
              for attempt in range(1,4):
                  if ELEVEN_KEY:
                      if profile=="quiz_4_6":
                          voice_settings={
                              "stability":0.62,
                              "similarity_boost":0.90,
                              "style":0.12,
                              "speed":0.90,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_7_8":
                          voice_settings={
                              "stability":0.60,
                              "similarity_boost":0.89,
                              "style":0.14,
                              "speed":0.94,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_9_10":
                          voice_settings={
                              "stability":0.58,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.97,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz_feedback":
                          voice_settings={
                              "stability":0.60,
                              "similarity_boost":0.89,
                              "style":0.14,
                              "speed":0.95,
                              "use_speaker_boost":True
                          }
                      elif profile=="quiz":
                          voice_settings={
                              "stability":0.58,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.97,
                              "use_speaker_boost":True
                          }
                      elif profile=="kids_story":
                          voice_settings={
                              "stability":0.62,
                              "similarity_boost":0.88,
                              "style":0.16,
                              "speed":0.91,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_arabic":
                          voice_settings={
                              "stability":0.72,
                              "similarity_boost":0.92,
                              "style":0.04,
                              "speed":0.90,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_arabic_slow":
                          voice_settings={
                              "stability":0.76,
                              "similarity_boost":0.92,
                              "style":0.02,
                              "speed":0.74,
                              "use_speaker_boost":True
                          }
                      elif profile=="dua_word":
                          voice_settings={
                              "stability":0.80,
                              "similarity_boost":0.93,
                              "style":0.01,
                              "speed":0.80,
                              "use_speaker_boost":True
                          }
                      else:
                          voice_settings={
                              "stability":0.68,
                              "similarity_boost":0.88,
                              "style":0.10,
                              "speed":0.93,
                              "use_speaker_boost":True
                          }
                      is_arabic_profile=profile in ("dua_arabic","dua_arabic_slow","dua_word")
                      payload={
                          "text":prepared,
                          "model_id":model_id,
                          "voice_settings":voice_settings,
                          "apply_text_normalization":("off" if is_arabic_profile else "on")
                      }
                      if is_arabic_profile:
                          payload["language_code"]="ar"
                      if DICT_ID and DICT_VERSION:
                          payload["pronunciation_dictionary_locators"]=[{
                              "pronunciation_dictionary_id":DICT_ID,
                              "version_id":DICT_VERSION
                          }]
                      body=json.dumps(payload,ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          "https://api.elevenlabs.io/v1/text-to-speech/"+ELEVEN_VOICE,
                          data=body,
                          method="POST",
                          headers={
                              "xi-api-key":ELEVEN_KEY,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  else:
                      body=json.dumps({
                          "text":text,
                          "prepared":prepared,
                          "profile":profile
                      },ensure_ascii=False).encode("utf-8")
                      req=urllib.request.Request(
                          API+"/generate",
                          data=body,
                          method="POST",
                          headers={
                              "Origin":ORIGIN,
                              "Referer":REFERER,
                              "Content-Type":"application/json",
                              "Accept":"audio/mpeg",
                              "X-Admin-Secret":SECRET,
                              "User-Agent":"DAR-Kids-Owner-Voice/5"
                          }
                      )
                  mp3=pathlib.Path("/tmp")/(digest+f"-{attempt}.mp3")
                  try:
                      with urllib.request.urlopen(req,timeout=180) as response:
                          data=response.read()
                      if len(data)<900:
                          raise RuntimeError(f"Voice response too small: {len(data)}")
                      mp3.write_bytes(data)
                      subprocess.run([
                          "ffmpeg","-hide_banner","-loglevel","error","-y",
                          "-i",str(mp3),"-ac","1","-ar","48000",
                          "-c:a","aac","-b:a","48k","-movflags","+faststart",
                          str(target)
                      ],check=True)
                      if target.stat().st_size<1200:
                          raise RuntimeError("Encoded clip too small")
                      d=duration(target)
                      min_duration=0.12 if profile=="dua_word" else 0.25
                      if not (min_duration<=d<=120):
                          raise RuntimeError(f"Implausible duration: {d:.3f}s")
                      with lock:
                          serial["done"]+=1
                          print(
                              f"[{serial['done']}/{serial['total']}] {text[:72]} · {d:.2f}s",
                              flush=True
                          )
                      return text,target,d,prepared
                  except Exception as exc:
                      last=exc
                      target.unlink(missing_ok=True)
                      if attempt<3:
                          time.sleep(2*attempt)
              raise RuntimeError(f"Generation failed for {text[:80]!r}: {last}")

          def build_pack(*,texts,manifest_path,asset_dir,profile,pack_id,counts,model_id=None,require_model_match=False,profiles_by_text=None):
              model_id=model_id or ELEVEN_MODEL
              unique=[]
              seen=set()
              for raw in texts:
                  text=norm(raw)
                  if text and text not in seen:
                      seen.add(text)
                      unique.append(text)

              old=load_manifest(manifest_path)
              old_entries=dict(old.get("entries") or {})
              results={}
              prepared_hashes={}

              for text in unique:
                  entry=old_entries.get(text) or {}
                  text_profile=(profiles_by_text or {}).get(text,profile)
                  p=local_from_entry(
                      entry,
                      asset_dir,
                      model_id if require_model_match else None,
                      text_profile
                  )
                  if p is None:
                      continue
                  results[text]=(p,float(entry.get("durationSeconds") or duration(p)))
                  prepared=norm(text) if profile in ("dua_arabic","dua_arabic_slow","dua_word") else prepare_kids_voice_text(text)
                  prepared_hashes[text]=hashlib.sha256(prepared.encode("utf-8")).hexdigest()

              missing=[text for text in unique if text not in results]
              print(f"{pack_id}: {len(unique)} Texte · {len(results)} aktuell · {len(missing)} neu")
              serial={"done":0,"total":len(missing)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
                  futures={
                      ex.submit(
                          synth,
                          text,
                          (profiles_by_text or {}).get(text,profile),
                          asset_dir,
                          serial,
                          model_id
                      ):text
                      for text in missing
                  }
                  for fut in concurrent.futures.as_completed(futures):
                      text,p,d,prepared=fut.result()
                      results[text]=(p,d)
                      prepared_hashes[text]=hashlib.sha256(prepared.encode("utf-8")).hexdigest()

              build_id=pack_id.lower().replace("_","-")+"-"+time.strftime("%Y%m%d-%H%M%S",time.gmtime())
              now=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
              entries={}
              referenced=set()
              for text in unique:
                  p,d=results[text]
                  referenced.add(p.name)
                  rel="/"+str(p).replace(os.sep,"/")
                  entries[text]={
                      "url":rel+"?v="+build_id,
                      "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                      "durationSeconds":round(float(d),3),
                      "preparedTextSha256":prepared_hashes[text],
                      "synthesisRevision":SYNTHESIS_REVISION,
                      "modelId":model_id,
                      "speechProfile":(profiles_by_text or {}).get(text,profile),
                      "voiceProfileId":"serhat-owner-voice-2026",
                      "sourceVoice":"authorized-owner-voice",
                      "sourceType":"owner-voice-generated",
                      "sourceProvider":"DĀR Voice Studio",
                      "sourceSpeaker":"Serhat Abu Malik",
                      "pronunciationDictionaryId":DICT_ID,
                      "pronunciationDictionaryVersionId":DICT_VERSION,
                      "pronunciationDictionaryRuleCount":DICT_RULES,
                      "qaBy":"automatic-owner-voice-batch-qa",
                      "qaAt":now
                  }

              for stale in asset_dir.glob("*.m4a"):
                  if stale.name not in referenced:
                      stale.unlink(missing_ok=True)

              manifest={
                  "schemaVersion":2,
                  "id":pack_id,
                  "buildId":build_id,
                  "updatedAt":now,
                  "synthesisRevision":SYNTHESIS_REVISION,
                  "voiceProfileId":"serhat-owner-voice-2026",
                  "speaker":"Serhat Abu Malik",
                  "speechPreparation":"explicit-german-numbers-and-quran-references",
                  "manualPerClipApprovalRequired":False,
                  "technicalQaRequired":True,
                  "systemTtsFallbackAllowed":False,
                  "modelId":model_id,
                  "pronunciationDictionaryId":DICT_ID,
                  "pronunciationDictionaryVersionId":DICT_VERSION,
                  "pronunciationDictionaryRuleCount":DICT_RULES,
                  "entries":entries,
                  "counts":{**counts,"uniqueSpokenTexts":len(entries)}
              }
              manifest_path.write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
                  encoding="utf-8"
              )
              for text,entry in entries.items():
                  p=ROOT/str(entry["url"]).split("?",1)[0].lstrip("/")
                  if not p.exists() or p.stat().st_size<1200:
                      raise SystemExit("Audio fehlt: "+str(p))
              return manifest

          build_scope=os.environ.get("VOICE_BUILD_SCOPE","full").strip().lower()
          if build_scope not in ("full","quiz","dua","pause"):
              raise SystemExit("Ungültiger VOICE_BUILD_SCOPE: "+build_scope)
          print("VOICE_BUILD_SCOPE="+build_scope)
          if build_scope=="pause":
              print("VOICE_BUILD_SCOPE=pause · Audioerzeugung absichtlich gestoppt; Runtime bleibt bereit.")
              raise SystemExit(0)

          if build_scope!="dua":
              quiz=json.loads(QUIZ.read_text(encoding="utf-8"))
              quiz_items=[
                  q for q in (quiz.get("items") or [])
                  if isinstance(q,dict)
                  and q.get("status")=="published"
                  and q.get("reviewStatus")=="approved"
                  and q.get("verification")=="approved"
              ]
              if len(quiz_items)!=900:
                  raise SystemExit(f"Erwartet 900 freigegebene Kids-Fragen, gefunden: {len(quiz_items)}")
              prompts=[quiz_prompt(q) for q in quiz_items]
              if len(set(prompts))!=900:
                  raise SystemExit("Quiz-Sprachprompts sind nicht eindeutig.")
              quiz_texts=[]
              quiz_profiles={}
              age_profile={
                  "4-6":"quiz_4_6",
                  "7-8":"quiz_7_8",
                  "9-10":"quiz_9_10"
              }
              for q in quiz_items:
                  prompt=quiz_prompt(q)
                  quiz_texts.append(prompt)
                  quiz_profiles[prompt]=age_profile.get(str(q.get("ageBand") or ""),"quiz_9_10")
                  for feedback in (norm(q.get("success")),norm(q.get("retry"))):
                      if feedback:
                          quiz_texts.append(feedback)
                          quiz_profiles[feedback]="quiz_feedback"
              final_feedback="Sehr gut. Du hast das Quiz geschafft."
              quiz_texts.append(final_feedback)
              quiz_profiles[final_feedback]="quiz_feedback"

              quiz_manifest=build_pack(
                  texts=quiz_texts,
                  manifest_path=QUIZ_MANIFEST,
                  asset_dir=QUIZ_ASSETS,
                  profile="quiz_feedback",
                  pack_id="KIDS_QUIZ_OWNER_VOICE_V4",
                  counts={
                      "quizQuestions":len(quiz_items),
                      "questionPrompts":len(set(prompts)),
                      "age4to6":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="4-6"),
                      "age7to8":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="7-8"),
                      "age9to10":sum(1 for q in quiz_items if str(q.get("ageBand") or "")=="9-10")
                  },
                  model_id=ELEVEN_MODEL,
                  require_model_match=True,
                  profiles_by_text=quiz_profiles
              )
              if quiz_manifest["counts"]["quizQuestions"]!=900 or quiz_manifest["counts"]["questionPrompts"]!=900:
                  raise SystemExit("900er Quiz-Voice-Pack unvollständig.")
          else:
              quiz_manifest=load_manifest(QUIZ_MANIFEST)
              print("VOICE_BUILD_SCOPE=dua · Quiz-Pack bleibt unverändert.")

          if build_scope=="quiz":
              print("VOICE_BUILD_SCOPE=quiz · Duʿāʾ-Packs bleiben unverändert.")
              raise SystemExit(0)

          dua=json.loads(DUA.read_text(encoding="utf-8"))
          dua_items=[
              d for d in (dua.get("items") or [])
              if isinstance(d,dict) and d.get("verification")=="verified"
          ]
          if not dua_items:
              raise SystemExit("Keine freigegebenen Kids-Duʿāʾ gefunden.")
          dua_texts=[norm(d.get("audioGermanText") or (str(d.get("childPrompt") or "")+" "+str(d.get("meaning") or ""))) for d in dua_items]
          dua_texts.extend([
              "Richtig. Sehr gut.",
              "Noch nicht. Hör die Erklärung noch einmal."
          ])
          dua_manifest=build_pack(
              texts=dua_texts,
              manifest_path=DUA_MANIFEST,
              asset_dir=DUA_ASSETS,
              profile="kids_story",
              pack_id="KIDS_DUA_OWNER_VOICE_V2",
              counts={"duaItems":len(dua_items),"explanationPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          if dua_manifest["counts"]["explanationPrompts"]!=len(dua_items):
              raise SystemExit("Duʿāʾ-Voice-Pack unvollständig.")

          # Entire Duʿāʾ Arabic layer: Serhat Abu Malik – Master, ElevenLabs V4,
          # explicit Fuṣḥā language hint. This includes Qurʾānic Duʿāʾ because the
          # Kids Duʿāʾ learner deliberately teaches the exact displayed wording with
          # the same owner voice. It is educational speech, not a recitation substitute.
          def arabic_text(d):
              return norm(d.get("audioArabicText") or d.get("arabic") or "")

          dua_arabic_items=[d for d in dua_items if arabic_text(d)]
          if len(dua_arabic_items)!=len(dua_items):
              raise SystemExit("Mindestens ein freigegebenes Duʿāʾ hat keinen arabischen Mastertext.")

          arabic_phrases=[arabic_text(d) for d in dua_arabic_items]
          dua_ar_manifest=build_pack(
              texts=arabic_phrases,
              manifest_path=DUA_AR_MANIFEST,
              asset_dir=DUA_AR_ASSETS,
              profile="dua_arabic",
              pack_id="KIDS_DUA_ARABIC_SERHAT_MASTER_V4",
              counts={"duaItems":len(dua_items),"arabicPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_ar_manifest.update({
              "schemaVersion":4,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "quranArabicSyntheticAllowed":True,
              "educationMode":"owner-voice-fusha-learning",
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_AR_MANIFEST.write_text(json.dumps(dua_ar_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Dedicated slow phrase pack. Never slow a normal clip in the browser:
          # the model renders the phrase slowly and naturally at generation time.
          dua_ar_slow_manifest=build_pack(
              texts=arabic_phrases,
              manifest_path=DUA_AR_SLOW_MANIFEST,
              asset_dir=DUA_AR_SLOW_ASSETS,
              profile="dua_arabic_slow",
              pack_id="KIDS_DUA_ARABIC_SLOW_SERHAT_MASTER_V4",
              counts={"duaItems":len(dua_items),"slowArabicPrompts":len(dua_items)},
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_ar_slow_manifest.update({
              "schemaVersion":1,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "playbackMode":"dedicated-natural-slow-render",
              "browserTimeStretchAllowed":False,
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_AR_SLOW_MANIFEST.write_text(json.dumps(dua_ar_slow_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          AR_PUNCT="،؛؟,.!…«»\"'()[]{}"
          def arabic_tokens(text):
              out=[]
              for raw in norm(text).split():
                  token=raw.strip(AR_PUNCT)
                  # A standalone Qurʾānic pause/ornament mark is not a spoken word.
                  if token and any("\u0621"<=ch<="\u064a" for ch in token):
                      out.append(token)
              return out

          # Standalone word renders: clicking a word never seeks into a sentence.
          # Each exact orthographic token is generated as its own Fuṣḥā utterance.
          word_texts=[]
          seen_words=set()
          for d in dua_items:
              for word in arabic_tokens(arabic_text(d)):
                  if word not in seen_words:
                      seen_words.add(word)
                      word_texts.append(word)

          dua_word_manifest=build_pack(
              texts=word_texts,
              manifest_path=DUA_WORD_MANIFEST,
              asset_dir=DUA_WORD_ASSETS,
              profile="dua_word",
              pack_id="KIDS_DUA_WORD_SERHAT_MASTER_V4",
              counts={
                  "duaItems":len(dua_items),
                  "uniqueArabicWords":len(word_texts),
                  "wordPositions":sum(len(arabic_tokens(arabic_text(d))) for d in dua_items)
              },
              model_id=ELEVEN_DUA_MODEL,
              require_model_match=True
          )
          dua_word_manifest.update({
              "schemaVersion":1,
              "language":"ar",
              "arabicRegister":"Fuṣḥā / Classical-Arabic-aware",
              "scope":"all-verified-dua",
              "clipMode":"isolated-word",
              "sourceRule":"exact-displayed-arabic-token",
              "browserSentenceSlicingAllowed":False,
              "speaker":"Serhat Abu Malik – Master"
          })
          DUA_WORD_MANIFEST.write_text(json.dumps(dua_word_manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Build learning segments for every Duʿāʾ. Existing hand-reviewed segment
          # transliterations stay untouched. New items always use exact Arabic token
          # boundaries; the full transliteration remains visible in the learner.
          for d in dua_items:
              words=arabic_tokens(arabic_text(d))
              old_segments=d.get("learningSegments") if isinstance(d.get("learningSegments"),list) else []
              old_by_ar={}
              for seg in old_segments:
                  if isinstance(seg,dict) and norm(seg.get("arabic")):
                      old_by_ar.setdefault(norm(seg.get("arabic")),[]).append(seg)
              rebuilt=[]
              used={}
              for idx,word in enumerate(words):
                  choices=old_by_ar.get(word) or []
                  pos=used.get(word,0)
                  old_seg=choices[pos] if pos<len(choices) else {}
                  used[word]=pos+1
                  rebuilt.append({
                      "index":idx,
                      "arabic":word,
                      "transliteration":norm(old_seg.get("transliteration") or ""),
                      "audioKey":word
                  })
              d["learningSegments"]=rebuilt
              d["audioStatus"]="ready"
              d["smartLearningReady"]=True
              d["audioModelId"]="eleven_v4"
              d["audioVoiceProfileId"]="serhat-owner-voice-2026"
              d["arabicVoiceProfileId"]="serhat-owner-voice-2026"
              d["arabicVoiceSpeaker"]="Serhat Abu Malik – Master"
              d["arabicRegister"]="Fuṣḥā"
              d["wordAudioMode"]="isolated-owner-voice-v4"
              d["slowAudioMode"]="dedicated-owner-voice-v4"
              d["timingSlicesDeprecated"]=True

          # Persist the product rule as data, not only as generator behavior.
          # The whole Duʿāʾ area uses the owner's Master voice for Arabic/Fuṣḥā
          # learning speech and German explanations. Qurʾānic Duʿāʾ here are
          # educational pronunciation references, not a replacement for tilāwah.
          policy=dua.setdefault("policy",{})
          policy.update({
              "quranAudio":"Im Duʿāʾ-Lernbereich spricht Serhat Abu Malik – Master den exakt geprüften arabischen Wortlaut in Fuṣḥā mit ElevenLabs V4. Dies ist eine Lernreferenz und kein Ersatz für Qurʾān-Rezitation.",
              "sunnahArabicAudio":"Arabische Sunnah-Duʿāʾ verwenden Serhat Abu Malik – Master mit ElevenLabs V4 und expliziter Fuṣḥā-Ausrichtung.",
              "audioLearning":"Jedes verifizierte Duʿāʾ hat getrennte Master-Audios für Deutsch, normales Arabisch, langsames Arabisch und isolierte arabische Wörter.",
              "smartLearning":"Wort-Taps verwenden ausschließlich eigene isolierte V4-Wortclips. Satz-Zeitmarken und Audio-Slices sind für Wortwiedergabe verboten.",
              "slowPracticeRate":"dedicated-v4-slow-render",
              "arabicPronunciation":"Serhat Abu Malik – Master · ElevenLabs V4 · Fuṣḥā / hocharabische Lernreferenz · exakter geprüfter Wortlaut.",
              "audioExpansionPolicy":"Neue verifizierte Duʿāʾ werden im selben Serhat-Master-V4-Pfad für Erklärung, Volltext, Slow-Render und isolierte Wörter produziert."
          })
          counts=dua.setdefault("counts",{})
          counts["total"]=len(dua_items)
          counts["smartLearningReady"]=len(dua_items)
          counts["ownerVoiceGermanReady"]=len(dua_items)
          counts["ownerVoiceArabicReady"]=len(dua_items)
          counts["ownerVoiceArabicSlowReady"]=len(dua_items)
          counts["isolatedWordLearningReady"]=len(dua_items)

          dua["audioPolicy"]={
              "voiceProfileId":"serhat-owner-voice-2026",
              "speaker":"Serhat Abu Malik – Master",
              "modelId":"eleven_v4",
              "arabicRegister":"Fuṣḥā",
              "germanExplanation":"owner-voice",
              "arabicFull":"owner-voice",
              "arabicSlow":"owner-voice-dedicated-slow-render",
              "arabicWord":"owner-voice-isolated-word-render",
              "browserTimeStretch":False,
              "sentenceSliceWordPlayback":False,
              "quranDuaLearningVoice":"owner-voice-fusha"
          }
          DUA.write_text(json.dumps(dua,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          print("Quiz voice pack:",quiz_manifest["counts"])
          print("Dua voice pack:",dua_manifest["counts"])
          print("Dua Arabic owner-voice pack:",dua_ar_manifest["counts"])
          print("Dua Arabic slow pack:",dua_ar_slow_manifest["counts"])
          print("Dua isolated word pack:",dua_word_manifest["counts"])
          print("Synthesis revision:",SYNTHESIS_REVISION)
          PY

      - name: Commit complete Kids owner voice packs
        if: env.DAR_VOICE_PROVIDER_AVAILABLE == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             kids/data/quiz-audio.json             kids/data/dua-audio.json             kids/data/dua-arabic-audio.json             kids/data/dua-arabic-slow-audio.json             kids/data/dua-word-audio.json             kids/data/dua-kids.json             kids/assets/kids-quiz-audio             kids/assets/kids-dua-audio             kids/assets/kids-dua-arabic-audio             kids/assets/kids-dua-arabic-slow-audio             kids/assets/kids-dua-word-audio
          if git diff --cached --quiet; then
            echo "Kids owner voice packs already current."
            exit 0
          fi
          git commit -m "Kids: publish complete Serhat V4 Dua voice packs"
          git pull --rebase origin main
          git push origin HEAD:main
