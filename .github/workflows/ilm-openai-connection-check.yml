name: Majlis OpenAI Connection Check

on:
  push:
    paths:
      - .github/workflows/ilm-openai-connection-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one open-question live probe against Test Worker
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 95 -X POST \
            'https://dar-al-tawhid-test.sero91ak.workers.dev/test/api/ilm/research' \
            -H 'Origin: https://dar-al-tawhid.de' \
            -H 'Content-Type: application/json' \
            --data '{"question":"Welche Überlieferung berichtet über Umar ibn al-Khattab und seine Entscheidung, das Pestgebiet bei Sargh nicht zu betreten?","mode":"short"}' \
            -o "$RUNNER_TEMP/ilm-connection-response.json" -w '%{http_code}')"
          export ILM_CONNECTION_CODE="$code"
          node - <<'NODE'
          const fs=require("node:fs");
          const p=process.env.RUNNER_TEMP+"/ilm-connection-response.json";
          const raw=fs.readFileSync(p,"utf8");
          let data;
          try{data=JSON.parse(raw);}catch(_){console.log(JSON.stringify({httpCode:process.env.ILM_CONNECTION_CODE,error:"non_json_response"}));process.exit(1);}
          const sources=Array.isArray(data.sources)?data.sources:[];
          const result={
            httpCode:process.env.ILM_CONNECTION_CODE,
            ok:data.ok===true,
            provider:data.provider||null,
            sourceCount:sources.length,
            sourceHosts:sources.map(s=>{try{return new URL(s.url||"").hostname;}catch(_){return "invalid";}}),
            citationFound:typeof data.answer==="string" && /\[\d+\]/.test(data.answer),
            error:data.error||null,
            configured:data.openaiConfigured??null,
            providers:data.providers||null,
            epistemicStatus:data.epistemicStatus||null
          };
          console.log("ILM_LIVE_PROBE "+JSON.stringify(result));
          if(!result.ok)process.exit(2);
          if(!result.sourceCount||!result.citationFound)process.exit(3);
          NODE
