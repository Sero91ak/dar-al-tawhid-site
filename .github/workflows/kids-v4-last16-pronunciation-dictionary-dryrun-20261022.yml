name: KIDS V4 Last 15 New + 1 Unconfirmed German Fusha Dictionary Preflight (no TTS)
on:
  push:
    branches: [review/kids-v4-nine-prepaid-artifact-replay-20261022]
    paths:
      - kids/tools/validate_quiz_v4_remaining16_dictionary_preflight.py
      - kids/review-only/quiz-v4-16-new-text-dictionary-preflight-20261022.json
permissions:
  contents: read
jobs:
  validate-without-spending:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-v4-nine-prepaid-artifact-replay-20261022
          fetch-depth: 1
      - name: Validate actual 10099-rule dictionary, 15 new strings and 1 unreconciled paid request, no network
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/validate_quiz_v4_remaining16_dictionary_preflight.py
          python3 kids/tools/validate_quiz_v4_remaining16_dictionary_preflight.py
