name: KIDS V4 Import Six Existing Voice Originals (zero synthesis)
on:
  push:
    branches:
      - review/kids-v4-audio-safe-import-20261022
    paths:
      - kids/review-only/quiz-v4-five-existing-originals-transfer-20261022.json
permissions:
  contents: write
concurrency:
  group: kids-v4-five-existing-originals-20261022
  cancel-in-progress: false
jobs:
  import-six:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-v4-audio-safe-import-20261022
          fetch-depth: 1
      - name: Prepare actual MP3 verification
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o DPkg::Lock::Timeout=20 install -y ffmpeg
          fi
      - name: Import six already-paid/saved provider originals (no new synthesis)
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/import_quiz_v4_five_existing_provider_originals_20261022.py
          python3 kids/tools/import_quiz_v4_five_existing_provider_originals_20261022.py
      - name: Reassemble older-age quiz and update factual completion status
        run: |
          set -euo pipefail
          python3 kids/tools/quiz_v4_age7to10_offline_join.py
          python3 kids/tools/report_quiz_v4_450_progress.py
          python3 kids/tools/stage_quiz_v4_existing_mp3_import.py
          python3 kids/tools/quiz_v4_selected450_release_gate.py --ignore-flag
      - name: Save only QA-checked genuine MP3s to isolated review branch
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-original-import
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm kids/review-only/quiz-v4-five-existing-originals-transfer-20261022.json
          git add kids/assets/kids-quiz-audio/v4-curated450-review/
          git add kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/data/quiz-v4-450-original-clip-registry.json
          git add kids/data/quiz-v4-connected-flow-originals-ledger.json
          git add kids/data/quiz-v4-450-production-status.json
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/review-only/quiz-v4-five-originals-import-results-20261022.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          git commit -m "audio(kids review): preserve six more already generated V4 originals"
          git push origin HEAD:review/kids-v4-audio-safe-import-20261022
      - name: Save recovery artifact independent of Git push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-six-existing-originals-audio-backup
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-curated450-review/
            kids/review-only/quiz-v4-five-originals-import-results-20261022.json
