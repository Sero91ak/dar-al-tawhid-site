name: DAR TEST nine-language browser acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex/i18n-9-integration
      - codex/i18n-9-integration-20261023
      - codex/native-localization-9-languages-full-20261022

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAR_TEST_PASSWORD: ${{ secrets.DAR_TEST_PASSWORD }}
      DAR_TEST_BASE: http://127.0.0.1:8765
      DAR_TEST_OUTPUT: ${{ github.workspace }}/QA/i18n-browser-${{ github.run_id }}
    steps:
      - name: Checkout integration revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check --no-input selenium

      - name: Start DAR TEST local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/dar-test-nine-http.log 2>&1 &
          echo $! > /tmp/dar-test-nine-http.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/test/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dar-test-nine-http.log
          exit 1

      - name: Run 135 real browser checks
        id: browser
        continue-on-error: true
        run: |
          set +e
          python test/i18n/test-nine-browser-acceptance.py 2>&1 | tee QA/i18n-browser-${GITHUB_RUN_ID}/browser-console.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Verify browser acceptance cannot pass when blocked
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path(f"QA/i18n-browser-${{ github.run_id }}/results.json")
          if not report.exists():
              raise SystemExit("results.json was not produced")
          data = json.loads(report.read_text())
          if data.get("blocked", 0) or data.get("fail", 0):
              raise SystemExit(f"browser acceptance not green: {data.get('pass', 0)} PASS, {data.get('fail', 0)} FAIL, {data.get('blocked', 0)} BLOCKED")
          if data.get("checks") != 135 or data.get("pass") != 135:
              raise SystemExit(f"expected 135 PASS checks, observed {data}")
          print("135 real browser checks passed")
          PY

      - name: Capture server log
        if: always()
        run: |
          cp /tmp/dar-test-nine-http.log QA/i18n-browser-${GITHUB_RUN_ID}/server.log 2>/dev/null || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-test-nine-language-browser-${{ github.run_id }}
          path: QA/i18n-browser-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14

      - name: Stop DAR TEST local server
        if: always()
        run: |
          if test -f /tmp/dar-test-nine-http.pid; then
            kill "$(cat /tmp/dar-test-nine-http.pid)" 2>/dev/null || true
          fi
