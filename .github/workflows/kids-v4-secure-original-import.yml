name: KIDS V4 Securely Recover Prepaid Flow Originals (no synthesis)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/data/v4-prepaid-envelope-review/sealed-downloads.b64'

permissions:
  contents: write

concurrency:
  group: kids-v4-sealed-mp3-original-import
  cancel-in-progress: false

jobs:
  recover-paid-original-mp3:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Only decrypt signed URLs inside the GitHub runner, not into logs
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          base=kids/data/v4-prepaid-envelope-review
          test -n "${ELEVENLABS_API_KEY:-}"
          test -s "$base/sealed-downloads.b64"
          umask 077
          mkdir -p "$RUNNER_TEMP/kids-v4-prepaid-inbox"
          echo "inbox=$RUNNER_TEMP/kids-v4-prepaid-inbox" >> "$GITHUB_OUTPUT"
          openssl pkcs8 -in "$base/private-key-encrypted.pem" -passin env:ELEVENLABS_API_KEY -out "$RUNNER_TEMP/private.pem"
          base64 -d "$base/sealed-downloads.b64" > "$RUNNER_TEMP/sealed.der"
          openssl cms -decrypt -inform DER -in "$RUNNER_TEMP/sealed.der" \
            -inkey "$RUNNER_TEMP/private.pem" -recip "$base/recipient-cert.pem" \
            -out "$RUNNER_TEMP/generation-downloads.json"
          chmod 600 "$RUNNER_TEMP/generation-downloads.json"
          echo "Decrypted manifest privately, no URL values logged."
      - name: Download only genuine already-paid old V4 originals
        env:
          MP3_INBOX: ${{ steps.decrypt.outputs.inbox }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,urllib.parse,urllib.request
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          inbox=pathlib.Path(os.environ["MP3_INBOX"])
          records=json.loads((base/"generation-downloads.json").read_text())
          assert 1 <= len(records) <= 56 and isinstance(records,list)
          ledger=json.load(open("kids/data/quiz-v4-batch-001-020-review.json"))
          existing={x["generationId"] for q in ledger["items"] for x in q["recordings"]}
          imported=0
          for row in records:
              gid=row["generationId"]
              url=row["contentUrl"]
              if gid not in existing or not re.fullmatch(r"[A-Za-z0-9]{20}",gid):
                  raise RuntimeError("Non-ledger original ID blocked")
              u=urllib.parse.urlsplit(url)
              if u.scheme!="https" or u.hostname!="storage.googleapis.com" or not u.path.startswith("/xi-backend/database/workspace/"):
                  raise RuntimeError("Unexpected original audio server")
              if "/"+gid+"/content.mp3" not in u.path or "X-Goog-Signature" not in url:
                  raise RuntimeError("Original audio source mismatch")
              dest=inbox/(gid+".mp3")
              if dest.exists():continue
              req=urllib.request.Request(url,headers={"User-Agent":"TAWHID-KIDS-ORIGINAL-EXPORT/1.0"})
              with urllib.request.urlopen(req,timeout=50) as resp:
                  if resp.status!=200:raise RuntimeError("Original export HTTPS response not OK")
                  with dest.open("wb") as out:
                      total=0
                      while True:
                          chunk=resp.read(256*1024)
                          if not chunk:break
                          total+=len(chunk)
                          if total>10*1024*1024:raise RuntimeError("Unexpectedly large single quiz original")
                          out.write(chunk)
              if dest.stat().st_size<2000:raise RuntimeError("Downloaded original too small")
              imported+=1
          print("KIDS_ORIGINAL_PREPAID_DOWNLOADED",imported,"files; new synthesis credits 0")
          PY
      - name: Verify and import old originals then reassemble first150 without credits
        run: |
          set -euo pipefail
          python3 kids/tools/import_quiz_v4_prepaid_flow_originals.py --directory "$RUNNER_TEMP/kids-v4-prepaid-inbox"
          python3 kids/tools/quiz_v4_first150_offline_join.py
          python3 kids/tools/qa_quiz_v4_saved_mp3.py
          python3 kids/tools/qa_quiz_v4_first150_composed.py
          python3 kids/tools/quiz_v4_selected450_release_gate.py
      - name: Save genuine MP3s only to review and delete encrypted expiring links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dar-kids-review-recovery-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/assets/kids-quiz-audio/v4-paid-flow-original-review/
          git add kids/assets/kids-quiz-audio/v4-first150-composed-review/
          git add kids/data/quiz-v4-450-original-clip-registry.json
          git add kids/data/quiz-v4-paid-flow-import-status.json
          git add kids/data/quiz-v4-first150-composed-preview.json
          git add kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-450-saved-mp3-technical-qa.json
          git add kids/data/quiz-v4-first150-composed-technical-qa.json
          git rm -f --ignore-unmatch kids/data/v4-prepaid-envelope-review/sealed-downloads.b64
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'audio(kids): recovered previously paid authentic V4 Flow MP3 original; no synthesis; review only'
          for attempt in 1 2 3;do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014;then exit 0;fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            git rebase FETCH_HEAD
          done
          exit 1
      - name: Destroy local decrypted signed URLs and private key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kids-v4-prepaid-inbox"
          rm -f "$RUNNER_TEMP/generation-downloads.json" "$RUNNER_TEMP/private.pem" "$RUNNER_TEMP/sealed.der"
