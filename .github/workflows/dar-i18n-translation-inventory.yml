name: DAR Adult Multilingual Translation Inventory

on:
  push:
    branches:
      - main
      - feature/adult-multilingual-core-20261021
    paths:
      - 'content/posts/**'
      - 'q/_registry/shortlinks.json'
      - 'q/**/index.html'
      - 'test/data/hadith/search-index.json'
      - 'apple-tv/hadith/**'
      - 'content/duas/duas.json'
      - 'data/quiz-questions.json'
      - 'data/learning-content.json'
      - 'content/learning/**'
      - 'desktop-preview/i18n-core-v1/**'
      - 'content/i18n/adult-posts/**'
      - 'scripts/verify-adult-post-language-manifests.cjs'
      - '.github/workflows/dar-i18n-translation-inventory.yml'
  pull_request:
    paths:
      - 'content/posts/**'
      - 'q/_registry/shortlinks.json'
      - 'content/i18n/adult-posts/**'
      - 'desktop-preview/i18n-core-v1/**'
      - 'scripts/verify-adult-post-language-manifests.cjs'
      - '.github/workflows/dar-i18n-translation-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dar-adult-i18n-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Read-only multilingual source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate locale catalogs, terminology anchors and reviewer gates
        run: |
          node desktop-preview/i18n-core-v1/validate-core.cjs
          node desktop-preview/i18n-core-v1/test-glossary-hints.cjs
      - name: Verify canonical adult locale IDs, source hashes and approval gates
        run: node scripts/verify-adult-post-language-manifests.cjs
      - name: Verify automatic revision detection with isolated fixtures
        run: node desktop-preview/i18n-core-v1/test-translation-worklist.cjs
      - name: Offline nine-language push security and content checks (no sending)
        run: |
          node desktop-preview/i18n-core-v1/test-push-i18n-resolver.cjs
          node desktop-preview/i18n-core-v1/test-app-locale-push-adapter.cjs
          node desktop-preview/i18n-core-v1/test-secure-app-locale-endpoint.cjs
          node desktop-preview/i18n-core-v1/test-push-copy-nine-languages.cjs
          node desktop-preview/i18n-core-v1/test-push-production-emoji-parity.cjs
          node desktop-preview/i18n-core-v1/test-safe-onesignal-app-locale.cjs
          node desktop-preview/i18n-core-v1/test-push-test-preview.cjs
          node desktop-preview/i18n-core-v1/audit-push-i18n.cjs
          node desktop-preview/i18n-core-v1/dry-run-push-nine-languages.cjs
      - name: Generate review-only worklist
        shell: bash
        run: |
          node desktop-preview/i18n-core-v1/translation-worklist.cjs --out "$RUNNER_TEMP/dar-translation-worklist.json" > "$RUNNER_TEMP/dar-translation-summary.json"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=x.summary;fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## DĀR Mehrsprachigkeits-Warteschlange\n\n"+JSON.stringify(s,null,2)+"\n\nOffene Aufgaben sind **keine geprüften Übersetzungen**. Keine Änderungen an der Live-Website oder den Apps.\n")' "$RUNNER_TEMP/dar-translation-worklist.json"
      - name: Validate zero-cost language draft generator
        run: node desktop-preview/i18n-core-v1/generate-translation-drafts.cjs --inventory "$RUNNER_TEMP/dar-translation-worklist.json" --max-requests 1 --locale ar
      - name: Compile reviewed language packs (no drafts)
        shell: bash
        run: |
          node desktop-preview/i18n-core-v1/build-language-packs.cjs --inventory "$RUNNER_TEMP/dar-translation-worklist.json" --output "$RUNNER_TEMP/dar-adult-locale-packs"
      - name: Compile one canonical approved Turkish endpoint, reusable by Web/PWA/iOS
        shell: bash
        run: |
          node desktop-preview/i18n-core-v1/export-reviewed-content.cjs \
            --inventory "$RUNNER_TEMP/dar-translation-worklist.json" \
            --out "$RUNNER_TEMP/dar-reviewed-publish" --locale tr --write
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const base=path.join(process.env.RUNNER_TEMP,'dar-reviewed-publish/tr');
          const m=JSON.parse(fs.readFileSync(path.join(base,'manifest.json'),'utf8'));
          if(m.locale!=='tr'||m.originalLocale!=='de'||m.onlyApproved!==true||
             m.scope!=='adult-only'||m.publishedCount!==Object.keys(m.records).length)
             throw Error('Unreviewed material must not enter published bundles');
          for(const record of Object.values(m.records)){
            const file=path.join(process.env.RUNNER_TEMP,'dar-reviewed-publish',record.path);
            const v=JSON.parse(fs.readFileSync(file,'utf8'));
            if(v.status!=='approved'||v.sourceHash!==record.sourceHash)
              throw Error('An unapproved or stale translation entered pack');
          }
          console.log('PASS reviewed Turkish content export:',m.publishedCount,'canonical records');
          NODE
      - name: Upload approved-language preview packs
        uses: actions/upload-artifact@v4
        with:
          name: dar-adult-reviewed-locales
          path: ${{ runner.temp }}/dar-adult-locale-packs/
          retention-days: 7
          if-no-files-found: error
      - name: Store immutable worklist as review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: dar-adult-translation-worklist
          path: ${{ runner.temp }}/dar-translation-worklist.json
          retention-days: 7
          if-no-files-found: error
