name: Deploy Admin Publisher Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/quiz-stats-admin.js
      - cloudflare/worker.js
      - cloudflare/wrangler.toml
      - cloudflare/prayer-push-*.js
      - cloudflare/prayer-status-store.js
      - cloudflare/daily-push-*.js
      - cloudflare/jummah-push-*.js
      - cloudflare/feed-backgrounds-*.js
      - assets/prayer-push-tags.js
      - scripts/prayer-push-integrity-guard.js
      - scripts/prayer-push-loop-guard.js
      - content/admin/prayer-push-scheduler-lock.json
      - scripts/send-prayer-push.js
      - .github/workflows/prayer-push.yml
      - .github/workflows/setup-feed-api-keys.yml
      - cloudflare/onesignal-delivery.js
      - cloudflare/post-push-admin.js
      - cloudflare/kurzlink-admin.js
      - cloudflare/zakat-prices.js
      - cloudflare/zakat-admin.js
      - cloudflare/library-admin.js
      - cloudflare/library-push-admin.js
      - cloudflare/video-studio/**
      - .github/workflows/deploy-admin-publisher.yml
      - .github/workflows/feed-bg-auto-sync.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate worker modules directly from source
        run: |
          node --check prayer-push-copy.js
          node --check prayer-push-scheduler.js
          node --check prayer-push-admin.js
          node --check prayer-status-store.js
          node --check daily-push-scheduler.js
          node --check daily-push-admin.js
          node --check library-push-admin.js
          node --check worker.js

      - name: Prayer push integrity guard
        run: node ../scripts/prayer-push-integrity-guard.js

      - name: Prayer push loop guard
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before }}
        run: node ../scripts/prayer-push-loop-guard.js

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Push system guard
        run: node ../scripts/push-system-guard.js

      - name: Publish isolation guard
        run: node ../scripts/publish-isolation-guard.js

      - name: Post markdown guard
        run: node ../scripts/post-markdown-guard.js

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -f wrangler.toml
          grep -q '^name = "dar-admin-publisher"$' wrangler.toml
          wrangler deploy --name dar-admin-publisher

      - name: Sync core worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          DAR_GITHUB_TOKEN: ${{ secrets.DAR_GITHUB_TOKEN }}
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN }}
          ONESIGNAL_API_KEY_NEW: ${{ secrets.ONESIGNAL_API_KEY_NEW }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_TOPICS_CHAT_ID: ${{ secrets.TELEGRAM_TOPICS_CHAT_ID }}
          TELEGRAM_FORUM_CHAT_ID: ${{ secrets.TELEGRAM_FORUM_CHAT_ID }}
        run: |
          put_secret() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              printf '%s' "$val" | wrangler secret put "$name" --name dar-admin-publisher
              echo "Secret gesetzt: $name"
            else
              echo "Secret übersprungen (leer): $name"
              echo "$name" >> "$RUNNER_TEMP/missing-core-secrets.txt"
            fi
          }
          : > "$RUNNER_TEMP/missing-core-secrets.txt"
          # GitHub token aliases → Worker secret GITHUB_TOKEN
          GH_TOK="${WORKER_GITHUB_TOKEN:-${DAR_GITHUB_TOKEN:-${REPO_GITHUB_TOKEN:-}}}"
          put_secret GITHUB_TOKEN "$GH_TOK"
          put_secret ADMIN_PUBLISH_SECRET "$ADMIN_PUBLISH_SECRET"
          put_secret ONESIGNAL_API_KEY_NEW "${ONESIGNAL_API_KEY_NEW:-$ONESIGNAL_API_KEY}"
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_CHANNEL_ID "$TELEGRAM_CHANNEL_ID"
          put_secret TELEGRAM_CHANNEL_USERNAME "$TELEGRAM_CHANNEL_USERNAME"
          put_secret TELEGRAM_TOPICS_CHAT_ID "${TELEGRAM_TOPICS_CHAT_ID:-$TELEGRAM_FORUM_CHAT_ID}"
          echo "::notice::Fehlende GitHub-Actions-Secrets (Werte manuell nachtragen):"
          if [ -s "$RUNNER_TEMP/missing-core-secrets.txt" ]; then
            sort -u "$RUNNER_TEMP/missing-core-secrets.txt" | while read -r n; do
              echo "::warning::GitHub Secret fehlt/leer: $n – siehe cloudflare/TELEGRAM_STATUS_2026-08-16.md"
            done
          else
            echo "Alle Kern-Secrets aus GitHub Actions vorhanden."
          fi

      - name: Change scope lock guard (nur freigeschaltete Bereiche)
        env:
          INTEGRITY_BASE_REF: ${{ github.event.before || '' }}
        run: node ../scripts/change-scope-lock-guard.js

      - name: Verify worker and durable prayer status binding
        run: |
          sleep 8
          for attempt in 1 2 3 4 5 6 7 8; do
            HEALTH="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/health" || true)"
            echo "Versuch ${attempt}: $HEALTH"
            if printf '%s' "$HEALTH" | grep -q '"ok":true' \
              && printf '%s' "$HEALTH" | grep -q '"service":"dar-admin-publisher"' \
              && printf '%s' "$HEALTH" | grep -q '"prayerStatusStore":true' \
              && printf '%s' "$HEALTH" | grep -q '"prayerScheduler":"cloudflare-worker-cron-v3"' \
              && printf '%s' "$HEALTH" | grep -q '"libraryApi":"v3-split-push"'; then
              if printf '%s' "$HEALTH" | grep -q '"hasTelegramToken":true'; then
                echo "Telegram-Token aktiv"
              else
                echo "::warning::hasTelegramToken=false – TELEGRAM_BOT_TOKEN in GitHub Actions Secrets setzen (Anleitung: cloudflare/TELEGRAM_STATUS_2026-08-16.md)"
              fi
              if printf '%s' "$HEALTH" | grep -q '"hasAdminSecret":true'; then
                echo "Admin-Secret aktiv"
              else
                echo "::warning::hasAdminSecret=false – ADMIN_PUBLISH_SECRET in GitHub Actions Secrets setzen"
              fi
              exit 0
            fi
            sleep 12
          done
          echo "::error::Worker-Binding nach Deploy nicht aktiv ( /health nicht ok )"
          exit 1

      - name: Delayed health recheck (Overwrite-Schutz)
        run: |
          sleep 45
          HEALTH="$(curl -fsS "https://dar-admin-publisher.sero91ak.workers.dev/health" || true)"
          echo "Delayed: $HEALTH"
          if ! printf '%s' "$HEALTH" | grep -q '"ok":true' \
            || ! printf '%s' "$HEALTH" | grep -q '"service":"dar-admin-publisher"'; then
            echo "::error::Admin-Worker /health nach Deploy wieder weg (möglicher Overwrite). Erneut Deploy Admin Publisher Worker ausführen."
            exit 1
          fi
          echo "Delayed health OK"

      - name: Flush stuck approved library pushes
        continue-on-error: true
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::warning::ADMIN_PUBLISH_SECRET fehlt – Library-Push-Flush übersprungen"
            exit 0
          fi
          node <<'NODE'
          const fs = require("fs");
          const secret = process.env.ADMIN_PUBLISH_SECRET;
          const registry = JSON.parse(fs.readFileSync("../content/admin/pending-pushes.json", "utf8"));
          const pending = Object.values(registry.pushes || {}).filter(
            (item) => item?.kind === "library" && item?.status === "pending" && item?.pushApproved === true
          );
          if (!pending.length) {
            console.log("Keine freigegebenen Bibliothek-Pending-Pushes");
            process.exit(0);
          }
          (async () => {
            for (const item of pending) {
              const body = {
                publicationId: item.publicationId,
                slug: item.slug,
                publicationTitle: item.publicationTitle,
                pdfUrl: item.pdfUrl,
                publishedAt: item.publishedAt,
                forceResend: true
              };
              const res = await fetch("https://dar-admin-publisher.sero91ak.workers.dev/api/admin/push/library/retry", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${secret}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
              });
              const text = await res.text();
              console.log(`${item.publicationId}: ${res.status} ${text.slice(0, 500)}`);
              if (!res.ok) process.exitCode = 1;
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Repair prayer registrations disabled by daily push
        continue-on-error: true
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::warning::ADMIN_PUBLISH_SECRET fehlt – Gebets-Push-Reparatur übersprungen (Cron repariert automatisch)"
            exit 0
          fi
          RESULT="$(curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/prayer/repair-registrations" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$RESULT"

      - name: Refresh prayer push live status immediately
        continue-on-error: true
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::warning::ADMIN_PUBLISH_SECRET fehlt – Livestatus-Prüfung übersprungen (Cron aktualisiert automatisch)"
            exit 0
          fi

          RESULT="$(curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/prayer/run" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$RESULT"

          RESULT_JSON="$RESULT" node <<'NODE'
          const result = JSON.parse(process.env.RESULT_JSON || "{}");
          if (result.statusWrite?.source !== "durable-object" || result.statusWrite?.saved !== true) {
            throw new Error(`Livestatus nicht dauerhaft gespeichert: ${JSON.stringify(result.statusWrite || null)}`);
          }
          if (!result.status?.updatedAt) {
            throw new Error("Gebets-Scheduler ohne aktuellen Zeitstempel beendet");
          }
          if (result.status?.prayerCopyVersion !== "v4") {
            throw new Error(`Falsche Gebets-Push-Copy aktiv: ${result.status?.prayerCopyVersion || "fehlt"}`);
          }
          if (result.status?.appEnvironment !== "production") {
            throw new Error(`Falsche Push-Umgebung aktiv: ${result.status?.appEnvironment || "fehlt"}`);
          }
          if (Number(result.status?.lookaheadMinutes) > 120) {
            throw new Error(`Planungsfenster zu groß: ${result.status?.lookaheadMinutes}`);
          }
          console.log(`Gebets-Push-Livestatus aktuell: ${result.status.updatedAt}`);
          NODE

      - name: Refresh and verify daily push scheduler
        continue-on-error: true
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          if [ -z "$ADMIN_PUBLISH_SECRET" ]; then
            echo "::warning::ADMIN_PUBLISH_SECRET fehlt – Tages-Push-Prüfung übersprungen"
            exit 0
          fi

          RESULT="$(curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/daily/run" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$RESULT"

          RESULT_JSON="$RESULT" node <<'NODE'
          const result = JSON.parse(process.env.RESULT_JSON || "{}");
          const status = result.status || {};
          if (status.schedulerEngine !== "cloudflare-worker-daily-v4-isolated") {
            throw new Error(`Falscher Tages-Push-Scheduler aktiv: ${status.schedulerEngine || "fehlt"}`);
          }
          if (status.appEnvironment !== "production") {
            throw new Error(`Falsche Tages-Push-Umgebung: ${status.appEnvironment || "fehlt"}`);
          }
          if (!status.updatedAt) {
            throw new Error("Tages-Push-Scheduler ohne aktuellen Zeitstempel");
          }
          if (Number(status.errors || 0) > 0) {
            throw new Error(`Tages-Push-Scheduler meldet ${status.errors} Fehler`);
          }
          console.log(`Tages-Push-v4 aktiv: ${status.updatedAt} · aktive Abos=${status.uniqueSubscriptions || 0} · Duʿāʾ=${status.accepted?.dua || 0} · Empfehlung=${status.accepted?.recommendation || 0}`);
          NODE

      - name: Sync optional feed image API secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          put_secret() {
            local name="$1"
            local val="$2"
            if [ -n "$val" ]; then
              echo "$val" | wrangler secret put "$name" --name dar-admin-publisher
              echo "Secret gesetzt: $name"
            fi
          }
          put_secret PEXELS_API_KEY "$PEXELS_API_KEY"
          put_secret UNSPLASH_ACCESS_KEY "$UNSPLASH_ACCESS_KEY"
          put_secret PIXABAY_API_KEY "$PIXABAY_API_KEY"

      - name: Trigger feed background sync (staging)
        env:
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          curl -fsS -X POST "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/feed-backgrounds/sync" \
            -H "Authorization: Bearer ${ADMIN_PUBLISH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"staging":true,"force":false,"maxDownloads":20}' || echo "::warning::Feed-BG Sync nach Deploy fehlgeschlagen"
