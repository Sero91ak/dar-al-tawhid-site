name: KIDS Academy owner pronunciation stop and silent citation numbers
on:
  push:
    branches:
      - audit/kids-academy-audio-inventory-20261106
    paths:
      - 'kids/tools/academy_source_voice.py'
      - 'kids/tools/audit-academy-arabic-pronunciation.py'
      - 'kids/tools/build-academy-v9-staging.py'
      - 'kids/data/academy-voice-policy-v10.json'
      - 'kids/data/academy-audio-staging-sidq-fusha-v30-20261111.json'
      - '.github/workflows/kids-academy-v33-owner-pronunciation-gate.yml'
  pull_request:
    paths:
      - 'kids/tools/academy_source_voice.py'
      - 'kids/tools/audit-academy-arabic-pronunciation.py'
      - 'kids/tools/build-academy-v9-staging.py'
      - 'kids/data/academy-voice-policy-v10.json'
      - 'kids/data/academy-audio-staging-sidq-fusha-v30-20261111.json'
      - '.github/workflows/kids-academy-v33-owner-pronunciation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-credit-pronunciation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test silent source numbers and canonical source names
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/academy_source_voice.py kids/tools/audit-academy-arabic-pronunciation.py kids/tools/voice_text.py kids/tools/build-academy-v9-staging.py
          python3 kids/tools/academy_source_voice.py
          python3 kids/tools/audit-academy-arabic-pronunciation.py
          python3 - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(".")
          sys.path.insert(0,str(root/"kids/tools"))
          from academy_source_voice import source_labels_for_speech,assert_no_spoken_source_numbers
          p=json.loads((root/"kids/data/academy-voice-policy-v10.json").read_text("utf8"))
          stop=p["production"]["ownerPronunciationHold"]
          assert stop["enabled"] is True and stop["newGenerationAllowed"] is False
          source=(root/"kids/tools/build-academy-v9-staging.py").read_text("utf8")
          assert "OWNER AUDIO STOP" in source
          assert source.index("OWNER AUDIO STOP") < source.index('payload=json.dumps(')
          stage=json.loads((root/"kids/data/academy-audio-staging-sidq-fusha-v30-20261111.json").read_text("utf8"))
          assert len(stage["entries"]) == 12 and stage["ownerPronunciationHold"] is True
          for original,record in stage["entries"].items():
              assert record["ownerPronunciationHold"] and record["approvedForPlayback"] is False
              assert record["requiresOwnerRehearing"]
              speech=source_labels_for_speech(original)
              assert_no_spoken_source_numbers(speech)
              assert "2607a" not in speech and "9:119" not in speech
              if "Sūrat at-Tawbah" in original:
                  assert "Sūrat at-Tawbah" in speech
              if "Ṣaḥīḥ Muslim" in original:
                  assert "Ṣaḥīḥ Muslim" in speech
          print("PASS: owner-paid-generation stop, 12 held clips, no spoken source numbers, 0 credits")
          PY
