name: KIDS Academy Holistic 65 Lessons and Device Contracts Audit
on:
  pull_request:
    paths:
      - "kids/tools/audit-academy-holistic-v2.cjs"
      - ".github/workflows/kids-academy-holistic-audit-v2.yml"
      - "kids/akademie/**"
permissions:
  contents: read
jobs:
  all-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit all curriculum, developmental choices, source manifests, voice, user data and responsive app structure
        run: |
          node --check kids/tools/audit-academy-holistic-v2.cjs
          node kids/tools/audit-academy-holistic-v2.cjs
      - name: Existing progress and canonical Full Salam test
        run: |
          node kids/tools/test-academy-learning-pedagogy-v1.cjs
          node kids/tools/test-academy-five-recap-focus-v1.cjs
          node kids/tools/test-academy-full-salam-v1.cjs
          node scripts/test-kids-academy-school-v11.js
