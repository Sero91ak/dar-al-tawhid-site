name: KIDS V4 Import Existing Paid Creative Candidates (review only)
on:
  push:
    branches: [review/kids-quiz-v4-batch-001-020-20261014]
    paths: ['kids/review-only/quiz-v4-creative-v4candidate-transfer-20261022.json']
permissions:
  contents: write
concurrency:
  group: kids-v4-creative-candidate-20261022
  cancel-in-progress: false
jobs:
  import-already-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
          fetch-depth: 2
      - name: Install FFmpeg and FFprobe for genuine MP3 verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o DPkg::Lock::Timeout=20 install -y ffmpeg
          fi
          ffprobe -version | sed -n '1p'
      - name: Verify exact unsigned-source metadata and import already generated candidate MP3s
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/import_quiz_v4_creative_candidates_20261022.py
          python3 kids/tools/import_quiz_v4_creative_candidates_20261022.py
      - name: Offline technical QA, stage 450 and preserve all unchanged 900 originals
        shell: bash
        run: |
          set -euo pipefail
          python3 kids/tools/qa_quiz_v4_saved_mp3.py
          python3 kids/tools/quiz_v4_first150_offline_join.py
          python3 kids/tools/quiz_v4_age7to10_offline_join.py
          python3 kids/tools/report_quiz_v4_450_progress.py
          python3 kids/tools/stage_quiz_v4_existing_mp3_import.py
          python3 kids/tools/write_quiz_v4_handover.py
          python3 kids/tools/quiz_v4_selected450_release_gate.py --ignore-flag
      - name: Save only real MP3s to private review branch and erase expiring transfer URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-exact-review-import
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Preserve transient transfer on branch until the original MP3s are secured.
          git add kids/assets/kids-quiz-audio/v4-curated450-review/
          git add kids/assets/kids-quiz-audio/v4-age7to10-composed-review/ kids/assets/kids-quiz-audio/v4-first150-composed-review/
          git add kids/data/quiz-v4-450-original-clip-registry.json kids/data/quiz-v4-450-saved-mp3-technical-qa.json kids/data/quiz-v4-450-production-status.json
          git add kids/data/quiz-v4-first150-composed-preview.json kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/review-only/quiz-v4-creative-v4candidate-transfer-results-20261022.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          # The global handover is refreshed by a separate review job, to avoid concurrent report conflicts.
          git commit -m "audio(kids review): import real V4 candidate originals with SHA, keep live blocked"
          for attempt in 1 2 3; do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014; then
              echo 'Saved genuine V4 originals safely in review; public release stays OFF.'
              exit 0
            fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            git rebase -X theirs FETCH_HEAD
          done
          echo 'GitHub push failed. Recover original MP3s from artifact; do not rebill.' >&2
          exit 1
      - name: Safeguard already billed candidate originals even if repository push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-20261022-real-creative-candidate-mp3-backup
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-curated450-review/
            kids/review-only/quiz-v4-creative-v4candidate-transfer-results-20261022.json
