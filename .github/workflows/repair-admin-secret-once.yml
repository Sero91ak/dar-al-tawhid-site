name: Repair Admin Secret Once

on:
  push:
    branches: [main]
    paths:
      - '.github/repair-admin-secret-once.trigger'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-save wrangler@4

      - name: Restore ADMIN_PUBLISH_SECRET only
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PUBLISH_SECRET: ${{ secrets.ADMIN_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$ADMIN_PUBLISH_SECRET" ] || { echo "::error::GitHub ADMIN_PUBLISH_SECRET fehlt"; exit 1; }
          printf '%s' "$ADMIN_PUBLISH_SECRET" | npx wrangler secret put ADMIN_PUBLISH_SECRET --name dar-admin-publisher
          sleep 5
          code="$(curl -sS -o /tmp/auth-check.json -w '%{http_code}' \
            -H "X-Admin-Secret: $ADMIN_PUBLISH_SECRET" \
            "https://dar-admin-publisher.sero91ak.workers.dev/api/admin/next-number" || true)"
          echo "Admin auth verification HTTP $code"
          if [ "$code" != "200" ]; then
            head -c 500 /tmp/auth-check.json || true
            echo
            exit 1
          fi
          echo "ADMIN_PUBLISH_SECRET successfully synchronized."
