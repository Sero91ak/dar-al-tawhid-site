name: Voice Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pronunciation/elevenlabs-production.json'
      - 'cloudflare/video-studio/voice.js'
      - '.github/workflows/voice-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: voice-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate ElevenLabs v4 + canonical dictionary + timestamps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          import requests

          key="".join(os.environ.get("ELEVENLABS_API_KEY","").split())
          if not key.startswith("sk_") or len(key)!=51:
              raise SystemExit("ELEVENLABS_API_KEY fehlt oder hat nicht das erwartete Format.")

          cfg=json.loads(Path("data/pronunciation/elevenlabs-production.json").read_text(encoding="utf-8"))
          model=str(cfg.get("modelId") or "").strip()
          voice=str((cfg.get("masterVoice") or {}).get("voiceId") or "").strip()
          pd=cfg.get("pronunciationDictionary") or {}
          dictionary_id=str(pd.get("id") or "").strip()
          version_id=str(pd.get("versionId") or "").strip()
          rules=int(pd.get("ruleCount") or 0)

          if model!="eleven_v4":
              raise SystemExit(f"Produktionsmodell ist nicht eleven_v4: {model!r}")
          if not voice or not dictionary_id or not version_id or rules<1:
              raise SystemExit("Produktionskonfiguration ist unvollständig.")

          payload={
              "text":"Tawḥīd.",
              "model_id":model,
              "voice_settings":{
                  "stability":0.70,
                  "similarity_boost":0.87,
                  "style":0.08,
                  "speed":0.93,
                  "use_speaker_boost":True
              },
              "pronunciation_dictionary_locators":[{
                  "pronunciation_dictionary_id":dictionary_id,
                  "version_id":version_id
              }]
          }
          res=requests.post(
              f"https://api.elevenlabs.io/v1/text-to-speech/{voice}/with-timestamps",
              headers={"xi-api-key":key,"Content-Type":"application/json","Accept":"application/json"},
              json=payload,
              timeout=90
          )
          print("HTTP",res.status_code)
          if not res.ok:
              print(res.text[:1000])
              res.raise_for_status()
          data=res.json()
          audio=base64.b64decode(str(data.get("audio_base64") or ""))
          alignment=data.get("alignment") or data.get("normalized_alignment") or {}
          if len(audio)<500:
              raise SystemExit(f"Smoke-Audio zu klein: {len(audio)} Bytes")
          if not alignment:
              raise SystemExit("ElevenLabs lieferte keine Timestamp-Ausrichtung.")
          print(
              "VOICE_PRODUCTION_OK",
              f"model={model}",
              f"dictionary={dictionary_id}",
              f"version={version_id}",
              f"rules={rules}",
              f"audioBytes={len(audio)}"
          )
          PY
