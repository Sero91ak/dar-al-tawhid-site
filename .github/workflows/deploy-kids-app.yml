name: Deploy DĀR AL TAWḤĪD Kids

on:
  push:
    branches:
      - feature/dar-al-tawhid-kids-v1
    paths:
      - test/kids/**
      - cloudflare/test-app-worker.js
      - wrangler.kids.toml
      - .github/workflows/deploy-kids-app.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dar-al-tawhid-kids-live
  cancel-in-progress: true

jobs:
  deploy-kids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bootstrap Kids artwork assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test/kids/assets/kids-art
          if [ ! -s test/kids/assets/kids-art/hero-entdecke.png ]; then
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/hero-entdecke.png "https://at.adobe.com/Av6QirIr4TwVcL9A"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/card-mein-quran.png "https://at.adobe.com/I5jmx6stqnTEQCAC"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/card-heute-lernen.png "https://at.adobe.com/IffAMNUTETBXRG2G"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/story-muenze.png "https://at.adobe.com/1q6T8V7vcGAZKudK"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/quran-reise.png "https://at.adobe.com/D9Fzg02KQ6LOUc5Q"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/quran-surah-zone.png "https://at.adobe.com/yrwm6PRoEtrxxamq"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/card-geschichte.jpg "https://at.adobe.com/SaqOfn3a8Sb9MEiR"
            curl -fsSL --retry 3 --retry-all-errors -o test/kids/assets/kids-art/card-quiz.jpg "https://at.adobe.com/CCnvlcd3KjxaoMKC"
          fi
          test -s test/kids/assets/kids-art/hero-entdecke.png
          test -s test/kids/assets/kids-art/quran-reise.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/kids/assets/kids-art
          if ! git diff --cached --quiet; then
            git commit -m "Kids v0.7: add generated artwork assets [skip ci]"
            git push origin HEAD:feature/dar-al-tawhid-kids-v1
          fi


      - name: Install dependencies
        run: npm install

      - name: Kids build consistency
        shell: bash
        run: |
          EXPECT="$(node -e "console.log(require('./test/kids/version.json').buildId)")"
          echo "Expect: $EXPECT"
          grep -Fq "const KIDS_BUILD_ID=\"$EXPECT\"" test/kids/index.html
          grep -Fq 'KIDS_SAFE_AREA_SOLID_V6' test/kids/index.html
          grep -Fq 'KIDS_AI_ART_V7_START' test/kids/index.html
          grep -Fq 'apple-mobile-web-app-status-bar-style" content="black"' test/kids/index.html

      - name: Deploy dedicated Kids Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.kids.toml

      - name: Verify Kids live route
        shell: bash
        run: |
          EXPECT="$(node -e "console.log(require('./test/kids/version.json').buildId)")"
          for BASE in "https://dar-al-tawhid.de/test/kids/" "https://dar-al-tawhid-kids.sero91ak.workers.dev/test/kids/"; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              stamp="$(date +%s)-$attempt"
              rm -f /tmp/kids-head /tmp/kids-body
              status="$(curl -sS -L --retry 2 --retry-delay 1 --max-time 25 -D /tmp/kids-head -o /tmp/kids-body -w '%{http_code}' "$BASE?verify=$stamp" || true)"
              if [ "$status" = "200" ] \
                && grep -Fq "const KIDS_BUILD_ID=\"$EXPECT\"" /tmp/kids-body \
                && grep -Fq 'KIDS_SAFE_AREA_SOLID_V6' /tmp/kids-body \
                && grep -Fq 'apple-mobile-web-app-status-bar-style" content="black"' /tmp/kids-body; then
                echo "$BASE -> $EXPECT live"
                ok=1
                break
              fi
              echo "$BASE attempt $attempt: HTTP $status / expected $EXPECT"
              sleep 5
            done
            test "$ok" = "1"
          done
