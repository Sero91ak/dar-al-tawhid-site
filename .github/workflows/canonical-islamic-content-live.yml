name: Live Ḥadīṯ Tadabbur Āṯār

# Sobald geprüfte Ḥadīṯ-, Āṯār-/Salaf- oder Tadabbur-Dateien auf main liegen,
# sofort denselben Stand in Website, Web-App, iOS, Android-WebApp und Apple TV
# ausrollen. Kein Feed, keine OneSignal-Spur.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - content/posts/**
      - scripts/adult-content-publication-guard.js
      - apple-tv/hadith/**
      - apple-tv/quran/tadabbur/**
      - apple-tv/catalog.json
      - apple-tv/screensaver/**
      - content/quran-athar/de/**
      - data/hadith-library/**
      - data/quran-search-index.json
      - scripts/rebuild-canonical-islamic-content.js
      - scripts/validate-canonical-content.js
      - .github/workflows/canonical-islamic-content-live.yml

permissions:
  actions: write # Only to dispatch the existing sole Cloudflare production-owner workflow after canonical sync
  contents: write
  issues: write

concurrency:
  group: dar-al-tawhid-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-canonical-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Immer neuesten main-Stand deployen
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Deploy HEAD: $(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Autonome Beiträge bestimmen
        if: github.event_name == 'push'
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          {
            echo "CHANGED_POST_FILES<<ADULT_POSTS_EOF"
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              git diff --diff-filter=A --name-only "$BASE" "${{ github.sha }}" -- 'content/posts/*.md'
            fi
            echo "ADULT_POSTS_EOF"
          } >> "$GITHUB_ENV"

      - name: Auto-Publisher und Dublettenprüfung testen
        run: node scripts/adult-content-publication-guard.js --self-test

      - name: Neue Ḥadīṯe und Āṯār prüfen und synchronisieren
        id: adult_sync
        continue-on-error: true
        env:
          AUTOPUBLISH_REPORT_PATH: ${{ runner.temp }}/adult-publication.json
        run: node scripts/adult-content-publication-guard.js --sync

      - name: Bei Dubletten oder fehlendem Šarḥ Nutzer informieren
        if: steps.adult_sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/adult-publication.json
        shell: bash
        run: |
          title="Beitrag blockiert: Apple TV / globaler Dubletten- und Quellencheck"
          if [ -s "$REPORT" ]; then
            content="$(cat "$REPORT")"
          else
            content="Auto-Veröffentlichung schlug vor der Berichtserstellung fehl. Bitte den Workflow prüfen."
          fi
          printf '## Automatische Veröffentlichungsprüfung\n\n%s\n\nRun: %s/%s/actions/runs/%s\n' "$content" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/adult-publish-issue.md
          gh issue create --title "$title" --body-file /tmp/adult-publish-issue.md || true
          echo "::error::Neuer Beitrag abgelehnt: Duplikat, Quellenmangel oder fehlender Šarḥ. GitHub-Issue wurde angefordert."
          exit 1

      - name: Kataloge aus Dateien neu aufbauen
        run: |
          node scripts/rebuild-canonical-islamic-content.js
          node scripts/validate-canonical-content.js

      - name: Apple-TV-Inhalte konfliktfrei auf main festschreiben
        if: github.event_name == 'push'
        shell: bash
        env:
          AUTOPUBLISH_REPORT_PATH: ${{ runner.temp }}/adult-publication.json
        run: |
          set -euo pipefail
          created="$(node -e "const f=require('fs');const p=process.env.AUTOPUBLISH_REPORT_PATH;console.log(f.existsSync(p)?(JSON.parse(f.readFileSync(p)).created||[]).length:0)")"
          git config user.name "dar-al-tawhid-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve only unpublished new canonical records, never stale catalogs.
          # In particular, do not rebase bot-generated catalog.json against a
          # concurrently updated main: rebuild the catalogs from the latest tree.
          saved="$(mktemp -d)"
          trap 'rm -rf "$saved"' EXIT
          while IFS= read -r file; do
            case "$file" in
              apple-tv/hadith/series/*/HAD-*.json)
                mkdir -p "$saved/$(dirname "$file")"
                cp "$file" "$saved/$file"
                ;;
            esac
          done < <(git ls-files --others --exclude-standard -- apple-tv/hadith/series)

          for attempt in 1 2 3 4; do
            git fetch origin main
            upstream="$(git rev-parse origin/main)"
            current="$(git rev-parse HEAD)"
            if [ "$current" != "$upstream" ]; then
              echo "Latest main moved; rebuilding canonical catalogs, attempt $attempt."
              git reset --hard "$upstream"
              while IFS= read -r file; do
                relative="${file#"$saved"/}"
                if [ -f "$relative" ]; then
                  cmp -s "$file" "$relative" || {
                    echo "::error::Two independently published Hadith records share $relative"
                    exit 1
                  }
                else
                  mkdir -p "$(dirname "$relative")"
                  cp "$file" "$relative"
                fi
              done < <(find "$saved" -type f -name 'HAD-*.json')
              node scripts/rebuild-canonical-islamic-content.js
              node scripts/validate-canonical-content.js
            fi
            git add apple-tv/hadith/series apple-tv/hadith/catalog.json apple-tv/hadith/manifest.json apple-tv/hadith/sync-status.json apple-tv/screensaver/catalog.json apple-tv/screensaver/entries-index.json apple-tv/hadith/library-shell.json
            if git diff --cached --quiet; then
              echo "Canonical content already current on main. New source records: $created"
              exit 0
            fi
            git commit -m "Apple TV: neue geprüfte Erwachsenen-Aussagen automatisch synchronisiert"
            if git push origin HEAD:main; then
              echo "Canonical content committed without catalog-rebase conflicts."
              exit 0
            fi
            echo "A newer concurrent main commit appeared; retrying from canonical sources."
          done
          echo "::error::Four canonical publish retries exhausted; refusing stale push."
          exit 1

      - name: Test-App Staging aus test-library-canonical übernehmen
        run: |
          git fetch origin test-library-canonical
          node scripts/overlay-test-staging-from-branch.js
          node scripts/app-stability-repair.js
          git checkout "${GITHUB_SHA}" -- scripts/patch-test-canonical-library.js scripts/cf-pages-build.js

      - name: Build + Build-IDs synchronisieren
        run: npm run build

      - name: Desktop-Beitragsindex aus gemeinsamer Quelle erstellen
        run: node scripts/build-desktop-posts-index.js

      - name: Canonical-Inhalt prüfen
        run: node scripts/validate-canonical-content.js

      - name: Production publish ownership
        run: |
          echo "Canonical content is committed to main. Production publishing belongs exclusively to Deploy Besucher-App (Cloudflare Workers)."

      # GITHUB_TOKEN push commits do not trigger a follow-up push workflow.
      # Explicit workflow_dispatch is GitHub's supported exception and does not
      # create a second deployment owner. The target retains its stale-SHA,
      # health, Cloudflare and OneSignal/push separation protections.
      - name: Aktuellsten kanonischen main-Stand an einzigen Cloudflare-Owner übergeben
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "Canonical sync validated; dispatch production owner for main ${CURRENT_MAIN}"
          gh workflow run cloudflare-pages-deploy.yml --ref main
          echo "Production owner dispatched; the target workflow independently validates and publishes main."
