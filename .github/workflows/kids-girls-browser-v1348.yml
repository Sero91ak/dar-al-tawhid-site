name: KIDS Girls V1348 Browser QA
on:
  push:
    branches: [preview/kids-ipad-qa-20261012]
    paths:
      - ".github/workflows/kids-girls-browser-v1348.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Browser runtime (runner only, no repo modification)
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium webkit
      - name: Check girl's and boy's computed artwork/palette at 3 viewports
        run: |
          KIDS_QA_ENGINE=chromium node kids/tools/qa-girls-firstpaint-browser-v1348.cjs
          KIDS_QA_ENGINE=webkit node kids/tools/qa-girls-firstpaint-browser-v1348.cjs
