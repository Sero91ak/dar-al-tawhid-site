name: Check native iOS post push deep links

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/DarAlTawhid/DarAlTawhid/DarAppRouter.swift'
      - 'ios/DarAlTawhid/DarAlTawhid/WebAppView.swift'
      - 'ios/DarAlTawhid/DarAlTawhid/DarPushNotifications.swift'
      - 'ios/DarAlTawhid/DarAlTawhid/DarAlTawhidApp.swift'
      - 'scripts/ios-post-push-deeplink-guard.cjs'
      - '.github/workflows/check-ios-post-push-deeplink.yml'

permissions:
  contents: read

jobs:
  ios-post-deeplink:
    name: Swift syntax and route regression
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native routes without sending any push
        run: node scripts/ios-post-push-deeplink-guard.cjs
      - name: Parse native Swift route files
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse             ios/DarAlTawhid/DarAlTawhid/DarAppRouter.swift             ios/DarAlTawhid/DarAlTawhid/WebAppView.swift             ios/DarAlTawhid/DarAlTawhid/DarPushNotifications.swift             ios/DarAlTawhid/DarAlTawhid/DarAlTawhidApp.swift

      - name: Check local OneSignal XCFramework dependencies
        id: vendor
        shell: bash
        run: |
          if [ -d ios/DarAlTawhid/Vendor/OneSignal/OneSignalFramework.xcframework ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Simulator build unavailable in the GitHub checkout: ios/DarAlTawhid/Vendor/OneSignal/*.xcframework are not tracked. Swift parse and deep-link regression tests still run."
          fi
      - name: Build native iOS Simulator app (no signing, no deployment)
        if: steps.vendor.outputs.available == 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/DarAlTawhid/DarAlTawhid.xcodeproj -scheme DarAlTawhid -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/dar-ios-post-push-check CODE_SIGNING_ALLOWED=NO -quiet build
