name: Adult Touch Navigation Guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/dar-app-chrome.js'
      - 'assets/dar-app-chrome.css'
      - 'index.html'
      - 'scripts/adult-footer-route-guard.cjs'
      - 'assets/adaptive-layout.js'
      - 'assets/fold-split.js'
      - 'assets/fold-split.css'
      - 'assets/adult-fold-global-v1.css'
      - 'assets/dar-visitor-frontstage-v1.css'
      - 'scripts/adult-fold-global-regression.cjs'
      - 'assets/app-soft-boot.js'
      - 'ios/DarAlTawhid/**'
      - 'scripts/adult-touch-navigation-guard-test.cjs'
      - 'scripts/adult-layout-performance-test.cjs'
      - '.github/workflows/adult-touch-navigation-guard.yml'
  push:
    branches: [main]
    paths:
      - 'assets/adaptive-layout.js'
      - 'assets/fold-split.js'
      - 'assets/fold-split.css'
      - 'assets/adult-fold-global-v1.css'
      - 'assets/dar-visitor-frontstage-v1.css'
      - 'scripts/adult-fold-global-regression.cjs'
      - 'assets/dar-app-chrome.js'
      - 'assets/dar-app-chrome.css'
      - 'index.html'
      - 'scripts/adult-footer-route-guard.cjs'
      - 'ios/DarAlTawhid/**'
      - 'scripts/adult-touch-navigation-guard-test.cjs'
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Adult JS navigation syntax and touch intent
        run: |
          node --check assets/dar-app-chrome.js
          node --check assets/adaptive-layout.js
          node --check assets/fold-split.js
          node --check assets/app-soft-boot.js
          node scripts/adult-touch-navigation-guard-test.cjs
          node scripts/adult-layout-performance-test.cjs
          node scripts/adult-fold-global-regression.cjs
          node scripts/adult-footer-route-guard.cjs
