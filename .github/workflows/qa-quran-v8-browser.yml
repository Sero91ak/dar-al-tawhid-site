name: Quran V8 Cinematic Player Browser QA
# Device verification after final V8.1 deploy, no concurrent staged release.
# Validates the corrected core-to-pagination script boundary and both player modes.
on:
  workflow_dispatch:
  push:
    branches: [preview/quran-player-browser-links-20261010]
    paths:
      - .github/workflows/qa-quran-v8-browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Chromium browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify both V8 players on actual rendered device sizes
        run: node scripts/qa-quran-v8-browser.cjs
      - name: Save rendered phone and tablet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-v8-visual-review
          path: .qa-quran-shots/
          retention-days: 21
          if-no-files-found: ignore
