name: Restore Prophet Original Audio

on:
  push:
    paths:
      - ".github/workflows/restore-prophet-original-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-prophet-original-audio
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Ensure ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download and verify byte-identical owner originals
        env:
          MUHAMMAD_URL: "https://at.adobe.com/S3befceMYD8MLidu"
          ADAM_URL: "https://at.adobe.com/tw8WbIgXjyaDmaP3"
          IDRIS_URL: "https://at.adobe.com/62501B1C48o8qVfD"
          MUHAMMAD_SHA256: "d6d7c21c76211def9e1fc6ae1acae0de92b830907218715418eeef3df6b2ad1c"
          ADAM_SHA256: "f1e9870c8b182f1d7a564020d26ae02ba1c2750a0ec2ade27efc205499818e19"
          IDRIS_SHA256: "ffd834a2e64a98731603940ff6a0d758e0a5e1eac0f424468836c22acc4818d1"
          MUHAMMAD_BYTES: "5611321"
          ADAM_BYTES: "3691217"
          IDRIS_BYTES: "2818100"
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 "$MUHAMMAD_URL" -o /tmp/muhammad-original.mp3
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 "$ADAM_URL" -o /tmp/adam-original.mp3
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 "$IDRIS_URL" -o /tmp/idris-original.mp3

          test "$(stat -c%s /tmp/muhammad-original.mp3)" = "$MUHAMMAD_BYTES"
          test "$(stat -c%s /tmp/adam-original.mp3)" = "$ADAM_BYTES"
          test "$(stat -c%s /tmp/idris-original.mp3)" = "$IDRIS_BYTES"

          echo "$MUHAMMAD_SHA256  /tmp/muhammad-original.mp3" | sha256sum -c -
          echo "$ADAM_SHA256  /tmp/adam-original.mp3" | sha256sum -c -
          echo "$IDRIS_SHA256  /tmp/idris-original.mp3" | sha256sum -c -

          python3 - <<'PY'
          import json, subprocess
          files={
            "muhammad":("/tmp/muhammad-original.mp3",5611321),
            "adam":("/tmp/adam-original.mp3",3691217),
            "idris":("/tmp/idris-original.mp3",2818100),
          }
          for name,(path,size) in files.items():
              raw=subprocess.check_output([
                "ffprobe","-v","error",
                "-show_entries","stream=codec_name,sample_rate,channels,bit_rate:format=duration,size,bit_rate",
                "-of","json",path
              ], text=True)
              data=json.loads(raw)
              stream=data["streams"][0]
              assert stream.get("codec_name")=="mp3", (name,stream)
              assert int(data["format"]["size"])==size, (name,data["format"])
              # Preserve the actual original. We only verify; never re-encode it.
              print(name,json.dumps(data,ensure_ascii=False))
          PY

          mkdir -p kids/assets/prophet-story-audio/{muhammad,adam,idris}
          cp /tmp/muhammad-original.mp3 kids/assets/prophet-story-audio/muhammad/story.mp3
          cp /tmp/adam-original.mp3 kids/assets/prophet-story-audio/adam/story.mp3
          cp /tmp/idris-original.mp3 kids/assets/prophet-story-audio/idris/story.mp3

          export MUHAMMAD_BLOB="$(git hash-object kids/assets/prophet-story-audio/muhammad/story.mp3)"
          export ADAM_BLOB="$(git hash-object kids/assets/prophet-story-audio/adam/story.mp3)"
          export IDRIS_BLOB="$(git hash-object kids/assets/prophet-story-audio/idris/story.mp3)"
          echo "MUHAMMAD_BLOB=$MUHAMMAD_BLOB" >> "$GITHUB_ENV"
          echo "ADAM_BLOB=$ADAM_BLOB" >> "$GITHUB_ENV"
          echo "IDRIS_BLOB=$IDRIS_BLOB" >> "$GITHUB_ENV"

      - name: Restore manifests and protect owner story masters
        env:
          RESTORED_AT: "2026-10-06T13:02:00Z"
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const prophetPath="kids/data/prophet-stories.json";
          const kidsVersionPath="kids/version.json";
          const voiceVersionPath="voice-studio/version.json";
          const prophet=JSON.parse(fs.readFileSync(prophetPath,"utf8"));
          const kids=JSON.parse(fs.readFileSync(kidsVersionPath,"utf8"));
          const voice=JSON.parse(fs.readFileSync(voiceVersionPath,"utf8"));
          const now=process.env.RESTORED_AT || new Date().toISOString();

          const spec={
            muhammad:{
              path:"kids/assets/prophet-story-audio/muhammad/story.mp3",
              bytes:5611321,
              sha256:"d6d7c21c76211def9e1fc6ae1acae0de92b830907218715418eeef3df6b2ad1c",
              durationSec:349.649,
              filename:"Prophete Geschichte Muahammad ﷺ .mp3",
              blob:process.env.MUHAMMAD_BLOB
            },
            adam:{
              path:"kids/assets/prophet-story-audio/adam/story.mp3",
              bytes:3691217,
              sha256:"f1e9870c8b182f1d7a564020d26ae02ba1c2750a0ec2ade27efc205499818e19",
              durationSec:229.642,
              filename:"Prophet Adam Geschichte .mp3",
              blob:process.env.ADAM_BLOB
            },
            idris:{
              path:"kids/assets/prophet-story-audio/idris/story.mp3",
              bytes:2818100,
              sha256:"ffd834a2e64a98731603940ff6a0d758e0a5e1eac0f424468836c22acc4818d1",
              durationSec:175.073,
              filename:"Prophet Idris Geschichte .mp3",
              blob:process.env.IDRIS_BLOB
            }
          };

          const nextVersion=Math.max(Number(prophet.version||0)+1,8);
          for(const [id,s] of Object.entries(spec)){
            const item=(prophet.items||[]).find(x=>x&&x.id===id);
            if(!item) throw new Error("Missing prophet "+id);
            item.audio=item.audio&&typeof item.audio==="object"?item.audio:{};
            for(const age of ["4-5","6-8","9-10"]){
              const prev=item.audio[age]&&typeof item.audio[age]==="object"?item.audio[age]:{};
              item.audio[age]={
                ...prev,
                url:"/"+s.path+"?v="+nextVersion+"-original",
                durationSec:s.durationSec,
                status:"ready",
                manualUpload:true,
                source:"owner-approved-repo-permanent-audio-original",
                filename:s.filename,
                allAges:true,
                permanentAsset:true,
                bytes:s.bytes,
                sha256:s.sha256,
                mime:"audio/mpeg",
                codec:"mp3",
                originalOwnerUpload:true,
                originalBytesPreserved:true,
                transcoded:false,
                deliveryProfile:"owner-original-byte-identical",
                restoredAt:now
              };
              delete item.audio[age].bitRateKbps;
            }
            item.voiceProduction={
              ...(item.voiceProduction||{}),
              audioRefreshRequired:false,
              originalOwnerUpload:true,
              originalBytesPreserved:true,
              transcoded:false,
              ownerAudioSha256:s.sha256,
              ownerAudioBytes:s.bytes,
              ownerAudioDurationSec:s.durationSec,
              permanentAudioPath:"/"+s.path,
              deliveryProfile:"owner-original-byte-identical",
              restoredAt:now
            };
          }
          prophet.version=nextVersion;
          prophet.updatedAt=now;

          kids.visualSystem=kids.visualSystem||{};
          Object.assign(kids.visualSystem,{
            storyAudioPinnedAsset:"/kids/assets/prophet-story-audio/muhammad/story.mp3?v=20261006-original",
            storyAudioPinnedSha256:spec.muhammad.sha256,
            storyAudioPinnedCommit:"owner-original-restored",
            storyAudioPinnedBytes:spec.muhammad.bytes,
            storyAudioDeliveryProfile:"owner-original-byte-identical",
            prophetOwnerOriginalAudioRestored:true,
            prophetOwnerOriginalAudioRestoredAt:now,
            prophetOwnerOriginalAudioCount:3,
            prophetOwnerOriginalAudioPolicy:"preserve-uploaded-bytes-no-transcode",
            prophetOwnerOriginalAudioIds:["muhammad","adam","idris"],
            ownerOriginalAudioPolicy:"preserve-uploaded-bytes-no-transcode"
          });
          delete kids.visualSystem.prophetOwnerOriginalAudioBitRateKbps;
          kids.updatedAt="2026-10-06";

          voice.prophetMasterAudio=voice.prophetMasterAudio||{};
          Object.assign(voice.prophetMasterAudio,{
            ownerOriginalAudioPolicy:"preserve-uploaded-bytes-no-transcode",
            existingOwnerAudioStorage:"kids/assets/prophet-story-audio/<prophet>/story.mp3",
            restoredExistingOwnerAudios:true,
            restoredAt:now,
            restoredIds:["muhammad","adam","idris"],
            originalOwnerAudioCodec:"mp3",
            originalBytesPreserved:true,
            transcoded:false
          });
          delete voice.prophetMasterAudio.originalOwnerAudioBitRateKbps;
          voice.updatedAt="2026-10-06";

          const refs={
            muhammad:"data/pronunciation/story-reference-muhammad-2026-10-04.json",
            adam:"data/pronunciation/story-reference-adam-2026-10-04.json",
            idris:"data/pronunciation/story-reference-idris-2026-10-04.json"
          };
          for(const [id,p] of Object.entries(refs)){
            const s=spec[id];
            const ref=JSON.parse(fs.readFileSync(p,"utf8"));
            ref.sourceAudio=ref.sourceAudio||{};
            Object.assign(ref.sourceAudio,{
              bytes:s.bytes,
              sha256:s.sha256,
              durationSec:s.durationSec,
              format:"mp3",
              ownerConfirmedPair:true,
              repositoryTarget:"/"+s.path,
              repositoryBinaryPublished:true,
              repositoryBlobSha:s.blob,
              repositoryPublishedAt:now,
              originalBytesPreserved:true,
              transcoded:false
            });
            ref.deliveryAudio={
              url:"/"+s.path,
              bytes:s.bytes,
              sha256:s.sha256,
              format:"mp3",
              profile:"owner-original-byte-identical",
              repositoryBlobSha:s.blob,
              originalBytesPreserved:true,
              transcoded:false,
              restoredAt:now
            };
            fs.writeFileSync(p,JSON.stringify(ref,null,2)+"\n");
          }

          fs.writeFileSync(prophetPath,JSON.stringify(prophet,null,2)+"\n");
          fs.writeFileSync(kidsVersionPath,JSON.stringify(kids,null,2)+"\n");
          fs.writeFileSync(voiceVersionPath,JSON.stringify(voice,null,2)+"\n");
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/optimize-app-media.sh")
          s=p.read_text()
          guard='  [[ "$f" == kids/assets/prophet-story-audio/* || "$f" == kids/assets/mubashshirun-story-audio/* || "$f" == kids/assets/sahabiyyat-story-audio/* ]] && return 0\n'
          if 'kids/assets/prophet-story-audio/* || "$f" == kids/assets/mubashshirun-story-audio/*' not in s:
              marker='is_protected() {\n'
              if marker not in s:
                  raise SystemExit("is_protected() anchor missing")
              s=s.replace(marker,marker+guard,1)
              p.write_text(s)
          PY

      - name: Validate Kids release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/kids-prophet-release-guard.js

      - name: Commit original Prophet audio masters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAR Kids Audio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            kids/assets/prophet-story-audio/muhammad/story.mp3 \
            kids/assets/prophet-story-audio/adam/story.mp3 \
            kids/assets/prophet-story-audio/idris/story.mp3 \
            kids/data/prophet-stories.json \
            kids/version.json \
            voice-studio/version.json \
            data/pronunciation/story-reference-muhammad-2026-10-04.json \
            data/pronunciation/story-reference-adam-2026-10-04.json \
            data/pronunciation/story-reference-idris-2026-10-04.json \
            scripts/optimize-app-media.sh
          git diff --cached --stat
          git commit -m "Kids: restore original Prophet story audio masters"
          git push origin HEAD:main
