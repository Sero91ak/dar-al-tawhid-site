name: Verify live KIDS girl palette and first paint V1348
on:
  push:
    branches: [preview/kids-ipad-qa-20261012]
    paths: [".github/workflows/kids-ipad-debug.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public KIDS vs redirected Test KIDS, new assets and boot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dar-al-tawhid.de"
          TS="v1348-${GITHUB_SHA}"
          get(){
            local path="$1" dest="$2"
            code="$(curl -fsSL --retry 4 --retry-delay 2 --max-time 30 \
              -A 'Kids-LiveQA/1.0' -H 'Cache-Control: no-cache' \
              -o "$dest" -w '%{http_code}' "$BASE$path")"
            echo "$path -> HTTP $code"
            test "$code" = 200 && test -s "$dest"
          }
          get "/kids/start?qa=$TS" /tmp/kids-v1348-home.html
          grep -Fq 'id="kids-profile-first-paint-v1348"' /tmp/kids-v1348-home.html
          grep -Fq 'id="kids-profile-apply-first-paint-v1348"' /tmp/kids-v1348-home.html
          grep -Fq 'girls-home-photo-palette-v1348.css?v=1348' /tmp/kids-v1348-home.html
          grep -Fq 'girls-profile-theme-v1332.js?v=1348' /tmp/kids-v1348-home.html
          grep -Fq 'hero-home.png?v=1274' /tmp/kids-v1348-home.html
          get "/kids/girls-home-photo-palette-v1348.css?v=1348&qa=$TS" /tmp/kids-v1348-girls.css
          grep -Fq 'KIDS_GIRLS_HOME_PALETTE_FIRSTPAINT_V1348' /tmp/kids-v1348-girls.css
          grep -Fq '.academy-pilot-entry' /tmp/kids-v1348-girls.css
          grep -Fq '.choice.quran::before' /tmp/kids-v1348-girls.css
          get "/kids/girls-profile-theme-v1332.js?v=1348&qa=$TS" /tmp/kids-v1348-meta.js
          grep -Fq 'var neutral="#0c2636"' /tmp/kids-v1348-meta.js
          get "/kids/assets/kids-salah-v1272/hero-home.png?v=1274&qa=$TS" /tmp/kids-v1348-hero.png
          test "$(wc -c < /tmp/kids-v1348-hero.png)" -gt 20000
          get "/test/kids/start?qa=$TS" /tmp/kids-v1348-test.html
          grep -Fq 'id="kids-profile-first-paint-v1348"' /tmp/kids-v1348-test.html
          echo 'KIDS V1348 LIVE OK: start, first paint, girls colors, metadata, approved image, /test/kids redirect'
