name: Import Kids Cinema Intro V74

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kids-cinema.yml'

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Download and optimize Veo cinema intro
        env:
          VIDEO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/fcdba0c8-9042-4867-ae1f-5fd56bf499d6.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzQ0ZGNjYjU3Y2U2OTg2OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDcyNDUzM30.lYDg7tR7JkZnoSB5_vT62oKI6VeLZ6g6nS0Qp33ZN4M"
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-cinema
          curl -L --fail --retry 3 --retry-delay 2 "$VIDEO_URL" -o /tmp/intro-v74-source.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/intro-v74-source.mp4 \
            -an -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280" \
            -c:v libx264 -preset medium -crf 30 -pix_fmt yuv420p -movflags +faststart \
            kids/assets/kids-cinema/intro-v74.mp4
          test -s kids/assets/kids-cinema/intro-v74.mp4
          bytes="$(wc -c < kids/assets/kids-cinema/intro-v74.mp4)"
          if [ "$bytes" -lt 100000 ]; then
            echo "Downloaded file is unexpectedly small: $bytes bytes" >&2
            exit 1
          fi
      - name: Commit cinema video
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/kids-cinema/intro-v74.mp4
          if git diff --cached --quiet; then
            echo "Cinema video already current."
            exit 0
          fi
          git commit -m "Kids: add rendered photorealistic cinema intro"
          git push origin HEAD:main
