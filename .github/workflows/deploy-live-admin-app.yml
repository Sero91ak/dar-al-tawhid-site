name: Deploy live Admin App
# PRODUCTION_SINGLE_OWNER_V1: validation only. The central visitor workflow publishes /admin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - admin/**
      - .github/workflows/deploy-live-admin-app.yml
permissions:
  contents: read
jobs:
  validate-admin-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Admin UI bundle
        run: |
          set -euo pipefail
          test -s admin/index.html
          test -s admin/sw.js
          grep -F -q 'name="newPostMode"' admin/index.html
          grep -F -q 'id="uploadPostBtn"' admin/index.html
          grep -F -q 'dar-admin-single-mode-v67' admin/sw.js
          echo "Admin valid; central visitor workflow owns production publish."
