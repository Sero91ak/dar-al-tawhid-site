name: DAR Adult Daily Publication Dry Run

# Deliberately restricted to validation. No secrets, publication or notifications.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/dar-daily-release-dry-run.cjs'
      - '.github/workflows/dar-daily-release-dry-run.yml'
      - 'content/admin/change-scope-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adult-daily-publishing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-preflight:
    name: Verify publisher validation and prove no-send blockers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for read-only QA
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code syntax
        run: node --check scripts/dar-daily-release-dry-run.cjs
      - name: Public q41 availability probe (read-only; no push; advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -u
          BASE="https://dar-al-tawhid.de"
          POST="2026-10-12-quran-24-22-vergeben-und-nachsicht.md"
          URLS=("/q/41/" "/content/posts/$POST" "/content/posts/posts-index.json")
          ok=0
          echo "### Q41 live availability (advisory)" >> "$GITHUB_STEP_SUMMARY"
          for p in "${URLS[@]}"; do
            tmp="$(mktemp)"
            status="$(curl -sSL --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' -o "$tmp" -w '%{http_code}' "$BASE$p?cb=${GITHUB_RUN_ID}" || true)"
            valid=0
            if [ "$status" = "200" ]; then
              case "$p" in
                /q/41/) grep -q 'Sūrat an-Nūr 24:22\|an-Nūr 24:22' "$tmp" && grep -q 'qsource-page' "$tmp" && grep -q 'dorar.net/h/nrNaND4d' "$tmp" && valid=1 ;;
                */posts-index.json) grep -q "$POST" "$tmp" && valid=1 ;;
                *) grep -q 'quran-24-22-vergeben-und-nachsicht-20261012' "$tmp" && grep -q '/q/41/' "$tmp" && valid=1 ;;
              esac
            fi
            echo "- $p: HTTP $status, expected content: $([ "$valid" = "1" ] && echo present || echo MISSING)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$valid" = "1" ]; then ok=$((ok+1)); fi
            rm -f "$tmp"
          done
          echo "- Verified resources: $ok/3. No OneSignal request made." >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" = "3" ]; then echo "PUBLIC_Q41_PROBE: LIVE_VERIFIED"; else echo "::warning::PUBLIC_Q41_PROBE: NOT VERIFIED ($ok/3)"; fi
      - name: Dry-run publisher (no GitHub writes or pushes)
        run: node scripts/dar-daily-release-dry-run.cjs
      - name: Validate previously published real adult requests - CHECK ONLY
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            content/admin/chat-publish-requests/sufyan-niyyah-live-20261008.json \
            content/admin/chat-publish-requests/isa-nuzul-q35-slides-live-20261008.json \
            content/admin/chat-publish-requests/miraj-ruyah-q36-slides-live-20261008.json
          do
            echo "Check-only: $f"
            test -s "$f"
            node scripts/chat-admin-publish.js --check "$f"
          done
      - name: Exercise actual Worker against a fully mocked OneSignal API
        run: node scripts/dar-daily-onesignal-contract.mjs
      - name: Verify broad audience is rejected by strict test gate
        shell: bash
        run: |
          set +e
          node scripts/dar-daily-onesignal-contract.mjs --require-safe-target
          result=$?
          set -e
          if [ "$result" = "2" ]; then
            echo "Broad audience blocked: production push NOT allowed."
          elif [ "$result" = "0" ]; then
            echo "Mocked target contract passes; verify live OneSignal segment filters separately."
          else
            echo "::error::OneSignal contract failed (exit $result)"
            exit 1
          fi
      - name: Verify guarded release never proceeds on blockers
        shell: bash
        run: |
          set +e
          node scripts/dar-daily-release-dry-run.cjs --require-release-ready
          result=$?
          set -e
          if [ "$result" = "2" ]; then
            echo "Safety gate correctly blocks live release."
          elif [ "$result" = "0" ]; then
            echo "Offline structural checks pass; live release still requires independent source/Cloudflare/OneSignal verification."
          else
            echo "::error::Offline daily-release tests failed (exit $result)"
            exit 1
          fi
