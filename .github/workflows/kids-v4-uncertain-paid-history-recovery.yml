name: KIDS V4 Recover Unconfirmed Charged Original via Read-Only History GET

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/tools/recover_quiz_v4_uncertain_history.py'
      - 'kids/tools/test_quiz_v4_uncertain_history.py'
      - '.github/workflows/kids-v4-uncertain-paid-history-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kids-v4-review-safe-original-recovery
  cancel-in-progress: false

jobs:
  recover-one-unconfirmed-original-no-tts:
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'review/kids-quiz-v4-batch-001-020-20261014')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private V4 review, never public app
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014

      - name: Validate existing uncertain provider transaction without credits
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/recover_quiz_v4_uncertain_history.py
          python3 -m py_compile kids/tools/test_quiz_v4_uncertain_history.py
          python3 kids/tools/test_quiz_v4_uncertain_history.py
          python3 kids/tools/recover_quiz_v4_uncertain_history.py
          python3 kids/tools/test_quiz_v4_no_double_charge_guard.py

      - name: Retrieve exact previously attempted V4 history original by GET only
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=0 -o DPkg::Lock::Timeout=20 install -y ffmpeg
          fi
          python3 kids/tools/recover_quiz_v4_uncertain_history.py --recover

      - name: Update all 450 private quiz audio links only if a real MP3 was imported
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          p='kids/data/quiz-v4-older-stage1-free-history-recovery.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['newSynthesisCalls']==r['newSpeechCreditsSpent']==0
          assert r['publicReleaseEnabled'] is False
          recovered=r['successfulAuthenticHistoryImports']
          if recovered:
              print('Recovered genuine already-attempted V4 audio bytes:',recovered)
              for tool in (
                  'qa_quiz_v4_saved_mp3.py',
                  'quiz_v4_first150_offline_join.py',
                  'quiz_v4_age7to10_offline_join.py',
                  'report_quiz_v4_450_progress.py',
                  'stage_quiz_v4_existing_mp3_import.py',
                  'write_quiz_v4_handover.py',
              ):
                  subprocess.run(['python3','kids/tools/'+tool],check=True)
              subprocess.run(['python3','kids/tools/quiz_v4_selected450_release_gate.py','--ignore-flag'],check=True)
          else:
              print('No history original downloaded; uncertain charged request stays blocked against second payment.')
          PY

      - name: Commit only authentic restored audio and request journal to private review
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-original-recovery-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kids/data/quiz-v4-older-stage1-free-history-recovery.json
          git add kids/data/quiz-v4-older-stage1-request-journal.json
          git add kids/data/quiz-v4-older-stage1-usage.json
          git add kids/data/quiz-v4-450-original-clip-registry.json kids/data/quiz-v4-450-paid-generation-ledger.json
          git add kids/assets/kids-quiz-audio/v4-curated450-review/
          git add kids/assets/kids-quiz-audio/v4-first150-composed-review/ kids/assets/kids-quiz-audio/v4-age7to10-composed-review/
          git add kids/data/quiz-v4-450-saved-mp3-technical-qa.json kids/data/quiz-v4-450-production-status.json
          git add kids/data/quiz-v4-first150-composed-preview.json kids/data/quiz-v4-first150-audio-status.json
          git add kids/data/quiz-v4-age7to10-composed-preview.json kids/data/quiz-v4-age7to10-offline-coverage.json
          git add kids/review-only/quiz-v4-450-actual-mp3-import.json kids/review-only/quiz-v4-450-actual-mp3-import-summary.json
          git add kids/review-only/QUIZ-V4-UEBERGABE-AKTUELL.md kids/review-only/quiz-v4-handover-latest.json
          if git diff --cached --quiet; then
            echo 'No new original or recovery report; no costs.'
            exit 0
          fi
          git commit -m 'audio(kids V4): recover previously charged original through official history GET, no synth'
          for try in 1 2 3 4; do
            if git push origin HEAD:review/kids-quiz-v4-batch-001-020-20261014; then
              echo 'Stored V4 originals and recovery report in review only.'
              exit 0
            fi
            git fetch origin review/kids-quiz-v4-batch-001-020-20261014
            git rebase FETCH_HEAD
          done
          echo 'GitHub push failed; preserve original audio from uploaded artifact; NEVER SYNTHESIZE AGAIN.'
          exit 1

      - name: Keep authentic provider MP3s and safe metadata even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-uncertain-charged-original-readonly-recovery
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/data/quiz-v4-older-stage1-free-history-recovery.json
            kids/data/quiz-v4-older-stage1-request-journal.json
            kids/data/quiz-v4-older-stage1-usage.json
            kids/data/quiz-v4-450-original-clip-registry.json
            kids/data/quiz-v4-450-paid-generation-ledger.json
            kids/assets/kids-quiz-audio/v4-curated450-review/
