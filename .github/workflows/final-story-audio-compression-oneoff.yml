name: Final Story Audio Compression One-Off

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-story-audio-compression-oneoff.yml'

permissions:
  contents: write

jobs:
  compress:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Compress Adam and Muhammad story audio to 48k mono
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            kids/assets/prophet-story-audio/adam/story.mp3 \
            kids/assets/prophet-story-audio/muhammad/story.mp3
          do
            test -s "$f"
            tmp="${f%.mp3}.48k.mp3"
            ffmpeg -hide_banner -loglevel error -y -i "$f" \
              -vn -ac 1 -ar 48000 -c:a libmp3lame -b:a 48k "$tmp"
            old="$(stat -c%s "$f")"
            new="$(stat -c%s "$tmp")"
            mv "$tmp" "$f"
            echo "FINAL_AUDIO_OPTIMIZED $f $old -> $new"
          done

      - name: Refresh metadata and pinned SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-local-media-metadata.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path("kids/assets/prophet-story-audio/muhammad/story.mp3")
          v=Path("kids/version.json")
          data=json.loads(v.read_text(encoding="utf-8"))
          visual=data.setdefault("visualSystem",{})
          visual["storyAudioPinnedSha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
          visual["storyAudioPinnedCommit"]="media-optimized-runtime-48k"
          visual["storyAudioPinnedAsset"]="/kids/assets/prophet-story-audio/muhammad/story.mp3?v=20261005-media48k"
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Verify compact files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            kids/assets/prophet-story-audio/adam/story.mp3 \
            kids/assets/prophet-story-audio/muhammad/story.mp3
          do
            bitrate="$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$f" | head -n1)"
            bytes="$(stat -c%s "$f")"
            echo "FINAL_AUDIO $f bitrate=$bitrate bytes=$bytes"
            [ "$bitrate" -le 52000 ]
          done

      - name: Commit final audio reduction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            kids/assets/prophet-story-audio/adam/story.mp3 \
            kids/assets/prophet-story-audio/muhammad/story.mp3 \
            kids/version.json kids/data voice-studio 2>/dev/null || true
          git commit -m "[media-optimized] Final Kids story audio 48k"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
