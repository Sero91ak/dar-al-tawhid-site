name: Import DĀR KIDS V4 story masters

on:
  workflow_run:
    workflows:
      - Deploy Besucher-App (Cloudflare Workers)
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 9 12 10 *' # one-time 2026-10-12 09:40 UTC; remove after run
  push:
    branches: [main]
    paths:
      - scripts/voice-studio/production/import-v4-download-manifest.json

permissions:
  contents: write
  actions: write

concurrency:
  group: dar-kids-story-v4-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify audio tools
        shell: bash
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 -V

      - name: Download and validate V4 master recordings
        run: |
          python3 scripts/voice-studio/production/import-kids-v4-audio.py scripts/voice-studio/production/import-v4-download-manifest.json

      - name: Commit and publish imported audio only
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dar-kids-audio-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/prophet-story-audio kids/assets/sahabiyyat-story-audio kids/data/prophet-stories.json kids/data/sahabiyyat-stories.json scripts/voice-studio/production/kids-v4-import-report.json
          if git diff --cached --quiet; then
            echo "No new audio assets were imported."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(kids): publish generated V4 story master recordings for all ages"
          # Independent live-audit commits may land while a large MP3 batch is uploading.
          # Never force-push; rebase only unrelated commits and fail safely on conflicts.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          echo "Unable to fast-forward story master release" >&2
          exit 1

      - name: Deploy new story masters through canonical Cloudflare production workflow
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/cloudflare-pages-deploy.yml/dispatches" -f ref=main
          echo "Canonical Cloudflare production deployment dispatched."
