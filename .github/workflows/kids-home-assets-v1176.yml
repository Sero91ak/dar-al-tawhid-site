name: Kids Home Assets V1176

on:
  push:
    branches:
      - fix/kids-home-live-v1176-20261006
    paths:
      - .github/workflows/kids-home-assets-v1176.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      HERO_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:999d95f5-ac2a-40a1-8b39-31e92fc38488"
      STORY_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/fc4546b9-491b-46e2-b891-eec0ee7f6874/Single_standalone_ultra_wide_cinematic_illustrated_background_for_a_premium_Islamic_children_s_app_a_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjgxZWMxMzAzZmEyMmFmMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTQzMDcwNH0.rBVQEfGfdLt080ydsuLOTZtTvdIZsuF88CF3KbvyhBQ"
      QURAN_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/a0b3ca03-91d3-48d7-931d-dfa8e3308e81/Single_standalone_ultra_wide_cinematic_illustrated_background_for_a_premium_Islamic_children_s_app_Q_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzRkNzAyNDI2YjA3MzczYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM3MzI1MH0.vPUzLdpEkvS45wcpXfSK-pxEpXA9uN6ZQadVdRMB4Aw"
      DUA_URL: "https://dnznrvs05pmza.cloudfront.net/gpt_image_2_5_flare/fc719991-15e4-408e-9e03-fbcb89d62b2a/Single_standalone_ultra_wide_cinematic_illustrated_background_for_a_premium_Islamic_children_s_app_d_0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzg0ZGQ1MjA1ZWQyYTdkOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTQzMTMyOH0.1FaxpFuYxKhEM40i8ae7t26ZDk2pYozx6moqswzSsLI"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kids-home-live-v1176-20261006
      - name: Download generated home artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-home-v1176
          curl -L --fail --retry 3 --retry-delay 2 "$HERO_URL" -o kids/assets/kids-home-v1176/hero-cinema.png
          curl -L --fail --retry 3 --retry-delay 2 "$STORY_URL" -o kids/assets/kids-home-v1176/world-stories.png
          curl -L --fail --retry 3 --retry-delay 2 "$QURAN_URL" -o kids/assets/kids-home-v1176/world-quran.png
          curl -L --fail --retry 3 --retry-delay 2 "$DUA_URL" -o kids/assets/kids-home-v1176/world-dua.png
          test -s kids/assets/kids-home-v1176/hero-cinema.png
          test -s kids/assets/kids-home-v1176/world-stories.png
          test -s kids/assets/kids-home-v1176/world-quran.png
          test -s kids/assets/kids-home-v1176/world-dua.png
          file kids/assets/kids-home-v1176/*.png
      - name: Commit generated artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/kids-home-v1176
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets(kids): add dedicated home artwork v1176"
          git push origin HEAD:fix/kids-home-live-v1176-20261006
