name: Optimize App Media

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/**'
      - 'kids/assets/**'
      - 'apple-tv/**'
      - 'ios/**'
      - 'voice-studio/**'
      - 'test/assets/**'
      - 'scripts/optimize-app-media.sh'
      - 'scripts/update-local-media-metadata.py'
      - '.github/workflows/optimize-app-media.yml'
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Scan all current app media"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'kids/assets/**'
      - 'content/**'
      - 'apple-tv/**'
      - 'ios/**'
      - 'test/assets/**'
      - 'scripts/optimize-app-media.sh'
      - 'scripts/update-local-media-metadata.py'
      - '.github/workflows/optimize-app-media.yml'

permissions:
  contents: write

concurrency:
  group: app-media-optimizer-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  optimize:
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[media-optimized]')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 2

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick pngquant webp >/dev/null

      - name: Decide scan mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          full=0
          skip=0
          LAST_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          if printf '%s' "$LAST_MSG" | grep -Fq '[media-optimized]'; then
            skip=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_scan }}" = "true" ]; then
            full=1
          elif printf '%s' "$LAST_MSG" | grep -Fq '[media-fullscan]'; then
            full=1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Optimize current media
        if: steps.mode.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/optimize-app-media.sh
          if [ "${{ steps.mode.outputs.full }}" = "1" ]; then
            scripts/optimize-app-media.sh --all
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "$BASE_SHA" --depth=1
            git diff --name-only "$BASE_SHA" HEAD -- \
              assets kids/assets content apple-tv ios test/assets \
              | scripts/optimize-app-media.sh --stdin
          else
            git diff --name-only HEAD^ HEAD -- \
              assets kids/assets content apple-tv ios test/assets \
              | scripts/optimize-app-media.sh --stdin
          fi

      - name: Restore protected brand assets
        if: steps.mode.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          git checkout origin/main -- \
            assets/app-icons \
            assets/brand/seals \
            kids/assets/kids-brand/logo-mark.png

      - name: Enforce delivery budgets
        if: steps.mode.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *Assets.xcassets*|*/icons/*|*/app-icons/*|*/brand/seals/*|*/logo/*|*/logos/*|*/kids-brand/logo-mark.png|*favicon*|*watermark*|*/masters/*|*/master/*|*/originals/*|*/raw/*|*/sources/*|*-master.*) continue ;;
            esac
            size=$(stat -c%s "$f")
            case "${f,,}" in
              *.jpg|*.jpeg|*.png|*.webp)
                if [ "$size" -gt 1200000 ]; then echo "::error::$f is still larger than 1.2 MB"; fail=1; fi ;;
              *.mp4)
                if [ "$size" -gt 12000000 ]; then echo "::warning::$f remains larger than 12 MB; move long video to Cloudflare/R2 streaming delivery."; fi ;;
            esac
          done < <(find assets kids/assets content apple-tv ios -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.mp4' \) -print0 2>/dev/null)
          exit "$fail"

      - name: Commit optimized media
        if: steps.mode.outputs.skip != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets kids/assets content apple-tv ios test/assets kids/data voice-studio scripts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Media already within optimization targets."
            exit 0
          fi
          git commit -m "[media-optimized] Compress app media automatically"
          TARGET_BRANCH="${{ github.event.pull_request.head.ref || 'main' }}"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
