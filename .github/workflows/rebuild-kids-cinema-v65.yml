name: Rebuild Kids Cinema V65

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-kids-cinema-v65.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved master scenes
        env:
          SCENE1_URL: "https://at.adobe.com/TRgQ2rWaVQ5SL9m1"
          SCENE2_URL: "https://at.adobe.com/q32FgGRSVi5pRYDc"
          SCENE3_URL: "https://at.adobe.com/dNjkatKRr0uYNvbC"
        run: |
          set -euo pipefail
          mkdir -p /tmp/kids-cinema
          curl -L --fail --retry 3 --retry-delay 2 "$SCENE1_URL" -o /tmp/kids-cinema/scene1.png
          curl -L --fail --retry 3 --retry-delay 2 "$SCENE2_URL" -o /tmp/kids-cinema/scene2.png
          curl -L --fail --retry 3 --retry-delay 2 "$SCENE3_URL" -o /tmp/kids-cinema/scene3.png
          file /tmp/kids-cinema/scene*.png
          test "$(wc -c </tmp/kids-cinema/scene1.png)" -gt 100000
          test "$(wc -c </tmp/kids-cinema/scene2.png)" -gt 100000
          test "$(wc -c </tmp/kids-cinema/scene3.png)" -gt 100000

      - name: Render clean 9:16 cinema master
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-cinema
          ffmpeg -hide_banner -y \
            -loop 1 -t 3.6 -i /tmp/kids-cinema/scene1.png \
            -loop 1 -t 3.6 -i /tmp/kids-cinema/scene2.png \
            -loop 1 -t 3.6 -i /tmp/kids-cinema/scene3.png \
            -filter_complex "\
          [0:v]scale=1200:2134:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.00075,1.065)':x='iw/2-(iw/zoom/2)-10*sin(on/28)':y='ih/2-(ih/zoom/2)+8*cos(on/35)':d=86:s=1080x1920:fps=24,eq=saturation=1.08:contrast=1.03:brightness=-0.01,setsar=1[v0];\
          [1:v]scale=1200:2134:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='1.045+0.00035*on':x='iw/2-(iw/zoom/2)+10*sin(on/24)':y='ih/2-(ih/zoom/2)-6*sin(on/31)':d=86:s=1080x1920:fps=24,eq=saturation=1.10:contrast=1.04:brightness=0.005,setsar=1[v1];\
          [2:v]scale=1200:2134:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='1.06-0.00028*on':x='iw/2-(iw/zoom/2)-8*cos(on/26)':y='ih/2-(ih/zoom/2)-8*sin(on/33)':d=86:s=1080x1920:fps=24,eq=saturation=1.12:contrast=1.04:brightness=0.01,setsar=1[v2];\
          [v0][v1]xfade=transition=fade:duration=0.55:offset=3.02[x01];\
          [x01][v2]xfade=transition=fade:duration=0.55:offset=6.05,format=yuv420p[v]" \
            -map "[v]" -t 9.25 -r 24 \
            -c:v libx264 -preset medium -crf 29 -profile:v high -level 4.1 \
            -movflags +faststart -an \
            kids/assets/kids-cinema/intro-final.mp4

          ffmpeg -hide_banner -y -i /tmp/kids-cinema/scene1.png \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -frames:v 1 -q:v 4 kids/assets/kids-cinema/poster-v65.jpg

          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name,pix_fmt \
            -of default=nw=1 kids/assets/kids-cinema/intro-final.mp4

      - name: Commit clean cinema master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/assets/kids-cinema/intro-final.mp4 kids/assets/kids-cinema/poster-v65.jpg
          if git diff --cached --quiet; then
            echo "Cinema master already current."
            exit 0
          fi
          git commit -m "Kids V0.65: replace broken intro render with approved cinema scenes"
          git push origin HEAD:main
