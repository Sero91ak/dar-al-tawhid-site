name: KIDS V4 450 Master Offline Hearing Bundle (zero credits)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/tools/build_quiz_v4_all450_master_hearing_review.py'
      - 'kids/tools/build_quiz_v4_first150_hearing_review.py'
      - 'kids/tools/build_quiz_v4_age7to10_hearing_review.py'
      - 'kids/data/quiz-v4-first150-composed-preview.json'
      - 'kids/data/quiz-v4-age7to10-composed-preview.json'
      - 'kids/review-only/quiz-v4-450-actual-mp3-import-summary.json'
      - '.github/workflows/kids-v4-all450-master-hearing-package.yml'

permissions:
  contents: read

concurrency:
  group: kids-v4-450-all-ages-hearing-zip-review
  cancel-in-progress: false

jobs:
  check-and-package-originals:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read current private quiz-review branch
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014
      - name: Package all 450 questions with their real original V4 MP3s
        run: |
          set -euo pipefail
          python3 -m py_compile kids/tools/build_quiz_v4_all450_master_hearing_review.py
          python3 kids/tools/build_quiz_v4_all450_master_hearing_review.py
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('kids/review-only/quiz-v4-450-master-hearing-bundle.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read('V4-HOERPRUEFUNG-NACHWEIS.json'))
              assert m['modelId']=='eleven_v4'
              assert m['masterVoiceId']=='DkU7j9uO4ZEtLD2iRZSH'
              summary=json.loads(Path('kids/review-only/quiz-v4-450-actual-mp3-import-summary.json').read_text())
              assert m['questions']==450
              assert m['full']==summary['completeFourPartQuestions']
              assert m['presentParts']==sum(sum(row['availableParts'].values()) for row in summary['byAge'].values())
              assert m['uniqueOriginalMp3Hashes']==summary['uniqueRealMP3Hashes']
              assert m['humanListeningApprovals']==0
              assert m['newElevenLabsCreditsSpent']==0
              assert m['publicReleaseAllowed'] is False
              assert 'START-HIER.html' in z.namelist()
              assert len(m['mp3Sha256ByRelativePath'])==len([n for n in z.namelist() if n.endswith('.mp3')])
          print('PASS: One offline hearing kit, 450 questions and 276 unique V4 MP3s, no TTS.')
          PY
      - name: Keep full listening review off the public site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tawhid-kids-v4-all450-human-hearing-offline-bundle
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/review-only/quiz-v4-450-master-hearing-bundle.zip
            kids/review-only/QUIZ-V4-GESAMT-HOERPRUEFUNG-STATUS.md
