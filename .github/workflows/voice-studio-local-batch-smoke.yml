name: Voice Studio Local Batch Smoke

on:
  push:
    branches: [main]
    paths:
      - 'voice-studio/local-engine.py'
      - 'voice-studio/alphabet-audio-studio.js'
      - 'voice-studio/content-studio.js'
      - 'voice-studio/index.html'
      - 'voice-studio/mobile.html'
      - 'voice-studio/VoiceStudioApp.swift'
      - 'voice-studio/install-mac.command'
      - 'voice-studio/version.json'
      - '.github/workflows/voice-studio-local-batch-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile local Voice Engine
        run: |
          python3 -m py_compile voice-studio/local-engine.py

      - name: Check Alphabet Studio JavaScript
        run: |
          node --check voice-studio/alphabet-audio-studio.js

      - name: Check Content Studio and inline Voice Studio JavaScript
        run: |
          node --check voice-studio/content-studio.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          if len(scripts)!=1:
              raise SystemExit(f"expected exactly one inline Voice Studio script, got {len(scripts)}")
          Path("/tmp/dar-voice-inline.js").write_text(scripts[0],encoding="utf-8")
          required=[
              'id="pronunciationWorkspace"',
              'id="alphabetWorkspace"',
              'id="systemWorkspace"',
              '"/learning/preview-start"',
              '"/learning/preview-state?id="',
              '"/learning/preview-audio?id="',
              'function localLearningCandidates',
              'window.setStudioPage=setStudioPage',
              'Updates · aktuell',
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit("focused Voice Studio UI markers missing: "+", ".join(missing))
          print("Focused Voice Studio UI markers OK")
          PY
          node --check /tmp/dar-voice-inline.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("voice-studio/mobile.html").read_text(encoding="utf-8")
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I) if x.strip()]
          if len(scripts)!=1:
              raise SystemExit(f"expected exactly one inline mobile script, got {len(scripts)}")
          Path("/tmp/dar-voice-mobile-inline.js").write_text(scripts[0],encoding="utf-8")
          required=[
              'data-screen="create"',
              'data-screen="history"',
              'data-screen="pronunciation"',
              'data-screen="settings"',
              '"/analyze"',
              '"/generate"',
              '"/learning/search"',
              '"/learning/preview-start"',
              '"/learning/confirm"',
              '"/mobile/history"',
              'data-preview=',
              'dataset.previewId',
              'Zum Home-Bildschirm',
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit("mobile Voice markers missing: "+", ".join(missing))
          print("Mobile Voice surface markers OK")
          PY
          node --check /tmp/dar-voice-mobile-inline.js

      - name: Guard interactive Voice Studio priority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          alphabet=Path("voice-studio/alphabet-audio-studio.js").read_text(encoding="utf-8")
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          manifest=json.loads(Path("voice-studio/version.json").read_text(encoding="utf-8"))
          expected=str(manifest["version"])

          assert f'ENGINE_VERSION="{expected}"' in engine
          assert '"engine_version":ENGINE_VERSION' in engine
          assert 'LEARNING_PREVIEW_WAITING.is_set()' in engine
          assert 'MANUAL_RENDER_WAITING.is_set()' in engine
          assert 'RENDER_LOCK.locked()' in engine
          assert 'await startFullBatch(true);' not in alphabet, "Alphabet/Quiz full batch must never auto-start"
          assert 'Gesamtbatch startet ausschließlich nach dem' in alphabet
          assert f'const APP_VERSION="{expected}";' in html
          assert 'runningVersion!==APP_VERSION' in html
          mobile=Path("voice-studio/mobile.html").read_text(encoding="utf-8")
          native=Path("voice-studio/VoiceStudioApp.swift").read_text(encoding="utf-8")
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          assert '"/mobile","/mobile/","/mobile/index.html"' in engine
          assert 'p=="/mobile/history"' in engine
          assert 'p=="/mobile/audio"' in engine
          assert 'components.path = "/mobile/"' in native
          assert 'voice-studio/mobile.html' in installer
          assert expected in mobile
          print("Interactive Voice Studio priority guard OK:",expected)
          PY

      - name: Validate pronunciation candidate fallback
        run: |
          python3 - <<'PY'
          import importlib.util, os, shutil, tempfile
          from pathlib import Path
          root=Path.cwd()
          tmp=Path(tempfile.mkdtemp(prefix="dar-pronunciation-smoke-"))
          app=tmp/"studio"; home=tmp/"home"
          app.mkdir(parents=True); home.mkdir(parents=True)
          shutil.copy2(root/"data/pronunciation/pronunciation-rules.json",app/"pronunciation-rules.json")
          shutil.copy2(root/"data/pronunciation/DAR_AL_TAWHID_ElevenLabs_Aussprache_MAX_MASTER.pls",app/"DAR_AL_TAWHID_ElevenLabs_Aussprache_MAX_MASTER.pls")
          shutil.copy2(root/"data/pronunciation/voice-production-profile.json",app/"voice-production-profile.json")
          shutil.copy2(root/"data/pronunciation/islamic-master-library.json",app/"islamic-master-library.json")
          os.environ["DAR_VOICE_APP_HOME"]=str(app)
          os.environ["HOME"]=str(home)
          spec=importlib.util.spec_from_file_location("dar_voice_candidate_smoke",root/"voice-studio/local-engine.py")
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          assert len(mod.MAX_MASTER_PLS_RULES)==8507, len(mod.MAX_MASTER_PLS_RULES)
          assert mod.MAX_MASTER_PLS_FALLBACK_RULES, "MAX MASTER fallback rules empty"
          assert all(r.get("requires_boundary") for r in mod.MAX_MASTER_PLS_FALLBACK_RULES)
          sample=next(r for r in mod.MAX_MASTER_PLS_FALLBACK_RULES if len(str(r.get("string_to_replace") or ""))>=3)
          needle=str(sample["string_to_replace"])
          assert mod.pronunciation_rule_boundary_ok(needle,0,needle)
          assert not mod.pronunciation_rule_boundary_ok("X"+needle+"Y",1,needle)
          rows=mod.pronunciation_candidates("Allah",12)
          assert rows, "Allah candidate list empty"
          assert any(str(r.get("ttsLanguage"))=="ar" and any("\u0600"<=ch<="\u06ff" for ch in str(r.get("ttsText") or "")) for r in rows), rows
          assert hasattr(mod,"LEARNING_PREVIEW_SERIAL_LOCK")
          assert hasattr(mod,"start_learning_preview_job")
          print("Pronunciation candidate fallback OK:",[(r.get("canonical"),r.get("ttsText"),r.get("source")) for r in rows[:4]])
          PY

      - name: Validate repository Kids JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path("kids/data/alphabet-audio.json"),
              Path("kids/data/quiz-kids.json"),
              Path("kids/data/quiz-audio.json"),
          ]:
              json.loads(p.read_text(encoding="utf-8"))
              print("valid json:", p)
          PY

      - name: Validate Quiz weak-ending chunking
        run: |
          python3 - <<'PY'
          import ast, re, sys
          from pathlib import Path
          sys.path.insert(0, "voice-studio")
          from speech_flow import FLOW_WEAK_ENDINGS

          source=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          node=next(
              n for n in tree.body
              if isinstance(n,ast.FunctionDef) and n.name=="_quiz_bounded_parts"
          )
          module=ast.Module(body=[node],type_ignores=[])
          ns={"re":re,"FLOW_WEAK_ENDINGS":FLOW_WEAK_ENDINGS}
          exec(compile(module,"<quiz_chunk_test>","exec"),ns)
          fn=ns["_quiz_bounded_parts"]

          sample="Richtig. Qurʾān 51:56 nennt die Anbetung Allahs als Zweck."
          parts=fn(sample,48)
          print(parts)
          assert all(
              re.sub(r"[^A-Za-zÄÖÜäöüß]+$","",p.split()[-1]).casefold()
              not in FLOW_WEAK_ENDINGS
              for p in parts[:-1] if p and not re.search(r"[,،;؛:.!?؟…]$",p)
          ), parts
          assert any("als Zweck." in p for p in parts), parts
          PY

      - name: Validate compound Arabic honorific split
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          src=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          tree=ast.parse(src)
          node=next(
              n for n in tree.body
              if isinstance(n,ast.FunctionDef) and n.name=="build_free_pronunciation_render_plan"
          )
          ns={}
          ns["split_audio_locked_spans"]=lambda text:[
              ("text","ابْنُ عَبَّاس"),
              ("lock","رَضِيَ اللَّهُ عَنْهُ"),
          ]
          ns["build_free_render_plan"]=lambda text:[("ar",text.strip())] if text.strip() else []
          exec(compile(ast.Module(body=[node],type_ignores=[]),"<honorific_split>","exec"),ns)
          out=ns["build_free_pronunciation_render_plan"]("ابْنُ عَبَّاس رَضِيَ اللَّهُ عَنْهُ")
          print(out)
          assert out==[
              ("ar","ابْنُ عَبَّاس"),
              ("ar","رَضِيَ اللَّهُ عَنْهُ"),
          ],out
          PY

      - name: Validate Alphabet linguistic review gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("kids/data/alphabet-audio.json").read_text(encoding="utf-8"))
          slots=[]
          for letter in (d.get("letters") or {}).values():
              slots.append(letter.get("name"))
              slots.extend((letter.get("harakat") or {}).values())
              slots.append(letter.get("word"))
          slots=[s for s in slots if s]
          assert len(slots)==140, len(slots)
          assert all(s.get("technicalQaPassed") is True for s in slots), "technical QA marker missing"
          for slot in slots:
              linguistic=slot.get("linguisticVerified") is True
              live=slot.get("verified") is True
              assert linguistic==live, "verified and linguisticVerified must move together"
              if live:
                  assert slot.get("reviewStatus")=="approved", "live alphabet clip lacks approved linguistic review"
                  assert slot.get("sourceVoice")=="authorized-owner-voice", "live alphabet clip is not owner voice"
                  assert slot.get("voiceProfileId")=="serhat-owner-voice-2026", "live alphabet clip has wrong voice profile"
              else:
                  assert slot.get("reviewStatus")!="approved", "unverified clip must not be marked approved"
          policy=d.get("policy",{})
          assert policy.get("linguisticReviewRequired") is True
          assert policy.get("technicalQaIsNotPronunciationVerification") is True
          approved=sum(1 for s in slots if s.get("linguisticVerified") is True)
          pending=len(slots)-approved
          print("Alphabet linguistic review gate OK:",len(slots),"approved:",approved,"pending:",pending)
          PY

      - name: Validate Harakat extraction before final QA
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          src=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          tree=ast.parse(src)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="create_alphabet_voice_preview")
          body=ast.unparse(fn)
          assert "_render_repeated_harakat_raw" in body
          assert "_extract_repeated_pronunciation_token" in body
          assert "audio_quality_metrics(wav, int(model.sr), value" in body.replace("\n"," ")
          raw=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="_render_repeated_harakat_raw")
          raw_body=ast.unparse(raw)
          assert "short_arabic_too_long" in raw_body
          assert "ignoredPreExtractionIssues" in raw_body
          print("Ḥarakāt extraction-before-final-QA wiring OK")
          PY

      - name: Validate full local batch markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          js=Path("voice-studio/alphabet-audio-studio.js").read_text(encoding="utf-8")
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          quizjs=Path("kids/quiz-owner-voice.js").read_text(encoding="utf-8")
          quizaudio=Path("kids/data/quiz-audio.json").read_text(encoding="utf-8")
          required_engine=[
              "def build_full_local_kids_voice_pack",
              "def start_full_local_kids_voice_pack",
              'if p=="/alphabet/batch-start"',
              'elif p=="/alphabet/batch-state"',
              'KidsAppExport',
              'KidsAppPublishRepo',
              'manualPerClipApprovalRequired',
              'def _quiz_voice_texts',
              'def _build_quiz_owner_voice_pack',
              'def _generate_quiz_voice_master',
              'def _quiz_bounded_parts',
              'QuizMasters',
              'def load_alphabet_manifest',
              'def load_quiz_manifest',
              'Kids data self-healed',
              'legacy JSON terminator repaired',
              'honorific_flow_repaired',
              'honorificFlowRepairTriggerMs',
              'honorificFlowRepairMaxMs',
              'FLOW_WEAK_ENDINGS',
              'grammatisch abhängigen Funktionswörtern',
              'def build_free_pronunciation_render_plan',
              'def honorific_lock_keys_in_chunk',
              'linguisticVerified',
              'needs-human-review',
              'approve_existing_alphabet_master',
              'def _extract_repeated_pronunciation_token',
              'def _alphabet_render_prompt',
              'harakat_token_not_isolated',
              'fushaStrict',
              'ALPHABET_GENERATION_PROFILE="fusha-strict-v2"',
              'cached_profile==ALPHABET_GENERATION_PROFILE',
              'generationProfile=ALPHABET_GENERATION_PROFILE',
              'def _render_repeated_harakat_raw',
              'temporaryRepeatedHarakatRender',
              'ignoredPreExtractionIssues',
              'preExtractionMetrics',
              'quiz-audio.json',
              'kids-quiz-audio',
          ]
          required_js=[
              "startFullBatch",
              "maybeAutoStartFullBatch",
              'fetch("/alphabet/batch-start"',
              'fetch("/alphabet/batch-state',
              "Alphabet + Quiz + Begrüßung",
          ]
          required_html=[
              'id="alphabetPackBatchBtn"',
              'id="alphabetPackBatchState"',
              "<title>DĀR AL TAWḤĪD – Voice Studio</title>",
              "alphabet-audio-studio.js?v=2929",
          ]
          failures=[]
          for label,src,markers in (
              ("engine",engine,required_engine),
              ("js",js,required_js),
              ("html",html,required_html),
              ("quiz-runtime",quizjs,["DARKidsQuizVoice","quiz-audio.json","originalQuizSpeak"]),
              ("quiz-manifest",quizaudio,["KIDS_QUIZ_OWNER_VOICE_V1","serhat-owner-voice-2026"]),
          ):
              missing=[m for m in markers if m not in src]
              if missing:
                  failures.append(label+": "+", ".join(missing))
          if failures:
              raise SystemExit("Local batch smoke failed: "+" | ".join(failures))
          print("Voice Studio local Serhat batch markers OK")
          PY

      - name: Validate unified Kids owner voice architecture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          runtime=Path("kids/owner-voice.js").read_text(encoding="utf-8")
          kids=Path("kids/index.html").read_text(encoding="utf-8")
          sw=Path("kids/sw.js").read_text(encoding="utf-8")
          owner=json.loads(Path("kids/data/owner-voice-audio.json").read_text(encoding="utf-8"))
          shorts=json.loads(Path("kids/data/short-stories-voice.json").read_text(encoding="utf-8"))
          version=json.loads(Path("voice-studio/version.json").read_text(encoding="utf-8"))

          engine_required=[
              "KIDS_OWNER_VOICE_MASTER_HOME",
              "KIDS_OWNER_VOICE_EXPORT_HOME",
              "def load_fresh_kids_repo_json",
              "def _kids_owner_voice_rows",
              "def _generate_kids_owner_voice_master",
              "def build_kids_owner_voice_sync",
              "def start_kids_owner_voice_sync",
              "def _kids_owner_voice_auto_loop",
              'if p=="/kids-voice/sync-start"',
              'elif p=="/kids-voice/sync-state"',
              'name="dar-kids-owner-voice-auto"',
              '"dar-kids-owner-voice-sync"',
              '"question"',
              '"kids_story"',
              '"dua"',
              "failedItems",
              "pendingFailures",
          ]
          missing=[m for m in engine_required if m not in engine]
          assert not missing, "Kids owner voice engine markers missing: "+", ".join(missing)

          for source in (
              "kids/data/quiz-kids.json",
              "kids/data/dua-kids.json",
              "kids/data/stories-authentic.json",
              "kids/data/short-stories-voice.json",
              "kids/data/verified-content.json",
          ):
              assert source in engine, "fresh Kids voice source missing: "+source

          assert "/kids/data/owner-voice-audio.json" in runtime
          assert "/kids/data/quiz-audio.json" in runtime
          assert "DARKidsOwnerVoice" in runtime
          assert "SpeechSynthesisUtterance" not in runtime, "owner runtime must never synthesize with system TTS"
          assert '/kids/owner-voice.js?v=1' in kids
          assert '/kids/quiz-owner-voice.js' not in kids, "legacy quiz-only runtime must not be loaded"
          assert "DARKidsOwnerVoice.play" in kids
          assert "Audio wird vorbereitet" in kids
          assert "/kids/assets/kids-owner-voice/" in sw
          assert "/kids/assets/kids-quiz-audio/" in sw

          assert owner.get("voiceProfileId")=="serhat-owner-voice-2026"
          assert owner.get("systemTtsFallbackAllowed") is False
          assert owner.get("syntheticQuranRecitationAllowed") is False
          assert len(shorts.get("items") or [])==4

          cfg=version.get("kidsUnifiedOwnerVoice") or {}
          assert cfg.get("enabled") is True
          assert cfg.get("autoDiscovery") is True
          assert cfg.get("autoSyncOnLocalEngineStart") is True
          assert int(cfg.get("recheckMinutes") or 0)==30
          assert cfg.get("systemTtsFallback") is False
          assert cfg.get("syntheticQuranRecitation") is False
          assert cfg.get("publicArtifactsOnly") is True
          assert cfg.get("voiceReferenceStaysLocal") is True
          assert cfg.get("interactiveRequestsKeepPriority") is True

          print("Unified Kids owner voice architecture OK")
          PY


      - name: Validate realistic age-adaptive Kids quiz artwork
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          quiz=json.loads(Path("kids/data/quiz-kids.json").read_text(encoding="utf-8"))
          kids=Path("kids/index.html").read_text(encoding="utf-8")
          sw=Path("kids/sw.js").read_text(encoding="utf-8")
          version=json.loads(Path("kids/version.json").read_text(encoding="utf-8"))

          expected={
              "4-6":"/kids/assets/quiz-scenes/quiz-4-6.svg?v=20261004-real1",
              "7-8":"/kids/assets/quiz-scenes/quiz-7-8.svg?v=20261004-real1",
              "9-10":"/kids/assets/quiz-scenes/quiz-9-10.svg?v=20261004-real1",
          }
          artwork=((quiz.get("artwork") or {}).get("ageBands") or {})
          assert set(artwork)==set(expected), "quiz artwork age bands drifted"
          for band,url in expected.items():
              assert artwork[band].get("url")==url, f"{band} artwork URL is not pinned locally"
              assert not str(artwork[band].get("url","")).startswith(("http://","https://")), f"{band} artwork hotlink detected"
              rel=url.split("?",1)[0].lstrip("/")
              asset=Path(rel)
              assert asset.exists() and asset.stat().st_size>50000, f"{band} realistic artwork missing or unexpectedly tiny"
              assert url in sw, f"{band} artwork missing from PWA precache"

          assert 'const CACHE_NAME="dar-al-tawhid-kids-v1095"' in sw
          assert "QUIZ_ARTWORK=[" not in sw, "legacy external quiz artwork runtime cache returned"

          visual=((version.get("visualSystem") or {}).get("quizVisualSystem") or {})
          assert visual.get("version")=="age-adaptive-realistic-v4"
          assert visual.get("artworkHotlinkDependency") is False
          assert visual.get("youngAgeAudioFirst") is True
          assert visual.get("systemTtsFallbackAllowed") is False

          ui_markers=[
              'data-quiz-band',
              'quizArtworkForBand',
              'quiz-yes-no',
              '@keyframes quizWrongShake',
              '@media(max-width:430px)',
              '@media(min-width:768px)',
              'DARKidsOwnerVoice',
          ]
          missing=[m for m in ui_markers if m not in kids]
          assert not missing, "Kids quiz UI markers missing: "+", ".join(missing)
          assert "SpeechSynthesisUtterance" not in Path("kids/owner-voice.js").read_text(encoding="utf-8")
          assert 'background-image:url("/kids/assets/quiz-scenes/' not in kids, "quiz artwork must stay manifest-driven, not duplicated in CSS"
          assert 'var listenLabel=band==="4-6"?"Frage hören":"Frage noch einmal hören";' in kids
          assert '#quizModal[data-quiz-band="4-6"] .quiz-scene-top .quiz-scene-chip:first-child{display:none}' in kids

          items=quiz.get("items") or []
          assert len(items)==200, f"expected 200 Kids quiz questions, got {len(items)}"
          counts={band:sum(1 for q in items if q.get("ageBand")==band) for band in expected}
          assert counts=={"4-6":72,"7-8":64,"9-10":64}, counts

          print("Realistic age-adaptive Kids quiz artwork OK:",counts)
          PY

