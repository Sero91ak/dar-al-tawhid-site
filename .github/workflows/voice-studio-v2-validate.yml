name: Voice Studio 2 Validate

on:
  push:
    paths:
      - "voice-studio/**"
      - "data/pronunciation/pronunciation-rules.json"
      - "data/pronunciation/voice-production-profile.json"
      - "data/pronunciation/voice-regression-fixtures.json"
      - "scripts/voice-studio/validate-v2.py"
      - ".github/workflows/voice-studio-v2-validate.yml"
  pull_request:
    paths:
      - "voice-studio/**"
      - "data/pronunciation/pronunciation-rules.json"
      - "data/pronunciation/voice-production-profile.json"
      - "data/pronunciation/voice-regression-fixtures.json"
      - "scripts/voice-studio/validate-v2.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Mac installer shell syntax
        run: bash -n voice-studio/install-mac.command

      - name: Compile Voice Engine
        run: python -m py_compile voice-studio/local-engine.py

      - name: Smoke-test Voice Engine runtime state
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, tempfile
          from pathlib import Path

          root=Path.cwd()
          tmp=Path(tempfile.mkdtemp(prefix="dar-voice-smoke-"))
          app=tmp/"studio"
          home=tmp/"home"
          app.mkdir(parents=True)
          home.mkdir(parents=True)
          shutil.copy2(root/"data/pronunciation/pronunciation-rules.json",app/"pronunciation-rules.json")
          shutil.copy2(root/"data/pronunciation/voice-production-profile.json",app/"voice-production-profile.json")
          os.environ["DAR_VOICE_APP_HOME"]=str(app)
          os.environ["HOME"]=str(home)

          spec=importlib.util.spec_from_file_location("dar_voice_engine_smoke",root/"voice-studio/local-engine.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          status=mod.get_status()
          assert isinstance(status,dict)
          assert "audio_lock_pending" in status
          assert isinstance(status["audio_lock_pending"],list)
          assert hasattr(mod,"AUDIO_LOCK_STATE_LOCK")
          assert hasattr(mod,"PENDING_AUDIO_LOCKS")
          assert hasattr(mod,"PENDING_AUDIO_RENDER_ID")
          print("Voice Engine runtime smoke OK",status["audio_lock_pending"])
          PY

      - name: Validate pronunciation and regression fixtures
        run: |
          python scripts/voice-studio/validate-v2.py \
            data/pronunciation/pronunciation-rules.json \
            data/pronunciation/voice-production-profile.json \
            voice-studio/local-engine.py \
            data/pronunciation/voice-regression-fixtures.json

      - name: Validate Voice Studio UI hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          required=[
              'id="styleMode"',
              'id="qaProsody"',
              'id="qaArabicRef"',
              'id="qaTechnical"',
              'id="qaBackend"',
              'id="qaSpeed"',
              'id="qaCoreLock"',
              'id="qaHonorific"',
              'id="learningSection"',
              'id="learnTerm"',
              'id="learnResults"',
              'id="learnPreviewBtn"',
              'id="learnConfirmBtn"',
              'id="learnSyncBtn"',
              'data-learning-term',
              '"/analyze"',
              '"/confirm-core-audio"',
              '"/learning/search"',
              '"/learning/sync"',
              '"/learning/preview"',
              '"/learning/confirm"',
              'honorificPolicyEnabled',
              'style:$("#styleMode").value',
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing Voice Studio 2 UI hooks: "+", ".join(missing))
          print("Voice Studio UI hooks OK")
          PY
