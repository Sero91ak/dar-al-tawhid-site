name: Voice Studio 2 Validate

on:
  push:
    paths:
      - "voice-studio/**"
      - "data/pronunciation/pronunciation-rules.json"
      - "data/pronunciation/voice-production-profile.json"
      - "data/pronunciation/islamic-master-library.json"
      - "data/pronunciation/voice-regression-fixtures.json"
      - "scripts/voice-studio/validate-v2.py"
      - "kids/**"
      - "cloudflare/kids-content-media.js"
      - "cloudflare/worker.js"
      - "cloudflare/voice-studio-web.js"
      - "cloudflare/voice-studio-gpu-gateway.js"
      - "cloudflare/site-router.js"
      - "cloudflare/test-app-worker.js"
      - "wrangler.test.toml"
      - "scripts/test-app-health-check.js"
      - "_headers"
      - ".github/workflows/voice-studio-v2-validate.yml"
  pull_request:
    paths:
      - "voice-studio/**"
      - "data/pronunciation/pronunciation-rules.json"
      - "data/pronunciation/voice-production-profile.json"
      - "data/pronunciation/islamic-master-library.json"
      - "data/pronunciation/voice-regression-fixtures.json"
      - "scripts/voice-studio/validate-v2.py"
      - "kids/**"
      - "cloudflare/kids-content-media.js"
      - "cloudflare/worker.js"
      - "cloudflare/voice-studio-web.js"
      - "cloudflare/voice-studio-gpu-gateway.js"
      - "cloudflare/site-router.js"
      - "cloudflare/test-app-worker.js"
      - "wrangler.test.toml"
      - "scripts/test-app-health-check.js"
      - "_headers"
      - ".github/workflows/voice-studio-v2-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate cloud GPU bridge
        run: |
          node --check cloudflare/voice-studio-gpu-gateway.js
          node --check cloudflare/voice-studio-web.js
          bash -n voice-studio/cloud-gpu/start.sh
          bash -n voice-studio/cloud-gpu/bootstrap.sh
          python -m py_compile voice-studio/local-engine.py
          grep -q 'FROM pytorch/pytorch:' voice-studio/cloud-gpu/Dockerfile
          grep -q 'gpus: all' voice-studio/cloud-gpu/docker-compose.yml
          grep -q 'reverse_proxy voice:8787' voice-studio/cloud-gpu/Caddyfile
          grep -q 'chatterbox-tts' voice-studio/cloud-gpu/Dockerfile
          grep -q 'DAR_VOICE_DEVICE=cuda' voice-studio/cloud-gpu/Dockerfile
          python - <<'PY'
          from pathlib import Path
          import json

          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          gateway=Path("cloudflare/voice-studio-gpu-gateway.js").read_text(encoding="utf-8")
          web=Path("cloudflare/voice-studio-web.js").read_text(encoding="utf-8")
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          router=Path("cloudflare/site-router.js").read_text(encoding="utf-8")
          manifest=json.loads(Path("voice-studio/version.json").read_text(encoding="utf-8"))
          pwa=json.loads(Path("voice-studio/manifest.webmanifest").read_text(encoding="utf-8"))
          sw=Path("voice-studio/sw-v11.js").read_text(encoding="utf-8")

          required_engine=[
              'torch.cuda.is_available()',
              'DAR_VOICE_DEVICE',
              'DAR_VOICE_PORT',
              'DAR_VOICE_NETWORK_MODE',
              'DAR_VOICE_PAIR_TOKEN',
          ]
          missing=[x for x in required_engine if x not in engine]
          if missing:
              raise SystemExit("Remote CUDA engine markers missing: "+", ".join(missing))

          required_gateway=[
              'DAR_VOICE_GPU_ORIGIN',
              'DAR_VOICE_GPU_TOKEN',
              'DAR_VOICE_WEB_TOKEN',
              'X-DAR-Voice-Token',
              'X-DAR-Voice-Access',
              'X-DAR-Voice-Transport',
          ]
          missing=[x for x in required_gateway if x not in gateway]
          if missing:
              raise SystemExit("Cloud GPU gateway markers missing: "+", ".join(missing))

          if 'rest === "/engine" || rest.startsWith("/engine/")' not in web:
              raise SystemExit("Voice web worker does not route /engine to remote GPU")
          if 'REMOTE_ENGINE_API="/voice-studio/api/engine"' not in html:
              raise SystemExit("Public Voice PWA same-origin engine endpoint missing")
          if 'dar.voice.cloud.access.v1' not in html or 'X-DAR-Voice-Access' not in html:
              raise SystemExit("Public Voice PWA owner-access flow missing")
          if 'const VOICE_API_ORIGIN = "https://dar-admin-publisher.sero91ak.workers.dev";' not in router or 'proxyVoiceApi(request, url)' not in router:
              raise SystemExit("Public site router does not proxy Voice API to admin gateway")
          if 'target.searchParams.set("cloud", "1")' not in router:
              raise SystemExit("/voice shortcut does not activate cloud mode")
          cloud=manifest.get("cloudVoiceApp") or {}
          if not cloud.get("enabled") or cloud.get("localIpRequired") is not False:
              raise SystemExit("version.json cloudVoiceApp contract missing")
          if pwa.get("start_url") != "/voice-studio/?app=1&cloud=1":
              raise SystemExit("Installed Voice PWA does not reopen in cloud mode")
          if 'const CACHE="dar-voice-studio-v50";' not in sw:
              raise SystemExit("Voice PWA cache was not bumped for cloud manifest")
          print("DĀR Voice cloud GPU bridge OK")
          PY

      - name: Validate Mac installer shell syntax
        run: |
          bash -n voice-studio/install-mac.command
          bash -n voice-studio/update-mac.command

      - name: Validate Voice Studio app identity asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import struct

          icon=Path("voice-studio/voice-studio-icon.png")
          if not icon.exists() or icon.stat().st_size < 10000:
              raise SystemExit("Dedicated Voice Studio icon missing or still using the old placeholder asset")
          data=icon.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Voice Studio icon is not a PNG")
          width,height=struct.unpack(">II",data[16:24])
          if width < 160 or height < 160 or width != height:
              raise SystemExit(f"Voice Studio icon must be square and at least 256 px, got {width}x{height}")
          # The approved microphone/headphone production icon is optimized for the
          # native splash/header source and is also regenerated into AppIcon.icns.
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          if '<div class="brand-mark"><img src="voice-studio-icon.png' not in html:
              raise SystemExit("Voice Studio header does not render the dedicated logo")
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          required=[
              "voice-studio/voice-studio-icon.png",
              "VoiceStudioIcon.png",
              "AppIcon.icns",
              "CFBundleIconFile",
              "CFBundleIconName",
              "AppIcon.icns",
              'BUNDLE_EXECUTABLE="DARVoiceStudio"',
              'single-engine launcher',
              'PlistBuddy -c "Set :CFBundleExecutable $BUNDLE_EXECUTABLE"',
              'killall Dock',
              "2.9.26",
          ]
          missing=[x for x in required if x not in installer]
          if missing:
              raise SystemExit("Installer identity integration missing: "+", ".join(missing))
          print("Voice Studio app identity OK",width,height,icon.stat().st_size)
          PY

      - name: Validate native macOS Dock icon binding
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          required=[
              'BUNDLE_EXECUTABLE="DARVoiceStudio"',
              'single-engine launcher',
              'CFBundleIconFile</key><string>AppIcon.icns',
              'CFBundleIconName</key><string>AppIcon',
              'Set :CFBundleExecutable $BUNDLE_EXECUTABLE',
              'touch "$APP"',
              'killall Dock',
              '"$LSREGISTER" -f "$APP"',
          ]
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit("Native Dock icon binding missing: "+", ".join(missing))
          print("Native macOS Dock icon binding OK")
          PY

      - name: Validate Voice Studio 2.9.68 stability architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          swift=Path("voice-studio/VoiceStudioApp.swift").read_text(encoding="utf-8")
          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")

          assert 'BUNDLE_EXECUTABLE="DARVoiceStudio"' in installer
          assert 'single-engine launcher' in installer
          assert '<key>KeepAlive</key><true/>' not in installer
          assert 'launchctl kickstart -k' not in installer
          assert 'Engine-Start wird der Voice-Studio-App überlassen' in installer
          assert 'DAR_VOICE_ENGINE_OWNER=launcher' in installer

          assert 'if !userInitiated' not in swift or 'installAvailableUpdate()' not in swift.split('if !userInitiated',1)[-1][:250]
          assert 'Installation nur nach deinem Klick' in swift
          assert 'externalEngineOwner' in swift

          assert 'DAR_VOICE_DEV_UI_SYNC' in engine
          assert 'threading.Thread(target=refresh_studio_ui_from_github' in engine
          assert 'if os.environ.get("DAR_VOICE_DEV_UI_SYNC","0").strip()=="1"' in engine

          print("Voice Studio 2.9.68 stability architecture OK")
          PY

      - name: Validate in-app updater package
        run: |
          python - <<'PY'
          from pathlib import Path

          helper=Path("voice-studio/update-mac.command").read_text(encoding="utf-8")
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          swift=Path("voice-studio/VoiceStudioApp.swift").read_text(encoding="utf-8")

          helper_required=[
              "api.github.com/repos/Sero91ak/dar-al-tawhid-site/contents/voice-studio/install-mac.command?ref=main",
              "application/vnd.github.raw+json",
              "DAR-Voice-Studio-Updater",
              "nohup /bin/bash",
              "update.log",
              "bash -n",
              "run-update.command",
              "UPDATE-FEHLER",
              "Voice Studio wurde nicht ersetzt",
          ]
          installer_required=[
              'REPO_API="https://api.github.com/repos/Sero91ak/dar-al-tawhid-site"',
              'download_repo_file()',
              'application/vnd.github.raw+json',
              'DAR-Voice-Studio-Installer',
              'RELEASE_MANIFEST_URL=',
              'plutil -extract releaseRef raw',
              'Ungültige oder fehlende validierte Release-Referenz',
              'pkill -TERM -x DARVoiceStudioNative',
              'download_repo_file "voice-studio/update-mac.command"',
              'download_repo_file "voice-studio/alphabet-audio-studio.js"',
              "chmod +x \"$TARGET/update-mac.command\"",
              "CFBundleShortVersionString</key><string>2.9.26",
          ]
          html_required=[
              'id="updateBtn"',
              'id="appUpdateState"',
              'darUpdater',
              'darUpdateStateChanged',
              'requestNativeUpdate',
              'Update wird installiert',
          ]
          swift_required=[
              'name: "darUpdater"',
              "updateManifestURL",
              "api.github.com/repos/Sero91ak/dar-al-tawhid-site/contents/voice-studio/version.json?ref=main",
              'application/vnd.github.raw+json',
              'DAR-Voice-Studio-Updater',
              "checkForUpdates",
              "checkUpdateWithSystemCurl",
              "/usr/bin/curl",
              "--connect-timeout",
              "--max-time",
              "installAvailableUpdate",
              "openUpdateLog",
              "update.log",
              "Update-Protokoll öffnen",
              "update-mac.command",
              'DĀRVoiceStudioMac/2.9.26',
          ]

          groups=[
              ("helper",helper,helper_required),
              ("installer",installer,installer_required),
              ("html",html,html_required),
              ("swift",swift,swift_required),
          ]
          errors=[]
          for label,source,required in groups:
              missing=[x for x in required if x not in source]
              if missing:
                  errors.append(label+": "+", ".join(missing))
          if errors:
              raise SystemExit("In-app updater validation failed: "+" | ".join(errors))

          for label,source in [("helper",helper),("installer",installer),("html",html),("swift",swift)]:
              if "raw.githubusercontent.com/Sero91ak/dar-al-tawhid-site" in source:
                  raise SystemExit(label+" still depends on failing raw.githubusercontent.com transport")
          if "api.github.com/repos/Sero91ak/dar-al-tawhid-site/contents/voice-studio/install-mac.command?ref=main" not in html:
              raise SystemExit("UI bootstrap command must use GitHub Contents API")
          if 'PIN="' in installer and 'PIN=""' not in installer:
              raise SystemExit("Installer must not hard-code a stale release PIN")
          if 'releaseRef' not in installer:
              raise SystemExit("Installer must resolve a validated releaseRef from version.json")
          print("In-app updater package OK")
          PY

      - name: Validate secure iPad companion mode
        run: |
          python - <<'PY'
          from pathlib import Path

          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          swift=Path("voice-studio/VoiceStudioApp.swift").read_text(encoding="utf-8")

          engine_required=[
              'NETWORK_MODE=os.environ.get("DAR_VOICE_NETWORK_MODE"',
              'PAIR_TOKEN=os.environ.get("DAR_VOICE_PAIR_TOKEN"',
              'HOST="0.0.0.0" if NETWORK_MODE and PAIR_TOKEN else "127.0.0.1"',
              'DARVOICE_PAIR=',
              'remote_authorized',
              'accept_pairing_url',
              'hmac.compare_digest',
              '"pairing_required":True',
              '"companion_mode":bool(NETWORK_MODE and PAIR_TOKEN)',
              '"start_url":"/studio/?pair="+PAIR_TOKEN',
              'http://127.0.0.1:{PORT}/health',
          ]
          installer_required=[
              'PAIR_TOKEN_FILE="$TARGET/ipad-pairing-token.txt"',
              'uuidgen',
              'DAR_VOICE_NETWORK_MODE=1',
              'DAR_VOICE_PAIR_TOKEN="$PAIR_TOKEN"',
              'single-engine launcher',
          ]
          html_required=[
              'const IS_ENGINE_ORIGIN=',
              'const IS_COMPANION=',
              'id="companionBtn"',
              'id="companionPill"',
              'darCompanion',
              'Companion-Modus',
              'Zum Home-Bildschirm',
              '@media(min-width:800px) and (max-width:1180px)',
          ]
          swift_required=[
              'name: "darCompanion"',
              'ipad-pairing-token.txt',
              'localIPv4Address',
              'companionPairingURL',
              'showCompanionPairing',
              'CIQRCodeGenerator',
              'Link kopieren',
              'DAR_VOICE_NETWORK_MODE',
              'DAR_VOICE_PAIR_TOKEN',
          ]

          groups=[
              ("engine",engine,engine_required),
              ("installer",installer,installer_required),
              ("html",html,html_required),
              ("swift",swift,swift_required),
          ]
          errors=[]
          for label,source,required in groups:
              missing=[x for x in required if x not in source]
              if missing:
                  errors.append(label+": "+", ".join(missing))
          if errors:
              raise SystemExit("Companion validation failed: "+" | ".join(errors))

          # /health may report only whether companion mode is enabled.
          # It must never serialize or return the actual secret value.
          health_segment=engine[engine.index('if p=="/health"'):engine.index('elif p=="/status"')]
          forbidden=[
              '"pair_token":PAIR_TOKEN',
              '"pairToken":PAIR_TOKEN',
              '"token":PAIR_TOKEN',
              '"pair":PAIR_TOKEN',
          ]
          leaked=[x for x in forbidden if x in health_segment]
          if leaked:
              raise SystemExit("PAIR_TOKEN value must never be exposed by /health: "+", ".join(leaked))
          if '"companion_mode":bool(NETWORK_MODE and PAIR_TOKEN)' not in health_segment:
              raise SystemExit("/health should expose only the companion-mode boolean")
          print("Secure iPad/iPhone companion mode OK")
          PY

      - name: Validate zero-detour Content Studio workflow
        run: |
          node --check voice-studio/content-studio.js
          node --check voice-studio/alphabet-audio-studio.js
          python - <<'PY'
          from pathlib import Path
          src=Path("voice-studio/content-studio.js").read_text(encoding="utf-8")
          required=[
              'data-cs-step="text"',
              'data-cs-step="audio"',
              'data-cs-step="cover"',
              'data-cs-step="test"',
              'data-cs-step="live"',
              'function renderWorkflow()',
              'function goToWorkflowStep(step)',
              'function focusNextProductionAction()',
              'setTimeout(focusNextProductionAction,120)',
              'setTimeout(()=>goToWorkflowStep("live"),100)',
              'window.DarContentStudio={',
              'staleAudio',
          ]
          # The actual stale-audio guard is structural; do not rely on a label.
          required.remove('staleAudio')
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit("Zero-detour workflow markers missing: "+", ".join(missing))
          if 'document.addEventListener("keydown"' in src:
              raise SystemExit("Content Studio must not install a duplicate global production shortcut handler")
          if 'audioAsset=null;' not in src or 'stagingPublished=false;' not in src:
              raise SystemExit("Text edits must invalidate stale production assets/status")
          print("Zero-detour Content Studio workflow OK")
          PY

      - name: Detect Kids validation scope
        id: validation_scope
        shell: bash
        run: |
          changed="$(git show --pretty='' --name-only HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(kids/|cloudflare/(kids-content-media|worker|site-router|test-app-worker)\.js$|wrangler\.test\.toml$|scripts/test-app-health-check\.js$|_headers$)'; then
            echo "kids=true" >> "$GITHUB_OUTPUT"
          else
            echo "kids=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Kids recitation grading route
        if: steps.validation_scope.outputs.kids == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          worker=Path("cloudflare/test-app-worker.js").read_text(encoding="utf-8")
          router=Path("cloudflare/site-router.js").read_text(encoding="utf-8")
          wrangler=Path("wrangler.test.toml").read_text(encoding="utf-8")
          health=Path("scripts/test-app-health-check.js").read_text(encoding="utf-8")
          required_worker=[
              '"/kids/api/recitation/grade"',
              "gradeKidsRecitation",
              "@cf/openai/whisper-large-v3-turbo",
              "language: \"ar\"",
              "pronunciationReference: false",
              "audio_size_invalid",
              '.replace(/ة/g, "ه")',
          ]
          required_router=[
              'url.pathname === "/kids/api/recitation/grade"',
              "request.method === \"POST\"",
              "dar-al-tawhid-test.sero91ak.workers.dev",
              "kids_recitation_proxy_failed",
          ]
          required_wrangler=['[ai]','binding = "AI"']
          failures=[]
          for marker in required_worker:
              if marker not in worker: failures.append("worker missing "+marker)
          for marker in required_router:
              if marker not in router: failures.append("router missing "+marker)
          for marker in required_wrangler:
              if marker not in wrangler: failures.append("wrangler missing "+marker)
          if "@cf/openai/whisper-large-v3-turbo" not in health:
              failures.append("health check does not guard ASR model")
          if failures:
              raise SystemExit("Kids recitation route validation failed:\n- "+"\n- ".join(failures))
          print("Kids recitation grading route OK")
          PY

      - name: Validate Kids release coherence
        if: steps.validation_scope.outputs.kids == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          version=json.loads(Path("kids/version.json").read_text(encoding="utf-8"))
          build=str(version.get("buildId") or "").strip()
          label=str(version.get("label") or "").strip()
          build_match=re.fullmatch(r"kids-shell-v(\d+)-[a-z][a-z0-9-]*?(\d+)",build)
          if not build_match:
              raise SystemExit("Invalid Kids buildId: "+build)
          if not re.search(r"V\d+\.\d+(?:\.\d+)?",label):
              raise SystemExit("Invalid Kids label: "+label)
          # Der Cache folgt der kanonischen numerischen Build-Suffix-ID.
          # Damit bleiben historische und aktuelle versionierte Build-Tracks konsistent.
          cache_suffix=build_match.group(2)

          required_build_files=[
              "kids/index.html",
              "kids/start.html",
              "kids/shell.html",
              "kids/manifest.webmanifest",
              "cloudflare/site-router.js",
              "cloudflare/test-app-worker.js",
              "_headers",
              "kids/v12-alive.txt",
          ]
          failures=[]
          for name in required_build_files:
              src=Path(name).read_text(encoding="utf-8")
              if build not in src:
                  failures.append(name+" missing "+build)

          for name in ("kids/index.html","kids/start.html","kids/shell.html"):
              src=Path(name).read_text(encoding="utf-8")
              ids=set(re.findall(r'kids-shell-v\d+-[a-z][a-z0-9-]*\d+',src))
              if ids != {build}:
                  failures.append(name+" has inconsistent embedded build ids: "+repr(sorted(ids)))

          sw=Path("kids/sw.js").read_text(encoding="utf-8")
          expected_cache="dar-al-tawhid-kids-v"+cache_suffix
          if expected_cache not in sw:
              failures.append("kids/sw.js missing "+expected_cache)

          router=Path("cloudflare/site-router.js").read_text(encoding="utf-8")
          worker=Path("cloudflare/test-app-worker.js").read_text(encoding="utf-8")
          if label not in router:
              failures.append("site-router version response missing "+label)
          if label not in worker:
              failures.append("test-app-worker version response missing "+label)

          if failures:
              raise SystemExit("Kids release coherence failed:\n- "+"\n- ".join(failures))
          print("Kids release coherent",build,label,expected_cache)
          PY

      - name: Validate independent Kids quiz
        if: steps.validation_scope.outputs.kids == 'true'
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          quiz_path=Path("kids/data/quiz-kids.json")
          quiz=json.loads(quiz_path.read_text(encoding="utf-8"))
          kids=Path("kids/index.html").read_text(encoding="utf-8")
          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          studio=Path("voice-studio/content-studio.js").read_text(encoding="utf-8")
          admin=Path("cloudflare/kids-content-admin.js").read_text(encoding="utf-8")
          sw=Path("kids/sw.js").read_text(encoding="utf-8")

          errors=[]
          items=quiz.get("items") or []
          if quiz.get("namespace")!="dar-kids-quiz":
              errors.append("Kids quiz namespace missing")
          if quiz.get("adultQuizDependency") is not False:
              errors.append("Kids quiz must be independent from adult quiz")
          total=len(items)
          if total<50 or total%50!=0:
              errors.append(f"Kids quiz must grow in complete 50-question packs, got {total}")
          packs=total//50 if total>=50 else 0
          if "canonicalQuizId" in quiz_path.read_text(encoding="utf-8"):
              errors.append("adult canonicalQuizId coupling returned")

          ids=set()
          band_counts={"4-6":0,"7-8":0,"9-10":0}
          expected_ranges={"4-6":(4,6),"7-8":(7,8),"9-10":(9,10)}
          for item in items:
              qid=str(item.get("id") or "")
              if not re.fullmatch(r"kids-quiz-\d{3}",qid):
                  errors.append("invalid Kids quiz id: "+qid)
              if qid in ids:
                  errors.append("duplicate Kids quiz id: "+qid)
              ids.add(qid)
              band=str(item.get("ageBand") or "")
              if band not in expected_ranges:
                  errors.append(qid+" invalid ageBand "+band)
              else:
                  band_counts[band]+=1
                  if (int(item.get("ageMin") or 0),int(item.get("ageMax") or 0))!=expected_ranges[band]:
                      errors.append(qid+" age range does not match "+band)
              if item.get("status")!="published" or item.get("reviewStatus")!="approved" or item.get("verification")!="approved":
                  errors.append(qid+" is not fully approved/published")
              answers=item.get("answers") or []
              if len(answers)<2 or sum(1 for a in answers if a.get("correct") is True)!=1:
                  errors.append(qid+" must have exactly one correct answer")
              if not str(item.get("question") or "").strip():
                  errors.append(qid+" question missing")
              if not str(item.get("source") or "").strip():
                  errors.append(qid+" source missing")

          expected_counts={"4-6":18*packs,"7-8":16*packs,"9-10":16*packs}
          for band,count in expected_counts.items():
              if band_counts.get(band,0)!=count:
                  errors.append(f"{band} must have {count} questions for {packs} complete packs, got {band_counts.get(band,0)}")

          normalized_questions={}
          for item in items:
              question=" ".join(str(item.get("question") or "").strip().lower().split())
              number=item.get("number")
              if question in normalized_questions:
                  errors.append(f"duplicate Kids quiz question: {normalized_questions[question]} and {number}: {item.get('question')}")
              elif question:
                  normalized_questions[question]=number
          declared=quiz.get("counts") or {}
          if int(declared.get("total") or 0)!=len(items):
              errors.append("Kids quiz declared total does not match items")
          for band,count in band_counts.items():
              if int(declared.get(band) or 0)!=count:
                  errors.append(f"Kids quiz declared count mismatch for {band}")

          runtime_required=[
              'data-quiz-age="4-6"',
              'data-quiz-age="7-8"',
              'data-quiz-age="9-10"',
              'q.status==="published"',
              'q.reviewStatus==="approved"',
              'data.namespace!=="dar-kids-quiz"',
              'data.adultQuizDependency!==false',
              'DARKidsOwnerVoice.play',
              'Audio wird vorbereitet',
              'dar-kids-owner-voice-missing',
              'function normalizeStudioQuizItems',
              '"/content/kids/content-index.json',
              'studioContentId',
          ]
          for x in runtime_required:
              if x not in kids:
                  errors.append("Kids runtime missing "+x)
          if "q.canonicalStatus" in kids or "q.canonicalReviewStatus" in kids:
              errors.append("adult quiz approval fields returned to Kids runtime")

          engine_required=[
              'def _quiz_voice_texts',
              'age_band=="4-6"',
              'def build_kids_owner_voice_sync',
              'name="dar-kids-owner-voice-auto"',
              'if p=="/kids-voice/sync-start"',
              'quiz_age_bands.append("4-6")',
              'quiz_age_bands.append("7-8")',
              'quiz_age_bands.append("9-10")',
          ]
          for x in engine_required:
              if x not in engine:
                  errors.append("Voice engine missing "+x)

          studio_required=[
              'id="csQuizAgeBand"',
              'function quizBandForRange',
              'function setQuizAgeBand',
              'explanation:',
              'triggerKidsOwnerVoiceSync',
              'ageBand:studioKind==="quiz"',
          ]
          for x in studio_required:
              if x not in studio:
                  errors.append("Content Studio quiz bridge missing "+x)

          admin_required=[
              'Kids-Quiz braucht exakt eine Altersstufe: 4–6, 7–8 oder 9–10',
              'Kids-Quiz braucht mindestens eine konkrete Quelle',
              '4–6 braucht genau zwei einfache Antworten',
              'explanation: clean(q?.explanation',
          ]
          for x in admin_required:
              if x not in admin:
                  errors.append("Kids content admin quiz guard missing "+x)

          sw_required=[
              'url.pathname==="/kids/data/quiz-kids.json"',
              'url.pathname==="/kids/data/quiz-audio.json"',
              'url.pathname==="/kids/data/owner-voice-audio.json"',
              'event.respondWith(networkFirst(request))',
          ]
          for x in sw_required:
              if x not in sw:
                  errors.append("Service worker quiz freshness missing "+x)

          if errors:
              raise SystemExit("Independent Kids quiz validation failed:\n- "+"\n- ".join(errors))
          print("Independent Kids quiz OK",len(items),band_counts)
          PY

      - name: Validate strict Alif-Ba audio workflow
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html=Path("voice-studio/index.html").read_text(encoding="utf-8")
          studio=Path("voice-studio/alphabet-audio-studio.js").read_text(encoding="utf-8")
          installer=Path("voice-studio/install-mac.command").read_text(encoding="utf-8")
          engine=Path("voice-studio/local-engine.py").read_text(encoding="utf-8")
          kids=Path("kids/index.html").read_text(encoding="utf-8")
          manifest=Path("kids/data/alphabet-audio.json").read_text(encoding="utf-8")
          worker=Path("cloudflare/worker.js").read_text(encoding="utf-8")
          media=Path("cloudflare/kids-content-media.js").read_text(encoding="utf-8")

          groups=[
              ("html",html,[
                  'id="alphabetAudioSection"',
                  'id="alphabetPackReferenceBtn"',
                  'id="alphabetPackGenerateBtn"',
                  'id="alphabetPackRegenerateBtn"',
                  'id="alphabetPackApproveBtn"',
                  'id="alphabetPackPlayer"',
                  'id="alphabetPackNowPlaying"',
                  'id="alphabetPublisherState"',
                  'Serhat-Kandidat erzeugen',
                  'Sprachlich korrekt bestätigen',
                  'kein Cloudflare-/GitHub-Code erforderlich',
                  'alphabet-audio-studio.js?v=2914',
              ]),
              ("studio",studio,[
                  '/alphabet/preview',
                  '/alphabet/confirm',
                  '/alphabet/review-approve',
                  '/alphabet/state',
                  'Serhat-Kandidat',
                  'candidateHeard',
                  'linguisticVerified',
                  'serhat-owner-voice-2026',
                  'kein Cloudflare-/GitHub-Code erforderlich',
                  'sprachlich bestätigt',
              ]),
              ("worker",worker,[
                  'verifyKidsAlphabetAudioSlot',
                  '/api/admin/kids-alphabet-audio/verify',
              ]),
              ("media",media,[
                  'export async function verifyKidsAlphabetAudioSlot',
                  'owner-confirmed-voice-studio',
                  'authorized-owner-voice',
                  'serhat-owner-voice-2026',
                  'DĀR Voice Studio',
                  'sameVoiceConfirmed = true',
              ]),
              ("installer",installer,[
                  'download_repo_file "voice-studio/alphabet-audio-studio.js"',
                  'alphabet-audio-studio.js',
              ]),
              ("engine",engine,[
                  '/studio/alphabet-audio-studio.js',
                  'alphabet-audio-studio.js',
                  'def create_alphabet_voice_preview',
                  'if p=="/alphabet/preview"',
                  'serhat-local-owner-voice',
              ]),
              ("kids",kids,[
                  'alphabet-audio.json?v=6',
                  'audioEvidenceComplete',
                  'PROGRESS_KEY="kids.alphabet.progress.v2."',
                  'reviewBucket',
                  'reviewQueueMode',
                  'lastMistakeAt',
                  'if(entry.stage==="secure")return 30;',
                  'Keine Wiederholung fällig',
                  'QUIZ_PROGRESS_PREFIX="kids.quiz.progress.v2."',
                  'function quizPriority(id,now)',
                  'recordQuizAttempt(q.id,!quizQuestionHadError)',
                  'STORY_PROGRESS_PREFIX="kids.story.progress.v2."',
                  'recordStoryAttempt(currentStoryKey,!storyQuestionHadError)',
                  'storyQuestionHadError=true',
                  'DUA_PROGRESS_PREFIX="kids.dua.progress.v2."',
                  'recordDuaAttempt(d.id,!duaQuestionHadError)',
                  'duaQuestionHadError=true',
                  'QURAN_PROGRESS_PREFIX="kids.quran.progress.v2."',
                  'recordQuranAttempt(!ayahPracticeHadError)',
                  'setTimeout(openDailyQuran,220)',
                  'startMeter(stream);',
                  'AbortController',
                  'Die Wortprüfung hat zu lange gedauert',
              ]),
              ("manifest",manifest,[
                  '"syntheticFallback": false',
                  '"requireExplicitVerification": true',
                  '"voiceMode": "owner-voice-generated-linguistic-review-required"',
                  '"targetVoiceProfileId": "serhat-owner-voice-2026"',
                  '"authorizedOwnerVoiceGeneration": true',
                  '"requireHumanApprovalForGeneratedAudio": true',
                  '"autoPublishGeneratedAudio": false',
                  '"pronunciationReferenceId": "eiarabe-alif-2026"',
                  '"mixedSpeakersForbidden": true',
              ]),
          ]
          errors=[]
          for label,source,required in groups:
              missing=[x for x in required if x not in source]
              if missing:
                  errors.append(label+": "+", ".join(missing))

          for forbidden in [
              'speechSynthesis',
              'lang:"ar-SA"',
              'autoPublishGeneratedAudio": true',
          ]:
              if forbidden in studio:
                  errors.append("unsafe alphabet generation path remains in studio: "+forbidden)

          forbidden_kids=[x for x in ['function speakArabic','lang:"ar-SA"'] if x in kids]
          if forbidden_kids:
              errors.append("kids system Arabic TTS fallback remains: "+", ".join(forbidden_kids))
          if 'if(e.stage==="secure")continue;' in kids:
              errors.append("secure alphabet items are still skipped forever instead of becoming due again")
          if 'Math.min(5,quizMastery(id)+1)' in kids:
              errors.append("legacy one-shot quiz mastery increment returned")
          if 'localStorage.setItem("kids.story."+currentStoryKey,"1")' in kids:
              errors.append("legacy one-shot story mastery returned")
          if 'localStorage.setItem("kids.dua."+d.id,"1")' in kids:
              errors.append("legacy one-shot Dua mastery returned")
          if 'recordQuranAttempt(!ayahPracticeHadError)' not in kids:
              errors.append("spaced Quran ayah mastery missing")
          if 'if(!candidateHeard)' not in studio:
              errors.append("Serhat alphabet candidate full-listen gate missing")
          if 'p.onended=()=>{' not in studio or 'candidateHeard=true;' not in studio:
              errors.append("alphabet candidate completion state missing")

          manifest_obj=json.loads(manifest)
          active_verified=[]
          for letter_id,letter in manifest_obj.get("letters",{}).items():
              slot_items=[("name",letter.get("name")),("word",letter.get("word"))]
              slot_items += [("harakat."+k,v) for k,v in (letter.get("harakat") or {}).items()]
              for slot_kind,slot in slot_items:
                  if isinstance(slot,dict) and slot.get("verified") is True and slot.get("url"):
                      active_verified.append((letter_id,slot_kind,slot))

          pronunciation_anchor=manifest_obj.get("policy",{}).get("pronunciationReferenceId")
          if pronunciation_anchor!="eiarabe-alif-2026":
              errors.append("Alif pronunciation reference id mismatch")

          for letter_id,slot_kind,slot in active_verified:
              owner_voice=(
                  slot.get("sourceVoice")=="authorized-owner-voice" and
                  slot.get("voiceProfileId")=="serhat-owner-voice-2026" and
                  slot.get("sameVoiceConfirmed") is True and
                  str(slot.get("sourceProvider","")).startswith("DĀR Voice Studio") and
                  slot.get("sourceSpeaker")=="Serhat Abu Malik" and
                  slot.get("technicalQaPassed") is True and
                  slot.get("linguisticVerified") is True and
                  slot.get("reviewStatus")=="approved"
              )
              legacy_reference=(
                  letter_id=="alif" and slot_kind=="name" and
                  slot.get("voiceProfileId")=="eiarabe-alif-2026" and
                  slot.get("sourceProvider")=="Wikimedia Commons / Escuela Internacional de Árabe" and
                  slot.get("sourceSpeaker")=="Eiarabe"
              )
              if not (owner_voice or legacy_reference):
                  errors.append(f"unapproved active alphabet voice: {letter_id} {slot_kind}")

          policy=manifest_obj.get("policy",{})
          if policy.get("voiceMode")!="owner-voice-generated-linguistic-review-required":
              errors.append("owner-voice linguistic-review alphabet policy missing")
          if policy.get("linguisticReviewRequired") is not True:
              errors.append("alphabet linguistic review requirement missing")
          if policy.get("technicalQaIsNotPronunciationVerification") is not True:
              errors.append("technical QA must not equal pronunciation verification")
          if policy.get("targetVoiceProfileId")!="serhat-owner-voice-2026":
              errors.append("Serhat target voice id mismatch")
          if policy.get("authorizedOwnerVoiceGeneration") is not True:
              errors.append("owner-voice generation authorization marker missing")
          if policy.get("requireHumanApprovalForGeneratedAudio") is not True:
              errors.append("human approval requirement missing")
          if policy.get("autoPublishGeneratedAudio") is not False:
              errors.append("alphabet generated audio must never auto-publish")
          if policy.get("mixedSpeakersForbidden") is not True:
              errors.append("mixed-speaker protection missing")

          if errors:
              raise SystemExit("Strict Alif-Ba audio validation failed: "+" | ".join(errors))
          print("Strict Alif-Ba audio workflow OK; active clips:",len(active_verified))
          PY

      - name: Compile Voice Engine
        run: python -m py_compile voice-studio/local-engine.py

      - name: Smoke-test Voice Engine runtime state
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, tempfile
          from pathlib import Path

          root=Path.cwd()
          tmp=Path(tempfile.mkdtemp(prefix="dar-voice-smoke-"))
          app=tmp/"studio"
          home=tmp/"home"
          app.mkdir(parents=True)
          home.mkdir(parents=True)
          shutil.copy2(root/"data/pronunciation/pronunciation-rules.json",app/"pronunciation-rules.json")
          shutil.copy2(root/"data/pronunciation/voice-production-profile.json",app/"voice-production-profile.json")
          shutil.copy2(root/"data/pronunciation/islamic-master-library.json",app/"islamic-master-library.json")
          os.environ["DAR_VOICE_APP_HOME"]=str(app)
          os.environ["HOME"]=str(home)

          spec=importlib.util.spec_from_file_location("dar_voice_engine_smoke",root/"voice-studio/local-engine.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          assert mod.HOST == "127.0.0.1", mod.HOST
          assert mod.NETWORK_MODE is False
          assert mod.PAIR_TOKEN == ""

          # Companion authorization is deny-by-default and token-gated on LAN.
          remote=object.__new__(mod.H)
          remote.client_address=("192.168.50.20",54321)
          remote.headers={}
          remote.path="/health"
          assert remote.remote_authorized() is False

          mod.NETWORK_MODE=True
          mod.PAIR_TOKEN="0123456789abcdef"
          assert remote.remote_authorized() is False
          remote.headers={"Cookie":"DARVOICE_PAIR=0123456789abcdef"}
          assert remote.remote_authorized() is True
          remote.headers={"Cookie":"DARVOICE_PAIR=wrong"}
          assert remote.remote_authorized() is False

          loopback=object.__new__(mod.H)
          loopback.client_address=("127.0.0.1",12345)
          loopback.headers={}
          loopback.path="/health"
          assert loopback.remote_authorized() is True

          status=mod.get_status()
          assert isinstance(status,dict)
          assert "audio_lock_pending" in status
          assert isinstance(status["audio_lock_pending"],list)
          assert hasattr(mod,"AUDIO_LOCK_STATE_LOCK")
          assert hasattr(mod,"PENDING_AUDIO_LOCKS")
          assert hasattr(mod,"PENDING_AUDIO_RENDER_ID")
          state=mod.learning_state()
          assert state["masterEntries"] >= 25, state
          assert state["masterProphets"] >= 25, state
          prepared,found=mod.prepare("Mūsā und ʿĀʾišah")
          assert "مُوسَى" in prepared, prepared
          assert "عَائِشَة" in prepared, prepared
          assert "رَضِيَ اللَّهُ عَنْهَا" in prepared, prepared
          assert mod.detect_unresolved_islamic_terms("Mūsā sagte") == []
          unknown=mod.detect_unresolved_islamic_terms("ʿAbdulx al-Majhūl sagte")
          assert unknown, unknown
          print("Voice Engine runtime smoke OK",state["masterEntries"],state["masterProphets"])
          PY

