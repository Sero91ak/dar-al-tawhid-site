name: Send Bibliothek PDF publication push

on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: "Publication ID (z. B. pub-20260728-001)"
        required: false
        default: "pub-20260728-001"
      slug:
        description: "Slug"
        required: false
        default: "die-pflichten-der-eltern-gegenuber-ihren-kindern"
      title:
        description: "Push-Text (Titel)"
        required: false
        default: "Die Pflichten der Eltern gegenüber ihren Kindern"
  push:
    branches:
      - main
    paths:
      - content/admin/push-triggers/library-publication-live.json

jobs:
  notify:
    name: Broadcast Bibliothek-PDF an Besucher
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: "https://dar-al-tawhid.de"
      ONESIGNAL_APP_ID: "786d7cd6-0455-4434-ab14-0c10a7bc6b1e"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve publication from trigger or inputs
        id: target
        run: |
          node <<'NODE'
          const fs = require("fs");
          const triggerPath = "content/admin/push-triggers/library-publication-live.json";
          let pub = {
            publicationId: process.env.INPUT_ID || "",
            slug: process.env.INPUT_SLUG || "",
            title: process.env.INPUT_TITLE || ""
          };
          if (fs.existsSync(triggerPath)) {
            const trigger = JSON.parse(fs.readFileSync(triggerPath, "utf8"));
            pub = {
              publicationId: pub.publicationId || trigger.publicationId || "",
              slug: pub.slug || trigger.slug || "",
              title: pub.title || trigger.title || ""
            };
          }
          if (!pub.publicationId && !pub.slug) {
            console.error("Keine Publication-ID/Slug");
            process.exit(1);
          }
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `publication_id=${pub.publicationId}\n`);
          fs.appendFileSync(out, `slug=${pub.slug}\n`);
          fs.appendFileSync(out, `title=${pub.title}\n`);
          console.log(JSON.stringify(pub));
          NODE
        env:
          INPUT_ID: ${{ github.event.inputs.publication_id }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          INPUT_TITLE: ${{ github.event.inputs.title }}

      - name: Send Bibliothek PDF push
        id: send
        env:
          ONESIGNAL_API_KEY_NEW: ${{ secrets.ONESIGNAL_API_KEY_NEW }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_API_KEY: ${{ secrets.ONESIGNAL_APP_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          LIBRARY_PUBLICATION_ID: ${{ steps.target.outputs.publication_id }}
          LIBRARY_PUBLICATION_SLUG: ${{ steps.target.outputs.slug }}
          LIBRARY_PUBLICATION_TITLE: ${{ steps.target.outputs.title }}
        run: node scripts/send-library-publication-push.js

      - name: Mark pending push sent when successful
        if: success()
        env:
          PUBLICATION_ID: ${{ steps.target.outputs.publication_id }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "content/admin/pending-pushes.json";
          const id = String(process.env.PUBLICATION_ID || "").trim();
          const key = id ? `lib:${id}` : "";
          if (!key || !fs.existsSync(path)) process.exit(0);
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          const item = data.pushes?.[key];
          if (!item) process.exit(0);
          const now = new Date().toISOString();
          data.pushes[key] = {
            ...item,
            status: "sent",
            sentAt: now,
            updatedAt: now,
            lastError: "",
            pushResult: {
              ...(item.pushResult || {}),
              target: "github-actions-library-publication-push",
              targetUrl: item.pushResult?.targetUrl || ""
            }
          };
          data.generated = now;
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          console.log(`Marked ${key} as sent`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/admin/pending-pushes.json
          git diff --cached --quiet || git commit -m "Mark library push ${{ steps.target.outputs.publication_id }} sent (GH Actions)"
          git push origin HEAD:main || echo "::warning::Pending-Status Commit/Push fehlgeschlagen"
