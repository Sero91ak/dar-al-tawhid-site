name: DĀR AL TAWḤĪD TV · Signed website APK (manual approval)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful TV Native QA run from main"
        required: true
        type: string
      expected_commit:
        description: "Exact SHA-40 of the successful TV QA build on main"
        required: true
        type: string
      expected_version_code:
        description: "Android TV package versionCode (must be newer than installed release)"
        required: true
        type: string
      device_test_confirmation:
        description: "Type ANDROID-TV-GERAETETEST-BESTANDEN after 10-foot/D-pad/audio/device checks"
        required: true
        type: string
      confirmation:
        description: "Type TV-APK-JETZT-FREIGEBEN to publish"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: dar-android-tv-website-publication
  cancel-in-progress: false

jobs:
  official-tv-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      EXPECTED_SHA: ${{ inputs.expected_commit }}
      EXPECTED_CODE: ${{ inputs.expected_version_code }}
      DEVICE_CHECK: ${{ inputs.device_test_confirmation }}
      RELEASE_CHECK: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deliberate release approval and source provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_CHECK" == "TV-APK-JETZT-FREIGEBEN" ]] || { echo "::error::Explicit owner release approval required"; exit 1; }
          [[ "$DEVICE_CHECK" == "ANDROID-TV-GERAETETEST-BESTANDEN" ]] || { echo "::error::Owner device parity acceptance required"; exit 1; }
          [[ "$SOURCE_RUN" =~ ^[0-9]{6,14}$ && "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          (( EXPECTED_CODE > 54 )) || { echo "::error::Version code must exceed legacy installed v54"; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_SHA" "$GITHUB_SHA" || { echo "::error::Not merged to main"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/tv-qa-run.json"
          jq -e --arg sha "$EXPECTED_SHA" '
            .conclusion == "success" and .status == "completed" and
            .head_sha == $sha and .head_branch == "main" and
            (.path | endswith("android-tv-native-qa.yml"))
          ' "$RUNNER_TEMP/tv-qa-run.json" >/dev/null || { echo "::error::Not a successful approved TV QA run from main"; exit 1; }
          jq -r '.run_started_at' "$RUNNER_TEMP/tv-qa-run.json" > "$RUNNER_TEMP/tv-build-time.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > "$RUNNER_TEMP/tv-artifacts.json"
          jq -e '[.artifacts[] | select(.name == "dar-al-tawhid-tv-parity-signed-candidate" and .expired == false and .size_in_bytes > 100000)] | length == 1' "$RUNNER_TEMP/tv-artifacts.json" >/dev/null || { echo "::error::Signed candidate artifact missing or expired"; exit 1; }
          code_max="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            sed -nE 's/^(tv-website|android-website)-v1\.([1-9][0-9]*)$/\2/p' |
            sort -nr | head -1)"
          code_max="${code_max:-0}"
          (( EXPECTED_CODE > code_max )) || { echo "::error::TV release version must increase (last $code_max)"; exit 1; }

      - name: Download signed TV-only candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tv-candidate" "$RUNNER_TEMP/verified-release"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name dar-al-tawhid-tv-parity-signed-candidate --dir "$RUNNER_TEMP/tv-candidate"
          candidate="$(find "$RUNNER_TEMP/tv-candidate" -type f -name tv-release.apk -size +100000c -print -quit)"
          test -n "$candidate" || { echo "::error::Signed APK not found"; exit 1; }
          cp "$candidate" "$RUNNER_TEMP/verified-release/dar-al-tawhid-tv.apk"

      - name: Verify signed package and continuity with installed public TV app
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$sdk/apksigner" && test -x "$sdk/aapt"
          apk="$RUNNER_TEMP/verified-release/dar-al-tawhid-tv.apk"
          "$sdk/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/tv-new-sig.txt"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/tv-new-badging.txt"
          grep -Fq "name='de.daraltawhid.tv'" "$RUNNER_TEMP/tv-new-badging.txt"
          grep -Fq "versionCode='$EXPECTED_CODE'" "$RUNNER_TEMP/tv-new-badging.txt"
          grep -Fq "versionName='0.2.$EXPECTED_CODE'" "$RUNNER_TEMP/tv-new-badging.txt"
          grep -Eq 'leanback-launchable-activity|android.software.leanback' "$RUNNER_TEMP/tv-new-badging.txt"
          curl -fsSL --retry 2 --max-time 120 \
            'https://github.com/Sero91ak/dar-al-tawhid-site/releases/download/android-website-v1.54/dar-al-tawhid-tv.apk' \
            -o "$RUNNER_TEMP/tv-legacy.apk"
          "$sdk/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/tv-legacy.apk" > "$RUNNER_TEMP/tv-legacy-sig.txt"
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/tv-new-sig.txt" | head -1)"
          old_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/tv-legacy-sig.txt" | head -1)"
          [[ -n "$new_cert" && "$new_cert" == "$old_cert" ]] || { echo "::error::TV signing certificate changed; this would break installed-app upgrades"; exit 1; }
          (cd "$RUNNER_TEMP/verified-release" && sha256sum dar-al-tawhid-tv.apk > SHA256SUMS.txt)

      - name: Publish one TV APK (NEVER publish or modify the phone APK)
        shell: bash
        run: |
          set -euo pipefail
          tag="tv-website-v1.$EXPECTED_CODE"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag already published"; exit 1
          fi
          {
            printf 'DĀR AL TAWḤĪD TV – offizielle signierte Android-TV-APK\n\n'
            printf 'TV_VERSION=0.2.%s\n' "$EXPECTED_CODE"
            printf 'BUILD_CREATED_AT=%s\n' "$(cat "$RUNNER_TEMP/tv-build-time.txt")"
            printf '\nSOURCE_RUN=%s\nSOURCE_SHA=%s\n' "$SOURCE_RUN" "$EXPECTED_SHA"
            printf '\nAndroid TV / Google TV and supported Fire TV models.\n'
            printf 'Only native Android TV APK. No phone, PWA, iOS or Kids changes.\n'
            printf 'Device testing and approval were required before publication.\n'
          } > "$RUNNER_TEMP/tv-release-notes.md"
          gh release create "$tag" \
            "$RUNNER_TEMP/verified-release/dar-al-tawhid-tv.apk" \
            "$RUNNER_TEMP/verified-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" \
            --title "DĀR AL TAWḤĪD TV 0.2.$EXPECTED_CODE" \
            --notes-file "$RUNNER_TEMP/tv-release-notes.md" --latest=false
          echo "TV APK published. /tv/ will discover this release after its approved website deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "The /tv.apk shortlink remains PINNED to v0.1.54 until separately audited/repointed." >> "$GITHUB_STEP_SUMMARY"
