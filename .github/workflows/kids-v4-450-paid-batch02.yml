name: KIDS V4 450 Paid Batch 02 (20 original MP3s)

on:
  pull_request:
    branches: [main]
    paths:
      - 'kids/tools/generate_quiz_v4_450_paid_batch02.py'
      - '.github/workflows/kids-v4-450-paid-batch02.yml'

permissions:
  contents: write

concurrency:
  group: tawhid-kids-v4-450-batch02-paid-once
  cancel-in-progress: false

jobs:
  produce-20-originals:
    if: github.event.pull_request.number == 1143 && github.event.pull_request.head.repo.full_name == 'Sero91ak/dar-al-tawhid-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review only
        uses: actions/checkout@v4
        with:
          ref: review/kids-quiz-v4-batch-001-020-20261014

      - name: Generate 20 V4 originals direct to MP3, budget-capped and no repeats
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 -m py_compile kids/tools/generate_quiz_v4_450_paid_batch02.py
          python3 kids/tools/generate_quiz_v4_450_paid_batch02.py

      - name: Store original bytes and immutable expense ledger safely
        run: |
          set -euo pipefail
          git config user.name dar-kids-v4-voice-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch=review/kids-quiz-v4-batch-001-020-20261014
          git add -A kids/data/quiz-v4-450-original-clip-registry.json kids/data/quiz-v4-450-paid-generation-ledger.json kids/assets/kids-quiz-audio/v4-curated450-review/
          if [ -f kids/data/quiz-v4-450-batch02-usage.json ]; then
            git add kids/data/quiz-v4-450-batch02-usage.json
          fi
          if git diff --cached --quiet; then
            echo "Batch already saved, no further paid requests."
            exit 0
          fi
          git commit -m "audio(kids v4): save 20 more original paid MP3 files and SHA/usage ledger for review"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$branch"; then
              echo "ALL 20 originals persisted, review-only, no public deployment."
              exit 0
            fi
            git fetch origin "$branch"
            git rebase FETCH_HEAD
          done
          echo "::error::Paid bytes saved in artifact but Git push conflicted; do NOT regenerate these originals."
          exit 1

      - name: Preserve paid originals even if GitHub push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-v4-450-batch02-paid-originals-backup
          retention-days: 90
          if-no-files-found: warn
          path: |
            kids/assets/kids-quiz-audio/v4-curated450-review/
            kids/data/quiz-v4-450-original-clip-registry.json
            kids/data/quiz-v4-450-paid-generation-ledger.json
            kids/data/quiz-v4-450-batch02-usage.json
