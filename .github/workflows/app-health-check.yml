name: App Health Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kids visitor account registration guard
        run: node scripts/test-kids-account-registration-v1.js

      - name: Canonical Qibla pinned/start quick-view parity test
        run: node scripts/test-qibla-native-bridge.cjs

      - name: Run app health check
        run: node scripts/app-health-check.js

      - name: Public website isolation guard
        run: node scripts/public-website-isolation-guard.js

      - name: Adult mobile GPS resume and location replay regression
        run: node scripts/test-mobile-location-fresh-fix.cjs

      - name: Adult visitor and Android PWA language parity
        run: node scripts/adult-language-pwa-parity-guard.cjs

      - name: Production lane isolation guard
        run: node scripts/production-lane-isolation-guard.js

      - name: Kids Duʿāʾ Arabic / Latin / German integrity
        run: node scripts/kids-dua-trilingual-guard.js

      - name: Header prayer display guard (Maghrib/Zeit im Header)
        run: node scripts/header-prayer-display-guard.js

      - name: Qurʾān Tafsīr nav guard (kein Schwarzfeld/Hänger)
        run: node scripts/quran-tafsir-nav-guard.js

      - name: Qurʾān picker outside guard (kein Safari-Crash)
        run: node scripts/quran-picker-outside-guard.js

      - name: Qurʾān stability + Tajweed guard (Veil/Locks/Schrift)
        run: node scripts/quran-stability-tajweed-guard.js

      - name: App update recovery guard (Update-Banner nur bei echtem Fehler)
        run: node scripts/app-update-recovery-guard.js

      - name: Change scope lock guard (nur freigeschaltete Bereiche)
        env:
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: node scripts/change-scope-lock-guard.js

      - name: Repo integrity guard (Massen-Löschung blockieren)
        env:
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: node scripts/repo-integrity-guard.js

      - name: Hero scroll standard (drei Typen, Frauen unangetastet)
        run: node scripts/hero-scroll-standard-guard.js

      - name: Push system guard
        run: node scripts/push-system-guard.js

      - name: Prayer push loop guard
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before }}
        run: node scripts/prayer-push-loop-guard.js

      - name: Push lanes guard (Spuren getrennt, nie ohne Befehl)
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INTEGRITY_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          # Nonprinting GitHub Actions secret; guard still requires correct password SHA and lane markers.
          DAR_PUSH_UNLOCK_PASSWORD: ${{ secrets.DAR_PUSH_UNLOCK_PASSWORD }}
        run: node scripts/push-lanes-guard.js

      - name: Post push hang guard (Beitrags-Push darf nicht hängen)
        run: node scripts/post-push-hang-guard.js

      - name: Version update guard (Banner-Schleife + Willkommens-Push)
        run: node scripts/version-update-guard.js

      - name: Visitor SW must not touch admin
        run: |
          if grep -E "'/admin|\"/admin" service-worker.js | grep -q APP_SHELL; then
            echo "::error::service-worker.js must not cache /admin paths in APP_SHELL"
            exit 1
          fi
          echo "SW isolation OK"
