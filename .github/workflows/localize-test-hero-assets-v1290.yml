name: Localize Test Hero Assets v1290

on:
  push:
    paths:
      - ".github/workflows/localize-test-hero-assets-v1290.yml"

permissions:
  contents: write

concurrency:
  group: localize-test-hero-assets-v1290
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current Test hero images from CSS
        shell: python
        run: |
          import hashlib, json, re, urllib.request
          from pathlib import Path

          downloads = {
            "test/assets/more-v1253.css": "more-hub.jpg",
            "test/assets/jummah-v1258.css": "jummah.jpg",
            "test/assets/prayer-v1254.css": "prayer.jpg",
            "test/assets/qibla-v1259.css": "qibla.jpg",
            "test/assets/ilm-dua-v1244.css": "dua.jpg",
            "test/assets/quran-learn-v1256.css": "quran-learn.jpg",
            "test/assets/ilm-book-detail-v1252.css": "book-detail.jpg",
            "test/assets/ilm-post-reader-v1255.css": "post-reader.jpg",
            "test/assets/quran-player-v1252.css": "quran-player.jpg",
            "test/assets/quran-overview-v1250.css": "quran-overview.jpg",
            "test/assets/ilm-topics-v1242.css": "topics.png",
            "test/assets/ilm-topic-detail-v1254.css": "topic-detail.png",
            "test/assets/ilm-scholars-v1240.css": "scholars.png",
            "test/assets/quiz-overview-v1257.css": "quiz.jpg",
            "test/assets/ilm-scholar-detail-v1251.css": "scholar-detail.png",
            "test/assets/ilm-research-chat.css": "ilm-chat.png",
            "test/assets/library/library-app.css": "library.png",
          }
          out = Path("test/assets/area-heroes-v1290")
          out.mkdir(parents=True, exist_ok=True)
          url_re = re.compile(r'https://dnznrvs05pmza\.cloudfront\.net/[^)"\'\s]+')
          sums=[]
          for css_file, local_name in downloads.items():
            text=Path(css_file).read_text()
            match=url_re.search(text)
            if not match:
              raise SystemExit(f"Missing expiring hero URL in {css_file}")
            req=urllib.request.Request(match.group(0), headers={"User-Agent":"DAR-Test-Asset-Localizer/1.0"})
            with urllib.request.urlopen(req, timeout=90) as r:
              data=r.read()
            if len(data)<1000:
              raise SystemExit(f"Downloaded hero too small: {css_file} -> {len(data)} bytes")
            target=out/local_name
            target.write_bytes(data)
            digest=hashlib.sha256(data).hexdigest()
            sums.append(f"{digest}  {target.as_posix()}")
            print(f"{css_file} -> {target} ({len(data)} bytes)")
          (out/"SHA256SUMS.txt").write_text("\n".join(sums)+"\n")

      - name: Switch Test CSS to permanent local heroes
        shell: python
        run: |
          import json, re
          from pathlib import Path

          mapping = {
            "test/assets/more-v1253.css": "more-hub.jpg",
            "test/assets/more-v1241.css": "more-hub.jpg",
            "test/assets/jummah-v1258.css": "jummah.jpg",
            "test/assets/prayer-v1254.css": "prayer.jpg",
            "test/assets/qibla-v1259.css": "qibla.jpg",
            "test/assets/ilm-dua-v1244.css": "dua.jpg",
            "test/assets/quran-learn-v1256.css": "quran-learn.jpg",
            "test/assets/ilm-book-detail-v1252.css": "book-detail.jpg",
            "test/assets/ilm-post-reader-v1255.css": "post-reader.jpg",
            "test/assets/quran-player-v1252.css": "quran-player.jpg",
            "test/assets/quran-overview-v1250.css": "quran-overview.jpg",
            "test/assets/quran-reader-v1251.css": "quran-overview.jpg",
            "test/assets/ilm-topics-v1242.css": "topics.png",
            "test/assets/ilm-topic-detail-v1254.css": "topic-detail.png",
            "test/assets/ilm-scholars-v1240.css": "scholars.png",
            "test/assets/quiz-overview-v1257.css": "quiz.jpg",
            "test/assets/ilm-scholar-detail-v1251.css": "scholar-detail.png",
            "test/assets/ilm-scholar-profile-v1253.css": "scholar-detail.png",
            "test/assets/ilm-research-chat.css": "ilm-chat.png",
            "test/assets/library/library-app.css": "library.png",
          }
          pat=re.compile(r'https://dnznrvs05pmza\.cloudfront\.net/[^)"\'\s]+')
          for filename, local in mapping.items():
            p=Path(filename)
            source=p.read_text()
            updated,count=pat.subn(f"/test/assets/area-heroes-v1290/{local}",source)
            if count:
              p.write_text(updated)
              print(f"{filename}: {count} remote hero URL(s) localized")

          idx=Path("test/index.html")
          source=idx.read_text()
          source=re.sub(r'const APP_BUILD_ID="app-shell-v\d+(?:-test)?";','const APP_BUILD_ID="app-shell-v1290";',source,count=1)
          idx.write_text(source)

          worker=Path("cloudflare/test-app-worker.js")
          source=worker.read_text().replace("area-authority-v1289","area-authority-v1290")
          worker.write_text(source)

          version=Path("test/version.json")
          data=json.loads(version.read_text())
          data.update({
            "buildId":"app-shell-v1290",
            "appBuildId":"app-shell-v1290",
            "note":"v1290 · Test-App-Hero-Assets dauerhaft lokalisiert: Qurʾān, Quiz, Duʿāʾ, Mehr, Gebetszeiten, Jumuʿah, Qibla, Themen, Gelehrte, Leser und Bibliothek verwenden keine ablaufenden signierten Cloud-Bildlinks mehr.",
            "updatedAt":"2026-10-05T13:46:00+02:00"
          })
          version.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")

      - name: Commit Test-only v1290 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DAR Test Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/assets/area-heroes-v1290 test/assets/*.css test/assets/library/library-app.css test/index.html test/version.json cloudflare/test-app-worker.js
          if git diff --cached --quiet; then
            echo "No localized Test changes."
            exit 0
          fi
          git commit -m "test: localize hero assets and bump v1290"
          git push --force origin HEAD:refs/heads/test-local-heroes-v1290
