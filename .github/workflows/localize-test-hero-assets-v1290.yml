name: Localize Test Hero Assets v1290

on:
  push:
    paths:
      - ".github/workflows/localize-test-hero-assets-v1290.yml"

permissions:
  contents: write

concurrency:
  group: localize-test-hero-assets-v1290
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download expiring Test hero images
