name: Import Kids Cinema V1179

on:
  push:
    branches:
      - main
    paths:
      - "kids/cinema-sources-v1179.json"
      - ".github/workflows/import-kids-cinema-v1179.yml"

permissions:
  contents: write

concurrency:
  group: import-kids-cinema-v1179
  cancel-in-progress: false

jobs:
  import-cinema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Download generated cinema assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids/assets/kids-home-v1179
          POSTER_URL="$(jq -r '.poster_url' kids/cinema-sources-v1179.json)"
          VIDEO_URL="$(jq -r '.video_url' kids/cinema-sources-v1179.json)"
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 "$POSTER_URL" -o kids/assets/kids-home-v1179/hero-poster.png
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 300 "$VIDEO_URL" -o kids/assets/kids-home-v1179/hero-cinema.mp4
          test -s kids/assets/kids-home-v1179/hero-poster.png
          test -s kids/assets/kids-home-v1179/hero-cinema.mp4
          file kids/assets/kids-home-v1179/hero-poster.png
          file kids/assets/kids-home-v1179/hero-cinema.mp4

      - name: Persist assets and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f kids/cinema-sources-v1179.json
          rm -f .github/workflows/import-kids-cinema-v1179.yml
          git config user.name "dar-kids-cinema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A kids/assets/kids-home-v1179 kids/cinema-sources-v1179.json .github/workflows/import-kids-cinema-v1179.yml
          git commit -m "assets(kids): persist semi-realistic cinema hero v1179"
          git push origin HEAD:main
