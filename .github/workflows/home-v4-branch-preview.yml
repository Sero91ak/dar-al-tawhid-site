name: Deploy HOME V5 editorial feature preview (isolated Worker)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/home-editorial-v5-20261118
    paths:
      - home-device/**
      - home-v5.css
      - .github/workflows/home-v4-branch-preview.yml

permissions:
  contents: read

concurrency:
  group: dar-home-editorial-v5-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Dedicated HOME preview, never the production site
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated HOME V5 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/home-editorial-v5-20261118
          persist-credentials: false
          sparse-checkout: |
            home-device
            home-v5.css
            content/home

      - name: Prepare isolated static HOME preview
        shell: bash
        run: |
          set -euo pipefail
          test -s home-device/index.html
          test -s content/home/device-config.json
          test -s home-device/media/apple-tv/catalog.json
          mkdir -p .home-preview-dist/content/home .home-preview-dist/media
          cp -R home-device/media/apple-tv .home-preview-dist/media/
          cp home-device/index.html .home-preview-dist/index.html
          cp home-device/home-v3.js .home-preview-dist/home-v3.js
          cp home-device/home-v3.css .home-preview-dist/home-v3.css
          cp home-device/home-v4.js .home-preview-dist/home-v4.js
          cp home-device/home-v4.css .home-preview-dist/home-v4.css
          cp home-device/home-v6.js .home-preview-dist/home-v6.js
          cp home-device/home-v7.js .home-preview-dist/home-v7.js
          cp home-v5.css .home-preview-dist/home-v5.css
          cp content/home/device-config.json .home-preview-dist/content/home/device-config.json
          cat > .home-preview-worker.mjs <<'WORKER'
          const base = 'https://dar-al-tawhid.de';
          const upstreamPrefixes = [
            '/api/prayer/', '/content/updates/', '/content/quran/',
            '/apple-tv/', '/data/', '/quran-audio/'
          ];
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.method !== 'GET' && request.method !== 'HEAD') {
                return new Response('Method Not Allowed', { status: 405 });
              }
              if (url.pathname === '/healthz') {
                return Response.json({ service: 'dar-home-kiosk-preview', status: 'ok', version: '2026-11-18-v2' });
              }
              const path = url.pathname === '/' || url.pathname === '/home-device' ? '/index.html' : url.pathname;
              if (upstreamPrefixes.some(prefix => path.startsWith(prefix))) {
                const target = new URL(path + url.search, base);
                const forwarded = new Request(target, request);
                return fetch(forwarded);
              }
              const assetUrl = new URL(path + url.search, request.url);
              const response = await env.ASSETS.fetch(new Request(assetUrl, request));
              const headers = new Headers(response.headers);
              headers.set('X-Robots-Tag', 'noindex, nofollow, noarchive');
              headers.set('Cache-Control', 'no-store');
              return new Response(response.body, {
                status: response.status, statusText: response.statusText, headers
              });
            }
          };
          WORKER
          cat > wrangler.home-preview.toml <<'TOML'
          name = "dar-home-kiosk-preview"
          main = ".home-preview-worker.mjs"
          compatibility_date = "2026-11-18"
          workers_dev = true

          [assets]
          directory = ".home-preview-dist"
          binding = "ASSETS"
          run_worker_first = true
          TOML
          node --check .home-preview-worker.mjs
          node --check .home-preview-dist/home-v3.js
          node --check .home-preview-dist/home-v4.js
          node --check .home-preview-dist/home-v6.js
          node --check .home-preview-dist/home-v7.js
          test -s .home-preview-dist/home-v5.css
          node -e 'const s=require("fs").readFileSync(".home-preview-dist/index.html","utf8");const js=s.split("<script>")[1]?.split("</script>")[0];if(!js)throw Error("missing HOME inline script");new Function(js);if(!s.includes("/home-v4.js?v=5.2")||!s.includes("/home-v4.css?v=4.0")||!s.includes("/home-v5.css?v=5.5")||!s.includes("/home-v6.js?v=6.0")||!s.includes("/home-v7.js?v=7.0"))throw Error("V3 assets not referenced");console.log("HOME V5 scripts and asset links valid");'
          node -e 'const h=require("fs").readFileSync(".home-preview-dist/index.html","utf8");if(!h.includes("DĀR AL TAWḤĪD HOME"))process.exit(1);console.log("HOME kiosk HTML preview present");'

      - name: Deploy ONLY dar-home-kiosk-preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.home-preview.toml

      - name: Report unique preview URL
        if: success()
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## DĀR HOME V5 – isolated preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Existing website, main site worker, Kids, iOS and tvOS were not deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "HOME source branch: feature/home-editorial-v5-20261118" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${PREVIEW_URL:-Consult Cloudflare Workers deployment log}" >> "$GITHUB_STEP_SUMMARY"
