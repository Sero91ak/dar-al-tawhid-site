name = "dar-admin-publisher"
main = "worker.js"
compatibility_date = "2026-06-14"

[vars]
GITHUB_OWNER = "Sero91ak"
GITHUB_REPO = "dar-al-tawhid-site"
GITHUB_BRANCH = "main"
POSTS_DIR = "content/posts"
ALLOWED_ORIGIN = "https://dar-al-tawhid.de"
UPDATES_PATH = "content/updates/current.json"
SCHEDULE_PATH = "content/admin/planned-posts.json"
PRAYER_STATUS_PATH = "content/admin/prayer-push-status.json"
DAILY_PUSH_STATUS_PATH = "content/admin/daily-push-status.json"

[[durable_objects.bindings]]
name = "PRAYER_STATUS_STORE"
class_name = "PrayerStatusStore"

[[durable_objects.bindings]]
name = "VIDEO_STUDIO_STORE"
class_name = "VideoStudioStore"

[[migrations]]
tag = "v1_prayer_status_store"
new_sqlite_classes = ["PrayerStatusStore"]

[[migrations]]
tag = "v2_video_studio_store"
new_sqlite_classes = ["VideoStudioStore"]

# R2 bucket for video studio assets (einmalig anlegen, dann entkommentieren):
#   npx wrangler r2 bucket create dar-video-studio
# [[r2_buckets]]
# binding = "VIDEO_STUDIO_R2"
# bucket_name = "dar-video-studio"
# preview_bucket_name = "dar-video-studio"

[triggers]
crons = ["*/5 * * * *"]

# Secrets (einmalig setzen, bleiben am Worker gespeichert):
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put ADMIN_PUBLISH_SECRET
#   wrangler secret put ONESIGNAL_API_KEY_NEW
#   wrangler secret put ONESIGNAL_APP_ID   (optional, Standard ist gesetzt)
#   wrangler secret put GOLDAPI_KEY        (optional Premium — sonst Auto LBMA+EUR)
#   wrangler secret put METALS_API_KEY     (optional Alternative)
#   wrangler secret put PEXELS_API_KEY     (Feed-Hintergrund Auto-Sync)
#   wrangler secret put UNSPLASH_ACCESS_KEY
#   wrangler secret put PIXABAY_API_KEY
# Video-Studio (Staging – nie im Frontend speichern):
#   wrangler secret put FAL_KEY
#   wrangler secret put ELEVENLABS_API_KEY
#   wrangler secret put ELEVENLABS_VOICE_ID
#   wrangler secret put SHOTSTACK_API_KEY          (empfohlen für Untertitel/Logo-Compose)
#   wrangler secret put VIDEO_STUDIO_SIGNING_SECRET
#   wrangler secret put RUNWAY_API_KEY             (optional)
#   wrangler secret put VIDEO_STUDIO_LOGO_URL      (optional öffentliche Logo-URL)
