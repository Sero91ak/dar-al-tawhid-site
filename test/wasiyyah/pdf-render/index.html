<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Islamische Waṣiyyah | DAR AL TAWḤID</title>
  <style>
    @page{size:A4;margin:0}
    *{box-sizing:border-box}
    :root{
      --paper:#fbf7ed;
      --paper-2:#f5eddd;
      --ink:#1f2c28;
      --muted:#726b5f;
      --deep:#123b33;
      --gold:#b48a3c;
      --gold-soft:rgba(180,138,60,.28);
      --line:rgba(36,58,51,.14);
      --screen:#e9e5dc;
    }
    html,body{margin:0;padding:0;background:var(--screen);color:var(--ink)}
    body{
      font-family:Georgia,"Times New Roman","Noto Serif",serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button{font:inherit}
    .pdf-toolbar{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      background:rgba(17,45,39,.96);
      border-bottom:1px solid rgba(214,183,108,.26);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }
    .pdf-toolbar button{
      min-height:42px;
      padding:0 16px;
      border-radius:999px;
      border:1px solid rgba(214,183,108,.38);
      background:transparent;
      color:#fff9ea;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:13px;
      font-weight:800;
    }
    .pdf-toolbar button.primary{
      background:linear-gradient(135deg,#d0ad61,#b78631);
      color:#15372f;
      border-color:transparent;
    }
    .pdf-toolbar .pdf-status{
      color:rgba(255,249,234,.72);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:11px;
      margin-right:auto;
    }
    .pdf-doc{
      width:210mm;
      margin:18px auto 36px;
    }
    .pdf-page{
      --page-paper:var(--paper);
      width:210mm;
      height:297mm;
      position:relative;
      overflow:hidden;
      page-break-after:always;
      break-after:page;
      background:
        radial-gradient(circle at 8% 4%,rgba(180,138,60,.075),transparent 22%),
        linear-gradient(180deg,var(--page-paper),var(--page-paper));
      color:var(--ink);
      box-shadow:0 16px 46px rgba(40,31,17,.14);
      margin:0 0 18px;
    }
    .pdf-page:last-child{page-break-after:auto;break-after:auto}
    .pdf-page.theme-sand-olive{
      --page-paper:#fbf6e9;
      --deep:#2f483b;
      --gold:#a98742;
      --gold-soft:rgba(169,135,66,.26);
    }
    .pdf-page.theme-bordeaux{
      --page-paper:#fff7ed;
      --deep:#4b1b27;
      --gold:#b68b49;
      --gold-soft:rgba(182,139,73,.27);
    }
    .page-frame{
      position:absolute;
      inset:10mm;
      border:1px solid var(--gold-soft);
      pointer-events:none;
    }
    .page-inner{
      position:relative;
      height:100%;
      padding:16mm 18mm 17mm;
      display:flex;
      flex-direction:column;
    }
    .doc-head{
      flex:0 0 auto;
      padding:0 0 7mm;
      margin:0 0 7mm;
      border-bottom:1px solid var(--gold-soft);
    }
    .doc-brand{
      color:var(--gold);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:8.5pt;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .doc-title{
      margin:3.5mm 0 1.5mm;
      color:var(--deep);
      font-size:27pt;
      line-height:1.03;
      font-weight:600;
      letter-spacing:-.025em;
    }
    .doc-subtitle{
      margin:0;
      color:var(--muted);
      font-size:10.4pt;
      line-height:1.5;
    }
    .doc-meta{
      display:grid;
      grid-template-columns:minmax(0,1.45fr) minmax(0,.75fr) minmax(0,.8fr);
      gap:4mm;
      margin-top:6mm;
      padding-top:4mm;
      border-top:1px solid rgba(180,138,60,.16);
    }
    .doc-meta span{
      display:block;
      margin-bottom:1.2mm;
      color:var(--muted);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:7.5pt;
      font-weight:700;
      letter-spacing:.04em;
    }
    .doc-meta strong{
      display:block;
      color:var(--ink);
      font-size:10pt;
      line-height:1.35;
      font-weight:600;
      overflow-wrap:anywhere;
    }
    .doc-intro{
      margin:4mm 0 0;
      max-width:160mm;
      color:var(--muted);
      font-size:8.8pt;
      line-height:1.55;
    }
    .running-head{
      flex:0 0 auto;
      min-height:14mm;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:8mm;
      padding:0 0 4.5mm;
      margin:0 0 5mm;
      border-bottom:1px solid var(--gold-soft);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .running-brand{
      color:var(--deep);
      font-size:8.6pt;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .running-label{
      color:var(--muted);
      font-size:7.6pt;
      font-weight:700;
      white-space:nowrap;
    }
    .page-body{
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }
    .doc-section{
      break-inside:avoid;
      page-break-inside:avoid;
      margin:0;
      padding:4.8mm 0 5mm;
      border-top:1px solid var(--line);
    }
    .doc-section:first-child{border-top:0;padding-top:0}
    .doc-section h2{
      margin:0 0 2.5mm;
      color:var(--deep);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:9.3pt;
      line-height:1.28;
      font-weight:900;
      letter-spacing:.06em;
    }
    .doc-section h2 .num{
      color:var(--gold);
      letter-spacing:.10em;
      margin-right:2.5mm;
    }
    .doc-section h2 .continuation{
      color:var(--muted);
      font-weight:700;
      letter-spacing:0;
      margin-left:2mm;
      font-size:8pt;
    }
    .doc-section p{
      margin:0 0 2.4mm;
      color:var(--ink);
      font-size:10.4pt;
      line-height:1.52;
      orphans:3;
      widows:3;
      hyphens:auto;
      -webkit-hyphens:auto;
      overflow-wrap:break-word;
    }
    .doc-section p:last-child{margin-bottom:0}
    .review-section{
      padding-left:4mm;
      border-left:2px solid var(--gold);
    }
    .signature-block{
      break-inside:avoid;
      page-break-inside:avoid;
      margin-top:5mm;
      padding-top:6mm;
      border-top:1.5px solid var(--gold);
    }
    .signature-block h2{
      margin:0 0 9mm;
      color:var(--deep);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:9.4pt;
      font-weight:900;
      letter-spacing:.06em;
    }
    .signature-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12mm;
    }
    .signature-cell{padding-top:13mm;border-top:1px solid rgba(31,44,40,.72)}
    .signature-cell span{
      display:block;
      color:var(--muted);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:7.8pt;
      font-weight:700;
    }
    .legal-note{
      margin-top:7mm;
      color:var(--muted);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:7.6pt;
      line-height:1.5;
    }
    .sources-block{
      break-inside:avoid;
      page-break-inside:avoid;
      margin-top:0;
    }
    .sources-block h2{
      margin:0 0 3.5mm;
      color:var(--deep);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:9.4pt;
      font-weight:900;
      letter-spacing:.06em;
    }
    .sources-list{
      margin:0;
      padding:0;
      list-style:none;
    }
    .sources-list li{
      margin:0 0 2.5mm;
      padding:0 0 2.5mm;
      border-bottom:1px solid rgba(31,44,40,.08);
      color:var(--ink);
      font-size:9.1pt;
      line-height:1.44;
    }
    .sources-list li:last-child{border-bottom:0;margin-bottom:0}
    .page-footer{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8mm;
      padding-top:3.5mm;
      margin-top:4mm;
      border-top:1px solid var(--gold-soft);
      color:var(--muted);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:7.2pt;
      line-height:1.2;
    }
    .page-footer .site{color:var(--gold);font-weight:800}
    .empty{
      width:min(680px,calc(100vw - 32px));
      margin:50px auto;
      padding:26px;
      border-radius:18px;
      background:#fffaf0;
      color:#342e26;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      text-align:center;
      box-shadow:0 12px 40px rgba(0,0,0,.10);
    }
    @media(max-width:860px){
      .pdf-toolbar{justify-content:flex-end}
      .pdf-toolbar .pdf-status{display:none}
      .pdf-doc{
        transform-origin:top left;
        width:210mm;
        margin:10px 0 0;
      }
      body{overflow-x:auto}
    }
    @media print{
      html,body{background:#fff!important}
      .pdf-toolbar{display:none!important}
      .pdf-doc{margin:0!important;width:210mm!important}
      .pdf-page{margin:0!important;box-shadow:none!important}
      .empty{display:none!important}
    }
  </style>
</head>
<body>
  <div class="pdf-toolbar" role="toolbar" aria-label="PDF-Werkzeuge">
    <span class="pdf-status">Textbasierte A4-Ausgabe · durchsuchbar und markierbar</span>
    <button type="button" id="closeBtn">Schließen</button>
    <button type="button" class="primary" id="printBtn">Als PDF sichern / drucken</button>
  </div>
  <main id="pdfDoc" class="pdf-doc"></main>

  <script>
  (()=>{"use strict";
    const STORAGE_KEY="darWasiyyahDraftV1";
    const TITLE_MAP={
      1:"Persönliche Angaben",
      2:"Glaube und Grundlage",
      3:"Familie und mögliche Erben",
      4:"Schulden und offene Rechte",
      5:"Amānāt und anvertraute Dinge",
      6:"Vermögen und wichtige Dokumente",
      7:"Zakāh und religiöse Pflichten",
      8:"Waṣiyyah bis maximal ein Drittel",
      9:"Janāzah nach Sunnah",
      10:"Nicht gewünschte Neuerungen und Zeremonien",
      11:"Kinder / Vormundschaft / private Wünsche",
      12:"Ansprechpartner / Waṣiyy",
      13:"Private Hinweise an Angehörige",
      14:"Prüfhinweise"
    };
    const FIELD_KEYS={
      1:"personal",2:"faithDeclaration",3:"family",4:"debts",5:"amanat",6:"assets",7:"religiousObligations",
      8:"bequests",9:"janazah",10:"bidahRestrictions",11:"guardianship",12:"contacts",13:"privateNotes"
    };
    const DEFAULT_SOURCES=[
      "Qurʾān 4:11–12 · Erbanteile und Reihenfolge nach Waṣiyyah und Schulden.",
      "Ṣaḥīḥ al-Bukhārī 2738 · Waṣiyyah nicht aufschieben.",
      "Ṣaḥīḥ al-Bukhārī 2742 · Ein Drittel – und ein Drittel ist viel.",
      "Sunan Abī Dāwūd 2870 · Keine Waṣiyyah für einen regulären Erben ohne nähere Prüfung.",
      "Ṣaḥīḥ al-Bukhārī 6732 · Farāʾiḍ den Berechtigten geben.",
      "Ṣaḥīḥ al-Bukhārī 6764 · Unterschied der Religion als Erbhindernis.",
      "Jāmiʿ at-Tirmidhī 1078 · Ernst und Gewicht von Schulden.",
      "Ṣaḥīḥ Muslim 970a und 969a · Regeln zu Gräbern und Verbot von Übertreibung.",
      "Ṣaḥīḥ al-Bukhārī 1294 · Warnung vor Jāhiliyyah-Trauerritualen."
    ];
    const PLACEHOLDERS=[
      "keine angaben erfasst.",
      "keine angaben erfasst",
      "keine besonderen prüfhinweise erfasst.",
      "keine besonderen prüfhinweise erfasst"
    ];

    const $=s=>document.querySelector(s);
    function clean(v){return String(v||"").replace(/\r/g,"").trim()}
    function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function isPlaceholder(v){const n=clean(v).toLowerCase();return !n||n==="—"||PLACEHOLDERS.includes(n)}
    function readPayload(){
      for(const store of [sessionStorage,localStorage]){
        try{const raw=store.getItem("wasiyyahPdfPayload");if(raw)return JSON.parse(raw)}catch(e){}
      }
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw)return{state:JSON.parse(raw),template:localStorage.getItem("wasiyyahPdfTemplate")||"royal-blue",createdDate:new Date().toLocaleDateString("de-DE")}
      }catch(e){}
      return null;
    }
    function displayDate(raw){
      const s=clean(raw);
      if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)){
        const [d,m,y]=s.split(".");
        return d.padStart(2,"0")+"."+m.padStart(2,"0")+"."+y;
      }
      return new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
    }
    function fullName(state){
      const text=clean(state&&state.personal);
      if(!text)return"Nicht angegeben";
      const first=text.split("\n").map(x=>x.trim()).filter(Boolean)[0]||"";
      return first.replace(/^\s*(?:1\.|name\s*:?)\s*/i,"").trim()||"Nicht angegeben";
    }
    function paragraphize(v){
      const txt=clean(v);
      if(!txt)return[];
      const blocks=txt.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
      return blocks.length?blocks:[txt];
    }
    function parseFinalText(text){
      const src=clean(text);
      if(!src)return{sections:[],sources:[]};
      const lines=src.split("\n");
      const sections=[];
      const sources=[];
      let current=null;
      let inSources=false;
      for(const raw of lines){
        const line=raw.trim();
        if(!line)continue;
        if(/^ISLAMISCHE WASIYYAH-ERKLÄRUNG$/i.test(line))continue;
        const m=line.match(/^(\d+)\.\s+(.+)$/);
        if(m){
          const n=Number(m[1]);
          if(n===15){
            if(current&&current.body.length)sections.push(current);
            current=null;inSources=true;continue;
          }
          if(current&&current.body.length)sections.push(current);
          current={number:n,title:TITLE_MAP[n]||m[2].replace(/\s+/g," ").trim(),body:[]};
          inSources=false;
          continue;
        }
        if(/^(Ort|Datum|Unterschrift)\s*:/i.test(line))continue;
        if(inSources){
          const item=line.replace(/^[-•]\s*/,"").trim();
          if(item)sources.push(item);
        }else if(current){
          current.body.push(line);
        }
      }
      if(current&&current.body.length)sections.push(current);
      return{sections:sections.map(s=>({...s,body:s.body.join("\n")})),sources};
    }
    function stateSections(state){
      const out=[];
      for(let n=1;n<=13;n++){
        const key=FIELD_KEYS[n];
        let body=clean(state&&state[key]);
        if(n===2&&!body)body="Ich bezeuge, dass es keinen anbetungswürdigen Gott gibt außer Allāh und dass Muḥammad ﷺ Sein Diener und Gesandter ist. Ich wünsche, dass meine Angelegenheiten nach Qurʾān, authentischer Sunnah und dem Verständnis der frühen Muslime geregelt werden.";
        if(!isPlaceholder(body))out.push({number:n,title:TITLE_MAP[n],body});
        if(n===3&&body&&!isPlaceholder(body)){
          out.push({number:3.1,title:"Hinweis zur Farāʾiḍ-Prüfung",body:"Die endgültige Farāʾiḍ-Verteilung hängt von den tatsächlich lebenden Erben zum Todeszeitpunkt ab."});
        }
      }
      if(state&&Array.isArray(state.reviewFlags)&&state.reviewFlags.length){
        out.push({number:14,title:TITLE_MAP[14],body:state.reviewFlags.map((x,i)=>(i+1)+". "+x).join("\n")});
      }
      return out;
    }
    function documentData(payload){
      const state=payload.state||{};
      const parsed=parseFinalText(payload.finalText||state.finalText||"");
      let sections=parsed.sections.filter(s=>!isPlaceholder(s.body)&&s.number!==15);
      if(!sections.length)sections=stateSections(state);
      else{
        sections=sections.filter(s=>s.number>=1&&s.number<=14);
        const hasFar=sections.some(s=>s.number===3);
        if(hasFar&&!sections.some(s=>s.number===3.1)){
          const idx=sections.findIndex(s=>s.number===3);
          sections.splice(idx+1,0,{number:3.1,title:"Hinweis zur Farāʾiḍ-Prüfung",body:"Die endgültige Farāʾiḍ-Verteilung hängt von den tatsächlich lebenden Erben zum Todeszeitpunkt ab."});
        }
      }
      return{
        state,
        template:["royal-blue","sand-olive","bordeaux"].includes(payload.template)?payload.template:"royal-blue",
        date:displayDate(payload.createdDate),
        name:fullName(state),
        sections,
        sources:parsed.sources.length?parsed.sources:DEFAULT_SOURCES.slice()
      };
    }
    function themeClass(t){return t==="sand-olive"?"theme-sand-olive":t==="bordeaux"?"theme-bordeaux":"theme-royal-blue"}
    function pageMarkup(first,data){
      const page=document.createElement("section");
      page.className="pdf-page "+themeClass(data.template);
      page.innerHTML='<div class="page-frame"></div><div class="page-inner">'+
        (first
          ? '<header class="doc-head"><div class="doc-brand">DAR AL TAWḤID · ISLAMISCHE WAṢIYYAH</div><h1 class="doc-title">Islamische Waṣiyyah</h1><p class="doc-subtitle">Persönlicher Entwurf nach Qurʾān und authentischer Sunnah</p><div class="doc-meta"><div><span>Erstellt für</span><strong>'+esc(data.name)+'</strong></div><div><span>Erstellt am</span><strong>'+esc(data.date)+'</strong></div><div><span>Dokument</span><strong>Persönlicher Entwurf</strong></div></div><p class="doc-intro">Diese Erklärung dient der geordneten Festhaltung persönlicher Angaben, Schulden, Amānāt, Ansprechpartner, Janāzah-Wünsche und weiterer Hinweise. Staatliche Form- und Rechtsfragen sind separat zu prüfen.</p></header>'
          : '<header class="running-head"><span class="running-brand">DAR AL TAWḤID · ISLAMISCHE WAṢIYYAH</span><span class="running-label">Persönlicher Entwurf</span></header>')+
        '<div class="page-body"></div><footer class="page-footer"><span class="site">dar-al-tawhid.de</span><span class="page-no"></span></footer></div>';
      return page;
    }
    function sectionTitleHtml(sec,continuation){
      const raw=String(sec.number);
      const number=/^\d+$/.test(raw)?raw.padStart(2,"0"):"";
      return (number?'<span class="num">'+number+' ·</span> ':'')+esc(sec.title)+(continuation?'<span class="continuation">Fortsetzung</span>':'');
    }
    function createSection(sec,continuation){
      const el=document.createElement("section");
      el.className="doc-section"+(Number(sec.number)===14?" review-section":"");
      const h=document.createElement("h2");
      h.innerHTML=sectionTitleHtml(sec,continuation);
      el.appendChild(h);
      return el;
    }
    function bodyOverflows(body){return body.scrollHeight>body.clientHeight+2}
    function splitLongParagraph(text,sec,ctx){
      const words=clean(text).split(/\s+/).filter(Boolean);
      let bucket=[];
      for(const word of words){
        bucket.push(word);
        const p=document.createElement("p");
        p.textContent=bucket.join(" ");
        ctx.section.appendChild(p);
        if(bodyOverflows(ctx.body)){
          ctx.section.removeChild(p);
          bucket.pop();
          if(bucket.length){
            const keep=document.createElement("p");
            keep.textContent=bucket.join(" ");
            ctx.section.appendChild(keep);
          }
          ctx=ctx.newContinuation(sec);
          bucket=[word];
        }else{
          ctx.section.removeChild(p);
        }
      }
      if(bucket.length){
        const p=document.createElement("p");
        p.textContent=bucket.join(" ");
        ctx.section.appendChild(p);
      }
      return ctx;
    }
    function paginate(data){
      const root=$("#pdfDoc");
      root.innerHTML="";
      const pages=[];
      function newPage(first){
        const page=pageMarkup(first,data);
        root.appendChild(page);
        pages.push(page);
        return{page,body:page.querySelector(".page-body"),section:null};
      }
      let ctx=newPage(true);
      function newContinuation(sec){
        ctx=newPage(false);
        const section=createSection(sec,true);
        ctx.body.appendChild(section);
        ctx.section=section;
        return ctx;
      }
      for(const sec of data.sections){
        let section=createSection(sec,false);
        ctx.body.appendChild(section);
        ctx.section=section;
        if(bodyOverflows(ctx.body)){
          ctx.body.removeChild(section);
          ctx=newPage(false);
          section=createSection(sec,false);
          ctx.body.appendChild(section);
          ctx.section=section;
        }
        const paras=paragraphize(sec.body);
        for(const rawPara of paras){
          const pieces=rawPara.split(/\n+/).map(x=>x.trim()).filter(Boolean);
          for(const piece of pieces){
            const p=document.createElement("p");
            p.textContent=piece;
            ctx.section.appendChild(p);
            if(bodyOverflows(ctx.body)){
              ctx.section.removeChild(p);
              const hasBody=ctx.section.querySelectorAll("p").length>0;
              if(hasBody){
                ctx=newContinuation(sec);
                const retry=document.createElement("p");
                retry.textContent=piece;
                ctx.section.appendChild(retry);
                if(bodyOverflows(ctx.body)){
                  ctx.section.removeChild(retry);
                  ctx=splitLongParagraph(piece,sec,{...ctx,newContinuation});
                }
              }else{
                ctx=splitLongParagraph(piece,sec,{...ctx,newContinuation});
              }
            }
          }
        }
      }

      const signature=document.createElement("section");
      signature.className="signature-block";
      signature.innerHTML='<h2>Ort, Datum und Unterschrift</h2><div class="signature-grid"><div class="signature-cell"><span>Ort / Datum</span></div><div class="signature-cell"><span>Unterschrift</span></div></div><p class="legal-note">Hinweis: Diese islamische Waṣiyyah-Erklärung ersetzt keine staatliche Rechtsberatung und keine gesetzliche Formprüfung.</p>';
      ctx.body.appendChild(signature);
      if(bodyOverflows(ctx.body)){
        ctx.body.removeChild(signature);
        ctx=newPage(false);
        ctx.body.appendChild(signature);
      }

      const sourceTitle={number:"",title:"Anhang · Quellenhinweise"};
      let sourceSection=document.createElement("section");
      sourceSection.className="sources-block";
      sourceSection.innerHTML='<h2>Anhang · Quellenhinweise</h2><ul class="sources-list"></ul>';
      ctx.body.appendChild(sourceSection);
      if(bodyOverflows(ctx.body)){
        ctx.body.removeChild(sourceSection);
        ctx=newPage(false);
        sourceSection=document.createElement("section");
        sourceSection.className="sources-block";
        sourceSection.innerHTML='<h2>Anhang · Quellenhinweise</h2><ul class="sources-list"></ul>';
        ctx.body.appendChild(sourceSection);
      }
      let list=sourceSection.querySelector(".sources-list");
      for(const source of data.sources){
        const li=document.createElement("li");
        li.textContent=source;
        list.appendChild(li);
        if(bodyOverflows(ctx.body)){
          list.removeChild(li);
          ctx=newPage(false);
          sourceSection=document.createElement("section");
          sourceSection.className="sources-block";
          sourceSection.innerHTML='<h2>Anhang · Quellenhinweise <span style="color:var(--muted);font-weight:700;letter-spacing:0;font-size:8pt">Fortsetzung</span></h2><ul class="sources-list"></ul>';
          ctx.body.appendChild(sourceSection);
          list=sourceSection.querySelector(".sources-list");
          list.appendChild(li);
        }
      }

      const total=pages.length;
      pages.forEach((p,i)=>{p.querySelector(".page-no").textContent="Seite "+(i+1)+" von "+total});
      return pages;
    }
    function fitScreen(){
      if(matchMedia("(min-width:861px)").matches){$("#pdfDoc").style.transform="";document.body.style.paddingBottom="";return}
      const doc=$("#pdfDoc");
      const scale=Math.min(1,(window.innerWidth-16)/doc.offsetWidth);
      doc.style.transform="scale("+scale+")";
      document.body.style.paddingBottom=Math.max(0,(doc.scrollHeight*scale-doc.scrollHeight))+"px";
    }
    function printDocument(){window.print()}
    async function render(){
      const payload=readPayload();
      const root=$("#pdfDoc");
      if(!payload){
        root.innerHTML='<div class="empty"><h1>Waṣiyyah-Entwurf nicht gefunden</h1><p>Bitte öffne die PDF-Ausgabe erneut aus dem Waṣiyyah-Assistenten.</p></div>';
        return;
      }
      const data=documentData(payload);
      paginate(data);
      fitScreen();
      try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
      requestAnimationFrame(()=>{fitScreen();requestAnimationFrame(()=>fitScreen())});
      if(new URLSearchParams(location.search).get("print")==="1"){
        setTimeout(()=>window.print(),650);
      }
    }
    $("#printBtn").addEventListener("click",printDocument);
    $("#closeBtn").addEventListener("click",()=>{try{window.close()}catch(e){}if(!window.closed)history.back()});
    window.addEventListener("resize",fitScreen);
    render();
  })();
  </script>
</body>
</html>
