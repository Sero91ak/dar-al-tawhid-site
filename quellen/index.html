<!doctype html>

  <meta charset="utf-8">

  <link rel="canonical" href="https://dar-al-tawhid.de/quellen/">
  <meta property="og:type" content="website">

</head>
<body class="ql-body">
  <main class="ql-page">
    <header class="ql-top">
      <a class="ql-back" href="/" aria-label="Zur Startseite">‹</a>
      <div class="ql-titlebox">
        <p class="ql-kicker">DAR AL TAWḤĪD · Quellen</p>
        <h1>Quellenbibliothek</h1>
      </div>
      <img class="ql-logo" src="/watermark-my-logo-full.png" alt="">
    </header>

    <section class="ql-hero" aria-labelledby="pageTitle">
      <div class="ql-rule"></div>
      <p class="ql-eyebrow">Arbeitsindex für Beiträge</p>
      <h2 id="pageTitle">Aussagen schnell finden</h2>
      <p class="ql-intro">Suche nach Thema, Gelehrtem, Sprecher oder Q‑Nummer. Pro Seite werden immer zehn Aussagen angezeigt.</p>
    </section>

    <section class="ql-controls" aria-label="Suche und Filter">
      <label class="ql-search" for="search">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Suchen: q/19, Ṭāġūt, al-Buḫārī, Mawlid …">
      </label>

      <div class="ql-filterbar">
        <button class="ql-panel-btn" type="button" data-panel="categories">Kategorien <b id="catLabel">Alle</b></button>
        <button class="ql-panel-btn" type="button" data-panel="scholars">Gelehrte <b id="scholarLabel">Alle</b></button>
        <button class="ql-reset" type="button" id="resetBtn">Zurücksetzen</button>
      </div>

      <div class="ql-panel is-open" id="categoriesPanel" aria-label="Kategorien">
        <button class="ql-choice is-active" type="button" data-kind="category" data-value="all">Alle <small>19</small></button>
        <button class="ql-choice" type="button" data-kind="category" data-value="aqidah">ʿAqīdah</button>
        <button class="ql-choice" type="button" data-kind="category" data-value="fiqh">Fiqh</button>
        <button class="ql-choice" type="button" data-kind="category" data-value="hadith">Ḥadīṯ</button>
        <button class="ql-choice" type="button" data-kind="category" data-value="manhaj">Manhaj</button>
        <button class="ql-choice" type="button" data-kind="category" data-value="adab">Adab</button>
        <button class="ql-choice" type="button" data-kind="category" data-value="wissen">Wissen</button>
      </div>

      <div class="ql-panel" id="scholarsPanel" aria-label="Gelehrte und Sprecher"></div>
    </section>

    <section class="ql-list-head" aria-live="polite">
      <span id="resultCount">19 Aussagen</span>
      <button id="sortToggle" type="button" class="ql-sort" data-sort="desc">Neueste zuerst</button>
    </section>

    <section id="sourceList" class="ql-list" aria-label="Quellenlinks"></section>

    <nav id="pagination" class="ql-pagination" aria-label="Seitennavigation"></nav>

    <p id="emptyState" class="ql-empty">Keine passende Quelle gefunden. Suche mit anderem Gelehrten, Thema oder Q‑Nummer.</p>
  </main>

<script>
const SOURCES = [{"q":19,"cat":"Fiqh","cats":["fiqh"],"title":"Recht zurückfordern bei nichtislamischer Autorität","speaker":"as-Saraḫsī · ash-Shāfiʿī · Ibn Qudāmah · Ibn Hishām","desc":"Beweisführung, deren ḥākim, Dār al-Ḥarb, Amān, keine Khiyānah und Ḥilf al-Fuḍūl.","tags":["Rechtsrückforderung","Dār al-Ḥarb","Amān","Ṭāġūt-Abgrenzung"]},{"q":18,"cat":"Ḥadīṯ","cats":["hadith","wissen"],"title":"Imām al-Buḫārī und die Stärke seines Ḥifẓ","speaker":"Abū Ḥātim ar-Rāzī · Ḥāshid ibn Ismāʿīl","desc":"Lob über al-Buḫārīs Ḥadīṯ-Wissen und Bericht über mehr als 15.000 auswendig vorgetragene Ḥadīṯe.","tags":["al-Buḫārī","Ḥifẓ","Ahl al-Ḥadīṯ"]},{"q":17,"cat":"Fiqh","cats":["fiqh","adab"],"title":"Aufstehen im Gericht: kein automatischer Kufr","speaker":"al-Mardāwī · Ibn Ḥaǧar · al-Bayhaqī · Ḥadīṯe","desc":"Gerichtsordnung, Aufstehen, Ehrung, Hochmut und Abgrenzung zum automatischen Kufr.","tags":["Gericht","Qāḍī-Adab","Aufstehen"]},{"q":16,"cat":"Wissen","cats":["wissen","manhaj","hadith"],"title":"Wissen kommt vor Wort und Tat","speaker":"Imām al-Buḫārī","desc":"Kapitelprinzip: Wissen vor Rede und Handlung, gestützt auf Qurʾān 47:19.","tags":["ʿIlm","al-Buḫārī","Manhaj"]},{"q":15,"cat":"Fiqh","cats":["fiqh","aqidah"],"title":"Recht zurückholen ist nicht automatisch Schirk Akbar","speaker":"aṭ-Ṭabarī · al-Māwardī · Ibn Qudāmah · Ibn Taymiyyah","desc":"Grundlagenkarte zu Taḥākum, Ṭāġūt, Aḫḏ al-Ḥaqq, Bāṭil und Abwehr von Ẓulm.","tags":["Ṭāġūt","Aḫḏ al-Ḥaqq","Schirk"]},{"q":14,"cat":"Adab","cats":["hadith","adab"],"title":"Hochmut ist, die Wahrheit abzulehnen","speaker":"Der Prophet ﷺ","desc":"Ṣaḥīḥ-Muslim-Ḥadīṯ über Kibr: Wahrheit zurückweisen und Menschen gering schätzen.","tags":["Kibr","Wahrheit","Adab"]},{"q":13,"cat":"Adab","cats":["adab","manhaj"],"title":"Die Wahrheit vor der eigenen Meinung","speaker":"Imām ash-Shāfiʿī","desc":"Aufrichtigkeit in der Diskussion: Die Wahrheit soll erscheinen, egal durch wessen Zunge.","tags":["Wahrheit","Diskussion","Ikhlāṣ"]},{"q":12,"cat":"Manhaj","cats":["manhaj","fiqh"],"title":"Mawlid: Keine Sunnah, sondern Bidʿah","speaker":"Ibn Taymiyyah · Tāǧ ad-Dīn al-Fākihānī","desc":"Direktnachweise zum Mawlid als religiöses Fest und Bidʿah, mit Web-, PDF- und Scan-Belegen.","tags":["Mawlid","Bidʿah","Sunnah"]},{"q":11,"cat":"ʿAqīdah","cats":["aqidah","hadith"],"title":"Ḥammād ibn Zayd über den Nuzūl","speaker":"Ḥammād ibn Zayd","desc":"Athar zum Ḥadīṯ des Nuzūl und Erklärung zum Wort makān im Kontext der Ṣifāt.","tags":["Nuzūl","Ṣifāt","Athar"]},{"q":10,"cat":"ʿAqīdah","cats":["aqidah"],"title":"Allah tut, was Er will","speaker":"al-Fuḍayl ibn ʿIyāḍ","desc":"Antwort an die Jahmiyyah: Glaube an einen Herrn, der tut, was Er will.","tags":["Jahmiyyah","Ṣifāt","al-Fuḍayl"]},{"q":9,"cat":"ʿAqīdah","cats":["aqidah"],"title":"al-Fuḍayl ibn ʿIyāḍ über die Jahmiyyah","speaker":"al-Fuḍayl ibn ʿIyāḍ","desc":"Quellenarchiv zur Aussage gegen die Jahmiyyah: „Ich glaube an einen Herrn, der tut, was Er will.“","tags":["Jahmiyyah","Aqīdah","Salaf"]},{"q":8,"cat":"ʿAqīdah","cats":["aqidah"],"title":"Yazīd ibn Hārūn über die Jahmiyyah","speaker":"Yazīd ibn Hārūn","desc":"Aussage über die Umdeutung des Istiwaʾ und die Grenze zur Jahmiyyah.","tags":["Istiwaʾ","Jahmiyyah","Ṣifāt"]},{"q":7,"cat":"Manhaj","cats":["manhaj","hadith"],"title":"Die Sunnah vor der eigenen Meinung","speaker":"Imām ash-Shāfiʿī","desc":"Wenn eine Aussage der Sunnah widerspricht, wird die Sunnah genommen und die eigene Aussage verlassen.","tags":["Sunnah","ash-Shāfiʿī","Manhaj"]},{"q":6,"cat":"Manhaj","cats":["manhaj","adab"],"title":"Aufrichtig und richtig","speaker":"al-Fuḍayl ibn ʿIyāḍ","desc":"Eine Tat wird erst angenommen, wenn sie aufrichtig für Allah und richtig gemäß der Sunnah ist.","tags":["Ikhlāṣ","Sunnah","ʿAmal"]},{"q":5,"cat":"Manhaj","cats":["manhaj"],"title":"Wodurch die Ummah wieder gerade wird","speaker":"Imām Mālik ibn Anas","desc":"Der letzte Teil dieser Ummah wird nur durch das gerade, wodurch ihr erster Teil gerade wurde.","tags":["Ummah","Salaf","Mālik"]},{"q":4,"cat":"Ḥadīṯ","cats":["hadith","adab"],"title":"Der Dīn ist Naṣīḥah","speaker":"Der Gesandte Allahs ﷺ · Tamīm ad-Dārī","desc":"Ṣaḥīḥ-Muslim-Ḥadīṯ über Naṣīḥah für Allah, Sein Buch, Seinen Gesandten und die Muslime.","tags":["Naṣīḥah","Īmān","Ḥadīṯ"]},{"q":3,"cat":"Manhaj","cats":["manhaj","adab"],"title":"Halte dich an die Spuren der Salaf","speaker":"al-Awzāʿī","desc":"Festhalten an den Überlieferungen der Vorangegangenen und Warnung vor ausgeschmückten Meinungen.","tags":["Salaf","Athar","al-Awzāʿī"]},{"q":2,"cat":"Ḥadīṯ","cats":["hadith","adab"],"title":"Beständigkeit der Taten","speaker":"Der Gesandte Allahs ﷺ · ʿĀʾišah","desc":"Die Allah liebsten Taten sind die beständigsten, auch wenn sie gering sind.","tags":["Mudāwamah","ʿAmal","Bukhārī/Muslim"]},{"q":1,"cat":"Wissen","cats":["wissen","manhaj"],"title":"Wissen verlangt Handeln","speaker":"ʿAbdullāh ibn Masʿūd","desc":"Lernt, lernt — und wenn ihr Wissen erlangt habt, handelt danach.","tags":["ʿIlm","ʿAmal","Ibn Masʿūd"]}];
const PER_PAGE = 10;
let activeCategory = 'all';
let activeScholar = 'all';
let activeQuery = '';
let sortOrder = 'desc';
let page = 1;

const list = document.getElementById('sourceList');
const count = document.getElementById('resultCount');
const pager = document.getElementById('pagination');
const empty = document.getElementById('emptyState');
const search = document.getElementById('search');
const catLabel = document.getElementById('catLabel');
const scholarLabel = document.getElementById('scholarLabel');
const catsPanel = document.getElementById('categoriesPanel');
const scholarsPanel = document.getElementById('scholarsPanel');

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function fold(s) {
  return String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[ʿʾ’‘`´-]/g,' ').toLowerCase();
}
function sourceText(item) {
  return fold([item.q, 'q/'+item.q, item.title, item.speaker, item.desc, item.cat, item.cats.join(' '), item.tags.join(' ')].join(' '));
}
function displayCategory(value) {
  const map = {all:'Alle',aqidah:'ʿAqīdah',fiqh:'Fiqh',hadith:'Ḥadīṯ',manhaj:'Manhaj',adab:'Adab',wissen:'Wissen'};
  return map[value] || 'Alle';
}
function makeScholarKey(name) {
  return fold(name).replace(/\s+/g,' ').trim();
}
function primaryScholars() {
  const names = new Map();
  SOURCES.forEach(item => {
    item.speaker.split('·').map(x => x.trim()).filter(Boolean).forEach(name => {
      if (/Der Prophet|Gesandte Allahs/i.test(name)) names.set('prophet','Der Prophet ﷺ');
      else names.set(makeScholarKey(name), name);
    });
  });
  return Array.from(names.entries()).sort((a,b) => a[1].localeCompare(b[1], 'de'));
}
function buildScholars() {
  const buttons = [`<button class="ql-choice is-active" type="button" data-kind="scholar" data-value="all">Alle Gelehrten</button>`];
  primaryScholars().forEach(([key, label]) => {
    buttons.push(`<button class="ql-choice" type="button" data-kind="scholar" data-value="${esc(key)}">${esc(label)}</button>`);
  });
  scholarsPanel.innerHTML = buttons.join('');
}
function filtered() {
  let arr = SOURCES.filter(item => {
    const byCat = activeCategory === 'all' || item.cats.includes(activeCategory);
    const byScholar = activeScholar === 'all' || fold(item.speaker).includes(activeScholar) || (activeScholar === 'prophet' && /Prophet|Gesandte Allahs/i.test(item.speaker));
    const bySearch = !activeQuery || sourceText(item).includes(fold(activeQuery));
    return byCat && byScholar && bySearch;
  });
  arr.sort((a,b) => sortOrder === 'desc' ? b.q - a.q : a.q - b.q);
  return arr;
}
function card(item) {
  const href = `/q/${item.q}/`;
  return `<article class="ql-card">
    <div class="ql-qline">
      <a class="ql-qmark" href="${href}">Q ${String(item.q).padStart(2,'0')}</a>
      <span class="ql-cat">${esc(item.cat)}</span>
    </div>
    <a class="ql-card-link" href="${href}">
      <h3>${esc(item.title)}</h3>
      <p class="ql-speaker">${esc(item.speaker)}</p>
      <p class="ql-desc">${esc(item.desc)}</p>
    </a>
    <div class="ql-tags">${item.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="ql-actions">
      <a href="${href}" class="ql-open">Quellenlink öffnen</a>
      <button class="ql-copy" data-copy="${href}" type="button">Link kopieren</button>
    </div>
  </article>`;
}
function render() {
  const arr = filtered();
  const totalPages = Math.max(1, Math.ceil(arr.length / PER_PAGE));
  page = Math.min(Math.max(1, page), totalPages);
  const start = (page - 1) * PER_PAGE;
  const items = arr.slice(start, start + PER_PAGE);

  list.innerHTML = items.map(card).join('');
  empty.style.display = arr.length ? 'none' : 'block';
  count.textContent = arr.length === 1 ? '1 Aussage' : `${arr.length} Aussagen`;

  if (arr.length <= PER_PAGE) {
    pager.innerHTML = '';
  } else {
    let pages = '';
    for (let i = 1; i <= totalPages; i++) {
      pages += `<button type="button" class="ql-pagebtn ${i === page ? 'is-active':''}" data-page="${i}">${i}</button>`;
    }
    pager.innerHTML = `<button type="button" class="ql-pagebtn" data-page="${page-1}" ${page===1?'disabled':''}>Zurück</button>${pages}<button type="button" class="ql-pagebtn" data-page="${page+1}" ${page===totalPages?'disabled':''}>Weiter</button>`;
  }
}
function setActive(kind, value, label) {
  if (kind === 'category') {
    activeCategory = value;
    catLabel.textContent = displayCategory(value);
    document.querySelectorAll('[data-kind="category"]').forEach(b => b.classList.toggle('is-active', b.dataset.value === value));
  } else {
    activeScholar = value;
    scholarLabel.textContent = value === 'all' ? 'Alle' : label;
    document.querySelectorAll('[data-kind="scholar"]').forEach(b => b.classList.toggle('is-active', b.dataset.value === value));
  }
  page = 1;
  render();
}
document.addEventListener('click', e => {
  const panelBtn = e.target.closest('[data-panel]');
  if (panelBtn) {
    const panel = panelBtn.dataset.panel === 'categories' ? catsPanel : scholarsPanel;
    const other = panel === catsPanel ? scholarsPanel : catsPanel;
    panel.classList.toggle('is-open');
    other.classList.remove('is-open');
    return;
  }
  const choice = e.target.closest('.ql-choice');
  if (choice) {
    setActive(choice.dataset.kind, choice.dataset.value, choice.textContent.replace(/\s+\d+$/,'').trim());
    return;
  }
  const pageBtn = e.target.closest('.ql-pagebtn');
  if (pageBtn && !pageBtn.disabled) {
    page = Number(pageBtn.dataset.page || 1);
    render();
    document.querySelector('.ql-list-head')?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const copy = e.target.closest('.ql-copy');
  if (copy) {
    const url = new URL(copy.dataset.copy, location.origin).href;
    navigator.clipboard?.writeText(url).then(() => {
      const old = copy.textContent;
      copy.textContent = 'Kopiert';
      setTimeout(() => copy.textContent = old, 1100);
    });
  }
});
search.addEventListener('input', e => {
  activeQuery = e.target.value.trim();
  page = 1;
  render();
});
document.getElementById('sortToggle').addEventListener('click', e => {
  sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
  e.currentTarget.dataset.sort = sortOrder;
  e.currentTarget.textContent = sortOrder === 'desc' ? 'Neueste zuerst' : 'Älteste zuerst';
  page = 1;
  render();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  activeCategory = 'all';
  activeScholar = 'all';
  activeQuery = '';
  search.value = '';
  catLabel.textContent = 'Alle';
  scholarLabel.textContent = 'Alle';
  document.querySelectorAll('.ql-choice').forEach(b => b.classList.remove('is-active'));
  document.querySelector('[data-kind="category"][data-value="all"]').classList.add('is-active');
  document.querySelector('[data-kind="scholar"][data-value="all"]').classList.add('is-active');
  page = 1;
  render();
});
buildScholars();
render();
</script>
</body>
</html>
