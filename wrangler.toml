# Cloudflare Workers Static Assets — Besucher-App (dar-al-tawhid.de)
# Admin-Worker: cloudflare/wrangler.toml → dar-admin-publisher
#
# POST_PUSH_NO_CF_POLL: Workers Builds nicht bei Admin-Status-JSON.
# Echte App-Deploys laufen über GitHub Action „Deploy Besucher-App“.

name = "dar-al-tawhid-site"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]
main = "cloudflare/site-router.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[build]
# PRODUCTION_SINGLE_OWNER_V1: Cloudflare repository builds must never auto-publish.
# GitHub Actions "Deploy Besucher-App" is the sole production publisher.
watch_paths = [".cloudflare-manual-only/**"]

[vars]
PREVIEW_GATE_USER = "Dawud"
PREVIEW_GATE_PASS = "Malik20"

