</head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Wenn der Mensch seine Religion verliert</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Wenn der Mensch seine Religion verliert","Ein Mann verlässt sein Haus mit seiner Religion und kehrt zurück, ohne dass ihm davon noch etwas geblieben ist. Er geht zu einem Mann, der weder für ihn noch für sich selbst Schaden oder Nutzen bewirken kann. Er schwört ihm bei Allāh: »Du bist dies und jenes!« Dann kehrt er zurück, ohne sein Anliegen erreicht zu haben, und hat Allāh gegen sich erzürnt.","Ibn Masʿūd erwähnte die Fitnah. Die Warnung richtet sich gegen unwahrhaftige Schmeichelei um eines weltlichen Anliegens willen.","Mawqūf. Al-Ḥākim bewertet seinen Weg als ṣaḥīḥ nach den Bedingungen beider Šayḫs; er sagt, dass beide ihn nicht aufgenommen haben. Keine Behauptung eines Konsenses.","Die Parallelfassung bei aṭ-Ṭabarānī enthält die abweichenden Worte »Du hast gelogen und gesündigt«. Beide Fassungen laufen über Sufyān, Qays ibn Muslim und Ṭāriq ibn Šihāb. Die Formulierung ist eine ernste Warnung, kein pauschales Urteil über den Islam einer bestimmten Person.","Opfere deine Religion nicht für die Gunst eines Menschen.",["Ibn Masʿūd ist der Urheber dieser Gefährtenaussage.","Der Mann erreicht sein weltliches Anliegen.","Al-Ḥākim bewertet seinen Überlieferungsweg als authentisch.","Die Aussage warnt vor Schmeichelei um weltlicher Vorteile willen."]],"ar":["حين يفقد الإنسان دينه","إن الرجل ليخرج من بيته ومعه دينه فيرجع وما معه شيء منه يأتي الرجل لا يملك له ولا لنفسه ضرا ولا نفعا، فيقسم له بالله إنك لذيت وذيت فيرجع ما خلى من حاجته بشيء، وقد أسخط الله عليه","ذكر ابن مسعود الفتنة، وحذر من التملق الكاذب لأجل حاجة دنيوية.","أثر موقوف. قال الحاكم: صحيح على شرط الشيخين ولم يخرجاه. لا ندعي الإجماع على الحكم.","وفي رواية الطبراني: إنك كذبت وأذنبت. الطريقان يلتقيان عند سفيان عن قيس بن مسلم عن طارق بن شهاب. وهذا تحذير شديد لا حكم عام على إسلام شخص معين.","لا تضح بدينك من أجل رضا إنسان.",["ابن مسعود صاحب هذا الأثر.","حقق الرجل حاجته الدنيوية.","صحح الحاكم طريقه.","يحذر الأثر من التملق لأجل منفعة دنيوية."]],"en":["When a man loses his religion","A man leaves his house with his religion and returns with none of it left. He goes to a man who has no power to harm or benefit him or himself, and swears by Allah to him, ‘You are such and such!’ He returns having obtained nothing of his need and having incurred Allah’s displeasure.","Ibn Masʿūd mentioned tribulation and warned against dishonest flattery for worldly gain.","Mawqūf. Al-Ḥākim deemed his chain ṣaḥīḥ according to the conditions of the two shaykhs and said they did not record it. No consensus is claimed.","Al-Ṭabarānī’s version reads differently: ‘You have lied and sinned.’ Both routes meet at Sufyān, Qays ibn Muslim and Ṭāriq ibn Shihāb. This is a grave warning, not a blanket judgment on a particular person’s Islam.","Do not sacrifice your religion for human approval.",["Ibn Masʿūd made this Companion statement.","The man obtains his worldly objective.","Al-Ḥākim graded his chain authentic.","The report warns against flattery for worldly gain."]],"tr":["İnsan dinini kaybettiğinde","Bir adam evinden diniyle çıkar ve ondan hiçbir şey kalmadan döner. Kendisine de ona da zarar veya fayda vermeye gücü yetmeyen bir adama gider, Allah adına yemin ederek ona ‘Sen şöylesin, böylesin!’ der. İhtiyacından hiçbir şey elde edemeden, Allah’ın gazabını üzerine çekmiş olarak döner.","İbn Mesʿûd fitneden bahsederek dünyevi çıkar uğruna yalancı dalkavukluğa karşı uyardı.","Mevkuf. Hâkim kendi tarikini iki şeyhin şartına göre sahih saydı ve onların bunu rivayet etmediğini belirtti. İcma iddiası yoktur.","Taberânî’nin rivayetinde ‘Yalan söyledin ve günah işledin’ şeklinde farklı bir lafız vardır. İki tarik Süfyân, Kays b. Müslim ve Târık b. Şihâb’da birleşir. Bu ağır bir uyarıdır, belirli bir kişinin İslam’ı hakkında genel hüküm değildir.","Bir insanın rızası için dinini feda etme.",["Bu sahâbî sözünün sahibi İbn Mesʿûd’dur.","Adam dünyevi amacına ulaşır.","Hâkim kendi tarikini sahih saymıştır.","Eser dünyevi çıkar için dalkavukluğa karşı uyarır."]],"ku":["Dema ku mirov dînê xwe winda dike","Mirovek bi dînê xwe ji mala xwe derdikeve û vedigere bê ku tiştek ji dînê wî mabûbe. Ew diçe ba mirovekî ku ne ji bo wî ne jî ji bo xwe xwediyê zirar û sûdê ye. Bi navê Allah sond dixwe û dibêje: ‘Tu wisa û wisa yî!’ Bê ku tiştek ji hewcedariya xwe bi dest bixe vedigere û xezeba Allah li xwe dikişîne.","Ibn Mesûd behsa fitneyê kir û li dijî pesnê derewîn ji bo berjewendiya dinyayê hişyarî da.","Mewqûf. Hakim rêza xwe li gor şertên her du şeyxan sehîh dît û got ku wan ew neveguhast. Îdîaya îcmaê tune.","Di rivayeta Teberanî de gotin cuda ye: ‘Te derew kir û guneh kir.’ Her du rê li Sufyan, Qeys ibn Muslim û Tariq ibn Şihab digihîjin hev. Ev hişyariyeke giran e, ne hukmek giştî li ser Îslama kesekî taybet.","Ji bo razîkirina mirovekî dînê xwe feda neke.",["Ibn Mesûd xwediyê vê gotina sehabî ye.","Mirov armanca xwe ya dinyayê bi dest dixe.","Hakim rêza xwe sehîh dît.","Gotin li dijî pesnê derewîn ji bo sûda dinyayê hişyarî dide."]],"ckb":["کاتێک مرۆڤ دینەکەی لەدەست دەدات","پیاوێک لە ماڵەکەی بە دینەکەیەوە دەردەچێت و دەگەڕێتەوە بەبێ ئەوەی شتێک لە دینەکەی مابێت. دەچێتە لای پیاوێک کە نە بۆ ئەو و نە بۆ خۆی دەسەڵاتی زیان و سوودی هەیە. بە ناوی الله سوێندی بۆ دەخوات: تۆ وایت و وایت! بەبێ بەدەستهێنانی هیچ شتێک لە پێداویستییەکەی دەگەڕێتەوە و تووڕەیی الله ی بەسەر خۆیدا هێناوە.","ئیبن مەسعود باسی فیتنەی کرد و لە چاپڵووسی درۆینە بۆ بەرژەوەندی دنیایی ئاگاداری دا.","مەوقوفە. حاکم ڕێگاکەی خۆی بە مەرجی هەردوو شێخ سەحیح دانا و گوتی ئەوان نەیانهێناوە. بانگەشەی ئیجماع ناکرێت.","لە ڕیوایەتی تەبەرانیدا وشەکان جیاوازن: درۆت کرد و گوناهت کرد. هەردوو ڕێگا لە سوفیان، قەیس کوڕی موسلیم و تاریق کوڕی شیهاب یەکدەگرنەوە. ئەمە ئاگادارییەکی توندە، نە حوکمێکی گشتی دەربارەی ئیسلامی کەسێکی دیاریکراو.","دینەکەت فیدای ڕەزامەندی مرۆڤێک مەکە.",["ئیبن مەسعود خاوەنی ئەم وتەیەی هاوەڵە.","پیاوەکە بە ئامانجە دنیاییەکەی دەگات.","حاکم ڕێگاکەی خۆی سەحیح داناوە.","ئەم وتەیە لە چاپڵووسی بۆ بەرژەوەندی دنیایی ئاگاداری دەدات."]],"bs":["Kada čovjek izgubi svoju vjeru","Čovjek izađe iz kuće sa svojom vjerom i vrati se a od nje mu ništa nije ostalo. Ode čovjeku koji ne može ni njemu ni sebi pribaviti korist ili štetu, pa mu se Allahom zakune: ‘Ti si takav i takav!’ Vrati se ne postigavši ništa od svoje potrebe i izazvavši Allahovu srdžbu.","Ibn Mesud spomenuo je smutnju i upozorio na neiskreno laskanje radi dunjalučke koristi.","Mevkuf. El-Hakim je svoj lanac ocijenio vjerodostojnim prema uvjetima dvojice šejhova i naveo da ga nisu zabilježili. Ne tvrdi se konsenzus.","Kod et-Taberanija stoje drugačije riječi: ‘Slagao si i zgriješio.’ Oba puta sastaju se kod Sufjana, Kajsa ibn Muslima i Tarika ibn Šihaba. Ovo je ozbiljno upozorenje, ne opći sud o islamu određene osobe.","Ne žrtvuj vjeru radi ljudskog odobravanja.",["Ibn Mesud je autor ove izjave ashaba.","Čovjek postiže svoj dunjalučki cilj.","El-Hakim je svoj lanac ocijenio vjerodostojnim.","Predaja upozorava na laskanje radi dunjalučke koristi."]],"fr":["Quand un homme perd sa religion","Un homme sort de chez lui avec sa religion et revient sans qu’il lui en reste rien. Il se rend auprès d’un homme qui ne peut procurer ni à lui ni à lui-même un préjudice ou un bienfait. Il lui jure par Allah : « Tu es ceci et cela ! » Il revient sans avoir rien obtenu de ce qu’il recherchait, ayant encouru le courroux d’Allah.","Ibn Masʿūd évoqua la fitna et mit en garde contre la flatterie mensongère pour un intérêt mondain.","Mawqūf. Al-Ḥākim jugea sa chaîne authentique selon les conditions des deux cheikhs, précisant qu’ils ne l’ont pas rapportée. Aucun consensus n’est affirmé.","La version d’aṭ-Ṭabarānī comporte les mots différents : « Tu as menti et péché. » Les deux voies se rejoignent auprès de Sufyān, Qays ibn Muslim et Ṭāriq ibn Shihāb. Il s’agit d’un avertissement grave, non d’un jugement général sur l’islam d’une personne particulière.","Ne sacrifie pas ta religion pour plaire à un homme.",["Ibn Masʿūd est l’auteur de cette parole de Compagnon.","L’homme atteint son objectif mondain.","Al-Ḥākim juge sa chaîne authentique.","Le récit met en garde contre la flatterie pour un gain mondain."]],"es":["Cuando un hombre pierde su religión","Un hombre sale de su casa con su religión y regresa sin que le quede nada de ella. Acude a un hombre que no puede procurarle daño ni beneficio a él ni a sí mismo y le jura por Allah: «¡Eres tal y cual!» Regresa sin haber conseguido nada de lo que necesitaba y habiendo incurrido en la ira de Allah.","Ibn Masʿūd mencionó la tribulación y advirtió contra la adulación mentirosa por un interés mundano.","Mawqūf. Al-Ḥākim consideró su cadena auténtica según las condiciones de los dos shayjs y señaló que ellos no la recogieron. No se afirma consenso.","La versión de aṭ-Ṭabarānī dice de otra manera: «Has mentido y pecado». Ambas vías coinciden en Sufyān, Qays ibn Muslim y Ṭāriq ibn Shihāb. Es una advertencia grave, no un juicio general sobre el islam de una persona concreta.","No sacrifiques tu religión por la aprobación de un hombre.",["Ibn Masʿūd es el autor de este dicho de un compañero.","El hombre alcanza su objetivo mundano.","Al-Ḥākim consideró auténtica su cadena.","El relato advierte contra la adulación por un beneficio mundano."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Explanation","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Açıklama","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendir","Doğru cevap","Kaynak"],"ku":["Ziman","Çarçove","Gotin","Nivîsa erebî","Isnad","Nirxandin","Şîrove","Encam","Çavkaniyên resen","Zêdetir fêr bibe","Rast","Şaş","Pirsa din","Encam","Dîsa fêr bibe","Vegere çavkaniyê","Gotinê binirxîne","Bersiva rast","Çavkanî"],"ckb":["زمان","چوارچێوە","دەق","دەقی عەرەبی","سەنەد","هەڵسەنگاندن","ڕوونکردنەوە","ئەنجام","سەرچاوە ڕەسەنەکان","زانیاری زیاتر","ڕاست","هەڵە","پرسیاری دواتر","ئەنجام","دووبارە فێربە","گەڕانەوە بۆ سەرچاوە","وتەکە هەڵبسەنگێنە","وەڵامی ڕاست","سەرچاوە"],"bs":["Jezik","Kontekst","Tekst","Arapski izvornik","Lanac","Ocjena","Objašnjenje","Zaključak","Izvorni dokazi","Produbi znanje","Tačno","Netačno","Sljedeće pitanje","Rezultat","Uči ponovo","Nazad na izvor","Provjeri tvrdnju","Tačan odgovor","Izvor"],"fr":["Langue"
