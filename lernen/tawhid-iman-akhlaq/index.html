<style>
*{box-sizing:border-box}html{min-width:0}body.heritage-learning.q47learn{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;background:#f7f4ec;color:#253c31}
html[data-q-theme="dark"] body.heritage-learning.q47learn{background:#101c21;color:#f3e8d0}
.q47-main{width:min(100% - 28px,710px);margin:0 auto;padding:clamp(18px,5vw,32px) 0 calc(48px + env(safe-area-inset-bottom,0px))}
.q47-head{text-align:center;padding:12px 0 18px}.q47-logo{width:66px;height:66px;object-fit:contain;margin:0 auto 9px;display:block}.q47-brand{font:700 clamp(18px,4.5vw,26px)/1.3 Georgia,serif;letter-spacing:.05em}.q47-sign{color:#917348;font-style:italic;margin:0}.q47-kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#927548;font-weight:800}
.q47-main h1{font:700 clamp(26px,6vw,38px)/1.2 Georgia,serif;overflow-wrap:break-word;margin:9px 0}.q47-main p{margin:10px 0}
.q47-card{border:1px solid #bba985;border-radius:20px;background:#fffdf8;padding:clamp(18px,4vw,26px);box-shadow:0 8px 28px #44371913;margin:18px 0}
html[data-q-theme="dark"] .q47-card{background:#1c3037;border-color:#847454}.q47-card h2{margin:0 0 12px;font:700 clamp(20px,4.3vw,25px)/1.3 Georgia,serif}.q47-muted{opacity:.8;font-size:.91rem}
.q47-options{display:grid;gap:10px;margin-top:16px}.q47-option{width:100%;min-height:52px;text-align:left;border:1px solid #ad9c7b;background:#f9f5ed;color:#293d32;border-radius:12px;padding:12px 14px;font:600 15px/1.4 system-ui,sans-serif;cursor:pointer}
html[data-q-theme="dark"] .q47-option{background:#283d43;color:#f3e8d0;border-color:#7e755c}.q47-option[data-state="correct"]{border:2px solid #37925a}.q47-option[data-state="wrong"]{border:2px solid #bc6549}.q47-option:focus-visible,.q47-next:focus-visible{outline:3px solid #ba964f;outline-offset:3px}.q47-feedback{margin:12px 0;min-height:20px;font-size:.92rem;font-weight:600}.q47-next{min-height:48px;border:0;border-radius:11px;padding:11px 20px;color:#15272d;background:#d9bc7f;font-weight:800;cursor:pointer}.q47-next:disabled{opacity:.45;cursor:default}
.q47-progress{display:flex;justify-content:space-between;align-items:center;color:#9b7c46;font-size:.86rem;font-weight:700;gap:12px}.q47-note{font-size:.89rem;opacity:.8}.q47-result[hidden],.q47-card[hidden]{display:none!important}
</style>
<script defer src="/assets/dar-reading-surface-v1.js?v=20261101-1"></script></head>
<body class="heritage-learning q47learn">
<main class="q47-main">
<header class="q47-head"><img class="q47-logo" src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD Logo"><div class="q47-brand">DĀR AL TAWḤĪD</div><p class="q47-sign">by Serhat Abu Malik</p><p class="q47-kicker">Quiz · Vier Fragen</p><h1>Tawḥīd, Īmān und Akhlāq</h1></header>
<section class="q47-card" id="q47Quiz" aria-live="polite">
<div class="q47-progress"><span id="q47Count">Frage 1 von 4</span><span id="q47Score">0 richtig</span></div>
<h2 id="q47Question">Was wird nach der überlieferten Erläuterung von Ibn ʿAbbās mit Gerechtigkeit verbunden?</h2>
<div id="q47Options" class="q47-options"></div>
<p id="q47Feedback" class="q47-feedback" role="status"></p>
<button id="q47Next" class="q47-next" type="button" disabled>Nächste Frage →</button>
</section>
<section id="q47Result" class="q47-card q47-result" hidden><h2>Lerneinheit abgeschlossen</h2><p id="q47Final"></p><button id="q47Again" class="q47-next" type="button">Erneut üben</button></section>
</main>
<script>
(()=>{
"use strict";
const questions=[
{q:"Was wird nach der überlieferten Erläuterung von Ibn ʿAbbās mit Gerechtigkeit verbunden?",a:["Das Glaubenszeugnis, dass es keine anbetungswürdige Gottheit außer Allah gibt","Nur gesellschaftlicher Wohlstand","Eine bestimmte Reise"],correct:0,why:"Ibn ʿAbbās wird die Erklärung der Gerechtigkeit durch das Glaubenszeugnis zugeschrieben."},
{q:"Wie wird Iḥsān in der hier behandelten Erläuterung von Ibn ʿAbbās wiedergegeben?",a:["Als das Weglassen aller Pflichten","Als Erfüllung der Pflichten","Als äußerer Reichtum"],correct:1,why:"Der hier wiedergegebene Sinn betont die Erfüllung der Pflichten."},
{q:"Was betont die überlieferte Aussage von Qatādah?",a:["Dass guter Charakter bedeutungslos sei","Dass nur die Sprache entscheidend sei","Dass gute Charakterzüge geboten und schlechte verboten werden"],correct:2,why:"Qatādah erwähnt die guten Charakterzüge und das Verbot schlechter Handlungen."},
{q:"Wie sind diese deutschen Aussagen auf der Quellenkarte gekennzeichnet?",a:["Als sinngemäße Wiedergaben früher Überlieferungen","Als wörtliche prophetische Ḥadīṯe","Als vollständig neu erfundene Rechtsurteile"],correct:0,why:"Sie werden als sinngemäße Athār wiedergegeben, nicht als prophetische Ḥadīṯe."}
];
let idx=0,score=0,answered=false;
const el=id=>document.getElementById(id), quiz=el("q47Quiz"),result=el("q47Result");
function render(){
 answered=false;const q=questions[idx];el("q47Count").textContent="Frage "+(idx+1)+" von "+questions.length;el("q47Score").textContent=score+" richtig";el("q47Question").textContent=q.q;el("q47Feedback").textContent="";el("q47Next").disabled=true;el("q47Next").textContent=idx===questions.length-1?"Ergebnis anzeigen":"Nächste Frage →";
 const wrap=el("q47Options");wrap.replaceChildren();
 q.a.forEach((option,n)=>{const b=document.createElement("button");b.type="button";b.className="q47-option";b.textContent=String.fromCharCode(65+n)+". "+option;b.addEventListener("click",()=>{if(answered)return;answered=true;if(n===q.correct)score++;wrap.querySelectorAll("button").forEach((btn,i)=>{btn.disabled=true;if(i===q.correct)btn.dataset.state="correct";else if(i===n)btn.dataset.state="wrong"});el("q47Feedback").textContent=(n===q.correct?"Richtig. ":"Noch nicht richtig. ")+q.why;el("q47Next").disabled=false;el("q47Score").textContent=score+" richtig"});wrap.appendChild(b)})
}
el("q47Next").addEventListener("click",()=>{if(!answered)return;if(idx<questions.length-1){idx++;render()}else{quiz.hidden=true;result.hidden=false;el("q47Final").textContent=score+" von "+questions.length+" Fragen richtig beantwortet."}});
el("q47Again").addEventListener("click",()=>{idx=0;score=0;result.hidden=true;quiz.hidden=false;render()});
render();
})();
</script>
</body></html>
