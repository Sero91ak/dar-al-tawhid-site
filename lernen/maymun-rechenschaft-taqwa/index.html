<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rechenschaft beginnt bei dir · Q71</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/maymun-rechenschaft-taqwa/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .quiz-button{margin:8px;min-width:100px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning" data-learning-stage="quiz"><main data-dar-no-translate="qsource-nine-locales"><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Rechenschaft beginnt bei dir</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Rechenschaft beginnt bei dir",["Maymūn ibn Mihrān sagte, ein Mann gehöre erst dann zu den Muttaqīn, wenn er sich selbst strenger zur Rechenschaft zieht als seinen Teilhaber.","Die Aussage ist ein Ḥadīṯ des Propheten mit ausdrücklicher ṣaḥīḥ-Wertung.","Als Prüfstein nennt Maymūn, ob Essen, Kleidung und Trinken aus Ḥalāl oder aus Ḥarām stammen.","Die Fassungen bei Wakīʿ und Ibn Abī Šaybah haben genau denselben Wortlaut wie die Ḥilyah."],["So lautet der Wortlaut bei Abū Nuʿaym, Ḥilyat al-Awliyāʾ 4/89.","Sie ist ein Āṯar des Tābiʿī Maymūn ibn Mihrān. Eine ausdrückliche ṣaḥīḥ-Wertung dieses Wortlauts wurde nicht gefunden.","Ja. In der Fassung der Ḥilyah fragt er: aus Erlaubtem oder aus Verbotenem?","Nein. Sie sind kürzer und sagen „taqiyyan“; bei Wakīʿ fehlt auch „ašadd“. Die Fassungen bleiben getrennt."]],"ar":["المحاسبة تبدأ بنفسك",["قال ميمون بن مهران إن الرجل لا يكون من المتقين حتى يحاسب نفسه أشد من محاسبة شريكه.","هذا القول حديث نبوي مع تصريح بتصحيحه.","جعل ميمون المعيار: هل الطعام واللباس والشراب من حلال أم من حرام.","لفظ وكيع وابن أبي شيبة مطابق تماما للفظ الحلية."],["هكذا اللفظ عند أبي نعيم في حلية الأولياء ٤/٨٩.","هو أثر للتابعي ميمون بن مهران، ولم نجد تصريحا بتصحيح هذا اللفظ.","نعم، في لفظ الحلية يسأل: أمن حل ذلك أم من حرام؟","لا، هما أقصر وفيهما «تقيا»، وليس عند وكيع «أشد». تبقى الألفاظ منفصلة."]],"en":["Accountability Begins with You",["Maymūn ibn Mihrān said that a man is only among the muttaqīn when he holds himself to account more strictly than his business partner.","The saying is a hadith of the Prophet with an explicit ṣaḥīḥ grading.","As the test, Maymūn names whether food, clothing and drink come from ḥalāl or from ḥarām.","The versions in Wakīʿ and Ibn Abī Shaybah have exactly the same wording as the Ḥilyah."],["That is the wording in Abū Nuʿaym, Ḥilyat al-Awliyāʾ 4/89.","It is an athar of the Tābiʿī Maymūn ibn Mihrān. No explicit ṣaḥīḥ grading of this wording was found.","Yes. In the wording of the Ḥilyah he asks: from the lawful or from the forbidden?","No. They are shorter and say “taqiyyan”; Wakīʿ also lacks “ashadd”. The wordings stay separate."]],"tr":["Hesap Kendinden Başlar",["Meymûn b. Mihrân, kişinin ancak kendini ortağından daha sıkı hesaba çektiğinde muttakîlerden olacağını söyledi.","Bu söz, açıkça sahih hükmü verilmiş bir Peygamber hadisidir.","Meymûn ölçüt olarak yiyecek, giyecek ve içeceğin helalden mi haramdan mı olduğunu gösterir.","Vekî‘ ve İbn Ebû Şeybe’deki rivayetler Hilye ile birebir aynı lafızdadır."],["Ebû Nuaym’ın Hilyetü’l-evliyâ’sında 4/89’da lafız böyledir.","Bu, tâbiî Meymûn b. Mihrân’ın bir eseridir. Bu lafız için açık bir sahih hükmü bulunamadı.","Evet. Hilye lafzında şöyle sorar: Helalden mi, haramdan mı?","Hayır. Onlar daha kısadır ve “takiyyen” der; Vekî‘de “eşedd” de yoktur. Lafızlar ayrı kalır."]],"ku":["Hesab ji te dest pê dike",["Meymûn kurê Mihran got ku mirov tenê dibe ji muttaqînan dema ku xwe ji hevparê xwe hişktir hesab dike.","Ev gotin hedîsa Pêxember e û bi eşkere sehîh hatiye hukimkirin.","Meymûn wekî pîvan dibêje: gelo xwarin, cil û vexwarin ji helalê ne an ji heramê.","Rîwayetên Wekî û Ibn Ebî Şeybe tam wekî gotina Hilyeyê ne."],["Li cem Ebû Nuaym, Hilyetu’l-Ewliya 4/89, gotin wiha ye.","Ew eserê tabiî Meymûn kurê Mihran e. Ji bo vê gotinê hukmekî sehîh ê eşkere nehat dîtin.","Erê. Di gotina Hilyeyê de dipirse: ji helalê an ji heramê?","Na. Ew kurttir in û dibêjin “teqiyyen”; li cem Wekî “eşedd” jî tune ye. Gotin cuda dimînin."]],"ckb":["لێپرسینەوە لە خۆتەوە دەست پێدەکات",["مەیموونی کوڕی میهران وتی پیاو تەنها کاتێک لە موتتەقینە کە خۆی توندتر لە هاوبەشەکەی لێپرسینەوە بکات.","ئەم وتەیە فەرموودەی پێغەمبەرە و بە ڕوونی سەحیح کراوە.","مەیموون پێوەرەکە دەکاتە ئەوەی خواردن و جل و خواردنەوە لە حەڵاڵەوەن یان لە حەرامەوە.","ڕیوایەتەکانی وەکیع و ئیبن ئەبی شەیبە ڕێک وەک دەقی حیلیەن."],["لای ئەبو نوعەیم لە حیلیەتول ئەولیا ٤/٨٩ دەقەکە بەم شێوەیەیە.","ئەمە ئەسەری تابیعی مەیموونی کوڕی میهرانە. حوکمێکی ڕوونی سەحیح بۆ ئەم دەقە نەدۆزرایەوە.","بەڵێ. لە دەقی حیلیەدا دەپرسێت: لە حەڵاڵەوە یان لە حەرامەوە؟","نەخێر. ئەوان کورتترن و «تەقییەن» دەڵێن؛ لای وەکیع «أشد»یش نییە. دەقەکان جیا دەمێننەوە."]],"bs":["Polaganje računa počinje od tebe",["Mejmun ibn Mihran je rekao da je čovjek od muttekina tek kada sebe strožije poziva na račun nego svog ortaka.","Ova izjava je hadis Poslanika s izričitom ocjenom sahih.","Kao mjerilo Mejmun navodi da li hrana, odjeća i piće dolaze iz halala ili iz harama.","Verzije kod Veki’a i Ibn Ebi Šejbe imaju potpuno isti tekst kao Hilja."],["Tako glasi tekst kod Ebu Nuajma, Hiljetul-evlija 4/89.","To je eser tabiina Mejmuna ibn Mihrana. Izričita ocjena sahih za ovaj tekst nije pronađena.","Da. U verziji Hilje on pita: iz dozvoljenog ili iz zabranjenog?","Ne. One su kraće i kažu „tekijjen“; kod Veki’a nema ni „ešedd“. Verzije ostaju odvojene."]],"fr":["Le compte commence par toi",["Maymūn ibn Mihrān a dit que l’homme ne fait partie des muttaqīn que s’il se demande des comptes plus sévèrement qu’à son associé.","Cette parole est un hadith du Prophète avec un jugement explicite ṣaḥīḥ.","Comme critère, Maymūn cite l’origine licite ou illicite de la nourriture, des vêtements et de la boisson.","Les versions de Wakīʿ et d’Ibn Abī Šaybah ont exactement la même formulation que la Ḥilyah."],["C’est la formulation d’Abū Nuʿaym, Ḥilyat al-Awliyāʾ 4/89.","C’est un athar du Tābiʿī Maymūn ibn Mihrān. Aucun jugement ṣaḥīḥ explicite de cette formulation n’a été trouvé.","Oui. Dans la formulation de la Ḥilyah, il demande : du licite ou de l’illicite ?","Non. Elles sont plus courtes et disent « taqiyyan » ; chez Wakīʿ, « ašadd » manque aussi. Les formulations restent séparées."]],"es":["La rendición de cuentas empieza por ti",["Maymūn ibn Mihrān dijo que el hombre solo está entre los muttaqīn cuando se pide cuentas con más rigor que a su socio.","El dicho es un hadiz del Profeta con un juicio explícito de ṣaḥīḥ.","Como criterio, Maymūn menciona si la comida, la ropa y la bebida vienen de lo ḥalāl o de lo ḥarām.","Las versiones de Wakīʿ e Ibn Abī Šaybah tienen exactamente la misma redacción que la Ḥilyah."],["Así es la redacción de Abū Nuʿaym, Ḥilyat al-Awliyāʾ 4/89.","Es un athar del Tābiʿī Maymūn ibn Mihrān. No se encontró un juicio ṣaḥīḥ explícito de esta redacción.","Sí. En la redacción de la Ḥilyah pregunta: ¿de lo lícito o de lo ilícito?","No. Son más cortas y dicen «taqiyyan»; en Wakīʿ falta además «ašadd». Las redacciones se mantienen separadas."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Explanation","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Açıklama","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendir","Doğru cevap","Kaynak"],"ku":["Ziman","Çarçove","Gotin","Nivîsa erebî","Isnad","Nirxandin","Şîrove","Encam","Çavkaniyên resen","Zêdetir fêr bibe","Rast","Şaş","Pirsa din","Encam","Dîsa fêr bibe","Vegere çavkaniyê","Gotinê binirxîne","Bersiva rast","Çavkanî"],"ckb":["زمان","چوارچێوە","دەق","دەقی عەرەبی","سەنەد","هەڵسەنگاندن","ڕوونکردنەوە","ئەنجام","سەرچاوە ڕەسەنەکان","زانیاری زیاتر","ڕاست","هەڵە","پرسیاری دواتر","ئەنجام","دووبارە فێربە","گەڕانەوە بۆ سەرچاوە","وتەکە هەڵبسەنگێنە","وەڵامی ڕاست","سەرچاوە"],"bs":["Jezik","Kontekst","Tekst","Arapski izvornik","Lanac","Ocjena","Objašnjenje","Zaključak","Izvorni dokazi","Produbi znanje","Tačno","Netačno","Sljedeće pitanje","Rezultat","Uči ponovo","Nazad na izvor","Provjeri tvrdnju","Tačan odgovor","Izvor"],"fr":["Langue","Contexte","Texte","Original arabe","Chaîne","Évaluation","Explication","Conclusion","Sources originales","Approfondir","Vrai","Faux","Question suivante","Résultat","Recommencer","Retour à la source","Évaluer l’affirmation","Bonne réponse","Source"],"es":["Idioma","Contexto","Texto","Original árabe","Cadena","Evaluación","Explicación","Conclusión","Fuentes originales","Profundizar","Verdadero","Falso","Siguiente pregunta","Resultado","Repetir","Volver a la fuente","Evalúa la afirmación","Respuesta correcta","Fuente"]}}</script><script>const {loc,ui}=JSON.parse(document.getElementById('data').textContent);const by=id=>document.getElementById(id),sel=by('language');let lang=new URLSearchParams(location.search).get('lang');try{lang=lang||localStorage.getItem('darAdultPreferredLocaleV1')}catch(e){}function setLang(l){lang=loc[l]?l:'de';sel.value=lang;document.documentElement.lang=lang;document.documentElement.dir=['ar','ckb'].includes(lang)?'rtl':'ltr';try{localStorage.setItem('darAdultPreferredLocaleV1',lang)}catch(e){}}let pos=0,score=0,answered=false;const keys=[true,false,true,false];function show(){const d=loc[lang],u=ui[lang];answered=false;by('result').hidden=true;by('quiz').hidden=false;by('progress').textContent=(pos+1)+' / 4';by('prompt').textContent=u[16];by('question').textContent=d[1][pos];by('yes').textContent=u[10];by('no').textContent=u[11];by('yes').disabled=by('no').disabled=false;by('feedback').textContent='';by('next').disabled=true;by('next').textContent=pos===3?u[13]:u[12]}function choose(x){if(answered)return;answered=true;if(x===keys[pos])score++;by
