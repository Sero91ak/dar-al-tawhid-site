<style>
*{box-sizing:border-box}html{min-width:0}body.heritage-learning.q48learn{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;background:#f7f4ec;color:#253c31}
html[data-q-theme="dark"] body.heritage-learning.q48learn{background:#101c21;color:#f3e8d0}
.q48-main{width:min(100% - 28px,710px);margin:0 auto;padding:clamp(18px,5vw,32px) 0 calc(48px + env(safe-area-inset-bottom,0px))}
.q48-head{text-align:center;padding:12px 0 18px}.q48-logo{width:66px;height:66px;object-fit:contain;margin:0 auto 9px;display:block}.q48-brand{font:700 clamp(18px,4.5vw,26px)/1.3 Georgia,serif;letter-spacing:.05em}.q48-sign{color:#917348;font-style:italic;margin:0}.q48-kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#927548;font-weight:800}
.q48-main h1{font:700 clamp(26px,6vw,38px)/1.2 Georgia,serif;overflow-wrap:break-word;margin:9px 0}.q48-main p{margin:10px 0}
.q48-card{border:1px solid #bba985;border-radius:20px;background:#fffdf8;padding:clamp(18px,4vw,26px);box-shadow:0 8px 28px #44371913;margin:18px 0}
html[data-q-theme="dark"] .q48-card{background:#1c3037;border-color:#847454}.q48-card h2{margin:0 0 12px;font:700 clamp(20px,4.3vw,25px)/1.3 Georgia,serif}.q48-muted{opacity:.8;font-size:.91rem}
.q48-options{display:grid;gap:10px;margin-top:16px}.q48-option{width:100%;min-height:52px;text-align:left;border:1px solid #ad9c7b;background:#f9f5ed;color:#293d32;border-radius:12px;padding:12px 14px;font:600 15px/1.4 system-ui,sans-serif;cursor:pointer}
html[data-q-theme="dark"] .q48-option{background:#283d43;color:#f3e8d0;border-color:#7e755c}.q48-option[data-state="correct"]{border:2px solid #37925a}.q48-option[data-state="wrong"]{border:2px solid #bc6549}.q48-option:focus-visible,.q48-next:focus-visible{outline:3px solid #ba964f;outline-offset:3px}.q48-feedback{margin:12px 0;min-height:20px;font-size:.92rem;font-weight:600}.q48-next{min-height:48px;border:0;border-radius:11px;padding:11px 20px;color:#15272d;background:#d9bc7f;font-weight:800;cursor:pointer}.q48-next:disabled{opacity:.45;cursor:default}
.q48-progress{display:flex;justify-content:space-between;align-items:center;color:#9b7c46;font-size:.86rem;font-weight:700;gap:12px}.q48-note{font-size:.89rem;opacity:.8}.q48-result[hidden],.q48-card[hidden]{display:none!important}
</style>
<script defer src="/assets/dar-reading-surface-v1.js?v=20261101-1"></script></head>
<body class="heritage-learning q48learn">
<main class="q48-main">
<header class="q48-head"><img class="q48-logo" src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD Logo"><div class="q48-brand">DĀR AL TAWḤĪD</div><p class="q48-sign">by Serhat Abu Malik</p><p class="q48-kicker">Quiz · Vier Fragen</p><h1>Die Seele prüfen</h1></header>
<section class="q48-card" id="q48Quiz" aria-live="polite">
<div class="q48-progress"><span id="q48Count">Frage 1 von 4</span><span id="q48Score">0 richtig</span></div>
<h2 id="q48Question">Wen prüft der Gläubige nach al-Ḥasan al-Baṣrī?</h2>
<div id="q48Options" class="q48-options"></div>
<p id="q48Feedback" class="q48-feedback" role="status"></p>
<button id="q48Next" class="q48-next" type="button" disabled>Nächste Frage →</button>
</section>
<section id="q48Result" class="q48-card q48-result" hidden><h2>Lerneinheit abgeschlossen</h2><p id="q48Final"></p><button id="q48Again" class="q48-next" type="button">Erneut üben</button></section>
</main>
<script>
(()=>{
"use strict";
const questions=[
  {
    "q": "Wen prüft der Gläubige nach al-Ḥasan al-Baṣrī?",
    "a": [
      "Zuerst sich selbst und sein Handeln",
      "Ausschließlich andere Menschen",
      "Nur seine wirtschaftliche Lage"
    ],
    "correct": 0,
    "why": "Der Athar nennt die Selbstprüfung des Gläubigen um Allāhs willen."
  },
  {
    "q": "Für wen wird die Abrechnung am Tag der Auferstehung nach dieser Aussage leichter?",
    "a": [
      "Für diejenigen, die ihre eigene Rechenschaft völlig vergessen",
      "Für jene, die sich schon im Diesseits selbst zur Rechenschaft ziehen",
      "Für jene, die sich über andere erheben"
    ],
    "correct": 1,
    "why": "Al-Ḥasan verbindet die Erleichterung der Abrechnung mit der Selbstprüfung im Diesseits."
  },
  {
    "q": "Weshalb wird die Abrechnung für manche Menschen schwer?",
    "a": [
      "Weil sie im Diesseits ihr Verhalten ohne Selbstprüfung laufen ließen",
      "Weil sie regelmäßig ihre Fehler korrigierten",
      "Weil sie sich vor Allah verantwortlich fühlten"
    ],
    "correct": 0,
    "why": "Die Überlieferung stellt das Handeln ohne Rechenschaft der bewussten Selbstprüfung gegenüber."
  },
  {
    "q": "Wie beschreibt der ausführlichere Athar das Verhalten gegenüber einer verlockenden Begierde?",
    "a": [
      "Sie unbedingt erfüllen, wenn man sie begehrt",
      "Sich von jeder Rücksicht auf das eigene Verhalten lösen",
      "Das eigene Verlangen prüfen und davon ablassen, wenn es nicht richtig ist"
    ],
    "correct": 2,
    "why": "Der längere Wortlaut nennt den Verzicht auf etwas Begehrtes und die Rückkehr zur Selbstprüfung nach einem Fehltritt."
  }
];
let idx=0,score=0,answered=false;
const el=id=>document.getElementById(id), quiz=el("q48Quiz"),result=el("q48Result");
function render(){
 answered=false;const q=questions[idx];el("q48Count").textContent="Frage "+(idx+1)+" von "+questions.length;el("q48Score").textContent=score+" richtig";el("q48Question").textContent=q.q;el("q48Feedback").textContent="";el("q48Next").disabled=true;el("q48Next").textContent=idx===questions.length-1?"Ergebnis anzeigen":"Nächste Frage →";
 const wrap=el("q48Options");wrap.replaceChildren();
 q.a.forEach((option,n)=>{const b=document.createElement("button");b.type="button";b.className="q48-option";b.textContent=String.fromCharCode(65+n)+". "+option;b.addEventListener("click",()=>{if(answered)return;answered=true;if(n===q.correct)score++;wrap.querySelectorAll("button").forEach((btn,i)=>{btn.disabled=true;if(i===q.correct)btn.dataset.state="correct";else if(i===n)btn.dataset.state="wrong"});el("q48Feedback").textContent=(n===q.correct?"Richtig. ":"Noch nicht richtig. ")+q.why;el("q48Next").disabled=false;el("q48Score").textContent=score+" richtig"});wrap.appendChild(b)})
}
el("q48Next").addEventListener("click",()=>{if(!answered)return;if(idx<questions.length-1){idx++;render()}else{quiz.hidden=true;result.hidden=false;el("q48Final").textContent=score+" von "+questions.length+" Fragen richtig beantwortet."}});
el("q48Again").addEventListener("click",()=>{idx=0;score=0;result.hidden=true;quiz.hidden=false;render()});
render();
})();
</script>
</body></html>
