main><script type="application/json" id="data">{"loc":{"de":["Liebe und Hass dürfen dich nicht blenden","Lass deine Liebe nicht zur Vernarrtheit und deinen Hass nicht zur Vernichtung werden. Ich fragte: »Wie ist das gemeint?« Er sagte: »Wenn du liebst, bist du vernarrt wie ein Kind; und wenn du hasst, wünschst du deinem Gefährten den Untergang.«","Aslam berichtet einen Rat ʿUmars über übermäßige Liebe und zerstörerischen Hass.","Mawqūf. Al-Albānī: ṣaḥīḥ al-isnād, Ṣaḥīḥ al-Adab al-Mufrad Nr. 993.","Saʿīd ibn Abī Maryam → Muḥammad ibn Ǧaʿfar → Zayd ibn Aslam → sein Vater Aslam → ʿUmar. Eine Parallelfassung formuliert den Rat als Verbot. Die Warnung richtet sich gegen Maßlosigkeit, nicht gegen jedes Gefühl von Liebe oder Abneigung.","Bleibe gerecht, auch wenn deine Gefühle dich in eine andere Richtung drängen.",["Aslam berichtet die Aussage ʿUmars.","ʿUmar empfiehlt maßlose Liebe.","Al-Albānī bewertet die Überlieferungskette als authentisch.","Die Aussage warnt davor, anderen aus Hass den Untergang zu wünschen."]],"ar":["لا تدع الحب والبغض يعميانك","لا يكن حبك كلفا ولا بغضك تلفا، فقلت: كيف ذاك؟ قال: إذا أحببت كلفت كلف الصبي، وإذا أبغضت أحببت لصاحبك التلف","يروي أسلم نصيحة عمر في الحب المفرط والبغض المهلك.","أثر موقوف. قال الألباني: إسناده صحيح، صحيح الأدب المفرد رقم 993.","سعيد بن أبي مريم عن محمد بن جعفر عن زيد بن أسلم عن أبيه أسلم عن عمر. وفي لفظ آخر ورد النهي صريحا. التحذير من الإفراط لا من مطلق الحب والبغض.","الزم العدل وإن خالفتك مشاعرك.",["أسلم يروي قول عمر.","عمر يوصي بالحب المفرط.","صحح الألباني الإسناد.","يحذر الأثر من تمني هلاك الآخر بسبب البغض."]],"en":["Do not let love and hatred blind you","Do not let your love become infatuation or your hatred destruction. I asked, ‘How is that?’ He said, ‘When you love, you become infatuated like a child; when you hate, you wish destruction upon your companion.’","Aslam reports ʿUmar’s advice on excessive love and destructive hatred.","Mawqūf. Al-Albānī: authentic chain, Ṣaḥīḥ al-Adab al-Mufrad 993.","Saʿīd ibn Abī Maryam → Muḥammad ibn Jaʿfar → Zayd ibn Aslam → his father Aslam → ʿUmar. A parallel version expresses the counsel as a prohibition. It warns against excess, not every feeling of love or dislike.","Remain just even when your feelings pull you elsewhere.",["Aslam reports ʿUmar’s statement.","ʿUmar recommends excessive love.","Al-Albānī grades the chain authentic.","The statement warns against wishing another person’s destruction out of hatred."]],"tr":["Sevgi ve nefret seni kör etmesin","Sevgin aşırı tutkuya, nefretin yıkıma dönüşmesin. ‘Bu nasıl olur?’ diye sordum. ‘Sevdiğinde çocuk gibi tutkulu olursun; nefret ettiğinde arkadaşının helakini istersin’ dedi.","Eslem, Ömer’in aşırı sevgi ve yıkıcı nefret hakkındaki öğüdünü aktarır.","Mevkuf. Elbânî: isnadı sahih, Sahîhu’l-Edebi’l-Müfred 993.","Saîd b. Ebî Meryem → Muhammed b. Cafer → Zeyd b. Eslem → babası Eslem → Ömer. Paralel rivayette öğüt yasak şeklindedir. Uyarı her sevgi veya hoşnutsuzluğa değil, aşırılığa yöneliktir.","Duyguların seni başka yöne çekse de adil kal.",["Eslem Ömer’in sözünü nakleder.","Ömer aşırı sevgiyi tavsiye eder.","Elbânî isnadı sahih saymıştır.","Söz nefret yüzünden başkasının helakini istemeye karşı uyarır."]],"ku":["Nehêle hezkirin û nefret te kor bikin","Nehêle hezkirina te bibe dilbestiyeke zêde û nefreta te bibe helakî. Min pirsî: ‘Ev çawa ye?’ Wî got: ‘Dema ku tu hez dikî, wek zarokekî dilbest dibî; dema ku tu nefret dikî, helakiya hevalê xwe dixwazî.’","Eslem şîreta Umer li ser hezkirina zêde û nefreta wêranker vediguhêze.","Mewqûf. Elbanî: isnad sehîh e, Sehîh el-Edeb el-Mufred 993.","Seîd ibn Ebî Meryem → Muhammed ibn Cefer → Zeyd ibn Eslem → bavê wî Eslem → Umer. Di rivayeta din de şîret bi qedexeyê tê gotin. Hişyarî li dijî zêderoyiyê ye, ne li dijî her hesta hezkirinê an nefretê.","Edaletê biparêze, her çend hestên te te ber bi aliyekî din ve bibin.",["Eslem gotina Umer vediguhêze.","Umer hezkirina zêde pêşniyar dike.","Elbanî isnad sehîh dibîne.","Gotin li dijî xwestina helakiya kesekî din ji ber nefretê hişyarî dide."]],"ckb":["مەهێڵە خۆشەویستی و ڕق کوێرت بکەن","مەهێڵە خۆشەویستییەکەت ببێتە دڵبەستەیی زۆر و ڕقەکەت ببێتە هەلاککردن. پرسیم: ئەمە چۆنە؟ گوتی: کاتێک خۆشت دەوێت وەک منداڵ دڵبەستە دەبیت و کاتێک ڕقت لێیە، ئارەزووی هەلاکی هاوڕێکەت دەکەیت.","ئەسلەم ئامۆژگاری عومەر دەربارەی خۆشەویستی زۆر و ڕقی وێرانکەر دەگێڕێتەوە.","مەوقوفە. ئەلبانی: سەنەدەکەی سەحیحە، سەحیح ئەلئەدەب ئەلموفرەد ٩٩٣.","سەعید کوڕی ئەبو مەریەم ← محەممەد کوڕی جەعفەر ← زەید کوڕی ئەسلەم ← باوکی ئەسلەم ← عومەر. لە ڕیوایەتێکی تردا بە شێوەی قەدەغە دەربڕدراوە. ئاگادارییەکە لە زیادەڕەوییە، نە لە هەموو خۆشەویستی و ڕقێک.","دادپەروەر بمێنەوە هەرچەندە هەستەکانت بۆ لایەکی تر بتبەن.",["ئەسلەم وتەی عومەر دەگێڕێتەوە.","عومەر خۆشەویستی زۆر پێشنیار دەکات.","ئەلبانی سەنەدەکەی سەحیح داناوە.","وتەکە لە ئارەزووی هەلاکی کەسێکی تر بەهۆی ڕق ئاگاداری دەدات."]],"bs":["Ne dopusti da te ljubav i mržnja zaslijepe","Neka tvoja ljubav ne postane zaslijepljenost, a mržnja uništenje. Upitao sam: ‘Kako to?’ Rekao je: ‘Kada voliš, zaneseš se poput djeteta, a kada mrziš, želiš propast svome drugu.’","Eslem prenosi Omerov savjet o pretjeranoj ljubavi i razornoj mržnji.","Mevkuf. El-Albani: vjerodostojan lanac, Sahih el-Edeb el-Mufred 993.","Seid ibn Ebi Merjem → Muhammed ibn Džafer → Zejd ibn Eslem → njegov otac Eslem → Omer. Paralelna verzija savjet iskazuje kao zabranu. Upozorenje se odnosi na pretjerivanje, ne na svaki osjećaj ljubavi ili odbojnosti.","Ostani pravedan i kada te osjećaji vuku na drugu stranu.",["Eslem prenosi Omerovu izjavu.","Omer preporučuje pretjeranu ljubav.","El-Albani lanac ocjenjuje vjerodostojnim.","Izjava upozorava na želju za tuđom propašću zbog mržnje."]],"fr":["Ne laisse pas l’amour et la haine t’aveugler","Que ton amour ne devienne pas engouement excessif, ni ta haine destruction. Je demandai : « Comment cela ? » Il répondit : « Quand tu aimes, tu t’éprends comme un enfant ; quand tu hais, tu souhaites la perte de ton compagnon. »","Aslam rapporte le conseil de ʿUmar sur l’amour excessif et la haine destructrice.","Mawqūf. Al-Albānī : chaîne authentique, Ṣaḥīḥ al-Adab al-Mufrad 993.","Saʿīd ibn Abī Maryam → Muḥammad ibn Jaʿfar → Zayd ibn Aslam → son père Aslam → ʿUmar. Une version parallèle exprime le conseil sous forme d’interdiction. L’avertissement vise l’excès, non tout sentiment d’amour ou d’aversion.","Reste juste même lorsque tes sentiments t’entraînent ailleurs.",["Aslam rapporte la parole de ʿUmar.","ʿUmar recommande l’amour excessif.","Al-Albānī juge la chaîne authentique.","La parole met en garde contre le souhait de la perte d’autrui par haine."]],"es":["No dejes que el amor y el odio te cieguen","Que tu amor no se convierta en un encaprichamiento ni tu odio en destrucción. Pregunté: «¿Cómo es eso?» Dijo: «Cuando amas, te encaprichas como un niño; cuando odias, deseas la perdición de tu compañero».","Aslam transmite el consejo de ʿUmar sobre el amor excesivo y el odio destructivo.","Mawqūf. Al-Albānī: cadena auténtica, Ṣaḥīḥ al-Adab al-Mufrad 993.","Saʿīd ibn Abī Maryam → Muḥammad ibn Jaʿfar → Zayd ibn Aslam → su padre Aslam → ʿUmar. Una versión paralela expresa el consejo como prohibición. Advierte contra el exceso, no contra todo sentimiento de amor o aversión.","Mantén la justicia incluso cuando tus sentimientos te lleven en otra dirección.",["Aslam transmite la declaración de ʿUmar.","ʿUmar recomienda el amor excesivo.","Al-Albānī considera auténtica la cadena.","La declaración advierte contra desear la perdición ajena por odio."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","
