<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Hand ohne Verähnlichung · Q67</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/abu-hanifa-hand-ohne-tashbih/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .qsource-link{margin:10px 0} .qsource-learning{display:block;margin:20px 0;padding:16px;border:1px solid #b39965;border-radius:12px} .qsource-quote{font-size:1.25em;font-weight:600} .note{opacity:.85} .quiz-button{margin:8px;min-width:100px} .answer{border:1px solid #b39965;padding:12px;border-radius:10px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Die Hand ohne Verähnlichung</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Die Hand ohne Verähnlichung","Die Hand Allahs ist über ihren Händen. Sie ist nicht wie die Hände Seiner Geschöpfe, sie ist kein Körperglied, und Er ist der Schöpfer der Hände.","Spätere hanafitische Kommentare","Die beiden Werke werden Abū Ḥanīfah zugeschrieben. Die Überlieferung von al-Fiqh al-Absaṭ über Abū Muṭīʿ al-Balḫī ist überlieferungskritisch umstritten; die sichere Zuschreibung ist nicht nachgewiesen. Spätere Kommentare sind keine unabhängigen frühen Überlieferungsketten. Ibn Maʿīn, al-Buḫārī und an-Nasāʾī stuften Abū Muṭīʿ als schwach ein. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: Man sagt nicht, dass Seine Hand Seine Macht oder Seine Gunst sei, denn darin liegt die Aufhebung der Eigenschaft. […] Vielmehr ist Seine Hand Seine Eigenschaft ohne Wie.\n\nUṣūl al-Bazdawī: Ebenso ist die Bestätigung der Hand und des Angesichts bei uns wahr, ihrem Grund nach bekannt und hinsichtlich ihrer Beschaffenheit mehrdeutig.\n\nMullā ʿAlī al-Qārī: Al-Qārī erläutert »ohne Wie« als »ohne Kenntnis ihrer Beschaffenheit«. Seine Erklärung bezieht sich auf al-Fiqh al-Akbar.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī kommentiert al-Fiqh al-Akbar, S. 149: Er verneint Beschaffenheit, Körperglieder und Ähnlichkeit und nennt ausdrücklich den allgemeinen Taʾwīl.","Der überlieferte Text bestätigt die Eigenschaft und verneint die Ähnlichkeit mit Geschöpfen. Die Passage allein entscheidet nicht jede Debatte über Tafwīḍ.",["Der Wortlaut verneint die Ähnlichkeit mit Geschöpfen.","Der Wortlaut beschreibt ein Körperglied.","Al-Qārī kommentiert hier al-Fiqh al-Akbar.","Die Zuschreibung an Abū Ḥanīfah ist zweifelsfrei authentisch."]],"ar":["إثبات اليد بلا تشبيه","يد الله فوق أيديهم ليست كأيدي خلقه وليست بجارحة وهو خالق الأيدي.","الشروح الحنفية المتأخرة","الكتابان منسوبان إلى أبي حنيفة. ورواية الفقه الأبسط عن أبي مطيع البلخي محل خلاف من جهة النقد الحديثي؛ ولم تثبت النسبة على وجه القطع. والشروح المتأخرة ليست أسانيد مبكرة مستقلة. ضعّف ابن معين والبخاري والنسائي أبا مطيع. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: ولا يقال إن يده قدرته أو نعمته لأن فيه إبطال الصفة […] ولكن يده صفته بلا كيف.\n\nUṣūl al-Bazdawī: وكذلك إثبات اليد والوجه حق عندنا معلوم بأصله متشابه بوصفه\n\nMullā ʿAlī al-Qārī: فسر علي القاري عبارة «بلا كيف» بقوله «بلا معرفة كيفيته». وهذا الشرح متعلق بالفقه الأكبر.\n\nAḥmad al-Bayāḍī: يشرح البياضي الفقه الأكبر ص ١٤٩، وينفي الكيفية والجارحة ومشابهة المخلوقات، ويذكر التأويل الإجمالي صراحة.","النص المنقول يثبت الصفة وينفي مشابهة المخلوقات. ولا يحسم هذا النص وحده كل مسائل التفويض.",["ينفي النص مشابهة المخلوقات.","يصف النص اليد بأنها جارحة.","يشرح القاري هنا الفقه الأكبر.","ثبتت نسبة النص إلى أبي حنيفة بلا أي شك."]],"en":["Affirming the Hand without resemblance","Allah’s Hand is above their hands. It is not like the hands of His creatures, it is not a bodily limb, and He is the Creator of hands.","Later Hanafi commentaries","Both works are attributed to Abū Ḥanīfah. The transmission of al-Fiqh al-Absaṭ through Abū Muṭīʿ al-Balḫī is disputed in transmission criticism; certain attribution has not been established. Later commentaries are not independent early chains. Ibn Maʿīn, al-Bukhārī and al-Nasāʾī graded Abū Muṭīʿ weak. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: It is not said that His Hand is His power or His favour, for that would negate the attribute. […] Rather, His Hand is His attribute without asking how.\n\nUṣūl al-Bazdawī: Affirming the Hand and the Face is likewise true according to us, known in its basis and ambiguous in its modality.\n\nMullā ʿAlī al-Qārī: Al-Qārī explains ‘without how’ as ‘without knowledge of its modality’. This commentary concerns al-Fiqh al-Akbar.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī comments on al-Fiqh al-Akbar, p. 149: he denies modality, bodily limbs and resemblance, and explicitly mentions general figurative interpretation.","The transmitted text affirms the attribute and denies resemblance to creatures. This passage alone does not settle every debate about tafwīḍ.",["The text denies resemblance to creatures.","The text describes a bodily limb.","Al-Qārī is commenting on al-Fiqh al-Akbar here.","The attribution to Abū Ḥanīfah is unquestionably authentic."]],"tr":["Teşbih olmaksızın el sıfatının ispatı","Allah’ın eli onların ellerinin üzerindedir. Yarattıklarının elleri gibi değildir; bir organ değildir. O, ellerin yaratıcısıdır.","Sonraki Hanefî şerhleri","Her iki eser Ebû Hanîfe’ye nispet edilir. El-Fıkhü’l-Ebsat’ın Ebû Mutîʿ el-Belhî yoluyla rivayeti tenkit açısından ihtilaflıdır; kesin nispet ispatlanmamıştır. Sonraki şerhler bağımsız erken dönem isnatları değildir. İbn Maîn, Buhârî ve Nesâî Ebû Mutî‘i zayıf saymıştır. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: O’nun elinin kudreti veya nimeti olduğu söylenmez; çünkü bunda sıfatın iptali vardır. […] Bilakis eli, keyfiyeti belirtilmeksizin O’nun sıfatıdır.\n\nUṣūl al-Bazdawī: El ve yüzün ispatı da bize göre haktır; aslı bilinir, vasfı müteşabihtir.\n\nMullā ʿAlī al-Qārī: Ali el-Kārî, ‘bilâ keyf’ ifadesini ‘keyfiyetini bilmeksizin’ diye açıklar. Bu şerh el-Fıkhü’l-Ekber’e aittir.\n\nAḥmad al-Bayāḍī: Beyâzî el-Fıkhü’l-Ekber’i (s. 149) şerh eder; keyfiyeti, organı ve benzerliği reddeder, icmâlî tevili zikreder.","Nakledilen metin sıfatı ispat eder ve yaratılmışlara benzerliği reddeder. Bu pasaj tek başına tefviz hakkındaki bütün tartışmaları çözmez.",["Metin yaratılmışlara benzerliği reddeder.","Metin bir organ tarif eder.","Kārî burada el-Fıkhü’l-Ekber’i şerh eder.","Ebû Hanîfe’ye nispet kesin olarak sahihtir."]],"ku":["Îsbata destê bêyî şibandinê","Destê Allah li ser destên wan e. Ew ne wek destên mexlûqên Wî ye, ne endamekî bedenê ye û Ew Afirînerê destan e.","Şîroveyên Henefî yên paşîn","Her du berhem bi Ebû Henîfe ve tên nisbetkirin. Veguhastina el-Fiqh el-Ebsat bi rêya Ebû Mutî el-Belxî ji aliyê rexneya rivayetê ve cihê nîqaşê ye; nisbetkirina teqez nehatiye îspatkirin. Şîroveyên paşîn isnadên destpêkê yên serbixwe nînin. Îbn Meîn, Buxarî û Nesayî Ebû Mutî zayîf dîtin. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: Nayê gotin ku destê Wî hêza Wî an nimeta Wî ye, ji ber ku ev sifetê betal dike. […] Belkî destê Wî sifeta Wî ye, bêyî diyarkirina çawaniyê.\n\nUṣūl al-Bazdawī: Li cem me îsbata dest û rû rast e; eslê wê tê zanîn, wesfa wê nezelal e.\n\nMullā ʿAlī al-Qārī: El-Qarî ‘bêyî çawan’ bi ‘bêyî zanîna çawaniya wê’ şîrove dike. Ev şîrove ji bo el-Fiqh el-Ekber e.\n\nAḥmad al-Bayāḍī: El-Beyadî el-Fiqh el-Ekber (r. 149) şîrove dike; çawaniyê, endamê bedenê û şibandinê red dike û tewîla icmalî dibêje.","Nivîsa veguhastî sifetê îsbat dike û şibandina bi mexlûqan red dike. Ev beş bi tenê hemû nîqaşên tefwîdê çareser nake.",["Nivîs şibandina bi mexlûqan red dike.","Nivîs endamekî bedenê rave dike.","El-Qarî li vir el-Fiqh el-Ekber şîrove dike.","Nisbeta Ebû Henîfe bêguman rast e."]],"ckb":["سەلماندنی دەست بەبێ هاوشێوەکردن","دەستی الله لە سەر دەستەکانیانە. وەک دەستی دروستکراوەکانی نییە، ئەندامێکی جەستەش نییە، و ئەو دروستکەری دەستەکانە.","شەرەحە حەنەفییەکانی دواتر","هەردوو بەرهەمەکە بە ئەبو حەنیفە دەدرێنە پاڵ. گواستنەوەی الفقه الأبسط لە ڕێگەی ئەبو موتیع بەڵخییەوە لە ڕووی ڕەخنەی ڕیوایەتەوە جێی مشتومڕە؛ پاڵپێوەدانەکە بە دڵنیایی نەسەلمێنراوە. شەرەحەکانی دواتر زنجیرەی گواستنەوەی سەربەخۆی سەرەتایی نین. ئیبن مەعین و بوخاری و نەسائی ئەبو موتیعیان بە لاواز داناوە. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: ناگوترێت دەستی ئەو توانای ئەو یان نیعمەتی ئەوە، چونکە ئەمە هەڵوەشاندنەوەی سیفەتەکەیە. […] بەڵکو دەستی ئەو سیفەتی ئەوە بەبێ دیاریکردنی چۆنیەتی.\n\nUṣūl al-Bazdawī: لە لای ئێمە سەلماندنی دەست و ڕوو ڕاستە؛ بنەماکەی زانراوە و وەسفەکەی ناڕوونە.\n\nMullā ʿAlī al-Qārī: قاری «بەبێ چۆنیەتی» بە «بەبێ زانینی چۆنیەتییەکەی» ڕوون دەکاتەوە. ئەم شەرەحە بۆ الفقه الأكبر ـە.\n\nAḥmad al-Bayāḍī: بەیازی الفقه الأكبر (ل. ١٤٩) شەرەح دەکات؛ چۆنیەتی و ئەندامی جەستە و هاوشێوەیی ڕەت دەکاتەوە و تەئویلی ئیجمالی باس دەکات.","دەقە گێڕدراوەکە سیفەتەکە دەسەلمێنێت و هاوشێوەیی لەگەڵ دروستکراوەکان ڕەت دەکاتەوە. ئەم دەقە بە تەنها هەموو مشتومڕەکانی تەفویز یەکلایی ناکاتەوە.",["دەقەکە هاوشێوەیی لەگەڵ دروستکراوەکان ڕەت دەکاتەوە.","دەقەکە باس لە ئەندامێکی جەستە دەکات.","قاری لێرە الفقه الأكبر شەرەح دەکات.","پاڵپێوەدانی وتەکە بە ئەبو حەنیفە بەبێ هیچ گومانێک سەلمێنراوە."]],"bs":["Potvrđivanje Ruke bez poistovjećivanja","Allahova Ruka je iznad njihovih ruku. Nije poput ruku Njegovih stvorenja, nije tjelesni ud, a On je Stvoritelj ruku.","Kasniji hanefijski komentari","Oba djela pripisuju se Ebu Hanifi. Predaja el-Fikh el-ebsata preko Ebu Mutiʿ el-Belhija predmet je kritičkog spora; sigurna atribucija nije dokazana. Kasniji komentari nisu nezavisni rani lanci prenošenja. Ibn Me'in, Buhari i Nesai ocijenili su Ebu Mutija slabim. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: Ne kaže se da je Njegova Ruka Njegova moć ili blagodat, jer se time poništava svojstvo. […] Naprotiv, Njegova Ruka je Njegovo svojstvo bez određivanja kakvoće.\n\nUṣūl al-Bazdawī: Potvrđivanje Ruke i Lica kod nas je istina, poznato u osnovi, nejasno u kakvoći.\n\nMullā ʿAlī al-Qārī: El-Kari pojašnjava izraz ‘bez kakvoće’ riječima ‘bez poznavanja njene kakvoće’. Ovaj komentar odnosi se na el-Fikh el-ekber.\n\nAḥmad al-Bayāḍī: El-Bejadi komentariše el-Fikh el-ekber, str. 149: negira kakvoću, tjelesni ud i sličnost te spominje općeniti tevil.","Preneseni tekst potvrđuje svojstvo i negira sličnost sa stvorenjima. Sam ovaj odlomak ne rješava svaku raspravu o tefvidu.",["Tekst negira sličnost sa stvorenjima.","Tekst opisuje tjelesni ud.","El-Kari ovdje komentariše el-Fikh el-ekber.","Pripisivanje Ebu Hanifi nesumnjivo je vjerodostojno."]],"fr":["Affirmer la Main sans assimilation","La Main d’Allah est au-dessus de leurs mains. Elle n’est pas comme les mains de Ses créatures, elle n’est pas un membre corporel, et Il est le Créateur des mains.","Commentaires hanafites tardifs","Les deux ouvrages sont attribués à Abū Ḥanīfah. La transmission d’al-Fiqh al-Absaṭ par Abū Muṭīʿ al-Balḫī est contestée au regard de la critique des transmissions ; l’attribution certaine n’est pas établie. Les commentaires tardifs ne sont pas des chaînes anciennes indépendantes. Ibn Maʿīn, al-Bukhārī et al-Nasāʾī ont jugé Abū Muṭīʿ faible. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: On ne dit pas que Sa Main est Sa puissance ou Sa faveur, car cela annule l’attribut. […] Sa Main est plutôt Son attribut sans en déterminer le comment.\n\nUṣūl al-Bazdawī: L’affirmation de la Main et du Visage est vraie selon nous, connue dans son principe, ambiguë quant à sa modalité.\n\nMullā ʿAlī al-Qārī: Al-Qārī explique « sans comment » par « sans connaissance de sa modalité ». Ce commentaire concerne al-Fiqh al-Akbar.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī commente al-Fiqh al-Akbar, p. 149 : il nie la modalité, les membres corporels et la ressemblance et mentionne le taʾwīl général.","Le texte transmis affirme l’attribut et nie la ressemblance aux créatures. Ce passage seul ne tranche pas tous les débats sur le tafwīḍ.",["Le texte nie la ressemblance aux créatures.","Le texte décrit un membre corporel.","Al-Qārī commente ici al-Fiqh al-Akbar.","L’attribution à Abū Ḥanīfah est incontestablement authentique."]],"es":["Afirmar la Mano sin semejanza","La Mano de Allah está sobre sus manos. No es como las manos de Sus criaturas, no es un miembro corporal y Él es el Creador de las manos.","Comentarios hanafíes posteriores","Ambas obras se atribuyen a Abū Ḥanīfah. La transmisión de al-Fiqh al-Absaṭ a través de Abū Muṭīʿ al-Balḫī es discutida desde la crítica de la transmisión; no se ha establecido una atribución segura. Los comentarios posteriores no son cadenas tempranas independientes. Ibn Maʿīn, al-Bukhārī y al-Nasāʾī calificaron a Abū Muṭīʿ de débil. (Lisān al-Mīzān, 1369).","al-Fiqh al-Akbar: No se dice que Su Mano sea Su poder o Su favor, pues eso anularía el atributo. […] Más bien, Su Mano es Su atributo sin determinar cómo.\n\nUṣūl al-Bazdawī: La afirmación de la Mano y del Rostro es verdadera según nosotros, conocida en su fundamento y ambigua en su modalidad.\n\nMullā ʿAlī al-Qārī: Al-Qārī explica «sin cómo» como «sin conocer su modalidad». Este comentario se refiere a al-Fiqh al-Akbar.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī comenta al-Fiqh al-Akbar, p. 149: niega la modalidad, los miembros corporales y la semejanza, y menciona la interpretación figurada general.","El texto transmitido afirma el atributo y niega la semejanza con las criaturas. Este pasaje por sí solo no resuelve todos los debates sobre el tafwīḍ.",["El texto niega la semejanza con las criaturas.","El texto describe un miembro corporal.","Al-Qārī comenta aquí al-Fiqh al-Akbar.","La atribución a Abū Ḥanīfah es indudablemente auténtica."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Spätere hanafitische Kommentare","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","الشروح الحنفية المتأخرة","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Later Hanafi commentaries","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Sonraki Hanefî şerhleri","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi d
