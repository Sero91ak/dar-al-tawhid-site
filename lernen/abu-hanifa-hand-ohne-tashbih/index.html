<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Hand ohne Verähnlichung · Q67</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/abu-hanifa-hand-ohne-tashbih/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .qsource-link{margin:10px 0} .qsource-learning{display:block;margin:20px 0;padding:16px;border:1px solid #b39965;border-radius:12px} .qsource-quote{font-size:1.25em;font-weight:600} .note{opacity:.85} .quiz-button{margin:8px;min-width:100px} .answer{border:1px solid #b39965;padding:12px;border-radius:10px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style><script src="/assets/i18n/adult-ui-translate.js?v=20261126-locale3" defer></script>
</head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Die Hand ohne Verähnlichung</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Die Hand ohne Verähnlichung","Die Hand Allahs ist über ihren Händen. Sie ist nicht wie die Hände Seiner Geschöpfe, sie ist kein Körperglied, und Er ist der Schöpfer der Hände.","Kontext von al-Fiqh al-Absaṭ: Der Abschnitt beginnt mit der Verneinung geschöpflicher Eigenschaften und bestätigt Zorn und Wohlgefallen ohne Wie. Die Hand wird anschließend unter Bezug auf 48:10 genannt. Der Absatz endet mit 42:11.","Die beiden Werke werden Abū Ḥanīfah zugeschrieben. Die Überlieferung von al-Fiqh al-Absaṭ über Abū Muṭīʿ al-Balḫī ist überlieferungskritisch umstritten; die sichere Zuschreibung ist nicht nachgewiesen. Spätere Kommentare sind keine unabhängigen frühen Überlieferungsketten. Ibn Maʿīn, al-Buḫārī und an-Nasāʾī stuften Abū Muṭīʿ als schwach ein. (Lisān al-Mīzān, 1369). Der vollständige Absatz des historischen Drucks erstreckt sich über S. 56–57 (PDF 60–61); die digitale Shamela-Ausgabe hat S. 159 und 161. Die Kritik an Abū Muṭīʿ betrifft die sichere historische Zuschreibung, nicht die Existenz des Textes im Druck.","al-Fiqh al-Akbar: Man sagt nicht, dass Seine Hand Seine Macht oder Seine Gunst sei, denn darin liegt die Aufhebung der Eigenschaft. […] Vielmehr ist Seine Hand Seine Eigenschaft ohne Wie.\n\nUṣūl al-Bazdawī: Ebenso ist die Bestätigung der Hand und des Angesichts bei uns wahr, ihrem Grund nach bekannt und hinsichtlich ihrer Beschaffenheit mehrdeutig.\n\nMullā ʿAlī al-Qārī: Al-Qārī erläutert auf S. 67 die Aussage aus al-Fiqh al-Akbar: Die Erwähnung der Hand statt Macht oder Gunst legt nach ihm nahe, dass eine andere Bedeutung gemeint ist. Er erklärt »ohne Wie« als »ohne Kenntnis ihrer Beschaffenheit«.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī zitiert al-Fiqh al-Absaṭ ausdrücklich und begründet die Aussage, dass der Schöpfer nicht dem Geschöpf gleicht. Er verneint körperliche Glieder, Gestalt und Verähnlichung. Daneben beschreibt er Tafwīḍ unter Verneinung der irreführenden äußerlichen Vorstellungen als allgemeinen Taʾwīl (S. 149). Dies ist seine spätere Auslegung, keine weitere Überlieferung von Abū Ḥanīfah.","Der überlieferte Text bestätigt die Eigenschaft und verneint die Ähnlichkeit mit Geschöpfen. Die Passage allein entscheidet nicht jede Debatte über Tafwīḍ.",["Der Wortlaut verneint die Ähnlichkeit mit Geschöpfen.","Der Wortlaut beschreibt ein Körperglied.","Al-Qārī kommentiert hier al-Fiqh al-Akbar.","Die Zuschreibung an Abū Ḥanīfah ist zweifelsfrei authentisch."]],"ar":["إثبات اليد بلا تشبيه","يد الله فوق أيديهم ليست كأيدي خلقه وليست بجارحة وهو خالق الأيدي.","سياق الفقه الأبسط: يبدأ المقطع بنفي صفات المخلوقين وإثبات الغضب والرضا بلا كيف، ثم يذكر اليد اقتباسا من الفتح: ١٠ ويختم بالشورى: ١١.","الكتابان منسوبان إلى أبي حنيفة. ورواية الفقه الأبسط عن أبي مطيع البلخي محل خلاف من جهة النقد الحديثي؛ ولم تثبت النسبة على وجه القطع. والشروح المتأخرة ليست أسانيد مبكرة مستقلة. ضعّف ابن معين والبخاري والنسائي أبا مطيع. (Lisān al-Mīzān, 1369). يمتد المقطع المطبوع إلى ص ٥٦–٥٧ (PDF ٦٠–٦١)، وفي الشاملة ص ١٥٩ و١٦١. يتعلق نقد أبي مطيع بثبوت النسبة التاريخية لا بوجود النص في المطبوع.","al-Fiqh al-Akbar: ولا يقال إن يده قدرته أو نعمته لأن فيه إبطال الصفة […] ولكن يده صفته بلا كيف.\n\nUṣūl al-Bazdawī: وكذلك إثبات اليد والوجه حق عندنا معلوم بأصله متشابه بوصفه\n\nMullā ʿAlī al-Qārī: يشرح القاري في ص ٦٧ كلام الفقه الأكبر: ذكر اليد دون القدرة والنعمة ظاهر عنده في إرادة غير معنييهما، ويفسر بلا كيف ببلا معرفة كيفيته.\n\nAḥmad al-Bayāḍī: يقتبس البياضي الفقه الأبسط صراحة ويعلل بأن الخالق لا يشابه المخلوق، وينفي الجوارح والتجسم والمشابهة. ويذكر كذلك التفويض مع التنزيه عما توهمه الظواهر بوصفه تأويلا إجماليا (ص ١٤٩). وهذا شرح متأخر لا رواية أخرى عن أبي حنيفة.","النص المنقول يثبت الصفة وينفي مشابهة المخلوقات. ولا يحسم هذا النص وحده كل مسائل التفويض.",["ينفي النص مشابهة المخلوقات.","يصف النص اليد بأنها جارحة.","يشرح القاري هنا الفقه الأكبر.","ثبتت نسبة النص إلى أبي حنيفة بلا أي شك."]],"en":["Affirming the Hand without resemblance","Allah’s Hand is above their hands. It is not like the hands of His creatures, it is not a bodily limb, and He is the Creator of hands.","Context of al-Fiqh al-Absaṭ: the passage opens by denying created attributes and affirming anger and pleasure without specifying how. It then mentions the Hand with reference to 48:10 and ends with 42:11.","Both works are attributed to Abū Ḥanīfah. The transmission of al-Fiqh al-Absaṭ through Abū Muṭīʿ al-Balḫī is disputed in transmission criticism; certain attribution has not been established. Later commentaries are not independent early chains. Ibn Maʿīn, al-Bukhārī and al-Nasāʾī graded Abū Muṭīʿ weak. (Lisān al-Mīzān, 1369). The printed passage spans pp. 56–57 (PDF 60–61); Shamela has pp. 159 and 161. Criticism of Abū Muṭīʿ concerns the certainty of historical attribution, not the text’s presence in print.","al-Fiqh al-Akbar: It is not said that His Hand is His power or His favour, for that would negate the attribute. […] Rather, His Hand is His attribute without asking how.\n\nUṣūl al-Bazdawī: Affirming the Hand and the Face is likewise true according to us, known in its basis and ambiguous in its modality.\n\nMullā ʿAlī al-Qārī: Al-Qārī explains al-Fiqh al-Akbar on p. 67: mentioning the Hand rather than power or favour suggests, in his view, that a different meaning is intended. He explains ‘without how’ as ‘without knowledge of its modality’.\n\nAḥmad al-Bayāḍī: Al-Bayāḍī explicitly quotes al-Fiqh al-Absaṭ and explains that the Creator does not resemble the creature. He denies bodily limbs, corporeality and resemblance. He also describes consigning knowledge to Allah while rejecting misleading apparent implications as general taʾwīl (p. 149). This is his later interpretation, not another transmission from Abū Ḥanīfah.","The transmitted text affirms the attribute and denies resemblance to creatures. This passage alone does not settle every debate about tafwīḍ.",["The text denies resemblance to creatures.","The text describes a bodily limb.","Al-Qārī is commenting on al-Fiqh al-Akbar here.","The attribution to Abū Ḥanīfah is unquestionably authentic."]],"tr":["Teşbih olmaksızın el sıfatının ispatı","Allah’ın eli onların ellerinin üzerindedir. Yarattıklarının elleri gibi değildir; bir organ değildir. O, ellerin yaratıcısıdır.","El-Fıkhü’l-Ebsat bağlamı: Metin yaratılmışların sıfatlarını nefyederek gazap ve rızayı bilâ keyf ispat etmekle başlar. Ardından Fetih 48:10’a atıfla el zikredilir ve Şûrâ 42:11 ile sona erer.","Her iki eser Ebû Hanîfe’ye nispet edilir. El-Fıkhü’l-Ebsat’ın Ebû Mutîʿ el-Belhî yoluyla rivayeti tenkit açısından ihtilaflıdır; kesin nispet ispatlanmamıştır. Sonraki şerhler bağımsız erken dönem isnatları değildir. İbn Maîn, Buhârî ve Nesâî Ebû Mutî‘i zayıf saymıştır. (Lisān al-Mīzān, 1369). Matbu pasaj s. 56–57 (PDF 60–61), Şâmile’de s. 159 ve 161’dedir. Ebû Mutî‘ hakkındaki tenkit metnin basılı nüshada bulunmasına değil, tarihî nispetin kesinliğine ilişkindir.","al-Fiqh al-Akbar: O’nun elinin kudreti veya nimeti olduğu söylenmez; çünkü bunda sıfatın iptali vardır. […] Bilakis eli, keyfiyeti belirtilmeksizin O’nun sıfatıdır.\n\nUṣūl al-Bazdawī: El ve yüzün ispatı da bize göre haktır; aslı bilinir, vasfı müteşabihtir.\n\nMullā ʿAlī al-Qārī: Kārî s. 67’de el-Fıkhü’l-Ekber’i açıklar: Kudret veya nimet yerine elin zikredilmesi, ona göre başka bir anlamın kastedildiğine işaret eder. Bilâ keyfi keyfiyetini bilmeksizin diye açıklar.\n\nAḥmad al-Bayāḍī: Beyâzî el-Fıkhü’l-Ebsat’ı açıkça nakleder ve Yaratıcı’nın yaratılana benzemediğini gerekçe gösterir. Organı, cisim olmayı ve benzerliği reddeder. Ayrıca zahirin vehmettirdiği hususlardan tenzihle birlikte tefvizi icmâlî tevil olarak niteler (s. 149). Bu, sonraki bir şerhtir; Ebû Hanîfe’den ayrı bir rivayet değildir.","Nakledilen metin sıfatı ispat eder ve yaratılmışlara benzerliği reddeder. Bu pasaj tek başına tefviz hakkındaki bütün tartışmaları çözmez.",["Metin yaratılmışlara benzerliği reddeder.","Metin bir organ tarif eder.","Kārî burada el-Fıkhü’l-Ekber’i şerh eder.","Ebû Hanîfe’ye nispet kesin olarak sahihtir."]],"ku":["Îsbata destê bêyî şibandinê","Destê Allah li ser destên wan e. Ew ne wek destên mexlûqên Wî ye, ne endamekî bedenê ye û Ew Afirînerê destan e.","Çarçoveya el-Fiqh el-Ebsat: Beş bi redkirina sifetên mexlûqan û îsbata xezeb û rizayê bêyî diyarkirina çawaniyê dest pê dike. Paşê dest bi îşareta 48:10 tê gotin û bi 42:11 diqede.","Her du berhem bi Ebû Henîfe ve tên nisbetkirin. Veguhastina el-Fiqh el-Ebsat bi rêya Ebû Mutî el-Belxî ji aliyê rexneya rivayetê ve cihê nîqaşê ye; nisbetkirina teqez nehatiye îspatkirin. Şîroveyên paşîn isnadên destpêkê yên serbixwe nînin. Îbn Meîn, Buxarî û Nesayî Ebû Mutî zayîf dîtin. (Lisān al-Mīzān, 1369). Beşa çapkirî li r. 56–57 (PDF 60–61), li Şamile r. 159 û 161 e. Rexneya Ebû Mutî li ser teqezbûna nisbeta dîrokî ye, ne hebûna nivîsê di çapê de.","al-Fiqh al-Akbar: Nayê gotin ku destê Wî hêza Wî an nimeta Wî ye, ji ber ku ev sifetê betal dike. […] Belkî destê Wî sifeta Wî ye, bêyî diyarkirina çawaniyê.\n\nUṣūl al-Bazdawī: Li cem me îsbata dest û rû rast e; eslê wê tê zanîn, wesfa wê nezelal e.\n\nMullā ʿAlī al-Qārī: El-Qarî li r. 67 el-Fiqh el-Ekber rave dike: gotina destê li şûna hêz an nimeta Wî, li gor wî, nîşan dide ku maneyeke din tê xwestin. ‘Bêyî çawan’ bi ‘bêyî zanîna çawaniya wê’ rave dike.\n\nAḥmad al-Bayāḍī: El-Beyadî el-Fiqh el-Ebsat bi eşkereyî neqil dike û dibêje Afirîner naşibe mexlûqê. Ew endamên bedenê, cism û şibandinê red dike. Her wiha tefwîd bi tenzîhê ji têgihiştinên xapînok ên zahirî wek tewîla icmalî binav dike (r. 149). Ev şîroveyeke paşîn e, ne rivayeteke din ji Ebû Henîfe.","Nivîsa veguhastî sifetê îsbat dike û şibandina bi mexlûqan red dike. Ev beş bi tenê hemû nîqaşên tefwîdê çareser nake.",["Nivîs şibandina bi mexlûqan red dike.","Nivîs endamekî bedenê rave dike.","El-Qarî li vir el-Fiqh el-Ekber şîrove dike.","Nisbeta Ebû Henîfe bêguman rast e."]],"ckb":["سەلماندنی دەست بەبێ هاوشێوەکردن","دەستی الله لە سەر دەستەکانیانە. وەک دەستی دروستکراوەکانی نییە، ئەندامێکی جەستەش نییە، و ئەو دروستکەری دەستەکانە.","چوارچێوەی الفقه الأبسط: دەقەکە بە ڕەتکردنەوەی سیفەتەکانی دروستکراوان و سەلماندنی تووڕەیی و ڕەزامەندی بەبێ دیاریکردنی چۆنیەتی دەست پێ دەکات؛ پاشان دەست بە ئاماژە بە ٤٨:١٠ دەهێنێت و بە ٤٢:١١ کۆتایی دێت.","هەردوو بەرهەمەکە بە ئەبو حەنیفە دەدرێنە پاڵ. گواستنەوەی الفقه الأبسط لە ڕێگەی ئەبو موتیع بەڵخییەوە لە ڕووی ڕەخنەی ڕیوایەتەوە جێی مشتومڕە؛ پاڵپێوەدانەکە بە دڵنیایی نەسەلمێنراوە. شەرەحەکانی دواتر زنجیرەی گواستنەوەی سەربەخۆی سەرەتایی نین. ئیبن مەعین و بوخاری و نەسائی ئەبو موتیعیان بە لاواز داناوە. (Lisān al-Mīzān, 1369). دەقی چاپکراو ل. ٥٦–٥٧ (PDF ٦٠–٦١) و لە شاملە ل. ١٥٩ و ١٦١ ـە. ڕەخنەی ئەبو موتیع پەیوەندی بە دڵنیایی پاڵپێوەدانی مێژووییەوە هەیە، نە بوونی دەق لە چاپدا.","al-Fiqh al-Akbar: ناگوترێت دەستی ئەو توانای ئەو یان نیعمەتی ئەوە، چونکە ئەمە هەڵوەشاندنەوەی سیفەتەکەیە. […] بەڵکو دەستی ئەو سیفەتی ئەوە بەبێ دیاریکردنی چۆنیەتی.\n\nUṣūl al-Bazdawī: لە لای ئێمە سەلماندنی دەست و ڕوو ڕاستە؛ بنەماکەی زانراوە و وەسفەکەی ناڕوونە.\n\nMullā ʿAlī al-Qārī: قاری لە ل. ٦٧ الفقه الأكبر ڕوون دەکاتەوە: باسکردنی دەست لە جیاتی توانا یان نیعمەت، بە بۆچوونی ئەو، ئاماژە بە مانایەکی ترە. بەبێ چۆنیەتی بە بەبێ زانینی چۆنیەتییەکەی ڕوون دەکاتەوە.\n\nAḥmad al-Bayāḍī: بەیازی بە ڕوونی الفقه الأبسط دەگوازێتەوە و دەڵێت دروستکەر هاوشێوەی دروستکراو نییە. ئەندامی جەستە و جەستەبوون و هاوشێوەیی ڕەت دەکاتەوە. هەروەها تەفویز لەگەڵ پاکدانان لە تێگەیشتنی هەڵەی ڕووکەش بە تەئویلی ئیجمالی ناو دەبات (ل. ١٤٩). ئەمە شەرەحێکی دواترە، نە ڕیوایەتێکی تری ئەبو حەنیفە.","دەقە گێڕدراوەکە سیفەتەکە دەسەلمێنێت و هاوشێوەیی لەگەڵ دروستکراوەکان ڕەت دەکاتەوە. ئەم دەقە بە تەنها هەموو مشتومڕەکانی تەفویز یەکلایی ناکاتەوە.",["دەقەکە هاوشێوەیی لەگەڵ دروستکراوەکان ڕەت دەکاتەوە.","دەقەکە باس لە ئەندامێکی جەستە دەکات.","قاری لێرە الفقه الأكبر شەرەح دەکات.","پاڵپێوەدانی وتەکە بە ئەبو حەنیفە بەبێ هیچ گومانێک سەلمێنراوە."]],"bs":["Potvrđivanje Ruke bez poistovjećivanja","Allahova Ruka je iznad njihovih ruku. Nije poput ruku Njegovih stvorenja, nije tjelesni ud, a On je Stvoritelj ruku.","Kontekst el-Fikh el-ebsata: odlomak počinje negiranjem svojstava stvorenja i potvrđivanjem srdžbe i zadovoljstva bez određivanja kakvoće. Zatim navodi Ruku uz 48:10, a završava sa 42:11.","Oba djela pripisuju se Ebu Hanifi. Predaja el-Fikh el-ebsata preko Ebu Mutiʿ el-Belhija predmet je kritičkog spora; sigurna atribucija nije dokazana. Kasniji komentari nisu nezavisni rani lanci prenošenja. Ibn Me'in, Buhari i Nesai ocijenili su Ebu Mutija slabim. (Lisān al-Mīzān, 1369). Štampani odlomak je na str. 56–57 (PDF 60–61), a u Šameli na str. 159 i 161. Kritika Ebu Mutija odnosi se na sigurnost historijske atribucije, ne na prisustvo teksta u štampi.","al-Fiqh al-Akbar: Ne kaže se da je Njegova Ruka Njegova moć ili blagodat, jer se time poništava svojstvo. […] Naprotiv, Njegova Ruka je Njegovo svojstvo bez određivanja kakvoće.\n\nUṣūl al-Bazdawī: Potvrđivanje Ruke i Lica kod nas je istina, poznato u osnovi, nejasno u kakvoći.\n\nMullā ʿAlī al-Qārī: El-Kari na str. 67 objašnjava el-Fikh el-ekber: spominjanje Ruke umjesto moći ili blagodati prema njemu ukazuje na drugo namjeravano značenje. Bez kakvoće tumači kao bez poznavanja njene kakvoće.\n\nAḥmad al-Bayāḍī: El-Bejadi izričito citira el-Fikh el-ebsat i obrazlaže da Stvoritelj nije sličan stvorenju. Negira tjelesne udove, tjelesnost i sličnost. Također opisuje tefvid uz negiranje pogrešnih prividnih značenja kao općeniti tevil (str. 149). To je kasniji komentar, a ne druga predaja od Ebu Hanife.","Preneseni tekst potvrđuje svojstvo i negira sličnost sa stvorenjima. Sam ovaj odlomak ne rješava svaku raspravu o tefvidu.",["Tekst negira sličnost sa stvorenjima.","Tekst opisuje tjelesni ud.","El-Kari ovdje komentariše el-Fikh el-ekber.","Pripisivanje Ebu Hanifi nesumnjivo je vjerodostojno."]],"fr":["Affirmer la Main sans assimilation","La Main d’Allah est au-dessus de leurs mains. Elle n’est pas comme les mains de Ses créatures, elle n’est pas un membre corporel, et Il est le Créateur des mains.","Contexte d’al-Fiqh al-Absaṭ : le passage commence par nier les attributs propres aux créatures et affirmer la colère et l’agrément sans déterminer le comment. Il mentionne ensuite la Main en référence à 48:10 et se termine par 42:11.","Les deux ouvrages sont attribués à Abū Ḥanīfah. La transmission d’al-Fiqh al-Absaṭ par Abū Muṭīʿ al-Balḫī est contestée au regard de la critique des transmissions ; l’attribution certaine n’est pas établie. Les commentaires tardifs ne sont pas des chaînes anciennes indépendantes. Ibn Maʿīn, al-Bukhārī et al-Nasāʾī ont jugé Abū Muṭīʿ faible. (Lisān al-Mīzān, 1369). Le passage imprimé couvre les p. 56–57 (PDF 60–61), et Shamela les p. 159 et 161. La critique d’Abū Muṭīʿ concerne la certitude de l’attribution historique, non la présence du texte imprimé.","al-Fiqh al-Akbar: On ne dit pas que Sa Main est Sa puissance ou Sa faveur, car cela annule l’attribut. […] Sa Main est plutôt Son attribut sans en déterminer le comment.\n\nUṣūl al-Bazdawī: L’affirmation de la Main et du Visage est vraie selon nous, connue dans son principe, ambiguë quant à sa modalité.\n\nMullā ʿAlī al-Qārī: Al-Qārī explique al-Fiqh al-Akbar, p. 67 : mentionner la Main plutôt que la puissance ou la faveur suggère selon lui une autre signification voulue. Il explique « sans comment » par « sans connaissance de sa modalité ».\n\nAḥmad al-Bayāḍī: Al-Bayāḍī cite explicitement al-Fiqh al-Absaṭ et explique que le Créateur ne ressemble pas à la créature. Il nie les membres corporels, la corporéité et la ressemblance. Il décrit également le tafwīḍ accompagné du rejet des implications apparentes trompeuses comme un taʾwīl général (p. 149). C’est son commentaire tardif, non une autre transmission d’Abū Ḥanīfah.","Le texte transmis affirme l’attribut et nie la ressemblance aux créatures. Ce passage seul ne tranche pas tous les débats sur le tafwīḍ.",["Le texte nie la ressemblance aux créatures.","Le texte décrit un membre corporel.","Al-Qārī commente ici al-Fiqh al-Akbar.","L’attribution à Abū Ḥanīfah est incontestablement authentique."]],"es":["Afirmar la Mano sin semejanza","La Mano de Allah está sobre sus manos. No es como las manos de Sus criaturas, no es un miembro corporal y Él es el Creador de las manos.","Contexto de al-Fiqh al-Absaṭ: el pasaje empieza negando los atributos propios de las criaturas y afirmando la ira y la complacencia sin determinar cómo. Luego menciona la Mano con referencia a 48:10 y termina con 42:11.","Ambas obras se atribuyen a Abū Ḥanīfah. La transmisión de al-Fiqh al-Absaṭ a través de Abū Muṭīʿ al-Balḫī es discutida desde la crítica de la transmisión; no se ha establecido una atribución segura. Los comentarios posteriores no son cadenas tempranas independientes. Ibn Maʿīn, al-Bukhārī y al-Nasāʾī calificaron a Abū Muṭīʿ de débil. (Lisān al-Mīzān, 1369). El pasaje impreso abarca pp. 56–57 (PDF 60–61) y en Shamela pp. 159 y 161. La crítica a Abū Muṭīʿ concierne a la certeza de la atribución histórica, no a la existencia del texto impreso.","al-Fiqh al-Akbar: No se dice que Su Mano sea Su poder o Su favor, pues eso anularía el atributo. […] Más bien, Su Mano es Su atributo sin determinar cómo.\n\nUṣūl al-Bazdawī: La afirmación de la Mano y del Rostro es verdadera según nosotros, conocida en su fundamento y ambigua en su modalidad.\n\nMullā ʿAlī al-Qārī: Al-Qārī explica al-Fiqh al-Akbar, p. 67: mencionar la Mano en vez del poder o el favor indica, según él, otra significación pretendida. Explica «sin cómo» como «sin conocer su modalidad».\n\nAḥmad al-Bayāḍī: Al-Bayāḍī cita expresamente al-Fiqh al-Absaṭ y explica que el Creador no se asemeja a la criatura. Niega miembros corporales, corporeidad y semejanza. También describe el tafwīḍ acompañado del rechazo de las implicaciones aparentes engañosas como taʾwīl general (p. 149). Es su comentario posterior, no otra transmisión de Abū Ḥanīfah.","El texto transmitido afirma el atributo y niega la semejanza con las criaturas. Este pasaje por sí solo no resuelve todos los debates sobre el tafwīḍ.",["El texto niega la semejanza con las criaturas.","El texto describe un miembro corporal.","Al-Qārī comenta aquí al-Fiqh al-Akbar.","La atribución a Abū Ḥanīfah es indudablemente auténtica."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Spätere hanafitische Kommentare","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","الشروح الحنفية المتأخرة","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Later Hanafi commentaries","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Sonraki Hanefî şerhleri","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendir","Doğru cevap","Kaynak"],"ku":["Ziman","Çarçove","Gotin","Nivîsa erebî","Isnad","Nirxandin","Şîroveyên Henefî yên paşîn","Encam","Çavkaniyên resen","Zêdetir fêr bibe","Rast","Şaş","Pirsa din","Encam","Dîsa fêr bibe","Vegere çavkaniyê","Gotinê binirxîne","Bersiva rast","Çavkanî"],"ckb":["زمان","چوارچێوە","دەق","دەقی عەرەبی","سەنەد","هەڵسەنگاندن","شەرەحە حەنەفییەکانی دواتر","ئەنجام","سەرچاوە ڕەسەنەکان","زانیاری زیاتر","ڕاست","هەڵە","پرسیاری دواتر","ئەنجام","دووبارە فێربە","گەڕانەوە بۆ سەرچاوە","وتەکە هەڵبسەنگێنە","وەڵامی ڕاست","سەرچاوە"],"bs":["Jezik","Kontekst","Tekst","Arapski izvornik","Lanac","Ocjena","Kasniji hanefijski komentari","Zaključak","Izvorni dokazi","Produbi znanje","Tačno","Netačno","Sljedeće pitanje","Rezultat","Uči ponovo","Nazad na izvor","Provjeri tvrdnju","Tačan odgovor","Izvor"],"fr":["Langue","Contexte","Texte","Original arabe","Chaîne","Évaluation","Commentaires hanafites tardifs","Conclusion","Sources originales","Approfondir","Vrai","Faux","Question suivante","Résultat","Recommencer","Retour à la source","Évaluer l’affirmation","Bonne réponse","Source"],"es":["Idioma","Contexto","Texto","Original árabe","Cadena","Evaluación","Comentarios hanafíes posteriores","Conclusión","Fuentes originales","Profundizar","Verdadero","Falso","Siguiente pregunta","Resultado","Repetir","Volver a la fuente","Evalúa la afirmación","Respuesta correcta","Fuente"]},"extra":{"de":["Sein Angesicht ist nicht wie die Angesichter Seiner Geschöpfe; Er ist der Schöpfer aller Angesichter. Sein Selbst ist nicht wie das Selbst Seiner Geschöpfe; Er ist der Schöpfer der Seelen. Nichts ist Ihm gleich, und Er ist der Allhörende, der Allsehende.","Fortsetzung des Haupttextes","Das Buch wird Abū Ḥanīfah zugeschrieben; die sichere Zuschreibung ist wegen Abū Muṭīʿ nicht nachgewiesen.","Die Hand Allahs ist nicht mit einem Körperglied der Geschöpfe gleichzusetzen."],"ar":["ووجهه ليس كوجوه خلقه وهو خالق كل الوجوه ونفسه ليست كنفس خلقه وهو خالق النفوس، ليس كمثله شيء وهو السميع البصير.","تتمة النص الأصلي","الكتاب منسوب إلى أبي حنيفة ولم تثبت صحة النسبة بسبب أبي مطيع.","لا تشبه يد الله جارحة من جوارح المخلوقين."],"en":["His Face is not like the faces of His creatures; He is the Creator of all faces. His Self is not like the selves of His creatures; He is the Creator of souls. Nothing is like Him, and He is the All-Hearing, All-Seeing.","Continuation of the primary text","The work is attributed to Abū Ḥanīfah; certain attribution is not established because of Abū Muṭīʿ.","Allah’s Hand is not to be equated with a bodily limb of creatures."],"tr":["O’nun yüzü yaratılmışlarının yüzleri gibi değildir; O bütün yüzlerin yaratıcısıdır. O’nun nefsi yaratılmışlarının nefisleri gibi değildir; O nefislerin yaratıcısıdır. O’nun benzeri hiçbir şey yoktur; O işitendir, görendir.","Asıl metnin devamı","Eser Ebû Hanîfe’ye nispet edilir; Ebû Mutî‘ sebebiyle kesin nispet sabit değildir.","Allah’ın eli yaratılmışların bir organıyla bir tutulmaz."],"ku":["Rûyê Wî ne wek rûyên mexlûqên Wî ye; Ew Afirînerê hemû rûyan e. Nefsa Wî ne wek nefsên mexlûqên Wî ye; Ew Afirînerê nefsan e. Tiştek naşibe Wî; Ew Bihîstêr û Dîtêr e.","Dewama nivîsa resen","Berhem bi Ebû Henîfe ve tê nisbetkirin; ji ber Ebû Mutî nisbeta teqez nehatiye îspatkirin.","Destê Allah bi endamekî bedenê yê mexlûqan re nayê wekhevkirin."],"ckb":["ڕووی ئەو وەک ڕووی دروستکراوەکانی نییە؛ ئەو دروستکەری هەموو ڕووەکانە. نەفسی ئەو وەک نەفسی دروستکراوەکانی نییە؛ ئەو دروستکەری نەفسەکانە. هیچ شتێک هاوشێوەی ئەو نییە و ئەو بیسەر و بینەرە.","درێژەی دەقی ڕەسەن","بەرهەمەکە بە ئەبو حەنیفە دەدرێتە پاڵ؛ بەهۆی ئەبو موتیعەوە پاڵپێوەدانەکە بە دڵنیایی نەسەلمێنراوە.","دەستی الله بە ئەندامێکی جەستەی دروستکراوەکان یەکسان ناکرێت."],"bs":["Njegovo Lice nije poput lica Njegovih stvorenja; On je Stvoritelj svih lica. Njegovo Biće nije poput bića Njegovih stvorenja; On je Stvoritelj duša. Njemu ništa nije slično i On sve čuje i sve vidi.","Nastavak izvornog teksta","Djelo se pripisuje Ebu Hanifi; sigurna atribucija nije utvrđena zbog Ebu Mutija.","Allahova Ruka ne izjednačava se s tjelesnim udom stvorenja."],"fr":["Son Visage n’est pas comme les visages de Ses créatures ; Il est le Créateur de tous les visages. Son Être n’est pas comme celui de Ses créatures ; Il est le Créateur des âmes. Rien ne Lui ressemble, et Il est Celui qui entend tout et voit tout.","Suite du texte original","L’ouvrage est attribué à Abū Ḥanīfah ; l’attribution certaine n’est pas établie en raison d’Abū Muṭīʿ.","La Main d’Allah ne doit pas être assimilée à un membre corporel des créatures."],"es":["Su Rostro no es como los rostros de Sus criaturas; Él es el Creador de todos los rostros. Su Ser no es como el ser de Sus criaturas; Él es el Creador de las almas. Nada se asemeja a Él, y Él todo lo oye y todo lo ve.","Continuación del texto original","La obra se atribuye a Abū Ḥanīfah; no se ha establecido una atribución segura debido a Abū Muṭīʿ.","La Mano de Allah no se equipara con un miembro corporal de las criaturas."]}}</script><script>const {loc,ui}=JSON.parse(document.getElementById('data').textContent);const by=id=>document.getElementById(id),sel=by('language');let lang=new URLSearchParams(location.search).get('lang');try{lang=lang||localStorage.getItem('darAdultPreferredLocaleV1')}catch(e){}function setLang(l){lang=loc[l]?l:'de';sel.value=lang;document.documentElement.lang=lang;document.documentElement.dir=['ar','ckb'].includes(lang)?'rtl':'ltr';try{localStorage.setItem('darAdultPreferredLocaleV1',lang)}catch(e){}}let pos=0,score=0,answered=false;const keys=[true,false,true,false];function show(){const d=loc[lang],u=ui[lang];answered=false;by('result').hidden=true;by('quiz').hidden=false;by('progress').textContent=(pos+1)+' / 4';by('prompt').textContent=u[16];by('question').textContent=d[6][pos];by('yes').textContent=u[10];by('no').textContent=u[11];by('yes').disabled=by('no').disabled=false;by('feedback').textContent='';by('next').disabled=true;by('next').textContent=pos===3?u[13]:u[12]}function choose(x){if(answered)return;answered=true;if(x===keys[pos])score++;by('yes').disabled=by('no').disabled=true;const d=loc[lang],u=ui[lang];by('feedback').textContent=u[17]+': '+u[keys[pos]?10:11]+' — '+d[[1,1,4,3][pos]];by('next').disabled=false}function render(l){setLang(l);pos=score=0;const d=loc[lang],u=ui[lang];by('title').textContent=d[0];by('languageLabel').textContent=u[0];by('back').textContent=u[15];by('resultTitle').textContent=u[13];by('again').textContent=u[14];show()}by('yes').onclick=()=>choose(true);by('no').onclick=()=>choose(false);by('next').onclick=()=>{if(pos<3){pos++;show()}else{by('quiz').hidden=true;by('result').hidden=false;by('score').textContent=score+' / 4'}};by('again').onclick=()=>render(lang);by('back').onclick=()=>location.assign('/q/67/?lang='+encodeURIComponent(lang));sel.onchange=()=>render(sel.value);render(lang);</script></body></html>
