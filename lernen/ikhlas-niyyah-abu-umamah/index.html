<!doctype html>
<html lang="de" dir="ltr" data-q-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow"><meta name="theme-color" content="#101b16">
<title>Ikhlāṣ und Absicht · Lernbereich Q60 | DĀR AL TAWḤĪD</title>
<link rel="canonical" href="https://dar-al-tawhid.de/lernen/ikhlas-niyyah-abu-umamah/">
<link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b16;color:#f5ecd7;font:16px/1.5 system-ui,-apple-system,sans-serif}
main{width:min(100% - 28px,740px);margin:auto;padding:20px 0 calc(40px + env(safe-area-inset-bottom,0px))}
header{text-align:center}.logo{display:block;width:67px;height:67px;object-fit:contain;margin:0 auto}
.brand{font:700 clamp(22px,4vw,30px) Georgia,serif;letter-spacing:.06em}.signature{margin:0;font-style:italic;color:#d6b877}
h1{font-size:clamp(23px,5vw,35px);line-height:1.22;margin:16px auto 12px}
a{color:#f4dba3}button.back{background:transparent;color:#f4dba3;border:0;border-bottom:1px solid #b9a072;font:700 15px system-ui,sans-serif;cursor:pointer}select{border-radius:12px;border:1px solid #ab9468;background:#1d3025;color:#f5ecd7;min-height:45px;max-width:100%;padding:8px 12px;font:inherit}
.back{display:inline-block;margin:16px 0;border-bottom:1px solid #b9a072;text-decoration:none;font-weight:700}
.card{padding:clamp(17px,4vw,27px) 0;border-top:1px solid #9e895e;margin:10px 0 20px}
.opt{display:block;width:100%;text-align:start;min-height:51px;border:1px solid #806e4f;background:#1b3125;color:#f5ecd7;border-radius:12px;padding:12px 14px;margin:10px 0;font:600 15px/1.5 system-ui,sans-serif;cursor:pointer}
.opt:disabled{opacity:.8}.opt[data-correct="1"]{border:2px solid #86cda2}.opt[data-wrong="1"]{border:2px solid #e5ac94}
.next{min-height:46px;padding:10px 19px;border:0;border-radius:12px;background:#dbc18b;color:#19281d;font:800 15px system-ui;cursor:pointer}
.next:disabled{opacity:.42}.note{color:#ddcfae;font-size:14px}.progress{color:#dfc68d;font-size:13px;font-weight:800;letter-spacing:.05em}
#result[hidden],#quiz[hidden],#notice[hidden]{display:none!important}
html[dir="rtl"] .opt{text-align:right}
</style><script src="/assets/i18n/adult-ui-translate.js?v=20261126-locale1" defer></script>
</head><body class="heritage-learning">
<main><header><img class="logo" src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD">
<div class="brand">DĀR AL TAWḤĪD</div><p class="signature">by Serhat Abu Malik</p>
<h1 id="pageTitle">ALLAH NIMMT NUR AUFRICHTIGE TATEN AN</h1>
<select id="language" aria-label="Sprache wählen"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select>
<p id="notice" class="note" hidden></p><button class="back" type="button" id="back">← Quellenkarte Q60</button></header>
<section class="card" id="quiz" aria-live="polite"><p class="progress" id="progress"></p><h2 id="question"></h2><div id="options"></div><p class="note" id="feedback" role="status"></p><button class="next" id="next" type="button" disabled>Nächste Frage</button></section>
<section class="card" id="result" hidden><h2>Ergebnis</h2><p id="score"></p><button class="next" id="again" type="button">Erneut lernen</button></section>
<p class="note">Quelle: Sunan an-Nasāʾī, Nr. 3140. Die Fragen dienen dem Textverständnis, sie sind keine neue Überlieferung.</p>
</main>
<script>
(async function(){
const el=id=>document.getElementById(id);
const select=el('language'),notice=el('notice'),key='darAdultPreferredLocaleV1';
let code=new URLSearchParams(location.search).get('lang'),n=0,correct=0,answered=false;
if(!code){try{code=localStorage.getItem(key)}catch(_){}}
try{
const response=await fetch('/assets/q60-locales.json',{cache:'no-cache'});
if(!response.ok)throw new Error('Missing Q60 translations');
const book=await response.json(),locales=book.locales;
const required=['de','ar','en','tr','ku','ckb','bs','fr','es'];
if(required.some(k=>!locales[k]||locales[k].quiz?.length!==4))throw new Error('Incomplete translations');
function render(){
const d=locales[code],L=d.labels,qs=d.quiz;
answered=false;
el('result').hidden=true;el('quiz').hidden=false;
el('feedback').textContent='';
el('next').disabled=true;
el('next').textContent=n===qs.length-1?L.results:L.next;
el('progress').textContent=L.progress+' '+(n+1)+' '+L.of+' '+qs.length;
el('question').textContent=qs[n].q;
const box=el('options');box.replaceChildren();
qs[n].a.forEach((choice,i)=>{
const button=document.createElement('button');
button.type='button';button.className='opt';button.textContent=choice;
button.addEventListener('click',()=>{
if(answered)return;
answered=true;
if(i===qs[n].correct)correct++;
[...box.children].forEach((it,k)=>{
it.disabled=true;
if(k===qs[n].correct)it.dataset.correct='1';
else if(k===i)it.dataset.wrong='1';
});
el('feedback').textContent=qs[n].why;
el('next').disabled=false;
});
box.appendChild(button);
});
}
function localize(v){
if(!locales[v])v='de';
code=v;
const d=locales[v],L=d.labels;
select.value=v;
document.documentElement.lang=v;
document.documentElement.dir=v==='ar'||v==='ckb'?'rtl':'ltr';
el('pageTitle').textContent=d.title;
el('back').textContent=L.back;
el('result').querySelector('h2').textContent=L.result;
el('again').textContent=L.again;
document.querySelector('main > p.note').textContent=L.sourceNote;
notice.hidden=true;notice.textContent='';
n=0;correct=0;
try{localStorage.setItem(key,v)}catch(_){}
render();
}
el('next').addEventListener('click',()=>{
const d=locales[code];
if(n<d.quiz.length-1){n++;render()}
else{
el('quiz').hidden=true;el('result').hidden=false;
el('score').textContent=correct+' / '+d.quiz.length+' '+d.labels.score;
}
});
el('again').addEventListener('click',()=>{n=0;correct=0;render()});
el('back').addEventListener('click',()=>location.assign('/q/60/?lang='+encodeURIComponent(code)));
select.addEventListener('change',()=>localize(select.value));
localize(code||'de');
}catch(e){
notice.hidden=false;notice.textContent='Sprachinhalte sind derzeit nicht verfügbar.';
select.disabled=true;el('quiz').hidden=true;
}
})();
</script></body></html>
