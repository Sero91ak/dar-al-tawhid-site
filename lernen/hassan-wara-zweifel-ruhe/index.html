<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lass das Zweifelhafte und finde Ruhe · Q72</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/hassan-wara-zweifel-ruhe/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .quiz-button{margin:8px;min-width:100px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning" data-learning-stage="quiz"><main data-dar-no-translate="qsource-nine-locales"><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Lass das Zweifelhafte und finde Ruhe</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Lass das Zweifelhafte und finde Ruhe",["Yūnus ibn ʿUbayd sagte, mit nichts habe er sich schwerer getan als mit dem Waraʿ.","Die Aussage ist ein Ḥadīṯ des Propheten mit ausdrücklicher ṣaḥīḥ-Wertung.","Ḥassān fand Ruhe, weil er das Beunruhigende für das Unbedenkliche verließ.","Al-Bukhārī überliefert das ganze Gespräch mit vollständiger Kette als nummerierten Ḥadīṯ."],["So steht es im Gespräch bei Abū Nuʿaym, Ḥilyat al-Awliyāʾ 3/116.","Nein. Es ist ein Āṯar Ḥassān ibn Abī Sināns. Für dieses Gespräch wurde keine ausdrückliche ṣaḥīḥ-Wertung gefunden.","Ja: „Ich habe das, was mich beunruhigt, verlassen für das, was mich nicht beunruhigt, und so fand ich Ruhe.“","Nein. Er nennt nur die Kurzfassung als Kapitelüberschrift ohne Kette und ohne eigene Nummer; das Gespräch steht bei Abū Nuʿaym."]],"ar":["اترك ما يريبك تجد الراحة",["قال يونس بن عبيد: ما عالجت شيئا أشد علي من الورع.","هذا القول حديث نبوي حكم عليه بالصحة صراحة.","استراح حسان لأنه ترك ما يريبه إلى ما لا يريبه.","روى البخاري المحاورة كاملة بإسناد متصل حديثا مرقما."],["هكذا ورد في المحاورة عند أبي نعيم، حلية الأولياء ٣/١١٦.","لا. هو أثر عن حسان بن أبي سنان، ولم نجد حكما صريحا بالصحة على هذه المحاورة.","نعم: «تركت ما يريبني إلى ما لا يريبني فاسترحت».","لا. ذكر اللفظ المختصر فقط في ترجمة الباب بلا إسناد ولا رقم مستقل، والمحاورة عند أبي نعيم."]],"en":["Leave the Doubtful and Find Peace",["Yūnus ibn ʿUbayd said nothing had been harder for him than waraʿ.","The saying is a hadith of the Prophet with an explicit ṣaḥīḥ grading.","Ḥassān found peace because he left what troubled him for what did not.","Al-Bukhārī narrates the whole conversation with a full chain as a numbered hadith."],["That is how the conversation reads in Abū Nuʿaym, Ḥilyat al-Awliyāʾ 3/116.","No. It is an athar of Ḥassān ibn Abī Sinān. No explicit ṣaḥīḥ grading was found for this conversation.","Yes: “I left what troubles me for what does not trouble me, and so I found peace.”","No. He cites only the short wording as a chapter heading, without a chain or a number of its own; the conversation is in Abū Nuʿaym."]],"tr":["Şüpheliyi Bırak, Huzuru Bul",["Yûnus b. Ubeyd, vera kadar zor gelen hiçbir şeyle uğraşmadığını söyledi.","Bu söz, açıkça sahih hükmü verilmiş bir Peygamber hadisidir.","Hassân, kuşkulandıranı kuşkulandırmayana bıraktığı için rahatladı.","Buhârî konuşmanın tamamını tam bir senedle numaralı hadis olarak rivayet eder."],["Ebû Nuaym’ın Hilyetü’l-evliyâ eserinde 3/116’da konuşma böyledir.","Hayır. Bu, Hassân b. Ebû Sinân’a ait bir eserdir. Bu konuşma için açık bir sahih hükmü bulunamadı.","Evet: “Beni kuşkulandıranı, beni kuşkulandırmayana bıraktım ve böylece rahatladım.”","Hayır. O, kısa lafzı senedsiz ve ayrı numarasız olarak bab başlığında zikreder; konuşma Ebû Nuaym’dadır."]],"ku":["Gumanbaran Berde û Aramiyê Bibîne",["Yûnus kurê Ubeyd got ku tiştekî ji wer’ê zehmetir ji wî re tunebû.","Ev gotin hedîseke Pêxember e ku bi eşkereyî sehîh hatiye nirxandin.","Hessan rehet bû ji ber ku wî tiştê gumanbar ji bo tiştê bêguman berda.","Buxarî tevahiya danûstandinê bi zincîreke temam wek hedîseke bi hejmar rîwayet dike."],["Danûstandin li cem Ebû Nu’eym, Hilyetul-Ewliya 3/116, wiha ye.","Na. Ev eserek e ji Hessan kurê Ebû Sinan. Ji bo vê danûstandinê nirxandineke eşkere ya sehîh nehat dîtin.","Erê: “Min tiştê ku min dixe gumanê berda, ji bo tiştê ku min naxe gumanê, û ez rehet bûm.”","Na. Ew tenê kurteya gotinê wek sernavê babê bê zincîr û bê hejmar tîne; danûstandin li cem Ebû Nu’eym e."]],"ckb":["گوماناوی وازلێبهێنە و ئارامی بدۆزەرەوە",["یونسی کوڕی عوبەید گوتی هیچ شتێک لە وەرەع قورستر نەبووە لەسەری.","ئەم وتەیە فەرموودەی پێغەمبەرە و بە ڕاشکاوی صەحیح دانراوە.","حەسسان ئاسوودە بوو چونکە ئەوەی دوودڵی دەکرد وازی لێهێنا بۆ ئەوەی دوودڵی نەدەکرد.","بوخاری هەموو گفتوگۆکە بە زنجیرەیەکی تەواو وەک فەرموودەیەکی ژمارەدار ڕیوایەت دەکات."],["گفتوگۆکە لای ئەبو نوعەیم، حلیة الأولیاء ٣/١١٦ بەم شێوەیەیە.","نەخێر. ئەسەرێکی حەسسانی کوڕی ئەبو سینانە. هیچ حوکمێکی ڕاشکاوی صەحیح بۆ ئەم گفتوگۆیە نەدۆزرایەوە.","بەڵێ: «ئەوەی دوودڵی کردم وازم لێهێنا بۆ ئەوەی دوودڵی نەکردم، و ئاسوودە بووم.»","نەخێر. تەنها کورتەکەی وەک ناونیشانی باب بێ زنجیرە و بێ ژمارە دەهێنێت؛ گفتوگۆکە لای ئەبو نوعەیمە."]],"bs":["Ostavi sumnjivo i pronađi mir",["Junus ibn Ubejd je rekao da mu ništa nije bilo teže od vera’a.","Ova izjava je hadis Poslanika s izričitom ocjenom sahih.","Hassan je pronašao mir jer je ostavio ono što ga uznemirava radi onoga što ga ne uznemirava.","Buhari prenosi cijeli razgovor s potpunim lancem kao numerisani hadis."],["Tako glasi razgovor kod Ebu Nu’ajma, Hiljetu-l-evlija 3/116.","Ne. To je eser Hassana ibn Ebi Sinana. Za ovaj razgovor nije pronađena izričita ocjena sahih.","Da: „Ostavio sam ono što me uznemirava radi onoga što me ne uznemirava, i tako sam pronašao mir.“","Ne. On navodi samo kratku verziju kao naslov poglavlja, bez lanca i bez vlastitog broja; razgovor je kod Ebu Nu’ajma."]],"fr":["Laisse le douteux et trouve la paix",["Yūnus ibn ʿUbayd a dit que rien ne lui avait été plus difficile que le waraʿ.","Cette parole est un hadith du Prophète avec un jugement ṣaḥīḥ explicite.","Ḥassān a trouvé la paix parce qu’il a laissé ce qui le troublait pour ce qui ne le troublait pas.","Al-Bukhārī rapporte toute la conversation avec une chaîne complète comme hadith numéroté."],["C’est ainsi que se lit la conversation chez Abū Nuʿaym, Ḥilyat al-Awliyāʾ 3/116.","Non. C’est un athar de Ḥassān ibn Abī Sinān. Aucun jugement ṣaḥīḥ explicite n’a été trouvé pour cette conversation.","Oui : « J’ai laissé ce qui me trouble pour ce qui ne me trouble pas, et ainsi j’ai trouvé la paix. »","Non. Il ne cite que la version courte comme titre de chapitre, sans chaîne ni numéro propre ; la conversation se trouve chez Abū Nuʿaym."]],"es":["Deja lo dudoso y encuentra la paz",["Yūnus ibn ʿUbayd dijo que nada le había costado más que el waraʿ.","La frase es un hadiz del Profeta con una valoración ṣaḥīḥ explícita.","Ḥassān encontró la paz porque dejó lo que le inquietaba por lo que no le inquietaba.","Al-Bujārī narra toda la conversación con una cadena completa como hadiz numerado."],["Así se lee la conversación en Abū Nuʿaym, Ḥilyat al-Awliyāʾ 3/116.","No. Es un athar de Ḥassān ibn Abī Sinān. No se encontró una valoración ṣaḥīḥ explícita para esta conversación.","Sí: «Dejé lo que me inquieta por lo que no me inquieta, y así encontré la paz.»","No. Solo cita la versión breve como título de capítulo, sin cadena ni número propio; la conversación está en Abū Nuʿaym."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Explanation","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Açıklama","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendir","Doğru cevap","Kaynak"],"ku":["Ziman","Çarçove","Gotin","Nivîsa erebî","Isnad","Nirxandin","Şîrove","Encam","Çavkaniyên resen","Zêdetir fêr bibe","Rast","Şaş","Pirsa din","Encam","Dîsa fêr bibe","Vegere çavkaniyê","Gotinê binirxîne","Bersiva rast","Çavkanî"],"ckb":["زمان","چوارچێوە","دەق","دەقی عەرەبی","سەنەد","هەڵسەنگان
