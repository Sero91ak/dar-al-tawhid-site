<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Gefahr der Ahwāʾ · Q70</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/shafii-gefahr-der-ahwa/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .quiz-button{margin:8px;min-width:100px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning" data-learning-stage="quiz"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Die Gefahr der Ahwāʾ</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Die Gefahr der Ahwāʾ",["Aš-Šāfiʿī sagte, es sei besser, Allah mit jeder Sünde außer dem Schirk zu begegnen, als Ihm mit etwas von den Ahwāʾ zu begegnen.","Die Aussage will sagen, dass Sünden leicht oder unwichtig seien.","al-Bayhaqī nennt als Anlass, dass aš-Šāfiʿī Menschen über den Qadar streiten sah; Ahwāʾ meint hier Abweichungen in der ʿAqīdah.","Ein namentlich genannter Gelehrter hat diese Kette ausdrücklich als ṣaḥīḥ oder ḥasan bewertet."],["So lautet der überlieferte Sinn beider Fassungen.","Sie macht Sünden nicht gering. Sie stellt die Irrlehre neben die Sünde, die man noch als Sünde erkennt.","Der Zusammenhang ist der Streit über den Qadar, und Ahwāʾ steht für Abweichungen wie die Muʿtazilah und die Qadariyyah.","Eine solche ausdrückliche Wertung wurde nicht gefunden und wird nicht behauptet."]],"ar":["خطر الأهواء",["قال الشافعي: لقاء الله بكل ذنب سوى الشرك خير من لقائه بشيء من الأهواء.","يريد القول أن الذنوب هينة أو لا تضر.","ذكر البيهقي أن الشافعي قال ذلك لما رأى قوما يتنازعون في القدر، والأهواء هنا انحرافات في العقيدة.","حكم عالم مسمّى على هذا الإسناد صراحة بأنه صحيح أو حسن."],["هذا معنى الروايتين المنقولتين.","القول لا يهوّن الذنوب. إنه يضع الهوى بإزاء الذنب الذي لا يزال يُعرف ذنبا.","المناسبة النزاع في القدر، والأهواء انحرافات كالمعتزلة والقدرية.","لم يُوجد مثل هذا الحكم الصريح، ولا يُدّعى."]],"en":["The danger of the ahwāʾ",["Al-Shāfiʿī said it is better to meet Allah with any sin except shirk than to meet Him with something of the ahwāʾ.","The saying means that sins are light or unimportant.","Al-Bayhaqī gives the occasion as al-Shāfiʿī seeing people dispute about qadar; ahwāʾ here means deviations in creed.","A named scholar explicitly graded this chain ṣaḥīḥ or ḥasan."],["That is the transmitted sense of both wordings.","It does not make sins light. It sets deviant creed beside the sin that is still known as a sin.","The setting is the dispute about qadar, and ahwāʾ means deviations such as the Muʿtazilah and the Qadariyyah.","No such explicit grade was found, and none is claimed."]],"tr":["Ehvânın tehlikesi",["eş-Şâfiî, şirk dışındaki her günahla Allah’a kavuşmanın, ehvâdan bir şeyle kavuşmaktan daha hayırlı olduğunu söyledi.","Söz, günahların hafif veya önemsiz olduğunu anlatmak ister.","el-Beyhakî sebebi, eş-Şâfiî’nin insanları kader hakkında çekişirken görmesi diye verir; ehvâ burada akîde sapmasıdır.","Adı anılan bir âlim bu senede açıkça sahih veya hasen demiştir."],["Nakledilen iki lafzın anlamı budur.","Günahları hafifletmez. Sapmayı, hâlâ günah diye bilinen günahın yanına koyar.","Bağlam kader tartışmasıdır; ehvâ Muʿtezile ve Kaderiyye gibi sapmaları anlatır.","Böyle açık bir hüküm bulunmadı ve iddia edilmez."]],"ku":["Metirsiya ehwê",["eş-Şafiî got ku rûbirûbûna bi Allah re bi her gunahî ji bilî şirkê çêtir e ji rûbirûbûna bi tiştekî ji ehwê.","Gotin dixwaze bibêje ku gunah sivik an bêgirîng in.","el-Beyhaqî sebebê wiha dide ku eş-Şafiî mirovan di nîqaşa qederê de dît; ehwê li vir jidariya eqîdeyê ye.","Alimekî bi nav li ser vê zincîrê bi eşkere sehîh an hesen gotiye."],["Ev wateya her du lafzên veguhastî ye.","Ew gunahan sivik nake. Ew jidariyê li kêleka gunahê ku hîn wek gunah tê naskirin datîne.","Çarçove nîqaşa qederê ye, û ehwê jidariyên wek Muʿtezile û Qederiyye ne.","Hukmekî eşkere yê wiha nehat dîtin û nayê daîtin."]],"ckb":["مەترسیی ئەهوا",["شافیعی گوتی ڕووبەڕووبوونەوە لەگەڵ خوا بە هەموو گوناهێک جگە لە شیرک باشترە لە ڕووبەڕووبوونەوە بە شتێک لە ئەهوا.","قسەکە دەیەوێت بڵێت گوناهەکان سووک یان بێگرینگن.","بەیھەقی هۆکارەکە ئەوەیە کە شافیعی خەڵکی بینی لەسەر قەدەر کێشە دەکەن؛ ئەهوا لێرە لادانی عەقیدەیە.","زانایەکی ناودار بە ڕوونی ئەم سەنەدەی بە سەحیح یان حەسەن حوکم کردووە."],["ئەمە واتای هەردوو دەقە گواستراوەکەیە.","گوناهەکان سووک ناکات. لادانەکە دەخاتە تەنیشت ئەو گوناهەی کە هێشتا وەک گوناه دەناسرێت.","چوارچێوەکە کێشەی قەدەرە، و ئەهوا لادانەکانی وەک موعتەزیلە و قەدەرییەیە.","حوکمێکی ڕوونی وا نەدۆزرایەوە و نادرێت."]],"bs":["Opasnost ehvâa",["Eš-Šafiʿi je rekao da je susret s Allahom sa svakim grijehom osim širka bolji od susreta s nečim od ehvâa.","Izreka hoće reći da su grijesi laki ili nevažni.","el-Bejheki kao povod navodi da je eš-Šafiʿi vidio ljude kako se spore o kaderu; ehvâ ovdje znači odstupanje u akaidu.","Imenovani učenjak je ovaj lanac izričito ocijenio sahihom ili hasenom."],["To je preneseni smisao obje verzije.","Ne olakšava grijehe. Zabludu stavlja uz grijeh koji se još poznaje kao grijeh.","Okvir je spor o kaderu, a ehvâ su odstupanja poput muʿtezila i kaderijja.","Takva izričita ocjena nije nađena i ne tvrdi se."]],"fr":["Le danger des ahwāʾ",["Aš-Šāfiʿī a dit qu’il est meilleur de rencontrer Allah avec tout péché hormis le chirk que de Le rencontrer avec quelque chose des ahwāʾ.","La parole veut dire que les péchés sont légers ou sans importance.","Al-Bayhaqī donne pour occasion qu’aš-Šāfiʿī vit des gens se disputer au sujet du qadar ; ahwāʾ signifie ici un écart dans la croyance.","Un savant nommé a explicitement jugé cette chaîne ṣaḥīḥ ou ḥasan."],["C’est le sens transmis des deux libellés.","Elle ne rend pas les péchés légers. Elle place la doctrine déviante à côté du péché encore reconnu comme un péché.","Le cadre est la dispute sur le qadar, et les ahwāʾ sont des écarts comme les muʿtazilites et les qadarites.","Un tel jugement explicite n’a pas été trouvé et n’est pas affirmé."]],"es":["El peligro de los ahwāʾ",["Aš-Šāfiʿī dijo que es mejor encontrarse con Allah con cualquier pecado excepto el shirk que encontrarse con Él con algo de los ahwāʾ.","El dicho quiere decir que los pecados son leves o carecen de importancia.","Al-Bayhaqī da como ocasión que aš-Šāfiʿī vio a gente discutir sobre el qadar; ahwāʾ significa aquí una desviación en la creencia.","Un sabio nombrado dictaminó de forma explícita que esta cadena es ṣaḥīḥ o ḥasan."],["Ese es el sentido transmitido de ambas redacciones.","No hace leves los pecados. Pone la doctrina desviada junto al pecado que todavía se conoce como pecado.","El marco es la disputa sobre el qadar, y los ahwāʾ son desviaciones como los muʿtazilíes y los qadaríes.","No se halló tal dictamen explícito y no se afirma."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Explanation","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Açıklama","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendir","Doğru cevap","Kaynak"],"ku":["Ziman","Çarçove","Gotin","Nivîsa erebî","Isnad","Nirxandin","Şîrove","Encam","Çavkaniyên resen","Zêdetir fêr bibe","Rast","Şaş","Pirsa din","Encam","Dîsa fêr bibe","Vegere çavkaniyê","Gotinê binirxîne","Bersiva rast","Çavkanî"],"ckb":["زمان","چوارچێوە","دەق","دەقی عەرەبی","سەنەد","هەڵسەنگاندن","ڕوونکردنەوە","ئەنجام","سەرچاوە ڕەسەنەکان","زانیاری زیاتر","ڕاست","هەڵە","پرسیاری دواتر","ئەنجام","دووبارە فێربە","گەڕانەوە بۆ سەرچاوە","وتەکە هەڵبسەنگێنە","وەڵامی ڕاست","سەرچاوە"],"bs":["Jezik","Kontekst","Tekst","Arapski izvornik","Lanac","Ocjena","Objašnjenje","Zaključak","Izvorni dokazi","Produbi znanje","Tačno","Netačno","Sljedeće pitanje","Rezultat","Uči ponovo","Nazad na izvor","Provjeri tvrdnju","Tača
