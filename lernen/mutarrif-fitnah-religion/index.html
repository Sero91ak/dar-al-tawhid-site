</head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Die Gefahr der Fitnah</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Die Gefahr der Fitnah","Wahrlich, die Fitnah kommt nicht, um die Menschen rechtzuleiten, sondern sie kommt, um den Gläubigen von seiner Religion abzubringen.","Im Bericht über Zayd ibn Ṣawḥān wird Muṭarrifs Zurückhaltung in Zeiten der Fitnah beschrieben.","Maqṭūʿ: Aussage eines Tābiʿī. Zwei Überlieferungswege stehen in Ḥilyat al-Awliyāʾ 2/204; ein abschließendes Authentizitätsurteil wird nicht behauptet.","Der Weg über Ṯābit al-Bunānī nennt die Aussage direkt von Muṭarrif; die andere Fassung führt über Sufyān ohne ausdrückliche Hörangabe. Gemeint sind religiös gefährdende Unruhen, nicht jede Prüfung des Lebens.","Bewahre deine Religion und halte in Zeiten der Fitnah an der Wahrheit fest.",["Die Aussage stammt von einem Tābiʿī.","Die Aussage ist ein prophetischer Ḥadīṯ.","Die Fundstelle enthält zwei Überlieferungswege.","Die Warnung betrifft religiös gefährdende Unruhen."]],"ar":["خطر الفتنة","إن الفتنة لا تجيء تهدي الناس، ولكن تجيء تقارع المؤمن عن دينه.","في خبر زيد بن صوحان يظهر موقف مطرف من الفتنة واجتنابها.","أثر مقطوع عن تابعي. ورد بطريقين في حلية الأولياء ٢/٢٠٤، ولا نجزم بحكم نهائي على صحته.","طريق ثابت البناني يرويه عن مطرف، وفي الطريق الآخر يقول سفيان: قال مطرف، دون تصريح بالسماع. المقصود الفتن التي تهدد الدين، لا كل ابتلاء في الحياة.","احفظ دينك والزم الحق في زمن الفتن.",["هذا قول تابعي.","هذا حديث نبوي.","ورد الأثر بطريقين في المصدر.","التحذير من الفتن التي تهدد الدين."]],"en":["The danger of fitnah","Indeed, fitnah does not come to guide people, but comes to drive the believer away from his religion.","The account concerning Zayd ibn Ṣawḥān describes Muṭarrif’s restraint during turmoil.","Maqṭūʿ: a statement of a Tābiʿī. Two transmission routes appear in Ḥilyat al-Awliyāʾ 2/204; no final authenticity judgment is asserted.","The route through Ṯābit al-Bunānī reports from Muṭarrif; the other has Sufyān saying ‘Muṭarrif said’ without explicit hearing. The warning concerns turmoil threatening religion, not every trial in life.","Preserve your religion and hold to the truth during fitnah.",["The statement is from a Tābiʿī.","This is a prophetic hadith.","The source contains two transmission routes.","The warning concerns turmoil threatening religion."]],"tr":["Fitnenin tehlikesi","Şüphesiz fitne insanları doğru yola iletmek için gelmez; mümini dininden uzaklaştırmak için gelir.","Zeyd b. Sûhân hakkındaki rivayette Mutarrif’in fitne zamanındaki ihtiyatı anlatılır.","Maktû: Bir tâbiînin sözü. Hilyetü’l-Evliyâ 2/204’te iki rivayet yolu vardır; kesin bir sıhhat hükmü ileri sürülmemektedir.","Sâbit el-Bünânî yolu Mutarrif’ten nakleder; diğerinde Süfyân, işittiğini açıkça belirtmeden ‘Mutarrif dedi’ der. Uyarı hayatın her imtihanına değil, dini tehlikeye atan fitnelere dairdir.","Fitne zamanında dinini koru ve hakka bağlı kal.",["Bu söz bir tâbiîye aittir.","Bu, nebevî bir hadistir.","Kaynakta iki rivayet yolu vardır.","Uyarı dini tehlikeye atan fitnelere dairdir."]],"ku":["Xetera fitneyê","Bi rastî fitne nayê ku rêya rast nîşanî mirovan bide, lê tê ku bawermend ji dînê wî dûr bixe.","Di vegotina derbarê Zeyd ibn Sewhan de tedbîra Muterrif di dema fitneyê de tê diyarkirin.","Meqtû: gotina tabiîyekî ye. Di Hilyet el-Ewliya 2/204 de du rêyên rivayetê hene; hukmekî dawî li ser rastiya wê nayê dayîn.","Rêya Sabit el-Bunanî ji Muterrif vediguhêze; di rêya din de Sufyan dibêje Muterrif got, bê ku bihîstina xwe eşkere bike. Hişyarî li ser fitneyên xeternak ji bo dîn e, ne her ceribandina jiyanê.","Di dema fitneyê de dînê xwe biparêze û bi heqîqetê ve girêdayî bimîne.",["Ev gotina tabiîyekî ye.","Ev hedîseke pêxemberî ye.","Di çavkaniyê de du rêyên rivayetê hene.","Hişyarî li ser fitneyên ku dîn dixin xeterê ye."]],"ckb":["مەترسی فیتنە","بەڕاستی فیتنە نایەت بۆ ڕێنماییکردنی خەڵک، بەڵکو دێت بۆ دوورخستنەوەی باوەڕدار لە دینەکەی.","لە گێڕانەوەی سەبارەت بە زەید کوڕی سەوحان، خۆپاراستنی موتەڕڕیف لە کاتی فیتنەدا باس دەکرێت.","مەقطوعە: وتەی تابعییەکە. لە حلیة الأولیاء ٢/٢٠٤ دوو ڕێگای گێڕانەوە هەیە؛ حوکمی کۆتایی لەسەر دروستییەکەی نادرێت.","سابیت بونانی لە موتەڕڕیف دەگێڕێتەوە؛ لە ڕێگای دووەمدا سوفیان دەڵێت موتەڕڕیف گوتی، بەبێ باسکردنی گوێگرتنی ڕاستەوخۆ. مەبەست فیتنەی مەترسیدار بۆ دینە، نە هەموو تاقیکردنەوەیەکی ژیان.","لە کاتی فیتنەدا دینەکەت بپارێزە و پابەندی حەق بە.",["ئەمە وتەی تابعییەکە.","ئەمە حەدیسی پێغەمبەرە.","لە سەرچاوەکەدا دوو ڕێگای گێڕانەوە هەیە.","ئاگادارییەکە لە فیتنەی مەترسیدار بۆ دینە."]],"bs":["Opasnost fitne","Zaista, fitna ne dolazi da ljude uputi, nego da vjernika odvrati od njegove vjere.","Predaja o Zejdu ibn Savhanu opisuje Mutarrifov oprez u vremenu fitne.","Maktu: izjava tabiina. Dva lanca prenosa nalaze se u Hiljetul-evlija 2/204; ne iznosi se konačna ocjena vjerodostojnosti.","Put preko Sabita el-Bunanija prenosi od Mutarrifa; drugi navodi Sufjanove riječi ‘Mutarrif je rekao’ bez izričitog navođenja slušanja. Upozorenje se odnosi na smutnje koje ugrožavaju vjeru, ne na svako životno iskušenje.","Čuvaj vjeru i drži se istine u vremenu fitne.",["Ovo je izjava tabiina.","Ovo je poslanički hadis.","Izvor sadrži dva lanca prenosa.","Upozorenje se odnosi na smutnje koje ugrožavaju vjeru."]],"fr":["Le danger de la fitna","Certes, la fitna ne vient pas guider les gens, mais éloigner le croyant de sa religion.","Le récit concernant Zayd ibn Ṣawḥān décrit la retenue de Muṭarrif en période de troubles.","Maqṭūʿ : parole d’un tābiʿī. Deux voies de transmission figurent dans Ḥilyat al-Awliyāʾ 2/204 ; aucun jugement définitif d’authenticité n’est affirmé.","La voie de Ṯābit al-Bunānī rapporte de Muṭarrif ; dans l’autre, Sufyān dit « Muṭarrif a dit » sans mention explicite d’audition. L’avertissement vise les troubles menaçant la religion, non toute épreuve de la vie.","Préserve ta religion et attache-toi à la vérité en période de fitna.",["La parole vient d’un tābiʿī.","Il s’agit d’un hadith prophétique.","La source contient deux voies de transmission.","L’avertissement vise les troubles menaçant la religion."]],"es":["El peligro de la fitna","Ciertamente, la fitna no viene para guiar a la gente, sino para apartar al creyente de su religión.","El relato sobre Zayd ibn Ṣawḥān describe la cautela de Muṭarrif en tiempos de discordia.","Maqṭūʿ: dicho de un tābiʿī. Hay dos vías de transmisión en Ḥilyat al-Awliyāʾ 2/204; no se afirma un juicio definitivo de autenticidad.","La vía de Ṯābit al-Bunānī transmite de Muṭarrif; la otra recoge ‘Muṭarrif dijo’ de Sufyān, sin indicar explícitamente que lo oyó. La advertencia se refiere a discordias que amenazan la religión, no a toda prueba de la vida.","Preserva tu religión y aférrate a la verdad en tiempos de fitna.",["El dicho procede de un tābiʿī.","Es un hadiz profético.","La fuente contiene dos vías de transmisión.","La advertencia se refiere a discordias que amenazan la religión."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen
