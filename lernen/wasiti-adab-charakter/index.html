<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wenn der Charakter verloren geht · Q68</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/wasiti-adab-charakter/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .qsource-link{margin:10px 0} .qsource-learning{display:block;margin:20px 0;padding:16px;border:1px solid #b39965;border-radius:12px} .qsource-quote{font-size:1.25em;font-weight:600} .note{opacity:.85} .quiz-button{margin:8px;min-width:100px} .answer{border:1px solid #b39965;padding:12px;border-radius:10px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Wenn der Charakter verloren geht</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Wenn der Charakter verloren geht","Wir werden mit einer Zeit geprüft, in der es weder die Sitten des Islam noch die Moral der vorislamischen Unwissenheit noch die Besonnenheit der Menschen von Ehrgefühl gibt.","Abū Bakr al-Wāsiṭī, Muḥammad ibn Mūsā ibn al-Farġānī, lebte in Marw und starb nach 320 n. H. Er gehört nicht zu den Tābiʿīn.","Historische Gelehrtenaussage, kein Prophetenḥadīṯ. In der Ḥilyah steht sie als kāna yaqūl ohne eigene Kette unmittelbar für diesen Satz. Ibn al-Ǧawzī überliefert eine Variante mit ausdrücklicher Hörangabe; eine abschließende Kettenbewertung liegt nicht vor.","Ādāb bezeichnet gute Verhaltensweisen, aḫlāq Charaktereigenschaften und aḥlām hier Besonnenheit bzw. Selbstbeherrschung; murūʾah steht für Ehrgefühl und Anstand. Ibn al-Ǧawzī hat statt aḥlām das Wort aḫlāq (Charakter). Die moralische Mahnung ist keine pauschale Aussage über alle Menschen jeder Epoche.","Der schlechte Charakter anderer ist keine Rechtfertigung für den eigenen schlechten Charakter.",["Die Aussage kritisiert den Verlust guter Sitten und Besonnenheit.","Die Aussage ist ein prophetischer Ḥadīṯ.","Ibn al-Ǧawzī dokumentiert eine Wortlautvariante mit Hörangaben.","Der schlechte Charakter anderer rechtfertigt nicht eigenes Fehlverhalten."]],"ar":["حين يفقد الناس حسن الخلق","ابتلينا بزمان ليس فيه آداب الإسلام، ولا أخلاق الجاهلية، ولا أحلام ذوي المروءة.","أبو بكر الواسطي محمد بن موسى ابن الفرغاني سكن مرو وتوفي بعد سنة ٣٢٠ هـ، وليس من التابعين.","قول تاريخي وليس حديثًا نبويًا. أورده أبو نعيم بصيغة كان يقول دون إسناد مستقل لهذه العبارة، وروى ابن الجوزي لفظًا آخر مع التصريح بالسماع. لم يستكمل الحكم على الإسناد.","الآداب حسن السلوك، والأخلاق الصفات، والأحلام هنا الحلم والعقل، والمروءة كرامة النفس وحسن السيرة. وفي المنتظم أخلاق بدل أحلام. ليست الموعظة حكمًا على كل فرد في كل عصر.","سوء خلق الآخرين لا يبرر سوء خلقك.",["القول ينتقد فقدان الأدب والحلم.","هذا حديث نبوي.","روى ابن الجوزي لفظًا آخر مع التصريح بالسماع.","سوء خلق الآخرين لا يبرر سوء خلق الإنسان."]],"en":["When good character is lost","We have been tried with an age that has neither the manners of Islam, nor the morals of pre-Islamic ignorance, nor the forbearance of people of honour.","Abū Bakr al-Wāsiṭī, Muḥammad ibn Mūsā ibn al-Farghānī, lived in Marw and died after 320 AH. He was not a Tābiʿī.","A historical saying, not a prophetic hadith. The Ḥilyah introduces it as 'he used to say', without a separate chain for this sentence. Ibn al-Jawzī reports a variant with explicit hearing statements; no final chain grading is claimed.","Ādāb means manners, akhlāq character traits, aḥlām here forbearance and sound judgment, and murūʾah honourable conduct. Ibn al-Jawzī has akhlāq instead of aḥlām. This admonition is not a judgment on every person in every age.","Other people's bad character does not justify your own misconduct.",["The saying criticizes the loss of manners and forbearance.","It is a prophetic hadith.","Ibn al-Jawzī reports a variant with explicit hearing statements.","Other people's bad character does not justify one's own misconduct."]],"tr":["Güzel ahlak kaybolduğunda","İslam'ın adabının, cahiliye ahlakının ve mürüvvet sahiplerinin hilminin bulunmadığı bir zamanla imtihan edildik.","Ebû Bekir el-Vâsıtî Muhammed b. Mûsâ el-Fergânî, Merv'de yaşadı ve hicrî 320'den sonra vefat etti. Tâbiî değildir.","Tarihî bir söz, peygamber hadisi değildir. Hilye'de bu cümleye özel isnad verilmeden 'derdi' denilir. İbnü'l-Cevzî açık işitme ifadeleriyle farklı bir lafız nakleder; kesin isnad hükmü verilmemiştir.","Âdâb güzel davranışları, ahlâk karakteri, ahlâm burada hilim ve aklı, mürüvvet ise onurlu davranışı ifade eder. İbnü'l-Cevzî'de ahlâm yerine ahlâk geçer. Bu öğüt her çağdaki herkese yönelik genel bir hüküm değildir.","Başkalarının kötü ahlakı senin kötü davranışını haklı çıkarmaz.",["Söz, adabın ve hilmin kaybolmasını eleştirir.","Bu, peygamber hadisidir.","İbnü'l-Cevzî açık işitme ifadeleriyle farklı bir lafız nakleder.","Başkalarının kötü ahlakı kişinin kendi yanlışını haklı çıkarmaz."]],"ku":["Dema ku exlaqê baş winda dibe","Em bi demekê hatine ceribandin ku ne edebê Îslamê, ne exlaqê cahiliyê û ne jî sebr û aqilê kesên xwedî rûmet tê de heye.","Ebû Bekir el-Wasitî Mihemed ibn Mûsa el-Ferxanî li Merwê jiya û piştî sala 320ê hicrî wefat kir. Ew ne tabiî bû.","Gotineke dîrokî ye, ne hedîsa pêxember e. Hilye gotinê bê zincîreya taybet bi 'digot' vedibêje. Ibn el-Cewzî guhertoyek bi gotina bihîstina eşkere vediguhêze; nirxandina dawî ya zincîreyê tune.","Edeb tevgera baş e, exlaq taybetmendiyên kesayetiyê ne, ahlam li vir aqil û xwekontrolkirin e, muruet jî rûmet e. Ibn el-Cewzî li şûna ahlam exlaq dibêje. Ev şîret hukmek li ser hemû kesên hemû deman nîne.","Exlaqê xerab ê kesên din xeletiyên te rewa nake.",["Gotin windabûna edeb û xwekontrolkirinê rexne dike.","Ev hedîsa pêxember e.","Ibn el-Cewzî guhertoyek bi gotina bihîstina eşkere vediguhêze.","Exlaqê xerab ê kesên din xeletiyên me rewa nake."]],"ckb":["کاتێک ڕەوشتی باش لەدەست دەچێت","بە سەردەمێک تاقی کراوینەتەوە کە نە ئەدەبی ئیسلامی تێدایە، نە ڕەوشتی جاهلیەت و نە دانایی و ئارامی خاوەن شکۆکان.","ئەبو بەکر واسیتی، محەممەد کوڕی موسا فەرغانی، لە مەرو ژیا و دوای ساڵی ٣٢٠ی کۆچی کۆچی دوایی کرد. تابعی نەبوو.","وتەیەکی مێژووییە، نە حەدیسی پێغەمبەر. لە حلیەدا بە شێوەی دەیگوت هاتووە بێ سەنەدی تایبەت بەم ڕستەیە. ئیبن جەوزی دەقێکی جیاواز بە دەربڕینی گوێگرتن دەگێڕێتەوە؛ حوکمی کۆتایی نەدراوە.","ئەدەب ڕەفتاری باشە، ئەخلاق خەسڵەتەکانن، ئەحلام لێرەدا دانایی و خۆڕاگرتنە، مروئە ڕێز و شکۆیە. لە ئیبن جەوزیدا ئەخلاق لەبری ئەحلام هاتووە. ئەم ئامۆژگارییە حوکم نییە بەسەر هەموو کەسێکدا.","ڕەوشتی خراپی خەڵکی تر پاساوی ڕەفتاری خراپی تۆ نییە.",["وتەکە لەدەستچوونی ئەدەب و خۆڕاگرتن ڕەخنە دەکات.","ئەمە حەدیسی پێغەمبەرە.","ئیبن جەوزی دەقێکی جیاواز بە دەربڕینی گوێگرتن دەگێڕێتەوە.","ڕەوشتی خراپی خەڵکی تر پاساوی هەڵەی خۆمان نییە."]],"bs":["Kada se izgubi lijep ahlak","Iskušani smo vremenom u kojem nema ni islamskog edeba, ni ahlaka džahilijeta, ni razboritosti ljudi časti.","Ebu Bekr el-Vasiti, Muhammed ibn Musa el-Fergani, živio je u Mervu i umro nakon 320. h. godine. Nije bio tabiin.","Historijska izreka, ne poslanički hadis. U Hilji stoji 'govorio je', bez posebnog lanca za ovu rečenicu. Ibn el-Dževzi prenosi drugu verziju uz izričito navođenje slušanja; konačna ocjena lanca nije utvrđena.","Edeb označava lijepo ponašanje, ahlak osobine karaktera, ahlam ovdje razboritost i samokontrolu, a muruet čast. Kod Ibn el-Dževzija stoji ahlak umjesto ahlam. Ova pouka nije sud o svakome u svakom vremenu.","Loš ahlak drugih ne opravdava tvoje loše ponašanje.",["Izreka kritikuje gubitak edeba i razboritosti.","Ovo je poslanički hadis.","Ibn el-Dževzi prenosi drugu verziju s izričitim navođenjem slušanja.","Loš ahlak drugih ne opravdava vlastito loše ponašanje."]],"fr":["Quand le bon caractère disparaît","Nous sommes éprouvés par une époque où il n'y a ni les bonnes manières de l'islam, ni les mœurs de l'ignorance préislamique, ni la maîtrise de soi des gens d'honneur.","Abū Bakr al-Wāsiṭī, Muḥammad ibn Mūsā ibn al-Farghānī, vécut à Marw et mourut après 320 H. Il n'était pas un tābiʿī.","Parole historique, non un hadith prophétique. La Ḥilyah l'introduit par « il disait » sans chaîne propre à cette phrase. Ibn al-Jawzī transmet une variante avec mention explicite de l'audition ; aucune évaluation définitive de la chaîne n'est affirmée.","Ādāb désigne les bonnes manières, akhlāq les traits de caractère, aḥlām ici la maîtrise de soi et le discernement, et murūʾah l'honneur. Ibn al-Jawzī emploie akhlāq au lieu de aḥlām. Cette exhortation ne juge pas chaque personne de chaque époque.","Le mauvais caractère des autres ne justifie pas ta propre mauvaise conduite.",["Cette parole critique la perte des bonnes manières et du discernement.","C'est un hadith prophétique.","Ibn al-Jawzī transmet une variante avec mention explicite de l'audition.","Le mauvais caractère des autres ne justifie pas notre mauvaise conduite."]],"es":["Cuando se pierde el buen carácter","Hemos sido probados con una época en la que no existen ni los buenos modales del islam, ni la moral de la ignorancia preislámica, ni la prudencia de las personas de honor.","Abū Bakr al-Wāsiṭī, Muḥammad ibn Mūsā ibn al-Farghānī, vivió en Marw y falleció después del año 320 H. No fue un tābiʿī.","Dicho histórico, no un hadiz profético. La Ḥilyah lo introduce como 'solía decir', sin cadena propia para esta frase. Ibn al-Jawzī transmite una variante con declaraciones explícitas de audición; no se afirma una evaluación definitiva de la cadena.","Ādāb significa buenos modales, akhlāq rasgos del carácter, aḥlām aquí prudencia y dominio propio, y murūʾah honor. Ibn al-Jawzī dice akhlāq en lugar de aḥlām. Esta exhortación no juzga a todas las personas de todas las épocas.","El mal carácter ajeno no justifica tu propia mala conducta.",["El dicho critica la pérdida de buenos modales y prudencia.","Es un hadiz profético.","Ibn al-Jawzī transmite una variante con declaraciones explícitas de audición.","El mal carácter ajeno no justifica nuestra mala conducta."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر"],"en":["Language","Conte
