<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ihr betet mehr – und doch waren sie besser · Q69</title><link rel="canonical" href="https://dar-al-tawhid.de/lernen/ibn-masud-zuhd-dunya/"><link rel="stylesheet" href="/assets/learning-heritage.css?v=20261018a"><style>main{max-width:820px;margin:auto}section{border-top:1px solid #b39965;padding:18px 0}p{line-height:1.8;overflow-wrap:anywhere}h2,h3{line-height:1.35}select,button{font:inherit;padding:10px 14px;border:1px solid #a78e5f;border-radius:10px;max-width:100%}button{cursor:pointer}select{margin:12px 0} [dir=rtl][lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:1.35em} .quiz-button{margin:8px;min-width:100px}</style><style>body{background:#101b16;color:#f5ecd7;font:16px/1.6 system-ui}main{width:min(94%,740px);padding:20px}button{background:#dbc18b;color:#17251c}.quiz-button:disabled{opacity:.6}header{text-align:center}header img{width:66px}select{background:#203a2b;color:#fff}</style></head><body class="heritage-learning"><main><header><img src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><h1>DĀR AL TAWḤĪD</h1><p>by Serhat Abu Malik</p><h2 id="title">Ihr betet mehr – und doch waren sie besser</h2><label id="languageLabel" for="language">Sprache</label><select id="language"><option value="de">Deutsch</option><option value="ar">العربية الفصحى</option><option value="en">English</option><option value="tr">Türkçe</option><option value="ku">Kurmancî</option><option value="ckb">سۆرانی</option><option value="bs">Bosanski</option><option value="fr">Français</option><option value="es">Español</option></select><button id="back" type="button">Zur Quellenkarte</button></header><section id="quiz"><p id="progress"></p><h3 id="prompt"></h3><p id="question"></p><button class="quiz-button" id="yes"></button><button class="quiz-button" id="no"></button><p id="feedback" role="status"></p><button id="next" disabled></button></section><section id="result" hidden><h3 id="resultTitle"></h3><p id="score"></p><button id="again"></button></section></main><script type="application/json" id="data">{"loc":{"de":["Ihr betet mehr – und doch waren sie besser",["Ibn Masʿūd sagte, die Gefährten seien besser gewesen, obwohl die Angesprochenen mehr beteten und mehr fasteten.","Als Grund nannte er, dass die Gefährten mehr beteten als die Angesprochenen.","Die für al-Mustadrak Nr. 7880 gedruckte Kette endet bei ʿAbdullāh ibn Masʿūd; der Bericht ist mawqūf.","Hannād, az-Zuhd, Nr. 575 hat denselben Wortlaut wie al-Ḥākim Nr. 7880."],["Er stellte die Gefährten über die Angesprochenen, obwohl diese mehr beteten und mehr fasteten.","Den Grund nannte er bei der Enthaltsamkeit in der Dunyā und dem Verlangen nach der Āḫirah, nicht bei einem Mehr an Gebet.","Die gedruckte Kette von Nr. 7880 nennt ʿAbdullāh ibn Masʿūd. Der Bericht ist mawqūf.","Nr. 575 ergänzt den Dschihad und spricht von größerem Lohn. Das ist nicht der Wortlaut von Nr. 7880."]],"ar":["أنتم أكثر صلاة وكانوا خيرا منكم",["قال ابن مسعود إن الصحابة كانوا خيرا ممن خاطبهم مع أنهم أكثر صلاة وصياما.","جعل السبب أن الصحابة كانوا أكثر صلاة من المخاطبين.","إسناد المستدرك رقم ٧٨٨٠ ينتهي إلى عبد الله بن مسعود، فالأثر موقوف.","لفظ هناد في الزهد رقم ٥٧٥ مطابق للفظ الحاكم رقم ٧٨٨٠."],["فضّل الصحابة على المخاطبين مع كثرة صلاتهم وصيامهم.","ذكر السبب في الزهد في الدنيا والرغبة في الآخرة، لا في زيادة الصلاة.","سلسلة رقم ٧٨٨٠ تسمي عبد الله بن مسعود. والأثر موقوف.","رقم ٥٧٥ يزيد الجهاد وعبارة أعظم أجرا. وليس هذا لفظ رقم ٧٨٨٠."]],"en":["You pray more – yet they were better",["Ibn Masʿūd said the Companions were better, even though the people he addressed prayed and fasted more.","He gave as the reason that the Companions prayed more than the people he addressed.","The chain printed for al-Mustadrak no. 7880 ends with ʿAbdullāh ibn Masʿūd, so the report is mawqūf.","Hannād, al-Zuhd, no. 575 has the same wording as al-Ḥākim no. 7880."],["He placed the Companions above the people he addressed, although those people prayed and fasted more.","He named abstinence in the dunyā and desire for the ākhirah, not a greater amount of prayer.","The printed chain of no. 7880 names ʿAbdullāh ibn Masʿūd. The report is mawqūf.","No. 575 adds jihād and speaks of greater reward. That is not the wording of no. 7880."]],"tr":["Daha çok namaz kılıyorsunuz – onlar ise daha hayırlıydı",["İbn Mesʿûd, muhatapları daha çok namaz kılıp oruç tuttuğu hâlde ashâbın daha hayırlı olduğunu söyledi.","Sebebi, ashâbın muhataplardan daha çok namaz kılması olarak verdi.","el-Müstedrek nr. 7880’de basılan sened Abdullah ibn Mesʿûd’da biter; haber mevkuttur.","Hennâd, ez-Zühd, nr. 575, Hâkim nr. 7880 ile aynı lafızdadır."],["Muhatapları daha çok namaz kılıp oruç tuttuğu hâlde ashâbı onların üstünde tuttu.","Sebebi namazın çokluğu değil, dünyadaki zühd ve âhiret arzusu olarak andı.","7880’in basılan senedi Abdullah ibn Mesʿûd’u adlandırır. Haber mevkuttur.","575 cihadı ekler ve daha büyük ecirden söz eder. Bu, 7880’in lafzı değildir."]],"ku":["Hûn zêdetir nimêj dikin – lê ew çêtir bûn",["Îbn Mesûd got ku sahabe çêtir bûn, her çend yên ku jê re dihatin axaftin zêdetir nimêj dikirin û zêdetir rojî digirtin.","Wî sebeb ew da ku sahabe ji wan kesan zêdetir nimêj dikirin.","Zincîra çapkirî ya el-Mustedrek hejmar 7880 li Ebdullah ibn Mesûd diqede; xeber mewqûf e.","Hennad, ez-Zuhd, hejmar 575, heman lafzê Haqim hejmar 7880 ye."],["Wî sahabe li ser wan kesan danî, her çend ew zêdetir nimêj dikirin û rojî digirtin.","Wî sebeb zuhd di dunyayê de û xwestina axiretê da, ne zêdebûna nimêjê.","Zincîra çapkirî ya 7880 Ebdullah ibn Mesûd dinavîne. Xeber mewqûf e.","575 cihadê zêde dike û behsa ecirê mezintir dike. Ev ne lafzê 7880 ye."]],"ckb":["ئێوە زیاتر نوێژ دەکەن – کەچی ئەوان باشتر بوون",["ئیبن مەسعوود گوتی هاوەڵان باشتر بوون، ئەگەرچی ئەوانەی قسەیان بۆ دەکرا زیاتر نوێژیان دەکرد و زیاتر ڕۆژوویان دەگرت.","هۆکارەکەی ئەوە بوو کە هاوەڵان لەو کەسانە زیاتر نوێژیان دەکرد.","زنجیرەی چاپکراوی مستەدرەک ژمارە ٧٨٨٠ لە عەبدوڵڵای کوڕی مەسعوود کۆتایی دێت؛ هەواڵەکە مەوقووفە.","هەنناد، زوهد، ژمارە ٥٧٥، هەمان دەقی حاکم ژمارە ٧٨٨٠ ـە."],["هاوەڵانی لە سەرووی ئەو کەسانە دانا، ئەگەرچی ئەوان زیاتر نوێژ و ڕۆژوویان هەبوو.","هۆکارەکەی زوهد لە دونیا و ئارەزووی ئاخرەت بوو، نەک زۆری نوێژ.","زنجیرەی چاپکراوی ٧٨٨٠ عەبدوڵڵای کوڕی مەسعوود دەهێنێت. هەواڵەکە مەوقووفە.","٥٧٥ جیهاد زیاد دەکات و باس لە پاداشتی گەورەتر دەکات. ئەمە دەقی ٧٨٨٠ نییە."]],"bs":["Više klanjate – a oni su bili bolji",["Ibn Mesʿud je rekao da su ashabi bili bolji, iako su oni kojima se obratio više klanjali i više postili.","Kao razlog je naveo da su ashabi više klanjali od onih kojima se obratio.","Lanac odštampan za el-Mustedrek br. 7880 završava na Abdullahu ibn Mesʿudu; predaja je mevkuf.","Hennad, ez-Zuhd, br. 575 ima isti tekst kao Hakim br. 7880."],["Ashabe je stavio iznad onih kojima se obratio, iako su oni više klanjali i postili.","Razlog je naveo u uzdržanosti u dunjaluku i žudnji za ahiretom, ne u većem broju namaza.","Odštampani lanac br. 7880 imenuje Abdullaha ibn Mesʿuda. Predaja je mevkuf.","Broj 575 dodaje džihad i govori o većoj nagradi. To nije tekst br. 7880."]],"fr":["Vous priez davantage – et pourtant ils étaient meilleurs",["Ibn Masʿūd a dit que les Compagnons étaient meilleurs, bien que les gens à qui il parlait prient et jeûnent davantage.","Il a donné pour raison que les Compagnons priaient davantage que les gens à qui il parlait.","La chaîne imprimée pour al-Mustadrak n° 7880 s’arrête à ʿAbdullāh ibn Masʿūd ; le récit est mawqūf.","Hannād, al-Zuhd, n° 575 a le même libellé qu’al-Ḥākim n° 7880."],["Il a placé les Compagnons au-dessus des gens à qui il parlait, bien que ceux-ci prient et jeûnent davantage.","Il a nommé l’abstinence dans la dunyā et le désir de l’ākhirah, non un surplus de prière.","La chaîne imprimée du n° 7880 nomme ʿAbdullāh ibn Masʿūd. Le récit est mawqūf.","Le n° 575 ajoute le jihād et parle d’une récompense plus grande. Ce n’est pas le libellé du n° 7880."]],"es":["Rezáis más – y sin embargo ellos eran mejores",["Ibn Masʿūd dijo que los Compañeros eran mejores, aunque las personas a las que hablaba rezaban y ayunaban más.","Dio como razón que los Compañeros rezaban más que las personas a las que hablaba.","La cadena impresa de al-Mustadrak n.º 7880 termina en ʿAbdullāh ibn Masʿūd; el relato es mawqūf.","Hannād, al-Zuhd, n.º 575 tiene el mismo texto que al-Ḥākim n.º 7880."],["Puso a los Compañeros por encima de las personas a las que hablaba, aunque ellas rezaban y ayunaban más.","Nombró la abstinencia en la dunyā y el anhelo de la ākhirah, no un exceso de oración.","La cadena impresa del n.º 7880 nombra a ʿAbdullāh ibn Masʿūd. El relato es mawqūf.","El n.º 575 añade el yihād y habla de una recompensa mayor. Ese no es el texto del n.º 7880."]]},"ui":{"de":["Sprache","Kontext","Wortlaut","Arabischer Originaltext","Überlieferungskette","Bewertung","Einordnung","Fazit","Originalnachweise","Wissen vertiefen","Richtig","Falsch","Nächste Frage","Ergebnis","Erneut lernen","Zur Quellenkarte","Aussage prüfen","Korrekte Antwort","Quelle","Kein verifizierter PDF-Seitenanker verfügbar.","al-Mustadrak 7880","Hannād 575"],"ar":["اللغة","السياق","النص","النص العربي","الإسناد","الحكم","البيان","الخلاصة","المصادر الأصلية","تعميق المعرفة","صحيح","خطأ","السؤال التالي","النتيجة","أعد التعلم","إلى المصدر","تحقق من العبارة","الإجابة الصحيحة","المصدر","لا يتوفر رابط صفحة PDF متحقق منه.","المستدرك ٧٨٨٠","الزهد لهناد ٥٧٥"],"en":["Language","Context","Wording","Arabic original","Chain","Grading","Explanation","Conclusion","Original evidence","Learn more","True","False","Next question","Result","Try again","Back to source","Check the statement","Correct answer","Source","No verified PDF page anchor is available.","al-Mustadrak 7880","Hannād 575"],"tr":["Dil","Bağlam","Metin","Arapça asıl","İsnad","Derece","Açıklama","Sonuç","Asıl kaynaklar","Bilgiyi pekiştir","Doğru","Yanlış","Sonraki soru","Sonuç","Tekrar öğren","Kaynağa dön","İfadeyi değerlendi
