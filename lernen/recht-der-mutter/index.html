<body class="heritage-learning">
<main><header><img class="logo" src="/watermark-my-logo-full.png" alt="DĀR AL TAWḤĪD"><div class="brand">DĀR AL TAWḤĪD</div><p class="sign">by Serhat Abu Malik</p><p class="kicker">Lernbereich · 4 Fragen</p><h1>DIE RECHTE DER MUTTER</h1></header>
<section class="card" id="quiz" aria-live="polite"><div class="progress"><span id="count"></span><span id="score"></span></div><h2 id="question"></h2><div id="options" class="options"></div><p id="feedback" class="feedback" role="status"></p><button id="next" class="next" type="button" disabled>Nächste Frage</button></section>

</main><script>
(()=>{"use strict";const questions=[{"q":"Welche Tat hob Ibn ʿAbbās besonders hervor?","a":["Gutes gegenüber der Mutter tun","Viel Besitz sammeln","Den Vater grundsätzlich ignorieren","Nur öffentlich Gutes tun"],"correct":0,"why":"Ibn ʿAbbās betonte den besonderen Rang des Wohltuns an der Mutter."},{"q":"Wie oft nannte der Prophet ﷺ in der überlieferten Antwort zuerst die Mutter?","a":["Einmal","Zweimal","Dreimal","Fünfmal"],"correct":2,"why":"Der Prophet ﷺ sagte dreimal „Deine Mutter“ und anschließend „Dann dein Vater“."},{"q":"Welche drei besonderen Mühen hob Ibn Baṭṭāl in seiner Erklärung hervor?","a":["Reisen, Handel und Bau","Schwangerschaft, Geburt und Stillzeit","Kochen, Schreiben und Lesen","Anbau, Ernte und Lagerung"],"correct":1,"why":"Er nannte Schwangerschaft, Geburt und Stillzeit und erwähnte anschließend die gemeinsame Erziehung."},{"q":"Wie sollen die Rechte von Mutter und Vater behandelt werden?","a":["Das Recht des Vaters entfällt","Nur ein Elternteil besitzt Rechte","Beide Eltern haben Rechte, die nach Möglichkeit erfüllt werden müssen","Es sind keine Elternrechte zu beachten"],"correct":2,"why":"Die Quellen betonen den besonderen Vorrang der Mutter, ohne das Recht des Vaters aufzuheben."}];
let index=0,points=0,answered=false;const el=id=>document.getElementById(id),quiz=el("quiz"),result=el("result");
function render(){answered=false;const q=questions[index];el("count").textContent="Frage "+(index+1)+" von "+questions.length;el("score").textContent=points+" richtig";el("question").textContent=q.q;el("feedback").textContent="";el("next").disabled=true;el("next").textContent=index===questions.length-1?"Ergebnis anzeigen":"Nächste Frage";const box=el("options");box.replaceChildren();q.a.forEach((answer,n)=>{const b=document.createElement("button");b.type="button";b.className="option";b.textContent=String.fromCharCode(65+n)+". "+answer;b.addEventListener("click",()=>{if(answered)return;answered=true;if(n===q.correct)points++;box.querySelectorAll("button").forEach((x,i)=>{x.disabled=true;if(i===q.correct)x.dataset.state="right";else if(i===n)x.dataset.state="wrong"});el("feedback").textContent=(n===q.correct?"Richtig. ":"Noch nicht richtig. ")+q.why;el("score").textContent=points+" richtig";el("next").disabled=false});box.appendChild(b)})}
el("next").addEventListener("click",()=>{if(!answered)return;if(index<questions.length-1){index++;render()}else{quiz.hidden=true;result.hidden=false;el("final").textContent=points+" von "+questions.length+" Fragen richtig beantwortet."}});
el("retry").addEventListener("click",()=>{index=0;points=0;result.hidden=true;quiz.hidden=false;render()});render()})();
