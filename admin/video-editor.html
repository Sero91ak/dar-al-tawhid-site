<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DAR Admin · Touch-Videoeditor</title>
<link rel="stylesheet" href="/assets/fonts/feed-fonts.css">
<link rel="stylesheet" href="/admin/video-editor.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button type="button" class="ghost" id="btnBack">Zurück</button>
    <input class="name" id="projName" aria-label="Projektname" value="DAR Video">
    <span class="chip" id="modeChip">Schnell</span>
    <span class="chip" id="durChip">15s</span>
    <span class="chip" id="saveChip">—</span>
    <button type="button" id="btnUndo" title="Rückgängig">↶</button>
    <button type="button" id="btnRedo" title="Wiederholen">↷</button>
    <button type="button" id="btnSave">Speichern</button>
    <button type="button" id="btnPreview">Vorschau</button>
    <button type="button" id="btnCheck">Prüfen</button>
    <button type="button" class="primary" id="btnExport">Export</button>
  </header>

  <aside class="layers" id="layers"></aside>

  <main class="workspace" id="workspace">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-bg" id="stageBg"></div>
      <div class="stage-dim" id="stageDim"></div>
      <div class="guides" id="guides"><i class="v"></i><i class="h"></i></div>
      <div class="safe" id="safe"></div>
      <div id="stage" style="position:absolute;inset:0"></div>
    </div>
  </main>

  <aside class="props" id="props"></aside>

  <section class="timeline">
    <div class="tl-head">
      <button type="button" id="btnPlay">▶</button>
      <span id="tlTime">0.0 / 15.0s</span>
      <button type="button" class="ghost" id="btnGuides">Hilfslinien</button>
      <button type="button" class="ghost" id="btnSafe">Safe Area</button>
      <button type="button" class="ghost" id="btnMode">Schnell/Profi</button>
    </div>
    <div style="overflow:auto">
      <div class="tl-track" id="tlTrack"></div>
    </div>
  </section>

  <nav class="tools">
    <div class="tool-scroll">
      <button type="button" id="btnText">Text</button>
      <button type="button" id="btnStyle">Schrift</button>
      <button type="button" id="btnTime">Zeit & Dauer</button>
      <button type="button" onclick="document.getElementById('btnCheck').click()">Prüfen</button>
      <button type="button" class="primary" onclick="document.getElementById('btnExport').click()">Export</button>
    </div>
    <div class="notice" id="notice">Lade Projekt…</div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <h3 id="sheetTitle">Bearbeiten</h3>
    <button type="button" class="ghost" id="sheetClose">Schließen</button>
  </div>
  <div id="sheetBody"></div>
</div>

<script src="/admin/video-editor.js"></script>
</body>
</html>
